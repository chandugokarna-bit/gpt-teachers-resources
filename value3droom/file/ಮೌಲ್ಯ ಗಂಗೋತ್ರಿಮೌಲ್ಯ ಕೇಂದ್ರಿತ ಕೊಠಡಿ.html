<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ಮೌಲ್ಯ ಗಂಗೋತ್ರಿ: ಮೌಲ್ಯ ಶಿಕ್ಷಣದ ಭವ್ಯ ವರ್ಚುವಲ್ ಕೊಠಡಿ</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #030206; font-family: 'Segoe UI', sans-serif; color: #fff; }
        #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
        
        /* UI ಲೇಯರ್ - ರೀಸೆಟ್ ಬಟನ್ */
        .ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; display: flex; flex-direction: column; justify-content: flex-end; padding: 25px; }
        .interactive { pointer-events: auto; }
        .nav-btn { background: rgba(255, 215, 0, 0.15); border: 1px solid #ffd700; color: #ffd700; padding: 10px 22px; border-radius: 25px; cursor: pointer; font-weight: bold; transition: 0.3s; backdrop-filter: blur(5px); }
        .nav-btn:hover { background: #ffd700; color: #000; transform: scale(1.05); box-shadow: 0 0 15px rgba(255, 215, 0, 0.4); }
        
        /* 🎯 ಸಿನಿಮಾಟಿಕ್ 3.5 ಸೆಕೆಂಡ್ ಇಂಟ್ರೋ */
        #loader { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: radial-gradient(circle, #181124 0%, #030206 100%); 
            z-index: 1000; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            transition: opacity 0.8s ease-in-out; 
        }
        .intro-headline {
            font-size: 46px;
            font-weight: 900;
            text-align: center;
            max-width: 950px;
            padding: 0 20px;
            line-height: 1.5;
            background: linear-gradient(45deg, #ffd700, #ff8c00, #00ffcc, #ffd700);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientMove 4s ease infinite, scaleUp 1.5s ease-out forwards;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .intro-sub {
            margin-top: 20px;
            font-size: 14px;
            color: #8c73a6;
            letter-spacing: 6px;
            animation: fadeIn 2s ease-in forwards;
        }
        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        @keyframes scaleUp {
            0% { transform: scale(0.88); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        @keyframes fadeIn {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <!-- ಸಿನಿಮಾಟಿಕ್ ಇಂಟ್ರೋ ಸ್ಕ್ರೀನ್ -->
    <div id="loader">
        <h1 class="intro-headline">ಮೌಲ್ಯ ಶಿಕ್ಷಣದ ಭವ್ಯ ವರ್ಚುವಲ್ ಕೊಠಡಿ</h1>
        <p class="intro-sub">VALUE EDUCATION • 3D IMMERSIVE EXPERIENCE</p>
    </div>

    <div id="canvas-container"></div>

    <div class="ui-layer">
        <footer class="interactive" style="display: flex; justify-content: flex-end; width: 100%;">
            <button class="nav-btn" onclick="resetView()">Reset View</button>
        </footer>
    </div>

    <script>
        let scene, camera, renderer, controls, raycaster, mouse;
        const container = document.getElementById('canvas-container');
        const clickableObjects = [];

        let targetLookAt = new THREE.Vector3(0, 0, 0);
        let targetCameraPos = new THREE.Vector3(0, 0, 1.5);
        let isFocused = false;

        // ಬ್ಯಾಕಪ್ ಬಣ್ಣಗಳು
        const colors = [
            0xffd700, 0xff8c00, 0x00ffcc, 0x9b59b6, 0xe74c3c, 0x2ecc71, 0x3498db
        ];

        // 🎯 ನಿಮ್ಮ ಗಿಟ್‌ಹಬ್‌ನ ನಿಖರ ಪಾತ್
        const baseUrl = "https://raw.githubusercontent.com/chandugokarna-bit/gpt-teachers-resources/main/value3droom/wall/"; 

        // ನಿಮ್ಮ ಇಮೇಜಿನಲ್ಲಿರುವ ಏಳು ಫೈಲ್‌ಗಳ ನಿಖರ ಹೆಸರುಗಳು
        const imagesList = [
            baseUrl + "value.jpg",        // 0 - ಮುಖ್ಯ ಮೌಲ್ಯ (ಮಧ್ಯದಲ್ಲಿ)
            baseUrl + "affirmation.jpg",  // 1
            baseUrl + "feeling.jpg",      // 2
            baseUrl + "greatitude.jpg",   // 3
            baseUrl + "identity.jpg",     // 4
            baseUrl + "kindness.jpg",     // 5
            baseUrl + "strenghth.jpg"     // 6
        ];

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x030206);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.copy(targetCameraPos); 

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.07;
            controls.maxDistance = 24;
            controls.minDistance = 0.5;

            scene.add(new THREE.AmbientLight(0xffffff, 0.95));
            
            // 3D ಕೊಠಡಿ
            const roomWidth = 32, roomHeight = 12, roomDepth = 32;
            const roomGeo = new THREE.BoxGeometry(roomWidth, roomHeight, roomDepth);
            const wallMat = new THREE.MeshStandardMaterial({ color: 0x080510, side: THREE.BackSide });
            const room = new THREE.Mesh(roomGeo, wallMat);
            scene.add(room);

            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            const wallX = (roomWidth / 2) - 0.05; 
            const wallZ = (roomDepth / 2) - 0.05; 

            // 🎯 ೭ ಬೋರ್ಡ್‌ಗಳ ಸುಂದರ 3D ಲೇಔಟ್ (ಮುಂಭಾಗದಲ್ಲಿ 'value.jpg' ಇರಲಿದೆ)
            const galleryLayout = [
                // Front Wall (ಮುಂಭಾಗ)
                { id: 0, url: imagesList[0], w: 7.5, h: 5.2, pos: [0, 0.5, -wallZ], rot: [0, 0, 0], normal: [0, 0, 1] },
                
                // Left Wall (ಎಡ ಗೋಡೆ - 2 ಬೋರ್ಡ್‌ಗಳು)
                { id: 1, url: imagesList[1], w: 7.0, h: 5.0, pos: [-wallX, 0.5, -6], rot: [0, Math.PI/2, 0], normal: [1, 0, 0] },
                { id: 2, url: imagesList[2], w: 7.0, h: 5.0, pos: [-wallX, 0.5, 6], rot: [0, Math.PI/2, 0], normal: [1, 0, 0] },
                
                // Back Wall (ಹಿಂಭಾಗ - 2 ಬೋರ್ಡ್‌ಗಳು)
                { id: 3, url: imagesList[3], w: 7.0, h: 5.0, pos: [-6, 0.5, wallZ], rot: [0, Math.PI, 0], normal: [0, 0, -1] },
                { id: 4, url: imagesList[4], w: 7.0, h: 5.0, pos: [6, 0.5, wallZ], rot: [0, Math.PI, 0], normal: [0, 0, -1] },
                
                // Right Wall (ಬಲ ಗೋಡೆ - 2 ಬೋರ್ಡ್‌ಗಳು)
                { id: 5, url: imagesList[5], w: 7.0, h: 5.0, pos: [wallX, 0.5, 6], rot: [0, -Math.PI/2, 0], normal: [-1, 0, 0] },
                { id: 6, url: imagesList[6], w: 7.0, h: 5.0, pos: [wallX, 0.5, -6], rot: [0, -Math.PI/2, 0], normal: [-1, 0, 0] }
            ];

            const textureLoader = new THREE.TextureLoader();

            galleryLayout.forEach((art, index) => {
                textureLoader.load(art.url, 
                    function(texture) {
                        createArtwork(art.id, texture, null, art.w, art.h, new THREE.Vector3(...art.pos), new THREE.Vector3(...art.rot), new THREE.Vector3(...art.normal));
                    },
                    undefined,
                    function(err) {
                        createArtwork(art.id, null, colors[index], art.w, art.h, new THREE.Vector3(...art.pos), new THREE.Vector3(...art.rot), new THREE.Vector3(...art.normal));
                    }
                );
            });

            // 3.5 ಸೆಕೆಂಡ್ ಇಂಟ್ರೋ ಸೇಫ್ ಗಾರ್ಡ್
            setTimeout(() => { 
                const loader = document.getElementById('loader');
                if(loader) {
                    loader.style.opacity = 0;
                    setTimeout(() => { loader.style.display = 'none'; }, 800);
                }
            }, 3500);

            let startX, startY;
            renderer.domElement.addEventListener('pointerdown', (e) => { startX = e.clientX; startY = e.clientY; });
            renderer.domElement.addEventListener('pointerup', (e) => {
                if (Math.abs(e.clientX - startX) < 5 && Math.abs(e.clientY - startY) < 5) {
                    checkIntersection(e);
                }
            });

            window.addEventListener('resize', onWindowResize, false);
        }

        function createArtwork(id, texture, fallbackColor, width, height, position, rotation, normal) {
            const group = new THREE.Group();
            const artGeo = new THREE.PlaneGeometry(width, height);
            
            let artMat = texture 
                ? new THREE.MeshStandardMaterial({ map: texture, roughness: 0.15, side: THREE.DoubleSide })
                : new THREE.MeshStandardMaterial({ color: fallbackColor, roughness: 0.4, side: THREE.DoubleSide });
            
            const artMesh = new THREE.Mesh(artGeo, artMat);
            
            // ಕ್ರಾಪ್ ಆಗದಂತೆ ತಡೆಯುವ ಕರಾರುವಕ್ಕಾದ 1.02 ಫೋಕಸ್ ಫಾರ್ಮುಲಾ
            const vFOV = (camera.fov * Math.PI) / 180;
            let distanceForHeight = (height / 2) / Math.tan(vFOV / 2);
            
            const aspect = window.innerWidth / window.innerHeight;
            let distanceForWidth = (width / 2) / Math.tan((camera.fov * aspect * Math.PI) / 360);
            
            let distance = Math.max(distanceForHeight, distanceForWidth) * 1.02; 

            const camPos = position.clone().add(normal.clone().multiplyScalar(distance));

            artMesh.userData = { dynastyId: id, position: position.clone(), cameraPos: camPos };
            clickableObjects.push(artMesh); 
            group.add(artMesh);

            // ಗೋಲ್ಡನ್ ನಯನ್ ಬಾರ್ಡರ್
            const frameGeo = new THREE.PlaneGeometry(width + 0.04, height + 0.04);
            const frameMat = new THREE.MeshBasicMaterial({ color: 0xffd700, wireframe: true, side: THREE.DoubleSide });
            const frameMesh = new THREE.Mesh(frameGeo, frameMat);
            frameMesh.position.z = -0.003;
            group.add(frameMesh);

            group.position.copy(position);
            group.rotation.set(rotation.x, rotation.y, rotation.z);
            scene.add(group);
        }

        function checkIntersection(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(clickableObjects, true);

            if (intersects.length > 0) {
                const clickedMesh = intersects[0].object;
                if(clickedMesh.userData && clickedMesh.userData.dynastyId !== undefined) {
                    targetLookAt.copy(clickedMesh.userData.position);
                    targetCameraPos.copy(clickedMesh.userData.cameraPos);
                    isFocused = true;
                }
            } else {
                resetView();
            }
        }

        function resetView() {
            targetLookAt.set(0, 0, 0); 
            targetCameraPos.set(0, 0, 1.5);
            isFocused = false;
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.target.lerp(targetLookAt, 0.08);
            if (isFocused) {
                camera.position.lerp(targetCameraPos, 0.08);
            }
            controls.update();
            renderer.render(scene, camera);
        }

        init();
        animate();
    </script>
</body>
</html>
