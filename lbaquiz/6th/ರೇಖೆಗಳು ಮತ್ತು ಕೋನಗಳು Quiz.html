<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>6ನೇ ತರಗತಿ ಗಣಿತ - ಘಟಕ 2 ಕ್ವಿಜ್</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Kannada:wght@400;700&display=swap');
        body {
            font-family: 'Noto Sans Kannada', sans-serif;
            background-color: #f0fdf4;
        }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-3xl mx-auto bg-white rounded-xl shadow-lg overflow-hidden">
        <div class="bg-green-600 p-6 text-white text-center">
            <h1 class="text-2xl font-bold">ಘಟಕ - 2: ರೇಖೆಗಳು ಮತ್ತು ಕೋನಗಳು</h1>
            <p class="mt-2">ಪಠ್ಯಪುಸ್ತಕ ಆಧಾರಿತ ಇಂಟರಾಕ್ಟಿವ್ ರಸಪ್ರಶ್ನೆ</p>
        </div>

        <div id="quiz-container" class="p-6">
            <!-- Progress Bar -->
            <div class="w-full bg-gray-200 rounded-full h-2.5 mb-6">
                <div id="progress" class="bg-green-500 h-2.5 rounded-full" style="width: 0%"></div>
            </div>

            <div id="question-box" class="mb-8">
                <h2 id="question-text" class="text-xl font-semibold text-gray-800 mb-4">ಪ್ರಶ್ನೆ ಇಲ್ಲಿ ಮೂಡಲಿದೆ...</h2>
                <div id="options" class="space-y-3">
                    <!-- Options generated by JS -->
                </div>
            </div>

            <div class="flex justify-between items-center">
                <p id="score-tracker" class="text-gray-600 font-medium">ಅಂಕಗಳು: 0 / 20</p>
                <button id="next-btn" onclick="nextQuestion()" class="hidden bg-green-600 hover:bg-green-700 text-white px-6 py-2 rounded-lg font-bold transition">ಮುಂದಿನ ಪ್ರಶ್ನೆ</button>
            </div>
        </div>

        <div id="result-container" class="hidden p-8 text-center">
            <h2 class="text-3xl font-bold text-green-700 mb-4">ಅಭಿನಂದನೆಗಳು!</h2>
            <p id="final-score" class="text-xl mb-6 font-semibold"></p>
            <button onclick="location.reload()" class="bg-blue-600 hover:bg-blue-700 text-white px-8 py-3 rounded-xl font-bold transition">ಮತ್ತೊಮ್ಮೆ ಪ್ರಯತ್ನಿಸಿ</button>
        </div>
    </div>

    <script>
        const quizData = [
            {
                q: "ಒಂದು ಸ್ಥಾನವನ್ನು ನಿರ್ಧರಿಸುವ ಜ್ಯಾಮಿತೀಯ ಆಕೃತಿ ಯಾವುದು?",
                a: ["ಕಿರಣ", "ರೇಖಾಖಂಡ", "ಬಿಂದು", "ಕೋನ"],
                correct: 2
            },
            {
                q: "ನಿರ್ದಿಷ್ಟ ಉದ್ದವನ್ನು ಹೊಂದಿರುವ ರೇಖೆಯ ಭಾಗವನ್ನು ಏನೆನ್ನುತ್ತಾರೆ?",
                a: ["ಕಿರಣ", "ರೇಖಾಖಂಡ", "ಸರಳರೇಖೆ", "ಕೋನ"],
                correct: 1
            },
            {
                q: "ಒಂದು ಕಡೆ ಅಂತ್ಯಗೊಂಡು ಇನ್ನೊಂದು ಕಡೆ ಅನಂತವಾಗಿ ಸಾಗುವ ರೇಖೆ ಯಾವುದು?",
                a: ["ಬಿಂದು", "ರೇಖಾಖಂಡ", "ಕಿರಣ", "ವೃತ್ತ"],
                correct: 2
            },
            {
                q: "ಸಾಮಾನ್ಯ ಆರಂಭಿಕ ಬಿಂದುವನ್ನು ಹೊಂದಿರುವ ಎರಡು ಕಿರಣಗಳಿಂದ ಉಂಟಾಗುವ ಆಕೃತಿ ಯಾವುದು?",
                a: ["ತ್ರಿಭುಜ", "ವೃತ್ತ", "ಕೋನ", "ಚೌಕ"],
                correct: 2
            },
            {
                q: "ಒಂದು ಪೂರ್ಣ ತಿರುವಿನ ಅಳತೆ ಎಷ್ಟು ಡಿಗ್ರಿ ಇರುತ್ತದೆ?",
                a: ["90°", "180°", "270°", "360°"],
                correct: 3
            },
            {
                q: "90° ಗಿಂತ ಕಡಿಮೆ ಅಳತೆ ಇರುವ ಕೋನವನ್ನು ಏನೆಂದು ಕರೆಯುತ್ತಾರೆ?",
                a: ["ಲಘುಕೋನ", "ಲಂಬಕೋನ", "ವಿಶಾಲಕೋನ", "ಸರಳಕೋನ"],
                correct: 0
            },
            {
                q: "ಸರಿಯಾಗಿ 90° ಅಳತೆ ಇರುವ ಕೋನಕ್ಕೆ ಈ ಹೆಸರಿದೆ:",
                a: ["ವಿಶಾಲಕೋನ", "ಲಂಬಕೋನ", "ಲಘುಕೋನ", "ಪೂರ್ಣಕೋನ"],
                correct: 1
            },
            {
                q: "90° ಗಿಂತ ಹೆಚ್ಚು ಮತ್ತು 180° ಗಿಂತ ಕಡಿಮೆ ಇರುವ ಕೋನ ಯಾವುದು?",
                a: ["ಸರಳಕೋನ", "ಸರಳಾಧಿಕಕೋನ", "ವಿಶಾಲಕೋನ", "ಲಘುಕೋನ"],
                correct: 2
            },
            {
                q: "ಸರಿಯಾಗಿ 180° ಅಳತೆ ಇರುವ ಕೋನವನ್ನು ಏನೆಂದು ಕರೆಯುತ್ತಾರೆ?",
                a: ["ಸರಳಕೋನ", "ಲಂಬಕೋನ", "ಪೂರ್ಣಕೋನ", "ಶೂನ್ಯಕೋನ"],
                correct: 0
            },
            {
                q: "180° ಗಿಂತ ಹೆಚ್ಚು ಮತ್ತು 360° ಗಿಂತ ಕಡಿಮೆ ಇರುವ ಕೋನ ಯಾವುದು?",
                a: ["ವಿಶಾಲಕೋನ", "ಲಘುಕೋನ", "ಸರಳಾಧಿಕ ಕೋನ", "ಲಂಬಕೋನ"],
                correct: 2
            },
            {
                q: "ಕೋನಗಳನ್ನು ಅಳೆಯಲು ಬಳಸುವ ಸಾಧನ ಯಾವುದು?",
                a: ["ಅಳತೆ ಪಟ್ಟಿ", "ಕೈವಾರ", "ಕೋನಮಾಪಕ", "ಕವಲು ಕೈವಾರ"],
                correct: 2
            },
            {
                q: "ಕೋನಗಳನ್ನು ಅಳೆಯುವ ಮೂಲ ಮಾನ ಯಾವುದು?",
                a: ["ಸೆಂಟಿಮೀಟರ್", "ಡಿಗ್ರಿ", "ಮೀಟರ್", "ಕಿಲೋಮೀಟರ್"],
                correct: 1
            },
            {
                q: "ಒಂದು ಸರಳಕೋನದಲ್ಲಿ ಎಷ್ಟು ಲಂಬಕೋನಗಳಿರುತ್ತವೆ?",
                a: ["1", "2", "3", "4"],
                correct: 1
            },
            {
                q: "ಗಡಿಯಾರದಲ್ಲಿ 3 ಗಂಟೆಯಾದಾಗ ಮುಳ್ಳುಗಳ ನಡುವಿನ ಕೋನ ಎಷ್ಟು?",
                a: ["45°", "90°", "180°", "120°"],
                correct: 1
            },
            {
                q: "ಗಡಿಯಾರದಲ್ಲಿ 6 ಗಂಟೆಯಾದಾಗ ಮುಳ್ಳುಗಳು ಯಾವ ಕೋನವನ್ನು ಉಂಟುಮಾಡುತ್ತವೆ?",
                a: ["ಲಂಬಕೋನ", "ವಿಶಾಲಕೋನ", "ಸರಳಕೋನ", "ಲಘುಕೋನ"],
                correct: 2
            },
            {
                q: "ಕೋನವನ್ನು ಎರಡು ಸಮ ಭಾಗಗಳಾಗಿ ವಿಭಾಗಿಸುವ ರೇಖೆಯನ್ನು ಏನೆನ್ನುತ್ತಾರೆ?",
                a: ["ಸರಳರೇಖೆ", "ಕೋನಾರ್ಧಕ ರೇಖೆ", "ಕಿರಣ", "ಕರ್ಣ"],
                correct: 1
            },
            {
                q: "ಒಂದು ಪೂರ್ಣಕೋನದಲ್ಲಿ ಎಷ್ಟು ಲಂಬಕೋನಗಳಿರುತ್ತವೆ?",
                a: ["2", "3", "4", "5"],
                correct: 2
            },
            {
                q: "ಕಿರಣಕ್ಕೆ ಎಷ್ಟು ಅಂತ್ಯ ಬಿಂದುಗಳಿರುತ್ತವೆ?",
                a: ["1", "2", "ಯಾವುದೂ ಇಲ್ಲ", "3"],
                correct: 0
            },
            {
                q: "ಸರಳರೇಖೆಯು ನಿರ್ದಿಷ್ಟ ಅಳತೆಯನ್ನು ಹೊಂದಿರುತ್ತದೆಯೇ?",
                a: ["ಹೌದು", "ಇಲ್ಲ", "ಕೆಲವೊಮ್ಮೆ ಮಾತ್ರ", "ಹೇಳಲು ಸಾಧ್ಯವಿಲ್ಲ"],
                correct: 1
            },
            {
                q: "ಕೋನಮಾಪಕದ ಮೇಲೆ ಎಷ್ಟು ಸಂಖ್ಯೆಗಳ ಗಣಗಳಿರುತ್ತವೆ?",
                a: ["ಒಂದು", "ಎರಡು", "ಮೂರು", "ನಾಲ್ಕು"],
                correct: 1
            }
        ];

        let currentQuestion = 0;
        let score = 0;
        let answered = false;

        function loadQuestion() {
            const q = quizData[currentQuestion];
            document.getElementById('question-text').innerText = `${currentQuestion + 1}. ${q.q}`;
            const optionsDiv = document.getElementById('options');
            optionsDiv.innerHTML = '';
            
            q.a.forEach((option, index) => {
                const btn = document.createElement('button');
                btn.innerText = option;
                btn.className = "w-full text-left p-4 border-2 border-gray-200 rounded-xl hover:bg-gray-50 hover:border-green-500 transition duration-200 font-medium";
                btn.onclick = () => checkAnswer(index, btn);
                optionsDiv.appendChild(btn);
            });

            document.getElementById('next-btn').classList.add('hidden');
            document.getElementById('progress').style.width = `${(currentQuestion / quizData.length) * 100}%`;
            answered = false;
        }

        function checkAnswer(idx, btn) {
            if(answered) return;
            answered = true;

            const correctIdx = quizData[currentQuestion].correct;
            const options = document.getElementById('options').children;

            if(idx === correctIdx) {
                btn.classList.add('bg-green-100', 'border-green-500', 'text-green-700');
                score++;
            } else {
                btn.classList.add('bg-red-100', 'border-red-500', 'text-red-700');
                options[correctIdx].classList.add('bg-green-100', 'border-green-500');
            }

            document.getElementById('score-tracker').innerText = `ಅಂಕಗಳು: ${score} / ${quizData.length}`;
            document.getElementById('next-btn').classList.remove('hidden');
        }

        function nextQuestion() {
            currentQuestion++;
            if(currentQuestion < quizData.length) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            document.getElementById('quiz-container').classList.add('hidden');
            document.getElementById('result-container').classList.remove('hidden');
            document.getElementById('final-score').innerText = `ನೀವು 20 ಪ್ರಶ್ನೆಗಳಲ್ಲಿ ${score} ಅಂಕಗಳನ್ನು ಗಳಿಸಿದ್ದೀರಿ!`;
        }

        loadQuestion();
    </script>
</body>
</html>
