<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>೬ನೇ ತರಗತಿ ಸಮಾಜ ವಿಜ್ಞಾನ - ಅಧ್ಯಾಯ ೪</title>
    <style>
        :root {
            --primary-color: #ff8c00; /* ಡಾರ್ಕ್ ಆರೆಂಜ್ */
            --secondary-color: #d97706; /* ಗೋಲ್ಡನ್ ಬ್ರೌನ್ */
            --accent-color: #7c2d12; /* ಡಾರ್ಕ್ ರೆಡ್-ಬ್ರೌನ್ */
            --background-gradient: linear-gradient(135deg, #ffedd5 0%, #f97316 100%);
            --card-bg: rgba(255, 255, 255, 0.96);
            --text-color: #1f2937;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        body {
            background: var(--background-gradient);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .quiz-container {
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.25);
            width: 100%;
            max-width: 700px;
            padding: 30px;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(10px);
            border: 3px solid var(--primary-color);
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 2px solid #fed7aa;
            padding-bottom: 15px;
        }

        .header h1 {
            color: var(--accent-color);
            font-size: 1.8rem;
            margin-bottom: 5px;
        }

        .header h2 {
            color: var(--primary-color);
            font-size: 1.1rem;
        }

        .progress-bar-container {
            width: 100%;
            height: 10px;
            background-color: #fed7aa;
            border-radius: 5px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #f97316, #7c2d12);
            transition: width 0.3s ease;
        }

        .question-box {
            margin-bottom: 20px;
        }

        .question-number {
            font-weight: bold;
            color: var(--primary-color);
            margin-bottom: 8px;
            font-size: 1.1rem;
        }

        .question-text {
            font-size: 1.2rem;
            color: var(--text-color);
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        .option-btn {
            background: #ffffff;
            border: 2px solid #fed7aa;
            padding: 15px 20px;
            border-radius: 12px;
            font-size: 1rem;
            color: var(--text-color);
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
            display: flex;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .option-btn:hover {
            background: #fff7ed;
            border-color: var(--primary-color);
            transform: translateY(-2px);
        }

        .option-btn.correct {
            background-color: #d1fae5 !important;
            border-color: #10b981 !important;
            color: #065f46 !important;
            font-weight: bold;
        }

        .option-btn.incorrect {
            background-color: #fee2e2 !important;
            border-color: #ef4444 !important;
            color: #991b1b !important;
        }

        .option-btn:disabled {
            cursor: not-allowed;
            opacity: 0.9;
        }

        .controls {
            margin-top: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .score-board {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--accent-color);
        }

        .next-btn {
            background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            transition: transform 0.2s ease;
            display: none;
        }

        .next-btn:hover {
            transform: scale(1.05);
        }

        .result-box {
            text-align: center;
            padding: 30px 10px;
        }

        .result-box h2 {
            font-size: 2rem;
            color: var(--accent-color);
            margin-bottom: 15px;
        }

        .result-score {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: var(--text-color);
        }

        .restart-btn {
            background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 30px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .restart-btn:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <div class="header">
        <h1>ಅಧ್ಯಾಯ - ೪: ವೇದಕಾಲದ ಸಂಸ್ಕೃತಿ</h1>
        <h2>ಅಲ್ಟ್ರಾ ಮಾಡರ್ನ್ ಇಂಟರಾಕ್ಟಿವ್ ರಸಪ್ರಶ್ನೆ</h2>
    </div>

    <div class="progress-bar-container">
        <div class="progress-bar" id="progress-bar"></div>
    </div>

    <div id="quiz-screen">
        <div class="question-box">
            <div class="question-number" id="question-number">ಪ್ರಶ್ನೆ ೧/೨೦</div>
            <div class="question-text" id="question-text">ಪ್ರಶ್ನೆ ಇಲ್ಲಿ ಮೂಡುತ್ತದೆ...</div>

        <div class="options-grid" id="options-container">
            <!-- ಆಯ್ಕೆಗಳು ಬಟನ್‌ಗಳಾಗಿ ಬರುತ್ತವೆ -->
        </div>

        <div class="controls">
            <div class="score-board" id="score-display">ಅಂಕಗಳು: ೦</div>
            <button class="next-btn" id="next-btn" onclick="nextQuestion()">ಮುಂದಿನ ಪ್ರಶ್ನೆ ➔</button>
        </div>
    </div>

    <div id="result-screen" style="display: none;">
        <div class="result-box">
            <h2>ಅಭಿನಂದನೆಗಳು! 🕉️🎉</h2>
            <div class="result-score" id="final-score">ನಿಮ್ಮ ಅಂಕಗಳು: ೦/೨೦</div>
            <button class="restart-btn" onclick="restartQuiz()">ಮತ್ತೊಮ್ಮೆ ಪ್ರಯತ್ನಿಸಿ 🔄</button>
        </div>
    </div>
</div>

    const scoreDisplayEl = document.getElementById('score-display');
    const nextBtnEl = document.getElementById('next-btn');
    const progressBarEl = document.getElementById('progress-bar');
    const quizScreenEl = document.getElementById('quiz-screen');
    const resultScreenEl = document.getElementById('result-screen');
    const finalScoreEl = document.getElementById('final-score');

    function loadQuestion() {
        const currentData = quizData[currentQuestionIndex];
        
        // Progress Bar
        const progressPercent = ((currentQuestionIndex) / quizData.length) * 100;
        progressBarEl.style.width = `${progressPercent}%`;

        // Question Text
        questionNumberEl.textContent = `ಪ್ರಶ್ನೆ ${currentQuestionIndex + 1}/${quizData.length}`;
        questionTextEl.innerText = currentData.question;

        // Clear Options
        optionsContainerEl.innerHTML = '';
        nextBtnEl.style.display = 'none';

        // Render Options
        currentData.options.forEach((optionText, index) => {
            const btn = document.createElement('button');
            btn.classList.add('option-btn');
            btn.textContent = optionText;
            btn.onclick = () => selectOption(index);
            optionsContainerEl.appendChild(btn);
        });
    }

    function selectOption(selectedIndex) {
        const currentData = quizData[currentQuestionIndex];
        const optionButtons = optionsContainerEl.children;

        for (let i = 0; i < optionButtons.length; i++) {
            optionButtons[i].disabled = true;
        }

        if (selectedIndex === currentData.correct) {
            optionButtons[selectedIndex].classList.add('correct');
            score++;
            scoreDisplayEl.textContent = `ಅಂಕಗಳು: ${score}`;
        } else {
            optionButtons[selectedIndex].classList.add('incorrect');
            optionButtons[currentData.correct].classList.add('correct');
        }

        nextBtnEl.style.display = 'block';
    }

    function nextQuestion() {
        currentQuestionIndex++;
        if (currentQuestionIndex < quizData.length) {
            loadQuestion();
        } else {
            showResults();
        }
    }

    function showResults() {
        progressBarEl.style.width = `100%`;
        quizScreenEl.style.display = 'none';
        resultScreenEl.style.display = 'block';
        finalScoreEl.textContent = `ನಿಮ್ಮ ಅಂಕಗಳು: ${score} / ${quizData.length}`;
    }

    function restartQuiz() {
        currentQuestionIndex = 0;
        score = 0;
        scoreDisplayEl.textContent = `ಅಂಕಗಳು: ೦`;
        quizScreenEl.style.display = 'block';
        resultScreenEl.style.display = 'none';
        loadQuestion();
    }

    // Start Quiz
    loadQuestion();
</script>

</body>
</html>
