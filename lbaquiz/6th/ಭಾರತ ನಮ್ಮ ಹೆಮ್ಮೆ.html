<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>೬ನೇ ತರಗತಿ ಸಮಾಜ ವಿಜ್ಞಾನ - ಅಧ್ಯಾಯ ೨</title>
    <style>
        :root {
            --primary-color: #ff9933; /* ತ್ರಿವರ್ಣ ಧ್ವಜದ ಕೇಸರಿ ಬಣ್ಣ */
            --secondary-color: #138808; /* ಹಸಿರು ಬಣ್ಣ */
            --accent-color: #000080; /* ರಾಯಲ್ ಬ್ಲೂ */
            --background-gradient: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            --card-bg: rgba(255, 255, 255, 0.95);
            --text-color: #2c3e50;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        body {
            background: var(--background-gradient);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .quiz-container {
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.25);
            width: 100%;
            max-width: 700px;
            padding: 30px;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(10px);
            border: 2px solid #fff;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 15px;
        }

        .header h1 {
            color: var(--accent-color);
            font-size: 1.8rem;
            margin-bottom: 5px;
        }

        .header h2 {
            color: var(--secondary-color);
            font-size: 1.1rem;
        }

        .progress-bar-container {
            width: 100%;
            height: 10px;
            background-color: #e0e0e0;
            border-radius: 5px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ff9933, #138808);
            transition: width 0.3s ease;
        }

        .question-box {
            margin-bottom: 20px;
        }

        .question-number {
            font-weight: bold;
            color: var(--primary-color);
            margin-bottom: 8px;
            font-size: 1.1rem;
        }

        .question-text {
            font-size: 1.2rem;
            color: var(--text-color);
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        .option-btn {
            background: #ffffff;
            border: 2px solid #e9ecef;
            padding: 15px 20px;
            border-radius: 12px;
            font-size: 1rem;
            color: var(--text-color);
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
            display: flex;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .option-btn:hover {
            background: #fff5eb;
            border-color: var(--primary-color);
            transform: translateY(-2px);
        }

        .option-btn.correct {
            background-color: #d4edda !important;
            border-color: #28a745 !important;
            color: #155724 !important;
            font-weight: bold;
        }

        .option-btn.incorrect {
            background-color: #f8d7da !important;
            border-color: #dc3545 !important;
            color: #721c24 !important;
        }

        .option-btn:disabled {
            cursor: not-allowed;
            opacity: 0.9;
        }

        .controls {
            margin-top: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .score-board {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--accent-color);
        }

        .next-btn {
            background: linear-gradient(135deg, #138808, #ff9933);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            transition: transform 0.2s ease;
            display: none;
        }

        .next-btn:hover {
            transform: scale(1.05);
        }

        .result-box {
            text-align: center;
            padding: 30px 10px;
        }

        .result-box h2 {
            font-size: 2rem;
            color: var(--accent-color);
            margin-bottom: 15px;
        }

        .result-score {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: var(--text-color);
        }

        .restart-btn {
            background: linear-gradient(135deg, #ff9933, #138808);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 30px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .restart-btn:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <div class="header">
        <h1>ಅಧ್ಯಾಯ - ೨: ಭಾರತ ನಮ್ಮ ಹೆಮ್ಮೆ</h1>
        <h2>ಅಲ್ಟ್ರಾ ಮಾಡರ್ನ್ ಇಂಟರಾಕ್ಟಿವ್ ರಸಪ್ರಶ್ನೆ</h2>
    </div>

    <div class="progress-bar-container">
        <div class="progress-bar" id="progress-bar"></div>
    </div>

    <div id="quiz-screen">
        <div class="question-box">
            <div class="question-number" id="question-number">ಪ್ರಶ್ನೆ ೧/೨೦</div>
            <div class="question-text" id="question-text">ಪ್ರಶ್ನೆ ಇಲ್ಲಿ ಮೂಡುತ್ತದೆ...</div>
        </div>

        <div class="options-grid" id="options-container">
            <!-- ಆಯ್ಕೆಗಳು ಬಟನ್‌ಗಳಾಗಿ ಬರುತ್ತವೆ -->
        </div>

        <div class="controls">
            <div class="score-board" id="score-display">ಅಂಕಗಳು: ೦</div>
            <button class="next-btn" id="next-btn" onclick="nextQuestion()">ಮುಂದಿನ ಪ್ರಶ್ನೆ ➔</button>
        </div>
    </div>

    <div id="result-screen" style="display: none;">
        <div class="result-box">
            <h2>ಅಭಿನಂದನೆಗಳು! 🇮🇳🎉</h2>
            <div class="result-score" id="final-score">ನಿಮ್ಮ ಅಂಕಗಳು: ೦/೨೦</div>
            <button class="restart-btn" onclick="restartQuiz()">ಮತ್ತೊಮ್ಮೆ ಪ್ರಯತ್ನಿಸಿ 🔄</button>
        </div>
    </div>
</div>

<script>

            options: ["A) ಭರತ ಖಂಡ", "B) ಹಿಂದೂಸ್ತಾನ್", "C) ಜಂಬೂದ್ವೀಪ", "D) ಬರ್ಮಾ"],

            options: ["A) ಪರ್ಷಿಯನ್ನರು", "B) ಇಂಗ್ಲಿಷರು", "C) ಫ್ರೆಂಚರು", "D) ಡಚ್ಚರು"],

            options: ["A) ಕಾರ್ಲ್ ಮಾರ್ಕ್ಸ್", "B) ವಿಲಿಯಂ ಜೋನ್ಸ್", "C) ಜೆ.ಎಸ್.ಮಿಲ್", "D) ಮೆಕಾಲೆ"],

            options: ["A) ಬ್ರಿಟಿಷರಿಗೆ", "B) ಫ್ರೆಂಚರಿಗೆ", "C) ಅರಬರಿಗೆ", "D) ಭಾರತೀಯರಿಗೆ"],

        },
        {
            question: "ಜಗತ್ತಿಗೆ ಯೋಗಶಾಸ್ತ್ರ ಮತ್ತು ಸಂಸ್ಕೃತಿಯನ್ನು ಪರಿಚಯಿಸಿದವರು:",
            options: ["A) ಭಾರತೀಯರು", "B) ಡಚ್ಚರು", "C) ಚೀನಾದವರು", "D) ಬ್ರಿಟಿಷರು"],
            correct: 0
        },
        {
            question: "ಜಗತ್ತಿನ ಶ್ರೇಷ್ಠ ವಾಸ್ತುಶಿಲ್ಪಗಳಲ್ಲಿ ಒಂದಾದ ‘ಅಂಕೋರ್‌ವಾಟ್’ ಹಿಂದೂ ದೇವಾಲಯ ಈ ದೇಶದಲ್ಲಿದೆ:",
            options: ["A) ಭಾರತ", "B) ನೇಪಾಳ", "C) ಕಾಂಬೋಡಿಯಾ", "D) ಅಫ್ಘಾನಿಸ್ತಾನ್"],

            options: ["A) ಅಹಿಂಸೆ", "B) ಆಚಾರ್ಯ ದೇವೋಭವ", "C) ಸರ್ವಧರ್ಮ ಸಮಾನತೆ", "D) ಹಿಂಸೆ"],

        {

            options: ["A) ಕಾಳಿದಾಸ", "B) ಕಾರ್ಲ್ ಮಾರ್ಕ್ಸ್", "C) ಡಬ್ಲ್ಯೂ.ಸಿ.ಬ್ಯಾನರ್ಜಿ", "D) ವಿಲಿಯಂ ಜೋನ್ಸ್"],

        {
            question: "ಪುರಾಣಗಳ ಪ್ರಕಾರ ವೃಷಭನಾಥನ ಮಗನಾದ ಈ ರಾಜನ ಹೆಸರಿನಿಂದ ನಮ್ಮ ದೇಶಕ್ಕೆ ‘ಭಾರತ’ ಎಂಬ ಹೆಸರು ಬಂತು:",
            options: ["A) ದುಷ್ಯಂತ", "B) ಭರತ", "C) ಸಗರ", "D) ಪರೀಕ್ಷಿತ"],

        {
            question: "ಈ ಕೆಳಗಿನವುಗಳಲ್ಲಿ ಗಣಿತ ಕ್ಷೇತ್ರಕ್ಕೆ ಭಾರತೀಯರ ಕೊಡುಗೆಯಲ್ಲದ್ದು ಯಾವುದು?",
            options: ["A) ದಶಮಾಂಶ ಪದ್ಧತಿ", "B) ಶೂನ್ಯದ ಬಳಕೆ", "C) ಬೀಜಗಣಿತ", "D) ರೋಮನ್ ಅಂಕಿಗಳು"],

        },
        {
            question: "‘ಸರ್ವೇಜನಾಃ ಸುಖಿನೋ ಭವಂತು’ ಎಂಬುದು ಭಾರತದ ಪ್ರಮುಖವಾದ ಒಂದು _______ ಆಗಿದೆ.",
            options: ["A) ರಾಜಕೀಯ ಸಿದ್ಧಾಂತ", "B) ಸಾಂಸ್ಕೃತಿಕ ಮೌಲ್ಯ", "C) ಆರ್ಥಿಕ ನೀತಿ", "D) ಯುದ್ಧ ತಂತ್ರ"],
            correct: 1
        },
        {
            question: "ಭಾರತೀಯ ಸಂಸ್ಕೃತಿಯು ಹಬ್ಬಿದ ಆಗ್ನೇಯ ಏಷ್ಯಾದ ಮೂರು ದೇಶಗಳಲ್ಲಿ ಒಂದಾದ ‘ಇಂಡೋನೇಷ್ಯಾ’ ಯಾವ ಸಾಂಸ್ಕೃತಿಕ ಪ್ರಭಾವವನ್ನು ಹೊಂದಿದೆ?",
            options: ["A) ಭಾರತೀಯ ಸಂಸ್ಕೃತಿ", "B) ಗ್ರೀಕ್ ಸಂಸ್ಕೃತಿ", "C) ರೋಮನ್ ಸಂಸ್ಕೃತಿ", "D) ಈಜಿಪ್ಟಿಯನ್ ಸಂಸ್ಕೃತಿ"],
            correct: 0
        },
        {
            question: "ಪುರಾಣಗಳ ಪ್ರಕಾರ ಭರತನು ಆಳಿದ ನಾಡನ್ನು ಏನೆಂದು ಕರೆಯಲಾಯಿತು?",
            options: ["A) ಭರತ ಖಂಡ / ಭರತ ವರ್ಷ", "B) ಸಿಂಧೂ ಕಣಿವೆ", "C) ಆರ್ಯಾವರ್ತ ಮಾತ್ರ", "D) ಚೀನಾ ದೇಶ"],
            correct: 0
        },
        {
            question: "ಭಾರತೀಯ ಗಣಿತಶಾಸ್ತ್ರಜ್ಞರು ಜಗತ್ತಿಗೆ ನೀಡಿದ ಭಿನ್ನರಾಶಿ ಮತ್ತು ಅಂಕೆಗಳ ವ್ಯವಸ್ಥೆಯನ್ನು ಪಶ್ಚಿಮ ದೇಶಗಳಿಗೆ ತಲುಪಿಸಿದವರು ಯಾರು?",
            options: ["A) ಚೀನಾದವರು", "B) ಅರಬರು", "C) ಗ್ರೀಕರು", "D) ಪೋರ್ಚುಗೀಸರು"],
            correct: 1
        },
        {
            question: "‘ಆಚಾರ್ಯ ದೇವೋಭವ’ ಎಂದರೆ ಯಾರನ್ನು ದೇವರಂತೆ ಗೌರವಿಸಬೇಕು ಎಂದರ್ಥ?",
            options: ["A) ರಾಜನನ್ನು", "B) ಗುರುವಿನ/ಶಿಕ್ಷಕರನ್ನು", "C) ಸೈನಿಕನನ್ನು", "D) ವ್ಯಾபாரಿಯನ್ನು"],
            correct: 1
        },
        {
            question: "ಕಾಂಬೋಡಿಯಾ, ಮಲೇಶಿಯಾ, ಇಂಡೋನೇಷ್ಯಾಗಳು ಏಷ್ಯಾದ ಯಾವ ಭಾಗದಲ್ಲಿ ಕಂಡುಬರುತ್ತವೆ?",

            options: ["A) ಜರ್ಮನಿ", "B) ಬ್ರಿಟನ್ (ಇಂಗ್ಲೆಂಡ್)", "C) ಫ್ರಾನ್ಸ್", "D) ಪೋರ್ಚುಗಲ್"],
            correct: 1
        },
        {
            question: "ವಿಶ್ವಕ್ಕೇ ಶಾಂತಿ ಮತ್ತು ಅಹಿಂಸೆಯ ಸಂದೇಶವನ್ನು ನೀಡಿದ ಪ್ರಮುಖ ಭಾರತೀಯ ತತ್ವ ಯಾವುದು?",
            options: ["A) ಅಹಿಂಸೆ", "B) ಸಾಮ್ರಾಜ್ಯಶಾಹಿ", "C) ವಸಾಹತುಶಾಹಿ", "D) ಸಶಸ್ತ್ರ ಹೋರಾಟ"],
            correct: 0
        },
        {
            question: "ಪರ್ಷಿಯನ್ನರು ‘ಸಿಂಧೂ’ ನದಿಯ ಪ್ರದೇಶವನ್ನು ಯಾವ ಹೆಸರಿನಿಂದ ಕರೆದರು?",
            options: ["A) ಹಿಂದೂ / ಹಿಂದೂಸ್ತಾನ್", "B) ಇಂಡಸ್", "C) ಭಾರತ್", "D) ಜಂಬೂದ್ವೀಪ"],
            correct: 0
        },
        {
            question: "ವಿಶ್ವ ನಾಗರಿಕತೆಗೆ ಭಾರತ ಕೊಡುಗೆಯಾಗಿ ನೀಡಿದ ಸರ್ವಕಾಲಿಕ ಮೌಲ್ಯಗಳಲ್ಲಿ ‘ಸರ್ವಧರ್ಮ ಸಮಾನತೆ’ ಎಂದರೆ ಏನು?",
            options: ["A) ಎಲ್ಲಾ ಧರ್ಮಗಳನ್ನು ಸಮಾನವಾಗಿ ಗೌರವಿಸುವುದು", "B) ಒಂದೇ ಧರ್ಮವನ್ನು ಪಾಲಿಸುವುದು", "C) ಧರ್ಮವನ್ನು ವಿರೋಧಿಸುವುದು", "D) ಯಾವುದೇ ಧರ್ಮವನ್ನು ನಂಬದಿರುವುದು"],
            correct: 0
        }
    ];

    let currentQuestionIndex = 0;
    let score = 0;

    const questionNumberEl = document.getElementById('question-number');
    const questionTextEl = document.getElementById('question-text');
    const optionsContainerEl = document.getElementById('options-container');
    const scoreDisplayEl = document.getElementById('score-display');
    const nextBtnEl = document.getElementById('next-btn');
    const progressBarEl = document.getElementById('progress-bar');
    const quizScreenEl = document.getElementById('quiz-screen');
    const resultScreenEl = document.getElementById('result-screen');
    const finalScoreEl = document.getElementById('final-score');

    function loadQuestion() {
        const currentData = quizData[currentQuestionIndex];
        
        // Progress Bar
        const progressPercent = ((currentQuestionIndex) / quizData.length) * 100;
        progressBarEl.style.width = `${progressPercent}%`;

        // Question Text
        questionNumberEl.textContent = `ಪ್ರಶ್ನೆ ${currentQuestionIndex + 1}/${quizData.length}`;
        questionTextEl.innerText = currentData.question;

        // Clear Options
        optionsContainerEl.innerHTML = '';
        nextBtnEl.style.display = 'none';

        // Render Options
        currentData.options.forEach((optionText, index) => {
            const btn = document.createElement('button');
            btn.classList.add('option-btn');
            btn.textContent = optionText;
            btn.onclick = () => selectOption(index);
            optionsContainerEl.appendChild(btn);
        });
    }

    function selectOption(selectedIndex) {
        const currentData = quizData[currentQuestionIndex];
        const optionButtons = optionsContainerEl.children;

        for (let i = 0; i < optionButtons.length; i++) {
            optionButtons[i].disabled = true;
        }

        if (selectedIndex === currentData.correct) {
            optionButtons[selectedIndex].classList.add('correct');
            score++;
            scoreDisplayEl.textContent = `ಅಂಕಗಳು: ${score}`;
        } else {
            optionButtons[selectedIndex].classList.add('incorrect');
            optionButtons[currentData.correct].classList.add('correct');
        }

        nextBtnEl.style.display = 'block';
    }

    function nextQuestion() {
        currentQuestionIndex++;
        if (currentQuestionIndex < quizData.length) {
            loadQuestion();
        } else {
            showResults();
        }
    }

    function showResults() {
        progressBarEl.style.width = `100%`;
        quizScreenEl.style.display = 'none';
        resultScreenEl.style.display = 'block';
        finalScoreEl.textContent = `ನಿಮ್ಮ ಅಂಕಗಳು: ${score} / ${quizData.length}`;
    }

    function restartQuiz() {
        currentQuestionIndex = 0;
        score = 0;
        scoreDisplayEl.textContent = `ಅಂಕಗಳು: ೦`;
        quizScreenEl.style.display = 'block';
        resultScreenEl.style.display = 'none';
        loadQuestion();
    }

    // Start Quiz
    loadQuestion();
</script>

</body>
</html>
