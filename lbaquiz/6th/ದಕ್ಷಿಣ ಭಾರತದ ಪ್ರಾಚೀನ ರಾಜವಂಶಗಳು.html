<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>೬ನೇ ತರಗತಿ ಸಮಾಜ ವಿಜ್ಞಾನ - ಅಧ್ಯಾಯ ೬</title>
    <style>
        :root {
            --primary-color: #6b21a8; /* ರಾಯಲ್ ಪರ್ಪಲ್ */
            --secondary-color: #eab308; /* ಗೋಲ್ಡನ್ ಹಳದಿ */
            --accent-color: #3b0764; /* ಡಾರ್ಕ್ ವೈಲೆಟ್ */
            --background-gradient: linear-gradient(135deg, #f3e8ff 0%, #c084fc 100%);
            --card-bg: rgba(255, 255, 255, 0.96);
            --text-color: #1e1b4b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        body {
            background: var(--background-gradient);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .quiz-container {
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.25);
            width: 100%;
            max-width: 700px;
            padding: 30px;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(10px);
            border: 3px solid var(--secondary-color);
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 2px solid #e9d5ff;
            padding-bottom: 15px;
        }

        .header h1 {
            color: var(--accent-color);
            font-size: 1.8rem;
            margin-bottom: 5px;
        }

        .header h2 {
            color: var(--primary-color);
            font-size: 1.1rem;
        }

        .progress-bar-container {
            width: 100%;
            height: 10px;
            background-color: #e9d5ff;
            border-radius: 5px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #eab308, #6b21a8);
            transition: width 0.3s ease;
        }

        .question-box {
            margin-bottom: 20px;
        }

        .question-number {
            font-weight: bold;
            color: var(--primary-color);
            margin-bottom: 8px;
            font-size: 1.1rem;
        }

        .question-text {
            font-size: 1.2rem;
            color: var(--text-color);
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        .option-btn {
            background: #ffffff;
            border: 2px solid #e9d5ff;
            padding: 15px 20px;
            border-radius: 12px;
            font-size: 1rem;
            color: var(--text-color);
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
            display: flex;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .option-btn:hover {
            background: #faf5ff;
            border-color: var(--primary-color);
            transform: translateY(-2px);
        }

        .option-btn.correct {
            background-color: #d1fae5 !important;
            border-color: #10b981 !important;
            color: #065f46 !important;
            font-weight: bold;
        }

        .option-btn.incorrect {
            background-color: #fee2e2 !important;
            border-color: #ef4444 !important;
            color: #991b1b !important;
        }

        .option-btn:disabled {
            cursor: not-allowed;
            opacity: 0.9;
        }

        .controls {
            margin-top: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .score-board {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--accent-color);
        }

        .next-btn {
            background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            transition: transform 0.2s ease;
            display: none;
        }

        .next-btn:hover {
            transform: scale(1.05);
        }

        .result-box {
            text-align: center;
            padding: 30px 10px;
        }

        .result-box h2 {
            font-size: 2rem;
            color: var(--accent-color);
            margin-bottom: 15px;
        }

        .result-score {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: var(--text-color);
        }

        .restart-btn {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 30px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .restart-btn:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <div class="header">
        <h1>ಅಧ್ಯಾಯ - ೬: ದಕ್ಷಿಣ ಭಾರತದ ಪ್ರಾಚೀನ ರಾಜವಂಶಗಳು</h1>
        <h2>ಅಲ್ಟ್ರಾ ಮಾಡರ್ನ್ ಇಂಟರಾಕ್ಟಿವ್ ರಸಪ್ರಶ್ನೆ</h2>
    </div>

    <div class="progress-bar-container">
        <div class="progress-bar" id="progress-bar"></div>
    </div>

    <div id="quiz-screen">
        <div class="question-box">
            <div class="question-number" id="question-number">ಪ್ರಶ್ನೆ ೧/೨೦</div>
            <div class="question-text" id="question-text">ಪ್ರಶ್ನೆ ಇಲ್ಲಿ ಮೂಡುತ್ತದೆ...</div>
        </div>

        <div class="options-grid" id="options-container">
            <!-- ಆಯ್ಕೆಗಳು ಬಟನ್‌ಗಳಾಗಿ ಬರುತ್ತವೆ -->
        </div>

        <div class="controls">
            <div class="score-board" id="score-display">ಅಂಕಗಳು: ೦</div>
            <button class="next-btn" id="next-btn" onclick="nextQuestion()">ಮುಂದಿನ ಪ್ರಶ್ನೆ ➔</button>
        </div>
    </div>

    <div id="result-screen" style="display: none;">
        <div class="result-box">
            <h2>ಅಭಿನಂದನೆಗಳು! 👑🎉</h2>
            <div class="result-score" id="final-score">ನಿಮ್ಮ ಅಂಕಗಳು: ೦/೨೦</div>
            <button class="restart-btn" onclick="restartQuiz()">ಮತ್ತೊಮ್ಮೆ ಪ್ರಯತ್ನಿಸಿ 🔄</button>
        </div>
    </div>
</div>

<script>
    const quizData = [
        {
            question: "ಈ ಕೆಳಗಿನವುಗಳಲ್ಲಿ ದಕ್ಷಿಣ ಭಾರತದ ಪ್ರಾಚೀನ ರಾಜವಂಶಗಳಿಗೆ ಸಂಬಂಧಿಸದ ರಾಜವಂಶವಿದು:",
            options: ["A) ಮೌರ್ಯರು", "B) ಚೋಳರು", "C) ಕದಂಬರು", "D) ಶಾತವಾಹನರು"],
            correct: 0
        },
        {

            options: ["A) ಚಾಣಕ್ಯ", "B) ಬಸವೇಶ್ವರರು", "C) ತಿರುವಳ್ಳುವರ್", "D) ಕಣ್ಣಗಿ"],

        {

            options: ["A) ಪಾಟಲೀಪುತ್ರ", "B) ಅಮರಾವತಿ", "C) ಪೇಶಾವರ", "D) ಪ್ರತಿಷ್ಠಾನ ಪುರ"],
            correct: 3
        },
        {
            question: "‘ತ್ರೈಸಮುದ್ರತೋಯಪೀಠವಾಹನ’ ಎಂದು ಬಿರುದಾಂಕಿತನಾದ ಶಾತವಾಹನರ ಪ್ರಸಿದ್ಧ ಅರಸ ಯಾರು?",
            options: ["A) ಹರ್ಷವರ್ಧನ", "B) ಮಯೂರವರ್ಮ", "C) ಗೌತಮೀಪುತ್ರ ಶಾತಕರ್ಣಿ", "D) ಇಮ್ಮಡಿ ಪುಲಿಕೇಶಿ"],
            correct: 2
        },
        {
            question: "ಕದಂಬ ರಾಜವಂಶದ ಸ್ಥಾಪಕ ಯಾರು?",
            options: ["A) ಮಯೂರವರ್ಮ", "B) ಕಾಕುಸ್ಥವರ್ಮ", "C) ಕೃಷ್ಣವರ್ಮ", "D) ಶಾಂತಿ ವರ್ಮ"],
            correct: 0
        },
        {
            question: "ಕರ್ನಾಟಕದಲ್ಲಿ ದೊರೆತಿರುವ ಪ್ರಥಮ ಸಂಸ್ಕೃತ ಶಾಸನ : ತಾಳಗುಂದ :: ಕನ್ನಡದ ಮೊದಲ ಶಾಸನ : _____",
            options: ["A) ಐಹೊಳೆ ಶಾಸನ", "B) ಮಸ್ಕಿ ಶಾಸನ", "C) ಹಲ್ಮಿಡಿ ಶಾಸನ", "D) ಮೆಹರೌಲಿ ಸ್ತಂಭ ಶಾಸನ"],
            correct: 2
        },
        {
            question: "ಕನ್ನಡ ನಾಡಿನ ಇತಿಹಾಸದಲ್ಲಿ ಅತೀ ದೀರ್ಘಕಾಲ ಆಳ್ವಿಕೆ ನಡೆಸಿದ ರಾಜವಂಶ ಯಾವುದು?",
            options: ["A) ಕದಂಬರು", "B) ಗಂಗರು", "C) ಬಾದಾಮಿ ಚಾಲುಕ್ಯರು", "D) ರಾಷ್ಟ್ರಕೂಟರು"],
            correct: 1
        },
        {
            question: "ಶ್ರವಣಬೆಳಗೊಳದ ಗೊಮ್ಮಟೇಶ್ವರ ಏಕಶಿಲಾ ವಿಗ್ರಹವನ್ನು ಕೆತ್ತಿಸಿದವರು ಯಾರು?",
            options: ["A) ನಾಲ್ವನೇ ರಾಚಮಲ್ಲ", "B) ಚಾವುಂಡರಾಯ", "C) ದುರ್ವಿನೀತ", "D) ಶ್ರೀ ಕೃಷ್ಣ"],
            correct: 1
        },
        {
            question: "‘ನರ್ಮದಾ ನದಿ ಕಾಳಗ’ ಈ ಕೆಳಗಿನ ಯಾವ ರಾಜರ ನಡುವೆ ನಡೆಯಿತು?",
            options: ["A) ಮಂಗಳೇಶ - ಪ್ರಭಾಕರವರ್ಧನ", "B) ರಾಜವರ್ಧನ - ವಿಕ್ರಮಾದಿತ್ಯ", "C) ಕುಮಾರಗುಪ್ತ - ವಿಜಯಾದಿತ್ಯ", "D) ಹರ್ಷವರ್ಧನ - ಇಮ್ಮಡಿ ಪುಲಿಕೇಶಿ"],
            correct: 3
        },
        {
            question: "“ದೇವಾಲಯಗಳ ವಾಸ್ತುಶಿಲ್ಪದ ತೊಟ್ಟಿಲು” ಎಂದು ಪ್ರಸಿದ್ಧವಾದ ಸ್ಥಳ ಯಾವುದು?",
            options: ["A) ಬಾದಾಮಿ", "B) ಪಟ್ಟದಕಲ್ಲು", "C) ಐಹೊಳೆ", "D) ಮಹಾಕೂಟ"],
            correct: 2
        },
        {
            question: "ಇಮ್ಮಡಿ ಪುಲಿಕೇಶಿಯನ್ನು ಪರಾಭವಗೊಳಿಸಿ ‘ವಾತಾಪಿಕೊಂಡ’ ಎಂಬ ಬಿರುದು ಧರಿಸಿದ ಪಲ್ಲವರ ಪ್ರಸಿದ್ಧ ದೊರೆ ಯಾರು?",
            options: ["A) ನರಸಿಂಹವರ್ಮ", "B) ಅಪರಾಜಿತವರ್ಮ", "C) ದಂತಿವರ್ಮ", "D) ಮಹೇಂದ್ರವರ್ಮ"],
            correct: 0
        },
        {
            question: "ಕನ್ನಡದಲ್ಲಿ ಲಭ್ಯವಿರುವ ಅತ್ಯಂತ ಪ್ರಾಚೀನ ಗ್ರಂಥವಾದ “ಕವಿರಾಜಮಾರ್ಗ”ದ ಕರ್ತೃ ಯಾರು?",
            options: ["A) ಚಾವುಂಡರಾಯ", "B) ಪಂಪ", "C) ಕಾಳಿದಾಸ", "D) ಶ್ರೀವಿಜಯ"],
            correct: 3
        },
        {
            question: "ಏಕ ಶಿಲೆಯಲ್ಲಿ ರಚನೆಯಾದ ಎಲ್ಲೋರಾದ ಕೈಲಾಸನಾಥ ದೇವಾಲಯವನ್ನು ನಿರ್ಮಿಸಿದ ರಾಷ್ಟ್ರಕೂಟ ಅರಸ ಯಾರು?",
            options: ["A) ಒಂದನೇ ಕೃಷ್ಣ", "B) ಎರಡನೇ ಕೃಷ್ಣ", "C) ಒಂದನೇ ಅಮೋಘವರ್ಷ", "D) ಮೂರನೇ ಗೋವಿಂದ"],
            correct: 0
        },
        {
            question: "ರಾಷ್ಟ್ರಕೂಟರ ರಾಜಧಾನಿಯಾದ 'ಮಾನ್ಯಖೇಟ' ಪಟ್ಟಣದ ನಿರ್ಮಾತೃ ಯಾರು?",
            options: ["A) ಮೂರನೇ ಕೃಷ್ಣ", "B) ಅಮೋಘವರ್ಷ ನೃಪತುಂಗ", "C) ದಂತಿದುರ್ಗ", "D) ಮೂರನೇ ಗೋವಿಂದ"],
            correct: 1
        },
        {
            question: "ಕಲ್ಯಾಣದ ಚಾಲುಕ್ಯ ವಂಶದ ಶ್ರೇಷ್ಠ ಚಕ್ರವರ್ತಿ ಹಾಗೂ “ಚಾಲುಕ್ಯ ವಿಕ್ರಮ ಶಕೆ”ಯನ್ನು ಆರಂಭಿಸಿದ ದೊರೆ ಯಾರು?",
            options: ["A) ಎರಡನೇ ವಿಕ್ರಮಾದಿತ್ಯ", "B) ಮೂರನೇ ಸೋಮೇಶ್ವರ", "C) ಆರನೇ ವಿಕ್ರಮಾದಿತ್ಯ", "D) ಇಮ್ಮಡಿ ಪುಲಿಕೇಶಿ"],
            correct: 2
        },
        {
            question: "ಶಾಸನವೊಂದರಲ್ಲಿ ”ದೇವಾಲಯಗಳ ಚಕ್ರವರ್ತಿ” ಎಂದು ವರ್ಣಿಸಲ್ಪಟ್ಟ ದೇವಾಲಯ ಯಾವುದು?",
            options: ["A) ಚೆನ್ನಕೇಶವ ದೇವಾಲಯ-ಬೇಲೂರು", "B) ಕೈಲಾಸ ದೇವಾಲಯ-ಎಲ್ಲೋರಾ", "C) ಮಹಾದೇವ ದೇವಾಲಯ-ಇಟಗಿ", "D) ವಿರೂಪಾಕ್ಷ ದೇವಾಲಯ-ಪಟ್ಟದಕಲ್ಲು"],
            correct: 2
        },
        {
            question: "ಬೇಲೂರಿನ ಪ್ರಸಿದ್ಧ 'ಚೆನ್ನಕೇಶವ ದೇವಾಲಯ'ವು ಈ ಕೆಳಗಿನ ಯಾವ ರಾಜಮನೆತನಕ್ಕೆ ಸಂಬಂಧಿಸಿದೆ?",
            options: ["A) ಗಂಗರು", "B) ಕದಂಬರು", "C) ಹೊಯ್ಸಳರು", "D) ರಾಷ್ಟ್ರಕೂಟರು"],
            correct: 2
        },
        {
            question: "ಉತ್ತರ ಭಾರತದ ಯಶಸ್ವಿ ದಂಡಯಾತ್ರೆಯ ನೆನಪಿಗಾಗಿ ’ಗಂಗೈಕೊಂಡ ಚೋಳಪುರಂ’ ಎಂಬ ಹೊಸ ರಾಜಧಾನಿಯನ್ನು ನಿರ್ಮಿಸಿದ ಚೋಳರ ದೊರೆ ಯಾರು?",
            options: ["A) ರಾಜರಾಜ ಚೋಳ", "B) ಕರಿಕಾಲ ಚೋಳ", "C) ರಾಜೇಂದ್ರ ಚೋಳ", "D) ವಿಜಯಾಲಯ ಚೋಳ"],
            correct: 2
        },
        {
            question: "ಕನ್ನಡ ಸಾಹಿತ್ಯದ 'ರತ್ನತ್ರಯರು' ಎಂದು ಯಾರನ್ನು ಕರೆಯುತ್ತಾರೆ?",
            options: ["A) ಪಂಪ, ಪೊನ್ನ, ರನ್ನ", "B) ಹರಿಹರ, ರಾಘವಾಂಕ, ಜನ್ನ", "C) ಬಸವಣ್ಣ, ಅಲ್ಲಮ, ಅಕ್ಕಮಹಾದೇವಿ", "D) ಲಕ್ಷ್ಮೀಶ, ಕುಮಾರವ್ಯಾಸ, ಜೈಮಿನಿ"],
            correct: 0
        },
        {
            question: "ಹೊಯ್ಸಳರ ರಾಜ ಲಾಂಛನ ಯಾವುದಾಗಿತ್ತು?",
            options: ["A) ವರಾಹ (ಹಂದಿ)", "B) ಸಿಂಹ", "C) ಹುಲಿಯನ್ನು ಸಲನು ಕೊಲ್ಲುವ ಚಿತ್ರ", "D) ಆನೆ"],
            correct: 2
        }
    ];

    let currentQuestionIndex = 0;
    let score = 0;

    const questionNumberEl = document.getElementById('question-number');
    const questionTextEl = document.getElementById('question-text');
    const optionsContainerEl = document.getElementById('options-container');
    const scoreDisplayEl = document.getElementById('score-display');
    const nextBtnEl = document.getElementById('next-btn');
    const progressBarEl = document.getElementById('progress-bar');
    const quizScreenEl = document.getElementById('quiz-screen');
    const resultScreenEl = document.getElementById('result-screen');
    const finalScoreEl = document.getElementById('final-score');

    function loadQuestion() {
        const currentData = quizData[currentQuestionIndex];
        
        // Progress Bar
        const progressPercent = ((currentQuestionIndex) / quizData.length) * 100;
        progressBarEl.style.width = `${progressPercent}%`;

        // Question Text
        questionNumberEl.textContent = `ಪ್ರಶ್ನೆ ${currentQuestionIndex + 1}/${quizData.length}`;
        questionTextEl.innerText = currentData.question;

        // Clear Options
        optionsContainerEl.innerHTML = '';
        nextBtnEl.style.display = 'none';

        // Render Options
        currentData.options.forEach((optionText, index) => {
            const btn = document.createElement('button');
            btn.classList.add('option-btn');
            btn.textContent = optionText;
            btn.onclick = () => selectOption(index);
            optionsContainerEl.appendChild(btn);
        });
    }

    function selectOption(selectedIndex) {
        const currentData = quizData[currentQuestionIndex];
        const optionButtons = optionsContainerEl.children;

        for (let i = 0; i < optionButtons.length; i++) {
            optionButtons[i].disabled = true;
        }

        if (selectedIndex === currentData.correct) {
            optionButtons[selectedIndex].classList.add('correct');
            score++;
            scoreDisplayEl.textContent = `ಅಂಕಗಳು: ${score}`;
        } else {
            optionButtons[selectedIndex].classList.add('incorrect');
            optionButtons[currentData.correct].classList.add('correct');
        }

        nextBtnEl.style.display = 'block';
    }

    function nextQuestion() {
        currentQuestionIndex++;
        if (currentQuestionIndex < quizData.length) {
            loadQuestion();
        } else {
            showResults();
        }
    }

    function showResults() {
        progressBarEl.style.width = `100%`;
        quizScreenEl.style.display = 'none';
        resultScreenEl.style.display = 'block';
        finalScoreEl.textContent = `ನಿಮ್ಮ ಅಂಕಗಳು: ${score} / ${quizData.length}`;
    }

    function restartQuiz() {
        currentQuestionIndex = 0;
        score = 0;
        scoreDisplayEl.textContent = `ಅಂಕಗಳು: ೦`;
        quizScreenEl.style.display = 'block';
        resultScreenEl.style.display = 'none';
        loadQuestion();
    }

    // Start Quiz
    loadQuestion();
</script>

</body>
</html>
