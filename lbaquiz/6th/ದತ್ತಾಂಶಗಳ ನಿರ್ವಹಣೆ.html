            { 
                q: "18) 15 ನವಜಾತ ಶಿಶುಗಳ ತೂಕ (kg): [2.4, 2.9, 2.7, 2.8, 2.5, 3.1, 2.8, 2.9, 2.5, 3.0, 2.5, 2.6, 2.0, 2.1, 2.2].  ನವಜಾತ ಶಿಶುಗಳ ತೂಕದ ವ್ಯಾಪ್ತಿಯನ್ನು (ವ್ಯಾಪ್ತಿ = ಗರಿಷ್ಠ - ಕನಿಷ್ಠ) ಕಂಡುಹಿಡಿಯಿರಿ.", 
                options: ["1.0 kg", "1.1 kg", "1.2 kg", "0.9 kg"], 
                correct: 1, 
                why: "ವ್ಯಾಪ್ತಿ = ಗರಿಷ್ಠ ತೂಕ (3.1 kg) - ಕನಿಷ್ಠ ತೂಕ (2.0 kg) = 1.1 kg." 
            }
        ];

        let currentQuestion = 0;
        let score = 0;

        function loadQuestion() {
            const q = quizData[currentQuestion];
            document.getElementById('question-number').innerText = `ಪ್ರಶ್ನೆ ${currentQuestion + 1} / ${quizData.length}`;
            document.getElementById('question-text').innerText = q.q;
            
            // Update progress bar
            const progress = (currentQuestion / quizData.length) * 100;
            document.getElementById('progress-bar').style.width = `${progress}%`;
            
            const container = document.getElementById('options-container');
            container.innerHTML = '';
            
            q.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = "option-card w-full text-left p-4 rounded-xl border-2 border-slate-200 hover:border-emerald-400 hover:bg-emerald-50/50 font-medium text-slate-700 flex items-center justify-between text-sm md:text-base";
                btn.innerHTML = `<span>${opt}</span><span class="w-5 h-5 rounded-full border-2 border-slate-300 flex items-center justify-center text-xs shrink-0"></span>`;
                btn.onclick = () => checkAnswer(index);
                container.appendChild(btn);
            });

            document.getElementById('feedback').classList.add('hidden');
        }

        function checkAnswer(selectedIndex) {
            const q = quizData[currentQuestion];
            const buttons = document.querySelectorAll('#options-container button');
            
            // Disable all buttons after choice
            buttons.forEach(btn => btn.disabled = true);

            const feedback = document.getElementById('feedback');
            const feedbackIcon = document.getElementById('feedback-icon');
            const feedbackText = document.getElementById('feedback-text');
            const rationaleText = document.getElementById('rationale-text');
            
            feedback.classList.remove('hidden');

            if (selectedIndex === q.correct) {
                score++;
                feedback.className = "p-4 md:p-5 rounded-2xl bg-emerald-50 text-emerald-900 border border-emerald-200 shadow-sm";
                feedbackIcon.innerText = "🎉";
                feedbackText.innerText = "ಸರಿಯಾದ ಉತ್ತರ!";
                buttons[selectedIndex].className = "option-card w-full text-left p-4 rounded-xl border-2 border-emerald-500 bg-emerald-100 font-semibold text-emerald-900 flex items-center justify-between text-sm md:text-base";
            } else {
                feedback.className = "p-4 md:p-5 rounded-2xl bg-rose-50 text-rose-900 border border-rose-200 shadow-sm";
                feedbackIcon.innerText = "❌";
                feedbackText.innerText = "ತಪ್ಪು ಉತ್ತರ!";
                buttons[selectedIndex].className = "option-card w-full text-left p-4 rounded-xl border-2 border-rose-500 bg-rose-100 font-semibold text-rose-900 flex items-center justify-between text-sm md:text-base";
                buttons[q.correct].className = "option-card w-full text-left p-4 rounded-xl border-2 border-emerald-500 bg-emerald-50 font-semibold text-emerald-800 flex items-center justify-between text-sm md:text-base";
            }

            rationaleText.innerText = q.why;
            document.getElementById('score-display').innerText = `ಅಂಕಗಳು: ${score}`;
        }

        document.getElementById('next-btn').onclick = () => {
            currentQuestion++;
            if (currentQuestion < quizData.length) {
                loadQuestion();
            } else {
                showResults();
            }
        };

        function showResults() {
            document.getElementById('question-card').classList.add('hidden');
            document.getElementById('result-card').classList.remove('hidden');
            document.getElementById('final-score').innerText = score;
            document.getElementById('progress-bar').style.width = "100%";

            const perfMessage = document.getElementById('performance-message');
            if (score === 18) {
                perfMessage.innerText = "ಅದ್ಭುತ ಸಾಧನೆ! ನೀವು ಎಲ್ಲಾ 18 ಪ್ರಶ್ನೆಗಳಿಗೂ ಅತ್ಯುತ್ತಮ ಸರಿಯಾದ ಉತ್ತರ ನೀಡಿದ್ದೀರಿ! 🌟";
            } else if (score >= 15) {
                perfMessage.innerText = "ತುಂಬಾ ಒಳ್ಳೆಯ ಪ್ರಯತ್ನ! ದತ್ತಾಂಶ ನಿರ್ವಹಣೆಯಲ್ಲಿ ನಿಮ್ಮ ಜ್ಞಾನ ಉತ್ತಮವಾಗಿದೆ. 👍";
            } else if (score >= 10) {
                perfMessage.innerText = "ಒಳ್ಳೆಯ ಪ್ರಯತ್ನ! ಮತ್ತೊಮ್ಮೆ ಅಭ್ಯಾಸ ಮಾಡಿ ಇನ್ನೂ ಹೆಚ್ಚಿನ ಅಂಕ ಪಡೆಯಿರಿ. 🙂";
            } else {
                perfMessage.innerText = "ಪುಸ್ತಕದ 4ನೇ ಅಧ್ಯಾಯವನ್ನು ಇನ್ನೊಮ್ಮೆ ಓದಿ ಮತ್ತೆ ಪ್ರಯತ್ನಿಸಿ! 💪";
            }
        }

        function restartQuiz() {
            currentQuestion = 0;
            score = 0;
            document.getElementById('score-display').innerText = `ಅಂಕಗಳು: 0`;
            document.getElementById('result-card').classList.add('hidden');
            document.getElementById('question-card').classList.remove('hidden');
            loadQuestion();
        }

        window.onload = function() {
            loadQuestion();
        };
    </script>
</body>
</html>
