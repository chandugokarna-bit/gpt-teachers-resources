    let currentQIndex = 0;
    let score = 0;
    let isUltraMode = false;
    let timerInterval;
    let timeRemaining = 15;

    function toggleUltraMode() {
        isUltraMode = !isUltraMode;
        document.body.classList.toggle('ultra-mode');
        const btn = document.getElementById('ultraBtn');
        btn.innerText = isUltraMode ? "⚡ ULTRA MODE: ON" : "⚡ ULTRA MODE: OFF";
        restartQuiz();
    }

    function loadQuestion() {
        clearInterval(timerInterval);
        
        if (currentQIndex >= questionsData.length) {
            showResults();
            return;
        }

        const currentQ = questionsData[currentQIndex];
        document.getElementById("qText").innerText = currentQ.q;
        document.getElementById("progressText").innerText = `ಪ್ರಶ್ನೆ ${currentQIndex + 1} / ${questionsData.length}`;
        
        const optsContainer = document.getElementById("optsBox");
        optsContainer.innerHTML = "";

        currentQ.opts.forEach((optText, index) => {
            const button = document.createElement("button");
            button.className = "opt-btn";
            button.innerText = optText;
            button.onclick = () => checkAnswer(index, currentQ.correct);
            optsContainer.appendChild(button);
        });

        if (isUltraMode) {
            startTimer();
        }
    }

    function startTimer() {
        timeRemaining = 15;
        const timerBar = document.getElementById("timerBar");
        timerBar.style.width = "100%";

        timerInterval = setInterval(() => {
            timeRemaining--;
            timerBar.style.width = (timeRemaining / 15) * 100 + "%";
            if (timeRemaining <= 0) {
                clearInterval(timerInterval);
                nextQuestion();
            }
        }, 1000);
    }

    function checkAnswer(selectedIdx, correctIdx) {
        clearInterval(timerInterval);
        const buttons = document.querySelectorAll(".opt-btn");

        buttons.forEach((btn, idx) => {
            btn.disabled = true;
            if (idx === correctIdx) {
                btn.classList.add("correct");
            }
            if (idx === selectedIdx && selectedIdx !== correctIdx) {
                btn.classList.add("wrong");
            }
        });

        if (selectedIdx === correctIdx) {
            score++;
        }
    }

    function nextQuestion() {
        currentQIndex++;
        loadQuestion();
    }

    function showResults() {
        document.getElementById("quiz-body").style.display = "none";
        document.getElementById("result-box").style.display = "block";
        document.getElementById("scoreVal").innerText = score;
    }

    function restartQuiz() {
        currentQIndex = 0;
        score = 0;
        document.getElementById("quiz-body").style.display = "block";
        document.getElementById("result-box").style.display = "none";
        loadQuestion();
    }

    loadQuestion();
</script>

</body>
</html>
