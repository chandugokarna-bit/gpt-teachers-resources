<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>೭ನೇ ತರಗತಿ ಸಮಾಜ ವಿಜ್ಞಾನ - ಅಧ್ಯಾಯ ೩: ಭಾರತಕ್ಕೆ ಐರೋಪ್ಯರ ಆಗಮನ</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, 'Tunga', sans-serif;
        }
        body {
            background-color: #e2e8f0;
            margin: 0;
            padding: 20px;
            transition: background 0.4s ease, color 0.4s ease;
        }
        /* Ultra Mode Theme */
        body.ultra-mode {
            background-color: #090d16;
            color: #f1f5f9;
        }
        .quiz-container {
            max-width: 800px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            position: relative;
            overflow: hidden;
            border: 2px solid #cbd5e1;
        }
        body.ultra-mode .quiz-container {
            background: #131c2e;
            box-shadow: 0 0 25px rgba(59, 130, 246, 0.4);
            border-color: #3b82f6;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        body.ultra-mode .header {
            border-bottom-color: #1e293b;
        }
        .ultra-btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.95rem;
            box-shadow: 0 4px 10px rgba(37, 99, 235, 0.3);
            transition: 0.3s;
        }
        body.ultra-mode .ultra-btn {
            background: #ef4444;
            box-shadow: 0 0 15px #ef4444;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        .timer-container {
            width: 100%;
            height: 8px;
            background: #e2e8f0;
            border-radius: 4px;
            margin-bottom: 20px;
            display: none;
            overflow: hidden;
        }
        body.ultra-mode .timer-container {
            display: block;
            background: #334155;
        }
        .timer-bar {
            height: 100%;
            background: #ef4444;
            width: 100%;
            transition: width 1s linear;
        }
        .question {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 20px;
            line-height: 1.5;
            white-space: pre-line;
        }
        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }
        .opt-btn {
            background: #f8fafc;
            border: 2px solid #cbd5e1;
            padding: 14px 18px;
            border-radius: 10px;
            text-align: left;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
            color: inherit;
        }
        body.ultra-mode .opt-btn {
            background: #1e293b;
            border-color: #334155;
        }
        .opt-btn:hover:not([disabled]) {
            border-color: #3b82f6;
            background: #eff6ff;
        }
        body.ultra-mode .opt-btn:hover:not([disabled]) {
            background: #0f172a;
            border-color: #60a5fa;
        }
        .correct {
            background-color: #d1fae5 !important;
            border-color: #10b981 !important;
            color: #065f46 !important;
            font-weight: bold;
        }
        .wrong {
            background-color: #fee2e2 !important;
            border-color: #ef4444 !important;
            color: #991b1b !important;
        }
        body.ultra-mode .correct {
            background-color: #064e3b !important;
            color: #a7f3d0 !important;
        }
        body.ultra-mode .wrong {
            background-color: #7f1d1d !important;
            color: #fecaca !important;
        }
        .footer {
            margin-top: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .next-btn {
            background: #10b981;
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
        }
        .next-btn:hover {
            background: #059669;
        }
        .score-card {
            text-align: center;
            padding: 20px;
        }
        .score-card h2 {
            font-size: 2rem;
            color: #3b82f6;
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <div class="header">
        <div>
            <h3 style="margin:0;">೭ನೇ ತರಗತಿ - ಸಮಾಜ ವಿಜ್ಞಾನ</h3>
            <small>ಅಧ್ಯಾಯ ೩: ಭಾರತಕ್ಕೆ ಐರೋಪ್ಯರ ಆಗಮನ</small>
        </div>
        <button class="ultra-btn" onclick="toggleUltraMode()" id="ultraBtn">⚡ ULTRA MODE: OFF</button>
    </div>

    <div class="timer-container">
        <div class="timer-bar" id="timerBar"></div>
    </div>

    <div id="quiz-body">
        <div class="question" id="qText">ಪ್ರಶ್ನೆ ಲೋಡ್ ಆಗುತ್ತಿದೆ...</div>
        <div class="options-grid" id="optsBox"></div>

        <div class="footer">
            <span id="progressText" style="font-weight: bold;">ಪ್ರಶ್ನೆ 1 / 21</span>
            <button class="next-btn" onclick="nextQuestion()" id="nextBtn">ಮುಂದಿನ ಪ್ರಶ್ನೆ ➔</button>
        </div>
    </div>

    <div id="result-box" class="score-card" style="display: none;">
        <h2>ಅಭಿನಂದನೆಗಳು! 🎉</h2>
        <p style="font-size: 1.2rem;">ನಿಮ್ಮ ಒಟ್ಟು ಅಂಕಗಳು: <strong id="scoreVal">0</strong> / 21</p>
        <button class="next-btn" onclick="restartQuiz()">ಮತ್ತೆ ಪರೀಕ್ಷೆ ಬರೆಯಿರಿ</button>
    </div>
</div>

<script>
    // ಪ್ರಶ್ನಾಕೋಠಿಯ ಅಧ್ಯಾಯ-೩ ರಲ್ಲಿರುವ ಎಲ್ಲಾ ೨೧ ಬಹುಆಯ್ಕೆ ಪ್ರಶ್ನೆಗಳು ಮತ್ತು ಉತ್ತರಗಳು
    const questionsData = [
        {
            q: "1. ಜಲಮಾರ್ಗದ ಮೂಲಕ ಭಾರತವನ್ನು ಪ್ರವೇಶಿಸಿದ ಮೊದಲ ಯುರೋಪಿಯನ್ನರು.",
            opts: ["A. ಡಚ್ಚರು", "B. ಫ್ರೆಂಚರು", "C. ಪೋರ್ಚುಗೀಸರು", "D. ಇಂಗ್ಲಿಷರು"],
            correct: 2
        },
        {
            q: "2. ವಾಸ್ಕೋಡಿಗಾಮನಿಗೆ ವ್ಯಾಪಾರಕ್ಕೆ ಅನುಮತಿ ನೀಡಿದ ಕಲ್ಲಿಕೋಟೆಯ ದೊರೆ.",
            opts: ["A. ಜಾಮೊರಿನ್", "B. ಜಹಾಂಗೀರ್", "C. ಅಲಂಪಂಗೇರ್", "D. ಬಹದ್ದೂರ್ ಷಾ"],
            correct: 0
        },
        {
            q: "3. ಭಾರತಕ್ಕೆ ಹೊಸ ಜಲಮಾರ್ಗ ಕಂಡುಹಿಡಿದ ಪೋರ್ಚುಗೀಸರ ಗುರಿಗಳು ಹೀಗಿದ್ದವು.",
            opts: ["A. ಪೂರ್ವದ ದೇಶಗಳೊಂದಿಗೆ ವ್ಯಾಪಾರದ ಏಕಸ್ವಾಮ್ಯ ಸಾಧಿಸುವುದು.", "B. ವಸಾಹತು ಸಾಮ್ರಾಜ್ಯವನ್ನು ನಿರ್ಮಿಸುವುದು.", "C. ಕ್ರೈಸ್ತ ಧರ್ಮದ ಪ್ರಚಾರ", "D. ಮೇಲಿನ ಎಲ್ಲವೂ ಸರಿ"],
            correct: 3
        },
        {
            q: "4. ಸಾ.ಶ 1509ರಲ್ಲಿ ಭಾರತಕ್ಕೆ ಪೋರ್ಚುಗೀಸ್ ಗವರ್ನರ್ (ವೈಸ್‌ರಾಯ್) ಆಗಿ ನೇಮಕಗೊಂಡವನು.",
            opts: ["A. ಫ್ರಾನ್ಸಿಸ್ಕೋ-ಡಿ-ಅಲ್ಮೇಡಾ", "B. ಡೂಪ್ಲೇ", "C. ರಾಬರ್ಟ್ ಕ್ಲೈವ್", "D. ಅಲ್ಬುಕರ್ಕ್"],
            correct: 3
        },
        {
            q: "5. ಭಾರತದಲ್ಲಿ ಪೋರ್ಚುಗೀಸರ ರಾಜಧಾನಿ.",
            opts: ["A. ಕಲ್ಕತ್ತಾ", "B. ಸೂರತ್", "C. ಗೋವಾ", "D. ಪಾಂಡಿಚೇರಿ"],
            correct: 2
        },
        {
            q: "6. ಪೋರ್ಚುಗೀಸರ ಭಾರತದ ಪ್ರಥಮ ವೈಸ್‌ರಾಯ್ (ಗವರ್ನರ್).",
            opts: ["A. ಫ್ರಾನ್ಸಿಸ್ಕೋ-ಡಿ-ಅಲ್ಮೇಡಾ", "B. ಡೂಪ್ಲೇ", "C. ರಾಬರ್ಟ್ ಕ್ಲೈವ್", "D. ಅಲ್ಬುಕರ್ಕ್"],
            correct: 0
        },
        {
            q: "7. ಭಾರತಕ್ಕೆ ಬಂದ ಮೊಟ್ಟ ಮೊದಲ ಯುರೋಪಿಯನ್ನರು ಹಾಗೂ ಭಾರತ ತೊರೆದ ಕಟ್ಟು ಕಡೆಯ ಯುರೋಪಿಯನ್ನರು.",
            opts: ["A. ಡಚ್ಚರು", "B. ಫ್ರೆಂಚರು", "C. ಪೋರ್ಚುಗೀಸರು", "D. ಇಂಗ್ಲಿಷರು"],
            correct: 2
        },
        {
            q: "8. ಪೋರ್ಚುಗೀಸರಿಂದ ಗೋವಾ ವಿಮೋಚನೆಗೊಂಡ ವರ್ಷ.",
            opts: ["A. ಸಾ.ಶ. 1960", "B. ಸಾ.ಶ. 1961", "C. ಸಾ.ಶ. 1962", "D. ಸಾ.ಶ. 1947"],
            correct: 1
        },
        {
            q: "9. ಭಾರತಕ್ಕೆ ವ್ಯಾಪಾರಕ್ಕಾಗಿ ಬಂದ ಡಚ್ಚರ ದೇಶ.",
            opts: ["A. ನೆದರ್‌ಲ್ಯಾಂಡ್", "B. ಇಂಗ್ಲೆಂಡ್", "C. ಪೋರ್ಚುಗಲ್", "D. ಸ್ಪೇನ್"],
            correct: 0
        },
        {
            q: "10. ಪೂರ್ವ ದೇಶಗಳೊಂದಿಗೆ ವ್ಯಾಪಾರ ಮಾಡುವ ಉದ್ದೇಶದಿಂದ `ಡಚ್ ಈಸ್ಟ್ ಇಂಡಿಯಾ ಕಂಪನಿ' ಸ್ಥಾಪಿತ ವರ್ಷ.",
            opts: ["A. ಸಾ.ಶ. 1600", "B. ಸಾ.ಶ. 1601", "C. ಸಾ.ಶ. 1602", "D. ಸಾ.ಶ. 1664"],
            correct: 2
        },
        {
            q: "11. ಭಾರತದಲ್ಲಿ ಡಚ್ಚರ ರಾಜಧಾನಿ ________________ ಆಗಿತ್ತು.",
            opts: ["A. ಕಲ್ಕತ್ತಾ", "B. ಪುಲಿಕಾಟ್", "C. ಗೋವಾ", "D. ಪಾಂಡಿಚೇರಿ"],
            correct: 1
        },
        {
            q: "12. ಪೂರ್ವ ದೇಶಗಳೊಂದಿಗೆ ವ್ಯಾಪಾರ ಮಾಡುವ ಉದ್ದೇಶದಿಂದ `ಇಂಗ್ಲಿಷ್ ಈಸ್ಟ್ ಇಂಡಿಯಾ ಕಂಪನಿ' ಸ್ಥಾಪಿತ ವರ್ಷ.",
            opts: ["A. ಸಾ.ಶ. 1600", "B. ಸಾ.ಶ. 1601", "C. ಸಾ.ಶ. 1602", "D. ಸಾ.ಶ. 1664"],
            correct: 0
        },
        {
            q: "13. ಪೂರ್ವ ದೇಶಗಳೊಂದಿಗೆ ವ್ಯಾಪಾರ ಮಾಡುವ ಉದ್ದೇಶದಿಂದ `ಇಂಗ್ಲಿಷ್ ಈಸ್ಟ್ ಇಂಡಿಯಾ ಕಂಪನಿ' ಗೆ ಅನುಮತಿ ನೀಡಿದ ಇಂಗ್ಲೆಂಡಿನ ರಾಣಿ.",
            opts: ["A. ವಿಕ್ಟೋರಿಯಾ", "B. ಎಲಿಜಬೆತ್", "C. ಆಂಟೋನೆಂಟ್", "D. ಕ್ಯಾಥರಿನ್"],
            correct: 1
        },
        {
            q: "14. ಸಾ.ಶ. 1615 ರಲ್ಲಿ ಸರ್ ಥಾಮಸ್ ರೋನಿಗೆ ಸೂರತ್ ನಲ್ಲಿ ವ್ಯಾಪಾರ ಮಾಡಲು ಅನುಮತಿ ನೀಡಿದ ಮೊಘಲ ಚಕ್ರವರ್ತಿ.",
            opts: ["A. ಫಾರೂಕ್ ಸಿಯಾರ್", "B. ಜಹಾಂಗೀರ್", "C. ಷಹಜಹಾನ್", "D. ಔರಂಗಜೇಬ್"],
            correct: 1
        },
        {
            q: "15. ಭಾರತದಲ್ಲಿ ಬ್ರಿಟಿಷರ ಮೊದಲ ರಾಜಧಾನಿ.",
            opts: ["A. ಕಲ್ಕತ್ತಾ", "B. ಪುಲಿಕಾಟ್", "C. ಗೋವಾ", "D. ಪಾಂಡಿಚೇರಿ"],
            correct: 0
        },
        {
            q: "16. ಹೊಂದಿಸಿ ಬರೆಯಿರಿ:\n೧. ಪೋರ್ಚುಗೀಸರು - ಈ) ಗೋವಾ\n೨. ಡಚ್ಚರು - ಇ) ಪುಲಿಕಾಟ್\n೩. ಫ್ರೆಂಚರು - ಅ) ಪಾಂಡಿಚೇರಿ\n೪. ಬ್ರಿಟಿಷರು - ಆ) ಕಲ್ಕತ್ತಾ",
            opts: ["A. 1-ಅ, 2-ಆ, 3-ಇ, 4-ಈ", "B. 1-ಆ, 2-ಈ, 3-ಅ, 4-ಇ", "C. 1-ಈ, 2-ಆ, 3-ಇ, 4-ಅ", "D. 1-ಈ, 2-ಇ, 3-ಅ, 4-ಆ"],
            correct: 3
        },
        {
            q: "17. ಬ್ರಿಟಿಷರಿಗೆ ದಸ್ತಕಗಳನ್ನು ನೀಡಿದ ಮೊಘಲ ಚಕ್ರವರ್ತಿ.",
            opts: ["A. ಜಹಾಂಗೀರ್", "B. ಷಹಜಹಾನ್", "C. ಫಾರೂಕ್ ಸಿಯಾರ್", "D. ಬಹದ್ದೂರ್ ಷಾ"],
            correct: 2
        },
        {
            q: "18. ಸುಂಕವಿಲ್ಲದ ಮುಕ್ತ ವ್ಯಾಪಾರ ನಡೆಸಲು ಬ್ರಿಟಿಷ್ ವರ್ತಕರಿಗೆ ನೀಡಲಾದ ವಿಶೇಷ ಪರವಾನಿಗೆ ಪತ್ರ (ಪಾಸ್)ಗಳೇ ____________________.",
            opts: ["A. ದಸ್ತಕಗಳು", "B. ಪುಸ್ತಕಗಳು", "C. ಪಟ್ಟಾ ಪತ್ರಗಳು", "D. ವಿಶೇಷ ಬಾಂಡ್‌ಗಳು"],
            correct: 0
        },
        {
            q: "19. ವ್ಯಾಪಾರಕ್ಕಾಗಿ ಭಾರತಕ್ಕೆ ಬಂದ ಕನೆಯ ಯುರೋಪಿಯನ್ನರು.",
            opts: ["A. ಡಚ್ಚರು", "B. ಫ್ರೆಂಚರು", "C. ಪೋರ್ಚುಗೀಸರು", "D. ಇಂಗ್ಲಿಷರು"],
            correct: 1
        },
        {
            q: "20. ಫ್ರೆಂಚ್ ಈಸ್ಟ್ ಇಂಡಿಯಾ ಕಂಪನಿ ಸ್ಥಾಪನೆಯಾದ ವರ್ಷ.",
            opts: ["A. ಸಾ.ಶ. 1600", "B. ಸಾ.ಶ. 1601", "C. ಸಾ.ಶ. 1602", "D. ಸಾ.ಶ. 1664"],
            correct: 3
        },
        {
            q: "21. ಸಾ.ಶ. 1668 ರಲ್ಲಿ ಫ್ರೆಂಚರು ತಮ್ಮ ಪ್ರಥಮ ವ್ಯಾಪಾರಿ ಕೋಠಿಯನ್ನು ಆರಂಭಿಸಿದ್ದು.",
            opts: ["A. ಕಲ್ಕತ್ತಾ", "B. ಪುಲಿಕಾಟ್", "C. ಸೂರತ್", "D. ಪಾಂಡಿಚೇರಿ"],
            correct: 2
        }
    ];

    let currentQIndex = 0;
    let score = 0;
    let isUltraMode = false;
    let timerInterval;
    let timeRemaining = 15;

    function toggleUltraMode() {
        isUltraMode = !isUltraMode;
        document.body.classList.toggle('ultra-mode');
        const btn = document.getElementById('ultraBtn');
        btn.innerText = isUltraMode ? "⚡ ULTRA MODE: ON" : "⚡ ULTRA MODE: OFF";
        restartQuiz();
    }

    function loadQuestion() {
        clearInterval(timerInterval);
        
        if (currentQIndex >= questionsData.length) {
            showResults();
            return;
        }

        const currentQ = questionsData[currentQIndex];
        document.getElementById("qText").innerText = currentQ.q;
        document.getElementById("progressText").innerText = `ಪ್ರಶ್ನೆ ${currentQIndex + 1} / ${questionsData.length}`;
        
        const optsContainer = document.getElementById("optsBox");
        optsContainer.innerHTML = "";

        currentQ.opts.forEach((optText, index) => {
            const button = document.createElement("button");
            button.className = "opt-btn";
            button.innerText = optText;
            button.onclick = () => checkAnswer(index, currentQ.correct);
            optsContainer.appendChild(button);
        });

        if (isUltraMode) {
            startTimer();
        }
    }

    function startTimer() {
        timeRemaining = 15;
        const timerBar = document.getElementById("timerBar");
        timerBar.style.width = "100%";

        timerInterval = setInterval(() => {
            timeRemaining--;
            timerBar.style.width = (timeRemaining / 15) * 100 + "%";
            if (timeRemaining <= 0) {
                clearInterval(timerInterval);
                nextQuestion();
            }
        }, 1000);
    }

    function checkAnswer(selectedIdx, correctIdx) {
        clearInterval(timerInterval);
        const buttons = document.querySelectorAll(".opt-btn");

        buttons.forEach((btn, idx) => {
            btn.disabled = true;
            if (idx === correctIdx) {
                btn.classList.add("correct");
            }
            if (idx === selectedIdx && selectedIdx !== correctIdx) {
                btn.classList.add("wrong");
            }
        });

        if (selectedIdx === correctIdx) {
            score++;
        }
    }

    function nextQuestion() {
        currentQIndex++;
        loadQuestion();
    }

    function showResults() {
        document.getElementById("quiz-body").style.display = "none";
        document.getElementById("result-box").style.display = "block";
        document.getElementById("scoreVal").innerText = score;
    }

    function restartQuiz() {
        currentQIndex = 0;
        score = 0;
        document.getElementById("quiz-body").style.display = "block";
        document.getElementById("result-box").style.display = "none";
        loadQuestion();
    }

    loadQuestion();
</script>

</body>
</html>
