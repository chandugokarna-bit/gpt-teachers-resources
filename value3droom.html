<!DOCTYPE html>
<html lang="kn">
<head>
  <meta charset="UTF-8">
  <title>ಮೌಲ್ಯ ಶಿಕ್ಷಣ 3D ವರ್ಚುವಲ್ ಥಿಯೇಟರ್ - Moral 3D Studio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <style>
    /* 🌌 🏛️ ಲ್ಯಾಪ್ಟಾಪ್ ಫಿಟ್ ಸ್ಕ್ರೀನ್ ಥೀಮ್ (No Scroll - Fits inside 100vh) */
    :root {
      --bg-dark: #05060f;
      --neon-gold: #fbbf24;
      --neon-cyan: #00f2fe;
      --neon-pink: #ff007f;
      --card-bg: rgba(18, 12, 38, 0.85);
      --grid-glow: rgba(251, 191, 36, 0.1);
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden; /* 🎯 ಯಾವುದೇ ಸ್ಕ್ರೋಲ್ ಬಾರದಂತೆ ತಡೆಯುತ್ತದೆ */
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif, "Noto Sans Kannada";
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 50% 15%, rgba(0, 242, 254, 0.15) 0%, transparent 70%),
        linear-gradient(var(--grid-glow) 2px, transparent 2px),
        linear-gradient(90deg, var(--grid-glow) 2px, transparent 2px);
      background-size: 100% 100%, 30px 30px, 30px 30px;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      padding: 10px 15px;
      border: 4px solid var(--neon-gold);
      animation: bodyGlow 6s linear infinite alternate;
    }

    /* 👑 ಮೇಲ್ಭಾಗದ ಕಾಂಪ್ಯಾಕ್ಟ್ ಹೆಡರ್ (ನಿಮ್ಮ ಲ್ಯಾಪ್ಟಾಪ್‌ನಲ್ಲಿ ಸ್ಪಷ್ಟವಾಗಿ ಕಾಣಿಸುತ್ತದೆ) */
    .studio-header {
      text-align: center;
      padding: 8px 15px;
      background: rgba(13, 17, 38, 0.9);
      border: 2px solid var(--neon-gold);
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(251, 191, 36, 0.3);
      margin-bottom: 8px;
      flex-shrink: 0; /* ಹೆಡರ್ ಸೈಜ್ ಕುಗ್ಗದಂತೆ ತಡೆಯುತ್ತದೆ */
    }

    .studio-header h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 900;
      background: linear-gradient(90deg, #fbbf24, #00f2fe, #ff007f);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shineGlow 4s linear infinite;
      letter-spacing: 0.5px;
    }

    .studio-header p { 
      margin: 2px 0 0 0; 
      color: #cbd5e1; 
      font-size: 12px; 
      font-weight: 600; 
    }

    /* 🎬 ಲ್ಯಾಪ್ಟಾಪ್ ಪರದೆಯ ಒಳಗೆ ಪೂರ್ಣ ಫಿಟ್ ಆಗುವ 16:9 ವೈಡ್ ಪ್ಲೇಯರ್ ಬಾಕ್ಸ್ */
    .main-stage-container {
      flex-grow: 1; /* ಉಳಿದ ಇಡೀ ಜಾಗವನ್ನು ಪಡೆಯುತ್ತದೆ */
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 0; /* Flexbox Overflow ತಡೆಯಲು */
      margin-bottom: 8px;
    }

    .theatre-screen-box {
      width: 100%;
      height: 100%;
      max-width: 100%;
      background: #000000;
      border: 3px solid var(--neon-gold);
      border-radius: 14px;
      padding: 6px;
      box-shadow: 0 0 35px rgba(251, 191, 36, 0.4);
      position: relative;
      display: flex;
      flex-direction: column;
    }

    .screen-aspect-ratio-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 10px;
      overflow: hidden;
      background: #02040a;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .screen-aspect-ratio-wrapper iframe {
      position: absolute;
      top: 0; left: 0; 
      width: 100%; height: 100%;
      border: none;
    }

    /* ಆರಂಭದ ಪ್ಲೇಸ್‌ಹೋಲ್ಡರ್ */
    .screen-placeholder {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle, #2d134d 0%, #03010a 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 5; text-align: center; padding: 15px;
    }

    .pulse-icon {
      font-size: 45px; margin-bottom: 8px;
      animation: float 3s ease-in-out infinite;
    }

    /* 🎛️ ಕೆಳಗಿನ ಕಾಂಪ್ಯಾಕ್ಟ್ ಕಂಟ್ರೋಲ್ಸ್ & ಗ್ಯಾಲರಿ ಸೆಲೆಕ್ಟರ್ */
    .bottom-bar {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 6px 12px;
      border-radius: 12px;
      flex-shrink: 0;
    }

    .wall-buttons-group {
      display: flex;
      gap: 8px;
      overflow-x: auto;
    }

    .wall-btn {
      background: rgba(0, 242, 254, 0.1);
      border: 1px solid var(--neon-cyan);
      color: var(--neon-cyan);
      padding: 6px 12px;
      font-size: 12px;
      font-weight: bold;
      border-radius: 20px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .wall-btn:hover {
      background: var(--neon-cyan);
      color: #000;
      box-shadow: 0 0 10px var(--neon-cyan);
    }

    .control-btn {
      background: linear-gradient(135deg, #fbbf24, #d97706);
      border: none;
      color: #000;
      padding: 6px 14px;
      font-size: 12px;
      font-weight: bold;
      border-radius: 20px;
      cursor: pointer;
      white-space: nowrap;
    }

    @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-5px); } }
    @keyframes shineGlow { 0% { background-position: 0% center; } 100% { background-position: 200% center; } }
    @keyframes bodyGlow { 0% { border-color: var(--neon-gold); } 50% { border-color: var(--neon-cyan); } 100% { border-color: var(--neon-pink); } }
  </style>

  <script>
    // 🎯 Error 153 ಬರದಂತೆ ಯೂಟ್ಯೂಬ್ ಸೆಕ್ಯೂರಿಟಿ ತಡೆಯುವ ಫಂಕ್ಷನ್
    function playInTheatreScreen(contentUrl) {
      if(!contentUrl || contentUrl === '') {
        alert("ಈ ಕಂಟೆಂಟ್ ಸದ್ಯದಲ್ಲೇ ಅಪ್ಲೋಡ್ ಆಗಲಿದೆ ಗೆಳೆಯ!");
        return;
      }

      let frameUrl = contentUrl;

      if (contentUrl.includes("youtu.be/") || contentUrl.includes("watch?v=")) {
        let videoId = "";
        if (contentUrl.includes("youtu.be/")) {
          videoId = contentUrl.split("youtu.be/")[1].split("?")[0].split("&")[0];
        } else if (contentUrl.includes("watch?v=")) {
          videoId = contentUrl.split("watch?v=")[1].split("&")[0];
        }
        frameUrl = "https://www.youtube.com/embed/" + videoId + "?autoplay=1&rel=0";
      }

      document.getElementById('screen-placeholder').style.display = 'none';
      let frame = document.getElementById('main-theatre-iframe');
      frame.src = frameUrl;
    }

    function toggleTheatreFullscreen() {
      let target = document.getElementById('fullscreen-target');
      let frame = document.getElementById('main-theatre-iframe');

      if (!frame.src || frame.src === "" || frame.src.endsWith("about:blank")) {
        alert("ಖಾಲಿ ಸ್ಕ್ರೀನ್ ಅನ್ನು ಫುಲ್ ಸ್ಕ್ರೀನ್ ಮಾಡಲು ಸಾಧ್ಯವಿಲ್ಲ! ಮೊದಲು ಯಾವುದಾದರೂ ಕಂಟೆಂಟ್ ಪ್ಲೇ ಮಾಡಿ.");
        return;
      }

      if (!document.fullscreenElement) {
        if (target.requestFullscreen) { target.requestFullscreen(); }
        else if (target.webkitRequestFullscreen) { target.webkitRequestFullscreen(); }
        else if (target.msRequestFullscreen) { target.msRequestFullscreen(); }
      } else {
        if (document.exitFullscreen) { document.exitFullscreen(); }
      }
    }
  </script>
</head>
<body>

  <!-- 👑 ೧. ಮೇಲ್ಭಾಗದ ಕಾಂಪ್ಯಾಕ್ಟ್ ಮೇನ್ ಹೆಡ್‌ಲೈನ್ -->
  <div class="studio-header">
    <h1>🏛️ 3D MORAL EDUCATION CINEMATIC STUDIO</h1>
    <p>ಕರ್ನಾಟಕ ಸರ್ಕಾರದ ೧ ರಿಂದ ೮ನೇ ತರಗತಿ ಮೌಲ್ಯ ಶಿಕ್ಷಣದ ವರ್ಚುವಲ್ 3D ಥಿಯೇಟರ್</p>
  </div>

  <!-- 🎬 ೨. ಲ್ಯಾಪ್ಟಾಪ್ ಸ್ಕ್ರೀನ್‌ನಲ್ಲಿ ಪೂರ್ಣ ಫಿಟ್ ಆಗುವ 16:9 ಥಿಯೇಟರ್ ಸ್ಕ್ರೀನ್ -->
  <div class="main-stage-container">
    <div class="theatre-screen-box">
      <div class="screen-aspect-ratio-wrapper" id="fullscreen-target">
        
        <!-- ಪ್ಲೇಸ್‌ಹೋಲ್ಡರ್ -->
        <div class="screen-placeholder" id="screen-placeholder">
          <div class="pulse-icon">🏛️</div>
          <h3 style="margin: 0 0 6px 0; color: var(--neon-gold);">
            Ultra 16:9 Screen Fits Perfectly Inside Screen
          </h3>
          <p style="opacity: 0.85; margin:0; font-size:12.5px; color:#cbd5e1;">
            ಕೆಳಗಿನ ಮೌಲ್ಯಗಳ ಗೋಡೆ ಅಥವಾ ಸಬ್-ಮೌಲ್ಯಗಳ ಲಿಂಕ್ ಒತ್ತಿ ದೊಡ್ಡ ಪರದೆಯಲ್ಲಿ ವೀಕ್ಷಿಸಿ!
          </p>
        </div>
        
        <!-- Error 153 ಬರದಂತೆ ತಡೆಯುವ ಐಫ್ರೇಮ್ -->
        <iframe 
          id="main-theatre-iframe" 
          src="" 
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
          referrerpolicy="strict-origin-when-cross-origin" 
          allowfullscreen>
        </iframe>
      </div>
    </div>
  </div>

  <!-- 🎛️ ೩. ಕೆಳಗಿನ ಕಾಂಪ್ಯಾಕ್ಟ್ ಗ್ಯಾಲರಿ ಸೆಲೆಕ್ಟರ್ ಬಾರ್ -->
  <div class="bottom-bar">
    <div class="wall-buttons-group">
      <button class="wall-btn" onclick="playInTheatreScreen('value3droom/file/ಮೌಲ್ಯ ಗಂಗೋತ್ರಿಮೌಲ್ಯ ಕೇಂದ್ರಿತ ಕೊಠಡಿ.html')">🏛️ 1. ಮೌಲ್ಯ ಗಂಗೋತ್ರಿಮೌಲ್ಯ ಕೇಂದ್ರಿತ ಕೊಠಡಿ</button>
      <button class="wall-btn" onclick="playInTheatreScreen('value3droom/file/ಗೌರವ ಮೌಲ್ಯದ ಭವ್ಯ ವರ್ಚುವಲ್ ಕೊಠಡಿ.html')">🏛️ 1. ಗೌರವ ಮೌಲ್ಯದ ಭವ್ಯ ವರ್ಚುವಲ್ ಕೊಠಡಿ</button>
      <button class="wall-btn" onclick="playInTheatreScreen('value3droom/file/ಸುರಕ್ಷಾ ಕವಚ ಸುರಕ್ಷತೆ ಮತ್ತು ಜಾಗೃತಿಯ 3D ವರ್ಚುವಲ್ ಕೊಠಡಿ.html')">🏛️ 1. ಸುರಕ್ಷಾ ಕವಚ ಸುರಕ್ಷತೆ ಮತ್ತು ಜಾಗೃತಿಯ 3D ವರ್ಚುವಲ್ ಕೊಠಡಿ</button>
      <button class="wall-btn" onclick="playInTheatreScreen('https://youtu.be/pYeHKRk7n9I')">📖 2. ನೀತಿ ಕಥೆಗಳ ಗ್ಯಾಲರಿ</button>
      <button class="wall-btn" onclick="playInTheatreScreen('https://youtu.be/yIU0urh0r5M')">⚖️ 3. ಸಂವಿಧಾನಿಕ ಮೌಲ್ಯಗಳು</button>
      <button class="wall-btn" onclick="playInTheatreScreen('https://youtu.be/yOpvpmfm-w8')">🌳 4. ಪರಿಸರ & ಜೀವದಯೆ</button>
    </div>
    <button class="control-btn" onclick="toggleTheatreFullscreen()">🔲 Full Screen</button>
  </div>

</body>
</html>
