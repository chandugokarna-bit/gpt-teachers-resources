<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D AI ಶಿಕ್ಷಕ - ಸಮಾಜ ವಿಜ್ಞಾನ</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #0f172a;
            color: #fff;
        }

        #app-container {
            display: flex;
            flex-direction: column;
            width: 100vw;
            height: 100dvh;
            position: relative;
        }

        #robot-speech {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.96);
            color: #0f172a;
            padding: 15px 20px;
            border-radius: 18px;
            font-size: 1.05rem;
            line-height: 1.45;
            width: 90%;
            max-width: 540px;
            max-height: 25vh;
            overflow-y: auto;
            display: none;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
            z-index: 10;
            font-weight: 600;
        }

        #canvas-container {
            flex: 1;
            width: 100%;
            position: relative;
            z-index: 1;
        }

        #ui-container {
            width: 100%;
            background: rgba(15, 23, 42, 0.98);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 16px 14px 24px 14px;
            border-top: 1.5px solid rgba(255, 255, 255, 0.18);
            text-align: center;
            z-index: 10;
        }

        .status-box {
            margin-bottom: 12px;
            font-size: 1rem;
            color: #38bdf8;
            font-weight: 600;
        }

        .controls {
            display: flex;
            gap: 10px;
            max-width: 550px;
            margin: 0 auto;
            align-items: center;
        }

        input[type="text"] {
            flex: 1;
            padding: 13px 18px;
            border-radius: 25px;
            border: 1.5px solid rgba(255, 255, 255, 0.3);
            outline: none;
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
            font-size: 1rem;
            min-width: 0;
        }

        input[type="text"]::placeholder {
            color: #94a3b8;
        }

        button {
            background: #0284c7;
            color: white;
            border: none;
            padding: 13px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            white-space: nowrap;
        }

        button:active { transform: scale(0.95); }

        button.mic-active {
            background: #ef4444;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        #loading-overlay {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #38bdf8;
            font-size: 1.1rem;
            font-weight: 600;
            z-index: 5;
            text-align: center;
        }
    </style>

    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

    <div id="app-container">
        <div id="loading-overlay">3D AI ಶಿಕ್ಷಕ ಸಿದ್ಧವಾಗುತ್ತಿದೆ...</div>
        <div id="robot-speech">ನಮಸ್ಕಾರ! ನಾನು ನಿಮ್ಮ 6, 7 ಮತ್ತು 8ನೇ ತರಗತಿಯ ಸಮಾಜ ವಿಜ್ಞಾನ AI ಶಿಕ್ಷಕ. ಯಾವುದೇ ಪ್ರಶ್ನೆ ಕೇಳಿ!</div>

        <div id="canvas-container"></div>

        <div id="ui-container">
            <div class="status-box" id="status">ಪ್ರಶ್ನೆ ಕೇಳಲು ಮೈಕ್ ಒತ್ತಿ ಅಥವಾ ಟೈಪ್ ಮಾಡಿ...</div>
            <div class="controls">
                <input type="text" id="user-input" placeholder="ಇಲ್ಲಿ ಟೈಪ್ ಮಾಡಿ..." />
                <button id="mic-btn">🎙️ ಮೈಕ್</button>
                <button id="send-btn">ಕಳುಹಿಸಿ</button>
            </div>
        </div>
    </div>

    <script>
        // 1. Three.js Scene Setup
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0f172a);

        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.outputEncoding = THREE.sRGBEncoding;
        container.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 1.5);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0x38bdf8, 1.8);
        dirLight.position.set(2, 5, 3);
        scene.add(dirLight);

        let robotModel;
        let mixer;
        const loader = new THREE.GLTFLoader();
        const robotURL = 'https://threejs.org/examples/models/gltf/RobotExpressive/RobotExpressive.glb';

        function adjustLayout() {
            const width = container.clientWidth;
            const height = container.clientHeight;
            const isMobile = width < 600;

            camera.aspect = width / height;
            camera.position.set(0, isMobile ? 1.5 : 1.2, isMobile ? 6.2 : 4.2);
            camera.updateProjectionMatrix();

            if (robotModel) {
                const scale = isMobile ? 0.22 : 0.30;
                robotModel.scale.set(scale, scale, scale);
                robotModel.position.set(0, isMobile ? -0.1 : -0.2, 0);
            }
        }

        loader.load(robotURL, (gltf) => {
            document.getElementById('loading-overlay').style.display = 'none';
            robotModel = gltf.scene;
            scene.add(robotModel);
            adjustLayout();

            if (gltf.animations && gltf.animations.length) {
                mixer = new THREE.AnimationMixer(robotModel);
                const idleAnim = gltf.animations.find(a => a.name === 'Idle' || a.name === 'Wave') || gltf.animations[0];
                if (idleAnim) mixer.clipAction(idleAnim).play();
            }
        }, undefined, (err) => {
            document.getElementById('loading-overlay').innerText = '3D ಮಾದರಿ ಲೋಡ್ ಮಾಡಲು ಸಾಧ್ಯವಾಗಲಿಲ್ಲ.';
        });

        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            if (mixer) mixer.update(delta);
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            renderer.setSize(container.clientWidth, container.clientHeight);
            adjustLayout();
        });

        // 2. High-Precision Textbook Knowledge Base
        const textbookQA = [
            {
                // Exact match for Constitution definition
                matches: (q) => q.includes("ಸಂವಿಧಾನ ಎಂದರೇನು") || q.includes("ಸಂವಿಧಾನ ಅಂದರೆ ಏನು") || q.includes("ಸಂವಿಧಾನದ ಅರ್ಥ") || (q.includes("ಸಂವಿಧಾನ") && (q.includes("ಏನು") || q.includes("ಎಂದರೆ")) && !q.includes("ಶಿಲ್ಪಿ") && !q.includes("ಯಾರು")),
                ans: "ಸಂವಿಧಾನ ಎಂಬುದು ದೇಶದ ಆಡಳಿತಕ್ಕೆ ಸಂಬಂಧಿಸಿದ ಮೂಲಭೂತ ನಿಯಮ ಮತ್ತು ಶಾಸನಗಳ ಅಧಿಕೃತ ಸಂಗ್ರಹ. ಇದು ಪ್ರಜೆಗಳ ಹಕ್ಕು ಮತ್ತು ಕರ್ತವ್ಯಗಳನ್ನು ಹಾಗೂ ಸರ್ಕಾರದ ಅಂಗಗಳ ಕಾರ್ಯವ್ಯಾಪ್ತಿಯನ್ನು ನಿರೂಪಿಸುತ್ತದೆ."
            },
            {
                matches: (q) => q.includes("ಸಂವಿಧಾನ ಶಿಲ್ಪಿ") || q.includes("ಕರಡು ಸಮಿತಿ") || (q.includes("ಸಂವಿಧಾನ") && (q.includes("ಯಾರು") || q.includes("ರಚಿಸಿದವರು") || q.includes("ಅಧ್ಯಕ್ಷ"))),
                ans: "ಡಾ. ಬಿ.ಆರ್. ಅಂಬೇಡ್ಕರ್ ಅವರು ಭಾರತೀಯ ಸಂವಿಧಾನದ ಕರಡು ರಚನಾ ಸಮಿತಿಯ ಅಧ್ಯಕ್ಷರಾಗಿದ್ದರು. ಇವರನ್ನು 'ಭಾರತೀಯ ಸಂವಿಧಾನದ ಶಿಲ್ಪಿ' ಎಂದು ಗೌರವಿಸಲಾಗುತ್ತದೆ."
            },
            {
                matches: (q) => q.includes("ಪ್ರಜಾಪ್ರಭುತ್ವ"),
                ans: "ಅಮೆರಿಕಾದ ಮಾಜಿ ಅಧ್ಯಕ್ಷ ಅಬ್ರಹಾಂ ಲಿಂಕನ್ ಅವರ ಪ್ರಕಾರ, 'ಪ್ರಜಾಪ್ರಭುತ್ವ ಎಂದರೆ ಪ್ರಜೆಗಳಿಂದ, ಪ್ರಜೆಗಳಿಗಾಗಿ ಮತ್ತು ಪ್ರಜೆಗಳಿಗೋಸ್ಕರ ಇರುವ ಸರ್ಕಾರ'. ಇದರಲ್ಲಿ ಅಂತಿಮ ಪರಮಾಧಿಕಾರ ಪ್ರಜೆಗಳ ಕೈಯಲ್ಲಿರುತ್ತದೆ."
            },
            {
                matches: (q) => q.includes("ಮತದಾನ"),
                ans: "ಭಾರತದಲ್ಲಿ ಜಾತಿ, ಮತ, ಲಿಂಗ ಭೇದವಿಲ್ಲದೆ 18 ವರ್ಷ ಪೂರ್ಣಗೊಂಡ ಪ್ರತಿಯೊಬ್ಬ ವಯಸ್ಕ ಪ್ರಜೆಗೂ ಸಾರ್ವತ್ರಿಕ ಮತದಾನದ ಹಕ್ಕನ್ನು ಸಂವಿಧಾನ ನೀಡಿದೆ."
            },
            {
                matches: (q) => q.includes("ರಾಜ್ಯಶಾಸ್ತ್ರದ ಪಿತಾಮಹ"),
                ans: "ರಾಜ್ಯಶಾಸ್ತ್ರದ ಪಿತಾಮಹ ಗ್ರೀಕ್ ತತ್ವಜ್ಞಾನಿ ಅರಿಸ್ಟಾಟಲ್. ಈತನು ರಾಜ್ಯಶಾಸ್ತ್ರದ ಬಗೆಗಿನ ಪ್ರಪಂಚದ ಪ್ರಥಮ ಗ್ರಂಥವಾದ 'ಪಾಲಿಟಿಕ್ಸ್' ಅನ್ನು ರಚಿಸಿದನು."
            },
            {
                matches: (q) => q.includes("ಇತಿಹಾಸದ ಪಿತಾಮಹ"),
                ans: "ಇತಿಹಾಸದ ಪಿತಾಮಹ ಗ್ರೀಕ್ ದೇಶದ ಹೆರೊಡೋಟಸ್. ಗತಕಾಲದ ಘಟನೆಗಳನ್ನು ಕಾಲ, ಸ್ಥಳ ಮತ್ತು ವ್ಯಕ್ತಿಗಳ ಆಧಾರದ ಮೇಲೆ ಕ್ರಮಬದ್ಧವಾಗಿ ನಿರೂಪಿಸುವುದನ್ನು ಈತ ಮೊದಲು ತೋರಿಸಿಕೊಟ್ಟನು."
            },
            {
                matches: (q) => q.includes("ಹಲ್ಮಿಡಿ"),
                ans: "ಕನ್ನಡ ಭಾಷೆಯಲ್ಲಿ ದೊರೆತಿರುವ ಮೊಟ್ಟಮೊದಲ ಶಾಸನ ಹಲ್ಮಿಡಿ ಶಾಸನ. ಇದು ಕದಂಬ ಮನೆತನದ ರಾಜ ಕಾಕುತ್ಸವರ್ಮನ ಆಳ್ವಿಕೆಯ ಕಾಲಕ್ಕೆ (ಕ್ರಿ.ಶ. 5ನೇ ಶತಮಾನ) ಸೇರಿದ ಪ್ರಾಚೀನ ಶಾಸನವಾಗಿದೆ."
            },
            {
                matches: (q) => q.includes("ಮೌರ್ಯ") && (q.includes("ಸ್ಥಾಪಕ") || q.includes("ಯಾರು")),
                ans: "ಮೌರ್ಯ ಸಾಮ್ರಾಜ್ಯದ ಸ್ಥಾಪಕ ಚಂದ್ರಗುಪ್ತ ಮೌರ್ಯ. ಈತನು ಚಾಣಕ್ಯನ ಮಾರ್ಗದರ್ಶನದಲ್ಲಿ ನಂದ ವಂಶದ ಧನನಂದನನ್ನು ಸೋಲಿಸಿ ಮೌರ್ಯ ಸಾಮ್ರಾಜ್ಯವನ್ನು ಸ್ಥಾಪಿಸಿದನು."
            },
            {
                matches: (q) => q.includes("ಅಶೋಕ") || q.includes("ಕಳಿಂಗ ಯುದ್ಧ"),
                ans: "ಸಾಮ್ರಾಟ ಅಶೋಕನು ಮೌರ್ಯರ ಶ್ರೇಷ್ಠ ಚಕ್ರವರ್ತಿ. ಕಳಿಂಗ ಯುದ್ಧದ ಭೀಕರ ರಕ್ತಪಾತದಿಂದ ಮನನೊಂದು ಯುದ್ಧ ತ್ಯಜಿಸಿದ ಅಶೋಕನು, ಬುದ್ಧನ ಅಹಿಂಸಾ ಮಾರ್ಗ ಮತ್ತು ಧರ್ಮವನ್ನು ಸ್ವೀಕರಿಸಿ ಪ್ರಚಾರ ಮಾಡಿದನು."
            },
            {
                matches: (q) => q.includes("ಅರ್ಥಶಾಸ್ತ್ರ") && (q.includes("ಬರೆದ") || q.includes("ಕರ್ತೃ") || q.includes("ಕೌಟಿಲ್ಯ") || q.includes("ಚಾಣಕ್ಯ")),
                ans: "ಚಂದ್ರಗುಪ್ತ ಮೌರ್ಯನ ಪ್ರಧಾನಮಂತ್ರಿ ಕೌಟಿಲ್ಯನು (ಚಾಣಕ್ಯ) 'ಅರ್ಥಶಾಸ್ತ್ರ' ಕೃತಿಯನ್ನು ರಚಿಸಿದನು. ಇದು ಪ್ರಾಚೀನ ಭಾರತದ ರಾಜನೀತಿ ಮತ್ತು ಆಡಳಿತಕ್ಕೆ ಸಂಬಂಧಿಸಿದ ಶ್ರೇಷ್ಠ ಗ್ರಂಥ."
            },
            {
                matches: (q) => q.includes("ಬಸವಣ್ಣ") || q.includes("ಬಸವೇಶ್ವರ") || q.includes("ಕಾಯಕವೇ ಕೈಲಾಸ"),
                ans: "ವಿಶ್ವಗುರು ಬಸವಣ್ಣನವರು 12ನೇ ಶತಮಾನದ ಸಾಮಾಜಿಕ ಕ್ರಾಂತಿಯ ಹರಿಕಾರರು. ಇವರು 'ಕಾಯಕವೇ ಕೈಲಾಸ' ಹಾಗೂ 'ದೇಹವೇ ದೇಗುಲ' ಎಂದು ಸಾರಿದರು ಮತ್ತು ಬಸವಕಲ್ಯಾಣದಲ್ಲಿ 'ಅನುಭವ ಮಂಟಪ' ಸ್ಥಾಪಿಸಿದರು."
            },
            {
                matches: (q) => q.includes("ವಿಜಯನಗರ") && (q.includes("ಸ್ಥಾಪಕ") || q.includes("ರಾಜಧಾನಿ") || q.includes("ಕೃಷ್ಣದೇವರಾಯ")),
                ans: "ವಿಜಯನಗರ ಸಾಮ್ರಾಜ್ಯವನ್ನು ಕ್ರಿ.ಶ. 1336ರಲ್ಲಿ ತುಂಗಭದ್ರಾ ನದಿಯ ದಂಡೆಯ ಮೇಲೆ ಹರಿಹರ ಮತ್ತು ಬುಕ್ಕರಾಯರು ಸ್ಥಾಪಿಸಿದರು. ಇದರ ರಾಜಧಾನಿ ಹಂಪಿ ಹಾಗೂ ಅತ್ಯಂತ ಶ್ರೇಷ್ಠ ರಾಜ ಶ್ರೀಕೃಷ್ಣದೇವರಾಯ."
            },
            {
                matches: (q) => q.includes("ಗೋಲ್ ಗುಂಬಜ್") || q.includes("ಗೋಳಗುಮ್ಮಟ"),
                ans: "ವಿಜಯಪುರದ ಗೋಲ್ ಗುಂಬಜ್ (ಗೋಳಗುಮ್ಮಟ) ಅನ್ನು ಮೊಹಮ್ಮದ್ ಆದಿಲ್ ಷಾ ನಿರ್ಮಿಸಿದನು. ಇದು ಜಗತ್ಪ್ರಸಿದ್ಧ ಪಿಸುಗುಟ್ಟುವ ಮೊಗಸಾಲೆ (Whispering Gallery) ಹೊಂದಿರುವ ಬೃಹತ್ ವಾಸ್ತುಶಿಲ್ಪವಾಗಿದೆ."
            },
            {
                matches: (q) => q.includes("ಕರ್ನಾಟಕ") && (q.includes("ಏಕೀಕರಣ") || q.includes("ನಾಮಕರಣ")),
                ans: "ಭಾಷಾವಾರು ಪ್ರಾಂತ್ಯಗಳ ಆಧಾರದ ಮೇಲೆ 1956ರ ನವೆಂಬರ್ 1ರಂದು 'ವಿಶಾಲ ಮೈಸೂರು ರಾಜ್ಯ' ಉದಯವಾಯಿತು. ನಂತರ 1973ರ ನವೆಂಬರ್ 1ರಂದು ಮುಖ್ಯಮಂತ್ರಿ ಡಿ. ದೇವರಾಜ ಅರಸು ಅವರು 'ಕರ್ನಾಟಕ' ಎಂದು ಮರುನಾಮಕರಣ ಮಾಡಿದರು."
            },
            {
                matches: (q) => q.includes("ವಾಸ್ಕೋಡಿಗಾಮ"),
                ans: "ಪೋರ್ಚುಗೀಸ್ ನಾವಿಕ ವಾಸ್ಕೋಡಿಗಾಮನು ಕ್ರಿ.ಶ. 1498ರ ಮೇ 17ರಂದು ಆಫ್ರಿಕಾದ ಕೇಪ್ ಆಫ್ ಗುಡ್ ಹೋಪ್ ಮಾರ್ಗವಾಗಿ ಭಾರತದ ಕಲ್ಲಿಕೋಟೆಗೆ ತಲುಪಿ ನೂತನ ಜಲಮಾರ್ಗವನ್ನು ಕಂಡುಹಿಡಿದನು."
            },
            {
                matches: (q) => q.includes("ಪ್ಲಾಸಿ ಕದನ"),
                ans: "ಪ್ಲಾಸಿ ಕದನವು ಕ್ರಿ.ಶ. 1757ರಲ್ಲಿ ಬಂಗಾಳದ ನವಾಬ ಸಿರಾಜ್-ಉದ್-ದೌಲ್ ಮತ್ತು ಬ್ರಿಟಿಷ್ ಸೇನಾನಿ ರಾಬರ್ಟ್ ಕ್ಲೈವ್ ನಡುವೆ ನಡೆಯಿತು. ಇದು ಭಾರತದಲ್ಲಿ ಬ್ರಿಟಿಷ್ ಆಳ್ವಿಕೆಯ ಭದ್ರ ಬುನಾದಿಗೆ ಕಾರಣವಾಯಿತು."
            },
            {
                matches: (q) => q.includes("ನೀಲಿ ಗ್ರಹ") || q.includes("ಜೀವಂತ ಗ್ರಹ"),
                ans: "ಭೂಮಿಯನ್ನು 'ನೀಲಿ ಗ್ರಹ' ಅಥವಾ 'ಜೀವಂತ ಗ್ರಹ' ಎಂದು ಕರೆಯಲಾಗುತ್ತದೆ. ಏಕೆಂದರೆ ಭೂಮಿಯ ಶೇಕಡ 71ರಷ್ಟು ಭಾಗ ನೀರಿನಿಂದ ಆವೃತವಾಗಿದ್ದು, ಜೀವಿಗಳನ್ನು ಹೊಂದಿರುವ ಏಕೈಕ ಗ್ರಹವಾಗಿದೆ."
            },
            {
                matches: (q) => q.includes("ಅರ್ಥಶಾಸ್ತ್ರದ ಪಿತಾಮಹ"),
                ans: "ಅರ್ಥಶಾಸ್ತ್ರದ ಪಿತಾಮಹ ಆಡಂ ಸ್ಮಿತ್. ಈತನು ಸಂಪತ್ತಿನ ಉತ್ಪಾದನೆ, ವಿತರಣೆ ಮತ್ತು ಅನುಭೋಗವನ್ನು ವೈಜ್ಞಾನಿಕವಾಗಿ ನಿರೂಪಿಸಿದನು."
            },
            {
                matches: (q) => q.includes("ಸಮಾಜಶಾಸ್ತ್ರದ ಪಿತಾಮಹ"),
                ans: "ಸಮಾಜಶಾಸ್ತ್ರದ ಪಿತಾಮಹ ಫ್ರಾನ್ಸ್ ದೇಶದ ಆಗಸ್ಟ್ ಕಾಮೆ. ಈತನು ಮಾನವ ಸಮಾಜ ಮತ್ತು ಸಾಮಾಜಿಕ ಸಂಬಂಧಗಳನ್ನು ಕ್ರಮಬದ್ಧವಾಗಿ ಅಧ್ಯಯನ ಮಾಡುವ ಶಾಸ್ತ್ರಕ್ಕೆ 'ಸಮಾಜಶಾಸ್ತ್ರ' ಎಂದು ನಾಮಕರಣ ಮಾಡಿದನು."
            }
        ];

        // 3. Gemini API Call with Latest Model (gemini-2.5-flash) & Safe Fallback
        const GEMINI_API_KEY = "AIzaSyAEug0pNy4uR2HSkRjGwikj6SkXkTagvkQ";

        async function fetchAIResponse(questionText) {
            const statusBox = document.getElementById('status');
            const trimmedQ = questionText.trim();

            if (!trimmedQ) {
                statusBox.innerText = "ದಯವಿಟ್ಟು ಏನಾದರೂ ಪ್ರಶ್ನೆ ಕೇಳಿ!";
                return;
            }

            statusBox.innerText = "ಉತ್ತರವನ್ನು ಸಿದ್ಧಪಡಿಸಲಾಗುತ್ತಿದೆ...";

            // Clean query for local matching (strip ?, !, ., etc.)
            const cleanQ = trimmedQ.replace(/[?!.,;:]/g, "").trim();

            // Check Local Textbook Engine First
            for (let item of textbookQA) {
                if (item.matches(cleanQ)) {
                    showAndSpeakReply(item.ans);
                    return;
                }
            }

            // Fallback to Gemini 2.5 Flash API
            const prompt = `ನೀವು ಕರ್ನಾಟಕ ಪಠ್ಯಕ್ರಮದ 6, 7 ಮತ್ತು 8ನೇ ತರಗತಿಯ ಸಮಾಜ ವಿಜ್ಞಾನ ಶಿಕ್ಷಕರು. ವಿದ್ಯಾರ್ಥಿಯ ಈ ಪ್ರಶ್ನೆಗೆ ಪಠ್ಯಪುಸ್ತಕದ ಆಧಾರದಲ್ಲಿ ನೇರವಾಗಿ, ನಿಖರವಾಗಿ ಗರಿಷ್ಠ 2 ರಿಂದ 3 ವಾಕ್ಯಗಳಲ್ಲಿ ಕನ್ನಡದಲ್ಲಿ ಉತ್ತರಿಸಿ: "${trimmedQ}"`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });

                const data = await response.json();
                if (data.candidates && data.candidates[0].content && data.candidates[0].content.parts[0].text) {
                    showAndSpeakReply(data.candidates[0].content.parts[0].text);
                } else {
                    // Safe textbook fallback without raw API error
                    showAndSpeakReply(`ನಿಮ್ಮ ಪ್ರಶ್ನೆ: "${trimmedQ}". 6, 7 ಮತ್ತು 8ನೇ ತರಗತಿಯ ಸಮಾಜ ವಿಜ್ಞಾನದ ಇತಿಹಾಸ, ಪೌರನೀತಿ, ಭೂಗೋಳ ಅಥವಾ ಅರ್ಥಶಾಸ್ತ್ರದ ವಿಷಯಗಳ ಕುರಿತು ನಿರ್ದಿಷ್ಟವಾಗಿ ಕೇಳಿ!`);
                }
            } catch (error) {
                // Network/API error safe fallback
                showAndSpeakReply(`ನಿಮ್ಮ ಪ್ರಶ್ನೆ: "${trimmedQ}". 6, 7 ಮತ್ತು 8ನೇ ತರಗತಿಯ ಸಮಾಜ ವಿಜ್ಞಾನದ ಇತಿಹಾಸ, ಪೌರನೀತಿ, ಭೂಗೋಳ ಅಥವಾ ಅರ್ಥಶಾಸ್ತ್ರದ ವಿಷಯಗಳ ಕುರಿತು ನಿರ್ದಿಷ್ಟವಾಗಿ ಕೇಳಿ!`);
            }
        }

        function showAndSpeakReply(text) {
            const speechBubble = document.getElementById('robot-speech');
            const statusBox = document.getElementById('status');
            
            speechBubble.innerText = text;
            speechBubble.style.display = 'block';
            statusBox.innerText = "ಉತ್ತರಿಸಲಾಗಿದೆ!";

            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'kn-IN';
                utterance.rate = 0.85;
                window.speechSynthesis.speak(utterance);
            }
        }

        // 4. Voice Recognition & Button Controls
        const micBtn = document.getElementById('mic-btn');
        const sendBtn = document.getElementById('send-btn');
        const userInput = document.getElementById('user-input');
        const statusBox = document.getElementById('status');

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            const recognition = new SpeechRecognition();
            recognition.lang = 'kn-IN';

            recognition.onstart = () => {
                micBtn.classList.add('mic-active');
                statusBox.innerText = "ಆಲಿಸಲಾಗುತ್ತಿದೆ... (ಮಾತನಾಡಿ)";
            };

            recognition.onresult = (e) => {
                const text = e.results[0][0].transcript;
                userInput.value = text;
                micBtn.classList.remove('mic-active');
                fetchAIResponse(text);
            };

            recognition.onerror = () => {
                statusBox.innerText = "ಧ್ವನಿ ಗ್ರಹಿಸಲು ಸಾಧ್ಯವಾಗಲಿಲ್ಲ. ಟೈಪ್ ಮಾಡಿ ಕಳುಹಿಸಿ.";
                micBtn.classList.remove('mic-active');
            };

            micBtn.addEventListener('click', () => recognition.start());
        } else {
            statusBox.innerText = "ಬ್ರೌಸರ್‌ನಲ್ಲಿ ಮೈಕ್ ಬೆಂಬಲಿಸುತ್ತಿಲ್ಲ, ಕ್ರೋಮ್ ಬಳಸಿ.";
            micBtn.disabled = true;
        }

        sendBtn.addEventListener('click', () => fetchAIResponse(userInput.value));
        userInput.addEventListener("keypress", (e) => { if (e.key === "Enter") fetchAIResponse(userInput.value); });
    </script>
</body>
