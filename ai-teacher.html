<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D AI ಶಿಕ್ಷಕ - ಸಮಾಜ ವಿಜ್ಞಾನ | GPT Teachers Resources</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #0f172a;
            color: #fff;
        }

        #app-container {
            display: flex;
            flex-direction: column;
            width: 100vw;
            height: 100dvh;
            position: relative;
        }

        /* Top AI Speech Box */
        #robot-speech {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.96);
            color: #0f172a;
            padding: 14px 18px;
            border-radius: 16px;
            font-size: 1.05rem;
            line-height: 1.4;
            width: 90%;
            max-width: 500px;
            max-height: 25vh;
            overflow-y: auto;
            display: none;
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
            z-index: 10;
            font-weight: 600;
        }

        /* 3D Canvas Area */
        #canvas-container {
            flex: 1;
            width: 100%;
            position: relative;
            z-index: 1;
        }

        /* Bottom UI Panel - Fixed Height for Mobile */
        #ui-container {
            width: 100%;
            background: rgba(15, 23, 42, 0.98);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 16px 14px 24px 14px;
            border-top: 1.5px solid rgba(255, 255, 255, 0.2);
            text-align: center;
            z-index: 10;
        }

        .status-box {
            margin-bottom: 12px;
            font-size: 1rem;
            color: #38bdf8;
            font-weight: 600;
        }

        .controls {
            display: flex;
            gap: 10px;
            max-width: 550px;
            margin: 0 auto;
            align-items: center;
        }

        input[type="text"] {
            flex: 1;
            padding: 14px 16px;
            border-radius: 25px;
            border: 1.5px solid rgba(255, 255, 255, 0.3);
            outline: none;
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            font-size: 1rem;
            min-width: 0;
        }

        input[type="text"]::placeholder {
            color: #94a3b8;
        }

        button {
            background: #0284c7;
            color: white;
            border: none;
            padding: 14px 18px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            white-space: nowrap;
        }

        button:active {
            transform: scale(0.95);
        }

        button.mic-active {
            background: #ef4444;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        #loading-overlay {
            position: absolute;
            top: 35%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #38bdf8;
            font-size: 1.1rem;
            font-weight: 600;
            z-index: 5;
            text-align: center;
        }
    </style>

    <!-- Three.js Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

    <div id="app-container">
        <div id="loading-overlay">3D AI ಶಿಕ್ಷಕ ಸಿದ್ಧವಾಗುತ್ತಿದೆ...</div>
        <div id="robot-speech">ನಮಸ್ಕಾರ! ನಾನು ನಿಮ್ಮ ಸಮಾಜ ವಿಜ್ಞಾನ AI ಶಿಕ್ಷಕ. 6 ಮತ್ತು 7ನೇ ತರಗತಿಯ ಸಮಾಜ ವಿಜ್ಞಾನದ ಯಾವುದೇ ಪ್ರಶ್ನೆ ಕೇಳಿ!</div>

        <!-- 3D Canvas Area -->
        <div id="canvas-container"></div>

        <!-- Bottom Controls -->
        <div id="ui-container">
            <div class="status-box" id="status">ಪ್ರಶ್ನೆ ಕೇಳಲು ಮೈಕ್ ಒತ್ತಿ ಅಥವಾ ಟೈಪ್ ಮಾಡಿ...</div>
            <div class="controls">
                <input type="text" id="user-input" placeholder="ಇಲ್ಲಿ ಟೈಪ್ ಮಾಡಿ..." />
                <button id="mic-btn">🎙️ ಮೈಕ್</button>
                <button id="send-btn">ಕಳುಹಿಸಿ</button>
            </div>
        </div>
    </div>

    <script>
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0f172a);

        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.outputEncoding = THREE.sRGBEncoding;
        container.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 1.5);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0x38bdf8, 1.8);
        dirLight.position.set(2, 5, 3);
        scene.add(dirLight);

        let robotModel;
        let mixer;
        const loader = new THREE.GLTFLoader();
        const robotURL = 'https://threejs.org/examples/models/gltf/RobotExpressive/RobotExpressive.glb';

        function adjustLayout() {
            const width = container.clientWidth;
            const height = container.clientHeight;
            const isMobile = width < 600;

            camera.aspect = width / height;
            
            // Camera position tuned for mobile screen
            camera.position.set(0, isMobile ? 1.5 : 1.2, isMobile ? 7.5 : 4.5);
            camera.updateProjectionMatrix();

            if (robotModel) {
                const scale = isMobile ? 0.20 : 0.30;
                robotModel.scale.set(scale, scale, scale);
                robotModel.position.set(0, isMobile ? -0.2 : -0.3, 0);
            }
        }

        loader.load(robotURL, (gltf) => {
            document.getElementById('loading-overlay').style.display = 'none';
            robotModel = gltf.scene;
            scene.add(robotModel);
            adjustLayout();

            if (gltf.animations && gltf.animations.length) {
                mixer = new THREE.AnimationMixer(robotModel);
                const idleAnim = gltf.animations.find(a => a.name === 'Idle' || a.name === 'Wave') || gltf.animations[0];
                if (idleAnim) mixer.clipAction(idleAnim).play();
            }
        });

        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            if (mixer) mixer.update(delta);
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            renderer.setSize(container.clientWidth, container.clientHeight);
            adjustLayout();
        });

        // Gemini AI Setup
        const GEMINI_API_KEY = "AIzaSyAEug0pNy4uR2HSkRjGwikj6SkXkTagvkQ";

        async function fetchAIResponse(questionText) {
            const statusBox = document.getElementById('status');
            const trimmedQ = questionText.trim();

            if (!trimmedQ) {
                statusBox.innerText = "ದಯವಿಟ್ಟು ಏನಾದರೂ ಪ್ರಶ್ನೆ ಕೇಳಿ!";
                return;
            }

            statusBox.innerText = "ಉತ್ತರವನ್ನು AI ಯೋಚಿಸುತ್ತಿದೆ...";

            const promptText = `ನೀವು ಕರ್ನಾಟಕ ರಾಜ್ಯ ಪಠ್ಯಕ್ರಮದ 6 ಮತ್ತು 7ನೇ ತರಗತಿಯ ಸಮಾಜ ವಿಜ್ಞಾನ ವಿಷಯದ AI ಶಿಕ್ಷಕರು. ವಿದ್ಯಾರ್ಥಿ ಕೇಳಿದ ಪ್ರಶ್ನೆಗೆ ಅತ್ಯಂತ ಸರಳ, ನಿಖರ ಹಾಗೂ ಸ್ಪಷ್ಟವಾದ ಕನ್ನಡದಲ್ಲಿ ಗರಿಷ್ಠ 2 ರಿಂದ 3 ವಾಕ್ಯಗಳಲ್ಲಿ ಉತ್ತರಿಸಿ.
            ಪ್ರಶ್ನೆ: ${trimmedQ}`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${GEMINI_API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: promptText }] }] })
                });

                const data = await response.json();

                if (data.candidates && data.candidates[0].content && data.candidates[0].content.parts[0].text) {
                    const reply = data.candidates[0].content.parts[0].text;
                    showAndSpeakReply(reply);
                } else {
                    statusBox.innerText = "ದೋಷ: ಉತ್ತರ ಪಡೆಯಲು ಸಾಧ್ಯವಾಗಲಿಲ್ಲ.";
                }
            } catch (error) {
                statusBox.innerText = "AI ಸರ್ವರ್ ಸಂಪರ್ಕಿಸುವಲ್ಲಿ ದೋಷ ಉಂಟಾಗಿದೆ.";
            }
        }

        function showAndSpeakReply(text) {
            const speechBubble = document.getElementById('robot-speech');
            const statusBox = document.getElementById('status');
            
            speechBubble.innerText = text;
            speechBubble.style.display = 'block';
            statusBox.innerText = "ಉತ್ತರಿಸಲಾಗಿದೆ!";

            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'kn-IN';
                utterance.rate = 0.85;
                window.speechSynthesis.speak(utterance);
            }
        }

        const micBtn = document.getElementById('mic-btn');
        const sendBtn = document.getElementById('send-btn');
        const userInput = document.getElementById('user-input');
        const statusBox = document.getElementById('status');

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            const recognition = new SpeechRecognition();
            recognition.lang = 'kn-IN';

            recognition.onstart = () => {
                micBtn.classList.add('mic-active');
                statusBox.innerText = "ಆಲಿಸಲಾಗುತ್ತಿದೆ... (ಮಾತನಾಡಿ)";
            };

            recognition.onresult = (e) => {
                const text = e.results[0][0].transcript;
                userInput.value = text;
                micBtn.classList.remove('mic-active');
                fetchAIResponse(text);
            };

            recognition.onerror = () => {
                statusBox.innerText = "ಧ್ವನಿ ಗ್ರಹಿಸಲು ಸಾಧ್ಯವಾಗಲಿಲ್ಲ. ಟೈಪ್ ಮಾಡಿ ಕಳುಹಿಸಿ.";
                micBtn.classList.remove('mic-active');
            };

            micBtn.addEventListener('click', () => recognition.start());
        } else {
            statusBox.innerText = "ಬ್ರೌಸರ್‌ನಲ್ಲಿ ಮೈಕ್ ಬೆಂಬಲಿಸುತ್ತಿಲ್ಲ, ಕ್ರೋಮ್ ಬಳಸಿ.";
            micBtn.disabled = true;
        }

        sendBtn.addEventListener('click', () => fetchAIResponse(userInput.value));
        userInput.addEventListener("keypress", (e) => { if (e.key === "Enter") fetchAIResponse(userInput.value); });
    </script>
</body>
</html>
