<!DOCTYPE html>
<html lang="kn">
<head>
<meta charset="UTF-8">
<title>ಶೈಕ್ಷಣಿಕ ಆದೇಶಗಳು</title>

<style>
body {
  font-family: "Noto Sans Kannada", Arial;
  background: #f5f5f5;
  padding: 15px;
}

h1 {
  background: #2e7d32;
  color: white;
  padding: 12px;
  border-radius: 6px;
}

.order {
  background: white;
  padding: 12px;
  margin: 10px 0;
  border-left: 6px solid #1976d2;
  border-radius: 6px;
  cursor: pointer;
  font-weight: bold;
}

.order:hover {
  background: #e3f2fd;
}

.date {
  font-size: 12px;
  color: gray;
}
</style>
</head>

<body>

<h1>📢 ಶೈಕ್ಷಣಿಕ ಆದೇಶಗಳು</h1>

<div id="orders-container">

  <!-- Order 1 -->
  <a class="order" 
     href="resources/orders/order1.pdf" 
     target="_blank"
     data-date="2025-02-01">
     
    📄 ಶಾಲಾ ಪ್ರವೇಶ ಆದೇಶ
    <div class="date">📅 01 Feb 2025</div>
  </a>

  <!-- Order 2 -->
  <a class="order" 
     href="resources/orders/order2.pdf" 
     target="_blank"
     data-date="2025-02-05">
     
    📄 ಶಿಕ್ಷಕರ ವರ್ಗಾವಣೆ ಆದೇಶ
    <div class="date">📅 05 Feb 2025</div>
  </a>

  <!-- Order 3 (Latest) -->
  <a class="order" 
     href="resources/orders/order3.pdf" 
     target="_blank"
     data-date="2025-02-10">
     
    📄 ಹೊಸ ಶಿಕ್ಷಣ ಆದೇಶ 
    <span style="background:red;color:white;padding:2px 6px;border-radius:4px;font-size:12px;">NEW</span>
    
    <div class="date">📅 10 Feb 2025</div>
  </a>

</div>

<script>
// 🔥 AUTO SORT (Latest First)
const container = document.getElementById("orders-container");
const orders = Array.from(container.getElementsByClassName("order"));

orders.sort((a, b) => {
  return new Date(b.dataset.date) - new Date(a.dataset.date);
});

orders.forEach(order => container.appendChild(order));
</script>

</body>
</html>
