<!DOCTYPE html>
<html lang="kn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SPOKEN ENGLISH PDF ಸಂಪನ್ಮೂಲಗಳು | ಶಿಕ್ಷಕರ ಶೈಕ್ಷಣಿಕ ಸಂಪನ್ಮೂಲಗಳು , ಕಾರವಾರ (ಉತ್ತರ ಕನ್ನಡ)</title>
  
  <!-- FontAwesome & Google Fonts -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&family=Tiro+Kannada:wght@400;700&display=swap" rel="stylesheet">

  <!-- PDF.js Library (ಮೊಬೈಲ್ & ಕಂಪ್ಯೂಟರ್ ಎರಡರಲ್ಲೂ PDF ನೇರವಾಗಿ ಓಪನ್ ಆಗಲು) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  </script>

  <style>
    :root {
      --primary-gradient: linear-gradient(135deg, #4f46e5 0%, #7c3aed 50%, #ec4899 100%);
      --text-gradient: linear-gradient(120deg, #ffffff 10%, #fef08a 60%, #38bdf8 100%);
      --bg: #0b0f19;
      --card-bg: #1e293b;
      --border: #334155;
      --accent: #38bdf8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', 'Tiro Kannada', sans-serif;
    }

    body {
      background-color: var(--bg);
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* ========================================================
       ULTRA-MODERN VIBRANT HEADER
       ======================================================== */
    .ultra-header {
      background: linear-gradient(135deg, #090d16 0%, #17112c 50%, #0d1e38 100%);
      border-bottom: 2px solid rgba(255, 255, 255, 0.1);
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
      box-shadow: 0 10px 30px -10px rgba(79, 70, 229, 0.5);
      flex-shrink: 0;
      z-index: 10;
    }

    .ultra-header::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, #ec4899, #8b5cf6, #06b6d4, #10b981);
      box-shadow: 0 0 12px #8b5cf6;
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-icon-box {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, #6366f1, #d946ef);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 1.4rem;
      box-shadow: 0 0 18px rgba(168, 85, 247, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.3);
      animation: floatIcon 3s ease-in-out infinite alternate;
    }

    @keyframes floatIcon {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-3px); }
    }

    .brand-text {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    /* ದೊಡ್ಡ ಅಕ್ಷರಗಳ ಟೈಟಲ್ */
    .main-title {
      font-size: 1.45rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      background: var(--text-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 2px 8px rgba(255,255,255,0.2));
    }

    /* ವೆಬ್‌ಸೈಟ್ ಹೆಸರು */
    .website-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(8px);
      padding: 4px 12px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      font-size: 0.84rem;
      color: #e2e8f0;
      font-weight: 600;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }

    .website-badge .dot {
      width: 8px;
      height: 8px;
      background: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 8px #10b981;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .resource-counter {
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: #38bdf8;
      padding: 6px 14px;
      border-radius: 30px;
      font-size: 0.82rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* ========================================================
       MAIN APP LAYOUT (Split View)
       ======================================================== */
    .main-container {
      display: flex;
      flex: 1;
      height: calc(100vh - 80px);
      overflow: hidden;
      background: #0f172a;
    }

    /* Left Panel: Compact Grid (25+ PDF ಗಳು ಸುಲಭವಾಗಿ ಸ್ಕ್ರೋಲ್ ಆಗಲು) */
    .left-panel {
      width: 320px;
      min-width: 280px;
      background: #111827;
      overflow-y: auto;
      padding: 12px;
      border-right: 1px solid var(--border);
      flex-shrink: 0;
    }

    .left-panel::-webkit-scrollbar { width: 6px; }
    .left-panel::-webkit-scrollbar-thumb { background: #374151; border-radius: 4px; }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 12px;
    }

    .pdf-card {
      background: var(--card-bg);
      border-radius: 10px;
      border: 1px solid var(--border);
      box-shadow: 0 4px 6px rgba(0,0,0,0.2);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .pdf-card:hover {
      border-color: #818cf8;
      transform: translateY(-3px);
      box-shadow: 0 8px 16px rgba(99, 102, 241, 0.25);
    }

    .pdf-card.active {
      border: 2px solid #38bdf8;
      background: #1e1b4b;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
    }

    .thumbnail-box {
      width: 100%;
      height: 125px;
      background: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    .thumbnail-box canvas {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .thumbnail-loading {
      font-size: 0.8rem;
      color: #64748b;
    }

    .card-info {
      padding: 10px 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .file-title {
      font-size: 0.82rem;
      font-weight: 700;
      color: #f1f5f9;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .btn-row {
      display: flex;
      gap: 6px;
    }

    .btn {
      flex: 1;
      padding: 5px 8px;
      border-radius: 6px;
      font-size: 0.74rem;
      font-weight: 700;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      text-decoration: none;
      transition: all 0.2s;
    }

    .btn-view {
      background: linear-gradient(135deg, #4f46e5, #6366f1);
      color: #fff;
    }
    .btn-view:hover { filter: brightness(1.15); }

    .btn-download {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
    .btn-download:hover { background: rgba(16, 185, 129, 0.3); }

    /* Right Panel: ವಿಶಾಲವಾದ ಸ್ಕ್ರೀನ್ (Large Viewer) */
    .right-panel {
      flex: 1;
      background: #0b0f19;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .viewer-header {
      background: #111827;
      border-bottom: 1px solid var(--border);
      color: #fff;
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.95rem;
      flex-shrink: 0;
    }

    .viewer-header span {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      color: #38bdf8;
    }

    .viewer-body {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      background: radial-gradient(circle at top, #1e293b 0%, #0b0f19 80%);
    }

    .pdf-page-canvas {
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      max-width: 100%;
      border-radius: 4px;
      background: white;
    }

    .loading-msg {
      color: #94a3b8;
      margin-top: 50px;
      font-size: 1rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* ಮೊಬೈಲ್ ರೆಸ್ಪಾನ್ಸಿವ್ ಸರಿಹೊಂದಾಣಿಕೆ */
    @media (max-width: 850px) {
      .ultra-header {
        flex-direction: column;
        align-items: flex-start;
        padding: 10px 14px;
        gap: 6px;
      }
      .brand-icon-box {
        width: 40px;
        height: 40px;
        font-size: 1.2rem;
      }
      .main-title {
        font-size: 1.1rem;
      }
      .website-badge {
        font-size: 0.72rem;
        padding: 3px 8px;
      }
      .resource-counter {
        display: none;
      }
      .main-container {
        flex-direction: column;
        height: calc(100vh - 105px);
      }
      .left-panel {
        width: 100%;
        height: 175px;
        border-right: none;
        border-bottom: 2px solid var(--border);
        overflow-x: auto;
        overflow-y: hidden;
        padding: 8px;
      }
      .grid-container {
        display: flex;
        flex-direction: row;
        gap: 8px;
      }
      .pdf-card {
        width: 110px;
        flex-shrink: 0;
      }
      .thumbnail-box {
        height: 80px;
      }
      .right-panel {
        flex: 1;
      }
    }
  </style>
</head>
<body>

  <!-- ========================================================
       ULTRA-MODERN HEADER
       ======================================================== -->
  <header class="ultra-header">
    <div class="brand-section">
      <div class="brand-icon-box">
        <i class="fa-solid fa-graduation-cap"></i>
      </div>
      <div class="brand-text">
        <div class="main-title">SPOKEN ENGLISH PDF ಸಂಪನ್ಮೂಲಗಳು</div>
        <div class="website-name-wrap">
          <div class="website-badge">
            <span class="dot"></span>
            <span>ಶಿಕ್ಷಕರ ಶೈಕ್ಷಣಿಕ ಸಂಪನ್ಮೂಲಗಳು , ಕಾರವಾರ (ಉತ್ತರ ಕನ್ನಡ)</span>
          </div>
        </div>
      </div>
    </div>

    <div class="header-actions">
      <div class="resource-counter" id="totalCountBadge">
        <i class="fa-solid fa-book-open"></i> <span>4 ಸಂಪನ್ಮೂಲಗಳು ಲಭ್ಯ</span>
      </div>
    </div>
  </header>

  <!-- MAIN APP CONTAINER -->
  <div class="main-container">
    <!-- Left: PDF Thumbnails Grid -->
    <div class="left-panel">
      <div class="grid-container" id="pdfGrid"></div>
    </div>

    <!-- Right: Full Scrollable PDF Screen -->
    <div class="right-panel">
      <div class="viewer-header">
        <span id="currentPdfName"><i class="fa-regular fa-file-pdf"></i> PDF Viewer</span>
        <a id="downloadBtn" href="#" download class="btn btn-download" style="width: auto; padding: 6px 16px;">
          <i class="fa-solid fa-cloud-arrow-down"></i> ಡೌನ್‌ಲೋಡ್
        </a>
      </div>
      <div class="viewer-body" id="pdfContainer">
        <div class="loading-msg"><i class="fa-solid fa-spinner fa-spin"></i> ಲೋಡ್ ಆಗುತ್ತಿದೆ...</div>
      </div>
    </div>
  </div>

  <script>
    // ನಿಮ್ಮ GitHub ಫೋಲ್ಡರ್‌ನಲ್ಲಿರುವ ಫೈಲ್‌ಗಳು (25+ PDF ಗಳನ್ನು ಇಲ್ಲಿ ಒಂದೊಂದಾಗಿ ಸುಲಭವಾಗಿ ಸೇರಿಸಬಹುದು):
    const pdfList = [
      { name: "Articles", file: "Articles .pdf" },
      { name: "Persons", file: "Persons .pdf" },
      { name: "Question Tags", file: "Question tags.pdf" },
      { name: "English Grammar", file: "grammar.pdf" }
      // ಮುಂದಿನ PDF ಗಳನ್ನು ಹೀಗೆ ಸೇರಿಸುತ್ತಾ ಹೋಗಿ:
      // { name: "Tenses Guide", file: "Tenses.pdf" },
      // { name: "Daily Vocabulary", file: "Vocabulary.pdf" },
    ];

    const basePath = "spokenenpdf/";
    const grid = document.getElementById("pdfGrid");
    const container = document.getElementById("pdfContainer");
    const currentPdfName = document.getElementById("currentPdfName");
    const downloadBtn = document.getElementById("downloadBtn");
    const totalCountBadge = document.getElementById("totalCountBadge");

    // ಕೌಂಟರ್ ಅಪ್ಡೇಟ್
    if(totalCountBadge) {
      totalCountBadge.innerHTML = `<i class="fa-solid fa-book-open"></i> <span>${pdfList.length} ಸಂಪನ್ಮೂಲಗಳು ಲಭ್ಯ</span>`;
    }

    // 1. ಎಡಭಾಗದ ಚಿಕ್ಕ ಕಾರ್ಡ್‌ಗಳು ಮತ್ತು ಪ್ರಥಮ ಪೇಜ್ ಪ್ರಿವ್ಯೂ ರೆಂಡರ್ ಮಾಡುವುದು
    function initGrid() {
      grid.innerHTML = "";
      pdfList.forEach((item, index) => {
        const fullUrl = basePath + encodeURIComponent(item.file);
        
        const card = document.createElement("div");
        card.className = "pdf-card";
        card.id = `card-${index}`;
        card.onclick = () => loadFullPdf(item.file, item.name, index);

        card.innerHTML = `
          <div class="thumbnail-box" id="thumb-box-${index}">
            <span class="thumbnail-loading"><i class="fa-solid fa-spinner fa-spin"></i></span>
            <canvas id="thumb-${index}"></canvas>
          </div>
          <div class="card-info">
            <div class="file-title" title="${item.name}">${item.name}</div>
            <div class="btn-row">
              <button class="btn btn-view">ವ್ಯೂ</button>
              <a class="btn btn-download" href="${fullUrl}" download="${item.file}" onclick="event.stopPropagation();">
                <i class="fa-solid fa-arrow-down"></i>
              </a>
            </div>
          </div>
        `;
        grid.appendChild(card);

        // ಮೊಬೈಲ್ ಮತ್ತು ಲ್ಯಾಪ್ಟಾಪ್ ಎರಡರಲ್ಲೂ ಮೊದಲ ಪೇಜ್ ಥಂಬ್‌ನೈಲ್ ರೆಂಡರ್ ಮಾಡುವುದು
        renderThumbnail(fullUrl, `thumb-${index}`, `thumb-box-${index}`);
      });
    }

    // ಪ್ರಥಮ ಪೇಜ್ ಥಂಬ್‌ನೈಲ್ ರಚನೆ
    async function renderThumbnail(url, canvasId, boxId) {
      try {
        const loadingTask = pdfjsLib.getDocument(url);
        const pdf = await loadingTask.promise;
        const page = await pdf.getPage(1);
        
        const canvas = document.getElementById(canvasId);
        const context = canvas.getContext('2d');
        const viewport = page.getViewport({ scale: 0.4 });

        canvas.height = viewport.height;
        canvas.width = viewport.width;

        await page.render({ canvasContext: context, viewport: viewport }).promise;
        const loader = document.querySelector(`#${boxId} .thumbnail-loading`);
        if (loader) loader.style.display = 'none';
      } catch (e) {
        console.warn("Thumbnail load failed:", url);
      }
    }

    // 2. ಬಲಭಾಗದ ದೊಡ್ಡ ಸ್ಕ್ರೀನ್‌ನಲ್ಲಿ ಸಂಪೂರ್ಣ PDF ಎಲ್ಲಾ ಪೇಜ್ ಸ್ಕ್ರೋಲ್ ಆಗುವಂತೆ ಲೋಡ್ ಮಾಡುವುದು
    async function loadFullPdf(filename, displayName, activeIndex) {
      const fullUrl = basePath + encodeURIComponent(filename);
      
      // ಆಕ್ಟಿವ್ ಕಾರ್ಡ್ ಹೈಲೈಟ್
      document.querySelectorAll(".pdf-card").forEach(c => c.classList.remove("active"));
      const selected = document.getElementById(`card-${activeIndex}`);
      if(selected) selected.classList.add("active");

      currentPdfName.innerHTML = `<i class="fa-regular fa-file-pdf"></i> ${displayName}`;
      downloadBtn.href = fullUrl;
      downloadBtn.setAttribute("download", filename);
      
      container.innerHTML = `<div class="loading-msg"><i class="fa-solid fa-spinner fa-spin"></i> ಲೋಡ್ ಆಗುತ್ತಿದೆ...</div>`;

      try {
        const loadingTask = pdfjsLib.getDocument(fullUrl);
        const pdf = await loadingTask.promise;
        container.innerHTML = "";

        for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
          const page = await pdf.getPage(pageNum);
          
          const unscaledViewport = page.getViewport({ scale: 1.0 });
          const targetWidth = Math.min(container.clientWidth - 40, 880);
          const scale = targetWidth / unscaledViewport.width;
          const viewport = page.getViewport({ scale: scale > 0.5 ? scale : 0.8 });

          const canvas = document.createElement("canvas");
          canvas.className = "pdf-page-canvas";
          canvas.height = viewport.height;
          canvas.width = viewport.width;
          const context = canvas.getContext('2d');

          container.appendChild(canvas);
          await page.render({ canvasContext: context, viewport: viewport }).promise;
        }
      } catch (error) {
        container.innerHTML = `<div style="color:#f87171; text-align:center; padding:30px;">PDF ಲೋಡ್ ಮಾಡಲು ಸಾಧ್ಯವಾಗಲಿಲ್ಲ. ಫೈಲ್ ಪಾಥ್ ಪರಿಶೀಲಿಸಿ.</div>`;
      }
    }

    // ವಿಂಡೋ ಲೋಡ್ ಆದಾಗ ಮೊದಲ PDF ಆಟೋಮೆಟಿಕ್ ಆಗಿ ವೀವರ್‌ನಲ್ಲಿ ಓಪನ್ ಆಗುತ್ತದೆ
    window.addEventListener("DOMContentLoaded", () => {
      initGrid();
      if(pdfList.length > 0) {
        loadFullPdf(pdfList[0].file, pdfList[0].name, 0);
      }
    });
  </script>
</body>
</html>
