<div class="presentation-container loading" id="docWrapper">
    <!-- Clean, quiet animated loader shown *only* while the file finishes preparing -->
    <div class="minimal-spinner" id="docSpinner"></div>
    
    <iframe 
        src="https://online.flippingbook.com/view/611203212/" 
        id="docFrame"
        title="July Presentation"
        allowfullscreen="true">
    </iframe>
</div>

<style>
    .presentation-container {
        width: 100%;
        max-width: 1024px;
        margin: 24px auto;
        aspect-ratio: 3 / 2;
        position: relative;
        
        background-color: #fafafa;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
    }

    /* Keeps the iframe completely hidden while loading */
    .presentation-container iframe {
        width: 100%;
        height: 100%;
        border: none;
        display: block;
        opacity: 0;
        transition: opacity 0.5s ease-in-out;
    }

    /* Reveals the presentation smoothly all at once */
    .presentation-container.ready iframe {
        opacity: 1;
    }

    /* Minimalist loading indicator */
    .minimal-spinner {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 30px;
        height: 30px;
        margin: -15px 0 0 -15px;
        border: 2px solid #e0e0e0;
        border-top-color: #000000;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        transition: opacity 0.3s ease;
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }
</style>

<script>
    // Smoothly reveal the presentation the exact millisecond it finishes loading
    document.getElementById('docFrame').addEventListener('load', function() {
        document.getElementById('docSpinner').style.opacity = '0';
        setTimeout(function() {
            document.getElementById('docSpinner').style.display = 'none';
            document.getElementById('docWrapper').classList.add('ready');
        }, 300);
    });
</script>
