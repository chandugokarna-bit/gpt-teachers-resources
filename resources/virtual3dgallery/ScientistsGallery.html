<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Virtual Art Gallery</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #010103; font-family: 'Segoe UI', sans-serif; color: #fff; }
        #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
        
        /* UI Layer */
        .ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; display: flex; flex-direction: column; justify-content: flex-end; padding: 20px; }
        .interactive { pointer-events: auto; }
        .nav-btn { background: rgba(255, 170, 0, 0.2); border: 1px solid #ffaa00; color: #ffaa00; padding: 8px 18px; border-radius: 20px; cursor: pointer; font-weight: bold; transition: 0.3s; backdrop-filter: blur(5px); }
        .nav-btn:hover { background: #ffaa00; color: #000; transform: scale(1.05); }

        /* 🎯 ಸಿನಿಮಾಟಿಕ್ ಬಾಟಮ್ ಇನ್ಫೋ ಬಾರ್ */
        #cinema-info-bar {
            position: fixed;
            bottom: -150px;
            left: 50%;
            transform: translateX(-50%);
            width: 85%;
            max-width: 800px;
            background: rgba(4, 4, 8, 0.92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 255, 200, 0.35);
            border-bottom: none;
            border-radius: 16px 16px 0 0;
            padding: 15px 25px;
            z-index: 100;
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            gap: 4px;
            pointer-events: auto;
        }
        #cinema-info-bar.active { bottom: 0; }
        
        #popup-title { font-size: 16px; color: #ffaa00; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
        #popup-desc { font-size: 13px; color: #e2e8f0; line-height: 1.5; }
        
        .close-x { background: rgba(255, 255, 255, 0.1); border: none; color: #fff; width: 24px; height: 24px; border-radius: 50%; cursor: pointer; font-size: 11px; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
        .close-x:hover { background: #ff3333; }
        
        /* ಸೇಫ್ ಲೋಡರ್ */
        #loader { position: fixed; top: 10px; left: 10px; z-index: 1000; background: rgba(0,0,0,0.7); padding: 8px 15px; border-radius: 20px; font-size: 12px; color: #ffaa00; pointer-events: none; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="loader">Loading Gallery...</div>
    
    <div id="cinema-info-bar">
        <div id="popup-title">
            <span id="dynasty-name">Scientist Profile</span>
            <button class="close-x" onclick="resetView()">✕</button>
        </div>
        <div id="popup-desc">Details...</div>
    </div>

    <div id="canvas-container"></div>

    <div class="ui-layer">
        <footer class="interactive" style="display: flex; justify-content: flex-end; width: 100%;">
            <button class="nav-btn" onclick="resetView()">Reset View</button>
        </footer>
    </div>

    <script>
        let scene, camera, renderer, controls, raycaster, mouse;
        const container = document.getElementById('canvas-container');
        const clickableObjects = [];

        let targetLookAt = new THREE.Vector3(0, 0, 0);
        let targetCameraPos = new THREE.Vector3(0, 0, 1.5);
        let isFocused = false;

        const colors = [0xff5555, 0x55ff55, 0x5555ff, 0xffff55, 0xff55ff, 0x55ffff, 0xffaa00, 0xaa00ff, 0x00ffaa, 0xeeff00];

        const imagesList = [
            "https://raw.githubusercontent.com/chandugokarna-bit/gpt-teachers-resources/main/images/Faraday.jpeg", 
            "https://raw.githubusercontent.com/chandugokarna-bit/gpt-teachers-resources/main/images/Archimedes.jpeg", 
            "https://raw.githubusercontent.com/chandugokarna-bit/gpt-teachers-resources/main/images/Graham Bell.jpeg", 
            "https://raw.githubusercontent.com/chandugokarna-bit/gpt-teachers-resources/main/images/Marconi.jpeg", 
            "https://raw.githubusercontent.com/chandugokarna-bit/gpt-teachers-resources/main/images/Vikram Sarabhai.jpeg", 
            "https://raw.githubusercontent.com/chandugokarna-bit/gpt-teachers-resources/main/images/Fleming.jpeg", 
            "https://raw.githubusercontent.com/chandugokarna-bit/gpt-teachers-resources/main/images/Hooke.jpeg", 
            "https://raw.githubusercontent.com/chandugokarna-bit/gpt-teachers-resources/main/images/Babbage.jpeg", 
            "https://raw.githubusercontent.com/chandugokarna-bit/gpt-teachers-resources/main/images/Pastuer.jpeg",
            "https://raw.githubusercontent.com/chandugokarna-bit/gpt-teachers-resources/main/images/Tesla.jpeg"
        ];

        // 🎯 ಸರಿಪಡಿಸಲಾದ ವಿಜ್ಞಾನಿಗಳ ಕಂಪ್ಲೀಟ್ ಡೇಟಾ ಅರೇ
        const historyData = [
            { title: "⚡ Michael Faraday", desc: "• ಕೊಡುಗೆ: ಇಲೆಕ್ಟ್ರೋಮ್ಯಾಗ್ನೆಟಿಕ್ ಇಂಡಕ್ಷನ್ ಕಂಡುಹಿಡಿದರು. ಇವರ ಸಂಶೋಧನೆಯಿಂದಲೇ ಇಂದು ನಮಗೆ ಇಲೆಕ್ಟ್ರಿಕ್ ಮೋಟಾರ್ ಮತ್ತು ಜನರೇಟರ್ ಸಿಕ್ಕಿರುವುದು." },
            { title: "📐 Archimedes", desc: "• ಕೊಡುಗೆ: ಪ್ರಸಿದ್ಧ ಗ್ರೀಕ್ ಗಣಿತಜ್ಞ ಮತ್ತು ಭೌತವಿಜ್ಞಾನಿ. 'ಆರ್ಕಿಮಿಡಿಸ್ ತತ್ವ' (Buoyancy) ಮತ್ತು ಲಿವರ್ ಉಪಕರಣಗಳ ಸೂತ್ರಗಳನ್ನು ನೀಡಿದ್ದಾರೆ." },
            { title: "📞 Alexander Graham Bell", desc: "• ಕೊಡುಗೆ: ಟೆಲಿಫೋನ್ ಆವಿಷ್ಕಾರಕ. ಇವರ ಈ ಅದ್ಭುತ ಸಂಶೋಧನೆ ಜಗತ್ತಿನ ಕಮ್ಯುನಿಕೇಶನ್ ವ್ಯವಸ್ಥೆಯನ್ನೇ ಸಂಪೂರ್ಣವಾಗಿ ಬದಲಾಯಿಸಿತು." },
            { title: "📻 Guglielmo Marconi", desc: "• ಕೊಡುಗೆ: ರೇಡಿಯೋ ಮತ್ತು ವೈರ್‌ಲೆಸ್ ಟೆಲಿಗ್ರಾಫಿ ವ್ಯವಸ್ಥೆಯ ಪಿತಾಮಹ. ಸುದೀರ್ಘ ದೂರದ ರೇಡಿಯೋ ತರಂಗಾಂತರ ಪ್ರಸರಣವನ್ನು ಯಶಸ್ವಿಗೊಳಿಸಿದರು." },
            { title: "🚀 Dr. Vikram Sarabhai", desc: "• ಕೊಡುಗೆ: ಭಾರತೀಯ ಬಾಹ್ಯಾಕಾಶ ಕಾರ್ಯಕ್ರಮದ (ISRO) ಪಿತಾಮಹ. ಭಾರತವನ್ನು ಬಾಹ್ಯಾಕಾಶ ರಂಗದಲ್ಲಿ ಮುಂಚೂಣಿಗೆ ತರಲು ಇವರೇ ಕಾರಣಕರ್ತರು." },
            { title: "🧫 Alexander Fleming", desc: "• ಕೊಡುಗೆ: ಜಗತ್ತಿನ ಮೊದಲ ಆಂಟಿಬಯೋಟಿಕ್ ಔಷಧ 'ಪೆನ್ಸಿಲಿನ್' ಕಂಡುಹಿಡಿದರು, ಇದರಿಂದಾಗಿ ಕೋಟ್ಯಂತರ ಜನರ ಜೀವ ಉಳಿಯಿತು." },
            { title: "🔬 Robert Hooke", desc: "• ಕೊಡುಗೆ: ಮೈಕ್ರೋಸ್ಕೋಪ್ ಮೂಲಕ ಮೊದಲ ಬಾರಿಗೆ ಜೀವಕೋಶವನ್ನು (Cell) ವೀಕ್ಷಿಸಿ ಅದಕ್ಕೆ ಹೆಸರಿಟ್ಟವರು. ಇಲಾಸ್ವಿಸಿಟಿಯ 'ಹುಕ್ಸ್ ಲಾ' ನೀಡಿದ್ದಾರೆ." },
            { title: "💻 Charles Babbage", desc: "• ಕೊಡುಗೆ: ಫಾದರ್ ಆಫ್ ಕಂಪ್ಯೂಟರ್. ಜಗತ್ತಿನ ಮೊದಲ ಮೆಕ್ಯಾನಿಕಲ್ ಕಂಪ್ಯೂಟರ್ 'ಅನಾಲಿಟಿಕಲ್ ಇಂಜಿನ್' ಅನ್ನು ವಿನ್ಯಾಸಗೊಳಿಸಿದ ಮಹಾ ಮೇಧಾವಿ." },
            { title: "🧪 Louis Pasteur", desc: "• ಕೊಡುಗೆ: ಪಾಶ್ಚರೀಕರಣ (Pasteurization) ವಿಧಾನವನ್ನು ಕಂಡುಹಿಡಿದರು. ರೇಬಿಸ್ ಮತ್ತು ಆಂಥ್ರಾಕ್ಸ್ ರೋಗಗಳಿಗೆ ಮೊದಲ ಬಾರಿಗೆ ಲಸಿಕೆ ಸಿದ್ಧಪಡಿಸಿದರು." },
            { title: "🔌 Nikola Tesla", desc: "• ಕೊಡುಗೆ: ಆಲ್ಟರ್ನೇಟಿಂಗ್ ಕರೆಂಟ್ (AC Power) ಸಿಸ್ಟಮ್ ವಿನ್ಯಾಸಕ. ವೈರ್‌ಲೆಸ್ ಎನರ್ಜಿ ಟ್ರಾನ್ಸ್‌ಮಿಷನ್ ಮತ್ತು ಟೆಸ್ಲಾ ಕಾಯಿಲ್‌ನಂತಹ ನೂರಾರು ಆವಿಷ್ಕಾರಗಳ ರಾಜ."
            }
        ];

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x020204);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.copy(targetCameraPos); 

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.07;
            controls.maxDistance = 18;
            controls.minDistance = 0.5;

            scene.add(new THREE.AmbientLight(0xffffff, 0.95));
            
            // ಬೃಹತ್ ಗ್ಯಾಲರಿ ಹಾಲ್
            const roomGeo = new THREE.BoxGeometry(32, 12, 32);
            const wallMat = new THREE.MeshStandardMaterial({ color: 0x050508, side: THREE.BackSide });
            const room = new THREE.Mesh(roomGeo, wallMat);
            scene.add(room);

            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            const wallX = 16 - 0.05; 
            const wallZ = 16 - 0.05; 

            const galleryLayout = [
                { id: 0, url: imagesList[0], w: 10, h: 5.5, pos: [-4, 0.5, -wallZ], rot: [0, 0, 0], normal: [0, 0, 1] },
                { id: 1, url: imagesList[1], w: 7.5, h: 5.0, pos: [-wallX, 0.5, -9.5], rot: [0, Math.PI/2, 0], normal: [1, 0, 0] },
                { id: 2, url: imagesList[2], w: 7.5, h: 5.0, pos: [-wallX, 0.5, 0], rot: [0, Math.PI/2, 0], normal: [1, 0, 0] },
                { id: 3, url: imagesList[3], w: 7.5, h: 5.0, pos: [-wallX, 0.5, 9.5], rot: [0, Math.PI/2, 0], normal: [1, 0, 0] },
                { id: 4, url: imagesList[4], w: 7.5, h: 5.0, pos: [-5.5, 0.5, wallZ], rot: [0, Math.PI, 0], normal: [0, 0, -1] },
                { id: 5, url: imagesList[5], w: 7.5, h: 5.0, pos: [5.5, 0.5, wallZ], rot: [0, Math.PI, 0], normal: [0, 0, -1] },
                { id: 6, url: imagesList[6], w: 7.5, h: 5.0, pos: [wallX, 0.5, 9.5], rot: [0, -Math.PI/2, 0], normal: [-1, 0, 0] },
                { id: 7, url: imagesList[7], w: 7.5, h: 5.0, pos: [wallX, 0.5, 0], rot: [0, -Math.PI/2, 0], normal: [-1, 0, 0] },
                { id: 8, url: imagesList[8], w: 7.5, h: 5.0, pos: [wallX, 0.5, -9.5], rot: [0, -Math.PI/2, 0], normal: [-1, 0, 0] },
                { id: 9, url: imagesList[9], w: 6.5, h: 4.8, pos: [7.5, 0.5, -wallZ], rot: [0, 0, 0], normal: [0, 0, 1] }
            ];

            const textureLoader = new THREE.TextureLoader();

            galleryLayout.forEach((art, index) => {
                textureLoader.load(art.url, 
                    function(texture) {
                        createArtwork(art.id, texture, null, art.w, art.h, new THREE.Vector3(...art.pos), new THREE.Vector3(...art.rot), new THREE.Vector3(...art.normal));
                    },
                    undefined,
                    function(err) {
                        createArtwork(art.id, null, colors[index], art.w, art.h, new THREE.Vector3(...art.pos), new THREE.Vector3(...art.rot), new THREE.Vector3(...art.normal));
                    }
                );
            });

            setTimeout(() => { document.getElementById('loader').style.display = 'none'; }, 1500);

            let startX, startY;
            renderer.domElement.addEventListener('pointerdown', (e) => { startX = e.clientX; startY = e.clientY; });
            renderer.domElement.addEventListener('pointerup', (e) => {
                if (Math.abs(e.clientX - startX) < 5 && Math.abs(e.clientY - startY) < 5) {
                    checkIntersection(e);
                }
            });

            window.addEventListener('resize', onWindowResize, false);
        }

        function createArtwork(id, texture, fallbackColor, width, height, position, rotation, normal) {
            const group = new THREE.Group();
            const artGeo = new THREE.PlaneGeometry(width, height);
            
            let artMat = texture 
                ? new THREE.MeshStandardMaterial({ map: texture, roughness: 0.15, side: THREE.DoubleSide })
                : new THREE.MeshStandardMaterial({ color: fallbackColor, roughness: 0.4, side: THREE.DoubleSide });
            
            const artMesh = new THREE.Mesh(artGeo, artMat);
            
            // ಪಕ್ಕಾ ಫುಲ್ ಸ್ಕ್ರೀನ್ ಲೆಕ್ಕಾಚಾರ
            const vFOV = (camera.fov * Math.PI) / 180;
            let distance = (height / 2) / Math.tan(vFOV / 2);
            
            const aspect = window.innerWidth / window.innerHeight;
            const distanceForWidth = (width / 2) / Math.tan((camera.fov * aspect * Math.PI) / 360);
            
            distance = Math.max(distance, distanceForWidth) * 0.96; 

            const camPos = position.clone().add(normal.clone().multiplyScalar(distance));

            artMesh.userData = { dynastyId: id, position: position.clone(), cameraPos: camPos };
            clickableObjects.push(artMesh); 
            group.add(artMesh);

            // ನಿಯಾನ್ ಬಾರ್ಡರ್
            const frameGeo = new THREE.PlaneGeometry(width + 0.08, height + 0.08);
            const frameMat = new THREE.MeshBasicMaterial({ color: 0x00ffcc, wireframe: true, side: THREE.DoubleSide });
            const frameMesh = new THREE.Mesh(frameGeo, frameMat);
            frameMesh.position.z = -0.003;
            group.add(frameMesh);

            group.position.copy(position);
            group.rotation.set(rotation.x, rotation.y, rotation.z);
            scene.add(group);
        }

        function checkIntersection(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(clickableObjects, true);

            if (intersects.length > 0) {
                const clickedMesh = intersects[0].object;
                if(clickedMesh.userData && clickedMesh.userData.dynastyId !== undefined) {
                    const id = clickedMesh.userData.dynastyId;
                    
                    targetLookAt.copy(clickedMesh.userData.position);
                    targetCameraPos.copy(clickedMesh.userData.cameraPos);
                    isFocused = true;

                    document.getElementById('dynasty-name').innerHTML = historyData[id].title;
                    document.getElementById('popup-desc').innerHTML = historyData[id].desc;
                    document.getElementById('cinema-info-bar').classList.add('active');
                }
            }
        }

        function resetView() {
            targetLookAt.set(0, 0, 0); 
            targetCameraPos.set(0, 0, 1.5);
            isFocused = false;
            document.getElementById('cinema-info-bar').classList.remove('active');
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.target.lerp(targetLookAt, 0.08);
            if (isFocused) {
                camera.position.lerp(targetCameraPos, 0.08);
            }
            controls.update();
            renderer.render(scene, camera);
        }

        init();
        animate();
    </script>
</body>
</html>
