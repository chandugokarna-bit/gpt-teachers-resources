<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ಸಂಜೀವಿನಿ: ಔಷಧೀಯ ಸಸ್ಯಗಳ ಭವ್ಯ ವರ್ಚುವಲ್ ಗ್ಯಾಲರಿ</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #010502; font-family: 'Segoe UI', sans-serif; color: #fff; }
        #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
        
        /* UI ಲೇಯರ್ - ರೀಸೆಟ್ ಬಟನ್‌ಗಾಗಿ */
        .ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; display: flex; flex-direction: column; justify-content: flex-end; padding: 25px; }
        .interactive { pointer-events: auto; }
        .nav-btn { background: rgba(0, 255, 100, 0.15); border: 1px solid #00ff88; color: #00ff88; padding: 10px 22px; border-radius: 25px; cursor: pointer; font-weight: bold; transition: 0.3s; backdrop-filter: blur(5px); }
        .nav-btn:hover { background: #00ff88; color: #000; transform: scale(1.05); box-shadow: 0 0 15px rgba(0, 255, 100, 0.4); }
        
        /* ಸಿನಿಮಾಟಿಕ್ ಇಂಟ್ರೋ ಹೆಡ್‌ಲೈನ್ ಮತ್ತು ಲೋಡರ್ */
        #loader { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: radial-gradient(circle, #05190e 0%, #010302 100%); 
            z-index: 1000; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            transition: opacity 0.8s ease-in-out; 
        }
        .intro-headline {
            font-size: 46px;
            font-weight: 900;
            text-align: center;
            max-width: 950px;
            padding: 0 20px;
            line-height: 1.5;
            background: linear-gradient(45deg, #00ff88, #a8ff78, #00bfff, #00ff88);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientMove 4s ease infinite, scaleUp 1.5s ease-out forwards;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .intro-sub {
            margin-top: 20px;
            font-size: 14px;
            color: #557261;
            letter-spacing: 6px;
            animation: fadeIn 2s ease-in forwards;
        }
        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        @keyframes scaleUp {
            0% { transform: scale(0.88); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        @keyframes fadeIn {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <!-- ಸಿನಿಮಾಟಿಕ್ ಇಂಟ್ರೋ ಸ್ಕ್ರೀನ್ -->
    <div id="loader">
        <h1 class="intro-headline">ಔಷಧೀಯ ಸಸ್ಯಗಳ ಭವ್ಯ ವರ್ಚುವಲ್ ಗ್ಯಾಲರಿ</h1>
        <p class="intro-sub">SANJEEVINI • 3D IMMERSIVE EXPERIENCE</p>
    </div>

    <div id="canvas-container"></div>

    <div class="ui-layer">
        <footer class="interactive" style="display: flex; justify-content: flex-end; width: 100%;">
            <button class="nav-btn" onclick="resetView()">Reset View</button>
        </footer>
    </div>

    <script>
        let scene, camera, renderer, controls, raycaster, mouse;
        const container = document.getElementById('canvas-container');
        const clickableObjects = [];

        let targetLookAt = new THREE.Vector3(0, 0, 0);
        let targetCameraPos = new THREE.Vector3(0, 0, 1.5);
        let isFocused = false;

        // ಬ್ಯಾಕಪ್ ಬಣ್ಣಗಳು
        const colors = [
            0x2ecc71, 0x27ae60, 0x1abc9c, 0x16a085, 0x3498db,
            0x2980b9, 0xa55eea, 0x4b7bec, 0x20bf6b, 0x26de81,
            0x05c46b, 0x0be881, 0x485460, 0x00d2d3, 0x1dd1a1,
            0x10ac84, 0x54a0ff
        ];

        // 🎯 ನಿಮ್ಮ ಗಿಟ್‌ಹಬ್‌ನ ಇಮೇಜ್ ಫೋಲ್ಡರ್ ಬೇಸ್ ಲಿಂಕ್ (images/medicine/)
        const baseUrl = "https://raw.githubusercontent.com/chandugokarna-bit/gpt-teachers-resources/main/images/medicine/"; 

        // 17 ಇಮೇಜ್‌ಗಳ ಆಟೋಮ್ಯಾಟಿಕ್ ಲೂಪ್ ಸೆಟಪ್ (plant1.jpg ಇಂದ plant18.jpg ವರೆಗೆ)
        const imagesList = [];
        for(let i = 1; i <= 17; i++) {
            imagesList.push(baseUrl + "plant" + i + ".jpg");
        }

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x010502);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.copy(targetCameraPos); 

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.07;
            controls.maxDistance = 24;
            controls.minDistance = 0.5;

            scene.add(new THREE.AmbientLight(0xffffff, 0.95));
            
            // 17 ಚಿತ್ರಗಳು ಅಚ್ಚುಕಟ್ಟಾಗಿ ಹೊಂದಿಕೊಳ್ಳಲು ದೊಡ್ಡದಾದ ಹಾಲ್ ಸೆಟಪ್
            const roomWidth = 42, roomHeight = 12, roomDepth = 42;
            const roomGeo = new THREE.BoxGeometry(roomWidth, roomHeight, roomDepth);
            const wallMat = new THREE.MeshStandardMaterial({ color: 0x030c05, side: THREE.BackSide });
            const room = new THREE.Mesh(roomGeo, wallMat);
            scene.add(room);

            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            const wallX = (roomWidth / 2) - 0.05; 
            const wallZ = (roomDepth / 2) - 0.05; 

            // 🎯 17 ಇಮೇಜ್‌ಗಳ ನಡುವೆ ಸೂಪರ್ ಗ್ಯಾಪ್ ಬರುವಂತೆ ಮಾಡಿದ 3D ಲೇಔಟ್ ಜೋಡಣೆ
            const galleryLayout = [
                // Front Wall (ಮುಂಭಾಗದ ಗೋಡೆ - 4 ಚಿತ್ರಗಳು)
                { id: 0, url: imagesList[0], w: 6.5, h: 4.8, pos: [-12, 0.5, -wallZ], rot: [0, 0, 0], normal: [0, 0, 1] },
                { id: 1, url: imagesList[1], w: 6.5, h: 4.8, pos: [-4, 0.5, -wallZ], rot: [0, 0, 0], normal: [0, 0, 1] },
                { id: 2, url: imagesList[2], w: 6.5, h: 4.8, pos: 4, 0.5, -wallZ], rot: [0, 0, 0], normal: [0, 0, 1] },
                { id: 3, url: imagesList[3], w: 6.5, h: 4.8, pos: 12, 0.5, -wallZ], rot: [0, 0, 0], normal: [0, 0, 1] },
                
                // Left Wall (ಎಡ ಗೋಡೆ - 4 ಚಿತ್ರಗಳು)
                { id: 4, url: imagesList[4], w: 6.5, h: 4.8, pos: [-wallX, 0.5, -12], rot: [0, Math.PI/2, 0], normal: [1, 0, 0] },
                { id: 5, url: imagesList[5], w: 6.5, h: 4.8, pos: [-wallX, 0.5, -4], rot: [0, Math.PI/2, 0], normal: [1, 0, 0] },
                { id: 6, url: imagesList[6], w: 6.5, h: 4.8, pos: [-wallX, 0.5, 4], rot: [0, Math.PI/2, 0], normal: [1, 0, 0] },
                { id: 7, url: imagesList[7], w: 6.5, h: 4.8, pos: [-wallX, 0.5, 12], rot: [0, Math.PI/2, 0], normal: [1, 0, 0] },
                
                // Back Wall (ಹಿಂಭಾಗದ ಗೋಡೆ - 5 ಚಿತ್ರಗಳು)
                { id: 8, url: imagesList[8], w: 6.5, h: 4.8, pos: [14, 0.5, wallZ], rot: [0, Math.PI, 0], normal: [0, 0, -1] },
                { id: 9, url: imagesList[9], w: 6.5, h: 4.8, pos: 7, 0.5, wallZ], rot: [0, Math.PI, 0], normal: [0, 0, -1] },
                { id: 10, url: imagesList[10], w: 6.5, h: 4.8, pos: 0, 0.5, wallZ], rot: [0, Math.PI, 0], normal: [0, 0, -1] },
                { id: 11, url: imagesList[11], w: 6.5, h: 4.8, pos: [-7, 0.5, wallZ], rot: [0, Math.PI, 0], normal: [0, 0, -1] },
                { id: 12, url: imagesList[12], w: 6.5, h: 4.8, pos: [-14, 0.5, wallZ], rot: [0, Math.PI, 0], normal: [0, 0, -1] },
                
                // Right Wall (ಬಲ ಗೋಡೆ - 4 ಚಿತ್ರಗಳು)
                { id: 13, url: imagesList[13], w: 6.5, h: 4.8, pos: [wallX, 0.5, 12], rot: [0, -Math.PI/2, 0], normal: [-1, 0, 0] },
                { id: 14, url: imagesList[14], w: 6.5, h: 4.8, pos: [wallX, 0.5, 4], rot: [0, -Math.PI/2, 0], normal: [-1, 0, 0] },
                { id: 15, url: imagesList[15], w: 6.5, h: 4.8, pos: [wallX, 0.5, -4], rot: [0, -Math.PI/2, 0], normal: [-1, 0, 0] },
                { id: 16, url: imagesList[16], w: 6.5, h: 4.8, pos: [wallX, 0.5, -12], rot: [0, -Math.PI/2, 0], normal: [-1, 0, 0] }
            ];

            const textureLoader = new THREE.TextureLoader();

            galleryLayout.forEach((art, index) => {
                textureLoader.load(art.url, 
                    function(texture) {
                        createArtwork(art.id, texture, null, art.w, art.h, new THREE.Vector3(...art.pos), new THREE.Vector3(...art.rot), new THREE.Vector3(...art.normal));
                    },
                    undefined,
                    function(err) {
                        createArtwork(art.id, null, colors[index], art.w, art.h, new THREE.Vector3(...art.pos), new THREE.Vector3(...art.rot), new THREE.Vector3(...art.normal));
                    }
                );
            });

            // 3.5 ಸೆಕೆಂಡ್ ಇಂಟ್ರೋ ಟೈಮರ್
            setTimeout(() => { 
                const loader = document.getElementById('loader');
                loader.style.opacity = 0;
                setTimeout(() => { loader.style.display = 'none'; }, 800);
            }, 3500);

            let startX, startY;
            renderer.domElement.addEventListener('pointerdown', (e) => { startX = e.clientX; startY = e.clientY; });
            renderer.domElement.addEventListener('pointerup', (e) => {
                if (Math.abs(e.clientX - startX) < 5 && Math.abs(e.clientY - startY) < 5) {
                    checkIntersection(e);
                }
            });

            window.addEventListener('resize', onWindowResize, false);
        }

        function createArtwork(id, texture, fallbackColor, width, height, position, rotation, normal) {
            const group = new THREE.Group();
            const artGeo = new THREE.PlaneGeometry(width, height);
            
            let artMat = texture 
                ? new THREE.MeshStandardMaterial({ map: texture, roughness: 0.15, side: THREE.DoubleSide })
                : new THREE.MeshStandardMaterial({ color: fallbackColor, roughness: 0.4, side: THREE.DoubleSide });
            
            const artMesh = new THREE.Mesh(artGeo, artMat);
            
            // 🎯 ಕ್ರಾಪಿಂಗ್ ಆಗದಂತೆ ತಡೆಯುವ ಪಕ್ಕಾ 1.02 ಜೂಮ್ ಫಿಟ್ಟಿಂಗ್ ಫಾರ್ಮುಲಾ
            const vFOV = (camera.fov * Math.PI) / 180;
            let distanceForHeight = (height / 2) / Math.tan(vFOV / 2);
            
            const aspect = window.innerWidth / window.innerHeight;
            let distanceForWidth = (width / 2) / Math.tan((camera.fov * aspect * Math.PI) / 360);
            
            let distance = Math.max(distanceForHeight, distanceForWidth) * 1.02; 

            const camPos = position.clone().add(normal.clone().multiplyScalar(distance));

            artMesh.userData = { dynastyId: id, position: position.clone(), cameraPos: camPos };
            clickableObjects.push(artMesh); 
            group.add(artMesh);

            // ಹಸಿರು ಪ್ರಕೃತಿ ಥೀಮ್‌ಗೆ ಹೊಂದಿಕೊಳ್ಳುವ ಲೈಟ್ ಗ್ರೀನ್ ಬಾರ್ಡರ್ ವೈರ್‌ಫ್ರೇಮ್
            const frameGeo = new THREE.PlaneGeometry(width + 0.04, height + 0.04);
            const frameMat = new THREE.MeshBasicMaterial({ color: 0x00ff88, wireframe: true, side: THREE.DoubleSide });
            const frameMesh = new THREE.Mesh(frameGeo, frameMat);
            frameMesh.position.z = -0.003;
            group.add(frameMesh);

            group.position.copy(position);
            group.rotation.set(rotation.x, rotation.y, rotation.z);
            scene.add(group);
        }

        function checkIntersection(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(clickableObjects, true);

            if (intersects.length > 0) {
                const clickedMesh = intersects[0].object;
                if(clickedMesh.userData && clickedMesh.userData.dynastyId !== undefined) {
                    targetLookAt.copy(clickedMesh.userData.position);
                    targetCameraPos.copy(clickedMesh.userData.cameraPos);
                    isFocused = true;
                }
            } else {
                resetView();
            }
        }

        function resetView() {
            targetLookAt.set(0, 0, 0); 
            targetCameraPos.set(0, 0, 1.5);
            isFocused = false;
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.target.lerp(targetLookAt, 0.08);
            if (isFocused) {
                camera.position.lerp(targetCameraPos, 0.08);
            }
            controls.update();
            renderer.render(scene, camera);
        }

        init();
        animate();
    </script>
</body>
</html>
