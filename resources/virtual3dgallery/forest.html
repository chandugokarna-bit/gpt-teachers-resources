<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ಹರಿತ್ ಪಥ: ಜಗತ್ತಿನ ವಿಸ್ಮಯ ಅರಣ್ಯಗಳ ವೀಡಿಯೋ ಗ್ಯಾಲರಿ</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #010403; font-family: 'Segoe UI', sans-serif; color: #fff; }
        #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
        
        /* UI ಲೇಯರ್ - ರೀಸೆಟ್ ಬಟನ್‌ಗಾಗಿ */
        .ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; display: flex; flex-direction: column; justify-content: flex-end; padding: 25px; }
        .interactive { pointer-events: auto; }
        .nav-btn { background: rgba(0, 255, 150, 0.15); border: 1px solid #00ffaa; color: #00ffaa; padding: 10px 22px; border-radius: 25px; cursor: pointer; font-weight: bold; transition: 0.3s; backdrop-filter: blur(5px); }
        .nav-btn:hover { background: #00ffaa; color: #000; transform: scale(1.05); box-shadow: 0 0 15px rgba(0, 255, 150, 0.4); }
        
        /* 🎯 ಸಿನಿಮಾಟಿಕ್ 6 ಸೆಕೆಂಡ್ ಇಂಟ್ರೋ ಹೆಡ್‌ಲೈನ್ ಮತ್ತು ಲೋಡರ್ */
        #loader { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: radial-gradient(circle, #05140f 0%, #010302 100%); 
            z-index: 1000; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            transition: opacity 0.8s ease-in-out; 
        }
        .intro-headline {
            font-size: 46px;
            font-weight: 900;
            text-align: center;
            max-width: 950px;
            padding: 0 20px;
            line-height: 1.5;
            background: linear-gradient(45deg, #00ffaa, #a8ff78, #78ffd6, #00ffaa);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientMove 4s ease infinite, scaleUp 1.5s ease-out forwards;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .intro-sub {
            margin-top: 20px;
            font-size: 14px;
            color: #637870;
            letter-spacing: 6px;
            animation: fadeIn 2s ease-in forwards;
        }
        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        @keyframes scaleUp {
            0% { transform: scale(0.88); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        @keyframes fadeIn {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <!-- 6 ಸೆಕೆಂಡ್ ಪ್ರದರ್ಶನವಾಗುವ ಹೆಡ್‌ಲೈನ್ ಸ್ಕ್ರೀನ್ -->
    <div id="loader">
        <h1 class="intro-headline">ಜಗತ್ತಿನ ವಿವಿಧ ಅರಣ್ಯಗಳ ವೀಡಿಯೋ ಗ್ಯಾಲರಿ</h1>
        <p class="intro-sub">ECO-SPHERE • 3D IMMERSIVE VIDEO EXPERIENCE</p>
    </div>

    <div id="canvas-container"></div>

    <div class="ui-layer">
        <footer class="interactive" style="display: flex; justify-content: flex-end; width: 100%;">
            <button class="nav-btn" onclick="resetView()">Reset View</button>
        </footer>
    </div>

    <script>
        let scene, camera, renderer, controls, raycaster, mouse;
        const container = document.getElementById('canvas-container');
        const clickableObjects = [];
        const videoElements = [];

        let targetLookAt = new THREE.Vector3(0, 0, 0);
        let targetCameraPos = new THREE.Vector3(0, 0, 1.5);
        let isFocused = false;

        const colors = [0x00ffaa, 0x00aa77, 0x55ff55, 0xaaff00, 0x00ffff, 0x0088ff, 0x78ffd6, 0xa8ff78, 0x20bf6b, 0x26de81];

        // 🎯 ನಿಮ್ಮ ವೆಬ್‌ಸೈಟ್‌ನ ಮುಖ್ಯ ಲಿಂಕ್ ಅನ್ನು ಇಲ್ಲಿ ಹಾಕಿ (ಕೊನೆಯಲ್ಲಿ '/' ಇರಲಿ)
        // ಉದಾಹರಣೆಗೆ: "https://mywebsite.com/videos/"
        const websiteBaseUrl = "https://raw.githubusercontent.com/chandugokarna-bit/gpt-teachers-resources/main/images/Amazon/"; 

        // 10 ವೀಡಿಯೋಗಳ ಆಟೋಮ್ಯಾಟಿಕ್ ಲಿಂಕ್ ರಚನೆ (forest1.mp4, forest2.mp4...)
        const videosList = [];
        for(let i = 1; i <= 10; i++) {
            videosList.push(websiteBaseUrl + "forest" + i + ".mp4");
        }

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x010403);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.copy(targetCameraPos); 

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.07;
            controls.maxDistance = 18;
            controls.minDistance = 0.5;

            scene.add(new THREE.AmbientLight(0xffffff, 0.95));
            
            // 3D ಗ್ಯಾಲರಿ ಹಾಲ್
            const roomGeo = new THREE.BoxGeometry(32, 12, 32);
            const wallMat = new THREE.MeshStandardMaterial({ color: 0x040c08, side: THREE.BackSide });
            const room = new THREE.Mesh(roomGeo, wallMat);
            scene.add(room);

            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            const wallX = 16 - 0.05; 
            const wallZ = 16 - 0.05; 

            // 10 ವೀಡಿಯೋ ಪ್ಯಾನಲ್‌ಗಳ 3D ಲೇಔಟ್ ಜೋಡಣೆ
            const galleryLayout = [
                { id: 0, url: videosList[0], w: 7.5, h: 4.8, pos: [-4, 0.5, -wallZ], rot: [0, 0, 0], normal: [0, 0, 1] },
                { id: 1, url: videosList[1], w: 7.5, h: 4.8, pos: [4, 0.5, -wallZ], rot: [0, 0, 0], normal: [0, 0, 1] },
                
                { id: 2, url: videosList[2], w: 7.5, h: 4.8, pos: [-wallX, 0.5, -9.5], rot: [0, Math.PI/2, 0], normal: [1, 0, 0] },
                { id: 3, url: videosList[3], w: 7.5, h: 4.8, pos: [-wallX, 0.5, 0], rot: [0, Math.PI/2, 0], normal: [1, 0, 0] },
                { id: 4, url: videosList[4], w: 7.5, h: 4.8, pos: [-wallX, 0.5, 9.5], rot: [0, Math.PI/2, 0], normal: [1, 0, 0] },
                
                { id: 5, url: videosList[5], w: 7.5, h: 4.8, pos: [-4, 0.5, wallZ], rot: [0, Math.PI, 0], normal: [0, 0, -1] },
                { id: 6, url: videosList[6], w: 7.5, h: 4.8, pos: [4, 0.5, wallZ], rot: [0, Math.PI, 0], normal: [0, 0, -1] },
                
                { id: 7, url: videosList[7], w: 7.5, h: 4.8, pos: [wallX, 0.5, 9.5], rot: [0, -Math.PI/2, 0], normal: [-1, 0, 0] },
                { id: 8, url: videosList[8], w: 7.5, h: 4.8, pos: [wallX, 0.5, 0], rot: [0, -Math.PI/2, 0], normal: [-1, 0, 0] },
                { id: 9, url: videosList[9], w: 7.5, h: 4.8, pos: [wallX, 0.5, -9.5], rot: [0, -Math.PI/2, 0], normal: [-1, 0, 0] }
            ];

            // ಪ್ರತಿಯೊಂದು ವೀಡಿಯೋ ಲಿಂಕ್ ಅನ್ನು ಲೋಡ್ ಮಾಡಿ 3D ಪ್ಯಾನಲ್ ಕ್ರಿಯೇಟ್ ಮಾಡುವುದು
            galleryLayout.forEach((art, index) => {
                createVideoArtwork(art.id, art.url, colors[index], art.w, art.h, new THREE.Vector3(...art.pos), new THREE.Vector3(...art.rot), new THREE.Vector3(...art.normal));
            });

            // 🎯 ನಿಮ್ಮ ಬೇಡಿಕೆಯಂತೆ ಪಕ್ಕಾ 6 ಸೆಕೆಂಡ್ (6000ms) ಹೆಡ್‌ಲೈನ್ ತೋರಿಸಿ ನಂತರ ಗ್ಯಾಲರಿ ಓಪನ್ ಮಾಡುವುದು
            setTimeout(() => { 
                const loader = document.getElementById('loader');
                loader.style.opacity = 0;
                setTimeout(() => { 
                    loader.style.display = 'none'; 
                    // ಇಂಟ್ರೋ ಮುಗಿದ ತಕ್ಷಣ ಎಲ್ಲ ವೀಡಿಯೋಗಳ ಪ್ಲೇಬ್ಯಾಕ್ ಶುರುವಾಗುತ್ತದೆ
                    videoElements.forEach(v => v.play().catch(e => console.log("Auto-play blocked, interaction required")));
                }, 800);
            }, 6000);

            let startX, startY;
            renderer.domElement.addEventListener('pointerdown', (e) => { startX = e.clientX; startY = e.clientY; });
            renderer.domElement.addEventListener('pointerup', (e) => {
                if (Math.abs(e.clientX - startX) < 5 && Math.abs(e.clientY - startY) < 5) {
                    checkIntersection(e);
                }
            });

            window.addEventListener('resize', onWindowResize, false);
        }

        // 🎥 ವೀಡಿಯೋ ಟೆಕ್ಸ್ಚರ್ ಕ್ರಿಯೇಟ್ ಮಾಡುವ ವಿಶೇಷ ಫಂಕ್ಷನ್
        function createVideoArtwork(id, videoUrl, fallbackColor, width, height, position, rotation, normal) {
            const group = new THREE.Group();
            const artGeo = new THREE.PlaneGeometry(width, height);
            
            // HTML5 ವೀಡಿಯೋ ಎಲಿಮೆಂಟ್ ಸೃಷ್ಟಿ
            const video = document.createElement('video');
            video.src = videoUrl;
            video.crossOrigin = 'anonymous';
            video.loop = true;
            video.muted = true; // ಬ್ರೌಸರ್ ಆಟೋಪ್ಲೇ ಪಾಲಿಸಿಗೆ ಮ್ಯೂಟ್ ಮಾಡುವುದು ಕಡ್ಡಾಯ
            video.playsInline = true;
            video.load();
            videoElements.push(video);

            // Three.js ವೀಡಿಯೋ ಟೆಕ್ಸ್ಚರ್ ಸೆಟಪ್
            const texture = new THREE.VideoTexture(video);
            texture.minFilter = THREE.LinearFilter;
            texture.magFilter = THREE.LinearFilter;
            texture.format = THREE.RGBFormat;

            const artMat = new THREE.MeshStandardMaterial({ map: texture, roughness: 0.2, side: THREE.DoubleSide });
            const artMesh = new THREE.Mesh(artGeo, artMat);
            
            // ಪಕ್ಕದ ವೀಡಿಯೋಗಳು ಕಾಣಿಸದಂತೆ ತಡೆಯುವ ಪರ್ಫೆಕ್ಟ್ ಫುಲ್ ಸ್ಕ್ರೀನ್ 0.90 ಸೂತ್ರ
            const vFOV = (camera.fov * Math.PI) / 180;
            let distance = (height / 2) / Math.tan(vFOV / 2);
            
            const aspect = window.innerWidth / window.innerHeight;
            const distanceForWidth = (width / 2) / Math.tan((camera.fov * aspect * Math.PI) / 360);
            
            distance = Math.max(distance, distanceForWidth) * 0.90; 

            const camPos = position.clone().add(normal.clone().multiplyScalar(distance));

            artMesh.userData = { dynastyId: id, position: position.clone(), cameraPos: camPos };
            clickableObjects.push(artMesh); 
            group.add(artMesh);

            // ಫಾರೆಸ್ಟ್ ಗ್ರೀನ್ ನಿಯಾನ್ ಬಾರ್ಡರ್ ವೈರ್‌ಫ್ರೇಮ್
            const frameGeo = new THREE.PlaneGeometry(width + 0.04, height + 0.04);
            const frameMat = new THREE.MeshBasicMaterial({ color: 0x00ffaa, wireframe: true, side: THREE.DoubleSide });
            const frameMesh = new THREE.Mesh(frameGeo, frameMat);
            frameMesh.position.z = -0.003;
            group.add(frameMesh);

            group.position.copy(position);
            group.rotation.set(rotation.x, rotation.y, rotation.z);
            scene.add(group);
        }

        function checkIntersection(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(clickableObjects, true);

            if (intersects.length > 0) {
                const clickedMesh = intersects[0].object;
                if(clickedMesh.userData && clickedMesh.userData.dynastyId !== undefined) {
                    targetLookAt.copy(clickedMesh.userData.position);
                    targetCameraPos.copy(clickedMesh.userData.cameraPos);
                    isFocused = true;
                }
            } else {
                resetView();
            }
        }

        function resetView() {
            targetLookAt.set(0, 0, 0); 
            targetCameraPos.set(0, 0, 1.5);
            isFocused = false;
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.target.lerp(targetLookAt, 0.08);
            if (isFocused) {
                camera.position.lerp(targetCameraPos, 0.08);
            }
            controls.update();
            renderer.render(scene, camera);
        }

        init();
        animate();
    </script>
</body>
</html>
