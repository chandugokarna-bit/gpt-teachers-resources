<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ಆಸ್ಟ್ರೇಲಿಯಾ ಖಂಡದ ಜೀವ ಸಂಕುಲಗಳ ಗ್ಯಾಲರಿ</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #010103; font-family: 'Segoe UI', sans-serif; color: #fff; }
        #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
        
        /* UI ಲೇಯರ್ - ಕೇವಲ ರೀಸೆಟ್ ಬಟನ್‌ಗಾಗಿ */
        .ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; display: flex; flex-direction: column; justify-content: flex-end; padding: 25px; }
        .interactive { pointer-events: auto; }
        .nav-btn { background: rgba(255, 170, 0, 0.15); border: 1px solid #ffaa00; color: #ffaa00; padding: 10px 22px; border-radius: 25px; cursor: pointer; font-weight: bold; transition: 0.3s; backdrop-filter: blur(5px); }
        .nav-btn:hover { background: #ffaa00; color: #000; transform: scale(1.05); }
        
        /* 🎯 ಸಿನಿಮಾಟಿಕ್ ಕಲರ್‌ಫುಲ್ ಇಂಟ್ರೋ ಹೆಡ್‌ಲೈನ್ ಮತ್ತು ಲೋಡರ್ */
        #loader { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: radial-gradient(circle, #080b16 0%, #020205 100%); 
            z-index: 1000; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            transition: opacity 0.8s ease-in-out; 
        }
        .intro-headline {
            font-size: 48px;
            font-weight: 900;
            text-align: center;
            max-width: 900px;
            padding: 0 20px;
            line-height: 1.4;
            background: linear-gradient(45deg, #ffaa00, #ff0055, #00ffcc, #ffaa00);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientMove 4s ease infinite, scaleUp 1.5s ease-out forwards;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .intro-sub {
            margin-top: 20px;
            font-size: 16px;
            color: #888;
            letter-spacing: 4px;
            animation: fadeIn 2s ease-in forwards;
        }
        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        @keyframes scaleUp {
            0% { transform: scale(0.85); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        @keyframes fadeIn {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="loader">
        <h1 class="intro-headline">ಆಸ್ಟ್ರೇಲಿಯಾ ಖಂಡದ ಜೀವ ಸಂಕುಲಗಳ ಗ್ಯಾಲರಿ</h1>
        <p class="intro-sub">VIRTUAL 3D IMMERSIVE EXPERIENCE</p>
    </div>

    <div id="canvas-container"></div>

    <div class="ui-layer">
        <footer class="interactive" style="display: flex; justify-content: flex-end; width: 100%;">
            <button class="nav-btn" onclick="resetView()">Reset View</button>
        </footer>
    </div>

    <script>
        let scene, camera, renderer, controls, raycaster, mouse;
        const container = document.getElementById('canvas-container');
        const clickableObjects = [];

        let targetLookAt = new THREE.Vector3(0, 0, 0);
        let targetCameraPos = new THREE.Vector3(0, 0, 1.5);
        let isFocused = false;

        // 15 ಚಿತ್ರಗಳಿಗೆ ಬೇಕಾದ ಬ್ಯಾಕಪ್ ಬಣ್ಣಗಳು
        const colors = [
            0xff5555, 0x55ff55, 0x5555ff, 0xffff55, 0xff55ff, 
            0x55ffff, 0xffaa00, 0xaa00ff, 0x00ffaa, 0xeeff00,
            0xff3300, 0x00ff33, 0x3300ff, 0xff00aa, 0x00aaff
        ];

        // 🎯 ಇಲ್ಲಿ ನೀವು ನಿಮ್ಮ ಇಮೇಜ್ ಫೈಲ್ ಹೆಸರುಗಳನ್ನು ಬದಲಾಯಿಸಿಕೊಳ್ಳಬಹುದು (ಉದಾ: "aus1.jpeg", "aus2.jpeg" ಇತ್ಯಾದಿ)
        const imagesList = [
            "https://placehold.co/800x600/111/fff?text=1.+Kangaroo",        
            "https://placehold.co/800x600/111/fff?text=2.+Koala",           
            "https://placehold.co/800x600/111/fff?text=3.+Platypus",        
            "https://placehold.co/800x600/111/fff?text=4.+Wombat",          
            "https://placehold.co/800x600/111/fff?text=5.+Tasmanian+Devil", 
            "https://placehold.co/800x600/111/fff?text=6.+Emu",             
            "https://placehold.co/800x600/111/fff?text=7.+Kookaburra",      
            "https://placehold.co/800x600/111/fff?text=8.+Dingo",           
            "https://placehold.co/800x600/111/fff?text=9.+Echidna",         
            "https://placehold.co/800x600/111/fff?text=10.+Quokka",         
            "https://placehold.co/800x600/111/fff?text=11.+Cassowary",      
            "https://placehold.co/800x600/111/fff?text=12.+Wallaby",        
            "https://placehold.co/800x600/111/fff?text=13.+Sugar+Glider",   
            "https://placehold.co/800x600/111/fff?text=14.+Frilled+Lizard", 
            "https://placehold.co/800x600/111/fff?text=15.+Great+Barrier"   
        ];

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x020204);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.copy(targetCameraPos); 

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.07;
            controls.maxDistance = 22;
            controls.minDistance = 0.5;

            scene.add(new THREE.AmbientLight(0xffffff, 0.95));
            
            // ಬೃಹತ್ 3D ಗ್ಯಾಲರಿ ಹಾಲ್
            const roomWidth = 36, roomHeight = 12, roomDepth = 36;
            const roomGeo = new THREE.BoxGeometry(roomWidth, roomHeight, roomDepth);
            const wallMat = new THREE.MeshStandardMaterial({ color: 0x040406, side: THREE.BackSide });
            const room = new THREE.Mesh(roomGeo, wallMat);
            scene.add(room);

            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            const wallX = (roomWidth / 2) - 0.05; 
            const wallZ = (roomDepth / 2) - 0.05; 

            // 🎯 15 ಚಿತ್ರಗಳ ಪರ್ಫೆಕ್ಟ್ ಲೇಔಟ್ ಜೋಡಣೆ (ಎರರ್ ಫಿಕ್ಸ್ ಮಾಡಲಾಗಿದೆ)
            const galleryLayout = [
                // Front Wall
                { id: 0, url: imagesList[0], w: 6.5, h: 4.8, pos: [-12, 0.5, -wallZ], rot: [0, 0, 0], normal: [0, 0, 1] },
                { id: 1, url: imagesList[1], w: 6.5, h: 4.8, pos: [-4, 0.5, -wallZ], rot: [0, 0, 0], normal: [0, 0, 1] },
                { id: 2, url: imagesList[2], w: 6.5, h: 4.8, pos: [4, 0.5, -wallZ], rot: [0, 0, 0], normal: [0, 0, 1] },
                { id: 3, url: imagesList[3], w: 6.5, h: 4.8, pos: [12, 0.5, -wallZ], rot: [0, 0, 0], normal: [0, 0, 1] },
                
                // Left Wall
                { id: 4, url: imagesList[4], w: 6.5, h: 4.8, pos: [-wallX, 0.5, -12], rot: [0, Math.PI/2, 0], normal: [1, 0, 0] },
                { id: 5, url: imagesList[5], w: 6.5, h: 4.8, pos: [-wallX, 0.5, -4], rot: [0, Math.PI/2, 0], normal: [1, 0, 0] },
                { id: 6, url: imagesList[6], w: 6.5, h: 4.8, pos: [-wallX, 0.5, 4], rot: [0, Math.PI/2, 0], normal: [1, 0, 0] },
                { id: 7, url: imagesList[7], w: 6.5, h: 4.8, pos: [-wallX, 0.5, 12], rot: [0, Math.PI/2, 0], normal: [1, 0, 0] },
                
                // Back Wall
                { id: 8, url: imagesList[8], w: 6.5, h: 4.8, pos: [12, 0.5, wallZ], rot: [0, Math.PI, 0], normal: [0, 0, -1] },
                { id: 9, url: imagesList[9], w: 6.5, h: 4.8, pos: [4, 0.5, wallZ], rot: [0, Math.PI, 0], normal: [0, 0, -1] },
                { id: 10, url: imagesList[10], w: 6.5, h: 4.8, pos: [-4, 0.5, wallZ], rot: [0, Math.PI, 0], normal: [0, 0, -1] },
                { id: 11, url: imagesList[11], w: 6.5, h: 4.8, pos: [-12, 0.5, wallZ], rot: [0, Math.PI, 0], normal: [0, 0, -1] },
                
                // Right Wall
                { id: 12, url: imagesList[12], w: 6.5, h: 4.8, pos: [wallX, 0.5, 8], rot: [0, -Math.PI/2, 0], normal: [-1, 0, 0] },
                { id: 13, url: imagesList[13], w: 6.5, h: 4.8, pos: [wallX, 0.5, 0], rot: [0, -Math.PI/2, 0], normal: [-1, 0, 0] },
                { id: 14, url: imagesList[14], w: 6.5, h: 4.8, pos: [wallX, 0.5, -8], rot: [0, -Math.PI/2, 0], normal: [-1, 0, 0] }
            ];

            const textureLoader = new THREE.TextureLoader();

            galleryLayout.forEach((art, index) => {
                textureLoader.load(art.url, 
                    function(texture) {
                        createArtwork(art.id, texture, null, art.w, art.h, new THREE.Vector3(...art.pos), new THREE.Vector3(...art.rot), new THREE.Vector3(...art.normal));
                    },
                    undefined,
                    function(err) {
                        createArtwork(art.id, null, colors[index], art.w, art.h, new THREE.Vector3(...art.pos), new THREE.Vector3(...art.rot), new THREE.Vector3(...art.normal));
                    }
                );
            });

            // 3.5 ಸೆಕೆಂಡ್ ಸಿನಿಮಾಟಿಕ್ ಇಂಟ್ರೋ ಪ್ರದರ್ಶನ
            setTimeout(() => { 
                const loader = document.getElementById('loader');
                loader.style.opacity = 0;
                setTimeout(() => { loader.style.display = 'none'; }, 800);
            }, 3500);

            let startX, startY;
            renderer.domElement.addEventListener('pointerdown', (e) => { startX = e.clientX; startY = e.clientY; });
            renderer.domElement.addEventListener('pointerup', (e) => {
                if (Math.abs(e.clientX - startX) < 5 && Math.abs(e.clientY - startY) < 5) {
                    checkIntersection(e);
                }
            });

            window.addEventListener('resize', onWindowResize, false);
        }

        function createArtwork(id, texture, fallbackColor, width, height, position, rotation, normal) {
            const group = new THREE.Group();
            const artGeo = new THREE.PlaneGeometry(width, height);
            
            let artMat = texture 
                ? new THREE.MeshStandardMaterial({ map: texture, roughness: 0.15, side: THREE.DoubleSide })
                : new THREE.MeshStandardMaterial({ color: fallbackColor, roughness: 0.4, side: THREE.DoubleSide });
            
            const artMesh = new THREE.Mesh(artGeo, artMat);
            
            const vFOV = (camera.fov * Math.PI) / 180;
            let distance = (height / 2) / Math.tan(vFOV / 2);
            
            const aspect = window.innerWidth / window.innerHeight;
            const distanceForWidth = (width / 2) / Math.tan((camera.fov * aspect * Math.PI) / 360);
            
            distance = Math.max(distance, distanceForWidth) * 0.90; 

            const camPos = position.clone().add(normal.clone().multiplyScalar(distance));

            artMesh.userData = { dynastyId: id, position: position.clone(), cameraPos: camPos };
            clickableObjects.push(artMesh); 
            group.add(artMesh);

            const frameGeo = new THREE.PlaneGeometry(width + 0.04, height + 0.04);
            const frameMat = new THREE.MeshBasicMaterial({ color: 0x00ffcc, wireframe: true, side: THREE.DoubleSide });
            const frameMesh = new THREE.Mesh(frameGeo, frameMat);
            frameMesh.position.z = -0.003;
            group.add(frameMesh);

            group.position.copy(position);
            group.rotation.set(rotation.x, rotation.y, rotation.z);
            scene.add(group);
        }

        function checkIntersection(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(clickableObjects, true);

            if (intersects.length > 0) {
                const clickedMesh = intersects[0].object;
                if(clickedMesh.userData && clickedMesh.userData.dynastyId !== undefined) {
                    targetLookAt.copy(clickedMesh.userData.position);
                    targetCameraPos.copy(clickedMesh.userData.cameraPos);
                    isFocused = true;
                }
            } else {
                resetView();
            }
        }

        function resetView() {
            targetLookAt.set(0, 0, 0); 
            targetCameraPos.set(0, 0, 1.5);
            isFocused = false;
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.target.lerp(targetLookAt, 0.08);
            if (isFocused) {
                camera.position.lerp(targetCameraPos, 0.08);
            }
            controls.update();
            renderer.render(scene, camera);
        }

        init();
        animate();
    </script>
</body>
</html>
