<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ಪ್ರಧಾನ ಪಥ: ಭಾರತದ ಪ್ರಧಾನ ಮಂತ್ರಿಗಳ ಭವ್ಯ ಗ್ಯಾಲರಿ</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #020306; font-family: 'Segoe UI', sans-serif; color: #fff; }
        #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
        
        /* UI ಲೇಯರ್ - ರೀಸೆಟ್ ಬಟನ್‌ಗಾಗಿ */
        .ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; display: flex; flex-direction: column; justify-content: flex-end; padding: 25px; }
        .interactive { pointer-events: auto; }
        .nav-btn { background: rgba(255, 170, 0, 0.15); border: 1px solid #ffaa00; color: #ffaa00; padding: 10px 22px; border-radius: 25px; cursor: pointer; font-weight: bold; transition: 0.3s; backdrop-filter: blur(5px); }
        .nav-btn:hover { background: #ffaa00; color: #000; transform: scale(1.05); box-shadow: 0 0 15px rgba(255, 170, 0, 0.3); }
        
        /* ಸಿನಿಮಾಟಿಕ್ ಇಂಟ್ರೋ ಹೆಡ್‌ಲೈನ್ ಮತ್ತು ಲೋಡರ್ */
        #loader { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: radial-gradient(circle, #0c0f1d 0%, #020205 100%); 
            z-index: 1000; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            transition: opacity 0.8s ease-in-out; 
        }
        .intro-headline {
            font-size: 46px;
            font-weight: 900;
            text-align: center;
            max-width: 950px;
            padding: 0 20px;
            line-height: 1.5;
            background: linear-gradient(45deg, #ff9933, #ffffff, #138808, #ff9933);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientMove 4s ease infinite, scaleUp 1.5s ease-out forwards;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .intro-sub {
            margin-top: 20px;
            font-size: 14px;
            color: #8892b0;
            letter-spacing: 6px;
            animation: fadeIn 2s ease-in forwards;
        }
        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        @keyframes scaleUp {
            0% { transform: scale(0.88); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        @keyframes fadeIn {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="loader">
        <h1 class="intro-headline">ಭಾರತದ ಪ್ರಧಾನ ಮಂತ್ರಿಗಳ ಭವ್ಯ ವರ್ಚುವಲ್ ಗ್ಯಾಲರಿ</h1>
        <p class="intro-sub">PRADHAN PATH • 3D IMMERSIVE EXPERIENCE</p>
    </div>

    <div id="canvas-container"></div>

    <div class="ui-layer">
        <footer class="interactive" style="display: flex; justify-content: flex-end; width: 100%;">
            <button class="nav-btn" onclick="resetView()">Reset View</button>
        </footer>
    </div>

    <script>
        let scene, camera, renderer, controls, raycaster, mouse;
        const container = document.getElementById('canvas-container');
        const clickableObjects = [];

        let targetLookAt = new THREE.Vector3(0, 0, 0);
        let targetCameraPos = new THREE.Vector3(0, 0, 1.5);
        let isFocused = false;

        const colors = [
            0xff9933, 0xffffff, 0x138808, 0x0055ff, 0xffaa00,
            0x4da6ff, 0x80bfff, 0x3399ff, 0x0080ff, 0x0066cc,
            0xaa00ff, 0x00ffaa, 0xff00aa, 0xeeff00
        ];

        // 🎯 ನಿಮ್ಮ ಬೇಸ್ ಲಿಂಕ್ ಬಳಸಿ 14 ಪ್ರಧಾನ ಮಂತ್ರಿಗಳ ಪೂರ್ಣ ಇಮೇಜ್ ಪಾತ್ ರೆಡಿ ಮಾಡಲಾಗಿದೆ
        const baseUrl = "https://raw.githubusercontent.com/chandugokarna-bit/gpt-teachers-resources/main/images/pms/";
        const imagesList = [
            baseUrl + "modi.png",       // 0 (ಮಧ್ಯಭಾಗದಲ್ಲಿ ಇಡಲು ಮೊದಲ ಇಂಡೆಕ್ಸ್)
            baseUrl + "neharu.jpg",     // 1
            baseUrl + "shashtri.jpg",   // 2
            baseUrl + "indira.jpg",     // 3
            baseUrl + "morarji.jpg",    // 4
            baseUrl + "choudari.jpg",   // 5
            baseUrl + "rajiv.jpg",      // 6
            baseUrl + "vp.jpg",         // 7
            baseUrl + "pv.png",         // 8
            baseUrl + "atal.png",       // 9
            baseUrl + "hddgowda.png",   // 10
            baseUrl + "gujral.png",     // 11
            baseUrl + "mohan.png",      // 12
            baseUrl + "nanda.jpg"       // 13
        ];

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x020306);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.copy(targetCameraPos); 

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.07;
            controls.maxDistance = 20;
            controls.minDistance = 0.5;

            scene.add(new THREE.AmbientLight(0xffffff, 0.95));
            
            // ಬೃಹತ್ ಹಾಲ್ ಸೆಟಪ್
            const roomWidth = 34, roomHeight = 12, roomDepth = 34;
            const roomGeo = new THREE.BoxGeometry(roomWidth, roomHeight, roomDepth);
            const wallMat = new THREE.MeshStandardMaterial({ color: 0x05070f, side: THREE.BackSide });
            const room = new THREE.Mesh(roomGeo, wallMat);
            scene.add(room);

            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            const wallX = (roomWidth / 2) - 0.05; 
            const wallZ = (roomDepth / 2) - 0.05; 

            // 🎯 ತಾಂತ್ರಿಕ ಲೇಔಟ್: ಮೋದಿ ಅವರ ಚಿತ್ರ (id: 0) ಸರಿಯಾಗಿ ಮುಂಭಾಗದ ಗೋಡೆಯ ನಡು ಮಧ್ಯದಲ್ಲಿದೆ [0, 0.5, -wallZ]
            const galleryLayout = [
                // Front Wall (ಮುಂಭಾಗದ ಗೋಡೆ - ಮೋದಿ ಮಧ್ಯದಲ್ಲಿ)
                { id: 0, url: imagesList[0], w: 6.8, h: 5.2, pos: [0, 0.5, -wallZ], rot: [0, 0, 0], normal: [0, 0, 1] }, // ಮೋದಿಜೀ 👑
                { id: 1, url: imagesList[1], w: 6.5, h: 5.0, pos: [-8, 0.5, -wallZ], rot: [0, 0, 0], normal: [0, 0, 1] },
                { id: 2, url: imagesList[2], w: 6.5, h: 5.0, pos: [8, 0.5, -wallZ], rot: [0, 0, 0], normal: [0, 0, 1] },
                
                // Left Wall (ಎಡ ಗೋಡೆ)
                { id: 3, url: imagesList[3], w: 6.5, h: 5.0, pos: [-wallX, 0.5, -11], rot: [0, Math.PI/2, 0], normal: [1, 0, 0] },
                { id: 4, url: imagesList[4], w: 6.5, h: 5.0, pos: [-wallX, 0.5, -3.8], rot: [0, Math.PI/2, 0], normal: [1, 0, 0] },
                { id: 5, url: imagesList[5], w: 6.5, h: 5.0, pos: [-wallX, 0.5, 3.8], rot: [0, Math.PI/2, 0], normal: [1, 0, 0] },
                { id: 6, url: imagesList[6], w: 6.5, h: 5.0, pos: [-wallX, 0.5, 11], rot: [0, Math.PI/2, 0], normal: [1, 0, 0] },
                
                // Back Wall (ಹಿಂಬದಿಯ ಗೋಡೆ)
                { id: 7, url: imagesList[7], w: 6.5, h: 5.0, pos: [8, 0.5, wallZ], rot: [0, Math.PI, 0], normal: [0, 0, -1] },
                { id: 8, url: imagesList[8], w: 6.5, h: 5.0, pos: [0, 0.5, wallZ], rot: [0, Math.PI, 0], normal: [0, 0, -1] },
                { id: 9, url: imagesList[9], w: 6.5, h: 5.0, pos: [-8, 0.5, wallZ], rot: [0, Math.PI, 0], normal: [0, 0, -1] },
                
                // Right Wall (ಬಲ ಗೋಡೆ)
                { id: 10, url: imagesList[10], w: 6.5, h: 5.0, pos: [wallX, 0.5, 11], rot: [0, -Math.PI/2, 0], normal: [-1, 0, 0] },
                { id: 11, url: imagesList[11], w: 6.5, h: 5.0, pos: [wallX, 0.5, 3.8], rot: [0, -Math.PI/2, 0], normal: [-1, 0, 0] },
                { id: 12, url: imagesList[12], w: 6.5, h: 5.0, pos: [wallX, 0.5, -3.8], rot: [0, -Math.PI/2, 0], normal: [-1, 0, 0] },
                { id: 13, url: imagesList[13], w: 6.5, h: 5.0, pos: [wallX, 0.5, -11], rot: [0, -Math.PI/2, 0], normal: [-1, 0, 0] }
            ];

            const textureLoader = new THREE.TextureLoader();

            galleryLayout.forEach((art, index) => {
                textureLoader.load(art.url, 
                    function(texture) {
                        createArtwork(art.id, texture, null, art.w, art.h, new THREE.Vector3(...art.pos), new THREE.Vector3(...art.rot), new THREE.Vector3(...art.normal));
                    },
                    undefined,
                    function(err) {
                        createArtwork(art.id, null, colors[index], art.w, art.h, new THREE.Vector3(...art.pos), new THREE.Vector3(...art.rot), new THREE.Vector3(...art.normal));
                    }
                );
            });

            // ಇಂಟ್ರೋ ಟೈಮರ್ (3.5 ಸೆಕೆಂಡ್)
            setTimeout(() => { 
                const loader = document.getElementById('loader');
                loader.style.opacity = 0;
                setTimeout(() => { loader.style.display = 'none'; }, 800);
            }, 3500);

            let startX, startY;
            renderer.domElement.addEventListener('pointerdown', (e) => { startX = e.clientX; startY = e.clientY; });
            renderer.domElement.addEventListener('pointerup', (e) => {
                if (Math.abs(e.clientX - startX) < 5 && Math.abs(e.clientY - startY) < 5) {
                    checkIntersection(e);
                }
            });

            window.addEventListener('resize', onWindowResize, false);
        }

        function createArtwork(id, texture, fallbackColor, width, height, position, rotation, normal) {
            const group = new THREE.Group();
            const artGeo = new THREE.PlaneGeometry(width, height);
            
            let artMat = texture 
                ? new THREE.MeshStandardMaterial({ map: texture, roughness: 0.15, side: THREE.DoubleSide })
                : new THREE.MeshStandardMaterial({ color: fallbackColor, roughness: 0.4, side: THREE.DoubleSide });
            
            const artMesh = new THREE.Mesh(artGeo, artMat);
            
            // ಪಕ್ಕದ ಚಿತ್ರಗಳು ಗಾಯಬ್ ಆಗುವ ಅಲ್ಟ್ರಾ ಫುಲ್ ಸ್ಕ್ರೀನ್ 0.90 ಸೂತ್ರ
            const vFOV = (camera.fov * Math.PI) / 180;
            let distance = (height / 2) / Math.tan(vFOV / 2);
            
            const aspect = window.innerWidth / window.innerHeight;
            const distanceForWidth = (width / 2) / Math.tan((camera.fov * aspect * Math.PI) / 360);
            
            distance = Math.max(distance, distanceForWidth) * 0.90; 

            const camPos = position.clone().add(normal.clone().multiplyScalar(distance));

            artMesh.userData = { dynastyId: id, position: position.clone(), cameraPos: camPos };
            clickableObjects.push(artMesh); 
            group.add(artMesh);

            // ಭಾರತದ ತ್ರಿವರ್ಣ ಶೈಲಿಗೆ ಹೊಂದಿಕೊಳ್ಳುವ ಅಶೋಕ ಚಕ್ರ ಬ್ಲೂ ಬಾರ್ಡರ್ ವೈರ್‌ಫ್ರೇಮ್
            const frameGeo = new THREE.PlaneGeometry(width + 0.04, height + 0.04);
            const frameMat = new THREE.MeshBasicMaterial({ color: 0x0055ff, wireframe: true, side: THREE.DoubleSide });
            const frameMesh = new THREE.Mesh(frameGeo, frameMat);
            frameMesh.position.z = -0.003;
            group.add(frameMesh);

            group.position.copy(position);
            group.rotation.set(rotation.x, rotation.y, rotation.z);
            scene.add(group);
        }

        function checkIntersection(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(clickableObjects, true);

            if (intersects.length > 0) {
                const clickedMesh = intersects[0].object;
                if(clickedMesh.userData && clickedMesh.userData.dynastyId !== undefined) {
                    targetLookAt.copy(clickedMesh.userData.position);
                    targetCameraPos.copy(clickedMesh.userData.cameraPos);
                    isFocused = true;
                }
            } else {
                resetView();
            }
        }

        function resetView() {
            targetLookAt.set(0, 0, 0); 
            targetCameraPos.set(0, 0, 1.5);
            isFocused = false;
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.target.lerp(targetLookAt, 0.08);
            if (isFocused) {
                camera.position.lerp(targetCameraPos, 0.08);
            }
            controls.update();
            renderer.render(scene, camera);
        }

        init();
        animate();
    </script>
</body>
</html>
