<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ಜ್ಞಾನಗಂಗೋತ್ರಿ - ಕನ್ನಡದ ಜ್ಞಾನಪೀಠ ಕಾವ್ಯ ಗ್ಯಾಲರಿ</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #010103; font-family: 'Segoe UI', sans-serif; color: #fff; }
        #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
        
        /* UI ಲೇಯರ್ - ಕೇವಲ ರೀಸೆಟ್ ಬಟನ್‌ಗಾಗಿ */
        .ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; display: flex; flex-direction: column; justify-content: flex-end; padding: 25px; }
        .interactive { pointer-events: auto; }
        .nav-btn { background: rgba(255, 170, 0, 0.15); border: 1px solid #ffaa00; color: #ffaa00; padding: 10px 22px; border-radius: 25px; cursor: pointer; font-weight: bold; transition: 0.3s; backdrop-filter: blur(5px); }
        .nav-btn:hover { background: #ffaa00; color: #000; transform: scale(1.05); }
        
        /* ಸೇಫ್ ಲೋಡರ್ */
        #loader { position: fixed; top: 10px; left: 10px; z-index: 1000; background: rgba(0,0,0,0.7); padding: 8px 15px; border-radius: 20px; font-size: 12px; color: #ffaa00; pointer-events: none; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="loader">ಲೋಡ್ ಆಗುತ್ತಿದೆ...</div>

    <div id="canvas-container"></div>

    <div class="ui-layer">
        <footer class="interactive" style="display: flex; justify-content: flex-end; width: 100%;">
            <button class="nav-btn" onclick="resetView()">Reset View</button>
        </footer>
    </div>

    <script>
        let scene, camera, renderer, controls, raycaster, mouse;
        const container = document.getElementById('canvas-container');
        const clickableObjects = [];

        let targetLookAt = new THREE.Vector3(0, 0, 0);
        let targetCameraPos = new THREE.Vector3(0, 0, 1.5);
        let isFocused = false;

        const colors = [0xff5555, 0x55ff55, 0x5555ff, 0xffff55, 0xff55ff, 0x55ffff, 0xffaa00, 0xaa00ff];

        const imagesList = [
            "https://raw.githubusercontent.com/chandugokarna-bit/gpt-teachers-resources/main/images/kuvempu.JPG", // ಕುವೆಂಪು (ಉದಾಹರಣೆ ಲಿಂಕ್)
            "https://raw.githubusercontent.com/chandugokarna-bit/gpt-teachers-resources/main/images/bendre.JPG", 
            "https://raw.githubusercontent.com/chandugokarna-bit/gpt-teachers-resources/main/images/shivaram.JPG", 
            "https://raw.githubusercontent.com/chandugokarna-bit/gpt-teachers-resources/main/images/masti.JPG", 
            "https://raw.githubusercontent.com/chandugokarna-bit/gpt-teachers-resources/main/images/vinayak.JPG", 
            "https://raw.githubusercontent.com/chandugokarna-bit/gpt-teachers-resources/main/images/anant.JPG", 
            "https://raw.githubusercontent.com/chandugokarna-bit/gpt-teachers-resources/main/images/girish.JPG", 
            "https://raw.githubusercontent.com/chandugokarna-bit/gpt-teachers-resources/main/images/chandra.JPG"
        ];

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x020204);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.copy(targetCameraPos); 

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.07;
            controls.maxDistance = 18;
            controls.minDistance = 0.5;

            scene.add(new THREE.AmbientLight(0xffffff, 0.95));
            
            // ಬೃಹತ್ ಹಾಲ್
            const roomGeo = new THREE.BoxGeometry(32, 12, 32);
            const wallMat = new THREE.MeshStandardMaterial({ color: 0x040406, side: THREE.BackSide });
            const room = new THREE.Mesh(roomGeo, wallMat);
            scene.add(room);

            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            const wallX = 16 - 0.05; 
            const wallZ = 16 - 0.05; 

            // ಗೋಡೆಗಳ ಮೇಲೆ ಚಿತ್ರಗಳ ಜೋಡಣೆ
            const galleryLayout = [
                { id: 0, url: imagesList[0], w: 7.5, h: 5.5, pos: [-4, 0.5, -wallZ], rot: [0, 0, 0], normal: [0, 0, 1] },
                { id: 1, url: imagesList[1], w: 7.5, h: 5.5, pos: [4, 0.5, -wallZ], rot: [0, 0, 0], normal: [0, 0, 1] },
                
                { id: 2, url: imagesList[2], w: 7.5, h: 5.5, pos: [-wallX, 0.5, -5], rot: [0, Math.PI/2, 0], normal: [1, 0, 0] },
                { id: 3, url: imagesList[3], w: 7.5, h: 5.5, pos: [-wallX, 0.5, 5], rot: [0, Math.PI/2, 0], normal: [1, 0, 0] },
                
                { id: 4, url: imagesList[4], w: 7.5, h: 5.5, pos: [-4, 0.5, wallZ], rot: [0, Math.PI, 0], normal: [0, 0, -1] },
                { id: 5, url: imagesList[5], w: 7.5, h: 5.5, pos: [4, 0.5, wallZ], rot: [0, Math.PI, 0], normal: [0, 0, -1] },
                
                { id: 6, url: imagesList[6], w: 7.5, h: 5.5, pos: [wallX, 0.5, 5], rot: [0, -Math.PI/2, 0], normal: [-1, 0, 0] },
                { id: 7, url: imagesList[7], w: 7.5, h: 5.5, pos: [wallX, 0.5, -5], rot: [0, -Math.PI/2, 0], normal: [-1, 0, 0] }
            ];

            const textureLoader = new THREE.TextureLoader();

            galleryLayout.forEach((art, index) => {
                textureLoader.load(art.url, 
                    function(texture) {
                        createArtwork(art.id, texture, null, art.w, art.h, new THREE.Vector3(...art.pos), new THREE.Vector3(...art.rot), new THREE.Vector3(...art.normal));
                    },
                    undefined,
                    function(err) {
                        createArtwork(art.id, null, colors[index], art.w, art.h, new THREE.Vector3(...art.pos), new THREE.Vector3(...art.rot), new THREE.Vector3(...art.normal));
                    }
                );
            });

            setTimeout(() => { document.getElementById('loader').style.display = 'none'; }, 1500);

            let startX, startY;
            renderer.domElement.addEventListener('pointerdown', (e) => { startX = e.clientX; startY = e.clientY; });
            renderer.domElement.addEventListener('pointerup', (e) => {
                if (Math.abs(e.clientX - startX) < 5 && Math.abs(e.clientY - startY) < 5) {
                    checkIntersection(e);
                }
            });

            window.addEventListener('resize', onWindowResize, false);
        }

        function createArtwork(id, texture, fallbackColor, width, height, position, rotation, normal) {
            const group = new THREE.Group();
            const artGeo = new THREE.PlaneGeometry(width, height);
            
            let artMat = texture 
                ? new THREE.MeshStandardMaterial({ map: texture, roughness: 0.15, side: THREE.DoubleSide })
                : new THREE.MeshStandardMaterial({ color: fallbackColor, roughness: 0.4, side: THREE.DoubleSide });
            
            const artMesh = new THREE.Mesh(artGeo, artMat);
            
            // 🎯 ಹೊಸ ಮ್ಯಾಜಿಕ್ ಲೆಕ್ಕಾಚಾರ: ಪಕ್ಕದ ಫೋಟೋಗಳು ಕಾಣಿಸದಂತೆ ಕ್ಯಾಮೆರಾವನ್ನು ಫೋಟೋಗೆ ಇನ್ನಷ್ಟು ಹತ್ತಿರ ತರುವ ಸೂತ್ರ
            const vFOV = (camera.fov * Math.PI) / 180;
            let distance = (height / 2) / Math.tan(vFOV / 2);
            
            const aspect = window.innerWidth / window.innerHeight;
            const distanceForWidth = (width / 2) / Math.tan((camera.fov * aspect * Math.PI) / 360);
            
            // 0.96 ಇದ್ದದ್ದನ್ನು 0.90 ಕ್ಕೆ ಇಳಿಸಲಾಗಿದೆ, ಇದರಿಂದ ಕ್ಯಾಮೆರಾ ಫೋಟೋವನ್ನು ಅಚ್ಚುಕಟ್ಟಾಗಿ ಕೇವಲ ಫ್ರೇಮ್ ಒಳಗೆ ಮಾತ್ರ ಹಿಡಿದಿಡುತ್ತದೆ
            distance = Math.max(distance, distanceForWidth) * 0.90; 

            const camPos = position.clone().add(normal.clone().multiplyScalar(distance));

            artMesh.userData = { dynastyId: id, position: position.clone(), cameraPos: camPos };
            clickableObjects.push(artMesh); 
            group.add(artMesh);

            // ಸೂಕ್ಷ್ಮ ಬಾರ್ಡರ್
            const frameGeo = new THREE.PlaneGeometry(width + 0.04, height + 0.04);
            const frameMat = new THREE.MeshBasicMaterial({ color: 0x00ffcc, wireframe: true, side: THREE.DoubleSide });
            const frameMesh = new THREE.Mesh(frameGeo, frameMat);
            frameMesh.position.z = -0.003;
            group.add(frameMesh);

            group.position.copy(position);
            group.rotation.set(rotation.x, rotation.y, rotation.z);
            scene.add(group);
        }

        function checkIntersection(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(clickableObjects, true);

            if (intersects.length > 0) {
                const clickedMesh = intersects[0].object;
                if(clickedMesh.userData && clickedMesh.userData.dynastyId !== undefined) {
                    targetLookAt.copy(clickedMesh.userData.position);
                    targetCameraPos.copy(clickedMesh.userData.cameraPos);
                    isFocused = true;
                    // 🎯 ನಿಮ್ಮ ಐಡಿಯಾ ಪ್ರಕಾರ ಇಲ್ಲಿ ಯಾವುದೇ ಟೆಕ್ಸ್ಟ್ ಬಾರ್ ಅನ್ನು ಆಕ್ಟಿವೇಟ್ ಮಾಡುತ್ತಿಲ್ಲ!
                }
            } else {
                // ಫೋಟೋ ಬಿಟ್ಟು ಹೊರಗಡೆ ಎಲ್ಲಾದರೂ ಕ್ಲಿಕ್ ಮಾಡಿದರೆ ನಾರ್ಮಲ್ ವ್ಯೂಗೆ ಮರಳುತ್ತದೆ
                resetView();
            }
        }

        function resetView() {
            targetLookAt.set(0, 0, 0); 
            targetCameraPos.set(0, 0, 1.5);
            isFocused = false;
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.target.lerp(targetLookAt, 0.08);
            if (isFocused) {
                camera.position.lerp(targetCameraPos, 0.08);
            }
            controls.update();
            renderer.render(scene, camera);
        }

        init();
        animate();
    </script>
</body>
</html>
