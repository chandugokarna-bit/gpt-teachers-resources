<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ಜ್ಞಾನಗಂಗೋತ್ರಿ - ಕನ್ನಡದ ಜ್ಞಾನಪೀಠ ಕಾವ್ಯ ಗ್ಯಾಲರಿ</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #010103; font-family: 'Segoe UI', sans-serif; color: #fff; }
        #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
        
        /* UI ಲೇಯರ್ - ಕೇವಲ ರೀಸೆಟ್ ಬಟನ್‌ಗಾಗಿ */
        .ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; display: flex; flex-direction: column; justify-content: flex-end; padding: 20px; }
        .interactive { pointer-events: auto; }
        .nav-btn { background: rgba(255, 170, 0, 0.2); border: 1px solid #ffaa00; color: #ffaa00; padding: 8px 18px; border-radius: 20px; cursor: pointer; font-weight: bold; transition: 0.3s; backdrop-filter: blur(5px); }
        .nav-btn:hover { background: #ffaa00; color: #000; transform: scale(1.05); }

        /* 🎯 ಫೋಟೋ ಕ್ಲಿಕ್ ಮಾಡಿದಾಗ ಕೆಳಭಾಗದಲ್ಲಿ ಮೂಡುವ ಅತ್ಯಂತ ಚಿಕ್ಕ ಸಿನಿಮಾಟಿಕ್ ವಿವರಣೆ ಪಟ್ಟಿ */
        #cinema-info-bar {
            position: fixed;
            bottom: -150px; /* ಆರಂಭದಲ್ಲಿ ಅಡಗಿರುತ್ತದೆ */
            left: 50%;
            transform: translateX(-50%);
            width: 85%;
            max-width: 800px;
            background: rgba(4, 4, 8, 0.92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 255, 200, 0.35);
            border-bottom: none;
            border-radius: 16px 16px 0 0;
            padding: 15px 25px;
            z-index: 100;
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            gap: 4px;
            pointer-events: auto;
        }
        #cinema-info-bar.active { bottom: 0; } /* ಕ್ಲಿಕ್ ಮಾಡಿದಾಗ ಮೇಲಕ್ಕೆ ಬರುತ್ತದೆ */
        
        #popup-title { font-size: 16px; color: #ffaa00; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
        #popup-desc { font-size: 13px; color: #e2e8f0; line-height: 1.5; }
        
        /* ಕ್ಲೋಸ್ ಬಟನ್ ಶೈಲಿ */
        .close-x { background: rgba(255, 255, 255, 0.1); border: none; color: #fff; width: 24px; height: 24px; border-radius: 50%; cursor: pointer; font-size: 11px; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
        .close-x:hover { background: #ff3333; }
        
        /* ಸೇಫ್ ಲೋಡರ್ */
        #loader { position: fixed; top: 10px; left: 10px; z-index: 1000; background: rgba(0,0,0,0.7); padding: 8px 15px; border-radius: 20px; font-size: 12px; color: #ffaa00; pointer-events: none; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="loader">ಲೋಡ್ ಆಗುತ್ತಿದೆ...</div>
    
    <div id="cinema-info-bar">
        <div id="popup-title">
            <span id="poet-name">ಕವಿಗಳ ವಿವರ</span>
            <button class="close-x" onclick="resetView()">✕</button>
        </div>
        <div id="popup-desc">ವಿವರಗಳು...</div>
    </div>

    <div id="canvas-container"></div>

    <div class="ui-layer">
        <footer class="interactive" style="display: flex; justify-content: flex-end; width: 100%;">
            <button class="nav-btn" onclick="resetView()">Reset View</button>
        </footer>
    </div>

    <script>
        let scene, camera, renderer, controls, raycaster, mouse;
        const container = document.getElementById('canvas-container');
        const clickableObjects = [];

        let targetLookAt = new THREE.Vector3(0, 0, 0);
        let targetCameraPos = new THREE.Vector3(0, 0, 1.5);
        let isFocused = false;

        const colors = [0xff5555, 0x55ff55, 0x5555ff, 0xffff55, 0xff55ff, 0x55ffff, 0xffaa00, 0xaa00ff];

        // 🎯 ನಿಮ್ಮ ಅನುಕೂಲಕ್ಕಾಗಿ ಚಿತ್ರಗಳ ಲಿಂಕ್ (ಇಲ್ಲಿ ನಿಮಗೆ ಬೇಕಾದ ಫೋಟೋ ಲಿಂಕ್ ಬದಲಾಯಿಸಿಕೊಳ್ಳಬಹುದು)
        const imagesList = [
            "https://raw.githubusercontent.com/chandugokarna-bit/gpt-teachers-resources/main/images/kuvempu.jpeg", // ಕುವೆಂಪು (ಉದಾಹರಣೆ ಲಿಂಕ್)
            "https://raw.githubusercontent.com/chandugokarna-bit/gpt-teachers-resources/main/images/bendre.jpeg", 
            "https://raw.githubusercontent.com/chandugokarna-bit/gpt-teachers-resources/main/images/karanth.jpeg", 
            "https://raw.githubusercontent.com/chandugokarna-bit/gpt-teachers-resources/main/images/masti.jpeg", 
            "https://raw.githubusercontent.com/chandugokarna-bit/gpt-teachers-resources/main/images/gokak.jpeg", 
            "https://raw.githubusercontent.com/chandugokarna-bit/gpt-teachers-resources/main/images/anandmurthy.jpeg", 
            "https://raw.githubusercontent.com/chandugokarna-bit/gpt-teachers-resources/main/images/karnad.jpeg", 
            "https://raw.githubusercontent.com/chandugokarna-bit/gpt-teachers-resources/main/images/kambar.jpeg"
        ];

        // 🎯 ಕನ್ನಡದ ೮ ಜ್ಞಾನಪೀಠ ಪುರಸ್ಕೃತರ ಭವ್ಯ ಇತಿಹಾಸ ಮತ್ತು ವಿವರಣೆ
        const historyData = [
            { title: "✍️ ಕುವೆಂಪು (ಕುಪ್ಪಳಿ ವೆಂಕಟಪ್ಪ ಪುಟ್ಟಪ್ಪ)", desc: "• ಪ್ರಶಸ್ತಿ ವರ್ಷ: 1967 | ಕೃತಿ: 'ಶ್ರೀ ರಾಮಾಯಣ ದರ್ಶನಂ' <br>• ವಿಶೇಷತೆ: ಕನ್ನಡಕ್ಕೆ ಮೊದಲ ಜ್ಞಾನಪೀಠ ಪ್ರಶಸ್ತಿ ತಂದುಕೊಟ್ಟ ರಾಷ್ಟ್ರಕವಿ. ಯುಗದ ಕವಿ, ಜಗದ ಕವಿ ಎಂದು ಪ್ರಸಿದ್ಧರಾಗಿದ್ದಾರೆ." },
            { title: "✍️ ದ. ರಾ. ಬೇಂದ್ರೆ (ದತ್ತಾತ್ರೇಯ ರಾಮಚಂದ್ರ ಬೇಂದ್ರೆ)", desc: "• ಪ್ರಶಸ್ತಿ ವರ್ಷ: 1973 | ಕೃತಿ: 'ನಾಕುತಂತಿ' <br>• ವಿಶೇಷತೆ: ವರಕವಿ ಎಂದೇ ಖ್ಯಾತರಾದ ಇವರು ಕನ್ನಡದ ಶ್ರೇಷ್ಠ ಭಾವಗೀತೆಗಳ ಬ್ರಹ್ಮ. ಇವರ ಕಾವ್ಯನಾಮ 'ಅಂಬಿಕಾತನಯದತ್ತ'." },
            { title: "✍️ ಕೆ. ಶಿವರಾಮ ಕಾರಂತ (ಕೋಟ ಶಿವರಾಮ ಕಾರಂತ)", desc: "• ಪ್ರಶಸ್ತಿ ವರ್ಷ: 1977 | ಕೃತಿ: 'ಮೂಕಜ್ಜಿಯ ಕನಸುಗಳು' <br>• ವಿಶೇಷತೆ: 'ನಡೆದಾಡುವ ವಿಶ್ವಕೋಶ' ಎಂದೇ ಕರೆಯಲ್ಪಡುವ ಕಾರಂತರು ಕನ್ನಡ ಸಾಹಿತ್ಯ ಲೋಕದ ಮಹಾನ್ ಕಾದಂಬರಿಕಾರರು ಮತ್ತು ಪರಿಸರ ಪ್ರೇಮಿ." },
            { title: "✍️ ಮಾಸ್ತಿ ವೆಂಕಟೇಶ ಅಯ್ಯಂಗಾರ್", desc: "• ಪ್ರಶಸ್ತಿ ವರ್ಷ: 1983 | ಕೃತಿ: 'ಚಿಕವೀರ ರಾಜೇಂದ್ರ' <br>• ವಿಶೇಷತೆ: 'ಕನ್ನಡದ ಆಸ್ತಿ' ಎಂದು ಕರೆಯಲ್ಪಡುವ ಮಾಸ್ತಿಯವರು ಸಣ್ಣ ಕಥೆಗಳ ಜನಕ ಎಂದೇ ಪ್ರಸಿದ್ಧರಾಗಿದ್ದಾರೆ." },
            { title: "✍️ ವಿ. ಕೃ. ಗೋಕಾಕ್ (ವಿನಾಯಕ ಕೃಷ್ಣ ಗೋಕಾಕ್)", desc: "• ಪ್ರಶಸ್ತಿ ವರ್ಷ: 1990 | ಕೃತಿ: 'ಭಾರತ ಸಿಂಧು ರಶ್ಮಿ' <br>• ವಿಶೇಷತೆ: ಪ್ರಸಿದ್ಧ ನವ್ಯ ಕವಿ ಹಾಗೂ ಹೆಸರಾಂತ ಇಂಗ್ಲಿಷ್ ಪ್ರಾಧ್ಯಾಪಕರು. ಗೋಕಾಕ್ ಚಳುವಳಿಯ ಮೂಲಕ ಕನ್ನಡ ಭಾಷಾ ರಕ್ಷಣೆಗೆ ಶ್ರಮಿಸಿದವರು." },
            { title: "✍️ ಯು. ಆರ್. ಅನಂತಮೂರ್ತಿ (ಉಡುಪಿ ರಾಜಗೋಪಾಲಾಚಾರ್ಯ ಅನಂತಮೂರ್ತಿ)", desc: "• ಪ್ರಶಸ್ತಿ ವರ್ಷ: 1994 | ಸಮಗ್ರ ಸಾಹಿತ್ಯದ ಕೊಡುಗೆ <br>• ವಿಶೇಷತೆ: ಇವರ 'ಸಂಸ್ಕಾರ' ಕಾದಂಬರಿ ಕನ್ನಡ ನವ್ಯ ಸಾಹಿತ್ಯ ಚಳವಳಿಯಲ್ಲಿ ಹೊಸ ದಿಕ್ಸೂಚಿ ಮೂಡಿಸಿತು. ಪ್ರಸಿದ್ಧ ಚಿಂತಕರು." },
            { title: "✍️ ಗಿರೀಶ್ ಕಾರ್ನಾಡ್", desc: "• ಪ್ರಶಸ್ತಿ ವರ್ಷ: 1998 | ಸಮಗ್ರ ಸಾಹಿತ್ಯದ ಕೊಡುಗೆ (ನಾಟಕ ರಂಗ) <br>• ವಿಶೇಷತೆ: ಅಂತರರಾಷ್ಟ್ರೀಯ ಮಟ್ಟದಲ್ಲಿ ಖ್ಯಾತಿ ಪಡೆದ ನಾಟಕಕಾರರು, ನಟರು ಮತ್ತು ನಿರ್ದೇಶಕರು. ಇವರ 'ಯಯಾತಿ', 'ತುಘಲಕ್' ನಾಟಕಗಳು ಜಗತ್ಪ್ರಸಿದ್ಧ." },
            { title: "✍️ ಚಂದ್ರಶೇಖರ ಕಂಬಾರ", desc: "• ಪ್ರಸಿದ್ಧಿ ವರ್ಷ: 2010 | ಸಮಗ್ರ ಸಾಹಿತ್ಯದ ಕೊಡುಗೆ <br>• ವಿಶೇಷತೆ: ಉತ್ತರ ಕರ್ನಾಟಕದ ಜಾನಪದ ಸೊಗಡನ್ನು ಸಾಹಿತ್ಯ ಲೋಕಕ್ಕೆ ಪರಿಚಯಿಸಿದ ಮಹಾಕವಿ, ನಾಟಕಕಾರ ಮತ್ತು ಹಂಪಿ ಕನ್ನಡ ವಿಶ್ವವಿದ್ಯಾಲಯದ ಮೊದಲ ಕುಲಪತಿಗಳು." }
        ];

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x020204);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.copy(targetCameraPos); 

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.07;
            controls.maxDistance = 18;
            controls.minDistance = 0.5;

            scene.add(new THREE.AmbientLight(0xffffff, 0.95));
            
            // ಬೃಹತ್ ಹಾಲ್ ಸೆಟಪ್
            const roomGeo = new THREE.BoxGeometry(32, 12, 32);
            const wallMat = new THREE.MeshStandardMaterial({ color: 0x050508, side: THREE.BackSide });
            const room = new THREE.Mesh(roomGeo, wallMat);
            scene.add(room);

            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            const wallX = 16 - 0.05; 
            const wallZ = 16 - 0.05; 

            // ೮ ಕವಿಗಳಿಗಾಗಿ ಅಚ್ಚುಕಟ್ಟಾದ 3D ಗೋಡೆ ಜೋಡಣೆ ಲೇಔಟ್
            const galleryLayout = [
                { id: 0, url: imagesList[0], w: 7.5, h: 5.5, pos: [-4, 0.5, -wallZ], rot: [0, 0, 0], normal: [0, 0, 1] },
                { id: 1, url: imagesList[1], w: 7.5, h: 5.5, pos: [4, 0.5, -wallZ], rot: [0, 0, 0], normal: [0, 0, 1] },
                
                { id: 2, url: imagesList[2], w: 7.5, h: 5.5, pos: [-wallX, 0.5, -5], rot: [0, Math.PI/2, 0], normal: [1, 0, 0] },
                { id: 3, url: imagesList[3], w: 7.5, h: 5.5, pos: [-wallX, 0.5, 5], rot: [0, Math.PI/2, 0], normal: [1, 0, 0] },
                
                { id: 4, url: imagesList[4], w: 7.5, h: 5.5, pos: [-4, 0.5, wallZ], rot: [0, Math.PI, 0], normal: [0, 0, -1] },
                { id: 5, url: imagesList[5], w: 7.5, h: 5.5, pos: [4, 0.5, wallZ], rot: [0, Math.PI, 0], normal: [0, 0, -1] },
                
                { id: 6, url: imagesList[6], w: 7.5, h: 5.5, pos: [wallX, 0.5, 5], rot: [0, -Math.PI/2, 0], normal: [-1, 0, 0] },
                { id: 7, url: imagesList[7], w: 7.5, h: 5.5, pos: [wallX, 0.5, -5], rot: [0, -Math.PI/2, 0], normal: [-1, 0, 0] }
            ];

            const textureLoader = new THREE.TextureLoader();

            galleryLayout.forEach((art, index) => {
                textureLoader.load(art.url, 
                    function(texture) {
                        createArtwork(art.id, texture, null, art.w, art.h, new THREE.Vector3(...art.pos), new THREE.Vector3(...art.rot), new THREE.Vector3(...art.normal));
                    },
                    undefined,
                    function(err) {
                        // ಒಂದು ವೇಳೆ ಸರ್ವರ್ ನೆಟ್ ನಿಧಾನವಿದ್ದರೆ ಬ್ಯಾಕಪ್ ಕಲರ್ ಬೋರ್ಡ್ ಮೂಡುತ್ತದೆ
                        createArtwork(art.id, null, colors[index], art.w, art.h, new THREE.Vector3(...art.pos), new THREE.Vector3(...art.rot), new THREE.Vector3(...art.normal));
                    }
                );
            });

            setTimeout(() => { document.getElementById('loader').style.display = 'none'; }, 1500);

            let startX, startY;
            renderer.domElement.addEventListener('pointerdown', (e) => { startX = e.clientX; startY = e.clientY; });
            renderer.domElement.addEventListener('pointerup', (e) => {
                if (Math.abs(e.clientX - startX) < 5 && Math.abs(e.clientY - startY) < 5) {
                    checkIntersection(e);
                }
            });

            window.addEventListener('resize', onWindowResize, false);
        }

        function createArtwork(id, texture, fallbackColor, width, height, position, rotation, normal) {
            const group = new THREE.Group();
            const artGeo = new THREE.PlaneGeometry(width, height);
            
            let artMat = texture 
                ? new THREE.MeshStandardMaterial({ map: texture, roughness: 0.15, side: THREE.DoubleSide })
                : new THREE.MeshStandardMaterial({ color: fallbackColor, roughness: 0.4, side: THREE.DoubleSide });
            
            const artMesh = new THREE.Mesh(artGeo, artMat);
            
            // 🎯 ಮ್ಯಾಜಿಕ್ ಲೆಕ್ಕಾಚಾರ: ಫೋಟೋ ಕರಾರುವಕ್ಕಾಗಿ ಸ್ಕ್ರೀನ್ ತುಂಬಾ ವಿಸ್ತರಿಸಲು ಗಣಿತದ ಲೆಕ್ಕಾಚಾರ
            const vFOV = (camera.fov * Math.PI) / 180;
            let distance = (height / 2) / Math.tan(vFOV / 2);
            
            const aspect = window.innerWidth / window.innerHeight;
            const distanceForWidth = (width / 2) / Math.tan((camera.fov * aspect * Math.PI) / 360);
            
            distance = Math.max(distance, distanceForWidth) * 0.96; 

            const camPos = position.clone().add(normal.clone().multiplyScalar(distance));

            artMesh.userData = { dynastyId: id, position: position.clone(), cameraPos: camPos };
            clickableObjects.push(artMesh); 
            group.add(artMesh);

            // ಆಕರ್ಷಕ ನಿಯಾನ್ ಬಾರ್ಡರ್ ವೈರ್‌ಫ್ರೇಮ್
            const frameGeo = new THREE.PlaneGeometry(width + 0.08, height + 0.08);
            const frameMat = new THREE.MeshBasicMaterial({ color: 0x00ffcc, wireframe: true, side: THREE.DoubleSide });
            const frameMesh = new THREE.Mesh(frameGeo, frameMat);
            frameMesh.position.z = -0.003;
            group.add(frameMesh);

            group.position.copy(position);
            group.rotation.set(rotation.x, rotation.y, rotation.z);
            scene.add(group);
        }

        function checkIntersection(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(clickableObjects, true);

            if (intersects.length > 0) {
                const clickedMesh = intersects[0].object;
                if(clickedMesh.userData && clickedMesh.userData.dynastyId !== undefined) {
                    const id = clickedMesh.userData.dynastyId;
                    
                    targetLookAt.copy(clickedMesh.userData.position);
                    targetCameraPos.copy(clickedMesh.userData.cameraPos);
                    isFocused = true;

                    // ಸಿನಿಮಾಟಿಕ್ ಬಾರ್ ಮಾಹಿತಿ ಪ್ರದರ್ಶನ
                    document.getElementById('poet-name').innerHTML = historyData[id].title;
                    document.getElementById('popup-desc').innerHTML = historyData[id].desc;
                    document.getElementById('cinema-info-bar').classList.add('active');
                }
            }
        }

        function resetView() {
            targetLookAt.set(0, 0, 0); 
            targetCameraPos.set(0, 0, 1.5);
            isFocused = false;
            document.getElementById('cinema-info-bar').classList.remove('active');
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.target.lerp(targetLookAt, 0.08);
            if (isFocused) {
                camera.position.lerp(targetCameraPos, 0.08);
            }
            controls.update();
            renderer.render(scene, camera);
        }

        init();
        animate();
    </script>
</body>
</html>
