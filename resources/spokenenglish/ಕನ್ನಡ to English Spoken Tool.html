<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spoken English Interactive Tool</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 600px;
        }
        h2 {
            color: #1e293b;
            text-align: center;
            margin-top: 0;
            margin-bottom: 24px;
        }
        .box-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #475569;
        }
        textarea {
            width: 100%;
            height: 100px;
            padding: 12px;
            border: 2px solid #cbd5e1;
            border-radius: 10px;
            font-size: 16px;
            resize: none;
            outline: none;
            transition: border-color 0.2s;
        }
        textarea:focus {
            border-color: #2563eb;
        }
        .output-container {
            position: relative;
        }
        .output-box {
            background-color: #f8fafc;
            border-color: #e2e8f0;
            color: #0f172a;
            font-weight: 500;
        }
        .audio-btn {
            position: absolute;
            bottom: 12px;
            right: 12px;
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            transition: background 0.2s;
        }
        .audio-btn:hover {
            background-color: #1d4ed8;
        }
        .status {
            font-size: 13px;
            color: #64748b;
            margin-top: 4px;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>🗣️ ಕನ್ನಡ to English Spoken Tool</h2>

    <!-- Box 1: Kannada Input -->
    <div class="box-group">
        <label for="kannadaText">ಕನ್ನಡ ವಾಕ್ಯ ಬರೆಯಿರಿ:</label>
        <textarea id="kannadaText" placeholder="ಇಲ್ಲಿ ಕನ್ನಡದಲ್ಲಿ ಟೈಪ್ ಮಾಡಿ... (ಉದಾ: ನೀವು ಹೇಗಿದ್ದೀರಾ?)"></textarea>
    </div>

    <!-- Box 2: English Output with Audio -->
    <div class="box-group output-container">
        <label for="englishText">English Translation:</label>
        <textarea id="englishText" class="output-box" readonly placeholder="English translation will appear here..."></textarea>
        <button class="audio-btn" onclick="playAudio()">🔊 ಕೇಳಿ (Listen)</button>
        <div id="status" class="status"></div>
    </div>
</div>

<script>
    let timer;
    const kannadaInput = document.getElementById('kannadaText');
    const englishOutput = document.getElementById('englishText');
    const statusDiv = document.getElementById('status');

    // ಟೈಪ್ ಮಾಡುವುದು ಮುಗಿದ 600ms ನಂತರ ಟ್ರಾನ್ಸ್‌ಲೇಟ್ ಆಗುತ್ತದೆ
    kannadaInput.addEventListener('input', () => {
        clearTimeout(timer);
        const text = kannadaInput.value.trim();
        
        if (!text) {
            englishOutput.value = '';
            statusDiv.innerText = '';
            return;
        }

        statusDiv.innerText = 'ಅನುವಾದಿಸಲಾಗುತ್ತಿದೆ...';

        timer = setTimeout(() => {
            translateKannadaToEnglish(text);
        }, 600);
    });

    // Translation Function (MyMemory API)
    async function translateKannadaToEnglish(text) {
        try {
            const response = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=kn|en`);
            const data = await response.json();
            
            if (data.responseData) {
                englishOutput.value = data.responseData.translatedText;
                statusDiv.innerText = '';
            } else {
                statusDiv.innerText = 'ಅನುವಾದಿಸಲು ಸಾಧ್ಯವಾಗಲಿಲ್ಲ.';
            }
        } catch (error) {
            statusDiv.innerText = 'ನೆಟ್‌ವರ್ಕ್ ಸಮಸ್ಯೆ ಇದೆ.';
        }
    }

    // Text-to-Speech Function (English Audio)
    function playAudio() {
        const text = englishOutput.value;
        if (!text) return;

        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel(); // ಹಳೆಯ ಧ್ವನಿ ನಿಲ್ಲಿಸಲು
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US'; // ಸ್ಪಷ್ಟ ಇಂಗ್ಲಿಷ್ ಉಚ್ಚಾರಣೆ
            utterance.rate = 0.9; // ವಿದ್ಯಾರ್ಥಿಗಳಿಗೆ ಅರ್ಥವಾಗಲು ಸ್ವಲ್ಪ ನಿಧಾನವಾಗಿ ಓದುತ್ತದೆ
            window.speechSynthesis.speak(utterance);
        } else {
            alert('ನಿಮ್ಮ ಬ್ರೌಸರ್‌ನಲ್ಲಿ ಆಡಿಯೋ ಬೆಂಬಲವಿಲ್ಲ.');
        }
    }
</script>

</body>
</html>
