<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ಯಾಣ ಕಪ್ಪು ಶಿಲಾ ಗುಹೆಗಳು - 360° ಆಡಿಯೋ ಪ್ರವಾಸ</title>
    <!-- Pannellum 360 ಲೈಬ್ರರಿ -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.7/build/pannellum.css"/>
    <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.7/build/pannellum.js"></script>
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; }
        #panorama { width: 100vw; height: 100vh; }
        
        /* ಶೀರ್ಷಿಕೆ ಫಲಕ */
        #title-panel {
            position: absolute; top: 20px; left: 20px; color: white;
            background: rgba(15, 23, 42, 0.85); padding: 15px; border-radius: 10px;
            border-left: 5px solid #a855f7; z-index: 999; pointer-events: none;
        }
        #title-panel h1 { margin: 0; font-size: 20px; color: #a855f7; }
        #title-panel p { margin: 5px 0 0 0; font-size: 14px; color: #e2e8f0; }

        /* ಕೆಳಗಿನ ಸುಂದರ ಮಾಹಿತಿ ಫಲಕ (ಆಡಿಯೋ ಮತ್ತು ಪಠ್ಯಕ್ಕಾಗಿ) */
        #info-panel {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            width: 85%; max-width: 650px; background: rgba(15, 23, 42, 0.95); color: #f8fafc;
            padding: 20px; border-radius: 15px; text-align: center;
            font-size: 17px; line-height: 1.6; border: 2px solid #a855f7; /* ಯಾಣದ ರಹಸ್ಯಕ್ಕೆ ನೇರಳೆ ಬಣ್ಣ */
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            z-index: 999; pointer-events: none;
        }
    </style>
</head>
<body>

<div id="title-panel">
    <h1>ಯಾಣ: ಪ್ರಕೃತಿಯ ವಿಸ್ಮಯ ಕಪ್ಪು ಶಿಲಾ ಗುಹೆಗಳು</h1>
    <p>ಚಿತ್ರದಲ್ಲಿರುವ ಮಾಹಿತಿ ಐಕಾನ್ ಮೇಲೆ ಕ್ಲಿಕ್ ಮಾಡಿ ಆಡಿಯೋ ವಿವರ ಪಡೆಯಿರಿ</p>
</div>

<div id="panorama"></div>

<div id="info-panel">
    ಸ್ವಾಗತ! ಪಶ್ಚಿಮ ಘಟ್ಟಗಳ ದಟ್ಟ ಅರಣ್ಯದಲ್ಲಿರುವ ಯಾಣದ ಭವ್ಯ ಸುಣ್ಣದ ಕಲ್ಲಿನ ಶಿಖರಗಳನ್ನು ತಿಳಿಯಲು ಆವರಣದಲ್ಲಿರುವ ಮಾಹಿತಿ ಐಕಾನ್‌ಗಳ ಮೇಲೆ ಕ್ಲಿಕ್ ಮಾಡಿ...
</div>

<script>
// ಕನ್ನಡ ಧ್ವನಿ ಕಾರ್ಯವಿಧಾನ
function speakKannada(title, infoText) {
    // ಮಾಹಿತಿ ಫಲಕದಲ್ಲಿ ಪಠ್ಯವನ್ನು ನವೀಕರಿಸಲು
    document.getElementById('info-panel').innerHTML = `<strong>${title}</strong><br>${infoText}`;
    
    if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel(); // ಹಳೆಯ ಧ್ವನಿ ನಿಲ್ಲಿಸಲು
        
        const speech = new SpeechSynthesisUtterance();
        speech.text = title + ". " + infoText;
        speech.lang = 'kn-IN'; // ಕನ್ನಡ ಭಾಷೆ
        speech.rate = 0.85; // ಸ್ಪಷ್ಟ ಧ್ವನಿ ವೇಗ
        
        window.speechSynthesis.speak(speech);
    }
}

// Pannellum ವೀಕ್ಷಕ ಸೆಟ್ಟಿಂಗ್ಸ್
pannellum.viewer('panorama', {
    "type": "equirectangular",
    "panorama": "https://raw.githubusercontent.com/chandugokarna-bit/gpt-teachers-resources/main/resources/virtual/yana%20caves360.jpg",
    "autoLoad": true,
    "title": "ಯಾಣ ಕಲ್ಲಿನ ಗುಹೆಗಳು, ಉತ್ತರ ಕನ್ನಡ",
    "author": "ನೈಸರ್ಗಿಕ ವಿಸ್ಮಯ ತಾಣ",
    "hotSpots": [
        {
            "pitch": 5,
            "yaw": -30,
            "type": "info",
            "text": "ಭವ್ಯ ಭೈರವೇಶ್ವರ ಶಿಖರ",
            "clickHandlerFunc": function() {
                speakKannada(
                    "ಭವ್ಯ ಭೈರವೇಶ್ವರ ಶಿಖರ", 
                    "ಯಾಣದ ಎರಡು ಬೃಹತ್ ಕಲ್ಲಿನ ಬೆಟ್ಟಗಳಲ್ಲಿ ಭೈರವೇಶ್ವರ ಶಿಖರವು ಅತ್ಯಂತ ದೊಡ್ಡದಾಗಿದೆ. ಇದು ಸುಮಾರು 120 ಮೀಟರ್ ಎತ್ತರವಿದ್ದು, ಕಪ್ಪು ಬಣ್ಣದ ಸುಣ್ಣದ ಕಲ್ಲಿನಿಂದ ನೈಸರ್ಗಿಕವಾಗಿ ನಿರ್ಮಾಣಗೊಂಡಿದೆ. ಇದರ ಕೆಳಭಾಗದಲ್ಲಿ ಪವಿತ್ರ ಸ್ವಯಂಭೂ ಶಿವಲಿಂಗವಿದೆ."
                );
            }
        },
        {
            "pitch": 0,
            "yaw": 10,
            "type": "info",
            "text": "ಭೈರವೇಶ್ವರ गुಹೆಯ ಪ್ರವೇಶ ಮತ್ತು ಭಸ್ಮಾಸುರನ ಕಥೆ",
            "clickHandlerFunc": function() {
                speakKannada(
                    "ಭೈರವೇಶ್ವರ ಗುಹೆಯ ಪ್ರವೇಶ", 
                    "ಈ ಬೃಹತ್ ಶಿಖರದ ಒಳಗಡೆ ನೈಸರ್ಗಿಕವಾಗಿ ಸೃಷ್ಟಿಯಾದ ವಿಸ್ಮಯಕಾರಿ ಗುಹೆಯಿದೆ. ಪುರಾಣಗಳ ಪ್ರಕಾರ, ಮೋಹಿನಿಯ ನೃತ್ಯಕ್ಕೆ ಮರುಳಾದ ಭಸ್ಮಾಸುರನು ತನ್ನದೇ ತಲೆಯ ಮೇಲೆ ಕೈ ಇಟ್ಟುಕೊಂಡು ಭಸ್ಮವಾದ ಜಾಗ ಇದಾಗಿದೆ. ಇಲ್ಲಿನ ಕಪ್ಪು ಮಣ್ಣು ಭಸ್ಮಾಸುರನ ಭಸ್ಮದಿಂದಲೇ ಉಂಟಾಗಿದೆ ಎಂಬ ನಂಬಿಕೆಯಿದೆ."
                );
            }
        },
        {
            "pitch": 5,
            "yaw": 50,
            "type": "info",
            "text": "ಸುಂದರ ಮೋಹಿನಿ ಶಿಖರ",
            "clickHandlerFunc": function() {
                speakKannada(
                    "ಸುಂದರ ಮೋಹಿನಿ ಶಿಖರ", 
                    "ಭೈರವೇಶ್ವರ ಶಿಖರದ ಸ್ವಲ್ಪ ದೂರದಲ್ಲೇ ಇರುವ ಮತ್ತೊಂದು ಸಾಪೇಕ್ಷ ಸಣ್ಣ ಶಿಖರವೇ ಮೋಹಿನಿ ಶಿಖರ. ಇದು ಸುಮಾರು 90 ಮೀಟರ್ ಎತ್ತರವಿದ್ದು, ಅತ್ಯಂತ ಆಕರ್ಷಕವಾದ ಆಕಾರವನ್ನು ಹೊಂದಿದೆ. ವಿಷ್ಣುವು ಭಸ್ಮಾಸುರನನ್ನು ಸಂಹರಿಸಲು ಮೋಹಿನಿಯ ಅವತಾರ ತಾಳಿದ್ದರ ಸಂಕೇತವಾಗಿ ಇದಕ್ಕೆ ಈ ಹೆಸರು ಬಂದಿದೆ."
                );
            }
        }
    ]
});
</script>

</body>
</html>
