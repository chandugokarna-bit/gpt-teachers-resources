<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ಯಾಣ ಕಲ್ಲಿನ ಗುಹೆಗಳು 360° ಆಡಿಯೋ ಪ್ರವಾಸ</title>
    <!-- A-Frame VR ಲೈಬ್ರರಿ -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <style>
        /* ಮಾಹಿತಿ ಫಲಕ */
        #info-panel {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            width: 85%; max-width: 650px; background: rgba(15, 23, 42, 0.95); color: #f8fafc;
            padding: 20px; border-radius: 15px; font-family: sans-serif; text-align: center;
            font-size: 18px; line-height: 1.6; border: 2px solid #a855f7; /* Purple Border for Mystical Caves */
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            z-index: 999; pointer-events: none;
        }
        /* ಶೀರ್ಷಿಕೆ ಫಲಕ */
        #title-panel {
            position: absolute; top: 20px; left: 20px; color: white;
            background: rgba(15, 23, 42, 0.85); padding: 15px; border-radius: 10px;
            border-left: 5px solid #a855f7; z-index: 999;
        }
        #title-panel h1 { margin: 0; font-size: 22px; color: #a855f7; }
    </style>
</head>
<body>

    <div id="title-panel">
        <h1>ಯಾಣ: ಪ್ರಕೃತಿಯ ವಿಸ್ಮಯ ಕಪ್ಪು ಶಿಲಾ ಗುಹೆಗಳು</h1>
        <p>ಚಿನ್ನದ ಬಣ್ಣದ ವರ್ತುಲಗಳ ಮೇಲೆ ನೇರವಾಗಿ ಕ್ಲಿಕ್ ಮಾಡಿ ಆಡಿಯೋ ಮಾಹಿತಿ ಪಡೆಯಿರಿ</p>
    </div>

    <div id="info-panel">
        ಸ್ವಾಗತ! ಪಶ್ಚಿಮ ಘಟ್ಟಗಳ ದಟ್ಟ ಅರಣ್ಯದಲ್ಲಿರುವ ಯಾಣದ ಭವ್ಯ ಸುಣ್ಣದ ಕಲ್ಲಿನ ಶಿಖರಗಳನ್ನು ತಿಳಿಯಲು ಆವರಣದಲ್ಲಿರುವ ಚಿನ್ನದ ಬಣ್ಣದ ಹಾಟ್‌ಸ್ಪಾಟ್‌ಗಳ ಮೇಲೆ ಕ್ಲಿಕ್ ಮಾಡಿ...
    </div>

    <!-- ನೇರ ಮೌಸ್ ಕ್ಲಿಕ್ ಸಿಸ್ಟಮ್ -->
    <a-scene cursor="rayOrigin: mouse">
        <a-assets>
            <img id="yana-scene" src="https://raw.githubusercontent.com/chandugokarna-bit/gpt-teachers-resources/main/resources/virtual/yana%20caves360.jpg" crossorigin="anonymous">
        </a-assets>

        <!-- ಹಿನ್ನೆಲೆ 360 ಚಿತ್ರ -->
        <a-sky src="#yana-scene"></a-sky>

        <a-entity camera look-controls position="0 1.6 0"></a-entity>

        <!-- ================= ಇಂಟರಾಕ್ಟಿವ್ ಹಾಟ್‌ಸ್ಪಾಟ್‌ಗಳು (ಆರಂಭಿಕ ಸುರಕ್ಷಿತ ಸ್ಥಾನ) ================= -->

        <!-- 1. ಭೈರವೇಶ್ವರ ಶಿಖರ (ಎಡಭಾಗ) -->
        <a-sphere id="hotspot-yana-bhairava" position="-2 1.5 -4" radius="0.35" color="#eab308" class="hotspot"
                  data-title="ಭವ್ಯ ಭೈರವೇಶ್ವರ ಶಿಖರ"
                  data-info="ಯಾಣದ ಎರಡು ಬೃಹತ್ ಕಲ್ಲಿನ ಬೆಟ್ಟಗಳಲ್ಲಿ ಭೈರವೇಶ್ವರ ಶಿಖರವು ಅತ್ಯಂತ ದೊಡ್ಡದಾಗಿದೆ. ಇದು ಸುಮಾರು 120 ಮೀಟರ್ (390 ಅಡಿ) ಎತ್ತರವಿದ್ದು, ಕಪ್ಪು ಬಣ್ಣದ ಸ್ಫಟಿಕದಂತಹ ಸುಣ್ಣದ ಕಲ್ಲಿನಿಂದ (Crystalline Limestone) ನೈಸರ್ಗಿಕವಾಗಿ ನಿರ್ಮಾಣಗೊಂಡಿದೆ. ಇದರ ಕೆಳಭಾಗದಲ್ಲಿ ಪವಿತ್ರ ಸ್ವಯಂಭೂ ಶಿವಲಿಂಗವಿದೆ.">
        </a-sphere>

        <!-- 2. ನೈಸರ್ಗಿಕ ಗುಹೆ ಮತ್ತು ಭಸ್ಮಾಸುರನ ಕಥೆ (ಮಧ್ಯದಲ್ಲಿದೆ) -->
        <a-sphere id="hotspot-yana-cave" position="0 1.5 -4" radius="0.35" color="#eab308" class="hotspot"
                  data-title="ಭೈರವೇಶ್ವರ ಗುಹೆಯ ಪ್ರವೇಶ"
                  data-info="ಈ ಬೃಹತ್ ಶಿಖರದ ಒಳಗಡೆ ನೈಸರ್ಗಿಕವಾಗಿ ಸೃಷ್ಟಿಯಾದ ವಿಸ್ಮಯಕಾರಿ ಗುಹೆಯಿದೆ. ಪುರಾಣಗಳ ಪ್ರಕಾರ, ಮೋಹಿನಿಯ ನೃತ್ಯಕ್ಕೆ ಮರುಳಾದ ಭಸ್ಮಾಸುರನು ತನ್ನದೇ ತಲೆಯ ಮೇಲೆ ಕೈ ಇಟ್ಟುಕೊಂಡು ಭಸ್ಮವಾದ ಜಾಗ ಇದಾಗಿದೆ. ಇಲ್ಲಿನ ಕಪ್ಪು ಮಣ್ಣು ಭಸ್ಮಾಸುರನ ಭಸ್ಮದಿಂದಲೇ ಉಂಟಾಗಿದೆ ಎಂಬ ನಂಬಿಕೆಯಿದೆ.">
        </a-sphere>

        <!-- 3. ಮೋಹಿನಿ ಶಿಖರ (ಬಲಭಾಗದಲ್ಲಿದೆ) -->
        <a-sphere id="hotspot-yana-mohini" position="2 1.5 -4" radius="0.35" color="#eab308" class="hotspot"
                  data-title="ಸುಂದರ ಮೋಹಿನಿ ಶಿಖರ"
                  data-info="ಭೈರವೇಶ್ವರ ಶಿಖರದ ಸ್ವಲ್ಪ ದೂರದಲ್ಲೇ ಇರುವ ಮತ್ತೊಂದು ಸಣ್ಣ ಶಿಖರವೇ ಮೋಹಿನಿ ಶಿಖರ. ಇದು ಸುಮಾರು 90 ಮೀಟರ್ ಎತ್ತರವಿದ್ದು, ಅತ್ಯಂತ ಆಕರ್ಷಕವಾದ ಆಕಾರವನ್ನು ಹೊಂದಿದೆ. ವಿಷ್ಣುವು ಭಸ್ಮಾಸುರನನ್ನು ಸಂಹರಿಸಲು ಮೋಹಿನಿಯ ಅವತಾರ ತಾಳಿದ್ದರ ಸಂಕೇತವಾಗಿ ಇದಕ್ಕೆ ಈ ಹೆಸರು ಬಂದಿದೆ.">
        </a-sphere>

    </a-scene>

    <script>
        const hotspots = document.querySelectorAll('.hotspot');
        const infoPanel = document.getElementById('info-panel');

        hotspots.forEach(hotspot => {
            // ಮೌಸ್ Hover ಇಫೆಕ್ಟ್
            hotspot.addEventListener('mouseenter', function () {
                this.setAttribute('color', '#ef4444'); // ಕೆಂಪು ಬಣ್ಣ
            });

            hotspot.addEventListener('mouseleave', function () {
                this.setAttribute('color', '#eab308'); // ಮರಳಿ ಚಿನ್ನದ ಬಣ್ಣ
            });

            // ಕ್ಲಿಕ್ ಇವೆಂಟ್ ಮತ್ತು ಆಡಿಯೋ ಪ್ಲೇಬ್ಯಾಕ್
            hotspot.addEventListener('click', function () {
                const title = this.getAttribute('data-title');
                const info = this.getAttribute('data-info');
                
                infoPanel.innerHTML = `<strong>${title}</strong><br>${info}`;

                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel(); // ಹಳೆಯ ಧ್ವನಿ ನಿಲ್ಲಿಸಲು
                    
                    const speech = new SpeechSynthesisUtterance();
                    speech.text = title + ". " + info;
                    speech.lang = 'kn-IN'; // ಕನ್ನಡ ಭಾಷೆ
                    speech.rate = 0.85; // ಸ್ಪಷ್ಟ ಧ್ವನಿ ವೇಗ
                    
                    window.speechSynthesis.speak(speech);
                }
            });
        });
    </script>
</body>
</html>
