<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ಹೊನ್ನಾವರ ಹಿನ್ನೀರು - 360° ಆಡಿಯೋ ಪ್ರವಾಸ</title>
    <!-- Pannellum 360 ಲೈಬ್ರರಿ -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.7/build/pannellum.css"/>
    <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.7/build/pannellum.js"></script>
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; }
        #panorama { width: 100vw; height: 100vh; }
        
        /* ಶೀರ್ಷಿಕೆ ಫಲಕ */
        #title-panel {
            position: absolute; top: 20px; left: 20px; color: white;
            background: rgba(15, 23, 42, 0.85); padding: 15px; border-radius: 10px;
            border-left: 5px solid #06b6d4; z-index: 999; pointer-events: none;
        }
        #title-panel h1 { margin: 0; font-size: 20px; color: #06b6d4; }
        #title-panel p { margin: 5px 0 0 0; font-size: 14px; color: #e2e8f0; }

        /* ಕೆಳಗಿನ ಸುಂದರ ಮಾಹಿತಿ ಫಲಕ (ಆಡಿಯೋ ಮತ್ತು ಪಠ್ಯಕ್ಕಾಗಿ) */
        #info-panel {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            width: 85%; max-width: 650px; background: rgba(15, 23, 42, 0.95); color: #f8fafc;
            padding: 20px; border-radius: 15px; text-align: center;
            font-size: 17px; line-height: 1.6; border: 2px solid #06b6d4; /* ಹಿನ್ನೀರಿನ ಥೀಮ್‌ಗೆ ಸಯಾನ್/ನೀಲಿ ಬಣ್ಣ */
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            z-index: 999; pointer-events: none;
        }

        /* 🎯 ದೊಡ್ಡದಾಗಿರುವ ಕಸ್ಟಮ್ ಹಾಟ್‌ಸ್ಪಾಟ್‌ ಬಬಲ್ಸ್ */
        .custom-hotspot {
            height: 32px;
            width: 32px;
            background: #eab308; /* ಹೊಳೆಯುವ ಚಿನ್ನದ ಬಣ್ಣ */
            border: 3px solid #ffffff;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 12px rgba(234, 179, 8, 0.8);
            transition: all 0.3s ease;
        }
        /* ಅದರ ಮೇಲೆ ಬೆರಳು ಇಟ್ಟಾಗ ಕೆಂಪು ಬಣ್ಣಕ್ಕೆ ತಿರುಗಲು */
        .custom-hotspot:hover {
            background: #ef4444; 
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.9);
            transform: scale(1.2);
        }
    </style>
</head>
<body>

<div id="title-panel">
    <h1>ಹೊನ್ನಾವರ: ನೈಸರ್ಗಿಕ ಹಿನ್ನೀರು ಮತ್ತು ಶರಾವತಿ ನದಿ ತೀರ</h1>
    <p>ದೊಡ್ಡದಾಗಿರುವ ಚಿನ್ನದ ಬಣ್ಣದ ವರ್ತುಲಗಳ ಮೇಲೆ ಕ್ಲಿಕ್ ಮಾಡಿ ಆಡಿಯೋ ವಿವರ ಪಡೆಯಿರಿ</p>
</div>

<div id="panorama"></div>

<div id="info-panel">
    ಸ್ವಾಗತ! ಉತ್ತರ ಕನ್ನಡದ ಪ್ರಕೃತಿ ಸೌಂದರ್ಯ ಮತ್ತು ಹೊನ್ನಾವರದ ಶಾಂತ ಇಕೋ-ಟೂರಿಸಂ ತಿಳಿಯಲು ಆವರಣದಲ್ಲಿರುವ ದೊಡ್ಡ ಹಾಟ್‌ಸ್ಪಾಟ್‌ಗಳ ಮೇಲೆ ಕ್ಲಿಕ್ ಮಾಡಿ...
</div>

<script>
// ಕನ್ನಡ ಧ್ವನಿ ಕಾರ್ಯವಿಧಾನ
function speakKannada(title, infoText) {
    document.getElementById('info-panel').innerHTML = `<strong>${title}</strong><br>${infoText}`;
    
    if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel(); // ಹಳೆಯ ಧ್ವನಿ ನಿಲ್ಲಿಸಲು
        
        const speech = new SpeechSynthesisUtterance();
        speech.text = title + ". " + infoText;
        speech.lang = 'kn-IN'; // ಕನ್ನಡ ಭಾಷೆ
        speech.rate = 0.85; // ಸ್ಪಷ್ಟ ಧ್ವನಿ ವೇಗ
        
        window.speechSynthesis.speak(speech);
    }
}

// Pannellum ವೀಕ್ಷಕ ಸೆಟ್ಟಿಂಗ್ಸ್
pannellum.viewer('panorama', {
    "type": "equirectangular",
    "panorama": "https://raw.githubusercontent.com/chandugokarna-bit/gpt-teachers-resources/main/resources/virtual/honnavara%20backwater360.jpg",
    "autoLoad": true,
    "title": "ಹಿನ್ನೀರು, ಹೊನ್ನಾವರ",
    "author": "ನೈಸರ್ಗಿಕ ಇಕೋ-ಟೂರಿಸಂ ತಾಣ",
    "hotSpots": [
        {
            "pitch": 0,
            "yaw": -35,
            "cssClass": "custom-hotspot", // ನಮ್ಮ ಕಸ್ಟಮ್ ದೊಡ್ಡ ಹಾಟ್‌ಸ್ಪಾಟ್
            "createTooltipFunc": function(hotSpotDiv) { hotSpotDiv.setAttribute("title", "ಶರಾವತಿ ಹಿನ್ನೀರು"); },
            "clickHandlerFunc": function() {
                speakKannada(
                    "ಹೊನ್ನಾವರದ ಶಾಂತ ಹಿನ್ನೀರು", 
                    "ವಿಶ್ವಪ್ರಸಿದ್ಧ ಜೋಗ ಜಲಪಾತವನ್ನು ಸೃಷ್ಟಿಸುವ ಶರಾವತಿ ನದಿಯು ಸಮುದ್ರವನ್ನು ಸೇರುವ ಮುನ್ನ ಹೊನ್ನಾವರದಲ್ಲಿ ವಿಶಾಲವಾದ ಹಿನ್ನೀರನ್ನು ಸೃಷ್ಟಿಸುತ್ತದೆ. ಇದು ಅನೇಕ ಸಣ್ಣ ಸಣ್ಣ ಹಸಿರು ದ್ವೀಪಗಳಿಂದ ಕೂಡಿದ್ದು, ವಿಶಿಷ್ಟ ಜೀವವೈವಿಧ್ಯತೆಗೆ ಆಶ್ರಯ ನೀಡಿದೆ."
                );
            }
        },
        {
            "pitch": 5,
            "yaw": 15,
            "cssClass": "custom-hotspot",
            "createTooltipFunc": function(hotSpotDiv) { hotSpotDiv.setAttribute("title", "ಕಾಂಡ್ಲಾ ವನ"); },
            "clickHandlerFunc": function() {
                speakKannada(
                    "ಕಾಂಡ್ಲಾ ವನ (Mangrove Forests)", 
                    "ಹೊನ್ನಾವರದ ಹಿನ್ನೀರಿನಲ್ಲಿ ಕರ್ನಾಟಕದ ಅತಿ ದೊಡ್ಡ ಮತ್ತು ಸುಂದರವಾದ ಕಾಂಡ್ಲಾ ವನಗಳಿವೆ. ಈ ಮ್ಯಾಂಗ್ರೋವ್ ಸಸ್ಯಗಳ ಬೇರುಗಳು ನೀರಿನಲ್ಲಿ ಮುಳುಗಿದ್ದು, ತೀರಪ್ರದೇಶವನ್ನು ಕೊಚ್ಚಿ ಹೋಗದಂತೆ ರಕ್ಷಿಸುತ್ತವೆ. ಇವು ಸಮುದ್ರದ ಜೀವಿಗಳ ಸಂತಾನೋತ್ಪತ್ತಿಗೆ ಪ್ರಮುಖ ತಾಣಗಳಾಗಿವೆ."
                );
            }
        },
        {
            "pitch": -5,
            "yaw": 45,
            "cssClass": "custom-hotspot",
            "createTooltipFunc": function(hotSpotDiv) { hotSpotDiv.setAttribute("title", "ಪರಿಸರ ಪ್ರವಾಸೋದ್ಯಮ"); },
            "clickHandlerFunc": function() {
                speakKannada(
                    "ದೋಣಿ ವಿಹಾರ ಮತ್ತು ಕರಾವಳಿ ಪ್ರವಾಸೋದ್ಯಮ", 
                    "ಇತ್ತೀಚಿನ ವರ್ಷಗಳಲ್ಲಿ ಹೊನ್ನಾವರದ ಹಿನ್ನೀರು ಪರಿಸರಸ್ನೇಹಿ ಪ್ರವಾಸೋದ್ಯಮಕ್ಕೆ ಜಗತ್ಪ್ರಸಿದ್ಧಿಯಾಗಿದೆ. ಇಲ್ಲಿನ ಶರಾವತಿ ಬೋರ್ಡ್‌ವಾಕ್ ಮತ್ತು ಸಾಂಪ್ರದಾಯಿಕ ದೋಣಿ ವಿಹಾರದ ಮೂಲಕ ಪ್ರವಾಸಿಗರು ಸೂರ್ಯಾಸ್ತ ಹಾಗೂ ಕರಾವಳಿಯ ಸುಂದರ ಸಮ್ಮಿಲನವನ್ನು ಕಣ್ಣುಂಬಿಕೊಳ್ಳಬಹುದು."
                );
            }
        }
    ]
});
</script>

</body>
</html>
