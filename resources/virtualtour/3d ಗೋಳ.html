<!DOCTYPE html>
<html lang="kn">
<head>
  <meta charset="UTF-8">
  <title>3D ಇಂಟರಾಕ್ಟಿಷ್ ಇಂಗ್ಲಿಷ್ ಶೈಕ್ಷಣಿಕ ಭೂಗೋಳ</title>
  <style>
    body {
      margin: 0;
      background: #090d16;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    #earth-canvas {
      width: 100%;
      height: 100%;
      cursor: grab;
    }
    #earth-canvas:active {
      cursor: grabbing;
    }
  </style>
  <!-- 🌐 3D ಗ್ಲೋಬ್ ವೆಬ್-ಜಿಎಲ್ ತಂತ್ರಜ್ಞಾನ -->
  <script src="https://www.webglearth.com/v2/api.js"></script>
</head>
<body>

  <div id="earth-canvas"></div>

  <script>
    function initializeEarth() {
      // 3D ಗ್ಲೋಬ್ ಸೆಟಪ್
      var earth = new WE.map('earth-canvas', {
        center: [20.0, 78.0], // ಭಾರತ ಮಧ್ಯದಲ್ಲಿ ಕಾಣಿಸಲು
        zoom: 2.5,
        minZoom: 1,
        maxZoom: 6,
        sky: true,
        atmosphere: true,
        dragging: true,
        tilting: true
      });

      // 🌍 ಇಡೀ ಜಗತ್ತಿನ ಎಲ್ಲಾ ಖಂಡಗಳ ಹೆಸರುಗಳನ್ನು ಕೇವಲ ಇಂಗ್ಲಿಷ್‌ನಲ್ಲಿ ತೋರಿಸುವ ಅಂತರರಾಷ್ಟ್ರೀಯ ಲೇಯರ್
      WE.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
        attribution: '' // ಯಾವುದೇ ಹೊರಗಿನ ಲಿಂಕ್‌ಗಳನ್ನು ಹೈಡ್ ಮಾಡಲಾಗಿದೆ
      }).addTo(earth);
    }
    
    window.onload = initializeEarth;
  </script>

</body>
</html>
