<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ಎಲ್ಲೋರಾ ಕೈಲಾಸನಾಥ ದೇವಾಲಯ 360° ಆಡಿಯೋ ಪ್ರವಾಸ</title>
    <!-- A-Frame VR ಲೈಬ್ರರಿ -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <style>
        /* ಮಾಹಿತಿ ಫಲಕ */
        #info-panel {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            width: 85%; max-width: 650px; background: rgba(24, 24, 27, 0.95); color: #f4f4f5;
            padding: 20px; border-radius: 15px; font-family: sans-serif; text-align: center;
            font-size: 18px; line-height: 1.6; border: 2px solid #eab308; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            z-index: 999; pointer-events: none;
        }
        /* ಶೀರ್ಷಿಕೆ ಫಲಕ */
        #title-panel {
            position: absolute; top: 20px; left: 20px; color: white;
            background: rgba(24, 24, 27, 0.85); padding: 15px; border-radius: 10px;
            border-left: 5px solid #eab308; z-index: 999;
        }
        #title-panel h1 { margin: 0; font-size: 22px; color: #eab308; }
    </style>
</head>
<body>

    <div id="title-panel">
        <h1>ಎಲ್ಲೋರಾ: ಜಗತ್ಪ್ರಸಿದ್ಧ ಕೈಲಾಸನಾಥ ಏಕಶಿಲಾ ದೇವಾಲಯ</h1>
        <p>ಚಿನ್ನದ ಬಣ್ಣದ ವರ್ತುಲಗಳ ಮೇಲೆ ನೇರವಾಗಿ ಕ್ಲಿಕ್ ಮಾಡಿ ಆಡಿಯೋ ಮಾಹಿತಿ ಪಡೆಯಿರಿ</p>
    </div>

    <div id="info-panel">
        ಸ್ವಾಗತ! ಯುನೆಸ್ಕೋ (UNESCO) ಜಗತ್ತಿನ ವಿಶಿಷ್ಟ ಪಾರಂಪರಿಕ ತಾಣವಾಗಿರುವ ಎಲ್ಲೋರಾದ ತಾಂತ್ರಿಕ ವಿಸ್ಮಯವನ್ನು ತಿಳಿಯಲು ಆವರಣದಲ್ಲಿರುವ ಚಿನ್ನದ ಬಣ್ಣದ ಹಾಟ್‌ಸ್ಪಾಟ್‌ಗಳ ಮೇಲೆ ಕ್ಲಿಕ್ ಮಾಡಿ...
    </div>

    <!-- ನೇರ ಮೌಸ್ ಕ್ಲಿಕ್ ಸಿಸ್ಟಮ್ -->
    <a-scene cursor="rayOrigin: mouse">
        <a-assets>
            <img id="ellora-scene" src="https://raw.githubusercontent.com/chandugokarna-bit/gpt-teachers-resources/main/resources/virtual/ellora360.jpg" crossorigin="anonymous">
        </a-assets>

        <!-- ಹಿನ್ನೆಲೆ 360 ಚಿತ್ರ -->
        <a-sky src="#ellora-scene"></a-sky>

        <a-entity camera look-controls position="0 1.6 0"></a-entity>

        <!-- ================= ಇಂಟರಾಕ್ಟಿವ್ ಹಾಟ್‌ಸ್ಪಾಟ್‌ಗಳು (ಆರಂಭಿಕ ಸುರಕ್ಷಿತ ಸ್ಥಾನ) ================= -->

        <!-- 1. ಎಲ್ಲೋರಾ ಗುಹೆಗಳು ಮತ್ತು ರಾಷ್ಟ್ರಕೂಟರ ಇತಿಹಾಸ (ಎಡಭಾಗ) -->
        <a-sphere id="hotspot-ellora-history" position="-2 1.5 -4" radius="0.35" color="#eab308" class="hotspot"
                  data-title="ರಾಷ್ಟ್ರಕೂಟರ ದಿವ್ಯ ಕಾಣಿಕೆ - ಗುಹೆ ಸಂಖ್ಯೆ 16"
                  data-info="ಎಲ್ಲೋರಾದಲ್ಲಿ ಒಟ್ಟು 34 ಪ್ರಮುಖ ಗುಹೆಗಳಿದ್ದು, ಅದರಲ್ಲಿ 16 ನೇ ಗುಹೆಯೇ ಈ ಭವ್ಯ ಕೈಲಾಸನಾಥ ದೇವಾಲಯ. ಇದನ್ನು ಕ್ರಿ.ಶ 8 ನೇ ಶತಮಾನದಲ್ಲಿ ರಾಷ್ಟ್ರಕೂಟರ ಪ್ರಸಿದ್ಧ ದೊರೆ ಒಂದನೇ ಕೃಷ್ಣನು ನಿರ್ಮಿಸಿದನು. ಇದು ಜಗತ್ತಿನಲ್ಲೇ ಅತಿ ದೊಡ್ಡದಾದ, ಮೇಲಿನಿಂದ ಕೆಳಕ್ಕೆ ಕೆತ್ತಲಾದ ಏಕಶಿಲಾ (Monolithic) ಮುಕ್ತ ಕಲ್ಲಿನ ಕಟ್ಟಡವಾಗಿದೆ.">
        </a-sphere>

        <!-- 2. ಮೇಲಿನಿಂದ ಕೆಳಕ್ಕೆ ಕೆತ್ತಿದ ಅದ್ಭುತ ತಂತ್ರಜ್ಞಾನ (ಮಧ್ಯದಲ್ಲಿದೆ) -->
        <a-sphere id="hotspot-ellora-architecture" position="0 1.5 -4" radius="0.35" color="#eab308" class="hotspot"
                  data-title="ವಿಶ್ವದ ಶ್ರೇಷ್ಠ ಶಿಲ್ಪಕಲಾ ಇಂಜಿನಿಯರಿಂಗ್"
                  data-info="ಸಾಮಾನ್ಯವಾಗಿ ದೇವಸ್ಥಾನಗಳನ್ನು ಕೆಳಗಿನಿಂದ ತಳಪಾಯ ಹಾಕಿ ಮೇಲಕ್ಕೆ ಕಟ್ಟಲಾಗುತ್ತದೆ. ಆದರೆ ಈ ಕೈಲಾಸ ದೇವಾಲಯವನ್ನು ಒಂದು ದೈತ್ಯ ಕಲ್ಲಿನ ಬೆಟ್ಟದ ಮೇಲ್ಭಾಗದಿಂದ ಆರಂಭಿಸಿ, ಕೆಳಮುಖವಾಗಿ ಬಂಡೆಯನ್ನು ಸವೆಯುತ್ತಾ ಕೆತ್ತಲಾಗಿದೆ! ಸುಮಾರು 2 ರಿಂದ 4 ಲಕ್ಷ ಟನ್ ತೂಕದ ಕಲ್ಲನ್ನು ಕೇವಲ ಉಳಿ ಮತ್ತು ಸುತ್ತಿಗೆಯಿಂದ ಹೊರತೆಗೆದು ಇಂತಹ ಭವ್ಯ ಮಹಲನ್ನು ಸೃಷ್ಟಿಸಿರುವುದು ಇಂದಿನ ಆಧುನಿಕ ಇಂಜಿನಿಯರ್‌ಗಳಿಗೂ ಒಂದು ಸವಾಲಾಗಿದೆ.">
        </a-sphere>

        <!-- 3. ಬೃಹತ್ ಆನೆಗಳ ಕೆತ್ತನೆ ಮತ್ತು ರಾವಣನ ಶಿಲ್ಪ (ಬಲಭಾಗದಲ್ಲಿದೆ) -->
        <a-sphere id="hotspot-ellora-sculpture" position="2 1.5 -4" radius="0.35" color="#eab308" class="hotspot"
                  data-title="ಕೈಲಾಸ ಪರ್ವತವನ್ನು ಎತ್ತುವ ರಾವಣನ ದೃಶ್ಯ"
                  data-info="ದೇವಾಲಯದ ತಳಭಾಗದಲ್ಲಿ ಇಡೀ ಕಟ್ಟಡವನ್ನು ಹೊತ್ತು ನಿಂತಿರುವಂತೆ ಭಾಸವಾಗುವ ಬೃಹತ್ ಕಲ್ಲಿನ ಆನೆಗಳ ಸಾಲನ್ನು ಕೆತ್ತಲಾಗಿದೆ. ಇದರೊಂದಿಗೆ, ದೇವಾಲಯದ ಕೆಳಭಾಗದಲ್ಲಿ ಲಂಕಾಧಿಪತಿ ರಾವಣನು ತನ್ನ ಇಡೀ ಶಕ್ತಿಯನ್ನು ಬಳಸಿ ಶಿವನ ಆವಾಸಸ್ಥಾನವಾದ ಕೈಲಾಸ ಪರ್ವತವನ್ನು ಬುಡದಿಂದ ಅಲುಗಾಡಿಸಲು ಪ್ರಯತ್ನಿಸುತ್ತಿರುವ ಅತ್ಯಂತ ಜೀವಂತವಾದ ಶಿಲ್ಪಕಲಾ ಚಿತ್ರಣವಿದೆ.">
        </a-sphere>

    </a-scene>

    <script>
        const hotspots = document.querySelectorAll('.hotspot');
        const infoPanel = document.getElementById('info-panel');

        hotspots.forEach(hotspot => {
            // ಮೌಸ್ Hover ಇಫೆಕ್ಟ್
            hotspot.addEventListener('mouseenter', function () {
                this.setAttribute('color', '#ef4444'); // ಕೆಂಪು ಬಣ್ಣ
            });

            hotspot.addEventListener('mouseleave', function () {
                this.setAttribute('color', '#eab308'); // ಮರಳಿ ಚಿನ್ನದ ಬಣ್ಣ
            });

            // ಕ್ಲಿಕ್ ಇವೆಂಟ್ ಮತ್ತು ಆಡಿಯೋ ಪ್ಲೇಬ್ಯಾಕ್
            hotspot.addEventListener('click', function () {
                const title = this.getAttribute('data-title');
                const info = this.getAttribute('data-info');
                
                infoPanel.innerHTML = `<strong>${title}</strong><br>${info}`;

                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel(); // ಹಳೆಯ ಧ್ವನಿ ನಿಲ್ಲಿಸಲು
                    
                    const speech = new SpeechSynthesisUtterance();
                    speech.text = title + ". " + info;
                    speech.lang = 'kn-IN'; // ಕನ್ನಡ ಭಾಷೆ
                    speech.rate = 0.85; // ಸ್ಪಷ್ಟ ಧ್ವನಿ ವೇಗ
                    
                    window.speechSynthesis.speak(speech);
                }
            });
        });
    </script>
</body>
</html>
