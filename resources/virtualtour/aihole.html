<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aihole Historical Tour</title>
    
    <link rel="stylesheet" href="https://cdn.pannellum.org/2.5/pannellum.css"/>
    <script type="text/javascript" src="https://cdn.pannellum.org/2.5/pannellum.js"></script>

    <style>
        #panorama { width: 100%; height: 600px; }
    </style>
</head>
<body>

<div id="panorama"></div>

<script>
    pannellum.viewer('panorama', {
        "type": "equirectangular",
        "panorama": "https://raw.githubusercontent.com/chandugokarna-bit/gpt-teachers-resources/main/resources/virtual/aihole360.jpg",
        "autoLoad": true,
        "hotSpotDebug": true, // KEEP THIS TRUE TO FIND COORDINATES
        "hotSpots": [
            {
                "pitch": 0, "yaw": 0, "type": "info",
                "text": "ಐಹೊಳೆ: ಚಾಲುಕ್ಯರ ಕಾಲದ ದೇವಾಲಯಗಳ ವಾಸ್ತುಶಿಲ್ಪದ ಪ್ರಯೋಗಾಲಯ."
            },
            {
                "pitch": 5, "yaw": 90, "type": "info",
                "text": "ದುರ್ಗಾ ದೇವಾಲಯ: ಇಲ್ಲಿನ ಅಪ್ಸೈಡಲ್ (ಅರ್ಧವೃತ್ತಾಕಾರದ) ಆಕಾರದ ವಾಸ್ತುಶಿಲ್ಪ ಅತ್ಯಂತ ವಿಶಿಷ್ಟವಾದದ್ದು."
            },
            {
                "pitch": -10, "yaw": 180, "type": "info",
                "text": "ಲಾಡ್ ಖಾನ್ ದೇವಾಲಯ: ಇದು ಐಹೊಳೆಯ ಅತ್ಯಂತ ಹಳೆಯ ದೇವಾಲಯಗಳಲ್ಲಿ ಒಂದಾಗಿದ್ದು, ಪಂಚಾಯತ್ ಶೈಲಿಯಲ್ಲಿ ನಿರ್ಮಿಸಲಾಗಿದೆ."
            },
            {
                "pitch": 0, "yaw": 270, "type": "info",
                "text": "ರಾವಣ ಫಾಡಿ ಗುಹೆ: ಇದು 6ನೇ ಶತಮಾನದ ಶಿಲಾಯುಗದ ಗುಹಾಂತರ ದೇವಾಲಯವಾಗಿದ್ದು, ಶಿವನ ಸುಂದರ ಕೆತ್ತನೆಗಳನ್ನು ಹೊಂದಿದೆ."
            }
        ]
    });
</script>

</body>
</html>
