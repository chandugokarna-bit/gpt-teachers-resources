<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ಆಗುಂಬೆ ಘಾಟಿ - 360° ಆಡಿಯೋ ಪ್ರವಾಸ</title>
    <!-- Pannellum 360 ಲೈಬ್ರರಿ -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.7/build/pannellum.css"/>
    <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.7/build/pannellum.js"></script>
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; }
        #panorama { width: 100vw; height: 100vh; }
        
        /* ಶೀರ್ಷಿಕೆ ಫಲಕ */
        #title-panel {
            position: absolute; top: 20px; left: 20px; color: white;
            background: rgba(15, 23, 42, 0.85); padding: 15px; border-radius: 10px;
            border-left: 5px solid #22c55e; z-index: 999; pointer-events: none;
        }
        #title-panel h1 { margin: 0; font-size: 20px; color: #22c55e; }
        #title-panel p { margin: 5px 0 0 0; font-size: 14px; color: #e2e8f0; }

        /* ಕೆಳಗಿನ ಸುಂದರ ಮಾಹಿತಿ ಫಲಕ (ಆಡಿಯೋ ಮತ್ತು ಪಠ್ಯಕ್ಕಾಗಿ) */
        #info-panel {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            width: 85%; max-width: 650px; background: rgba(15, 23, 42, 0.95); color: #f8fafc;
            padding: 20px; border-radius: 15px; text-align: center;
            font-size: 17px; line-height: 1.6; border: 2px solid #22c55e; /* ಪ್ರಕೃತಿಯ ಹಸಿರು ಬಣ್ಣ */
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            z-index: 999; pointer-events: none;
        }
    </style>
</head>
<body>

<div id="title-panel">
    <h1>ಆಗುಂಬೆ: ಪಶ್ಚಿಮ ಘಟ್ಟಗಳ ಭವ್ಯ ಘಾಟಿ ಮತ್ತು ಮಳೆಕಾಡು</h1>
    <p>ಚಿತ್ರದಲ್ಲಿರುವ ಮಾಹಿತಿ ಐಕಾನ್ ಮೇಲೆ ಕ್ಲಿಕ್ ಮಾಡಿ ಆಡಿಯೋ ವಿವರ ಪಡೆಯಿರಿ</p>
</div>

<div id="panorama"></div>

<div id="info-panel">
    ಸ್ವಾಗತ! ದಕ್ಷಿಣ ಭಾರತದ ಚಿರಾಪುಂಜಿ ಎಂದೇ ಕರೆಯಲ್ಪಡುವ ಆಗುಂಬೆಯ ನೈಸರ್ಗಿಕ ವಿಸ್ಮಯವನ್ನು ತಿಳಿಯಲು ಆವರಣದಲ್ಲಿರುವ ಮಾಹಿತಿ ಐಕಾನ್‌ಗಳ ಮೇಲೆ ಕ್ಲಿಕ್ ಮಾಡಿ...
</div>

<script>
// ಕನ್ನಡ ಧ್ವನಿ ಕಾರ್ಯವಿಧಾನ
function speakKannada(title, infoText) {
    // ಮಾಹಿತಿ ಫಲಕದಲ್ಲಿ ಪಠ್ಯವನ್ನು ನವೀಕರಿಸಲು
    document.getElementById('info-panel').innerHTML = `<strong>${title}</strong><br>${infoText}`;
    
    if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel(); // ಹಳೆಯ ಧ್ವನಿ ನಿಲ್ಲಿಸಲು
        
        const speech = new SpeechSynthesisUtterance();
        speech.text = title + ". " + infoText;
        speech.lang = 'kn-IN'; // ಕನ್ನಡ ಭಾಷೆ
        speech.rate = 0.85; // ಸ್ಪಷ್ಟ ಧ್ವನಿ ವೇಗ
        
        window.speechSynthesis.speak(speech);
    }
}

// Pannellum ವೀಕ್ಷಕ ಸೆಟ್ಟಿಂಗ್ಸ್
pannellum.viewer('panorama', {
    "type": "equirectangular",
    "panorama": "https://raw.githubusercontent.com/chandugokarna-bit/gpt-teachers-resources/main/resources/virtual/agumbe%20ghat360.jpg",
    "autoLoad": true,
    "title": "ಆಗುಂಬೆ ಘಾಟಿ, ಶಿವಮೊಗ್ಗ-ಉಡುಪಿ ಗಡಿ",
    "author": "ನೈಸರ್ಗಿಕ ಜೀವವೈವಿಧ್ಯ ತಾಣ",
    "hotSpots": [
        {
            "pitch": 5,
            "yaw": -30,
            "type": "info",
            "text": "ದಕ್ಷಿಣ ಭಾರತದ ಚಿರಾಪುಂಜಿ ಮತ್ತು ದಟ್ಟ ಮಳೆಕಾಡು",
            "clickHandlerFunc": function() {
                speakKannada(
                    "ದಕ್ಷಿಣ ಭಾರತದ ಚಿರಾಪುಂಜಿ ಮತ್ತು ದಟ್ಟ ಮಳೆಕಾಡು", 
                    "ಆಗುಂಬೆಯು ಪಶ್ಚಿಮ ಘಟ್ಟಗಳ ದಟ್ಟವಾದ ನಿತ್ಯಹರಿದ್ವರಣ ಕಾಡುಗಳ ಮಧ್ಯದಲ್ಲಿದೆ. ಕರ್ನಾಟಕದಲ್ಲಿ ಅತಿ ಹೆಚ್ಚು ಮಳೆ ಪಡೆಯುವ ಪ್ರದೇಶ ಇದಾಗಿದ್ದು, ಇದನ್ನು 'ದಕ್ಷಿಣ ಭಾರತದ ಚಿರಾಪುಂಜಿ' ಎಂದು ಕರೆಯಲಾಗುತ್ತದೆ. ಇದು ಅಪರೂಪದ ಔಷಧಿ ಸಸ್ಯಗಳು ಮತ್ತು ಕಾಳಿಂಗ ಸರ್ಪಗಳ ನೈಸರ್ಗಿಕ ಆವಾಸಸ್ಥಾನವಾಗಿದೆ."
                );
            }
        },
        {
            "pitch": 0,
            "yaw": 10,
            "type": "info",
            "text": "ಆಗುಂಬೆಯ ಪ್ರಸಿದ್ಧ ಸೂರ್ಯಾಸ್ತ ವೀಕ್ಷಣಾ ತಾಣ",
            "clickHandlerFunc": function() {
                speakKannada(
                    "ಆಗುಂಬೆಯ ಪ್ರಸಿದ್ಧ ಸೂರ್ಯಾಸ್ತ ವೀಕ್ಷಣಾ ತಾಣ", 
                    "ಆಗುಂಬೆಯ ಘಾಟಿಯ ತುದಿಯಲ್ಲಿರುವ ಸನ್‌ಸೆಟ್ ಪಾಯಿಂಟ್ ಅತ್ಯಂತ ಪ್ರಸಿದ್ಧವಾದುದು. ಇಲ್ಲಿ ಸಂಜೆಯ ಸಮಯದಲ್ಲಿ ಮೋಡಗಳ ಮಧ್ಯೆ ಸೂರ್ಯನು ಅರಬ್ಬೀ ಸಮುದ್ರದ ಹಾರಿಜಾನ್‌ನಲ್ಲಿ ಮುಳುಗುವ ದೃಶ್ಯವನ್ನು ಕಣ್ಣುಂಬಿಕೊಳ್ಳಲು ಸಾವಿರಾರು ಪ್ರವಾಸಿಗರು ಬರುತ್ತಾರೆ. ಸ್ವಚ್ಛವಾದ ವಾತಾವರಣವಿದ್ದಾಗ ಇಲ್ಲಿಂದಲೇ ದೂರದ ಸಮುದ್ರದ ಹೊಳಪನ್ನು ಕಾಣಬಹುದು."
                );
            }
        },
        {
            "pitch": -10,
            "yaw": 50,
            "type": "info",
            "text": "ಕಡಿದಾದ 14 ಹೇರ್‌ಪಿನ್ ತಿರುವುಗಳ ಘಾಟಿ",
            "clickHandlerFunc": function() {
                speakKannada(
                    "ಕಡಿದಾದ 14 ಹೇರ್‌ಪಿನ್ ತಿರುವುಗಳ ಘಾಟಿ", 
                    "ಆಗುಂಬೆ ಘಾಟಿಯು ಶಿವಮೊಗ್ಗದ ಮಲೆನಾಡು ಭಾಗವನ್ನು ಉಡುಪಿಯ ಕರಾವಳಿ ಭಾಗಕ್ಕೆ ಸಂಪರ್ಕಿಸುವ ಅತ್ಯಂತ ರೋಮಾಂಚಕ ರಸ್ತೆಯಾಗಿದೆ. ಈ ಘಾಟಿಯಲ್ಲಿ ಹದಿನಾಲ್ಕು ಅತ್ಯಂತ ಕಡಿದಾದ ತಿರುವುಗಳಿದ್ದು (Hairpin Bends), ಇಲ್ಲಿ ಚಲಿಸುವಾಗ ಪಶ್ಚಿಮ ಘಟ್ಟಗಳ ಆಳವಾದ ಕಣಿವೆಗಳು ಮತ್ತು ಭವ್ಯ ಪರ್ವತ ಶ್ರೇಣಿಗಳ ರಮಣೀಯ ನೋಟ ಕಾಣಿಸುತ್ತದೆ."
                );
            }
        }
    ]
});
</script>

</body>
</html>
