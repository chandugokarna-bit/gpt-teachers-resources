<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ಆಗುಂಬೆ ಘಾಟಿ 360° ಆಡಿಯೋ ಪ್ರವಾಸ</title>
    <!-- A-Frame VR ಲೈಬ್ರರಿ -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <style>
        /* ಮಾಹಿತಿ ಫಲಕ */
        #info-panel {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            width: 85%; max-width: 650px; background: rgba(15, 23, 42, 0.95); color: #f8fafc;
            padding: 20px; border-radius: 15px; font-family: sans-serif; text-align: center;
            font-size: 18px; line-height: 1.6; border: 2px solid #22c55e; /* Green Border for Nature Theme */
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            z-index: 999; pointer-events: none;
        }
        /* ಶೀರ್ಷಿಕೆ ಫಲಕ */
        #title-panel {
            position: absolute; top: 20px; left: 20px; color: white;
            background: rgba(15, 23, 42, 0.85); padding: 15px; border-radius: 10px;
            border-left: 5px solid #22c55e; z-index: 999;
        }
        #title-panel h1 { margin: 0; font-size: 22px; color: #22c55e; }
    </style>
</head>
<body>

    <div id="title-panel">
        <h1>ಆಗುಂಬೆ: ಪಶ್ಚಿಮ ಘಟ್ಟಗಳ ಭವ್ಯ ಘಾಟಿ ಮತ್ತು ಮಳೆಕಾಡು</h1>
        <p>ಚಿನ್ನದ ಬಣ್ಣದ ವರ್ತುಲಗಳ ಮೇಲೆ ನೇರವಾಗಿ ಕ್ಲಿಕ್ ಮಾಡಿ ಆಡಿಯೋ ಮಾಹಿತಿ ಪಡೆಯಿರಿ</p>
    </div>

    <div id="info-panel">
        ಸ್ವಾಗತ! ದಕ್ಷಿಣ ಭಾರತದ ಚಿರಾಪುಂಜಿ ಎಂದೇ ಕರೆಯಲ್ಪಡುವ ಆಗುಂಬೆಯ ನೈಸರ್ಗಿಕ ವಿಸ್ಮಯವನ್ನು ತಿಳಿಯಲು ಆವರಣದಲ್ಲಿರುವ ಚಿನ್ನದ ಬಣ್ಣದ ಹಾಟ್‌ಸ್ಪಾಟ್‌ಗಳ ಮೇಲೆ ಕ್ಲಿಕ್ ಮಾಡಿ...
    </div>

    <!-- ನೇರ ಮೌಸ್ ಕ್ಲಿಕ್ ಸಿಸ್ಟಮ್ -->
    <a-scene cursor="rayOrigin: mouse">
        <a-assets>
            <img id="agumbe-scene" src="https://raw.githubusercontent.com/chandugokarna-bit/gpt-teachers-resources/main/resources/virtual/agumbe%20ghat360.jpg" crossorigin="anonymous">
        </a-assets>

        <!-- ಹಿನ್ನೆಲೆ 360 ಚಿತ್ರ -->
        <a-sky src="#agumbe-scene"></a-sky>

        <a-entity camera look-controls position="0 1.6 0"></a-entity>

        <!-- ================= ಇಂಟರಾಕ್ಟಿವ್ ಹಾಟ್‌ಸ್ಪಾಟ್‌ಗಳು (ಆರಂಭಿಕ ಸುರಕ್ಷಿತ ಸ್ಥಾನ) ================= -->

        <!-- 1. ದಕ್ಷಿಣ ಭಾರತದ ಚಿರಾಪುಂಜಿ ಮತ್ತು ಮಳೆಕಾಡು (ಎಡಭಾಗ) -->
        <a-sphere id="hotspot-agumbe-rainforest" position="-2 1.5 -4" radius="0.35" color="#eab308" class="hotspot"
                  data-title="ದಕ್ಷಿಣ ಭಾರತದ ಚಿರಾಪುಂಜಿ ಮತ್ತು ದಟ್ಟ ಮಳೆಕಾಡು"
                  data-info="ಆಗುಂಬೆಯು ಪಶ್ಚಿಮ ಘಟ್ಟಗಳ ದಟ್ಟವಾದ ನಿತ್ಯಹರಿದ್ವರಣ ಕಾಡುಗಳ (Evergreen Rainforests) ಮಧ್ಯದಲ್ಲಿದೆ. ಕರ್ನಾಟಕದಲ್ಲಿ ಅತಿ ಹೆಚ್ಚು ಮಳೆ ಪಡೆಯುವ ಪ್ರದೇಶ ಇದಾಗಿದ್ದು, ಇದನ್ನು 'ದಕ್ಷಿಣ ಭಾರತದ ಚಿರಾಪುಂಜಿ' ಎಂದು ಕರೆಯಲಾಗುತ್ತದೆ. ಇದು ಅಪರೂಪದ ಔಷಧಿ ಸಸ್ಯಗಳು ಮತ್ತು ಕಾಳಿಂಗ ಸರ್ಪಗಳ (King Cobra) ನೈಸರ್ಗಿಕ ಆವಾಸಸ್ಥಾನವಾಗಿದೆ.">
        </a-sphere>

        <!-- 2. ಭವ್ಯ ಸೂರ್ಯಾಸ್ತ ಪಾಯಿಂಟ್ (ಮಧ್ಯದಲ್ಲಿದೆ) -->
        <a-sphere id="hotspot-agumbe-sunset" position="0 1.5 -4" radius="0.35" color="#eab308" class="hotspot"
                  data-title="ಆಗುಂಬೆಯ ಪ್ರಸಿದ್ಧ ಸೂರ್ಯಾಸ್ತ ವೀಕ್ಷಣಾ ತಾಣ"
                  data-info="ಆಗುಂಬೆಯ ಘಾಟಿಯ ತುದಿಯಲ್ಲಿರುವ ಸನ್‌ಸೆಟ್ ಪಾಯಿಂಟ್ ಅತ್ಯಂತ ಪ್ರಸಿದ್ಧವಾದುದು. ಇಲ್ಲಿ ಸಂಜೆಯ ಸಮಯದಲ್ಲಿ ಮೋಡಗಳ ಮಧ್ಯೆ ಸೂರ್ಯನು ಅರಬ್ಬೀ ಸಮುದ್ರದ ಹಾರಿಜಾನ್‌ನಲ್ಲಿ ಮುಳುಗುವ ದೃಶ್ಯವನ್ನು ಕಣ್ಣುಂಬಿಕೊಳ್ಳಲು ಸಾವಿರಾರು ಪ್ರವಾಸಿಗರು ಬರುತ್ತಾರೆ. ಸ್ವಚ್ಛವಾದ ವಾತಾವರಣವಿದ್ದಾಗ ಇಲ್ಲಿಂದಲೇ ದೂರದ ಸಮುದ್ರದ ಹೊಳಪನ್ನು ಕಾಣಬಹುದು.">
        </a-sphere>

        <!-- 3. ಹದಿನಾಲ್ಕು ತಿರುವುಗಳ ಘಾಟಿ ರಸ್ತೆ (ಬಲಭಾಗದಲ್ಲಿದೆ) -->
        <a-sphere id="hotspot-agumbe-ghat" position="2 1.5 -4" radius="0.35" color="#eab308" class="hotspot"
                  data-title="ಕಡಿದಾದ 14 ಹೇರ್‌ಪಿನ್ ತಿರುವುಗಳ ಘಾಟಿ"
                  data-info="ಆಗುಂಬೆ ಘಾಟಿಯು ಶಿವಮೊಗ್ಗದ ಮಲೆನಾಡು ಭಾಗವನ್ನು ಉಡುಪಿಯ ಕರಾವಳಿ ಭಾಗಕ್ಕೆ ಸಂಪರ್ಕಿಸುವ ಅತ್ಯಂತ ರೋಮಾಂಚಕ ರಸ್ತೆಯಾಗಿದೆ. ಈ ಘಾಟಿಯಲ್ಲಿ ಹದಿನಾಲ್ಕು ಅತ್ಯಂತ ಕಡಿದಾದ ತಿರುವುಗಳಿದ್ದು (Hairpin Bends), ಇಲ್ಲಿ ಚಲಿಸುವಾಗ ಪಶ್ಚಿಮ ಘಟ್ಟಗಳ ಆಳವಾದ ಕಣಿವೆಗಳು ಮತ್ತು ಭವ್ಯ ಪರ್ವತ ಶ್ರೇಣಿಗಳ ರಮಣೀಯ ನೋಟ ಕಾಣಿಸುತ್ತದೆ.">
        </a-sphere>

    </a-scene>

    <script>
        const hotspots = document.querySelectorAll('.hotspot');
        const infoPanel = document.getElementById('info-panel');

        hotspots.forEach(hotspot => {
            // ಮೌಸ್ Hover ಇಫೆಕ್ಟ್
            hotspot.addEventListener('mouseenter', function () {
                this.setAttribute('color', '#ef4444'); // ಕೆಂಪು ಬಣ್ಣ
            });

            hotspot.addEventListener('mouseleave', function () {
                this.setAttribute('color', '#eab308'); // ಮರಳಿ ಚಿನ್ನದ ಬಣ್ಣ
            });

            // ಕ್ಲಿಕ್ ಇವೆಂಟ್ ಮತ್ತು ಆಡಿಯೋ ಪ್ಲೇಬ್ಯಾಕ್
            hotspot.addEventListener('click', function () {
                const title = this.getAttribute('data-title');
                const info = this.getAttribute('data-info');
                
                infoPanel.innerHTML = `<strong>${title}</strong><br>${info}`;

                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel(); // ಹಳೆಯ ಧ್ವನಿ ನಿಲ್ಲಿಸಲು
                    
                    const speech = new SpeechSynthesisUtterance();
                    speech.text = title + ". " + info;
                    speech.lang = 'kn-IN'; // ಕನ್ನಡ ಭಾಷೆ
                    speech.rate = 0.85; // ಸ್ಪಷ್ಟ ಧ್ವನಿ ವೇಗ
                    
                    window.speechSynthesis.speak(speech);
                }
            });
        });
    </script>
</body>
</html>
