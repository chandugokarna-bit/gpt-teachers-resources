<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ಆಗ್ರಾ ತಾಜ್‌ಮಹಲ್ - 360° ಆಡಿಯೋ ಪ್ರವಾಸ</title>
    <!-- Pannellum 360 ಲೈಬ್ರರಿ -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.7/build/pannellum.css"/>
    <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.7/build/pannellum.js"></script>
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; }
        #panorama { width: 100vw; height: 100vh; }
        
        /* ಶೀರ್ಷಿಕೆ ಫಲಕ */
        #title-panel {
            position: absolute; top: 20px; left: 20px; color: white;
            background: rgba(15, 23, 42, 0.85); padding: 15px; border-radius: 10px;
            border-left: 5px solid #0ea5e9; z-index: 999; pointer-events: none;
        }
        #title-panel h1 { margin: 0; font-size: 20px; color: #0ea5e9; }
        #title-panel p { margin: 5px 0 0 0; font-size: 14px; color: #e2e8f0; }

        /* ಕೆಳಗಿನ ಸುಂದರ ಮಾಹಿತಿ ಫಲಕ (ಆಡಿಯೋ ಮತ್ತು ಪಠ್ಯಕ್ಕಾಗಿ) */
        #info-panel {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            width: 85%; max-width: 650px; background: rgba(15, 23, 42, 0.95); color: #f8fafc;
            padding: 20px; border-radius: 15px; text-align: center;
            font-size: 17px; line-height: 1.6; border: 2px solid #0ea5e9; /* ತಾಜ್ ಮೌಲ್ಯಕ್ಕೆ ನೀಲಿ ಬಣ್ಣ */
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            z-index: 999; pointer-events: none;
        }

        /* 🎯 ದೊಡ್ಡದಾಗಿರುವ ಕಸ್ಟಮ್ ಹಾಟ್‌ಸ್ಪಾಟ್‌ ಬಬಲ್ಸ್ */
        .custom-hotspot {
            height: 32px;
            width: 32px;
            background: #eab308; /* ಹೊಳೆಯುವ ಚಿನ್ನದ ಬಣ್ಣ */
            border: 3px solid #ffffff;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 12px rgba(234, 179, 8, 0.8);
            transition: all 0.3s ease;
        }
        /* ಅದರ ಮೇಲೆ ಬೆರಳು ಇಟ್ಟಾಗ ಕೆಂಪು ಬಣ್ಣಕ್ಕೆ ತಿರುಗಲು */
        .custom-hotspot:hover {
            background: #ef4444; 
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.9);
            transform: scale(1.2);
        }
    </style>
</head>
<body>

<div id="title-panel">
    <h1>ಆಗ್ರಾ: ಭವ್ಯ ತಾಜ್‌ಮಹಲ್ ವರ್ಚುವಲ್ ದರ್ಶನ</h1>
    <p>ದೊಡ್ಡದಾಗಿರುವ ಚಿನ್ನದ ಬಣ್ಣದ ವರ್ತುಲಗಳ ಮೇಲೆ ಕ್ಲಿಕ್ ಮಾಡಿ ಆಡಿಯೋ ವಿವರ ಪಡೆಯಿರಿ</p>
</div>

<div id="panorama"></div>

<div id="info-panel">
    ಸ್ವಾಗತ! ವಿಶ್ವದ ಅದ್ಭುತವಾದ ತಾಜ್‌ಮಹಲ್‌ನ ಭವ್ಯ ವಾಸ್ತುಶಿಲ್ಪವನ್ನು ತಿಳಿಯಲು ಆವರಣದಲ್ಲಿರುವ ದೊಡ್ಡ ಹಾಟ್‌ಸ್ಪಾಟ್‌ಗಳ ಮೇಲೆ ಕ್ಲಿಕ್ ಮಾಡಿ...
</div>

<script>
// ಕನ್ನಡ ಧ್ವನಿ ಕಾರ್ಯವಿಧಾನ
function speakKannada(title, infoText) {
    document.getElementById('info-panel').innerHTML = `<strong>${title}</strong><br>${infoText}`;
    
    if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel(); // ಹಳೆಯ ಧ್ವನಿ ನಿಲ್ಲಿಸಲು
        
        const speech = new SpeechSynthesisUtterance();
        speech.text = title + ". " + infoText;
        speech.lang = 'kn-IN'; // ಕನ್ನಡ ಭಾಷೆ
        speech.rate = 0.85; // ಸ್ಪಷ್ಟ ಧ್ವನಿ ವೇಗ
        
        window.speechSynthesis.speak(speech);
    }
}

// Pannellum ವೀಕ್ಷಕ ಸೆಟ್ಟಿಂಗ್ಸ್
pannellum.viewer('panorama', {
    "type": "equirectangular",
    "panorama": "https://raw.githubusercontent.com/chandugokarna-bit/gpt-teachers-resources/main/resources/virtual/Tajmahal360.jpg",
    "autoLoad": true,
    "title": "ತಾಜ್‌ಮಹಲ್, ಆಗ್ರಾ",
    "author": "ವಿಶ್ವದ ಜಗತ್ಪ್ರಸಿದ್ಧ ಅದ್ಭುತ ತಾಣ",
    "hotSpots": [
        {
            "pitch": 10,
            "yaw": -30,
            "cssClass": "custom-hotspot", // ನಮ್ಮ ಕಸ್ಟಮ್ ದೊಡ್ಡ ಹಾಟ್‌ಸ್ಪಾಟ್
            "createTooltipFunc": function(hotSpotDiv) { hotSpotDiv.setAttribute("title", "ಮುಖ್ಯ ಗುಮ್ಮಟ"); },
            "clickHandlerFunc": function() {
                speakKannada(
                    "ತಾಜ್‌ಮಹಲ್‌ನ ಮುಖ್ಯ ಗುಮ್ಮಟ", 
                    "ತಾಜ್‌ಮಹಲ್ ಅನ್ನು ಮೊಘಲ್ ಚಕ್ರವರ್ತಿ ಷಹಜಹಾನ್ ತನ್ನ ನೆಚ್ಚಿನ ಪತ್ನಿ ಮಮ್ತಾಜ್ ಬೇಗಂ ಅವರ ಸವಿನೆನಪಿಗಾಗಿ ಜಗತ್ತಿನಾದ್ಯಂತ ತರಿಸಿದ ಶುದ್ಧ ಬಿಳಿ ಅಮೃತಶಿಲೆಯಿಂದ ನಿರ್ಮಿಸಿದನು. ಇದರ ಪೂರ್ಣ ನಿರ್ಮಾಣಕ್ಕೆ ಸುಮಾರು 22 ವರ್ಷಗಳು ಬೇಕಾದವು."
                );
            }
        },
        {
            "pitch": 5,
            "yaw": 20,
            "cssClass": "custom-hotspot",
            "createTooltipFunc": function(hotSpotDiv) { hotSpotDiv.setAttribute("title", "ಮಿನಾರ್ ಗೋಪುರಗಳು"); },
            "clickHandlerFunc": function() {
                speakKannada(
                    "ಸುತ್ತಲಿನ ಮಿನಾರ್ ಗೋಪುರಗಳು", 
                    "ತಾಜ್‌ಮಹಲ್‌ನ ನಾಲ್ಕೂ ಮೂಲೆಗಳಲ್ಲಿ ಎತ್ತರದ ಮಿನಾರ್ ಗೋಪುರಗಳಿವೆ. ವಿಶೇಷವೆಂದರೆ, ಭೂಕಂಪದಂತಹ ದೊಡ್ಡ ವಿಪತ್ತು ಸಂಭವಿಸಿದರೂ ಸಹ, ಈ ಗೋಪುರಗಳು ಮುಖ್ಯ ಗುಮ್ಮಟದ ಮೇಲೆ ಬೀಳದಂತೆ, ಹೊರಭಾಗಕ್ಕೆ ಸ್ವಲ್ಪ ವಾಲಿರುವಂತೆ ಅತ್ಯಂತ ತಾಂತ್ರಿಕವಾಗಿ ನಿರ್ಮಿಸಲಾಗಿದೆ."
                );
            }
        },
        {
            "pitch": -8,
            "yaw": 0,
            "cssClass": "custom-hotspot",
            "createTooltipFunc": function(hotSpotDiv) { hotSpotDiv.setAttribute("title", "ಚಾರ್ ಬಾಗ್ ಉದ್ಯಾನವನ"); },
            "clickHandlerFunc": function() {
                speakKannada(
                    "ಚಾರ್ ಬಾಗ್ ಉದ್ಯಾನವನ ಮತ್ತು ಕಾರಂಜಿ", 
                    "ತಾಜ್‌ಮಹಲ್‌ನ ಮುಂಭಾಗದಲ್ಲಿ ವಿಶಾಲವಾದ 'ಚಾರ್ ಬಾಗ್' ಎಂಬ ಮೊಘಲ್ ಶೈಲಿಯ ಉದ್ಯಾನವನವಿದೆ. ಇದರ ಮಧ್ಯದಲ್ಲಿರುವ ಉದ್ದನೆಯ ನೀರಿನ ಕಾರಂಜಿಯಲ್ಲಿ ತಾಜ್‌ಮಹಲ್‌ನ ಭವ್ಯವಾದ ಬಿಂಬವು ಅತ್ಯಂತ ಸುಂದರವಾಗಿ ಪ್ರತಿಫಲಿಸುತ್ತದೆ."
                );
            }
        }
    ]
});
</script>

</body>
</html>
