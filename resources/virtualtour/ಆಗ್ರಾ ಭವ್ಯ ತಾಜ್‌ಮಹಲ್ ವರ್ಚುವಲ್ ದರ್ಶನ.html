<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ಆಗ್ರಾ ತಾಜ್‌ಮಹಲ್ 360° ಆಡಿಯೋ ಪ್ರವಾಸ</title>
    <!-- A-Frame VR ಲೈಬ್ರರಿ -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <style>
        /* ಮಾಹಿತಿ ಫಲಕ */
        #info-panel {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            width: 85%; max-width: 650px; background: rgba(15, 23, 42, 0.95); color: #f8fafc;
            padding: 20px; border-radius: 15px; font-family: sans-serif; text-align: center;
            font-size: 18px; line-height: 1.6; border: 2px solid #0ea5e9; /* Sky Blue Border */
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            z-index: 999; pointer-events: none;
        }
        /* ಶೀರ್ಷಿಕೆ ಫಲಕ */
        #title-panel {
            position: absolute; top: 20px; left: 20px; color: white;
            background: rgba(15, 23, 42, 0.85); padding: 15px; border-radius: 10px;
            border-left: 5px solid #0ea5e9; z-index: 999;
        }
        #title-panel h1 { margin: 0; font-size: 22px; color: #0ea5e9; }
    </style>
</head>
<body>

    <div id="title-panel">
        <h1>ಆಗ್ರಾ: ಭವ್ಯ ತಾಜ್‌ಮಹಲ್ ವರ್ಚುವಲ್ ದರ್ಶನ</h1>
        <p>ಚಿನ್ನದ ಬಣ್ಣದ ವರ್ತುಲಗಳ ಮೇಲೆ ನೇರವಾಗಿ ಕ್ಲಿಕ್ ಮಾಡಿ ಆಡಿಯೋ ಮಾಹಿತಿ ಪಡೆಯಿರಿ</p>
    </div>

    <div id="info-panel">
        ಸ್ವಾಗತ! ವಿಶ್ವದ ಅದ್ಭುತವಾದ ತಾಜ್‌ಮಹಲ್‌ನ ಭವ್ಯ ವಾಸ್ತುಶಿಲ್ಪವನ್ನು ತಿಳಿಯಲು ಆವರಣದಲ್ಲಿರುವ ಚಿನ್ನದ ಬಣ್ಣದ ಹಾಟ್‌ಸ್ಪಾಟ್‌ಗಳ ಮೇಲೆ ಕ್ಲಿಕ್ ಮಾಡಿ...
    </div>

    <!-- ನೇರ ಮೌಸ್ ಕ್ಲಿಕ್ ಸಿಸ್ಟಮ್ -->
    <a-scene cursor="rayOrigin: mouse">
        <a-assets>
            <img id="tajmahal-scene" src="https://raw.githubusercontent.com/chandugokarna-bit/gpt-teachers-resources/main/resources/virtual/Tajmahal360.jpg" crossorigin="anonymous">
        </a-assets>

        <!-- ಹಿನ್ನೆಲೆ 360 ಚಿತ್ರ -->
        <a-sky src="#tajmahal-scene"></a-sky>

        <a-entity camera look-controls position="0 1.6 0"></a-entity>

        <!-- ================= ಇಂಟರಾಕ್ಟಿವ್ ಹಾಟ್‌ಸ್ಪಾಟ್‌ಗಳು (ಆರಂಭಿಕ ಸುರಕ್ಷಿತ ಸ್ಥಾನ) ================= -->

        <!-- 1. ಮುಖ್ಯ ಬಿಳಿ ಹರಳು ಗುಮ್ಮಟ (ಎಡಭಾಗ) -->
        <a-sphere id="hotspot-taj-dome" position="-2 1.5 -4" radius="0.35" color="#eab308" class="hotspot"
                  data-title="ತಾಜ್‌ಮಹಲ್‌ನ ಮುಖ್ಯ ಗುಮ್ಮಟ"
                  data-info="ತಾಜ್‌ಮಹಲ್ ಅನ್ನು ಮೊಘಲ್ ಚಕ್ರವರ್ತಿ ಷಹಜಹಾನ್ ತನ್ನ ನೆಚ್ಚಿನ ಪತ್ನಿ ಮಮ್ತಾಜ್ ಬೇಗಂ ಅವರ ಸವಿನೆನಪಿಗಾಗಿ ಜಗತ್ತಿನಾದ್ಯಂತ ತರಿಸಿದ ಶುದ್ಧ ಬಿಳಿ ಅಮೃತಶಿಲೆಯಿಂದ (White Marble) ನಿರ್ಮಿಸಿದನು. ಇದರ ಪೂರ್ಣ ನಿರ್ಮಾಣಕ್ಕೆ ಸುಮಾರು 22 ವರ್ಷಗಳು ಬೇಕಾದವು.">
        </a-sphere>

        <!-- 2. ವಾಸ್ತುಶಿಲ್ಪದ ಸಮಿತಿ ಮತ್ತು ಮಿನಾರ್‌ಗಳು (ಮಧ್ಯದಲ್ಲಿದೆ) -->
        <a-sphere id="hotspot-taj-minars" position="0 1.5 -4" radius="0.35" color="#eab308" class="hotspot"
                  data-title="ಸುತ್ತಲಿನ ಮಿನಾರ್ ಗೋಪುರಗಳು"
                  data-info="ತಾಜ್‌ಮಹಲ್‌ನ ನಾಲ್ಕೂ ಮೂಲೆಗಳಲ್ಲಿ ಎತ್ತರದ ಮಿನಾರ್ ಗೋಪುರಗಳಿವೆ. ವಿಶೇಷವೆಂದರೆ, ಭೂಕಂಪದಂತಹ ದೊಡ್ಡ ವಿಪತ್ತು ಸಂಭವಿಸಿದರೂ ಸಹ, ಈ ಗೋಪುರಗಳು ಮುಖ್ಯ ಗುಮ್ಮಟದ ಮೇಲೆ ಬೀಳದಂತೆ, ಹೊರಭಾಗಕ್ಕೆ ಸ್ವಲ್ಪ ವಾಲಿರುವಂತೆ ಅತ್ಯಂತ ತಾಂತ್ರಿಕವಾಗಿ ನಿರ್ಮಿಸಲಾಗಿದೆ.">
        </a-sphere>

        <!-- 3. ಮುಂಭಾಗದ ಕಾರಂಜಿ ಮತ್ತು ಉದ್ಯಾನವನ (ಬಲಭಾಗದಲ್ಲಿದೆ) -->
        <a-sphere id="hotspot-taj-garden" position="2 1.5 -4" radius="0.35" color="#eab308" class="hotspot"
                  data-title="ಚಾರ್ ಬಾಗ್ ಉದ್ಯಾನವನ ಮತ್ತು ಕಾರಂಜಿ"
                  data-info="ತಾಜ್‌ಮಹಲ್‌ನ ಮುಂಭಾಗದಲ್ಲಿ ವಿಶಾಲವಾದ 'ಚಾರ್ ಬಾಗ್' ಎಂಬ ಮೊಘಲ್ ಶೈಲಿಯ ಉದ್ಯಾನವನವಿದೆ. ಇದರ ಮಧ್ಯದಲ್ಲಿರುವ ಉದ್ದನೆಯ ನೀರಿನ ಕಾರಂಜಿಯಲ್ಲಿ ತಾಜ್‌ಮಹಲ್‌ನ ಭವ್ಯವಾದ ಬಿಂಬವು ಅತ್ಯಂತ ಸುಂದರವಾಗಿ ಪ್ರತಿಫಲಿಸುತ್ತದೆ.">
        </a-sphere>

    </a-scene>

    <script>
        const hotspots = document.querySelectorAll('.hotspot');
        const infoPanel = document.getElementById('info-panel');

        hotspots.forEach(hotspot => {
            // ಮೌಸ್ Hover ಇಫೆಕ್ಟ್
            hotspot.addEventListener('mouseenter', function () {
                this.setAttribute('color', '#ef4444'); // ಕೆಂಪು ಬಣ್ಣ
            });

            hotspot.addEventListener('mouseleave', function () {
                this.setAttribute('color', '#eab308'); // ಮರಳಿ ಚಿನ್ನದ ಬಣ್ಣ
            });

            // ಕ್ಲಿಕ್ ಇವೆಂಟ್ ಮತ್ತು ಆಡಿಯೋ ಪ್ಲೇಬ್ಯಾಕ್
            hotspot.addEventListener('click', function () {
                const title = this.getAttribute('data-title');
                const info = this.getAttribute('data-info');
                
                infoPanel.innerHTML = `<strong>${title}</strong><br>${info}`;

                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel(); // ಹಳೆಯ ಧ್ವನಿ ನಿಲ್ಲಿಸಲು
                    
                    const speech = new SpeechSynthesisUtterance();
                    speech.text = title + ". " + info;
                    speech.lang = 'kn-IN'; // ಕನ್ನಡ ಭาಷೆ
                    speech.rate = 0.85; // ಸ್ಪಷ್ಟ ಧ್ವನಿ ವೇಗ
                    
                    window.speechSynthesis.speak(speech);
                }
            });
        });
    </script>
</body>
</html>
