<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ಐಹೊಳೆ ಚಾಲುಕ್ಯ ವಾಸ್ತುಶಿಲ್ಪ 360° ಆಡಿಯೋ ಪ್ರವಾಸ</title>
    <!-- A-Frame VR ಲೈಬ್ರರಿ -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <style>
        /* ಮಾಹಿತಿ ಫಲಕ */
        #info-panel {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            width: 85%; max-width: 650px; background: rgba(24, 24, 27, 0.95); color: #f4f4f5;
            padding: 20px; border-radius: 15px; font-family: sans-serif; text-align: center;
            font-size: 18px; line-height: 1.6; border: 2px solid #eab308; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            z-index: 999; pointer-events: none;
        }
        /* ಶೀರ್ಷಿಕೆ ಫಲಕ */
        #title-panel {
            position: absolute; top: 20px; left: 20px; color: white;
            background: rgba(24, 24, 27, 0.85); padding: 15px; border-radius: 10px;
            border-left: 5px solid #eab308; z-index: 999;
        }
        #title-panel h1 { margin: 0; font-size: 22px; color: #eab308; }
    </style>
</head>
<body>

    <div id="title-panel">
        <h1>ಐಹೊಳೆ: ಭಾರತೀಯ ದೇವcluster ವಾಸ್ತುಶಿಲ್ಪದ ತೊಟ್ಟಿಲು</h1>
        <p>ಚಿನ್ನದ ಬಣ್ಣದ ವರ್ತುಲಗಳ ಮೇಲೆ ನೇರವಾಗಿ ಕ್ಲಿಕ್ ಮಾಡಿ ಆಡಿಯೋ ಮಾಹಿತಿ ಪಡೆಯಿರಿ</p>
    </div>

    <div id="info-panel">
        ಸ್ವಾಗತ! ಚಾಲುಕ್ಯರ ಅದ್ಭುತ ಕಲಾ ನಗರಿ ಐಹೊಳೆಯ ಇತಿಹಾಸವನ್ನು ತಿಳಿಯಲು ಆವರಣದಲ್ಲಿರುವ ಚಿನ್ನದ ಬಣ್ಣದ ಹಾಟ್‌ಸ್ಪಾಟ್‌ಗಳ ಮೇಲೆ ಕ್ಲಿಕ್ ಮಾಡಿ...
    </div>

    <!-- ನೇರ ಮೌಸ್ ಕ್ಲಿಕ್ ಸಿಸ್ಟಮ್ -->
    <a-scene cursor="rayOrigin: mouse">
        <a-assets>
            <img id="aihole-scene" src="https://raw.githubusercontent.com/chandugokarna-bit/gpt-teachers-resources/main/resources/virtual/aihole360.jpg" crossorigin="anonymous">
        </a-assets>

        <!-- ಹಿನ್ನೆಲೆ 360 ಚಿತ್ರ -->
        <a-sky src="#aihole-scene"></a-sky>

        <a-entity camera look-controls position="0 1.6 0"></a-entity>

        <!-- ================= ಇಂಟರಾಕ್ಟಿವ್ ಹಾಟ್‌ಸ್ಪಾಟ್‌ಗಳು (ಆರಂಭಿಕ ಸುರಕ್ಷಿತ ಸ್ಥಾನ) ================= -->

        <!-- 1. ಐಹೊಳೆ ಇತಿಹಾಸ ಮತ್ತು ಚಾಲುಕ್ಯರ ತೊಟ್ಟಿಲು (ಎಡಭಾಗ) -->
        <a-sphere id="hotspot-aihole-history" position="-2 1.5 -4" radius="0.35" color="#eab308" class="hotspot"
                  data-title="ಭಾರತೀಯ ದೇವಸ್ಥಾನ ವಾಸ್ತುಶಿಲ್ಪದ ತೊಟ್ಟಿಲು"
                  data-info="ಐಹೊಳೆ ಬಾದಾಮಿ ಚಾಲುಕ್ಯರ ಮೊದಲ ರಾಜಧಾನಿಯಾಗಿತ್ತು. ಇಲ್ಲಿ 125 ಕ್ಕೂ ಹೆಚ್ಚು ಕಲ್ಲಿನ ದೇವಸ್ಥಾನಗಳಿರುವುದರಿಂದ ಇದನ್ನು 'ಭಾರತೀಯ ದೇವಸ್ಥಾನ ವಾಸ್ತುಶಿಲ್ಪದ ತೊಟ್ಟಿಲು' (Cradle of Indian Temple Architecture) ಎಂದು ಕರೆಯಲಾಗುತ್ತದೆ. ಇಲ್ಲಿ ಚಾಲುಕ್ಯ ಶಿಲ್ಪಿಗಳು ವಿವಿಧ ಶೈಲಿಯ ಕಟ್ಟಡಗಳನ್ನು ಕಟ್ಟಿ ಪ್ರಯೋಗ ನಡೆಸುತ್ತಿದ್ದರು.">
        </a-sphere>

        <!-- 2. ವಿಶಿಷ್ಟ ದುರ್ಗಾ ದೇವಸ್ಥಾನ (ಮಧ್ಯದಲ್ಲಿದೆ) -->
        <a-sphere id="hotspot-aihole-durga" position="0 1.5 -4" radius="0.35" color="#eab308" class="hotspot"
                  data-title="ಭವ್ಯ ದುರ್ಗಾ ದೇವಸ್ಥಾನ"
                  data-info="ಐಹೊಳೆಯ ಅತ್ಯಂತ ಪ್ರಸಿದ್ಧ ಮತ್ತು ಸುಂದರ ಕಟ್ಟಡವೇ ದುರ್ಗಾ ದೇವಸ್ಥಾನ. ಇದು ಬೌದ್ಧ ಚೈತ್ಯಾಲಯವನ್ನು ಹೋಲುವ ವಿಶಿಷ್ಟವಾದ ಅರೆ-ವೃತ್ತಾಕಾರದ ಅಥವಾ 'ಗಜಪೃಷ್ಠಾಕಾರದ' (Apsidal) ತಳಪಾಯವನ್ನು ಹೊಂದಿದೆ. ಇದರ ಕಾರಿಡಾರ್ ಮತ್ತು ಕಂಬಗಳ ಮೇಲಿರುವ ಸುರಸುಂದರಿಯರ ಹಾಗೂ ದೇವತೆಗಳ ಕೆತ್ತನೆಗಳು ಅತ್ಯಂತ ಮೋಹಕವಾಗಿವೆ.">
        </a-sphere>

        <!-- 3. ಲಡ್ ಖಾನ್ ದೇವಸ್ಥಾನ ಮತ್ತು ಶಾಸನಗಳು (ಬಲಭಾಗದಲ್ಲಿದೆ) -->
        <a-sphere id="hotspot-aihole-ladkhan" position="2 1.5 -4" radius="0.35" color="#eab308" class="hotspot"
                  data-title="ಲಡ್ ಖಾನ್ ದೇವಸ್ಥಾನ ಮತ್ತು ಐಹೊಳೆ ಶಾಸನ"
                  data-info="ಇಲ್ಲಿನ ಅತ್ಯಂತ ಹಳೆಯ ದೇವಸ್ಥಾನಗಳಲ್ಲಿ ಲಡ್ ಖಾನ್ ದೇವಸ್ಥಾನವೂ ಒಂದು, ಇದನ್ನು ಆರಂಭದಲ್ಲಿ ಸಭಾಭವನವಾಗಿ ಬಳಸಲಾಗುತ್ತಿತ್ತು. ಇದರ ಜೊತೆಗೆ, ಐಹೊಳೆಯ ಮೇಗುತಿ ಜೈನ ದೇವಾಲಯದಲ್ಲಿ ಪ್ರಸಿದ್ಧ ಕವಿ ರವಿಕೀರ್ತಿ ಬರೆದ 'ಐಹೊಳೆ ಶಾಸನ'ವಿದೆ. ಇದು ಇಮ್ಮಡಿ ಪುಲಕೇಶಿಯು ಹರ್ಷವರ್ಧನನ್ನು ಸೋಲಿಸಿದ ಭವ್ಯ ವಿಜಯದ ಇತಿಹಾಸವನ್ನು ಸಾರುತ್ತದೆ.">
        </a-sphere>

    </a-scene>

    <script>
        const hotspots = document.querySelectorAll('.hotspot');
        const infoPanel = document.getElementById('info-panel');

        hotspots.forEach(hotspot => {
            // ಮೌಸ್ Hover ಇಫೆಕ್ಟ್
            hotspot.addEventListener('mouseenter', function () {
                this.setAttribute('color', '#ef4444'); // ಕೆಂಪು ಬಣ್ಣ
            });

            hotspot.addEventListener('mouseleave', function () {
                this.setAttribute('color', '#eab308'); // ಮರಳಿ ಚಿನ್ನದ ಬಣ್ಣ
            });

            // ಕ್ಲಿಕ್ ಇವೆಂಟ್ ಮತ್ತು ಆಡಿಯೋ ಪ್ಲೇಬ್ಯಾಕ್
            hotspot.addEventListener('click', function () {
                const title = this.getAttribute('data-title');
                const info = this.getAttribute('data-info');
                
                infoPanel.innerHTML = `<strong>${title}</strong><br>${info}`;

                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel(); // ಹಳೆಯ ಧ್ವನಿ ನಿಲ್ಲಿಸಲು
                    
                    const speech = new SpeechSynthesisUtterance();
                    speech.text = title + ". " + info;
                    speech.lang = 'kn-IN'; // ಕನ್ನಡ ಭಾಷೆ
                    speech.rate = 0.85; // ಸ್ಪಷ್ಟ ಧ್ವನಿ ವೇಗ
                    
                    window.speechSynthesis.speak(speech);
                }
            });
        });
    </script>
</body>
</html>
