<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>ಪಟ್ಟದಕಲ್ಲು ಚಾಲುಕ್ಯ ವಾಸ್ತುಶಿಲ್ಪ 360° ಆಡಿಯೋ ಪ್ರವಾಸ</title>
    <!-- A-Frame VR ಲೈಬ್ರರಿ -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <style>
        /* ಮಾಹಿತಿ ಫಲಕ */
        #info-panel {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            width: 85%; max-width: 650px; background: rgba(24, 24, 27, 0.95); color: #f4f4f5;
            padding: 20px; border-radius: 15px; font-family: sans-serif; text-align: center;
            font-size: 18px; line-height: 1.6; border: 2px solid #eab308; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            z-index: 999; pointer-events: none;
        }
        /* ಶೀರ್ಷಿಕೆ ಫಲಕ */
        #title-panel {
            position: absolute; top: 20px; left: 20px; color: white;
            background: rgba(24, 24, 27, 0.85); padding: 15px; border-radius: 10px;
            border-left: 5px solid #eab308; z-index: 999;
        }
        #title-panel h1 { margin: 0; font-size: 22px; color: #eab308; }
    </style>
</head>
<body>

    <div id="title-panel">
        <h1>ಪಟ್ಟದಕಲ್ಲು: ಚಾಲುಕ್ಯರ ಭವ್ಯ ಜಗತ್ಪ್ರಸಿದ್ಧ ಶಿಲ್ಪಕಲಾ ಸಂಕೀರ್ಣ</h1>
        <p>ಚಿನ್ನದ ಬಣ್ಣದ ವರ್ತುಲಗಳ ಮೇಲೆ ನೇರವಾಗಿ ಕ್ಲಿಕ್ ಮಾಡಿ ಆಡಿಯೋ ಮಾಹಿತಿ ಪಡೆಯಿರಿ</p>
    </div>

    <div id="info-panel">
        ಸ್ವಾಗತ! ಯುನೆಸ್ಕೋ (UNESCO) ಜಗತ್ತಿನ ಪಾರಂಪರಿಕ ತಾಣವಾಗಿರುವ ಪಟ್ಟದಕಲ್ಲಿನ ಭವ್ಯ ಇತಿಹಾಸವನ್ನು ತಿಳಿಯಲು ಆವರಣದಲ್ಲಿರುವ ಚಿನ್ನದ ಬಣ್ಣದ ಹಾಟ್‌ಸ್ಪಾಟ್‌ಗಳ ಮೇಲೆ ಕ್ಲಿಕ್ ಮಾಡಿ...
    </div>

    <!-- VR ಬಟನ್ ಸಂಪೂರ್ಣವಾಗಿ ತೆಗೆದುಹಾಕಲಾಗಿದೆ -->
    <a-scene vr-mode-ui="enabled: false" cursor="rayOrigin: mouse">
        <a-assets>
            <img id="pattadakal-scene" src="https://raw.githubusercontent.com/chandugokarna-bit/gpt-teachers-resources/main/resources/virtual/pattadakal360.jpg" crossorigin="anonymous">
        </a-assets>

        <!-- ಹಿನ್ನೆಲೆ 360 ಚಿತ್ರ -->
        <a-sky src="#pattadakal-scene"></a-sky>

        <!-- ಫೋನ್ ಮೊಬೈಲ್ ಸೆನ್ಸರ್ ಟ್ರ್ಯಾಕಿಂಗ್ ನಿಷ್ಕ್ರಿಯಗೊಳಿಸಲಾಗಿದೆ - ಕೇವಲ ಕಂಟ್ರೋಲ್ ಬ್ರೌಸರ್ ಟಚ್ -->
        <a-entity camera look-controls="magicWindowTrackingEnabled: false" position="0 1.6 0"></a-entity>

        <!-- ================= ಇಂಟರಾಕ್ಟಿವ್ ಹಾಟ್‌ಸ್ಪಾಟ್‌ಗಳು ================= -->

        <!-- 1. ಪಟ್ಟದಕಲ್ಲು ಇತಿಹಾಸ ಮತ್ತು ರಾಜ್ಯಾಭಿಷೇಕ ತಾಣ -->
        <a-sphere id="hotspot-pat-history" position="-2 1.5 -4" radius="0.35" color="#eab308" class="hotspot"
                  data-title="ಚಾಲುಕ್ಯ ಅರಸರ ಪಟ್ಟಾಭಿಷೇಕ ಕ್ಷೇತ್ರ"
                  data-info="ಮಲಪ್ರಭಾ ನದಿಯ ದಂಡೆಯ ಮೇಲಿರುವ ಪಟ್ಟದಕಲ್ಲು ಬಾದಾಮಿ ಚಾಲುಕ್ಯರ ಸಾಂಸ್ಕೃತಿಕ ರಾಜಧಾನಿಯಾಗಿತ್ತು. ಚಾಲುಕ್ಯ ವಂಶದ ರಾಜರಿಗೆ ಇಲ್ಲಿ ಅಧಿಕೃತವಾಗಿ ಪಟ್ಟಾಭಿಷೇಕ (ರಾಜ್ಯಾಭಿಷೇಕ) ಮಾಡಲಾಗುತ್ತಿತ್ತು, ಆದ್ದರಿಂದಲೇ ಇದಕ್ಕೆ 'ಪಟ್ಟದಕಲ್ಲು' ಎಂಬ ಹೆಸರು ಬಂದಿದೆ.">
        </a-sphere>

        <!-- 2. ವಿರೂಪಾಕ್ಷ ದೇವಾಲಯ ಮತ್ತು ಲೋಕಮಹಾದೇವಿ -->
        <a-sphere id="hotspot-pat-virupaksha" position="0 1.5 -4" radius="0.35" color="#eab308" class="hotspot"
                  data-title="ಭವ್ಯ ವಿರೂಪಾಕ್ಷ ದೇವಾಲಯ"
                  data-info="ಇಲ್ಲಿನ ಸಂಕೀರ್ಣದಲ್ಲೇ ಅತ್ಯಂತ ದೊಡ್ಡ ಮತ್ತು ಸುಂದರ ಕಟ್ಟಡವೆಂದರೆ ವಿರೂಪಾಕ್ಷ ದೇವಾಲಯ. ರಾಜ ವಿಕ್ರಮಾದಿತ್ಯನ ಕಂಚಿಯ ಮೇಲಿನ ವಿಜಯದ ಸವಿನೆನಪಿಗಾಗಿ ಆತನ ರಾಣಿ ಲೋಕಮಹಾದೇವಿಯು ಕ್ರಿ.ಶ 740 ರಲ್ಲಿ ಇದನ್ನು ನಿರ್ಮಿಸಿದಳು. ಇದರ ಅದ್ಭುತ ವಾಸ್ತುಶೈಲಿಯನ್ನು ನೋಡಿಯೇ ರಾಷ್ಟ್ರಕೂಟರು ಎಲ್ಲೋರಾದ ಕೈಲಾಸನಾಥ ದೇವಾಲಯವನ್ನು ಕೆತ್ತಿದರು!">
        </a-sphere>

        <!-- 3. ದ್ರಾವಿಡ ಮತ್ತು ನಾಗರ ಶೈಲಿಗಳ ಸಮ್ಮಿಲನ -->
        <a-sphere id="hotspot-pat-styles" position="2 1.5 -4" radius="0.35" color="#eab308" class="hotspot"
                  data-title="ನಾಗರ ಮತ್ತು ದ್ರಾವಿಡ ಶೈಲಿಗಳ ಸಮ್ಮಿಲನ"
                  data-info="ಪಟ್ಟದಕಲ್ಲಿನ ವಿಶೇಷತೆಯೆಂದರೆ ಇಲ್ಲಿ ದಕ್ಷಿಣ ಭಾರತದ 'ದ್ರಾವಿಡ' ಶೈಲಿ ಮತ್ತು ಉತ್ತರ ಭಾರತದ 'ನಾಗರ' ಶೈಲಿ (ವೇಸರ ಶೈಲಿ) ಎರಡರಲ್ಲೂ ದೇವಾಲಯಗಳನ್ನು ನಿರ್ಮಿಸಲಾಗಿದೆ. ಪಾಪನಾಥ ದೇವಾಲಯವು ನಾಗರ ಶೈಲಿಗೆ ಮತ್ತು ಮಲ್ಲಿಕಾರ್ಜುನ ದೇವಾಲಯವು ದ್ರಾವಿಡ ಶೈಲಿಗೆ ಶ್ರೇಷ್ಠ ಉದಾಹರಣೆಗಳಾಗಿವೆ.">
        </a-sphere>

    </a-scene>

    <script>
        const hotspots = document.querySelectorAll('.hotspot');
        const infoPanel = document.getElementById('info-panel');

        hotspots.forEach(hotspot => {
            // ಮೌಸ್/ಟಚ್ Hover ಇಫೆಕ್ಟ್
            hotspot.addEventListener('mouseenter', function () {
                this.setAttribute('color', '#ef4444'); 
            });

            hotspot.addEventListener('mouseleave', function () {
                this.setAttribute('color', '#eab308'); 
            });

            // ಕ್ಲಿಕ್/ಟಚ್ ಇವೆಂಟ್ ಮತ್ತು ಆಡಿಯೋ ಪ್ಲೇಬ್ಯಾಕ್
            hotspot.addEventListener('click', function () {
                const title = this.getAttribute('data-title');
                const info = this.getAttribute('data-info');
                
                infoPanel.innerHTML = `<strong>${title}</strong><br>${info}`;

                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel(); 
                    
                    const speech = new SpeechSynthesisUtterance();
                    speech.text = title + ". " + info;
                    speech.lang = 'kn-IN'; 
                    speech.rate = 0.85; 
                    
                    window.speechSynthesis.speak(speech);
                }
            });
        });
    </script>
</body>
</html>
