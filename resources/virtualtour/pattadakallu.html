<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ಪಟ್ಟದಕಲ್ಲು ಚಾಲುಕ್ಯ ವಾಸ್ತುಶಿಲ್ಪ - 360° ಆಡಿಯೋ ಪ್ರವಾಸ</title>
    <!-- Pannellum 360 ಲೈಬ್ರರಿ -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.7/build/pannellum.css"/>
    <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.7/build/pannellum.js"></script>
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; }
        #panorama { width: 100vw; height: 100vh; }
        
        /* ಶೀರ್ಷಿಕೆ ಫಲಕ */
        #title-panel {
            position: absolute; top: 20px; left: 20px; color: white;
            background: rgba(15, 23, 42, 0.85); padding: 15px; border-radius: 10px;
            border-left: 5px solid #eab308; z-index: 999; pointer-events: none;
        }
        #title-panel h1 { margin: 0; font-size: 20px; color: #eab308; }
        #title-panel p { margin: 5px 0 0 0; font-size: 14px; color: #e2e8f0; }

        /* ಕೆಳಗಿನ ಸುಂದರ ಮಾಹಿತಿ ಫಲಕ (ಆಡಿಯೋ ಮತ್ತು ಪಠ್ಯಕ್ಕಾಗಿ) */
        #info-panel {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            width: 85%; max-width: 650px; background: rgba(15, 23, 42, 0.95); color: #f8fafc;
            padding: 20px; border-radius: 15px; text-align: center;
            font-size: 17px; line-height: 1.6; border: 2px solid #eab308; /* ಚಾಲುಕ್ಯರ ಭವ್ಯತೆಗೆ ಚಿನ್ನದ ಬಣ್ಣ */
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            z-index: 999; pointer-events: none;
        }

        /* 🎯 ದೊಡ್ಡದಾಗಿರುವ ಕಸ್ಟಮ್ ಹಾಟ್‌ಸ್ಪಾಟ್‌ ಬಬಲ್ಸ್ */
        .custom-hotspot {
            height: 32px;
            width: 32px;
            background: #eab308; /* ಹೊಳೆಯುವ ಚಿನ್ನದ ಬಣ್ಣ */
            border: 3px solid #ffffff;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 12px rgba(234, 179, 8, 0.8);
            transition: all 0.3s ease;
        }
        /* ಅದರ ಮೇಲೆ ಬೆರಳು ಇಟ್ಟಾಗ ಕೆಂಪು ಬಣ್ಣಕ್ಕೆ ತಿರುಗಲು */
        .custom-hotspot:hover {
            background: #ef4444; 
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.9);
            transform: scale(1.2);
        }
    </style>
</head>
<body>

<div id="title-panel">
    <h1>ಪಟ್ಟದಕಲ್ಲು: ಚಾಲುಕ್ಯರ ಭವ್ಯ ಜಗತ್ಪ್ರಸಿದ್ಧ ಶಿಲ್ಪಕಲಾ ಸಂಕೀರ್ಣ</h1>
    <p>ದೊಡ್ಡದಾಗಿರುವ ಚಿನ್ನದ ಬಣ್ಣದ ವರ್ತುಲಗಳ ಮೇಲೆ ಕ್ಲಿಕ್ ಮಾಡಿ ಆಡಿಯೋ ವಿವರ ಪಡೆಯಿರಿ</p>
</div>

<div id="panorama"></div>

<div id="info-panel">
    ಸ್ವಾಗತ! ಯುನೆಸ್ಕೋ (UNESCO) ಜಗತ್ತಿನ ಪಾರಂಪರಿಕ ತಾಣವಾಗಿರುವ ಪಟ್ಟದಕಲ್ಲಿನ ಭವ್ಯ ಇತಿಹಾಸವನ್ನು ತಿಳಿಯಲು ಆವರಣದಲ್ಲಿರುವ ದೊಡ್ಡ ಹಾಟ್‌ಸ್ಪಾಟ್‌ಗಳ ಮೇಲೆ ಕ್ಲಿಕ್ ಮಾಡಿ...
</div>

<script>
// ಕನ್ನಡ ಧ್ವನಿ ಕಾರ್ಯವಿಧಾನ
function speakKannada(title, infoText) {
    document.getElementById('info-panel').innerHTML = `<strong>${title}</strong><br>${infoText}`;
    
    if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel(); // ಹಳೆಯ ಧ್ವನಿ ನಿಲ್ಲಿಸಲು
        
        const speech = new SpeechSynthesisUtterance();
        speech.text = title + ". " + infoText;
        speech.lang = 'kn-IN'; // ಕನ್ನಡ ಭಾಷೆ
        speech.rate = 0.85; // ಸ್ಪಷ್ಟ ಧ್ವನಿ ವೇಗ
        
        window.speechSynthesis.speak(speech);
    }
}

// Pannellum ವೀಕ್ಷಕ ಸೆಟ್ಟಿಂಗ್ಸ್
pannellum.viewer('panorama', {
    "type": "equirectangular",
    "panorama": "https://raw.githubusercontent.com/chandugokarna-bit/gpt-teachers-resources/main/resources/virtual/pattadakal360.jpg",
    "autoLoad": true,
    "title": "ಪಟ್ಟದಕಲ್ಲು, ಬಾಗಲಕೋಟೆ",
    "author": "ಚಾಲುಕ್ಯ ವಾಸ್ತುಶಿಲ್ಪ ವೈಭವ",
    "hotSpots": [
        {
            "pitch": 0,
            "yaw": -35,
            "cssClass": "custom-hotspot", // ನಮ್ಮ ಕಸ್ಟಮ್ ದೊಡ್ಡ ಹಾಟ್‌ಸ್ಪಾಟ್
            "createTooltipFunc": function(hotSpotDiv) { hotSpotDiv.setAttribute("title", "ಪಟ್ಟದಕಲ್ಲು ಇತಿಹಾಸ"); },
            "clickHandlerFunc": function() {
                speakKannada(
                    "ಚಾಲುಕ್ಯ ಅರಸರ ಪಟ್ಟಾಭಿಷೇಕ ಕ್ಷೇತ್ರ", 
                    "ಮಲಪ್ರಭಾ ನದಿಯ ದಂಡೆಯ ಮೇಲಿರುವ ಪಟ್ಟದಕಲ್ಲು ಬಾದಾಮಿ ಚಾಲುಕ್ಯರ ಸಾಂಸ್ಕೃತಿಕ ರಾಜಧಾನಿಕೆಯಾಗಿತ್ತು. ಚಾಲುಕ್ಯ ವಂಶದ ರಾಜರಿಗೆ ಇಲ್ಲಿ ಅಧಿಕೃತವಾಗಿ ಪಟ್ಟಾಭಿಷೇಕ (ರಾಜ್ಯಾಭಿಷೇಕ) ಮಾಡಲಾಗುತ್ತಿತ್ತು, ಆದ್ದರಿಂದಲೇ ಇದಕ್ಕೆ 'ಪಟ್ಟದಕಲ್ಲು' ಎಂಬ ಹೆಸರು ಬಂದಿದೆ."
                );
            }
        },
        {
            "pitch": 5,
            "yaw": 15,
            "cssClass": "custom-hotspot",
            "createTooltipFunc": function(hotSpotDiv) { hotSpotDiv.setAttribute("title", "ವಿರೂಪಾಕ್ಷ ದೇವಾಲಯ"); },
            "clickHandlerFunc": function() {
                speakKannada(
                    "ಭವ್ಯ ವಿರೂಪಾಕ್ಷ ದೇವಾಲಯ", 
                    "ಇಲ್ಲಿನ ಸಂಕೀರ್ಣದಲ್ಲೇ ಅತ್ಯಂತ ದೊಡ್ಡ ಮತ್ತು ಸುಂದರ ಕಟ್ಟಡವೆಂದರೆ ವಿರೂಪಾಕ್ಷ ದೇವಾಲಯ. ರಾಜ ವಿಕ್ರಮಾದಿತ್ಯನ ಕಂಚಿಯ ಮೇಲಿನ ವಿಜಯದ ಸವಿನೆನಪಿಗಾಗಿ ಆತನ ರಾಣಿ ಲೋಕಮಹಾದೇವಿಯು ಕ್ರಿ.ಶ 740 ರಲ್ಲಿ ಇದನ್ನು ನಿರ್ಮಿಸಿದಳು. ಇದರ ಅದ್ಭುತ ವಾಸ್ತುಶೈಲಿಯನ್ನು ನೋಡಿಯೇ ರಾಷ್ಟ್ರಕೂಟರು ಎಲ್ಲೋರಾದ ಕೈಲಾಸನಾಥ ದೇವಾಲಯವನ್ನು ಕೆತ್ತಿದರು!"
                );
            }
        },
        {
            "pitch": -5,
            "yaw": 45,
            "cssClass": "custom-hotspot",
            "createTooltipFunc": function(hotSpotDiv) { hotSpotDiv.setAttribute("title", "ವಾಸ್ತುಶೈಲಿಗಳ ಸಮ್ಮಿಲನ"); },
            "clickHandlerFunc": function() {
                speakKannada(
                    "ನಾಗರ ಮತ್ತು ದ್ರಾವಿಡ ಶೈಲಿಗಳ ಸಮ್ಮಿಲನ", 
                    "ಪಟ್ಟದಕಲ್ಲಿನ ವಿಶೇಷತೆಯೆಂದರೆ ಇಲ್ಲಿ ದಕ್ಷಿಣ ಭಾರತದ 'ದ್ರಾವಿಡ' ಶೈಲಿ ಮತ್ತು ಉತ್ತರ ಭಾರತದ 'ನಾಗರ' ಶೈಲಿ ಎರಡರಲ್ಲೂ ದೇವಾಲಯಗಳನ್ನು ನಿರ್ಮಿಸಲಾಗಿದೆ. ಪಾಪನಾಥ ದೇವಾಲಯವು ನಾಗರ ಶೈಲಿಗೆ ಮತ್ತು ಮಲ್ಲಿಕಾರ್ಜುನ ದೇವಾಲಯವು ದ್ರಾವಿಡ ಶೈಲಿಗೆ ಶ್ರೇಷ್ಠ ಉದಾಹರಣೆಗಳಾಗಿದ್ದು, ಇವೆರಡರ ಮಿಶ್ರಣವನ್ನು ವೇಸರ ಶೈಲಿ ಎನ್ನಲಾಗುತ್ತದೆ."
                );
            }
        }
    ]
});
</script>

</body>
</html>
