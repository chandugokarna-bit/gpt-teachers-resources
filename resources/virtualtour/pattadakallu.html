<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ಪಟ್ಟದಕಲ್ಲು 360° ವರ್ಚುವಲ್ ಪ್ರವಾಸ</title>
    
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    
    <style>
        /* ಮಾಹಿತಿ ಪ್ರದರ್ಶಿಸುವ ಆಧುನಿಕ ಫಲಕ */
        #info-panel {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 85%;
            max-width: 650px;
            background: rgba(15, 23, 42, 0.95);
            color: #f8fafc;
            padding: 20px;
            border-radius: 15px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            font-size: 18px;
            line-height: 1.6;
            border: 2px solid #f59e0b;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            pointer-events: none;
            z-index: 999;
        }

        /* ಶೀರ್ಷಿಕೆ ಫಲಕ */
        #title-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(15, 23, 42, 0.85);
            padding: 15px;
            font-family: sans-serif;
            border-radius: 10px;
            border-left: 5px solid #f59e0b;
            z-index: 999;
        }

        #title-panel h1 {
            margin: 0;
            font-size: 22px;
            color: #f59e0b;
        }

        #title-panel p {
            margin: 5px 0 0 0;
            font-size: 14px;
            color: #cbd5e1;
        }
    </style>
</head>
<body>

    <div id="title-panel">
        <h1>ಪಟ್ಟದಕಲ್ಲು ಐತಿಹಾಸಿಕ ವರ್ಚುವಲ್ ದರ್ಶನ</h1>
        <p>ಮೌಸ್ ಬಳಸಿ 360° ತಿರುಗಿಸಿ | ಕೆಂಪು ವರ್ತುಲಗಳ (Hotspots) ಮೇಲೆ ಕ್ಲಿಕ್ ಮಾಡಿ ಮಾಹಿತಿ ಪಡೆಯಿರಿ</p>
    </div>

    <div id="info-panel">
        ಸ್ವಾಗತ! ಪಟ್ಟದಕಲ್ಲಿನ ಇತಿಹಾಸ ಮತ್ತು ದೇವಾಲಯಗಳ ಮಾಹಿತಿ ಪಡೆಯಲು ಆವರಣದಲ್ಲಿರುವ ಕೆಂಪು ಬಣ್ಣದ ಇಂಟರಾಕ್ಟಿವ್ ಪಾಯಿಂಟ್ (Hotspot) ಮೇಲೆ ಕ್ಲಿಕ್ ಮಾಡಿ...
    </div>

    <a-scene cursor="rayOrigin: mouse">
        
        <a-assets>
            <img id="pattadakal-main" src="https://raw.githubusercontent.com/chandugokarna-bit/gpt-teachers-resources/main/resources/virtual/pattadakal360.jpg" crossorigin="anonymous">
            <img id="virupaksha-scene" src="https://raw.githubusercontent.com/chandugokarna-bit/gpt-teachers-resources/main/resources/virtual/virupaksha360.jpg" crossorigin="anonymous">
            <img id="papanatha-scene" src="https://raw.githubusercontent.com/chandugokarna-bit/gpt-teachers-resources/main/resources/virtual/papanatha360.jpg" crossorigin="anonymous">
        </a-assets>

        <a-sky id="main-sky" src="#pattadakal-main" rotation="0 -90 0"></a-sky>

        <a-entity camera look-controls position="0 1.6 0"></a-entity>

        <a-sphere id="hotspot-virupaksha" position="-4 1.5 -6" radius="0.3" color="#ef4444" class="hotspot"
                  animation="property: scale; to: 1.2 1.2 1.2; dir: alternate; dur: 1000; loop: true"
                  data-title="ವಿರೂಪಾಕ್ಷ ದೇವಾಲಯ"
                  data-info="ಇದು ಪಟ್ಟದಕಲ್ಲಿನ ಅತ್ಯಂತ ಭವ್ಯವಾದ ದೇವಾಲಯವಾಗಿದೆ. ಕ್ರಿ.ಶ. 740 ರಲ್ಲಿ ವಿಕ್ರಮಾದಿತ್ಯನ ರಾಣಿ ಲೋಕಮಹಾದೇವಿಯು ಪಲ್ಲವರ ಮೇಲಿನ ವಿಜಯದ ಸವಿನೆನಪಿಗಾಗಿ ಇದನ್ನು ನಿರ್ಮಿಸಿದಳು. ಇದು ದ್ರಾವಿಡ ಶೈಲಿಯಲ್ಲಿದೆ. (ಗಮನಿಸಿ: ಈ ದೇವಾಲಯದ ಹತ್ತಿರ ಹೋಗಲು ಈ ಪಾಯಿಂಟ್ ಮೇಲೆ ಮತ್ತೊಮ್ಮೆ ಕ್ಲಿಕ್ ಮಾಡಿ)"
                  data-target="virupaksha">
        </a-sphere>

        <a-sphere id="hotspot-papanatha" position="4 1.2 -5" radius="0.3" color="#ef4444" class="hotspot"
                  animation="property: scale; to: 1.2 1.2 1.2; dir: alternate; dur: 1000; loop: true"
                  data-title="ಪಾಪನಾಥ ದೇವಾಲಯ"
                  data-info="ಇದು ನಗರ ಮತ್ತು ದ್ರಾವಿಡ ಶೈಲಿಗಳೆರಡರ ಮಿಶ್ರಣವನ್ನು ಹೊಂದಿರುವ ವಿಶಿಷ್ಟ ದೇವಾಲಯವಾಗಿದೆ. ಇದರ ಗೋಡೆಗಳ ಮೇಲೆ ರಾಮಾಯಣದ ಪ್ರಸಂಗಗಳನ್ನು ಸುಂದರವಾಗಿ ಕೆತ್ತಲಾಗಿದೆ. (ಗಮನಿಸಿ: ಈ ದೇವಾಲಯದ ಹತ್ತಿರ ಹೋಗಲು ಈ ಪಾಯಿಂಟ್ ಮೇಲೆ ಮತ್ತೊಮ್ಮೆ ಕ್ಲಿಕ್ ಮಾಡಿ)"
                  data-target="papanatha">
        </a-sphere>

        <a-sphere id="hotspot-back" position="0 1.5 4" radius="0.3" color="#3b82f6" class="hotspot" visible="false"
                  animation="property: scale; to: 1.2 1.2 1.2; dir: alternate; dur: 1000; loop: true"
                  data-title="ಮುಖ್ಯ ಆವರಣಕ್ಕೆ ಹಿಂತಿರುಗಿ"
                  data-info="ಪಟ್ಟದಕಲ್ಲಿನ ಮುಖ್ಯ ಆವರಣದ ಕೇಂದ್ರ ಭಾಗಕ್ಕೆ ಮರಳಲು ಇಲ್ಲಿ ಕ್ಲಿಕ್ ಮಾಡಿ."
                  data-target="main">
        </a-sphere>

    </a-scene>

    <script>
        const hotspots = document.querySelectorAll('.hotspot');
        const infoPanel = document.getElementById('info-panel');
        const sky = document.getElementById('main-sky');
        
        // ಯಾವ ಸೀನ್‌ನಲ್ಲಿದ್ದೇವೆ ಎಂದು ತಿಳಿಯಲು (ಪ್ರಾರಂಭದಲ್ಲಿ main ಆವರಣ)
        let currentScene = 'main'; 

        hotspots.forEach(hotspot => {
            // Hover Effect (ಮೌಸ್ ಮೇಲೆ ಬಂದಾಗ ಬಣ್ಣ ಬದಲಾವಣೆ)
            hotspot.addEventListener('mouseenter', function () {
                this.setAttribute('color', '#f59e0b');
            });

            hotspot.addEventListener('mouseleave', function () {
                if(this.id === 'hotspot-back') {
                    this.setAttribute('color', '#3b82f6');
                } else {
                    this.setAttribute('color', '#ef4444');
                }
            });

            // ಕ್ಲಿಕ್ ಮಾಡಿದಾಗ ಮಾಹಿತಿ ತೋರಿಸುವುದು ಮತ್ತು ಸೀನ್ ಬದಲಾಯಿಸುವುದು
            hotspot.addEventListener('click', function () {
                const title = this.getAttribute('data-title');
                const info = this.getAttribute('data-info');
                const target = this.getAttribute('data-target');
                
                infoPanel.innerHTML = `<strong>${title}</strong><br>${info}`;

                // ಒಂದೇ ಪಾಯಿಂಟ್ ಮೇಲೆ ಎರಡನೇ ಬಾರಿ ಕ್ಲಿಕ್ ಮಾಡಿದಾಗ ಅಥವಾ ಸೀನ್ ಬದಲಾಯಿಸಲು ಬಯಸಿದಾಗ
                if (currentScene === 'main' && target !== 'main') {
                    if (target === 'virupaksha') {
                        sky.setAttribute('src', '#virupaksha-scene');
                        document.getElementById('hotspot-virupaksha').setAttribute('visible', 'false');
                        document.getElementById('hotspot-papanatha').setAttribute('visible', 'false');
                        document.getElementById('hotspot-back').setAttribute('visible', 'true');
                        currentScene = 'virupaksha';
                        infoPanel.innerHTML = `<strong>ವಿರೂಪಾಕ್ಷ ದೇವಾಲಯದ ಆವರಣ</strong><br>ನೀವೀಗ ವಿರೂಪಾಕ್ಷ ದೇವಾಲಯದ ಅತ್ಯಂತ ಹತ್ತಿರದಲ್ಲಿದ್ದೀರಿ. ಹಿಂತಿರುಗಲು ನಿಮ್ಮ ಹಿಂಭಾಗದಲ್ಲಿರುವ ನೀಲಿ ಪಾಯಿಂಟ್ ಕ್ಲಿಕ್ ಮಾಡಿ.`;
                    } else if (target === 'papanatha') {
                        sky.setAttribute('src', '#papanatha-scene');
                        document.getElementById('hotspot-virupaksha').setAttribute('visible', 'false');
                        document.getElementById('hotspot-papanatha').setAttribute('visible', 'false');
                        document.getElementById('hotspot-back').setAttribute('visible', 'true');
                        currentScene = 'papanatha';
                        infoPanel.innerHTML = `<strong>ಪಾಪನಾಥ ದೇವಾಲಯದ ಆವರಣ</strong><br>ನೀವೀಗ ಪಾಪನಾಥ ದೇವಾಲಯದ ಹತ್ತಿರದಲ್ಲಿದ್ದೀರಿ. ಹಿಂತಿರುಗಲು ನಿಮ್ಮ ಹಿಂಭಾಗದಲ್ಲಿರುವ ನೀಲಿ ಪಾಯಿಂಟ್ ಕ್ಲಿಕ್ ಮಾಡಿ.`;
                    }
                } 
                // ವಾಪಸ್ ಮುಖ್ಯ ಆವರಣಕ್ಕೆ ಬರಲು ಕ್ಲಿಕ್ ಮಾಡಿದಾಗ
                else if (target === 'main' && currentScene !== 'main') {
                    sky.setAttribute('src', '#pattadakal-main');
                    document.getElementById('hotspot-virupaksha').setAttribute('visible', 'true');
                    document.getElementById('hotspot-papanatha').setAttribute('visible', 'true');
                    document.getElementById('hotspot-back').setAttribute('visible', 'false');
                    currentScene = 'main';
                    infoPanel.innerHTML = `ಪಟ್ಟದಕಲ್ಲಿನ ಮುಖ್ಯ ಆವರಣಕ್ಕೆ ಮರಳಿದ್ದೀರಿ. ಬೇರೆ ದೇವಾಲಯದ ಮಾಹಿತಿ ಪಡೆಯಲು ಕ್ಲಿಕ್ ಮಾಡಿ...`;
                }
            });
        });
    </script>
</body>
</html>
