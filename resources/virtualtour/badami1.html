<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ದಕ್ಷಿಣ ಭಾರತದ ರಾಜಮನೆತನಗಳು - 3D ನಿಯೋನ್ ಗ್ಯಾಲರಿ</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050505;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        /* ನಿಯೋನ್ ಶೈಲಿಯ ಮಾಹಿತಿ ಪ್ರದರ್ಶಿಸುವ ವಿಂಡೋ */
        #info-overlay {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(10, 10, 15, 0.85);
            color: #fff;
            padding: 15px 35px;
            border-radius: 15px;
            font-size: 18px;
            text-align: center;
            pointer-events: none;
            border: 2px solid #00ffff;
            box-shadow: 0 0 20px #00ffff, inset 0 0 10px #00ffff;
            transition: all 0.3s ease;
            max-width: 80%;
            z-index: 10;
            backdrop-filter: blur(5px);
        }
        /* ನಿಯೋನ್ ಸೂಚನೆಗಳು */
        #instructions {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #ff00ff;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 13px;
            pointer-events: none;
            z-index: 10;
            border: 1px solid #ff00ff;
            box-shadow: 0 0 10px #ff00ff;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
    <!-- Three.js ಮತ್ತು OrbitControls ಲೈಬ್ರರಿಗಳು -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="instructions">🔮 ಮೌಸ್ ಬಳಸಿ ಕ್ಲಿಕ್ ಮಾಡಿ ತಿರುಗಿಸಿ (360° View) | ಜೂಮ್ ಮಾಡಲು ಸ್ಕ್ರಾಲ್ ಮಾಡಿ</div>
    <div id="info-overlay">ದಕ್ಷಿಣ ಭಾರತದ ರಾಜಮನೆತನಗಳ 3D ಸೈಬರ್ ಮ್ಯೂಸಿಯಂಗೆ ಸುಸ್ವಾಗತ! ಬೋರ್ಡ್ ಕ್ಲಿಕ್ ಮಾಡಿ ಇತಿಹಾಸ ತಿಳಿಯಿರಿ.</div>
    <div id="canvas-container"></div>

    <script>
        // 1. ಸೀನ್, ಕ್ಯಾಮೆರಾ ಮತ್ತು ರೆಂಡರರ್ ಸೆಟಪ್
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050508);
        scene.fog = new THREE.FogExp2(0x050508, 0.025); // ನಿಯೋನ್ ಎಫೆಕ್ಟ್ ಹೈಲೈಟ್ ಮಾಡಲು ದಟ್ಟವಾದ ಫಾಗ್

        const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 5); // ಕ್ಯಾಮೆರಾ ರೂಮ್ ಮಧ್ಯದಲ್ಲಿದೆ

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        container.appendChild(renderer.domElement);

        // ಮೌಸ್ ಮತ್ತು ಟಚ್ ಕಂಟ್ರೋಲ್ಸ್
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxDistance = 10; 
        controls.minDistance = 1;

        // ಇಮೇಜ್ ಲೋಡರ್
        const textureLoader = new THREE.TextureLoader();

        // 2. ಸೈಬರ್ ಲೈಟಿಂಗ್ ವ್ಯವಸ್ಥೆ (Cyberpunk Neon Lighting)
        const ambientLight = new THREE.AmbientLight(0x111122, 0.5);
        scene.add(ambientLight);

        // ರೂಮ್ ಮಧ್ಯಭಾಗದಲ್ಲಿ ಒಂದು ರಂಗುರಂಗಿನ ಗ್ಲೋ ಲೈಟ್
        const centerLight = new THREE.PointLight(0x00ffff, 0.8, 15);
        centerLight.position.set(0, 2, 0);
        scene.add(centerLight);

        // 3. 3D ಗ್ರಿಡ್ ರೂಮ್ ನಿರ್ಮಾಣ (Sci-Fi Grid Room)
        const roomWidth = 16, roomHeight = 8, roomDepth = 16;

        // ನೆಲ (Floor) - ನಿಯೋನ್ ಗ್ರಿಡ್ ವಿನ್ಯಾಸ
        const floorGeo = new THREE.PlaneGeometry(roomWidth, roomDepth);
        const floorMat = new THREE.MeshStandardMaterial({ 
            color: 0x111115, 
            roughness: 0.1,
            metalness: 0.8
        });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = -roomHeight / 2;
        scene.add(floor);

        // ನೆಲಕ್ಕೆ ಗ್ರಿಡ್ ಲೈನ್ಸ್ (Neon Grid Lines)
        const gridHelper = new THREE.GridHelper(16, 16, 0x00ffff, 0x222233);
        gridHelper.position.y = -roomHeight / 2 + 0.01;
        scene.add(gridHelper);

        // 4. ಮುಂಭಾಗದ ಗ್ಲೋಯಿಂಗ್ ಬ್ಯಾನರ್ (Front Neon Banner)
        const bannerCanvas = document.createElement('canvas');
        bannerCanvas.width = 1024;
        bannerCanvas.height = 256;
        const ctx = bannerCanvas.getContext('2d');
        
        // ಕಪ್ಪು ಹಿನ್ನೆಲೆ ಮತ್ತು ನಿಯೋನ್ ಗ್ಲೋ ಟೆಕ್ಸ್ಟ್
        ctx.fillStyle = '#0a0a10';
        ctx.fillRect(0, 0, 1024, 256);
        ctx.strokeStyle = '#ff00ff';
        ctx.lineWidth = 10;
        ctx.strokeRect(20, 20, 984, 216);
        
        ctx.shadowColor = '#ff00ff';
        ctx.shadowBlur = 15;
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 58px "Segoe UI", Tahoma';
        ctx.textAlign = 'center';
        ctx.fillText('ದಕ್ಷಿಣ ಭಾರತದ ರಾಜವಂಶಗಳು', 512, 145);

        const bannerTex = new THREE.CanvasTexture(bannerCanvas);
        const bannerGeo = new THREE.PlaneGeometry(8, 2);
        const bannerMat = new THREE.MeshBasicMaterial({ map: bannerTex });
        const mainBanner = new THREE.Mesh(bannerGeo, bannerMat);
        mainBanner.position.set(0, 1.5, -roomDepth / 2 + 0.05);
        scene.add(mainBanner);

        // ಬ್ಯಾನರ್‌ಗೆ ನಿಯೋನ್ ಬ್ಯಾಕ್‌ಲೈಟ್ ಎಫೆಕ್ಟ್
        const bannerLight = new THREE.PointLight(0xff00ff, 1.5, 8);
        bannerLight.position.set(0, 1.5, -roomDepth / 2 + 0.1);
        scene.add(bannerLight);


        // 5. ನಿಯೋನ್ ಫೋಟೋ ಫ್ರೇಮ್‌ಗಳನ್ನು ರಚಿಸುವ ಫಂಕ್ಷನ್
        const paintings = [];
        const raycastObjects = [];

        function createPainting(width, height, x, y, z, rotationY, title, info, imageSource, neonColor) {
            // ಫ್ರೇಮ್ ಮೆಟೀರಿಯಲ್
            let paintingMat = new THREE.MeshStandardMaterial({ color: 0x222222 });

            if (typeof imageSource === 'string' && imageSource.startsWith('http')) {
                // ಗಿಟ್‌ಹಬ್‌ನಿಂದ ಚಿತ್ರಗಳನ್ನು ಲೋಡ್ ಮಾಡುವುದು
                const imageTexture = textureLoader.load(imageSource);
                paintingMat = new THREE.MeshStandardMaterial({ 
                    map: imageTexture, 
                    side: THREE.DoubleSide,
                    roughness: 0.2
                });
            }

            const paintingGeo = new THREE.PlaneGeometry(width, height);
            const painting = new THREE.Mesh(paintingGeo, paintingMat);
            painting.position.set(x, y, z);
            painting.rotation.y = rotationY;
            
            // ನಿಯೋನ್ ಗ್ಲೋಯಿಂಗ್ ಬಾರ್ಡರ್ (Glowing Border)
            const frameGeo = new THREE.BoxGeometry(width + 0.15, height + 0.15, 0.02);
            const frameMat = new THREE.MeshBasicMaterial({ color: neonColor }); // ನಿಯೋನ್ ಬಣ್ಣ
            const frame = new THREE.Mesh(frameGeo, frameMat);
            frame.position.set(x, y, z - 0.01);
            frame.rotation.y = rotationY;
            scene.add(frame);

            // ಚಿತ್ರದ ದ್ರವ್ಯದ ಡೇಟಾ ಶೇಖರಣೆ
            painting.userData = { title: title, info: info };
            
            scene.add(painting);
            paintings.push(painting);
            raycastObjects.push(painting);

            // ಪ್ರತಿ ಚಿತ್ರದ ಕೆಳಗೆ ಒಂದು ಸಣ್ಣ ನಿಯೋನ್ ಸ್ಪಾಟ್‌ಲೈಟ್
            const light = new THREE.PointLight(neonColor, 1.2, 5);
            light.position.set(x, y - height/2 - 0.2, z);
            scene.add(light);
        }

        // --- ನಿಮ್ಮ ಗಿಟ್‌ಹಬ್ ಲಿಂಕ್‌ಗಳೊಂದಿಗೆ ಫೋಟೋ ಜೋಡಣೆ ---
        
        // 1. ನಿಮ್ಮ ನಿಯೋಜಿತ ಗಿಟ್‌ಹಬ್ ಲಿಂಕ್ ಇಲ್ಲಿದೆ (ಬಾದಾಮಿ ಚಾಲುಕ್ಯರು)
        const badamiLink =("images/badami.jpeg";)

        // ಎಡಭಾಗದ ಗೋಡೆ (Left Wall) - ನಿಯೋನ್ ಸಯಾನ್ (0x00ffff) ಥೀಮ್
        createPainting(2, 2.5, -roomWidth/2 + 0.05, 0, -4, Math.PI/2, "ಬಾದಾಮಿ ಛಾಲುಕ್ಯರು", "ಕಲೆ ಮತ್ತು ವಾಸ್ತುಶಿಲ್ಪಕ್ಕೆ ಹೆಸರುವಾಸಿ. ಬಾದಾಮಿ, ಐಹೊಳೆ, ಪಟ್ಟದಕಲ್ಲು ಇವರ ಪ್ರಮುಖ ಕೊಡುಗೆಗಳು.", "https://raw.githubusercontent.com/chandugokarna-bit/gpt-teachers-resources/main/images/badami.jpeg");
        createPainting(2, 2.5, -roomWidth/2 + 0.05, 0, -1.5, Math.PI/2, "ರಾಷ್ಟ್ರಕೂಟರು", "ಎಲ್ಲೋರಾದ ಕೈಲಾಸನಾಥ ದೇವಾಲಯ ಮತ್ತು ಎಲಿಫೆಂಟಾ ಗುಹೆಗಳನ್ನು ನಿರ್ಮಿಸಿದ ಮಹಾನ್ ಸಾಮ್ರಾಜ್ಯ.", 0x222222, 0x00ffff);
        createPainting(2, 2.5, -roomWidth/2 + 0.05, 0, 1.5, Math.PI/2, "ಕದಂಬರು", "ಕನ್ನಡದ ಮೊದಲ ರಾಜವಂಶ. ಮಯೂರವರ್ಮ ಇದರ ಸ್ಥಾಪಕ, ಬನವಾಸಿ ಇವರ ರಾಜಧಾನಿ.", 0x222222, 0x00ffff);
        createPainting(2, 2.5, -roomWidth/2 + 0.05, 0, 4, Math.PI/2, "ಪಶ್ಚಿಮ ಗಂಗರು", "ಶ್ರವಣಬೆಳಗೊಳದ ಗೊಮ್ಮಟೇಶ್ವರ ಏಕಶಿಲಾ ವಿಗ್ರಹವನ್ನು ಕೆತ್ತಿಸಿದ ಕೀರ್ತಿ ಇವರಿಗೆ ಸಲ್ಲುತ್ತದೆ.", 0x222222, 0x00ffff);

        // ಹಿಂಭಾಗದ ಗೋಡೆ (Back Wall) - ನಿಯೋನ್ ಮಜೆಂಟಾ (0xff00ff) ಥೀಮ್
        createPainting(2, 2.5, -5, 0, roomDepth/2 - 0.05, 0, "ವಿಜಯನಗರ ಸಾಮ್ರಾಜ್ಯ", "ಹಂಪಿ ರಾಜಧಾನಿ. ಕೃಷ್ಣದೇವರಾಯನ ಆಡಳಿತದಲ್ಲಿ ದಕ್ಷಿಣ ಭಾರತದ ಭವ್ಯ ಇತಿಹಾಸ ಬರೆದ ಸಾಮ್ರಾಜ್ಯ.", 0x222222, 0xff00ff);
        createPainting(2, 2.5, -2.5, 0, roomDepth/2 - 0.05, 0, "ಚೋಳರು", "ಬೃಹದೇಶ್ವರ ದೇವಾಲಯದ ನಿರ್ಮಾತೃಗಳು. ಪ್ರಬಲ ನೌಕಾಪಡೆ ಹೊಂದಿದ್ದ ತಮಿಳುನಾಡಿನ ಪ್ರಸಿದ್ಧ ರಾಜರು.", 0x222222, 0xff00ff);
        createPainting(2, 2.5, 0, 0, roomDepth/2 - 0.05, 0, "ಹೊಯ್ಸಳರು", "ಬೇಲೂರು, ಹಳೇಬೀಡು ಮತ್ತು ಸೋಮನಾಥಪುರದ ನಕ್ಷತ್ರಾಕಾರದ ಅದ್ಭುತ ಶಿಲ್ಪಕಲೆಯ ರಾಜರು.", 0x222222, 0xff00ff);
        createPainting(2, 2.5, 2.5, 0, roomDepth/2 - 0.05, 0, "ಪಲ್ಲವರು", "ಮಹಾಬಲಿಪುರಂನ ರಥ ದೇವಾಲಯಗಳು ಇವರ ಕೊಡುಗೆ. ಕಂಚಿ ಇವರ ಮುಖ್ಯ ಕೇಂದ್ರವಾಗಿತ್ತು.", 0x222222, 0xff00ff);
        createPainting(2, 2.5, 5, 0, roomDepth/2 - 0.05, 0, "ಪಾಂಡ್ಯರು", "ಮಧುರೈ ಮೀನಾಕ್ಷಿ ದೇವಾಲಯದ ಅಭಿವೃದ್ಧಿ ಮತ್ತು ಮುತ್ತು ವ್ಯಾಪಾರಕ್ಕೆ ಜಗತ್ಪ್ರಸಿದ್ಧರಾಗಿದ್ದರು.", 0x222222, 0xff00ff);

        // ಬಲಭಾಗದ ಗೋಡೆ (Right Wall) - ನಿಯೋನ್ ಹಳದಿ (0xffff00) ಥೀಮ್
        createPainting(2, 2.5, roomWidth/2 - 0.05, 0, -4, -Math.PI/2, "ಶಾತವಾಹನರು", "ದಕ್ಷಿಣ ಭಾರತದ ಪ್ರಾಚೀನ ರಾಜವಂಶ. ಇವರ ಕಾಲದಲ್ಲಿ ಅಮರಾವತಿ ಕಲೆ ಪ್ರಸಿದ್ಧಿಯಾಯಿತು.", 0x222222, 0xffff00);
        createPainting(2, 2.5, roomWidth/2 - 0.05, 0, -1.5, -Math.PI/2, "ಕಾಕತೀಯರು", "ವರಂಗಲ್ ರಾಜಧಾನಿ. ರಾಣಿ ರುದ್ರಮದೇವಿ ಆಳಿದ ಪ್ರಸಿದ್ಧ ತೆಲಂಗಾಣದ ರಾಜಮನೆತನ.", 0x222222, 0xffff00);
        createPainting(2, 2.5, roomWidth/2 - 0.05, 0, 1.5, -Math.PI/2, "ಚೇರರು", "ಕೇರಳ ಕರಾವಳಿಯ ಪ್ರಮುಖ ರಾಜರು. ಸಾಂಬಾರ ಪದಾರ್ಥಗಳ ವಿದೇಶಿ ವ್ಯಾಪಾರಕ್ಕೆ ಹೆಸರಾಗಿದ್ದರು.", 0x222222, 0xffff00);
        createPainting(2, 2.5, roomWidth/2 - 0.05, 0, 4, -Math.PI/2, "ಬಹುಮನಿ ಸುಲ್ತಾನರು", "ಗುಲ್ಬರ್ಗಾ ಮತ್ತು ಬಿದರ್ ಕೇಂದ್ರಿತ ಸಾಮ್ರಾಜ್ಯ. ಇಂಡೋ-ಇಸ್ಲಾಮಿಕ್ ಶೈಲಿಯ ವಾಸ್ತುಶಿಲ್ಪದ ಕೊಡುಗೆ.", 0x222222, 0xffff00);


        // 6. ಕ್ಲಿಕ್ ಇಂಟರಾಕ್ಷನ್ ಸೆಟಪ್ (Raycasting)
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        const infoOverlay = document.getElementById('info-overlay');

        window.addEventListener('click', (event) => {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(raycastObjects);

            if (intersects.length > 0) {
                const clickedObj = intersects[0].object;
                infoOverlay.innerHTML = `🌟 <strong>${clickedObj.userData.title}</strong>: ${clickedObj.userData.info}`;
                
                // ಕ್ಯಾಮೆರಾವನ್ನು ಚಿತ್ರಕ್ಕೆ ಸ್ಮೂತ್ ಆಗಿ ಫೋಕಸ್ ಮಾಡುವುದು
                controls.target.copy(clickedObj.position);
            }
        });

        // 7. ವಿಂಡೋ ರಿಸೈಜ್ ಹ್ಯಾಂಡ್ಲರ್
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 8. ಅನಿಮೇಷನ್ ಲೂಪ್
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
