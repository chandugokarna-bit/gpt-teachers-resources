<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>ಬೇಲೂರು ಚೆನ್ನಕೇಶವ ದೇವಾಲಯ 360° ಆಡಿಯೋ ಪ್ರವಾಸ</title>
    <!-- A-Frame VR ಲೈಬ್ರರಿ -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <style>
        /* ಮಾಹಿತಿ ಫಲಕ */
        #info-panel {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            width: 85%; max-width: 650px; background: rgba(24, 24, 27, 0.95); color: #f4f4f5;
            padding: 20px; border-radius: 15px; font-family: sans-serif; text-align: center;
            font-size: 18px; line-height: 1.6; border: 2px solid #eab308; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            z-index: 999; pointer-events: none;
        }
        /* ಶೀರ್ಷಿಕೆ ಫಲಕ */
        #title-panel {
            position: absolute; top: 20px; left: 20px; color: white;
            background: rgba(24, 24, 27, 0.85); padding: 15px; border-radius: 10px;
            border-left: 5px solid #eab308; z-index: 999;
        }
        #title-panel h1 { margin: 0; font-size: 22px; color: #eab308; }
    </style>
</head>
<body>

    <div id="title-panel">
        <h1>ಬೇಲೂರು: ಭವ್ಯ ಶ್ರೀ ಚೆನ್ನಕೇಶವ ದೇವಾಲಯ ವರ್ಚುವಲ್ ದರ್ಶನ</h1>
        <p>ಚಿನ್ನದ ಬಣ್ಣದ ವರ್ತುಲಗಳ ಮೇಲೆ ನೇರವಾಗಿ ಕ್ಲಿಕ್ ಮಾಡಿ ಆಡಿಯೋ ಮಾಹಿತಿ ಪಡೆಯಿರಿ</p>
    </div>

    <div id="info-panel">
        ಸ್ವಾಗತ! ಯುನೆಸ್ಕೋ (UNESCO) ವಿಶ್ವ ಪಾರಂಪರಿಕ ತಾಣವಾಗಿರುವ ಬೇಲೂರಿನ ಜಗತ್ಪ್ರಸಿದ್ಧ ಶಿಲ್ಪಕಲೆಯನ್ನು ತಿಳಿಯಲು ಆವರಣದಲ್ಲಿರುವ ಚಿನ್ನದ ಬಣ್ಣದ ಹಾಟ್‌ಸ್ಪಾಟ್‌ಗಳ ಮೇಲೆ ಕ್ಲಿಕ್ ಮಾಡಿ...
    </div>

    <!-- VR ಬಟನ್ ಸಂಪೂರ್ಣವಾಗಿ ತೆಗೆದುಹಾಕಲಾಗಿದೆ -->
    <a-scene vr-mode-ui="enabled: false" cursor="rayOrigin: mouse">
        <a-assets>
            <img id="belur-scene" src="https://raw.githubusercontent.com/chandugokarna-bit/gpt-teachers-resources/main/resources/virtual/belur360.jpg" crossorigin="anonymous">
        </a-assets>

        <!-- ಹಿನ್ನೆಲೆ 360 ಚಿತ್ರ -->
        <a-sky src="#belur-scene"></a-sky>

        <!-- ಫೋನ್ ಮೊಬೈಲ್ ಸೆನ್ಸರ್ ಟ್ರ್ಯಾಕಿಂಗ್ ನಿಷ್ಕ್ರಿಯಗೊಳಿಸಲಾಗಿದೆ - ಕೇವಲ ಕಂಟ್ರೋಲ್ ಬ್ರೌಸರ್ ಟಚ್ -->
        <a-entity camera look-controls="magicWindowTrackingEnabled: false" position="0 1.6 0"></a-entity>

        <!-- ================= ಇಂಟರಾಕ್ಟಿವ್ ಹಾಟ್‌ಸ್ಪಾಟ್‌ಗಳು ================= -->

        <!-- 1. ಚೆನ್ನಕೇಶವ ದೇವಾಲಯ ಮತ್ತು ವಿಷ್ಣುವರ್ಧನ -->
        <a-sphere id="hotspot-belur-history" position="-2 1.5 -4" radius="0.35" color="#eab308" class="hotspot"
                  data-title="ಹೊಯ್ಸಳರ ಹೆಮ್ಮೆಯ ಬೇಲೂರು ಕ್ಷೇತ್ರ"
                  data-info="ಯಗಚಿ ನದಿಯ ದಂಡೆಯ ಮೇಲಿರುವ ಬೇಲೂರನ್ನು ಹಿಂದೆ 'ವೇಲಾಪುರಿ' ಎಂದು ಕರೆಯಲಾಗುತ್ತಿತ್ತು. ಹೊಯ್ಸಳ ಸಾಮ್ರಾಜ್ಯದ ಪ್ರಸಿದ್ಧ ದೊರೆ ವಿಷ್ಣುವರ್ಧನನು ಚೋಳರ ಮೇಲಿನ ವಿಜಯದ ಸವಿನೆನಪಿಗಾಗಿ ಕ್ರಿ.ಶ 1117 ರಲ್ಲಿ ಈ ಭವ್ಯ ಚೆನ್ನಕೇಶವ (ಸುಂದರ ವಿಷ್ಣು) ದೇವಾಲಯವನ್ನು ನಿರ್ಮಿಸಿದನು. ಇದರ ನಿರ್ಮಾಣಕ್ಕೆ ಬರೋಬ್ಬರಿ 103 ವರ್ಷಗಳು ಬೇಕಾದವು!">
        </a-sphere>

        <!-- 2. ಜಗತ್ಪ್ರಸಿದ್ಧ ಶಿಲಾಬಾಲಿಕೆಯರು / ಮದನಿಕೆಯರು -->
        <a-sphere id="hotspot-belur-madanikaru" position="0 1.5 -4" radius="0.35" color="#eab308" class="hotspot"
                  data-title="ದರ್ಪಣ ಸುಂದರಿ ಮತ್ತು ಶಿಲಾಬಾಲಿಕೆಯರು"
                  data-info="ದೇವಾಲಯದ ಸೂರು ಮತ್ತು ಕಂಬಗಳ ನಡುವೆ ಇರುವ 'ಮದನಿಕೆಯರ' (ಶಿಲಾಬಾಲಿಕೆಯರು) ಕೆತ್ತನೆಗಳು ಜಗತ್ಪ್ರಸಿದ್ಧವಾಗಿವೆ. ಕನ್ನಡಿ ನೋಡುತ್ತಿರುವ ದರ್ಪಣ ಸುಂದರಿ, ನಟನಾ ಸುಂದರಿ, ಶುಕಭಾಷಿಣಿ ಸೇರಿದಂತೆ ಇಲ್ಲಿರುವ 42 ಮದನಿಕೆಯರ ವಿಗ್ರಹಗಳು ಹೊಯ್ಸಳರ ಅತ್ಯುನ್ನತ ಕಲಾ ಕೌಶಲ್ಯಕ್ಕೆ ಮತ್ತು ಸೂಕ್ಷ್ಮ ಕೆತ್ತನೆಗೆ ಜಗತ್ತಿನಲ್ಲೇ ಶ್ರೇಷ್ಠ ಉದಾಹರಣೆಯಾಗಿದೆ.">
        </a-sphere>

        <!-- 3. ಗುರುತ್ವಾಕರ್ಷಣೆ ದೀಪಸ್ತಂಭ / ಧ್ವಜಸ್ತಂಭ -->
        <a-sphere id="hotspot-belur-pillar" position="2 1.5 -4" radius="0.35" color="#eab308" class="hotspot"
                  data-title="ಆಧಾರವಿಲ್ಲದೆ ನಿಂತಿರುವ ವಿಜಯ ಸ್ತಂಭ"
                  data-info="ದೇವಾಲಯದ ಆವರಣದಲ್ಲಿ ಸುಮಾರು 42 ಅಡಿ ಎತ್ತರದ ಬೃಹತ್ ಕಲ್ಲಿನ ದೀಪಸ್ತಂಭವಿದೆ (Gravity Pillar). ವಿಶೇಷವೆಂದರೆ, ಈ ಸ್ತಂಭಕ್ಕೆ ನೆಲದಲ್ಲಿ ಯಾವುದೇ ಆಳವಾದ ತಳಪಾಯದ ಆಧಾರವಿಲ್ಲ! ಇದು ಕೇವಲ ತನ್ನ ಸ್ವಂತ ಗುರುತ್ವಾಕರ್ಷಣೆಯ ತೂಕದ ಬಲದಿಂದ ನೇರವಾಗಿ ನಿಂತಿದ್ದು, ಹೊಯ್ಸಳ ಇಂಜಿನಿಯರಿಂಗ್ ತಂತ್ರಜ್ಞಾನಕ್ಕೆ ಸಾಕ್ಷಿಯಾಗಿದೆ.">
        </a-sphere>

    </a-scene>

    <script>
        const hotspots = document.querySelectorAll('.hotspot');
        const infoPanel = document.getElementById('info-panel');

        hotspots.forEach(hotspot => {
            // ಮೌಸ್/ಟಚ್ Hover ಇಫೆಕ್ಟ್
            hotspot.addEventListener('mouseenter', function () {
                this.setAttribute('color', '#ef4444'); 
            });

            hotspot.addEventListener('mouseleave', function () {
                this.setAttribute('color', '#eab308'); 
            });

            // ಕ್ಲಿಕ್/ಟಚ್ ಇವೆಂಟ್ ಮತ್ತು ಆಡಿಯೋ ಪ್ಲೇಬ್ಯಾಕ್
            hotspot.addEventListener('click', function () {
                const title = this.getAttribute('data-title');
                const info = this.getAttribute('data-info');
                
                infoPanel.innerHTML = `<strong>${title}</strong><br>${info}`;

                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel(); 
                    
                    const speech = new SpeechSynthesisUtterance();
                    speech.text = title + ". " + info;
                    speech.lang = 'kn-IN'; 
                    speech.rate = 0.85; 
                    
                    window.speechSynthesis.speak(speech);
                }
            });
        });
    </script>
</body>
</html>
