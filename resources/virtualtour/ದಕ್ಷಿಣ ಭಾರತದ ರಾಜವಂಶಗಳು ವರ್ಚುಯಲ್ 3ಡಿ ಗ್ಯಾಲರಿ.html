<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D ವರ್ಚುವಲ್ ಗ್ಯಾಲರಿ - ಫುಲ್ ಸ್ಕ್ರೀನ್ ಹೈಲೈಟ್</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #030306; font-family: 'Segoe UI', sans-serif; color: #fff; }
        #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
        
        /* UI ಲೇಯರ್ ವಿನ್ಯಾಸ */
        .ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 25px; }
        .interactive { pointer-events: auto; }
        header { background: rgba(5, 5, 8, 0.7); backdrop-filter: blur(12px); padding: 15px 35px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.08); max-width: 500px; }
        h1 { font-size: 22px; color: #ffaa00; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px; }
        .subtitle { font-size: 13px; color: #bbb; }
        footer { display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; }
        .nav-btn { background: linear-gradient(135deg, #ffaa00, #ff5500); border: none; color: white; padding: 10px 22px; border-radius: 20px; cursor: pointer; font-weight: bold; transition: 0.3s; box-shadow: 0 4px 15px rgba(255, 85, 0, 0.3); }
        .nav-btn:hover { transform: scale(1.05); }

        /* 🎯 ನಿಮ್ಮ ಐಡಿಯಾ: ಫೋಟೋ ಕ್ಲಿಕ್ ಮಾಡಿದಾಗ ಕೆಳಭಾಗದಲ್ಲಿ ಮಾತ್ರ ಮೂಡುವ ಅತ್ಯಂತ ಸುಂದರ ಸಿನಿಮಾಟಿಕ್ ವಿವರಣೆ ಪಟ್ಟಿ */
        #cinema-info-bar {
            position: fixed;
            bottom: -150px; /* ಆರಂಭದಲ್ಲಿ ಅಡಗಿರುತ್ತದೆ */
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 900px;
            background: linear-gradient(180deg, rgba(10, 15, 30, 0.85) 0%, rgba(5, 5, 10, 0.98) 100%);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1.5px solid #00ffcc;
            border-bottom: none;
            border-radius: 20px 20px 0 0;
            padding: 20px 35px;
            z-index: 100;
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            box-shadow: 0 -10px 30px rgba(0, 255, 200, 0.15);
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        #cinema-info-bar.active { bottom: 0; } /* ಕ್ಲಿಕ್ ಮಾಡಿದಾಗ ಮೇಲಕ್ಕೆ ಬರುತ್ತದೆ */
        
        #popup-title { font-size: 20px; color: #ffaa00; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
        #popup-desc { font-size: 14px; color: #e2e8f0; line-height: 1.6; }
        
        /* ಕ್ಲೋಸ್ ಬಟನ್ ಶೈಲಿ */
        .close-x { background: rgba(255, 255, 255, 0.1); border: none; color: #fff; width: 28px; height: 28px; border-radius: 50%; cursor: pointer; font-size: 14px; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
        .close-x:hover { background: #ff3333; }
        
        /* ಲೋಡರ್ */
        #loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #050508; z-index: 1000; display: flex; flex-direction: column; justify-content: center; align-items: center; transition: opacity 0.5s; }
        .spinner { width: 45px; height: 45px; border: 3px solid rgba(255, 170, 0, 0.1); border-radius: 50%; border-top-color: #ffaa00; animation: spin 1s infinite linear; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="loader">
        <div class="spinner"></div>
        <div style="margin-top: 15px; font-size: 14px; color: #ffaa00;">ಗ್ಯಾಲರಿ ಲೋಡ್ ಆಗುತ್ತಿದೆ...</div>
    </div>
    
    <div id="cinema-info-bar">
        <div id="popup-title">
            <span id="dynasty-name">ರಾಜವಂಶ</span>
            <button class="close-x" onclick="resetView()">✕</button>
        </div>
        <div id="popup-desc">ವಿವರಗಳು...</div>
    </div>

    <div id="canvas-container"></div>

    <div class="ui-layer">
        <header class="interactive">
            <h1>ದಕ್ಷಿಣ ಭಾರತದ ರಾಜವಂಶಗಳು</h1>
            <p class="subtitle">ಚಿತ್ರದ ಮೇಲೆ ಕ್ಲಿಕ್ ಮಾಡಿ ಫುಲ್ ಸ್ಕ್ರೀನ್‌ನಲ್ಲಿ ವೀಕ್ಷಿಸಿ!</p>
        </header>

        <footer class="interactive">
            <span style="color: #666; font-size: 11px;">Interactive Gallery v7 (Cinema Mode)</span>
            <button class="nav-btn" onclick="resetView()">ಮೂಲ ನೋಟ (Reset View)</button>
        </footer>
    </div>

    <script>
        let scene, camera, renderer, controls, raycaster, mouse;
        const container = document.getElementById('canvas-container');
        const clickableObjects = [];

        let targetLookAt = new THREE.Vector3(0, 0, 0);
        let targetFov = 75;

        const imagesList = [
            "https://raw.githubusercontent.com/chandugokarna-bit/gpt-teachers-resources/main/images/badami.jpeg", 
            "https://raw.githubusercontent.com/chandugokarna-bit/gpt-teachers-resources/main/images/kadamba.jpeg", 
            "https://raw.githubusercontent.com/chandugokarna-bit/gpt-teachers-resources/main/images/ganga.jpeg", 
            "https://raw.githubusercontent.com/chandugokarna-bit/gpt-teachers-resources/main/images/kalyani.jpeg", 
            "https://raw.githubusercontent.com/chandugokarna-bit/gpt-teachers-resources/main/images/rashtra.jpeg", 
            "https://raw.githubusercontent.com/chandugokarna-bit/gpt-teachers-resources/main/images/hoisala.jpeg", 
            "https://raw.githubusercontent.com/chandugokarna-bit/gpt-teachers-resources/main/images/chola.jpeg", 
            "https://raw.githubusercontent.com/chandugokarna-bit/gpt-teachers-resources/main/images/vijaya.jpeg", 
            "https://raw.githubusercontent.com/chandugokarna-bit/gpt-teachers-resources/main/images/bahamani.jpeg", 
            "https://raw.githubusercontent.com/chandugokarna-bit/gpt-teachers-resources/main/images/mysuru.jpeg"
        ];

        const historyData = [
            { title: "🏛️ ಬಾದಾಮಿ ಚಾಲುಕ್ಯರು", desc: "• ಸ್ಥಾಪಕ: ಜಯಸಿಂಹ. ಪ್ರಸಿದ್ಧ ದೊರೆ: ಇಮ್ಮಡಿ ಪುಲಕೇಶಿ. <br>• ಕೊಡುಗೆ: ಬಾದಾಮಿ, ಐಹೊಳೆ ಮತ್ತು ಪಟ್ಟದಕಲ್ಲಿನ ಗುಹಾಂತರ ದೇವಾಲಯಗಳು ಶಿಲ್ಪಕಲೆಯ ತವರೂರು." },
            { title: "🛡️ ಕದಂಬ ರಾಜವಂಶ", desc: "• ಸ್ಥಾಪಕ: ಮಯೂರಶರ್ಮ. ರಾಜಧಾನಿ: ಬನವಾಸಿ. <br>• ವಿಶೇಷತೆ: ಕನ್ನಡದ ಮೊದಲ ರಾಜವಂಶ. ಹಲ್ಮಿಡಿ ಶಾಸನವು ಇವರ ಕಾಲದ ಅತ್ಯಂತ ಅಮೂಲ್ಯ ಕನ್ನಡ ಸಾಕ್ಷಿಯಾಗಿದೆ." },
            { title: "🐘 ತಲಕಾಡಿನ ಗಂಗರು", desc: "• ರಾಜಧಾನಿ: ತಲಕಾಡು. <br>• ಕೊಡುಗೆ: ಶ್ರವಣಬೆಳಗೊಳದ ೫೭ ಅಡಿ ಎತ್ತರದ ಭವ್ಯ ಗೊಮ್ಮಟೇಶ್ವರ ಏಕಶಿಲಾ ವಿಗ್ರಹವನ್ನು ಇವರ ಮಂತ್ರಿ ಚಾವುಂಡರಾಯ ಕೆತ್ತಿಸಿದನು." },
            { title: "🎨 ಕಲ್ಯಾಣ ಚಾಲುಕ್ಯರು", desc: "• ಪ್ರಸಿದ್ಧ ದೊರೆ: ಆರನೇ ವಿಕ್ರಮಾದಿತ್ಯ. <br>• ವಿಶೇಷತೆ: ಸಾಹಿತ್ಯ ಮತ್ತು ಕಲ್ಯಾಣದ ವಚನ ಚಳುವಳಿಗೆ ಈ ಕಾಲವೇ ಪ್ರಮುಖ ಅಡಿಪಾಯವಾಗಿದೆ." },
            { title: "⚔️ ರಾಷ್ಟ್ರಕೂಟ ಸಾಮ್ರಾಜ್ಯ", desc: "• ಪ್ರಸಿದ್ಧ ದೊರೆ: ಅಮೋಘವರ್ಷ ನೃಪತುಂಗ. <br>• ಕೊಡುಗೆ: ಎಲ್ಲೋರಾದ ಕೈಲಾಸನಾಥ ದೇವಾಲಯ ಮತ್ತು ಕನ್ನಡದ ಪ್ರಥಮ ಗ್ರಂಥ 'ಕವಿರಾಜಮಾರ್ಗ' ರಚನೆಯಾದ ಸುವರ್ಣಯುಗ." },
            { title: "🔱 ಹೊಯ್ಸಳ ಸಾಮ್ರಾಜ್ಯ", desc: "• ರಾಜಧಾನಿ: ದ್ವಾರಸಮುದ್ರ (ಹಳೇಬೀಡು). <br>• ವಿಶೇಷತೆ: ಬೇಲೂರು, ಹಳೇಬೀಡು ಮತ್ತು ಸೋಮನಾಥಪುರದ ನಕ್ಷತ್ರಾಕಾರದ ಅದ್ಭುತ ದೇವಾಲಯಗಳು ಜಗತ್ಪ್ರಸಿದ್ಧವಾಗಿವೆ." },
            { title: "🐅 ಚೋಳ ಸಾಮ್ರಾಜ್ಯ", desc: "• ಪ್ರಸಿದ್ಧ ದೊರೆ: ರಾಜರಾಜ ಚೋಳ. <br>• ಕೊಡುಗೆ: ತಂಜಾವೂರಿನ ಬೃಹದೀಶ್ವರ ದೇವಾಲಯ ಹಾಗೂ ಬಲಿಷ್ಠ ನೌಕಾಪಡೆ ಹೊಂದಿದ್ದ ದಕ್ಷಿಣ ಭಾರತದ ಹೆಮ್ಮೆಯ ಸಾಮ್ರಾಜ್ಯ." },
            { title: "💎 ವಿಜಯನಗರ ಸಾಮ್ರಾಜ್ಯ", desc: "• ಪ್ರಸಿದ್ಧ ದೊರೆ: ಶ್ರೀ ಕೃಷ್ಣದೇವರಾಯ. <br>• ಕೊಡುಗೆ: ಹಂಪಿಯ ವಿಠಲ ಸ್ವಾಮಿ ದೇವಾಲಯ, ಕಲ್ಲಿನ ರಥ ಮತ್ತು ಸಾಹಿತ್ಯ-ಸಂಸ್ಕೃತಿಯ ಪರಮ ವೈಭವದ ಕಾಲ." },
            { title: "🕌 ಬಹುಮನಿ सुಲ್ತಾನರು", desc: "• ಸ್ಥಾಪಕ: ಅಲ್ಲಾವುದ್ದೀನ್ ಹಸನ್ ಗಂಗು ಬಹಮನ್ ಶಾ. <br>• ಕೊಡುಗೆ: ಬಿದರ್‌ನ ಪ್ರಸಿದ್ಧ ಮೊಹಮ್ಮದ್ ಗವಾನ್ ಮದರಸಾ ಮತ್ತು ಸುಂದರ ಇಂಡೋ-ಇಸ್ಲಾಮಿಕ್ ವಾಸ್ತುಶಿಲ್ಪ." },
            { title: "👑 ಮೈಸೂರು ಒಡೆಯರು", desc: "• ಪ್ರಸಿದ್ಧ ದೊರೆ: ನಾಲ್ವಡಿ ಕೃಷ್ಣರಾಜ ಒಡೆಯರು. <br>• ಕೊಡುಗೆ: ಮೈಸೂರು ಅರಮನೆ, KRS ಜಲಾಶಯ ಮತ್ತು ಕರ್ನಾಟಕವನ್ನು ಆಧುನಿಕ ಮಾದರಿ ರಾಜ್ಯವನ್ನಾಗಿ ಮಾಡಿದ ಕೀರ್ತಿ ಇವರದ್ದು." }
        ];

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x020205);
            scene.fog = new THREE.FogExp2(0x020205, 0.015);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 1.5); 

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableZoom = false;       
            controls.enablePan = false;
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;

            scene.add(new THREE.AmbientLight(0xffffff, 0.95));
            
            // ಬೃಹತ್ ಹಾಲ್ ಸೆಟಪ್
            const roomWidth = 32, roomHeight = 12, roomDepth = 32;
            const roomGeo = new THREE.BoxGeometry(roomWidth, roomHeight, roomDepth);
            const wallMat = new THREE.MeshStandardMaterial({ color: 0x08080d, roughness: 0.6, side: THREE.BackSide });
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x020204, roughness: 0.15, metalness: 0.7, side: THREE.BackSide });
            const ceilingMat = new THREE.MeshStandardMaterial({ color: 0x010102, roughness: 0.9, side: THREE.BackSide });
            const room = new THREE.Mesh(roomGeo, [wallMat, wallMat, ceilingMat, floorMat, wallMat, wallMat]);
            scene.add(room);

            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            const wallX = roomWidth / 2 - 0.05; 
            const wallZ = roomDepth / 2 - 0.05; 

            // ಚಿತ್ರಗಳ ಲೇಔಟ್ ಪೊಸಿಷನ್ ಜೋಡಣೆ
            const galleryLayout = [
                { id: 0, url: imagesList[0], w: 10, h: 5.5, pos: [-4, 0.5, -wallZ], rot: [0, 0, 0] },
                { id: 1, url: imagesList[1], w: 7.5, h: 5.0, pos: [-wallX, 0.5, -9.5], rot: [0, Math.PI/2, 0] },
                { id: 2, url: imagesList[2], w: 7.5, h: 5.0, pos: [-wallX, 0.5, 0], rot: [0, Math.PI/2, 0] },
                { id: 3, url: imagesList[3], w: 7.5, h: 5.0, pos: [-wallX, 0.5, 9.5], rot: [0, Math.PI/2, 0] },
                { id: 4, url: imagesList[4], w: 7.5, h: 5.0, pos: [-5.5, 0.5, wallZ], rot: [0, Math.PI, 0] },
                { id: 5, url: imagesList[5], w: 7.5, h: 5.0, pos: [5.5, 0.5, wallZ], rot: [0, Math.PI, 0] },
                { id: 6, url: imagesList[6], w: 7.5, h: 5.0, pos: [wallX, 0.5, 9.5], rot: [0, -Math.PI/2, 0] },
                { id: 7, url: imagesList[7], w: 7.5, h: 5.0, pos: [wallX, 0.5, 0], rot: [0, -Math.PI/2, 0] },
                { id: 8, url: imagesList[8], w: 7.5, h: 5.0, pos: [wallX, 0.5, -9.5], rot: [0, -Math.PI/2, 0] },
                { id: 9, url: imagesList[9], w: 6.5, h: 4.8, pos: [7.5, 0.5, -wallZ], rot: [0, 0, 0] }
            ];

            const textureLoader = new THREE.TextureLoader();
            let loadedCount = 0;

            galleryLayout.forEach((art) => {
                textureLoader.load(art.url, function(texture) {
                    createArtwork(art.id, texture, art.w, art.h, new THREE.Vector3(...art.pos), new THREE.Vector3(...art.rot));
                    loadedCount++;
                    if(loadedCount === galleryLayout.length) {
                        document.getElementById('loader').style.opacity = 0;
                        setTimeout(() => document.getElementById('loader').style.display = 'none', 500);
                    }
                });
            });

            // ಮೌಸ್ ಸ್ಕ್ರಾಲ್ ಜೂಮ್ ಕಂಟ್ರೋಲ್
            window.addEventListener('wheel', (e) => {
                targetFov += e.deltaY * 0.04;
                targetFov = Math.max(12, Math.min(95, targetFov)); 
            }, { passive: true });

            let startX, startY;
            renderer.domElement.addEventListener('pointerdown', (e) => { startX = e.clientX; startY = e.clientY; });
            renderer.domElement.addEventListener('pointerup', (e) => {
                if (Math.abs(e.clientX - startX) < 5 && Math.abs(e.clientY - startY) < 5) {
                    checkIntersection(e);
                }
            });

            window.addEventListener('resize', onWindowResize, false);
        }

        function createArtwork(id, texture, width, height, position, rotation) {
            const group = new THREE.Group();
            const artGeo = new THREE.PlaneGeometry(width, height);
            const artMat = new THREE.MeshStandardMaterial({ map: texture, roughness: 0.15, side: THREE.DoubleSide });
            const artMesh = new THREE.Mesh(artGeo, artMat);
            
            artMesh.userData = { dynastyId: id, position: position.clone() };
            clickableObjects.push(artMesh); 
            group.add(artMesh);

            // ಆಕರ್ಷಕ ನಿಯಾನ್ ಫ್ರೇಮ್ ವೈರ್‌ಫ್ರೇಮ್
            const frameGeo = new THREE.PlaneGeometry(width + 0.15, height + 0.15);
            const frameMat = new THREE.MeshBasicMaterial({ color: 0x00ffcc, wireframe: true, side: THREE.DoubleSide });
            const frameMesh = new THREE.Mesh(frameGeo, frameMat);
            frameMesh.position.z = -0.01;
            group.add(frameMesh);

            group.position.copy(position);
            group.rotation.set(rotation.x, rotation.y, rotation.z);
            scene.add(group);
        }

        function checkIntersection(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(clickableObjects, true);

            if (intersects.length > 0) {
                const clickedMesh = intersects[0].object;
                if(clickedMesh.userData && clickedMesh.userData.dynastyId !== undefined) {
                    const id = clickedMesh.userData.dynastyId;
                    
                    // 🎯 ಮ್ಯಾಜಿಕ್ ಜೂಮ್: ಕ್ಯಾಮೆರಾವನ್ನು ನೇರವಾಗಿ ಫೋಟೋದ ಮುಂದೆ ತಂದು ಇಡೀ ಫ್ರೇಮ್ ಆವರಿಸುವಂತೆ ಮಾಡುತ್ತದೆ
                    targetLookAt.copy(clickedMesh.userData.position);
                    targetFov = 24; // ಫೋಟೋ ಪೂರ್ತಿ ಸ್ಕ್ರೀನ್ ತುಂಬಲು ತಕ್ಕನಾದ ಜೂಮ್ ಮೌಲ್ಯ

                    // ಕೆಳಭಾಗದ ಬಾರ್‌ನಲ್ಲಿ ವಿವರಣೆ ಪ್ರದರ್ಶನ
                    document.getElementById('dynasty-name').innerHTML = historyData[id].title;
                    document.getElementById('popup-desc').innerHTML = historyData[id].desc;
                    document.getElementById('cinema-info-bar').classList.add('active');
                }
            }
        }

        function resetView() {
            targetLookAt.set(0, 0, 0); 
            targetFov = 75; 
            document.getElementById('cinema-info-bar').classList.remove('active');
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.target.lerp(targetLookAt, 0.08);

            if (Math.abs(camera.fov - targetFov) > 0.05) {
                camera.fov += (targetFov - camera.fov) * 0.08;
                camera.updateProjectionMatrix();
            }

            controls.update();
            renderer.render(scene, camera);
        }

        init();
        animate();
    </script>
</body>
</html>
