<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ಹಳೇಬೀಡು ಹೊಯ್ಸಳೇಶ್ವರ ದೇವಾಲಯ 360° ಆಡಿಯೋ ಪ್ರವಾಸ</title>
    <!-- A-Frame VR ಲೈಬ್ರರಿ -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <style>
        /* ಮಾಹಿತಿ ಫಲಕ */
        #info-panel {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            width: 85%; max-width: 650px; background: rgba(24, 24, 27, 0.95); color: #f4f4f5;
            padding: 20px; border-radius: 15px; font-family: sans-serif; text-align: center;
            font-size: 18px; line-height: 1.6; border: 2px solid #eab308; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            z-index: 999; pointer-events: none;
        }
        /* ಶೀರ್ಷಿಕೆ ಫಲಕ */
        #title-panel {
            position: absolute; top: 20px; left: 20px; color: white;
            background: rgba(24, 24, 27, 0.85); padding: 15px; border-radius: 10px;
            border-left: 5px solid #eab308; z-index: 999;
        }
        #title-panel h1 { margin: 0; font-size: 22px; color: #eab308; }
    </style>
</head>
<body>

    <div id="title-panel">
        <h1>ಹಳೇಬೀಡು: ಭವ್ಯ ಹೊಯ್ಸಳೇಶ್ವರ ದೇವಾಲಯ ವರ್ಚುವಲ್ ದರ್ಶನ</h1>
        <p>ಚಿನ್ನದ ಬಣ್ಣದ ವರ್ತುಲಗಳ ಮೇಲೆ ನೇರವಾಗಿ ಕ್ಲಿಕ್ ಮಾಡಿ ಆಡಿಯೋ ಮಾಹಿತಿ ಪಡೆಯಿರಿ</p>
    </div>

    <div id="info-panel">
        ಸ್ವಾಗತ! ಯುನೆಸ್ಕೋ (UNESCO) ಜಗತ್ತಿನ ಪಾರಂಪರಿಕ ತಾಣವಾಗಿರುವ ಹಳೇಬೀಡಿನ ಅದ್ಭುತ ಶಿಲ್ಪಕಲೆಯನ್ನು ತಿಳಿಯಲು ಆವರಣದಲ್ಲಿರುವ ಚಿನ್ನದ ಬಣ್ಣದ ಹಾಟ್‌ಸ್ಪಾಟ್‌ಗಳ ಮೇಲೆ ಕ್ಲಿಕ್ ಮಾಡಿ...
    </div>

    <!-- ನೇರ ಮೌಸ್ ಕ್ಲಿಕ್ ಸಿಸ್ಟಮ್ -->
    <a-scene cursor="rayOrigin: mouse">
        <a-assets>
            <img id="halebeedu-scene" src="https://raw.githubusercontent.com/chandugokarna-bit/gpt-teachers-resources/main/resources/virtual/halebeedu360.jpg" crossorigin="anonymous">
        </a-assets>

        <!-- ಹಿನ್ನೆಲೆ 360 ಚಿತ್ರ -->
        <a-sky src="#halebeedu-scene"></a-sky>

        <a-entity camera look-controls position="0 1.6 0"></a-entity>

        <!-- ================= ಇಂಟರಾಕ್ಟಿವ್ ಹಾಟ್‌ಸ್ಪಾಟ್‌ಗಳು (ಆರಂಭಿಕ ಸುರಕ್ಷಿತ ಸ್ಥಾನ) ================= -->

        <!-- 1. ಹೊಯ್ಸಳೇಶ್ವರ ಮತ್ತು ಕೇದಾರೇಶ್ವರ ಅವಳಿ ದೇವಸ್ಥಾನಗಳು (ಎಡಭಾಗ) -->
        <a-sphere id="hotspot-halebeedu-history" position="-2 1.5 -4" radius="0.35" color="#eab308" class="hotspot"
                  data-title="ಹೊಯ್ಸಳರ ರಾಜಧಾನಿ ದ್ವಾರಸಮುದ್ರ"
                  data-info="ಹಳೇಬೀಡಿನ ಹಳೆಯ ಹೆಸರು 'ದ್ವಾರಸಮುದ್ರ'. ಇದು ಕ್ರಿ.ಶ 12 ನೇ ಶತಮಾನದಲ್ಲಿ ಹೊಯ್ಸಳ ಸಾಮ್ರಾಜ್ಯದ ರಾಜಧಾನಿಯಾಗಿ ಮೆರೆದಿತ್ತು. ಇಲ್ಲಿನ ಮುಖ್ಯ ಹೊಯ್ಸಳೇಶ್ವರ ದೇವಾಲಯವು ಶಿವನಿಗೆ ಸಮರ್ಪಿತವಾದ ಅತ್ಯಂತ ದೊಡ್ಡ ಅವಳಿ (Double) ದೇವಾಲಯವಾಗಿದೆ. ಇದನ್ನು ರಾಜ ವಿಷ್ಣುವರ್ಧನನ ಕಾಲದಲ್ಲಿ ಕೇತುಮಲ್ಲ ಎಂಬ ದಂಡನಾಯಕನು ನಿರ್ಮಿಸಿದನು.">
        </a-sphere>

        <!-- 2. ಜಗತ್ಪ್ರಸಿದ್ಧ ಕಲ್ಲಿನ ಸೂಕ್ಷ್ಮ ಕೆತ್ತನೆಗಳ ಗೋಡೆ (ಮಧ್ಯದಲ್ಲಿದೆ) -->
        <a-sphere id="hotspot-halebeedu-carvings" position="0 1.5 -4" radius="0.35" color="#eab308" class="hotspot"
                  data-title="ನಕ್ಷತ್ರಾಕಾರದ ತಳಪಾಯ ಮತ್ತು ಬಿತ್ತಿಚಿತ್ರಗಳು"
                  data-info="ಈ ದೇವಾಲಯವನ್ನು ನಕ್ಷತ್ರಾಕಾರದ ಜಗತಿಯ (Platform) ಮೇಲೆ ನಿರ್ಮಿಸಲಾಗಿದೆ. ಇದರ ಹೊರಗೋಡೆಗಳ ಮೇಲೆ ಬಳಸಲಾದ ಮೃದುವಾದ ಬಳಪದ ಕಲ್ಲಿನಲ್ಲಿ (Soapstone) ರಾಮಾಯಣ, ಮಹಾಭಾರತದ ಕಥೆಗಳು, ಆನೆಗಳು, ಸಿಂಹಗಳು ಮತ್ತು ಸುಂದರ ಮದನಿಕೆಯರ ವಿಗ್ರಹಗಳನ್ನು ಅತ್ಯಂತ ಸೂಕ್ಷ್ಮವಾಗಿ ಕೆತ್ತಲಾಗಿದೆ. ಇಲ್ಲಿನ ಪ್ರತಿಯೊಂದು ಕೆತ್ತನೆಯೂ ಜೀವಂತವಾಗಿರುವಂತೆ ಭಾಸವಾಗುತ್ತದೆ.">
        </a-sphere>

        <!-- 3. ಏಕಶಿಲಾ ಬೃಹತ್ ನಂದಿ ವಿಗ್ರಹ (ಬಲಭಾಗದಲ್ಲಿದೆ) -->
        <a-sphere id="hotspot-halebeedu-nandi" position="2 1.5 -4" radius="0.35" color="#eab308" class="hotspot"
                  data-title="ಏಕಶಿಲಾ ಬೃಹತ್ ನಂದಿ ಮಂಟಪ"
                  data-info="ದೇವಾಲಯದ ಮುಂಭಾಗದಲ್ಲಿ ವಿಸ್ತಾರವಾದ ತೆರೆದ ಮಂಟಪವಿದ್ದು, ಅದರಲ್ಲಿ ಅತ್ಯಂತ ಆಕರ್ಷಕವಾದ ಮತ್ತು ಬೃಹತ್ತಾದ ಏಕಶಿಲಾ ನಂದಿ ವಿಗ್ರಹವಿದೆ. ಈ ನಂದಿಯ ಮೈಮೇಲಿರುವ ಆಭರಣಗಳ ಕೆತ್ತನೆಗಳು ಮತ್ತು ಕಲ್ಲಿನ ಹೊಳಪು ಹೊಯ್ಸಳ ಶಿಲ್ಪಿಗಳಾದ ಜಕಣಾಚಾರಿ ಮತ್ತು ಇತರರ ಅತ್ಯುನ್ನತ ಕಲಾ ಕೌಶಲ್ಯಕ್ಕೆ ಸಾಕ್ಷಿಯಾಗಿದೆ.">
        </a-sphere>

    </a-scene>

    <script>
        const hotspots = document.querySelectorAll('.hotspot');
        const infoPanel = document.getElementById('info-panel');

        hotspots.forEach(hotspot => {
            // ಮೌಸ್ Hover ಇಫೆಕ್ಟ್
            hotspot.addEventListener('mouseenter', function () {
                this.setAttribute('color', '#ef4444'); // ಕೆಂಪು ಬಣ್ಣ
            });

            hotspot.addEventListener('mouseleave', function () {
                this.setAttribute('color', '#eab308'); // ಮರಳಿ ಚಿನ್ನದ ಬಣ್ಣ
            });

            // ಕ್ಲಿಕ್ ಇವೆಂಟ್ ಮತ್ತು ಆಡಿಯೋ ಪ್ಲೇಬ್ಯಾಕ್
            hotspot.addEventListener('click', function () {
                const title = this.getAttribute('data-title');
                const info = this.getAttribute('data-info');
                
                infoPanel.innerHTML = `<strong>${title}</strong><br>${info}`;

                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel(); // ಹಳೆಯ ಧ್ವನಿ ನಿಲ್ಲಿಸಲು
                    
                    const speech = new SpeechSynthesisUtterance();
                    speech.text = title + ". " + info;
                    speech.lang = 'kn-IN'; // ಕನ್ನಡ ಭಾಷೆ
                    speech.rate = 0.85; // ಸ್ಪಷ್ಟ ಧ್ವನಿ ವೇಗ
                    
                    window.speechSynthesis.speak(speech);
                }
            });
        });
    </script>
</body>
</html>
