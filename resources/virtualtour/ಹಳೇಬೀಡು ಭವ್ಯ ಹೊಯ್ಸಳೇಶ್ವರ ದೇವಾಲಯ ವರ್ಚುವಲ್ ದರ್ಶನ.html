<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ಹಳೇಬೀಡು ಹೊಯ್ಸಳೇಶ್ವರ ದೇವಾಲಯ - 360° ಆಡಿಯೋ ಪ್ರವಾಸ</title>
    <!-- Pannellum 360 ಲೈಬ್ರರಿ -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.7/build/pannellum.css"/>
    <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.7/build/pannellum.js"></script>
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; }
        #panorama { width: 100vw; height: 100vh; }
        
        /* ಶೀರ್ಷಿಕೆ ಫಲಕ */
        #title-panel {
            position: absolute; top: 20px; left: 20px; color: white;
            background: rgba(15, 23, 42, 0.85); padding: 15px; border-radius: 10px;
            border-left: 5px solid #eab308; z-index: 999; pointer-events: none;
        }
        #title-panel h1 { margin: 0; font-size: 20px; color: #eab308; }
        #title-panel p { margin: 5px 0 0 0; font-size: 14px; color: #e2e8f0; }

        /* ಕೆಳಗಿನ ಸುಂದರ ಮಾಹಿತಿ ಫಲಕ (ಆಡಿಯೋ ಮತ್ತು ಪಠ್ಯಕ್ಕಾಗಿ) */
        #info-panel {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            width: 85%; max-width: 650px; background: rgba(15, 23, 42, 0.95); color: #f8fafc;
            padding: 20px; border-radius: 15px; text-align: center;
            font-size: 17px; line-height: 1.6; border: 2px solid #eab308; /* ಹೊಯ್ಸಳರ ಸಾಂಸ್ಕೃತಿಕ ಚಿನ್ನದ ಬಣ್ಣ */
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            z-index: 999; pointer-events: none;
        }

        /* 🎯 ದೊಡ್ಡದಾಗಿರುವ ಕಸ್ಟಮ್ ಹಾಟ್‌ಸ್ಪಾಟ್‌ ಬಬಲ್ಸ್ */
        .custom-hotspot {
            height: 32px;
            width: 32px;
            background: #eab308; /* ಹೊಳೆಯುವ ಚಿನ್ನದ ಬಣ್ಣ */
            border: 3px solid #ffffff;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 12px rgba(234, 179, 8, 0.8);
            transition: all 0.3s ease;
        }
        /* ಅದರ ಮೇಲೆ ಬೆರಳು ಇಟ್ಟಾಗ ಕೆಂಪು ಬಣ್ಣಕ್ಕೆ ತಿರುಗಲು */
        .custom-hotspot:hover {
            background: #ef4444; 
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.9);
            transform: scale(1.2);
        }
    </style>
</head>
<body>

<div id="title-panel">
    <h1>ಹಳೇಬೀಡು: ಭವ್ಯ ಹೊಯ್ಸಳೇಶ್ವರ ದೇವಾಲಯ ವರ್ಚುವಲ್ ದರ್ಶನ</h1>
    <p>ದೊಡ್ಡದಾಗಿರುವ ಚಿನ್ನದ ಬಣ್ಣದ ವರ್ತುಲಗಳ ಮೇಲೆ ಕ್ಲಿಕ್ ಮಾಡಿ ಆಡಿಯೋ ವಿವರ ಪಡೆಯಿರಿ</p>
</div>

<div id="panorama"></div>

<div id="info-panel">
    ಸ್ವಾಗತ! ಯುನೆಸ್ಕೋ (UNESCO) ಜಗತ್ತಿನ ಪಾರಂಪರಿಕ ತಾಣವಾಗಿರುವ ಹಳೇಬೀಡಿನ ಅದ್ಭುತ ಶಿಲ್ಪಕಲೆಯನ್ನು ತಿಳಿಯಲು ಆವರಣದಲ್ಲಿರುವ ದೊಡ್ಡ ಹಾಟ್‌ಸ್ಪಾಟ್‌ಗಳ ಮೇಲೆ ಕ್ಲಿಕ್ ಮಾಡಿ...
</div>

<script>
// ಕನ್ನಡ ಧ್ವನಿ ಕಾರ್ಯವಿಧಾನ
function speakKannada(title, infoText) {
    document.getElementById('info-panel').innerHTML = `<strong>${title}</strong><br>${infoText}`;
    
    if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel(); // ಹಳೆಯ ಧ್ವನಿ ನಿಲ್ಲಿಸಲು
        
        const speech = new SpeechSynthesisUtterance();
        speech.text = title + ". " + infoText;
        speech.lang = 'kn-IN'; // ಕನ್ನಡ ಭಾಷೆ
        speech.rate = 0.85; // ಸ್ಪಷ್ಟ ಧ್ವನಿ ವೇಗ
        
        window.speechSynthesis.speak(speech);
    }
}

// Pannellum ವೀಕ್ಷಕ ಸೆಟ್ಟಿಂಗ್ಸ್
pannellum.viewer('panorama', {
    "type": "equirectangular",
    "panorama": "https://raw.githubusercontent.com/chandugokarna-bit/gpt-teachers-resources/main/resources/virtual/halebeedu360.jpg",
    "autoLoad": true,
    "title": "ಹೊಯ್ಸಳೇಶ್ವರ ದೇವಾಲಯ, ಹಳೇಬೀಡು",
    "author": "ಹೊಯ್ಸಳ ಕಲಾ ವೈಭವ",
    "hotSpots": [
        {
            "pitch": 0,
            "yaw": -35,
            "cssClass": "custom-hotspot", // ನಮ್ಮ ಕಸ್ಟಮ್ ದೊಡ್ಡ ಹಾಟ್‌ಸ್ಪಾಟ್
            "createTooltipFunc": function(hotSpotDiv) { hotSpotDiv.setAttribute("title", "ಹಳೇಬೀಡು ಇತಿಹಾಸ"); },
            "clickHandlerFunc": function() {
                speakKannada(
                    "ಹೊಯ್ಸಳರ ರಾಜಧಾನಿ ದ್ವಾರಸಮುದ್ರ", 
                    "ಹಳೇಬೀಡಿನ ಹಳೆಯ ಹೆಸರು 'ದ್ವಾರಸಮುದ್ರ'. ಇದು ಕ್ರಿ.ಶ 12 ನೇ ಶತಮಾನದಲ್ಲಿ ಹೊಯ್ಸಳ ಸಾಮ್ರಾಜ್ಯದ ರಾಜಧಾನಿಯಾಗಿ ಮೆರೆದಿತ್ತು. ಇಲ್ಲಿನ ಮುಖ್ಯ ಹೊಯ್ಸಳೇಶ್ವರ ದೇವಾಲಯವು ಶಿವನಿಗೆ ಸಮರ್ಪಿತವಾದ ಅತ್ಯಂತ ದೊಡ್ಡ ಅವಳಿ ದೇವಾಲಯವಾಗಿದೆ. ಇದನ್ನು ರಾಜ ವಿಷ್ಣುವರ್ಧನನ ಕಾಲದಲ್ಲಿ ಕೇತುಮಲ್ಲ ಎಂಬ ದಂಡನಾಯಕನು ನಿರ್ಮಿಸಿದನು."
                );
            }
        },
        {
            "pitch": 5,
            "yaw": 15,
            "cssClass": "custom-hotspot",
            "createTooltipFunc": function(hotSpotDiv) { hotSpotDiv.setAttribute("title", "ಸೂಕ್ಷ್ಮ ಕೆತ್ತನೆಗಳು"); },
            "clickHandlerFunc": function() {
                speakKannada(
                    "ನಕ್ಷತ್ರಾಕಾರದ ತಳಪಾಯ ಮತ್ತು ಬಿತ್ತಿಚಿತ್ರಗಳು", 
                    "ಈ ದೇವಾಲಯವನ್ನು ನಕ್ಷತ್ರಾಕಾರದ ಜಗತಿಯ ಮೇಲೆ ನಿರ್ಮಿಸಲಾಗಿದೆ. ಇದರ ಹೊರಗೋಡೆಗಳ ಮೇಲೆ ಬಳಸಲಾದ ಮೃದುವಾದ ಬಳಪದ ಕಲ್ಲಿನಲ್ಲಿ ರಾಮಾಯಣ, ಮಹಾಭಾರತದ ಕಥೆಗಳು, ಆನೆಗಳು, ಸಿಂಹಗಳು ಮತ್ತು ಸುಂದರ ಮದನಿಕೆಯರ ವಿಗ್ರಹಗಳನ್ನು ಅತ್ಯಂತ ಸೂಕ್ಷ್ಮವಾಗಿ ಕೆತ್ತಲಾಗಿದೆ."
                );
            }
        },
        {
            "pitch": -5,
            "yaw": 45,
            "cssClass": "custom-hotspot",
            "createTooltipFunc": function(hotSpotDiv) { hotSpotDiv.setAttribute("title", "ಬೃಹತ್ ನಂದಿ"); },
            "clickHandlerFunc": function() {
                speakKannada(
                    "ಏಕಶಿಲಾ ಬೃಹತ್ ನಂದಿ ಮಂಟಪ", 
                    "ದೇವಾಲಯದ ಮುಂಭಾಗದಲ್ಲಿ ವಿಸ್ತಾರವಾದ ತೆರೆದ ಮಂಟಪವಿದ್ದು, ಅದರಲ್ಲಿ ಅತ್ಯಂತ ಆಕರ್ಷಕವಾದ ಮತ್ತು ಬೃಹತ್ತಾದ ಏಕಶಿಲಾ ನಂದಿ ವಿಗ್ರಹವಿದೆ. ಈ ನಂದಿಯ ಮೈಮೇಲಿರುವ ಆಭರಣಗಳ ಕೆತ್ತನೆಗಳು ಮತ್ತು ಕಲ್ಲಿನ ಅದ್ಭುತ ಹೊಳಪು ಹೊಯ್ಸಳ ಶಿಲ್ಪಿಗಳ ಅತ್ಯುನ್ನತ ಕಲಾ ಕೌಶಲ್ಯಕ್ಕೆ ಸಾಕ್ಷಿಯಾಗಿದೆ."
                );
            }
        }
    ]
});
</script>

</body>
</html>
