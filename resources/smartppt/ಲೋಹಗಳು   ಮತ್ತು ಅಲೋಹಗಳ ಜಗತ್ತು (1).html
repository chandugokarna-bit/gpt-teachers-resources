<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fullscreen Google Slides</title>
    <style>
        /* Reset and layout */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #111;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }

        /* Container that will go fullscreen */
        #fullscreen-container {
            position: relative;
            width: 100%;
            height: 100%;
            background: #000;
        }

        /* Make iframe fill the container */
        #fullscreen-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Styling for the Fullscreen Button overlay */
        .fullscreen-btn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            z-index: 10;
            background-color: rgba(0, 0, 0, 0.7);
            color: #fff;
            border: 2px solid #fff;
            padding: 10px 18px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            transition: background 0.3s ease;
        }

        .fullscreen-btn:hover {
            background-color: rgba(255, 255, 255, 0.9);
            color: #000;
        }
    </style>
</head>
<body>

    <!-- Container for Presentation and Controls -->
    <div id="fullscreen-container">
        <!-- Fullscreen Trigger Button -->
        <button class="fullscreen-btn" id="toggleFsBtn">Go Fullscreen ⤢</button>

        <!-- Google Slides Iframe -->
        <iframe src="https://docs.google.com/presentation/d/e/2PACX-1vQ6UDodSAsPLEPjMolpoBMYvU7UQMaX4JvVH8NqK4MhniaXA1y_FjWxov0fXZ0T_v5KFzT3XY-JFNOI/pubembed?start=false&loop=false&delayms=3000" 
            frameborder="0" 
            allowfullscreen="true" 
            mozallowfullscreen="true" 
            webkitallowfullscreen="true">
        </iframe>
    </div>

    <script>
        const container = document.getElementById('fullscreen-container');
        const button = document.getElementById('toggleFsBtn');

        button.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                // Request Fullscreen
                if (container.requestFullscreen) {
                    container.requestFullscreen();
                } else if (container.mozRequestFullScreen) { // Firefox
                    container.mozRequestFullScreen();
                } else if (container.webkitRequestFullscreen) { // Chrome, Safari & Opera
                    container.webkitRequestFullscreen();
                } else if (container.msRequestFullscreen) { // IE/Edge
                    container.msRequestFullscreen();
                }
            } else {
                // Exit Fullscreen
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.mozCancelFullScreen) {
                    document.mozCancelFullScreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                } else if (document.msExitFullscreen) {
                    document.msExitFullscreen();
                }
            }
        });

        // Update button text depending on fullscreen state
        document.addEventListener('fullscreenchange', () => {
            if (document.fullscreenElement) {
                button.textContent = 'Exit Fullscreen ⤡';
            } else {
                button.textContent = 'Go Fullscreen ⤢';
            }
        });
    </script>

</body>
</html>
