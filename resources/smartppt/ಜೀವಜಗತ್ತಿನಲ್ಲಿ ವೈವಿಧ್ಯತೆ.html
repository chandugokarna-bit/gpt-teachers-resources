<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Slides Fullscreen</title>
    <style>
        /* ಪುಟವನ್ನು ಪೂರ್ಣ ಪರದೆಗೆ ಹೊಂದಿಸಲು CSS */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        .slide-container {
            width: 100%;
            height: 100%;
        }
        .slide-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="slide-container">
        <iframe src="https://docs.google.com/presentation/d/e/2PACX-1vSwWUDSu0b4so5kMovBuzF_iGPcsd_MiVLO1LnZ685XmxqDpSBAKRQMdkuSZn4ZARlZaYrOwIWXpuVL/pubembed?start=false&loop=false&delayms=3000" 
                frameborder="0" 
                allowfullscreen="true" 
                mozallowfullscreen="true" 
                webkitallowfullscreen="true">
        </iframe>
    </div>

</body>
</html>
