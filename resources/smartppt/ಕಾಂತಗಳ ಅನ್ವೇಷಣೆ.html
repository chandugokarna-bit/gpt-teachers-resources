<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fullscreen Presentation</title>
    <style>
        /* Remove default browser margins and hide scrollbars */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }

        /* Force the iframe to cover the entire browser window */
        .fullscreen-presentation {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <iframe class="fullscreen-presentation" 
        src="https://docs.google.com/presentation/d/e/2PACX-1vSv_iC44nnnONgzEV8ulFBTj3WNO_e-frZm8ijo-ZTbI0B6mx-U3KhNG4zdieGAaS9_Bl1NNi5cVbj_/pubembed?start=false&loop=false&delayms=3000" 
        frameborder="0" 
        allowfullscreen="true" 
        mozallowfullscreen="true" 
        webkitallowfullscreen="true">
    </iframe>

</body>
</html>
