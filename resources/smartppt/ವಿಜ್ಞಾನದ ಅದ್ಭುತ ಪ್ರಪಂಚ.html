<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Presentation View</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --accent-gradient: linear-gradient(135deg, #00f2ff, #9d4edd);
            --glass: rgba(255, 255, 255, 0.05);
        }

        body {
            background-color: var(--bg-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', sans-serif;
        }

        /* Glassmorphism Container */
        .presentation-card {
            background: var(--glass);
            backdrop-filter: blur(15px);
            padding: 20px;
            border-radius: 25px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            max-width: 1000px;
            width: 95%;
            text-align: center;
        }

        .header {
            margin-bottom: 20px;
        }

        .header h1 {
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 2rem;
            margin: 0;
        }

        /* Responsive Iframe Wrapper */
        .iframe-container {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            height: 0;
            overflow: hidden;
            border-radius: 15px;
            background: #000;
        }

        .iframe-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

<div class="presentation-card">
    <div class="header">
        <h1></h1>
    </div>
    <div class="iframe-container">
        <!-- Embedded Google Slides -->
        <iframe 
            src="https://docs.google.com/presentation/d/e/2PACX-1vRJCehJwauhdqIqxH26edCvH43ZLkWLILCsxBip2tPAsVyxRTgLNaMN9n0vZDaXkxoFQAqoCI-MrAui/embed?start=false&loop=false&delayms=3000" 
            allowfullscreen="true">
        </iframe>
    </div>
</div>

</body>
</html>
