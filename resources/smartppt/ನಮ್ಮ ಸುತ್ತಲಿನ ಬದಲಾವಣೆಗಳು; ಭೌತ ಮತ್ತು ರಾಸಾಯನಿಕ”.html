<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fullscreen Presentation</title>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }

        .fullscreen-presentation {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            border: none;
        }
    </style>
</head>
<body>

    <iframe 
        class="fullscreen-presentation"
        src="https://docs.google.com/presentation/d/e/2PACX-1vS248HUnh8A9F6FEcuD-CkXzigM8PKHjDd2X3DzHr_sLKlGS65vDerZ1DKifXwxO2LEVm6laZVe0CsY/pubembed?start=false&loop=false&delayms=3000" 
        frameborder="0" 
        allowfullscreen="true" 
        mozallowfullscreen="true" 
        webkitallowfullscreen="true">
    </iframe>

</body>
</html>
