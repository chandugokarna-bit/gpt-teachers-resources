<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ನನ್ನ ಪ್ರೆಸೆಂಟೇಶನ್ - ಫುಲ್ ಸ್ಕ್ರೀನ್</title>
    <style>
        /* ಬ್ರೌಸರ್‌ನ ಮಾರ್ಜಿನ್ ಮತ್ತು ಸ್ಕ್ರಾಲ್ ಬಾರ್‌ಗಳನ್ನು ತೆಗೆದುಹಾಕಲು */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000; /* ಸ್ಲೈಡ್ ಲೋಡ್ ಆಗುವಾಗ ಹಿನ್ನೆಲೆ ಕಪ್ಪಾಗಿರಲಿ */
        }

        /* ಪ್ರೆಸೆಂಟೇಶನ್ ಕಂಟೈನರ್ ಅನ್ನು ಸಂಪೂರ್ಣ ಸ್ಕ್ರೀನ್‌ಗೆ ಅಳವಡಿಸುವುದು */
        .fullscreen-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* iframe ಇಡೀ ಸ್ಕ್ರೀನ್ ಆವರಿಸಿಕೊಳ್ಳಲು */
        .fullscreen-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="fullscreen-container">
        <!-- ನಿಮ್ಮ ಲಿಂಕ್ ಅನ್ನು pubembed ಮಾದರಿಯಲ್ಲಿ ಇಲ್ಲೂ ಸಹ ಅಪ್‌ಡೇಟ್ ಮಾಡಲಾಗಿದೆ -->
        <iframe src="https://docs.google.com/presentation/d/e/2PACX-1vQVUlNp8DmCgKeaUEAC-lO8KR0FuIusSVjzkRHz4L0btK_sICK5cKKUSNmGtaBTuyrmczq6AsKdE0ph/pubembed?start=false&loop=false&delayms=3000" allowfullscreen="true" mozallowfullscreen="true" webkitallowfullscreen="true"></iframe>
    </div>

</body>
</html>
