<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>ಹಂಪಿ ವಿಜಯನಗರ ಸಾಮ್ರಾಜ್ಯ 360° ಆಡಿಯೋ ಪ್ರವಾಸ</title>
    <!-- A-Frame VR ಲೈಬ್ರರಿ -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <style>
        /* ಮಾಹಿತಿ ಫಲಕ */
        #info-panel {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            width: 85%; max-width: 650px; background: rgba(24, 24, 27, 0.95); color: #f4f4f5;
            padding: 20px; border-radius: 15px; font-family: sans-serif; text-align: center;
            font-size: 18px; line-height: 1.6; border: 2px solid #eab308; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            z-index: 999; pointer-events: none;
        }
        /* ಶೀರ್ಷಿಕೆ ಫಲಕ */
        #title-panel {
            position: absolute; top: 20px; left: 20px; color: white;
            background: rgba(24, 24, 27, 0.85); padding: 15px; border-radius: 10px;
            border-left: 5px solid #eab308; z-index: 999;
        }
        #title-panel h1 { margin: 0; font-size: 22px; color: #eab308; }
    </style>
</head>
<body>

    <div id="title-panel">
        <h1>ಹಂಪಿ: ಭವ್ಯ ವಿಜಯನಗರ ಸಾಮ್ರಾಜ್ಯದ ವರ್ಚುವಲ್ ದರ್ಶನ</h1>
        <p>ಚಿನ್ನದ ಬಣ್ಣದ ವರ್ತುಲಗಳ ಮೇಲೆ ನೇರವಾಗಿ ಕ್ಲಿಕ್ ಮಾಡಿ ಆಡಿಯೋ ಮಾಹಿತಿ ಪಡೆಯಿರಿ</p>
    </div>

    <div id="info-panel">
        ಸ್ವಾಗತ! ಯುನೆಸ್ಕೋ (UNESCO) ವಿಶ್ವ ಪಾರಂಪರಿಕ ತಾಣವಾಗಿರುವ ಹಂಪಿಯ ಭವ್ಯ ಇತಿಹಾಸ ಮತ್ತು ಶಿಲ್ಪಕಲೆಯನ್ನು ತಿಳಿಯಲು ಆವರಣದಲ್ಲಿರುವ ಚಿನ್ನದ ಬಣ್ಣದ ಹಾಟ್‌ಸ್ಪಾಟ್‌ಗಳ ಮೇಲೆ ಕ್ಲಿಕ್ ಮಾಡಿ...
    </div>

    <!-- VR ಬಟನ್ ಸಂಪೂರ್ಣವಾಗಿ ತೆಗೆದುಹಾಕಲಾಗಿದೆ -->
    <a-scene vr-mode-ui="enabled: false" cursor="rayOrigin: mouse">
        <a-assets>
            <img id="hampi-scene" src="https://raw.githubusercontent.com/chandugokarna-bit/gpt-teachers-resources/main/resources/virtual/hampi360.jpg" crossorigin="anonymous">
        </a-assets>

        <!-- ಹಿನ್ನೆಲೆ 360 ಚಿತ್ರ -->
        <a-sky src="#hampi-scene"></a-sky>

        <!-- ಫೋನ್ ಮೊಬೈಲ್ ಸೆನ್ಸರ್ ಟ್ರ್ಯಾಕಿಂಗ್ ನಿಷ್ಕ್ರಿಯಗೊಳಿಸಲಾಗಿದೆ - ಕೇವಲ ಕಂಟ್ರೋಲ್ ಬ್ರೌಸರ್ ಟಚ್ -->
        <a-entity camera look-controls="magicWindowTrackingEnabled: false" position="0 1.6 0"></a-entity>

        <!-- ================= ಇಂಟರಾಕ್ಟಿವ್ ಹಾಟ್‌ಸ್ಪಾಟ್‌ಗಳು ================= -->

        <!-- 1. ವಿರೂಪಾಕ್ಷ ದೇವಾಲಯ ಮತ್ತು ಗೋಪುರ -->
        <a-sphere id="hotspot-hampi-virupaksha" position="-2 1.5 -4" radius="0.35" color="#eab308" class="hotspot"
                  data-title="ಭವ್ಯ ಶ್ರೀ ವಿರೂಪಾಕ್ಷ ದೇವಾಲಯ"
                  data-info="ತುಂಗಭದ್ರಾ ನದಿಯ ದಂಡೆಯ ಮೇಲಿರುವ ವಿರೂಪಾಕ್ಷ ದೇವಾಲಯವು ಹಂಪಿಯ ಅತ್ಯಂತ ಪವಿತ್ರ ಮತ್ತು ಹಳೆಯ ದೇವಸ್ಥಾನವಾಗಿದೆ. ಇದರ ಭವ್ಯವಾದ ರಾಜಗೋಪುರವು ಸುಮಾರು 50 ಮೀಟರ್ ಎತ್ತರವಿದ್ದು, ವಿಜಯನಗರ ಸಾಮ್ರಾಜ್ಯದ ಸ್ಥಾಪನೆಗೂ ಮುನ್ನವೇ ಅಸ್ತಿತ್ವದಲ್ಲಿದ್ದ ಈ ಕ್ಷೇತ್ರವನ್ನು ಕೃಷ್ಣದೇವರಾಯನ ಕಾಲದಲ್ಲಿ ಮತ್ತಷ್ಟು ವಿಸ್ತರಿಸಲಾಯಿತು.">
        </a-sphere>

        <!-- 2. ಜಗತ್ಪ್ರಸಿದ್ಧ ಕಲ್ಲಿನ ರಥ -->
        <a-sphere id="hotspot-hampi-chariot" position="0 1.5 -4" radius="0.35" color="#eab308" class="hotspot"
                  data-title="ವಿಜಯ ವಿಠಲ ದೇವಾಲಯದ ಕಲ್ಲಿನ ರಥ"
                  data-info="ಹಂಪಿಯ ಪ್ರಮುಖ ಆಕರ್ಷಣೆಯಾದ ಈ ಕಲ್ಲಿನ ರಥವು ಭಾರತೀಯ ಕರೆನ್ಸಿ ನೋಟಿನ ಮೇಲೂ ಸ್ಥಾನ ಪಡೆದಿದೆ. ಬೃಹತ್ ಬಂಡೆಗಲ್ಲುಗಳನ್ನು ಕತ್ತರಿಸಿ ರಥದ ಆಕಾರದಲ್ಲಿ ಜೋಡಿಸಲಾದ ಈ ಅದ್ಭುತ ಶಿಲ್ಪಕಲೆ ವಿಜಯನಗರದ ವಾಸ್ತುಶಿಲ್ಪದ ಚಮತ್ಕಾರಕ್ಕೆ ಸಾಕ್ಷಿಯಾಗಿದೆ. ಇದರ ಮುಂಭಾಗದಲ್ಲಿರುವ ಕಲ್ಲಿನ ಆನೆಗಳು ರಥವನ್ನು ಎಳೆಯುವಂತೆ ಕೆತ್ತಲಾಗಿದೆ.">
        </a-sphere>

        <!-- 3. ಉಗ್ರ ನರಸಿಂಹ ಮತ್ತು ಸಾಸಿವೆಕಾಳು ಗಣೇಶ -->
        <a-sphere id="hotspot-hampi-monoliths" position="2 1.5 -4" radius="0.35" color="#eab308" class="hotspot"
                  data-title="ಲಕ್ಷ್ಮಿ ನರಸಿಂಹ ಏಕಶಿಲಾ ವಿಗ್ರಹ"
                  data-info="ಒಂದೇ ಕಲ್ಲಿನಲ್ಲಿ ಕೆತ್ತಲಾದ ಹಂಪಿಯ ಅತಿ ದೊಡ್ಡ ಏಕಶಿಲಾ ವಿಗ್ರಹಗಳಲ್ಲಿ ಲಕ್ಷ್ಮಿ ನರಸಿಂಹ ಅಥವಾ ಉಗ್ರ ನರಸಿಂಹ ಮೂರ್ತಿಯೂ ಒಂದು. ಸುಮಾರು 6.7 ಮೀಟರ್ ಎತ್ತರವಿರುವ ಈ ಭವ್ಯ ಮೂರ್ತಿಯನ್ನು ಕ್ರಿ.ಶ 1528 ರಲ್ಲಿ ಕೃಷ್ಣದೇವರಾಯನ ಆಳ್ವಿಕೆಯಲ್ಲಿ ಕೆತ್ತಲಾಯಿತು. ಸಿಂಹದ ಮುಖ ಮತ್ತು ಭೀಕರ ಕಣ್ಣುಗಳುಳ್ಳ ಈ ವಿಗ್ರಹವು ವಿಜಯನಗರದ ಕಲಾ ವೈಭವವನ್ನು ಸಾರುತ್ತದೆ.">
        </a-sphere>

    </a-scene>

    <script>
        const hotspots = document.querySelectorAll('.hotspot');
        const infoPanel = document.getElementById('info-panel');

        hotspots.forEach(hotspot => {
            // ಮೌಸ್/ಟಚ್ Hover ಇಫೆಕ್ಟ್
            hotspot.addEventListener('mouseenter', function () {
                this.setAttribute('color', '#ef4444'); 
            });

            hotspot.addEventListener('mouseleave', function () {
                this.setAttribute('color', '#eab308'); 
            });

            // ಕ್ಲಿಕ್/ಟಚ್ ಇವೆಂಟ್ ಮತ್ತು ಆಡಿಯೋ ಪ್ಲೇಬ್ಯಾಕ್
            hotspot.addEventListener('click', function () {
                const title = this.getAttribute('data-title');
                const info = this.getAttribute('data-info');
                
                infoPanel.innerHTML = `<strong>${title}</strong><br>${info}`;

                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel(); 
                    
                    const speech = new SpeechSynthesisUtterance();
                    speech.text = title + ". " + info;
                    speech.lang = 'kn-IN'; 
                    speech.rate = 0.85; 
                    
                    window.speechSynthesis.speak(speech);
                }
            });
        });
    </script>
</body>
</html>
