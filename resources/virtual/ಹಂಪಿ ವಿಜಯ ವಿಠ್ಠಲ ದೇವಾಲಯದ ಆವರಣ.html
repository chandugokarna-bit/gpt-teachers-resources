<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ಹಂಪಿ ವಿಜಯ ವಿಠ್ಠಲ ದೇವಾಲಯ ವರ್ಚುವಲ್ ಪ್ರವಾಸ</title>
    <!-- A-Frame VR ಲೈಬ್ರರಿ -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <style>
        /* ಮಾಹಿತಿ ಫಲಕ */
        #info-panel {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            width: 85%; max-width: 650px; background: rgba(24, 24, 27, 0.95); color: #f4f4f5;
            padding: 20px; border-radius: 15px; font-family: sans-serif; text-align: center;
            font-size: 18px; line-height: 1.6; border: 2px solid #eab308; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            z-index: 999; pointer-events: none;
        }
        /* ಶೀರ್ಷಿಕೆ ಫಲಕ */
        #title-panel {
            position: absolute; top: 20px; left: 20px; color: white;
            background: rgba(24, 24, 27, 0.85); padding: 15px; border-radius: 10px;
            border-left: 5px solid #eab308; z-index: 999;
        }
        #title-panel h1 { margin: 0; font-size: 22px; color: #eab308; }
    </style>
</head>
<body>

    <div id="title-panel">
        <h1>ಹಂಪಿ: ವಿಜಯ ವಿಠ್ಠಲ ದೇವಾಲಯದ ಆವರಣ</h1>
        <p>ಚಿನ್ನದ ಬಣ್ಣದ ವರ್ತುಲಗಳ ಮೇಲೆ ನೇರವಾಗಿ ಕ್ಲಿಕ್ ಮಾಡಿ ಆಡಿಯೋ ಮಾಹಿತಿ ಪಡೆಯಿರಿ</p>
    </div>

    <div id="info-panel">
        ಸ್ವಾಗತ! ವಿಜಯ ವಿಠ್ಠಲ ದೇವಾಲಯದ ಅದ್ಭುತ ಶಿಲ್ಪಕಲೆಯನ್ನು ತಿಳಿಯಲು ಆವರಣದಲ್ಲಿರುವ ಚಿನ್ನದ ಬಣ್ಣದ ಹಾಟ್‌ಸ್ಪಾಟ್‌ಗಳ ಮೇಲೆ ಕ್ಲಿಕ್ ಮಾಡಿ...
    </div>

    <!-- ಬ್ರೌಸರ್ ಕ್ಲಿಕ್ ಸಪೋರ್ಟ್ ವ್ಯವಸ್ಥೆ -->
    <a-scene cursor="rayOrigin: mouse">
        <a-assets>
            <img id="hampi-scene" src="https://raw.githubusercontent.com/chandugokarna-bit/gpt-teachers-resources/main/resources/virtual/hampi360.jpg" crossorigin="anonymous">
        </a-assets>

        <!-- ಹಿನ್ನೆಲೆ ಚಿತ್ರ -->
        <a-sky src="#hampi-scene"></a-sky>

        <a-entity camera look-controls position="0 1.6 0"></a-entity>

        <!-- ================= ನಿಮ್ಮ ಹಂಪಿ ಚಿತ್ರಕ್ಕೆ ತಕ್ಕಂತೆ ಹಾಟ್‌ಸ್ಪಾಟ್‌ಗಳ ಜಾಗವನ್ನು ನಿಖರವಾಗಿ ಹೊಂದಿಸಲಾಗಿದೆ ================= -->

        <!-- 1. ಎಡಭಾಗದ ಕಂಬಗಳ ಮಂಟಪ -->
        <a-sphere id="hotspot-left" position="-1.8 0.5 -4" radius="0.3" color="#eab308" class="hotspot"
                  data-title="ಕಲಾತ್ಮಕ ಕಂಬಗಳ ಮಂಟಪ"
                  data-info="ಮಹಾದ್ವಾರದ ಎಡಭಾಗದಲ್ಲಿರುವ ಈ ಆವರಣವು ವಿಜಯನಗರ ಶೈಲಿಯ ಭವ್ಯವಾದ ಕೆತ್ತನೆಗಳಿಂದ ಕೂಡಿದ ಕಂಬಗಳನ್ನು ಹೊಂದಿದೆ. ಇಲ್ಲಿನ ಪ್ರತಿಯೊಂದು ಕಂಬದಲ್ಲೂ ದೇವತೆಗಳು ಮತ್ತು ಪೌರಾಣಿಕ ಜೀವಿಗಳ ಚಿತ್ರಗಳನ್ನು ಕಲಾತ್ಮಕವಾಗಿ ಕೆತ್ತಲಾಗಿದೆ.">
        </a-sphere>

        <!-- 2. ಮುಖ್ಯ ಮಹಾದ್ವಾರ / ರಾಯಗೋಪುರ (ಮಧ್ಯದಲ್ಲಿದೆ) -->
        <a-sphere id="hotspot-center" position="0.2 0.6 -4" radius="0.3" color="#eab308" class="hotspot"
                  data-title="ವಿಠ್ಠಲ ದೇವಾಲಯದ ಮಹಾದ್ವಾರ"
                  data-info="ಇದು ವಿಜಯ ವಿಠ್ಠಲ ದೇವಾಲಯದ ಮುಖ್ಯ ಪ್ರವೇಶ ದ್ವಾರವಾಗಿದೆ. ಇದನ್ನು ರಾಯಗೋಪುರ ಎಂದೂ ಕರೆಯುತ್ತಾರೆ. ಯುದ್ಧ ಮತ್ತು ಕಾಲದ ಹೊಡೆತಕ್ಕೆ ಸಿಲುಕಿ ಇದರ ಮೇಲ್ಭಾಗದ ಗೋಪುರ ಶಿಥಿಲಗೊಂಡಿದ್ದರೂ, ಇದರ ಕಲ್ಲಿನ ತಳಪಾಯದ ಭವ್ಯತೆ ಇಂದಿಗೂ ವಿಜಯನಗರದ ವೈಭವವನ್ನು ಸಾರುತ್ತದೆ.">
        </a-sphere>

        <!-- 3. ಬಲಭಾಗದ ಸಾಲು ಮಂಟಪ -->
        <a-sphere id="hotspot-right" position="2.2 0.3 -4" radius="0.35" color="#eab308" class="hotspot"
                  data-title="ವಿಜಯನಗರದ ವಾಸ್ತುಶಿಲ್ಪ ಶೈಲಿ"
                  data-info="ದೇವಾಲಯದ ಬಲಭಾಗದಲ್ಲಿ ವಿಸ್ತಾರವಾದ ಕಲ್ಲಿನ ಪ್ರಾಕಾರ ಮತ್ತು ಮಂಟಪದ ಸಾಲುಗಳು ಕಾಣಿಸುತ್ತವೆ. ವಿಜಯನಗರದ ಅರಸರು ಕಲಾ ಪೋಷಕರಾಗಿದ್ದು, ಧಾರ್ಮಿಕ ಮತ್ತು ಸಾಂಸ್ಕೃತಿಕ ಸಭೆಗಳನ್ನು ನಡೆಸಲು ಇಂತಹ ಭವ್ಯವಾದ ತೆರೆದ ಮಂಟಪಗಳನ್ನು ಸೃಷ್ಟಿಸುತ್ತಿದ್ದರು.">
        </a-sphere>

    </a-scene>

    <script>
        const hotspots = document.querySelectorAll('.hotspot');
        const infoPanel = document.getElementById('info-panel');

        hotspots.forEach(hotspot => {
            // ಮೌಸ್ Hover ಇಫೆಕ್ಟ್
            hotspot.addEventListener('mouseenter', function () {
                this.setAttribute('color', '#ef4444'); // ಕೆಂಪು ಬಣ್ಣ
            });

            hotspot.addEventListener('mouseleave', function () {
                this.setAttribute('color', '#eab308'); // ಮರಳಿ ಚಿನ್ನದ ಬಣ್ಣ
            });

            // ಕ್ಲಿಕ್ ಇವೆಂಟ್ ಮತ್ತು ಆಡಿಯೋ ಪ್ಲೇಬ್ಯಾಕ್
            hotspot.addEventListener('click', function () {
                const title = this.getAttribute('data-title');
                const info = this.getAttribute('data-info');
                
                infoPanel.innerHTML = `<strong>${title}</strong><br>${info}`;

                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel(); // ಹಳೆಯ ಧ್ವನಿ ನಿಲ್ಲಿಸಲು
                    
                    const speech = new SpeechSynthesisUtterance();
                    speech.text = title + ". " + info;
                    speech.lang = 'kn-IN'; // ಕನ್ನಡ
                    speech.rate = 0.85; // ಸ್ಪಷ್ಟ ಧ್ವನಿ ವೇಗ
                    
                    window.speechSynthesis.speak(speech);
                }
            });
        });
    </script>
</body>
</html>
