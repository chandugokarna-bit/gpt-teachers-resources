<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ಸಂಭ್ರಮ ಶನಿವಾರ - ಪ್ರೀಮಿಯಂ 3D ಸಿಂಗಲ್ ಪೇಜ್ ಆಲ್ಬಮ್</title>
    
    <!-- jQuery ಮತ್ತು Turn.js ಲೈಬ್ರರಿಗಳು (3D ಫ್ಲಿಪ್ ಎಫೆಕ್ಟ್ ಕೆಲಸ ಮಾಡಲು ಅತ್ಯಗತ್ಯ) -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/turn.js/3/turn.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body {
            background-color: #0d1117;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: #fff;
        }

        /* ಮೇಲ್ಭಾಗದ ಹೆಡರ್ */
        .album-header {
            width: 100%;
            text-align: center;
            padding: 15px;
            background: linear-gradient(to right, #161b22, #0d1117, #161b22);
            border-bottom: 2px solid #30363d;
            position: absolute;
            top: 0;
            z-index: 100;
        }
        .album-header h1 {
            font-size: 1.5rem;
            color: #fbbf24;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.5);
        }
        .album-header p {
            font-size: 0.9rem;
            color: #8b949e;
            margin-top: 4px;
        }

        /* ಅಲ್ಟ್ರಾ ಮಾಡರ್ನ್ ಡಿಜಿಟಲ್ ಆಲ್ಬಮ್ ಸ್ಕ್ರೀನ್ ಕಂಟೈನರ್ */
        .modern-theater-screen {
            width: 95vw;
            max-width: 1160px;
            background: #090d16;
            border: 1px solid #1e293b;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            position: relative;
            margin-top: 60px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* ಟಾಪ್ ಬಾರ್ ವಿನ್ಯಾಸ */
        .screen-top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #111827;
            padding: 10px 20px;
            border-radius: 8px;
            border: 1px solid #1f2937;
        }
        .live-indicator {
            font-size: 12px;
            font-weight: bold;
            color: #ef4444;
            display: flex;
            align-items: center;
            gap: 6px;
            letter-spacing: 1px;
        }
        .blink-dot {
            width: 8px;
            height: 8px;
            background-color: #ef4444;
            border-radius: 50%;
            display: inline-block;
            animation: blink 1.5s infinite;
        }
        .screen-branding {
            font-size: 13px;
            color: #fbbf24;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .fullscreen-hint {
            font-size: 12px;
            color: #9ca3af;
        }

        /* ಥಿಯೇಟರ್ ವ್ಯೂಪೋರ್ಟ್ */
        .theater-viewport {
            position: relative;
            background: #020617;
            border-radius: 12px;
            padding: 15px;
            border: 1px solid rgba(251, 191, 36, 0.15);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* ಆಲ್ಬಮ್ ಕಂಟೆಂಟ್ ಹೊಂದಿಕೊಳ್ಳುವ ಬಾಕ್ಸ್ (16:9 ಲ್ಯಾಂಡ್‌ಸ್ಕೇಪ್) */
        .actual-screen-content {
            width: 1000px; 
            height: 562px; 
            max-width: 100%;
            position: relative;
            z-index: 10;
        }

        #flipbook {
            width: 100%;
            height: 100%;
            box-shadow: 0px 20px 50px rgba(0, 0, 0, 0.8);
            background-color: #161b22;
            border-radius: 8px;
        }

        /* ಪ್ರತಿ ಸಿಂಗಲ್ ಪೇಜ್ ಡಿಸೈನ್ */
        #flipbook .page {
            width: 100%;
            height: 100%;
            background-color: #161b22;
            overflow: hidden;
            border-radius: 8px;
        }

        /* ಪಿಪಿಟಿ ಇಮೇಜ್ ಇಡೀ ಲ್ಯಾಂಡ್‌ಸ್ಕೇಪ್ ಸ್ಕ್ರೀನ್ ತುಂಬಿಕೊಳ್ಳಲು */
        #flipbook img {
            width: 100%;
            height: 100%;
            object-fit: fill; 
            display: block;
            cursor: pointer;
        }

        /* ನಿಯಾನ್ ಗ್ಲೋ ಎಫೆಕ್ಟ್‌ಗಳು */
        .glow-effect-top {
            position: absolute;
            top: -50px;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            height: 60px;
            background: radial-gradient(circle, rgba(251, 191, 36, 0.15) 0%, rgba(0,0,0,0) 70%);
            pointer-events: none;
        }
        .glow-effect-bottom {
            position: absolute;
            bottom: -50px;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            height: 60px;
            background: radial-gradient(circle, rgba(251, 191, 36, 0.1) 0%, rgba(0,0,0,0) 70%);
            pointer-events: none;
        }

        /* ಫುಟರ್ ಬಾರ್ ವಿನ್ಯಾಸ */
        .screen-footer-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 5px 10px;
        }
        .theme-tag {
            font-size: 14px;
            font-weight: bold;
            color: #38bdf8;
        }
        .interactive-status {
            font-size: 13px;
            color: #6b7280;
        }

        /* ಬ್ಲಿಂಕ್ ಅನಿಮೇಷನ್ */
        @keyframes blink {
            0% { opacity: 0.2; }
            50% { opacity: 1; }
            100% { opacity: 0.2; }
        }
    </style>
</head>
<body>

    <!-- ಆಲ್ಬಮ್ ಟೈಟಲ್ ಹೆಡರ್ -->
    <div class="album-header">
        <h1>🎉 ಸಂಭ್ರಮ ಶನಿವಾರ - ಪ್ರೀಮಿಯಂ 3D ಸಿಂಗಲ್ ಪೇಜ್ ಆಲ್ಬಮ್</h1>
        <p>ವಿಷಯ: ಮಾದಕ ವಸ್ತುಗಳ ದುರುಪಯೋಗ ತಡೆಗಟ್ಟುವಿಕೆ ಮತ್ತು ನಿರ್ವಹಣೆ</p>
    </div>

    <!-- ಮಾಡರ್ನ್ ಥಿಯೇಟರ್ ಸ್ಕ್ರೀನ್ ಕಂಟೈನರ್ -->
    <div class="modern-theater-screen">
        <div class="screen-top-bar">
            <div class="live-indicator">
                <span class="blink-dot"></span> 3D LIVE MODE
            </div>
            <div class="screen-branding">ಜಿಪಿಟಿ ಶಿಕ್ಷಕರ ಶೈಕ್ಷಣಿಕ ಸಂಪನ್ಮೂಲಗಳು, ಉತ್ತರ ಕನ್ನಡ</div>
            <div class="fullscreen-hint">💡 Use Keyboard ❮ ❯ to Flip</div>
        </div>

        <div class="theater-viewport">
            <div class="glow-effect-top"></div>
            
            <div class="actual-screen-content">
                <!-- 3D ಫ್ಲಿಪ್ ಬುಕ್ ಬ್ಲಾಕ್ -->
                <div id="flipbook">
                    <div><img src="https://raw.githubusercontent.com/chandugokarna-bit/gpt-teachers-resources/main/resources/sambrama/july/Slide1.JPG" alt="Slide 1"></div>
                    <div><img src="https://raw.githubusercontent.com/chandugokarna-bit/gpt-teachers-resources/main/resources/sambrama/july/Slide2.JPG" alt="Slide 2"></div>
                    <div><img src="https://raw.githubusercontent.com/chandugokarna-bit/gpt-teachers-resources/main/resources/sambrama/july/Slide3.JPG" alt="Slide 3"></div>
                    <div><img src="https://raw.githubusercontent.com/chandugokarna-bit/gpt-teachers-resources/main/resources/sambrama/july/Slide4.JPG" alt="Slide 4"></div>
                    <div><img src="https://raw.githubusercontent.com/chandugokarna-bit/gpt-teachers-resources/main/resources/sambrama/july/Slide5.JPG" alt="Slide 5"></div>
                    <div><img src="https://raw.githubusercontent.com/chandugokarna-bit/gpt-teachers-resources/main/resources/sambrama/july/Slide6.JPG" alt="Slide 6"></div>
                    <div><img src="https://raw.githubusercontent.com/chandugokarna-bit/gpt-teachers-resources/main/resources/sambrama/july/Slide7.JPG" alt="Slide 7"></div>
                    <div><img src="https://raw.githubusercontent.com/chandugokarna-bit/gpt-teachers-resources/main/resources/sambrama/july/Slide8.JPG" alt="Slide 8"></div>
                    <div><img src="https://raw.githubusercontent.com/chandugokarna-bit/gpt-teachers-resources/main/resources/sambrama/july/Slide9.JPG" alt="Slide 9"></div>
                    <div><img src="https://raw.githubusercontent.com/chandugokarna-bit/gpt-teachers-resources/main/resources/sambrama/july/Slide10.JPG" alt="Slide 10"></div>
                    <div><img src="https://raw.githubusercontent.com/chandugokarna-bit/gpt-teachers-resources/main/resources/sambrama/july/Slide11.JPG" alt="Slide 11"></div>
                    <div><img src="https://raw.githubusercontent.com/chandugokarna-bit/gpt-teachers-resources/main/resources/sambrama/july/Slide12.JPG" alt="Slide 12"></div>
                </div>
            </div>

            <div class="glow-effect-bottom"></div>
        </div>

        <div class="screen-footer-bar">
            <div class="theme-tag">🎉 ಸಂಭ್ರಮ ಶನಿವಾರ ಆಕ್ಟಿವಿಟಿ</div>
            <div class="interactive-status">🖱️ Click on image corners to turn pages</div>
        </div>
    </div>

    <!-- ಜಾವಾಸ್ಕ್ರಿಪ್ಟ್ ಆಕ್ಷನ್ ಕೋಡ್ -->
    <script type="text/javascript">
        $(document).ready(function() {
            // Turn.js ಇನಿಶಿಯಲೈಸೇಶನ್
            $("#flipbook").turn({
                display: 'single', 
                width: 1000,
                height: 562, 
                autoCenter: true,
                duration: 900, 
                acceleration: true
            });

            // ಚಿತ್ರದ ಮೇಲೆ ಕ್ಲಿಕ್ ಮಾಡಿದಾಗ ಪುಟ ಬದಲಾಗುವ ಸ್ಮಾರ್ಟ್ ಫಂಕ್ಷನ್ (ಬಟನ್ ಗಳಿಲ್ಲದೆ)
            $("#flipbook").bind("click", function(e) {
                var bookOffset = $(this).offset();
                var clickX = e.pageX - bookOffset.left;
                
                // ಬಲಗಡೆ ಕ್ಲಿಕ್ ಮಾಡಿದರೆ ಮುಂದಕ್ಕೆ, ಎಡಗಡೆ ಕ್ಲಿಕ್ ಮಾಡಿದರೆ ಹಿಂದಕ್ಕೆ
                if (clickX > $(this).width() / 2) {
                    $("#flipbook").turn("next");
                } else {
                    $("#flipbook").turn("previous");
                }
            });
        });

        // ಕೀಬೋರ್ಡ್ ಶಾರ್ಟ್ ಕಟ್ ನಿಯಂತ್ರಣ
        $(window).bind('keydown', function(e){
            if (e.keyCode == 37) {
                $('#flipbook').turn('previous');
            } else if (e.keyCode == 39) {
                $('#flipbook').turn('next');
            }
        });
    </script>

</body>
</html>
