<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comparing Integers</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f4c3;
            margin: 0;
            padding: 20px;
            color: #333;
            text-align: center;
        }
        .container {
            max-width: 850px;
            margin: 0 auto;
            background-color: #ffffff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            border-top: 8px solid #c0ca33;
        }
        h1 {
            color: #827717;
            font-size: 32px;
            margin-bottom: 10px;
        }
        p.desc {
            font-size: 18px;
            color: #555;
            margin-bottom: 20px;
        }
        .rules {
            background-color: #f9fbe7;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 25px;
            font-size: 18px;
            font-weight: bold;
            border: 2px dashed #c0ca33;
            color: #558b2f;
        }
        
        /* Game Area */
        .game-area {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
            font-size: 40px;
            font-weight: bold;
        }
        .number-box {
            background-color: #e3f2fd;
            color: #1565c0;
            padding: 20px 40px;
            border-radius: 15px;
            border: 3px solid #64b5f6;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            min-width: 80px;
        }
        .symbol-box {
            color: #d84315;
            font-size: 50px;
            width: 60px;
        }

        /* Buttons */
        .btn-group {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
        }
        .btn-symbol {
            background-color: #ff9800;
            color: white;
            font-size: 30px;
            font-weight: bold;
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        .btn-symbol:hover { background-color: #f57c00; transform: scale(1.05); }
        .btn-symbol:active { transform: scale(0.95); }
        .btn-next {
            background-color: #4caf50;
            color: white;
            font-size: 20px;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            display: none;
            margin: 20px auto 0 auto;
            font-weight: bold;
        }
        .btn-next:hover { background-color: #388e3c; }

        /* Canvas Area */
        .canvas-container {
            display: none;
            margin-top: 20px;
            animation: fadeIn 0.5s;
        }
        canvas {
            background-color: #fafafa;
            border: 2px solid #ccc;
            border-radius: 10px;
            width: 100%;
            max-width: 800px;
            height: 150px;
        }
        #feedback {
            font-size: 22px;
            font-weight: bold;
            margin-top: 20px;
            min-height: 30px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>⚖️ Large and Small Integers 🔢</h1>
        <p class="desc">Choose the correct symbol (>, <, =) and learn the reason through the number line!</p>

        <div class="rules">
            💡 <b>Remember:</b> Whichever number is on the <b>right side</b> of the number line is the larger number!
        </div>

        <div class="game-area">
            <div class="number-box" id="num1">-5</div>
            <div class="symbol-box" id="symbolDisplay">?</div>
            <div class="number-box" id="num2">2</div>
        </div>

        <div class="btn-group" id="btnGroup">
            <button class="btn-symbol" onclick="checkAnswer('>')"> > </button>
            <button class="btn-symbol" onclick="checkAnswer('=')"> = </button>
            <button class="btn-symbol" onclick="checkAnswer('<')"> < </button>
        </div>

        <div id="feedback"></div>

        <div class="canvas-container" id="visualizer">
            <canvas id="numberLine" width="800" height="150"></canvas>
            <button class="btn-next" id="nextBtn" onclick="generateQuestion()">Next Question ➡️</button>
        </div>
    </div>

    <script>
        let currentNum1 = 0;
        let currentNum2 = 0;

        window.onload = function() {
            generateQuestion();
        };

        function generateQuestion() {
            // Generate numbers between -15 and 15
            currentNum1 = Math.floor(Math.random() * 31) - 15;
            currentNum2 = Math.floor(Math.random() * 31) - 15;

            // Ensure we don't always get equals
            if (Math.random() > 0.1 && currentNum1 === currentNum2) {
                currentNum2 += 2;
            }

            // Update UI
            document.getElementById("num1").innerText = currentNum1;
            document.getElementById("num2").innerText = currentNum2;
            document.getElementById("symbolDisplay").innerText = "?";
            document.getElementById("symbolDisplay").style.color = "#d84315";
            
            document.getElementById("feedback").innerText = "";
            document.getElementById("visualizer").style.display = "none";
            document.getElementById("nextBtn").style.display = "none";
            
            // Enable buttons
            let btns = document.querySelectorAll(".btn-symbol");
            btns.forEach(btn => btn.disabled = false);
        }

        function checkAnswer(selectedSymbol) {
            let correctSymbol = "";
            if (currentNum1 > currentNum2) correctSymbol = ">";
            else if (currentNum1 < currentNum2) correctSymbol = "<";
            else correctSymbol = "=";

            let feedback = document.getElementById("feedback");
            let symbolDisplay = document.getElementById("symbolDisplay");

            symbolDisplay.innerText = selectedSymbol;

            if (selectedSymbol === correctSymbol) {
                feedback.innerHTML = "✅ <b>Wonderful! Correct answer.</b> Observe the number line below.";
                feedback.style.color = "#2e7d32";
                symbolDisplay.style.color = "#2e7d32";
            } else {
                feedback.innerHTML = `❌ <b>Incorrect!</b> The correct symbol is <b>${correctSymbol}</b>. Look at the number line below to understand.`;
                feedback.style.color = "#c62828";
                symbolDisplay.innerText = correctSymbol;
                symbolDisplay.style.color = "#c62828";
            }

            // Disable buttons
