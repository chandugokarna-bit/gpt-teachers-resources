<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Neon Arena - Say the Right Thing</title>
    <style>
        :root {
            --bg-glow: #020205;
            --panel-bg: rgba(10, 8, 22, 0.9);
            --neon-blue: #00f0ff;
            --neon-green: #39ff14;
            --neon-pink: #ff007f;
            --neon-yellow: #fff000;
            --text-main: #ffffff;
            --text-sub: #a0a5c0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        body {
            background: radial-gradient(circle at center, #0f1c3f 0%, var(--bg-glow) 100%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        header {
            text-align: center;
            padding: 20px;
            background: rgba(5, 3, 10, 0.95);
            border-bottom: 3px solid var(--neon-blue);
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.4);
        }

        header h1 {
            font-size: 2.3rem;
            color: var(--neon-blue);
            text-shadow: 0 0 15px var(--neon-blue);
            letter-spacing: 2px;
        }

        .main-container {
            display: flex;
            flex: 1;
            padding: 25px;
            gap: 25px;
            max-width: 1600px;
            margin: 0 auto;
            width: 100%;
        }

        /* Sidebar System */
        .sidebar {
            width: 340px;
            background: var(--panel-bg);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(0, 240, 255, 0.15);
            border-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
        }

        .sidebar h2 {
            font-size: 1.2rem;
            color: var(--neon-pink);
            text-transform: uppercase;
            letter-spacing: 2px;
            text-align: center;
            text-shadow: 0 0 10px var(--neon-pink);
            margin-bottom: 10px;
        }

        .nav-btn {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 15px 18px;
            border-radius: 12px;
            color: var(--text-sub);
            text-align: left;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.2, 1, 0.2, 1);
            font-size: 0.95rem;
        }

        .nav-btn:hover {
            border-color: var(--neon-blue);
            color: var(--neon-blue);
            background: rgba(0, 240, 255, 0.08);
            transform: translateX(8px);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.25);
        }

        .nav-btn.active {
            background: linear-gradient(90deg, rgba(0, 240, 255, 0.25), transparent);
            border-left: 5px solid var(--neon-blue);
            color: #ffffff;
            font-weight: bold;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.15);
        }

        /* Display Arena */
        .arena-display {
            flex: 1;
            background: var(--panel-bg);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(0, 240, 255, 0.15);
            border-radius: 20px;
            padding: 35px;
            position: relative;
            box-shadow: 0 20px 50px rgba(0,0,0,0.7);
            display: flex;
            flex-direction: column;
        }

        .score-board {
            position: absolute;
            top: 25px;
            right: 35px;
            background: rgba(255, 255, 255, 0.05);
            padding: 10px 22px;
            border-radius: 30px;
            border: 1px solid var(--neon-pink);
            font-weight: bold;
            color: var(--neon-pink);
            text-shadow: 0 0 10px var(--neon-pink);
        }

        .progress-indicator { color: var(--neon-yellow); font-size: 0.9rem; margin-bottom: 8px; font-weight: bold; letter-spacing: 1px; }
        .game-header { border-bottom: 1px dashed rgba(255, 255, 255, 0.1); padding-bottom: 15px; margin-bottom: 25px; }
        .game-title { font-size: 2rem; color: var(--neon-green); text-shadow: 0 0 10px var(--neon-green); margin-bottom: 5px; }
        .game-desc { color: var(--text-sub); font-style: italic; }
        .content-box { background: rgba(0, 0, 0, 0.5); border: 1px solid rgba(255, 255, 255, 0.05); padding: 30px; border-radius: 16px; margin-bottom: 25px; flex: 1; }
        .q-text { font-size: 1.25rem; margin-bottom: 20px; line-height: 1.6; }

        /* Component Styles */
        .scrambled-box { font-size: 1.8rem; color: var(--neon-pink); letter-spacing: 4px; font-weight: bold; margin-bottom: 20px; text-shadow: 0 0 8px rgba(255,0,127,0.4); }
        .input-field { background: rgba(0,0,0,0.7); border: 1px solid rgba(255,255,255,0.15); padding: 15px; border-radius: 10px; color: white; width: 100%; font-size: 1.1rem; outline: none; }
        .input-field:focus { border-color: var(--neon-blue); box-shadow: 0 0 10px rgba(0,240,255,0.3); }
        
        /* FIXED MCQ BUTTONS WITH FULL CLICK EVENT MAPPING */
        .mcq-grid { display: grid; grid-template-columns: 1fr; gap: 12px; margin-top: 15px; }
        .mcq-card { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.12); padding: 18px 22px; border-radius: 12px; cursor: pointer; transition: all 0.2s ease; font-size: 1.1rem; color: var(--text-main); text-align: left; }
        .mcq-card:hover { border-color: var(--neon-blue); background: rgba(0,240,255,0.06); transform: translateY(-2px); }
        .mcq-card.active { border-color: var(--neon-blue); background: rgba(0,240,255,0.18); box-shadow: 0 0 12px rgba(0,240,255,0.3); font-weight: bold; }
        
        .quantum-select { background: #0b071e; color: white; border: 1px solid var(--neon-blue); padding: 12px; border-radius: 8px; font-size: 1.1rem; width: 100%; outline: none; }
        
        /* Drag Drop */
        .drag-container { display: flex; flex-direction: column; gap: 20px; }
        .drag-box-pool { display: flex; flex-wrap: wrap; gap: 15px; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.08); padding: 15px; border-radius: 12px; min-height: 70px; }
        .drop-target-box { background: rgba(0, 240, 255, 0.02); border: 2px dashed var(--neon-blue); padding: 25px; border-radius: 12px; text-align: center; font-size: 1.2rem; transition: 0.3s; user-select: none;}
        .drop-target-box.drag-over { background: rgba(0, 240, 255, 0.15); border-style: solid; }
        .drag-item { background: #160f30; border: 1px solid var(--neon-blue); padding: 10px 22px; border-radius: 8px; cursor: move; font-weight: bold; user-select: none; }

        /* True False */
        .tf-grid { display: flex; gap: 20px; }
        .tf-btn { flex: 1; padding: 20px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.03); font-size: 1.2rem; font-weight: bold; cursor: pointer; color: white; text-align: center; transition: 0.2s; }
        .tf-btn:hover { border-color: var(--neon-blue); background: rgba(0,240,255,0.04); }
        .tf-btn.selected { background: rgba(255,170,0,0.2); border-color: var(--neon-yellow); color: var(--neon-yellow); box-shadow: 0 0 10px rgba(255,240,0,0.2); }

        /* Sentence Sniper */
        .sniper-pool { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 20px; }
        .sniper-word { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.15); padding: 10px 20px; border-radius: 8px; cursor: pointer; font-size: 1.1rem; }
        .sniper-word:hover { border-color: var(--neon-green); color: var(--neon-green); background: rgba(57,255,20,0.05); }
        .built-sentence { min-height: 55px; background: rgba(0,0,0,0.3); border-bottom: 2px solid var(--neon-green); margin-bottom: 20px; padding: 10px; font-size: 1.3rem; display: flex; gap: 8px; align-items: center; border-radius: 6px; }

        /* Dialogue Chat */
        .chat-container { display: flex; flex-direction: column; gap: 15px; max-height: 300px; overflow-y: auto; padding: 10px; }
        .chat-bubble { max-width: 80%; padding: 12px 18px; border-radius: 15px; line-height: 1.4; font-size: 1.05rem; }
        .chat-bubble.left { background: #150d2a; align-self: flex-start; border-bottom-left-radius: 2px; border: 1px solid rgba(255,255,255,0.05); }

        /* Pair Matcher */
        .pair-container { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 15px; }
        .pair-column { display: flex; flex-direction: column; gap: 10px; }
        .pair-node { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); padding: 12px; border-radius: 8px; cursor: pointer; transition: 0.2s; min-height: 50px; display: flex; align-items: center; user-select: none; }
        .pair-node:hover { border-color: var(--neon-yellow); background: rgba(255,240,0,0.05); }
        .pair-node.selected { background: rgba(255,240,0,0.2); border-color: var(--neon-yellow); box-shadow: 0 0 8px rgba(255,240,0,0.3); }
        .pair-node.matched { background: rgba(57,255,20,0.1); border-color: var(--neon-green); cursor: not-allowed; opacity: 0.6; }

        /* Actions */
        .action-btn { background: linear-gradient(135deg, #ff007f, #00f0ff); border: none; color: white; padding: 15px 35px; border-radius: 10px; cursor: pointer; font-weight: bold; letter-spacing: 1px; transition: all 0.3s; box-shadow: 0 5px 25px rgba(255, 0, 127, 0.4); align-self: flex-start; }
        .action-btn:hover { transform: translateY(-3px); box-shadow: 0 8px 30px rgba(255, 0, 127, 0.6); }
        .feedback-txt { margin-top: 20px; font-weight: bold; font-size: 1.15rem; min-height: 30px; }
    </style>
</head>
<body>

    <header>
        <h1>GPT TEACHERS EDUCATIONAL RESOURCES, UTTARA KANNADA</h1>
        <p>Active Framework: Unit 2 Lesson 3 - Say the Right Thing </p>
    </header>

    <div class="main-container">
        <div class="sidebar">
            <h2>Active Game Engines</h2>
            <button class="nav-btn active" id="btn-a1" onclick="loadUniverseEngine(1)">🧩 1. Word Puzzle Arena</button>
            <button class="nav-btn" id="btn-a2" onclick="loadUniverseEngine(2)">🎯 2. Sentence Sniper</button>
            <button class="nav-btn" id="btn-a3" onclick="loadUniverseEngine(3)">🔍 3. Hidden Clue Explorer</button>
            <button class="nav-btn" id="btn-a4" onclick="loadUniverseEngine(4)">🎡 4. Language Fun Fair</button>
            <button class="nav-btn" id="btn-a5" onclick="loadUniverseEngine(5)">🚂 5. Grammar Express</button>
            <button class="nav-btn" id="btn-a6" onclick="loadUniverseEngine(6)">🏕️ 6. Jungle Adventure</button>
            <button class="nav-btn" id="btn-a7" onclick="loadUniverseEngine(7)">🎭 7. Dialogue Theatre</button>
            <button class="nav-btn" id="btn-a8" onclick="showScienceLab()">🧪 8. Language Science Lab</button>
        </div>

        <div class="arena-display">
            <div class="score-board">GLOBAL XP: <span id="xp-global">0</span></div>
            <div class="progress-indicator" id="progress-indicator">Node Question 1 of 5</div>
            
            <div class="game-header">
                <div class="game-title" id="arena-title">Loading Framework...</div>
                <div class="game-desc" id="arena-desc">Booting data files...</div>
            </div>

            <div class="content-box" id="arena-body"></div>

            <button class="action-btn" id="submit-btn" onclick="evaluateActiveBlock()">VERIFY SUBMISSION NODE</button>
            <div id="arena-feedback" class="feedback-txt"></div>
        </div>
    </div>

    <script>
        // Synchronized Dynamic Audio Elements Engine
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playSound(type) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'success') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(587.33, audioCtx.currentTime); 
                osc.frequency.setValueAtTime(880.00, audioCtx.currentTime + 0.12); 
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.35);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.35);
            } else if (type === 'error') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(130, audioCtx.currentTime); 
                osc.frequency.setValueAtTime(90, audioCtx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            }
        }

        // Voice Engine Speech Link
        function speakAnswer(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance("Correct! The answer is " + text);
                utterance.lang = 'en-US';
                utterance.rate = 0.95;
                window.speechSynthesis.speak(utterance);
            }
        }

        // Full Syllabus Curricular Data Node for Lesson: Say the Right Thing
        const universeMatrix = {
            1: {
                title: "Word Puzzle Arena (Word Unscramble)",
                desc: "Reassemble scrambled letters to discover communication and courtesy keywords.",
                items: [
                    { scrambled: "M A N N E R S", question: "Social behaviors and guidelines for speaking politely:", answer: "manners" },
                    { scrambled: "G U E S T S", question: "The visitors (like Mrs. Harding and Mrs. Lee) who arrive at the house:", answer: "guests" },
                    { scrambled: "C O U R T E S Y", question: "Showing perfect polite behavior and respect to others:", answer: "courtesy" },
                    { scrambled: "R E M A R K S", question: "The spoken comments made during a conversation loop:", answer: "remarks" },
                    { scrambled: "A W K W A R D", question: "The embarrassing feeling when someone says the wrong thing:", answer: "awkward" }
                ],
                engine: "puzzle"
            },
            2: {
                title: "Sentence Sniper (Sentence Builder)",
                desc: "Target the text segments in the exact order to build valid dialogue lines.",
                items: [
                    { question: "Assemble Mrs. Shaw's instruction line:", segments: ["Always", "say", "the", "right", "thing", "to", "guests"], answer: "Always say the right thing to guests" },
                    { question: "Reconstruct Mary's overconfident declaration:", segments: ["I", "know", "exactly", "how", "to", "behave"], answer: "I know exactly how to behave" },
                    { question: "Formulate the visitors arrival update statement:", segments: ["The", "two", "guests", "walked", "into", "the", "room"], answer: "The two guests walked into the room" },
                    { question: "Assemble the awkward comment structure:", segments: ["Mary", "made", "a", "very", "funny", "remark"], answer: "Mary made a very funny remark" },
                    { question: "Reconstruct the play's main lesson rule:", segments: ["Think", "twice", "before", "you", "speak", "out"], answer: "Think twice before you speak out" }
                ],
                engine: "sniper"
            },
            3: {
                title: "Hidden Clue Explorer (Dropdown Matrix)",
                desc: "Uncover correct narrative answers using the interactive drop menu controls.",
                items: [
                    { question: "Who gave strict social behavioral instructions to Mary?", opts: ["Mrs. Shaw", "Mrs. Harding", "Mrs. Lee"], answer: "Mrs. Shaw" },
                    { question: "Who were the two prominent women who visited the household scene?", opts: ["Mrs. Harding and Mrs. Lee", "Mary and Sarah", "Mrs. Dolittle and Sister"], answer: "Mrs. Harding and Mrs. Lee" },
                    { question: "How did Mary feel about handling the social interaction before the guests arrived?", opts: ["Extremely confident", "Terrified and crying", "Bored"], answer: "Extremely confident" },
                    { question: "What was the overall tone generated by Mary's literal remarks?", opts: ["Humorous and awkward", "Extremely sad", "Furious and violent"], answer: "Humorous and awkward" },
                    { question: "What does the play emphasize as a valuable conversational skill?", opts: ["Saying whatever comes to mind", "Thinking about the impact of your words", "Remaining completely silent"], answer: "Thinking about the impact of your words" }
                ],
                engine: "dropdown"
            },
            4: {
                title: "Language Fun Fair (Neon MCQ Deck)",
                desc: "Lock configuration choices regarding figures of speech and comprehension indices.",
                items: [
                    { question: "When Mary takes instructions too literally, it creates what type of situational effect?", opts: ["Tragic climax", "Irony and Ironical Humour", "Scientific discovery", "Grammatical syntax error"], answer: "Irony and Ironical Humour" },
                    { question: "Identify the proper noun from the play's participant list:", opts: ["lady", "guests", "Mary", "house"], answer: "Mary" },
                    { question: "What phrase best matches the expression 'to save face' in a conversation?", opts: ["To wash one's face", "To avoid humiliation or embarrassment", "To buy a beautiful mask", "To look directly into a mirror"], answer: "To avoid humiliation or embarrassment" },
                    { question: "What part of speech is 'politely' inside: 'She greeted them politely'?", opts: ["Noun", "Adjective", "Adverb", "Preposition"], answer: "Adverb" },
                    { question: "What is the primary objective of a play's stage directions?", opts: ["To give spelling lists", "To guide actors' movements and expressions", "To list the price of the book", "To write letters to the publisher"], answer: "To guide actors' movements and expressions" }
                ],
                engine: "mcq"
            },
            5: {
                title: "Grammar Express (Preposition Wagon Drag & Drop)",
                desc: "Drag the accurate structural links from competing options into the drop terminal.",
                items: [
                    { question: "Mary stood confidently ______ her mother before the party.", allOptions: ["beside", "through", "under", "between"], answer: "beside" },
                    { question: "The visitors walked directly ______ the elegant sitting room.", allOptions: ["into", "onto", "above", "against"], answer: "into" },
                    { question: "Mrs. Shaw gave a sigh of relief ______ the visit ended.", allOptions: ["after", "during", "between", "under"], answer: "after" },
                    { question: "You must listen ______ the instructions very carefully.", allOptions: ["to", "for", "with", "at"], answer: "to" },
                    { question: "Mary looked straight ______ Mrs. Harding's eyes.", allOptions: ["into", "on", "over", "through"], answer: "into" }
                ],
                engine: "dragdrop"
            },
            6: {
                title: "Jungle Adventure (True / False Grid)",
                desc: "Isolate true or false tactical assessments to secure survival badges.",
                items: [
                    { question: "Mary followed her mother's advice in a highly flexible and socially smart manner.", state: false, txtAnswer: "False" },
                    { question: "Mrs. Harding and Mrs. Lee were highly amused and relaxed by all of Mary's remarks.", state: false, txtAnswer: "False" },
                    { question: "Stage hints help to understand the environment setting and mood of the characters.", state: true, txtAnswer: "True" },
                    { question: "The central play teaches us that literal obedience without social understanding can cause awkwardness.", state: true, txtAnswer: "True" },
                    { question: "Mrs. Shaw was completely relaxed throughout the entire duration of the visitors' stay.", state: false, txtAnswer: "False" }
                ],
                engine: "boolean"
            },
            7: {
                title: "Dialogue Theatre (Interactive Chat Simulation)",
                desc: "Choose the best contextual responses to balance the theatrical scene.",
                items: [
                    { context: "Mrs. Shaw: 'Now Mary, when the guests arrive, remember to speak pleasantly.'", prompt: "Choose Mary's overconfident reply state:", opts: ["'Don't worry mother, I will say exactly the right thing.'", "'I don't want to talk to anyone today.'"], answer: "'Don't worry mother, I will say exactly the right thing.'" },
                    { context: "Mrs. Harding: 'What a lovely house you have here, Mrs. Shaw.'", prompt: "Choose Mary's awkwardly literal intervention remark:", opts: ["'Mother says it takes too much money to keep it clean.'", "'Thank you, we enjoy living here very much.'"], answer: "Mother says it takes too much money to keep it clean." },
                    { context: "Mrs. Lee: 'Mary is growing up fast. She looks just like her aunt.'", prompt: "Choose Mary's literal response filter node:", opts: ["'But mother says my aunt talks too much!'", "'Thank you for the kind compliment, ma'am.'"], answer: "'But mother says my aunt talks too much!'" },
                    { context: "Mrs. Shaw: (Nervously changing subject) 'Would you ladies care for some hot tea?'", prompt: "Choose Mrs. Harding's social response choice:", opts: ["'That would be lovely, thank you, Mrs. Shaw.'", "'No, Mary's remarks have made us very uncomfortable.'"], answer: "'That would be lovely, thank you, Mrs. Shaw.'" },
                    { context: "Mrs. Shaw: (After guests leave) 'Oh Mary! Why did you say those awkward things?'", prompt: "Choose Mary's confused literal justification line:", opts: ["'But mother, you told me to always tell the absolute truth!'", "'I wanted to make them run away from our house.'"], answer: "'But mother, you told me to always tell the absolute truth!'" }
                ],
                engine: "dialogue"
            }
        };

        let activeEngineIndex = 1;
        let activeNodeIndex = 0;
        let globalXP = 0;
        
        window.draggedValue = "";
        window.droppedValue = "";
        window.selectedMCQValue = "";
        window.selectedBooleanState = null;
        window.selectedDialogueAns = "";
        let selectedLeftNode = null;
        let selectedRightNode = null;

        function loadUniverseEngine(engineId) {
            activeEngineIndex = engineId;
            activeNodeIndex = 0;
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-a' + engineId).classList.add('active');
            renderActiveNode();
        }

        function renderActiveNode() {
            const matrixBlock = universeMatrix[activeEngineIndex];
            document.getElementById('arena-title').innerText = matrixBlock.title;
            document.getElementById('arena-desc').innerText = matrixBlock.desc;
            document.getElementById('arena-feedback').innerText = "";
            document.getElementById('submit-btn').style.display = "block";
            document.getElementById('progress-indicator').innerText = `Node Question ${activeNodeIndex + 1} of ${matrixBlock.items.length}`;

            const nodeItem = matrixBlock.items[activeNodeIndex];
            const displayFrame = document.getElementById('arena-body');
            displayFrame.innerHTML = "";

            if (matrixBlock.engine === "puzzle") {
                displayFrame.innerHTML = `
                    <p class="q-text">${nodeItem.question}</p>
                    <div class="scrambled-box">${nodeItem.scrambled}</div>
                    <input type="text" id="puzzle-node-input" class="input-field" placeholder="Decrypt the unscrambled word matrix...">
                `;
            } 
            else if (matrixBlock.engine === "sniper") {
                displayFrame.innerHTML = `
                    <p class="q-text">${nodeItem.question}</p>
                    <div class="built-sentence" id="built-sentence-zone"></div>
                    <div class="sniper-pool" id="sniper-pool-zone"></div>
                `;
                let currentBuild = [];
                let shuffled = [...nodeItem.segments].sort(() => Math.random() - 0.5);
                shuffled.forEach(word => {
                    let wordBtn = document.createElement('div');
                    wordBtn.className = "sniper-word";
                    wordBtn.innerText = word;
                    wordBtn.onclick = () => {
                        currentBuild.push(word);
                        document.getElementById('built-sentence-zone').innerText = currentBuild.join(" ");
                        wordBtn.style.display = "none";
                    };
                    document.getElementById('sniper-pool-zone').appendChild(wordBtn);
                });
            }
            else if (matrixBlock.engine === "dropdown") {
                let optionsHtml = nodeItem.opts.map(o => `<option value="${o}">${o}</option>`).join("");
                displayFrame.innerHTML = `
                    <p class="q-text">${nodeItem.question}</p>
                    <select id="dropdown-node-select" class="quantum-select">
                        <option value="">-- SELECT CLUE DATA VECTOR --</option>
                        ${optionsHtml}
                    </select>
                `;
            }
            else if (matrixBlock.engine === "mcq") {
                displayFrame.innerHTML = `<p class="q-text">${nodeItem.question}</p><div class="mcq-grid" id="mcq-zone"></div>`;
                window.selectedMCQValue = "";
                nodeItem.opts.forEach(o => {
                    let card = document.createElement('button');
                    card.className = "mcq-card";
                    card.innerText = o;
                    card.onclick = () => {
                        document.querySelectorAll('.mcq-card').forEach(c => c.classList.remove('active'));
                        card.classList.add('active');
                        window.selectedMCQValue = o;
                    };
                    document.getElementById('mcq-zone').appendChild(card);
                });
            }
            else if (matrixBlock.engine === "dragdrop") {
                window.droppedValue = "";
                displayFrame.innerHTML = `
                    <p class="q-text">${nodeItem.question}</p>
                    <div class="drag-container">
                        <div class="drag-box-pool" id="drag-pool-box"></div>
                        <div class="drop-target-box" id="drop-target-zone">Drop your chosen preposition answer here...</div>
                    </div>
                `;
                
                let targetZone = document.getElementById('drop-target-zone');
                targetZone.addEventListener('dragover', (e) => { e.preventDefault(); targetZone.classList.add('drag-over'); });
                targetZone.addEventListener('dragleave', () => { targetZone.classList.remove('drag-over'); });
                targetZone.addEventListener('drop', (e) => {
                    e.preventDefault();
                    targetZone.classList.remove('drag-over');
                    window.droppedValue = window.draggedValue;
                    targetZone.innerText = "Loaded Target: " + window.droppedValue;
                    targetZone.style.borderColor = "var(--neon-green)";
                });

                nodeItem.allOptions.forEach((opt) => {
                    let dragItem = document.createElement('div');
                    dragItem.className = "drag-item";
                    dragItem.draggable = true;
                    dragItem.innerText = opt;
                    dragItem.addEventListener('dragstart', () => { window.draggedValue = opt; });
                    document.getElementById('drag-pool-box').appendChild(dragItem);
                });
            }
            else if (matrixBlock.engine === "boolean") {
                displayFrame.innerHTML = `
                    <p class="q-text">${nodeItem.question}</p>
                    <div class="tf-grid">
                        <button class="tf-btn" id="tf-t" onclick="setBooleanState(true)">TRUE / DATA VALID</button>
                        <button class="tf-btn" id="tf-f" onclick="setBooleanState(false)">FALSE / ANOMALY</button>
                    </div>
                `;
                window.selectedBooleanState = null;
            }
            else if (matrixBlock.engine === "dialogue") {
                displayFrame.innerHTML = `
                    <div class="chat-container">
                        <div class="chat-bubble left">${nodeItem.context}</div>
                    </div>
                    <p class="q-text" style="margin-top:15px; color:var(--neon-pink);">${nodeItem.prompt}</p>
                    <div class="mcq-grid" id="dialogue-choices"></div>
                `;
                window.selectedDialogueAns = "";
                nodeItem.opts.forEach(o => {
                    let card = document.createElement('button');
                    card.className = "mcq-card";
                    card.innerText = o;
                    card.onclick = () => {
                        document.querySelectorAll('.mcq-card').forEach(c => c.classList.remove('active'));
                        card.classList.add('active');
                        window.selectedDialogueAns = o;
                    };
                    document.getElementById('dialogue-choices').appendChild(card);
                });
            }
        }

        function setBooleanState(state) {
            window.selectedBooleanState = state;
            document.getElementById('tf-t').className = 'tf-btn';
            document.getElementById('tf-f').className = 'tf-btn';
            if(state) document.getElementById('tf-t').classList.add('selected');
            else document.getElementById('tf-f').classList.add('selected');
        }

        function evaluateActiveBlock() {
            const matrixBlock = universeMatrix[activeEngineIndex];
            const nodeItem = matrixBlock.items[activeNodeIndex];
            let isVerified = false;
            let speechTarget = ""; 
            let feedback = document.getElementById('arena-feedback');

            if (matrixBlock.engine === "puzzle") {
                let userAns = document.getElementById('puzzle-node-input').value.trim().toLowerCase();
                if (userAns === nodeItem.answer.toLowerCase()) { isVerified = true; speechTarget = nodeItem.answer; }
            }
            else if (matrixBlock.engine === "sniper") {
                let userAns = document.getElementById('built-sentence-zone').innerText;
                if (userAns === nodeItem.answer) { isVerified = true; speechTarget = nodeItem.answer; }
            }
            else if (matrixBlock.engine === "dropdown") {
                let userAns = document.getElementById('dropdown-node-select').value;
                if (userAns === nodeItem.answer) { isVerified = true; speechTarget = nodeItem.answer; }
            }
            else if (matrixBlock.engine === "mcq") {
                if (window.selectedMCQValue === nodeItem.answer) { isVerified = true; speechTarget = nodeItem.answer; }
            }
            else if (matrixBlock.engine === "dragdrop") {
                if (window.droppedValue === nodeItem.answer) { isVerified = true; speechTarget = nodeItem.answer; }
            }
            else if (matrixBlock.engine === "boolean") {
                if (window.selectedBooleanState === nodeItem.state) { isVerified = true; speechTarget = nodeItem.txtAnswer; }
            }
            else if (matrixBlock.engine === "dialogue") {
                if (window.selectedDialogueAns === nodeItem.answer) { isVerified = true; speechTarget = "the scene's correct script dialogue"; }
            }

            if (isVerified) {
                playSound('success');
                speakAnswer(speechTarget); 
                feedback.innerText = "⚡ SUCCESS: Node Parameter Authenticated! (+20 XP)";
                feedback.style.color = "var(--neon-green)";
                globalXP += 20;
                document.getElementById('xp-global').innerText = globalXP;

                setTimeout(() => {
                    activeNodeIndex++;
                    if(activeNodeIndex < matrixBlock.items.length) {
                        renderActiveNode();
                    } else {
                        feedback.innerText = "🏆 SECTION LOCKED: Core sector successfully cleared.";
                        feedback.style.color = "var(--neon-blue)";
                        document.getElementById('submit-btn').style.display = "none";
                    }
                }, 1800);
            } else {
                playSound('error');
                feedback.innerText = "❌ EXCEPTION ERROR: Mismatch detected. Core Block Rejected.";
                feedback.style.color = "var(--neon-pink)";
            }
        }

        // 8. Language Science Lab (Click-Pair Matching Core Engine)
        function showScienceLab() {
            activeEngineIndex = 8;
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-a8').classList.add('active');
            
            document.getElementById('progress-indicator').innerText = "Quantum Pair Combinator Engine";
            document.getElementById('arena-title').innerText = "Language Science Lab";
            document.getElementById('arena-desc').innerText = "Connect the key phrases with their accurate behavioral context indicators.";
            document.getElementById('arena-feedback').innerText = "";
            document.getElementById('submit-btn').style.display = "none";

            const leftData = ["Say the right thing", "Awkward moment", "Stage direction", "Pleasant greeting", "Literal obedience"];
            const rightData = [
                "Thinking about the impact of your words on others",
                "Embarrassment caused by blunt or tactless remarks",
                "Italicized hints guiding the actors' expressions",
                "Welcoming visitors politely to make them feel comfortable",
                "Following rules exactly without checking social context"
            ];

            const answersMap = {
                "Say the right thing": "Thinking about the impact of your words on others",
                "Awkward moment": "Embarrassment caused by blunt or tactless remarks",
                "Stage direction": "Italicized hints guiding the actors' expressions",
                "Pleasant greeting": "Welcoming visitors politely to make them feel comfortable",
                "Literal obedience": "Following rules exactly without checking social context"
            };

            const body = document.getElementById('arena-body');
            body.innerHTML = `<div class="pair-container"><div class="pair-column" id="left-col"></div><div class="pair-column" id="right-col"></div></div>`;

            leftData.forEach(text => {
                let node = document.createElement('div');
                node.className = "pair-node";
                node.innerText = text;
                node.onclick = () => {
                    if(node.classList.contains('matched')) return;
                    document.querySelectorAll('#left-col .pair-node').forEach(n => n.classList.remove('selected'));
                    node.classList.add('selected');
                    selectedLeftNode = text;
                    evaluatePairBond(answersMap);
                };
                document.getElementById('left-col').appendChild(node);
            });

            let shuffledRight = [...rightData].sort(() => Math.random() - 0.5);
            shuffledRight.forEach(text => {
                let node = document.createElement('div');
                node.className = "pair-node";
                node.innerText = text;
                node.onclick = () => {
                    if(node.classList.contains('matched')) return;
                    document.querySelectorAll('#right-col .pair-node').forEach(n => n.classList.remove('selected'));
                    node.classList.add('selected');
                    selectedRightNode = text;
                    evaluatePairBond(answersMap);
                };
                document.getElementById('right-col').appendChild(node);
            });
        }

        function evaluatePairBond(answersMap) {
            if(selectedLeftNode && selectedRightNode) {
                let feedback = document.getElementById('arena-feedback');
                if(answersMap[selectedLeftNode] === selectedRightNode) {
                    playSound('success');
                    speakAnswer(selectedLeftNode); 
                    feedback.innerText = "🧪 REACTION SUCCESSFUL: Stable Bond Created! (+30 XP)";
                    feedback.style.color = "var(--neon-green)";
                    globalXP += 30;
                    document.getElementById('xp-global').innerText = globalXP;

                    document.querySelectorAll('.pair-node').forEach(node => {
                        if(node.innerText === selectedLeftNode || node.innerText === selectedRightNode) {
                            node.classList.remove('selected');
                            node.classList.add('matched');
                        }
                    });
                } else {
                    playSound('error');
                    feedback.innerText = "💥 CHEMICAL FAILURE: Elements repelled elements.";
                    feedback.style.color = "var(--neon-pink)";
                    document.querySelectorAll('.pair-node').forEach(node => node.classList.remove('selected'));
                }
                selectedLeftNode = null;
                selectedRightNode = null;
            }
        }

        window.onload = () => { loadUniverseEngine(1); };
    </script>
</body>
