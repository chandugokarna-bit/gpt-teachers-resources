<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health: The Ultimate Treasure - Arcade Edition</title>
    <style>
        :root {
            --bg-glow: #0d1117;
            --panel-bg: rgba(22, 27, 34, 0.85);
            --neon-blue: #00f2fe;
            --neon-purple: #4facfe;
            --neon-green: #00ff87;
            --neon-pink: #ff0844;
            --text-main: #f0f6fc;
            --text-muted: #8b949e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-glow);
            background-image: radial-gradient(circle at 50% 50%, #1f1a3a 0%, #0d1117 100%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
            margin-top: 10px;
        }

        header h1 {
            font-size: 2.5rem;
            background: linear-gradient(135deg, var(--neon-blue), var(--neon-green));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 5px;
            filter: drop-shadow(0 2px 10px rgba(0,242,254,0.3));
        }

        header p {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        /* Status Bar Hub */
        .status-container {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            width: 100%;
            max-width: 900px;
            justify-content: space-between;
        }

        .status-card {
            background: var(--panel-bg);
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(12px);
            padding: 12px 25px;
            border-radius: 16px;
            flex: 1;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .status-card h3 {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .status-card p {
            font-size: 1.6rem;
            font-weight: bold;
            color: var(--neon-blue);
        }

        /* Main Console Grid */
        .game-wrapper {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 25px;
            width: 100%;
            max-width: 1100px;
            min-height: 520px;
        }

        /* Sidebar Selector */
        .activity-menu {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .menu-btn {
            background: var(--panel-bg);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: var(--text-main);
            padding: 15px 20px;
            border-radius: 14px;
            cursor: pointer;
            text-align: left;
            font-size: 0.95rem;
            font-weight: 600;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .menu-btn:hover {
            border-color: var(--neon-purple);
            transform: translateX(5px);
            background: rgba(79, 172, 254, 0.1);
        }

        .menu-btn.active {
            background: linear-gradient(135deg, rgba(0, 242, 254, 0.2), rgba(79, 172, 254, 0.2));
            border-color: var(--neon-blue);
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.25);
        }

        .menu-btn .icon {
            font-size: 1.2rem;
        }

        /* Main Activity Screen Panel */
        .stage-panel {
            background: var(--panel-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 35px;
            backdrop-filter: blur(16px);
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .stage-header {
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        .stage-title {
            font-size: 1.6rem;
            color: var(--neon-green);
            margin-bottom: 5px;
        }

        .stage-desc {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        /* Form Controls & Layouts inside activities */
        .quest-box {
            margin-bottom: 25px;
            animation: fadeIn 0.4s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .quest-text {
            font-size: 1.15rem;
            margin-bottom: 18px;
            line-height: 1.5;
        }

        /* Options Grid */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        .option-node {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 14px 20px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 1rem;
            text-align: left;
            color: var(--text-main);
        }

        .option-node:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--text-muted);
        }

        .option-node.selected {
            background: rgba(79, 172, 254, 0.15);
            border-color: var(--neon-blue);
        }

        /* Sorting / Binary Layout */
        .binary-wrapper {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        /* Control Action Triggers */
        .action-row {
            margin-top: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 20px;
        }

        .btn-action {
            background: linear-gradient(135deg, var(--neon-blue) 0%, var(--neon-purple) 100%);
            border: none;
            color: #fff;
            font-weight: bold;
            padding: 12px 28px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 1rem;
            box-shadow: 0 4px 15px rgba(79, 172, 254, 0.4);
            transition: all 0.3s ease;
        }

        .btn-action:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 242, 254, 0.5);
        }

        .btn-action:disabled {
            background: #2a2f35;
            color: var(--text-muted);
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }

        /* Result Feedback Overlay */
        .feedback-toast {
            margin-top: 15px;
            padding: 12px 18px;
            border-radius: 10px;
            font-weight: 500;
            display: none;
        }

        .feedback-toast.correct {
            display: block;
            background: rgba(0, 255, 135, 0.15);
            border: 1px solid var(--neon-green);
            color: var(--neon-green);
        }

        .feedback-toast.wrong {
            display: block;
            background: rgba(255, 8, 68, 0.15);
            border: 1px solid var(--neon-pink);
            color: var(--neon-pink);
        }

        .progress-micro {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .finish-screen {
            text-align: center;
            padding: 40px 10px;
        }
        .finish-screen h2 {
            color: var(--neon-green);
            font-size: 2.2rem;
            margin-bottom: 15px;
        }
        .finish-screen p {
            margin-bottom: 25px;
            color: var(--text-muted);
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>Health: The Ultimate Treasure</h1>
        <p>Simple & Fun Science Quiz — Class 8 Chapter 3</p>
    </header>

    <div class="status-container">
        <div class="status-card">
            <h3>Score</h3>
            <p id="score-display">000</p>
        </div>
        <div class="status-card">
            <h3>Activity</h3>
            <p id="activity-id-display">1 / 6</p>
        </div>
        <div class="status-card">
            <h3>Rank</h3>
            <p id="rank-display">Beginner</p>
        </div>
    </div>

    <div class="game-wrapper">
        <div class="activity-menu">
            <button class="menu-btn active" onclick="loadActivity(0)">
                <span class="icon">🍎</span> Act 1: Habit Sorter
            </button>
            <button class="menu-btn" onclick="loadActivity(1)">
                <span class="icon">🦟</span> Act 2: Mosquito Alert
            </button>
            <button class="menu-btn" onclick="loadActivity(2)">
                <span class="icon">💊</span> Act 3: Fact or Fiction
            </button>
            <button class="menu-btn" onclick="loadActivity(3)">
                <span class="icon">🔬</span> Act 4: Name the Enemy
            </button>
            <button class="menu-btn" onclick="loadActivity(4)">
                <span class="icon">💧</span> Act 5: How Diseases Spread
            </button>
            <button class="menu-btn" onclick="loadActivity(5)">
                <span class="icon">🛡️</span> Act 6: Staying Safe
            </button>
        </div>

        <div class="stage-panel" id="stage-panel">
            </div>
    </div>

    <script>
        // Simple English Textbook Question Data Matrix
        const gameData = [
            {
                title: "Activity 1: Healthy Lifestyle Habit Sorter",
                desc: "Look at the habit and choose if it is a Good Habit or a Bad Habit for your body.",
                type: "binary",
                questions: [
                    { q: "Eating a balanced diet with clean and healthy food.", type: "healthy" },
                    { q: "Smoking cigarettes or drinking harmful alcohol.", type: "unhealthy" },
                    { q: "Exercising daily and sleeping 7 to 8 hours every night.", type: "healthy" },
                    { q: "Sitting all day without moving or doing any physical work.", type: "unhealthy" }
                ]
            },
            {
                title: "Activity 2: Mosquito Alert!",
                desc: "Choose the correct answer about harmful insects and dangerous mosquitoes.",
                type: "mcq",
                questions: [
                    {
                        q: "Which disease is spread by the bite of a Female Anopheles mosquito?",
                        options: ["Dengue", "Malaria", "Typhoid", "Common Cold"],
                        correct: 1
                    },
                    {
                        q: "What is a main symptom of Dengue fever?",
                        options: ["Slight running nose", "Severe bone and joint pain", "No fever at all", "Toothache"],
                        correct: 1
                    },
                    {
                        q: "How can we stop mosquitoes from growing around our house?",
                        options: ["By keeping water open and standing outdoors", "By cleaning up and removing stagnant water", "By making rooms very wet and humid", "By wearing less clothing"],
                        correct: 1
                    },
                    {
                        q: "Which mosquito carries the harmful virus that causes Dengue?",
                        options: ["Anopheles mosquito", "Aedes mosquito", "Housefly", "Rat flea"],
                        correct: 1
                    }
                ]
            },
            {
                title: "Activity 3: True or False Science Check",
                desc: "Read carefully and decide if the statement is True or False according to your science rules.",
                type: "binary_quiz",
                questions: [
                    { q: "Antibiotics are good medicines to cure a common cold or flu virus.", optimal: "False" },
                    { q: "Taking antibiotics without a doctor's advice can make bacteria stronger against drugs.", optimal: "True" },
                    { q: "India is famous across the world for making high-quality, cheap vaccines and medicines.", optimal: "True" },
                    { q: "You should stop taking your antibiotic medicines immediately as soon as you feel a little better.", optimal: "False" }
                ]
            },
            {
                title: "Activity 4: Name the Germ Enemy",
                desc: "Identify what kind of microbe or germ causes these common sicknesses.",
                type: "mcq",
                questions: [
                    {
                        q: "What kind of living germ causes the disease called Tuberculosis (TB)?",
                        options: ["Fungus", "Protozoa", "Bacteria", "Virus"],
                        correct: 2
                    },
                    {
                        q: "Malaria is caused by which group of microorganisms?",
                        options: ["Algae", "Protozoa", "Bacteria", "Virus"],
                        correct: 1
                    },
                    {
                        q: "Where do viruses live and multiply?",
                        options: ["In dry outdoor dust and soil", "Inside the cells of a living host", "In clean drinking water wells", "Inside plastic sheets"],
                        correct: 1
                    },
                    {
                        q: "Which of these illnesses is caused by bacteria?",
                        options: ["Common Cold", "Typhoid", "Polio", "Chicken Pox"],
                        correct: 1
                    }
                ]
            },
            {
                title: "Activity 5: How Sickness Spreads",
                desc: "Choose how infections travel from a sick person to a healthy person.",
                type: "mcq",
                questions: [
                    {
                        q: "How does the disease Cholera travel and enter our bodies?",
                        options: ["Through clean air currents", "Through dirty water and bad food", "By sitting next to a healthy person", "Through dry soil dust"],
                        correct: 1
                    },
                    {
                        q: "Which illness can spread easily through drops of air when a sick person sneezes?",
                        options: ["Typhoid", "Common Cold", "Cholera", "Malaria"],
                        correct: 1
                    },
                    {
                        q: "What happens if human waste mixes with drinking water sources?",
                        options: ["The water becomes safer", "Waterborne diseases will spread to people", "Nothing changes", "The water gets clean naturally"],
                        correct: 1
                    },
                    {
                        q: "What can we use while sleeping to protect ourselves from mosquito bites?",
                        options: ["Open big windows", "A mosquito net over the bed", "A fan running at full speed", "A bright light bulb"],
                        correct: 1
                    }
                ]
            },
            {
                title: "Activity 6: Staying Safe & Strong",
                desc: "Show what you know about staying perfectly healthy and protected.",
                type: "mcq",
                questions: [
                    {
                        q: "What did India do during the global COVID-19 epidemic?",
                        options: ["Sent essential vaccines to many nations worldwide", "Closed all medicine labs completely", "Stopped helping other countries", "Bought all medicines from outside only"],
                        correct: 0
                    },
                    {
                        q: "What does a vaccine create inside your body to defend you?",
                        options: ["Harmful waste matter", "Protective shields called antibodies", "Weak body cells", "Bad bacteria"],
                        correct: 1
                    },
                    {
                        q: "Why do small babies get special vaccination cards at the clinic?",
                        options: ["To track their school marks", "To make sure they get vaccines against childhood diseases", "To decrease price tags on toys", "To change their skin color"],
                        correct: 1
                    },
                    {
                        q: "What is the true definition of complete Health?",
                        options: ["Having physical body strength only", "Being completely healthy in body, mind, and social life", "Having zero stress but eating bad food", "Taking medicines every day"],
                        correct: 1
                    }
                ]
            }
        ];

        // App Engine Variable Space
        let activeActivity = 0;
        let activeQuestion = 0;
        let score = 0;
        let selectedAnswersTrack = null; 

        // Initial Initialization Logic Block
        window.onload = function() {
            loadActivity(0);
        };

        // UI Activity Switch Panel Controller Component
        function loadActivity(idx) {
            activeActivity = idx;
            activeQuestion = 0;
            selectedAnswersTrack = null;
            
            // Sync Menu Buttons State Styles
            const btns = document.querySelectorAll('.activity-menu .menu-btn');
            btns.forEach((btn, i) => {
                if(i === idx) btn.classList.add('active');
                else btn.classList.remove('active');
            });

            // Set Top Level Info Counters
            document.getElementById('activity-id-display').innerText = `${idx + 1} / 6`;
            renderQuestionState();
        }

        // Framework Content Builder Controller Routing Hub
        function renderQuestionState() {
            const container = document.getElementById('stage-panel');
            const data = gameData[activeActivity];
            const currentQuestSet = data.questions[activeQuestion];
            const totalQuests = data.questions.length;

            let innerHTMLCode = `
                <div class="stage-header">
                    <h2 class="stage-title">${data.title}</h2>
                    <p class="stage-desc">${data.desc}</p>
                </div>
                <div class="quest-box">
                    <p class="progress-micro">Question: ${activeQuestion + 1} of ${totalQuests}</p>
                    <p class="quest-text">${currentQuestSet.q}</p>
            `;

            // Render form variations based on interactive game type
            if (data.type === 'binary') {
                innerHTMLCode += `
                    <p style="font-style: italic; color: var(--text-muted); margin-bottom: 12px;">Choose an option below:</p>
                    <div class="binary-wrapper">
                        <button class="option-node" id="bin-btn-healthy" onclick="selectBinaryVal('healthy')">💚 Good Habit</button>
                        <button class="option-node" id="bin-btn-unhealthy" onclick="selectBinaryVal('unhealthy')">⚠️ Bad Habit</button>
                    </div>
                `;
            } else if (data.type === 'mcq') {
                innerHTMLCode += `<div class="options-grid">`;
                currentQuestSet.options.forEach((opt, oIdx) => {
                    innerHTMLCode += `
                        <button class="option-node" id="mcq-node-${oIdx}" onclick="selectMcqVal(${oIdx})">
                            <span style="color:var(--neon-blue); font-weight:bold; margin-right:8px;">${oIdx + 1}.</span> ${opt}
                        </button>
                    `;
                });
                innerHTMLCode += `</div>`;
            } else if (data.type === 'binary_quiz') {
                innerHTMLCode += `
                    <div class="binary-wrapper">
                        <button class="option-node" id="quiz-btn-true" onclick="selectQuizBinary('True')">✅ TRUE</button>
                        <button class="option-node" id="quiz-btn-false" onclick="selectQuizBinary('False')">❌ FALSE</button>
                    </div>
                `;
            }

            innerHTMLCode += `
                </div>
                <div id="toast-feedback-zone" class="feedback-toast"></div>
                <div class="action-row">
                    <button class="btn-action" id="submit-node-btn" onclick="evaluateAnswer()" disabled>Check My Answer</button>
                    <button class="btn-action" id="next-node-btn" onclick="advanceStep()" style="display:none; background: linear-gradient(135deg, var(--neon-green) 0%, #00d2ff 100%);">Next Question</button>
                </div>
            `;

            container.innerHTML = innerHTMLCode;
        }

        // Selection Actions Component Logic
        function selectBinaryVal(val) {
            selectedAnswersTrack = val;
            document.getElementById('bin-btn-healthy').classList.remove('selected');
            document.getElementById('bin-btn-unhealthy').classList.remove('selected');
            document.getElementById(`bin-btn-${val}`).classList.add('selected');
            document.getElementById('submit-node-btn').removeAttribute('disabled');
        }

        // Multiple choice selection tracking
        function selectMcqVal(idx) {
            selectedAnswersTrack = idx;
            const nodes = document.querySelectorAll('.options-grid .option-node');
            nodes.forEach(node => node.classList.remove('selected'));
            document.getElementById(`mcq-node-${idx}`).classList.add('selected');
            document.getElementById('submit-node-btn').removeAttribute('disabled');
        }

        // True false selection tracking
        function selectQuizBinary(val) {
            selectedAnswersTrack = val;
            document.getElementById('quiz-btn-true').classList.remove('selected');
            document.getElementById('quiz-btn-false').classList.remove('selected');
            document.getElementById(`quiz-btn-${val.toLowerCase()}`).classList.add('selected');
            document.getElementById('submit-node-btn').removeAttribute('disabled');
        }

        // Evaluation core loop logic
        function evaluateAnswer() {
            const data = gameData[activeActivity];
            const currentQuestSet = data.questions[activeQuestion];
            let isCorrect = false;

            if (data.type === 'binary') {
                isCorrect = (selectedAnswersTrack === currentQuestSet.type);
            } else if (data.type === 'mcq') {
                isCorrect = (selectedAnswersTrack === currentQuestSet.correct);
            } else if (data.type === 'binary_quiz') {
                isCorrect = (selectedAnswersTrack === currentQuestSet.optimal);
            }

            const toast = document.getElementById('toast-feedback-zone');
            document.getElementById('submit-node-btn').style.display = 'none';
            
            if (isCorrect) {
                score += 25;
                document.getElementById('score-display').innerText = score.toString().padStart(3, '0');
                toast.className = "feedback-toast correct";
                toast.innerHTML = "🎯 <b>CORRECT!</b> Excellent work! You earned +25 points.";
                updateRank();
            } else {
                toast.className = "feedback-toast wrong";
                let feedbackText = "⚠️ <b>INCORRECT.</b> ";
                if (data.type === 'mcq') {
                    feedbackText += `The right answer is: <b>${currentQuestSet.options[currentQuestSet.correct]}</b>`;
                } else if (data.type === 'binary_quiz') {
                    feedbackText += `This statement is actually <b>${currentQuestSet.optimal}</b>`;
                } else {
                    let standardLabel = currentQuestSet.type === 'healthy' ? 'Good Habit' : 'Bad Habit';
                    feedbackText += `This should be marked as a <b>${standardLabel}</b>`;
                }
                toast.innerHTML = feedbackText;
            }

            document.getElementById('next-node-btn').style.display = 'block';
        }

        // Advance to next game step or change activity modules
        function advanceStep() {
            activeQuestion++;
            const totalQuests = gameData[activeActivity].questions.length;

            if (activeQuestion < totalQuests) {
                selectedAnswersTrack = null;
                renderQuestionState();
            } else {
                if (activeActivity + 1 < gameData.length) {
                    let transitionHTML = `
                        <div class="finish-screen">
                            <h2>⚡ Activity Complete!</h2>
                            <p>You did a great job on all the questions in this activity round.</p>
                            <button class="btn-action" onclick="loadActivity(${activeActivity + 1})">Go to Next Activity</button>
                        </div>
                    `;
                    document.getElementById('stage-panel').innerHTML = transitionHTML;
                } else {
                    let absoluteEndHTML = `
                        <div class="finish-screen">
                            <h2>🏆 Game Finished!</h2>
                            <p>Fantastic job! You completed all 6 activities for Chapter 3.</p>
                            <div style="font-size:3rem; margin:20px 0;">🥇</div>
                            <p style="color:var(--neon-blue); font-size:1.5rem; font-weight:bold;">Your Total Score: ${score} Points</p>
                            <button class="btn-action" style="margin-top:20px;" onclick="resetSimGlobal()">Play Again</button>
                        </div>
                    `;
                    document.getElementById('stage-panel').innerHTML = absoluteEndHTML;
                }
            }
        }

        // Rank updates based on scoring milestones
        function updateRank() {
            let rank = "Beginner";
            if (score >= 150) rank = "Health Scout";
            if (score >= 300) rank = "Germ Hunter";
            if (score >= 450) rank = "Health Hero";
            if (score >= 550) rank = "Treasure Master";
            document.getElementById('rank-display').innerText = rank;
        }

        // Completely reset everything back to baseline
        function resetSimGlobal() {
            score = 0;
            document.getElementById('score-display').innerText = "000";
            updateRank();
            loadActivity(0);
        }
    </script>
</body>
</html>
