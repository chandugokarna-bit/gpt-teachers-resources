<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Perfect Neon Arena - A Funny Man</title>
    <style>
        :root {
            --bg-glow: #020205;
            --panel-bg: rgba(12, 6, 24, 0.9);
            --neon-blue: #00f0ff;
            --neon-green: #39ff14;
            --neon-pink: #ff007f;
            --neon-yellow: #fff000;
            --text-main: #ffffff;
            --text-sub: #a49fc4;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        body {
            background: radial-gradient(circle at center, #1b052e 0%, var(--bg-glow) 100%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        header {
            text-align: center;
            padding: 20px;
            background: rgba(5, 2, 10, 0.95);
            border-bottom: 3px solid var(--neon-pink);
            box-shadow: 0 0 30px rgba(255, 0, 127, 0.4);
        }

        header h1 {
            font-size: 2.3rem;
            color: var(--neon-pink);
            text-shadow: 0 0 15px var(--neon-pink);
            letter-spacing: 2px;
        }

        .main-container {
            display: flex;
            flex: 1;
            padding: 25px;
            gap: 25px;
            max-width: 1600px;
            margin: 0 auto;
            width: 100%;
        }

        /* Sidebar Menu */
        .sidebar {
            width: 340px;
            background: var(--panel-bg);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 0, 127, 0.2);
            border-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
        }

        .sidebar h2 {
            font-size: 1.2rem;
            color: var(--neon-blue);
            text-transform: uppercase;
            letter-spacing: 2px;
            text-align: center;
            text-shadow: 0 0 10px var(--neon-blue);
            margin-bottom: 10px;
        }

        .nav-btn {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 15px 18px;
            border-radius: 12px;
            color: var(--text-sub);
            text-align: left;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.95rem;
        }

        .nav-btn:hover {
            border-color: var(--neon-pink);
            color: var(--neon-pink);
            background: rgba(255, 0, 127, 0.08);
            transform: translateX(8px);
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.25);
        }

        .nav-btn.active {
            background: linear-gradient(90deg, rgba(255, 0, 127, 0.25), transparent);
            border-left: 5px solid var(--neon-pink);
            color: #ffffff;
            font-weight: bold;
            box-shadow: 0 0 20px rgba(255, 0, 127, 0.15);
        }

        /* Central Display Arena */
        .arena-display {
            flex: 1;
            background: var(--panel-bg);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 0, 127, 0.2);
            border-radius: 20px;
            padding: 35px;
            position: relative;
            box-shadow: 0 20px 50px rgba(0,0,0,0.7);
            display: flex;
            flex-direction: column;
        }

        .score-board {
            position: absolute;
            top: 25px;
            right: 35px;
            background: rgba(255, 255, 255, 0.05);
            padding: 10px 22px;
            border-radius: 30px;
            border: 1px solid var(--neon-blue);
            font-weight: bold;
            color: var(--neon-blue);
            text-shadow: 0 0 10px var(--neon-blue);
        }

        .progress-indicator { color: var(--neon-yellow); font-size: 0.9rem; margin-bottom: 8px; font-weight: bold; letter-spacing: 1px; }
        .game-header { border-bottom: 1px dashed rgba(255, 255, 255, 0.1); padding-bottom: 15px; margin-bottom: 25px; }
        .game-title { font-size: 2rem; color: var(--neon-green); text-shadow: 0 0 10px var(--neon-green); margin-bottom: 5px; }
        .game-desc { color: var(--text-sub); font-style: italic; }
        .content-box { background: rgba(0, 0, 0, 0.5); border: 1px solid rgba(255, 255, 255, 0.05); padding: 30px; border-radius: 16px; margin-bottom: 25px; flex: 1; }
        .q-text { font-size: 1.25rem; margin-bottom: 20px; line-height: 1.6; }

        /* Specific Component Styles */
        .scrambled-box { font-size: 1.8rem; color: var(--neon-pink); letter-spacing: 4px; font-weight: bold; margin-bottom: 20px; text-shadow: 0 0 8px rgba(255,0,127,0.4); }
        .input-field { background: rgba(0,0,0,0.7); border: 1px solid rgba(255,255,255,0.15); padding: 15px; border-radius: 10px; color: white; width: 100%; font-size: 1.1rem; outline: none; }
        .input-field:focus { border-color: var(--neon-pink); box-shadow: 0 0 10px rgba(255,0,127,0.3); }
        
        /* FIXED MCQ GRID AND BUTTON CARDS */
        .mcq-grid { display: grid; grid-template-columns: 1fr; gap: 15px; margin-top: 15px; }
        .mcq-card { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.12); padding: 18px 22px; border-radius: 12px; cursor: pointer; transition: all 0.2s ease; font-size: 1.1rem; color: var(--text-main); text-align: left; }
        .mcq-card:hover { border-color: var(--neon-blue); background: rgba(0,240,255,0.06); transform: translateY(-2px); }
        .mcq-card.active { border-color: var(--neon-blue); background: rgba(0,240,255,0.18); box-shadow: 0 0 12px rgba(0,240,255,0.3); font-weight: bold; }
        
        .quantum-select { background: #120924; color: white; border: 1px solid var(--neon-blue); padding: 12px; border-radius: 8px; font-size: 1.1rem; width: 100%; outline: none; }
        
        /* Drag Drop Construction */
        .drag-container { display: flex; flex-direction: column; gap: 20px; }
        .drag-box-pool { display: flex; flex-wrap: wrap; gap: 15px; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.08); padding: 15px; border-radius: 12px; min-height: 70px; }
        .drop-target-box { background: rgba(255, 0, 127, 0.02); border: 2px dashed var(--neon-pink); padding: 25px; border-radius: 12px; text-align: center; font-size: 1.2rem; transition: 0.3s; }
        .drop-target-box.drag-over { background: rgba(255, 0, 127, 0.15); border-style: solid; }
        .drag-item { background: #230f3a; border: 1px solid var(--neon-pink); padding: 10px 22px; border-radius: 8px; cursor: move; font-weight: bold; user-select: none; }

        /* True False Layout */
        .tf-grid { display: flex; gap: 20px; }
        .tf-btn { flex: 1; padding: 20px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.03); font-size: 1.2rem; font-weight: bold; cursor: pointer; color: white; text-align: center; transition: 0.2s; }
        .tf-btn:hover { border-color: var(--neon-blue); background: rgba(0,240,255,0.05); }
        .tf-btn.selected { background: rgba(255,240,0,0.2); border-color: var(--neon-yellow); color: var(--neon-yellow); box-shadow: 0 0 10px rgba(255,240,0,0.2); }

        /* Sentence Sniper Layout */
        .sniper-pool { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 20px; }
        .sniper-word { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.15); padding: 10px 20px; border-radius: 8px; cursor: pointer; font-size: 1.1rem; }
        .sniper-word:hover { border-color: var(--neon-green); color: var(--neon-green); background: rgba(57,255,20,0.05); }
        .built-sentence { min-height: 55px; background: rgba(0,0,0,0.3); border-bottom: 2px solid var(--neon-green); margin-bottom: 20px; padding: 10px; font-size: 1.3rem; display: flex; gap: 8px; align-items: center; border-radius: 6px; }

        /* Dialogue Interface */
        .chat-container { display: flex; flex-direction: column; gap: 15px; max-height: 300px; overflow-y: auto; padding: 10px; }
        .chat-bubble { max-width: 80%; padding: 12px 18px; border-radius: 15px; line-height: 1.4; font-size: 1.05rem; }
        .chat-bubble.left { background: #230a3a; align-self: flex-start; border-bottom-left-radius: 2px; border: 1px solid rgba(255,255,255,0.05); }

        /* Matching Column Nodes */
        .pair-container { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 15px; }
        .pair-column { display: flex; flex-direction: column; gap: 10px; }
        .pair-node { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); padding: 12px; border-radius: 8px; cursor: pointer; transition: 0.2s; min-height: 50px; display: flex; align-items: center; user-select: none; }
        .pair-node:hover { border-color: var(--neon-yellow); background: rgba(255,240,0,0.05); }
        .pair-node.selected { background: rgba(255,240,0,0.2); border-color: var(--neon-yellow); box-shadow: 0 0 8px rgba(255,240,0,0.3); }
        .pair-node.matched { background: rgba(57,255,20,0.1); border-color: var(--neon-green); cursor: not-allowed; opacity: 0.6; }

        /* Form Actions */
        .action-btn { background: linear-gradient(135deg, #ff007f, #00f0ff); border: none; color: white; padding: 15px 35px; border-radius: 10px; cursor: pointer; font-weight: bold; letter-spacing: 1px; transition: all 0.3s; box-shadow: 0 5px 25px rgba(255, 0, 127, 0.4); align-self: flex-start; }
        .action-btn:hover { transform: translateY(-3px); box-shadow: 0 8px 30px rgba(255, 0, 127, 0.6); }
        .feedback-txt { margin-top: 20px; font-weight: bold; font-size: 1.15rem; min-height: 30px; }
    </style>
</head>
<body>

    <header>
        <h1>GPT TEACHERS EDUCATIONAL RESOURCES, UTTARA KANNADA</h1>
        <p>Active Architecture: Unit 2 Poem - A Funny Man </p>
    </header>

    <div class="main-container">
        <!-- Sidebar Navigation -->
        <div class="sidebar">
            <h2>Active Game Engines</h2>
            <button class="nav-btn active" id="btn-a1" onclick="loadUniverseEngine(1)">🧩 1. Word Puzzle Arena</button>
            <button class="nav-btn" id="btn-a2" onclick="loadUniverseEngine(2)">🎯 2. Sentence Sniper</button>
            <button class="nav-btn" id="btn-a3" onclick="loadUniverseEngine(3)">🔍 3. Hidden Clue Explorer</button>
            <button class="nav-btn" id="btn-a4" onclick="loadUniverseEngine(4)">🎡 4. Language Fun Fair</button>
            <button class="nav-btn" id="btn-a5" onclick="loadUniverseEngine(5)">🚂 5. Grammar Express</button>

            <button class="nav-btn" id="btn-a8" onclick="showScienceLab()">🧪 8. Language Science Lab</button>
        </div>

        <!-- Main Workplace -->
        <div class="arena-display">
            <div class="score-board">GLOBAL XP: <span id="xp-global">0</span></div>
            <div class="progress-indicator" id="progress-indicator">Node Question 1 of 5</div>
            
            <div class="game-header">
                <div class="game-title" id="arena-title">Loading Framework...</div>
                <div class="game-desc" id="arena-desc">Booting data files...</div>
            </div>

            <div class="content-box" id="arena-body"></div>

            <button class="action-btn" id="submit-btn" onclick="evaluateActiveBlock()">VERIFY SUBMISSION NODE</button>
            <div id="arena-feedback" class="feedback-txt"></div>
        </div>
    </div>

    <script>
        // Web Audio Synthesizer Interface
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playSound(type) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'success') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
                osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1);  // E5
                osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.2);  // G5
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.4);
            } else if (type === 'error') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(140, audioCtx.currentTime); 
                osc.frequency.setValueAtTime(100, audioCtx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            }
        }

        // Speech Synthesizer Link
        function speakAnswer(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance("Correct! The answer is " + text);
                utterance.lang = 'en-US';
                utterance.rate = 0.95;
                window.speechSynthesis.speak(utterance);
            }
        }

        const universeMatrix = {
            1: {
                title: "Word Puzzle Arena (Word Unscramble)",
                desc: "Reassemble scrambled text strings to unlock structural vocabulary items from the poem.",
                items: [
                    { scrambled: "C U R R A N T", question: "The specific type of sweet small raisin fruit bun held out by the man:", answer: "currant" },
                    { scrambled: "S T A G G E R E D", question: "How the poet moved back unsteadily against the wall in surprise:", answer: "staggered" },
                    { scrambled: "P O L I T E", question: "Even though he was eccentric, his manners were remarkably...", answer: "polite" },
                    { scrambled: "H O P P E D", question: "The wacky action method the man used to head back home on his head:", answer: "hopped" },
                    { scrambled: "M A N N E R S", question: "The structural custom conduct showing a person's behavior profile:", answer: "manners" }
                ],
                engine: "puzzle"
            },
            2: {
                title: "Sentence Sniper (Sentence Builder)",
                desc: "Reconstruct the rhythm strings exactly in the order of the poem's stanzas.",
                items: [
                    { question: "Build the opening nonsense declaration:", segments: ["He", "wore", "a", "shoe", "upon", "his", "head"], answer: "He wore a shoe upon his head" },
                    { question: "Reconstruct the foot attire setup line:", segments: ["And", "hats", "upon", "his", "feet"], answer: "And hats upon his feet" },
                    { question: "Assemble the polite offering scene:", segments: ["Allow", "me", "to", "present", "Your", "Highness"], answer: "Allow me to present Your Highness" },
                    { question: "Build the smell paradox sentence segment:", segments: ["A", "rose", "with", "such", "a", "funny", "smell"], answer: "A rose with such a funny smell" },
                    { question: "Formulate the final hopping execution loop:", segments: ["And", "hopped", "home", "on", "his", "head"], answer: "And hopped home on his head" }
                ],
                engine: "sniper"
            },
            3: {
                title: "Hidden Clue Explorer (Dropdown Selector)",
                desc: "Isolate textual details and character logic states using drop menus.",
                items: [
                    { question: "What did the funny man raise politely to smile at the narrator?", opts: ["His hat on his feet", "The shoe upon his head", "A currant bun"], answer: "The shoe upon his head" },
                    { question: "How many hats did the funny man wear upon his feet?", opts: ["One hat", "Two hats", "Four hats"], answer: "Two hats" },
                    { question: "What did the funny man actually hold to the poet's nose while offering a 'rose'?", opts: ["A real flower", "A currant bun", "An old slipper"], answer: "A currant bun" },
                    { question: "Where did the poet stagger back in deep amazement?", opts: ["Against the wall", "Into the street puddle", "Inside a local shop"], answer: "Against the wall" },
                    { question: "Where did the funny man sit down on to sing his peculiar sound song?", opts: ["On a wooden bench", "On the ground", "On top of his shoes"], answer: "On the ground" }
                ],
                engine: "dropdown"
            },
            4: {
                title: "Language Fun Fair (Neon MCQ Matrix)",
                desc: "Identify literary devices, rhyme schemes, and inversion tactics inside the verse syllabus.",
                items: [
                    { question: "The lines 'sounding sight' and 'hopped home' are examples of what device?", opts: ["Simile", "Metaphor", "Alliteration", "Personification"], answer: "Alliteration" },
                    { question: "What is the standard fixed rhyme scheme metric of this rhythmic poem?", opts: ["AABB", "ABCB", "ABAB", "ABBA"], answer: "ABCB" },
                    { question: "Why does the poet use the word 'funny' multiple times throughout the text?", opts: ["Because she forgot adjectives", "To emphasize the nonsensical amusement mood", "It was required by layout rules"], answer: "To emphasize the nonsensical amusement mood" },
                    { question: "Identify the linguistic device in: 'Came walking down this street'", opts: ["Simile", "Inversion", "Metaphor", "Onomatopoeia"], answer: "Inversion" },
                    { question: "The expression 'funny looking smell' shows confusion between which two senses?", opts: ["Sight and Smell", "Hearing and Taste", "Touch and Sight", "Smell and Hearing"], answer: "Sight and Smell" }
                ],
                engine: "mcq"
            },
            5: {
                title: "Grammar Express (Phrasal Verbs Drag & Drop)",
                desc: "Drag the accurate Phrasal Verbs into the placeholder slots to balance syntax context.",
                items: [
                    { question: "The funny man came ______ the street in an odd posture.", allOptions: ["walking down", "taking out", "sat down", "braced up"], answer: "walking down" },
                    { question: "He was ______ a currant bun from his pocket to trick my nose.", allOptions: ["taking out", "taking after", "taking up", "turning about"], answer: "taking out" },
                    { question: "He suddenly ______ on the ground to begin his song track.", allOptions: ["sat down", "walked down", "broke into", "called off"], answer: "sat down" },
                    { question: "Arjun decided to ______ painting as a creative weekend hobby.", allOptions: ["take up", "take off", "take in", "take after"], answer: "take up" },
                    { question: "The sleek new smartphone quickly ______ the sales inside the digital market.", allOptions: ["took over", "took after", "took off", "walked down"], answer: "took over" }
                ],
                engine: "dragdrop"
            },
            6: {
                title: "Jungle Adventure (True / False Matrix)",
                desc: "Authenticate true and false narrative parameters to survive the sector check.",
                items: [
                    { question: "The funny man wore real leather shoes on his feet and standard felt hats on his head.", state: false, txt: "False" },
                    { question: "The funny man was extremely rude and screamed at the poet when they met.", state: false, txt: "False" },
                    { question: "The funny man addressed the poet with the formal title of 'Your Highness'.", state: true, txt: "True" },
                    { question: "A palindrome is a sequence of words that reads exactly the same backwards as forwards.", state: true, txt: "True" },
                    { question: "The funny man turned around and ran on his feet to reach his house.", state: false, txt: "False" }
                ],
                engine: "boolean"
            },
            7: {
                title: "Dialogue Theatre (Interactive Chat Simulation)",
                desc: "Construct valid response states to maintain the humorous interaction timeline loop.",
                items: [
                    { context: "The Funny Man: 'Allow me to present Your Highness with a rose.'", prompt: "Choose the poet's logical reactive objection statement:", opts: ["'I never saw a rose with such a funny looking smell!'", "'Thank you, this is a beautiful red flower.'"], answer: "'I never saw a rose with such a funny looking smell!'" },
                    { context: "The Poet: 'My friend, why do you wear two hats upon your feet?'", prompt: "Choose the funny man's sudden non-verbal behavioral response action:", opts: ["He turned the other way about and hopped home on his head.", "He sat down quietly and started reading two newspapers."], answer: "He turned the other way about and hopped home on his head." },
                    { context: "The Funny Man: (Smiles politely after raising the shoe on his head)", prompt: "Choose the observer's narrative comment reflection:", opts: ["'Never had I seen before such a funny sounding sight.'", "'He looked like a very regular businessman walking past.'"], answer: "'Never had I seen before such a funny sounding sight.'" }
                ],
                engine: "dialogue"
            }
        };

        let activeEngineIndex = 1;
        let activeNodeIndex = 0;
        let globalXP = 0;
        
        window.draggedValue = "";
        window.droppedValue = "";
        window.selectedMCQValue = "";
        window.selectedBooleanState = null;
        window.selectedDialogueAns = "";
        let selectedLeftNode = null;
        let selectedRightNode = null;

        function loadUniverseEngine(engineId) {
            activeEngineIndex = engineId;
            activeNodeIndex = 0;
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-a' + engineId).classList.add('active');
            renderActiveNode();
        }

        function renderActiveNode() {
            const matrixBlock = universeMatrix[activeEngineIndex];
            document.getElementById('arena-title').innerText = matrixBlock.title;
            document.getElementById('arena-desc').innerText = matrixBlock.desc;
            document.getElementById('arena-feedback').innerText = "";
            document.getElementById('submit-btn').style.display = "block";
            document.getElementById('progress-indicator').innerText = `Node Question ${activeNodeIndex + 1} of ${matrixBlock.items.length}`;

            const nodeItem = matrixBlock.items[activeNodeIndex];
            const displayFrame = document.getElementById('arena-body');
            displayFrame.innerHTML = "";

            if (matrixBlock.engine === "puzzle") {
                displayFrame.innerHTML = `
                    <p class="q-text">${nodeItem.question}</p>
                    <div class="scrambled-box">${nodeItem.scrambled}</div>
                    <input type="text" id="puzzle-node-input" class="input-field" placeholder="Decrypt the unscrambled word matrix...">
                `;
            } 
            else if (matrixBlock.engine === "sniper") {
                displayFrame.innerHTML = `
                    <p class="q-text">${nodeItem.question}</p>
                    <div class="built-sentence" id="built-sentence-zone"></div>
                    <div class="sniper-pool" id="sniper-pool-zone"></div>
                `;
                let currentBuild = [];
                let shuffled = [...nodeItem.segments].sort(() => Math.random() - 0.5);
                shuffled.forEach(word => {
                    let wordBtn = document.createElement('div');
                    wordBtn.className = "sniper-word";
                    wordBtn.innerText = word;
                    wordBtn.onclick = () => {
                        currentBuild.push(word);
                        document.getElementById('built-sentence-zone').innerText = currentBuild.join(" ");
                        wordBtn.style.display = "none";
                    };
                    document.getElementById('sniper-pool-zone').appendChild(wordBtn);
                });
            }
            else if (matrixBlock.engine === "dropdown") {
                let optionsHtml = nodeItem.opts.map(o => `<option value="${o}">${o}</option>`).join("");
                displayFrame.innerHTML = `
                    <p class="q-text">${nodeItem.question}</p>
                    <select id="dropdown-node-select" class="quantum-select">
                        <option value="">-- SELECT CLUE DATA VECTOR --</option>
                        ${optionsHtml}
                    </select>
                `;
            }
            else if (matrixBlock.engine === "mcq") {
                // FIXED MECHANISM: Injects buttons inside the grid frame instead of plain text strings
                displayFrame.innerHTML = `<p class="q-text">${nodeItem.question}</p><div class="mcq-grid" id="mcq-zone"></div>`;
                window.selectedMCQValue = "";
                nodeItem.opts.forEach(o => {
                    let card = document.createElement('button');
                    card.className = "mcq-card";
                    card.innerText = o;
                    card.onclick = () => {
                        document.querySelectorAll('.mcq-card').forEach(c => c.classList.remove('active'));
                        card.classList.add('active');
                        window.selectedMCQValue = o;
                    };
                    document.getElementById('mcq-zone').appendChild(card);
                });
            }
            else if (matrixBlock.engine === "dragdrop") {
                window.droppedValue = "";
                displayFrame.innerHTML = `
                    <p class="q-text">${nodeItem.question}</p>
                    <div class="drag-container">
                        <div class="drag-box-pool" id="drag-pool-box"></div>
                        <div class="drop-target-box" id="drop-target-zone">Drop your chosen Phrasal Verb answers here...</div>
                    </div>
                `;
                
                let targetZone = document.getElementById('drop-target-zone');
                targetZone.addEventListener('dragover', (e) => { e.preventDefault(); targetZone.classList.add('drag-over'); });
                targetZone.addEventListener('dragleave', () => { targetZone.classList.remove('drag-over'); });
                targetZone.addEventListener('drop', (e) => {
                    e.preventDefault();
                    targetZone.classList.remove('drag-over');
                    window.droppedValue = window.draggedValue;
                    targetZone.innerText = "Loaded Target Node: " + window.droppedValue;
                    targetZone.style.borderColor = "var(--neon-green)";
                });

                nodeItem.allOptions.forEach((opt) => {
                    let dragItem = document.createElement('div');
                    dragItem.className = "drag-item";
                    dragItem.draggable = true;
                    dragItem.innerText = opt;
                    dragItem.addEventListener('dragstart', () => { window.draggedValue = opt; });
                    document.getElementById('drag-pool-box').appendChild(dragItem);
                });
            }
            else if (matrixBlock.engine === "boolean") {
                displayFrame.innerHTML = `
                    <p class="q-text">${nodeItem.question}</p>
                    <div class="tf-grid">
                        <button class="tf-btn" id="tf-t" onclick="setBooleanState(true)">TRUE / VALID DATA</button>
                        <button class="tf-btn" id="tf-f" onclick="setBooleanState(false)">FALSE / REJECT CORE</button>
                    </div>
                `;
                window.selectedBooleanState = null;
            }
            else if (matrixBlock.engine === "dialogue") {
                displayFrame.innerHTML = `
                    <div class="chat-container">
                        <div class="chat-bubble left">${nodeItem.context}</div>
                    </div>
                    <p class="q-text" style="margin-top:15px; color:var(--neon-pink);">${nodeItem.prompt}</p>
                    <div class="mcq-grid" id="dialogue-choices"></div>
                `;
                window.selectedDialogueAns = "";
                nodeItem.opts.forEach(o => {
                    let card = document.createElement('button');
                    card.className = "mcq-card";
                    card.innerText = o;
                    card.onclick = () => {
                        document.querySelectorAll('.mcq-card').forEach(c => c.classList.remove('active'));
                        card.classList.add('active');
                        window.selectedDialogueAns = o;
                    };
                    document.getElementById('dialogue-choices').appendChild(card);
                });
            }
        }

        function setBooleanState(state) {
            window.selectedBooleanState = state;
            document.getElementById('tf-t').className = 'tf-btn';
            document.getElementById('tf-f').className = 'tf-btn';
            if(state) document.getElementById('tf-t').classList.add('selected');
            else document.getElementById('tf-f').classList.add('selected');
        }

        function evaluateActiveBlock() {
            const matrixBlock = universeMatrix[activeEngineIndex];
            const nodeItem = matrixBlock.items[activeNodeIndex];
            let isVerified = false;
            let voiceFeedbackText = ""; 
            let feedback = document.getElementById('arena-feedback');

            if (matrixBlock.engine === "puzzle") {
                let userAns = document.getElementById('puzzle-node-input').value.trim().toLowerCase();
                if (userAns === nodeItem.answer.toLowerCase()) { isVerified = true; voiceFeedbackText = nodeItem.answer; }
            }
            else if (matrixBlock.engine === "sniper") {
                let userAns = document.getElementById('built-sentence-zone').innerText;
                if (userAns === nodeItem.answer) { isVerified = true; voiceFeedbackText = nodeItem.answer; }
            }
            else if (matrixBlock.engine === "dropdown") {
                let userAns = document.getElementById('dropdown-node-select').value;
                if (userAns === nodeItem.answer) { isVerified = true; voiceFeedbackText = nodeItem.answer; }
            }
            else if (matrixBlock.engine === "mcq") {
                if (window.selectedMCQValue === nodeItem.answer) { isVerified = true; voiceFeedbackText = nodeItem.answer; }
            }
            else if (matrixBlock.engine === "dragdrop") {
                if (window.droppedValue === nodeItem.answer) { isVerified = true; voiceFeedbackText = nodeItem.answer; }
            }
            else if (matrixBlock.engine === "boolean") {
                if (window.selectedBooleanState === nodeItem.state) { isVerified = true; voiceFeedbackText = nodeItem.txt; }
            }
            else if (matrixBlock.engine === "dialogue") {
                if (window.selectedDialogueAns === nodeItem.answer) { isVerified = true; voiceFeedbackText = "the poem node sequence"; }
            }

            if (isVerified) {
                playSound('success');
                speakAnswer(voiceFeedbackText); 
                feedback.innerText = "⚡ SUCCESS: Node Parameter Authenticated! (+20 XP)";
                feedback.style.color = "var(--neon-green)";
                globalXP += 20;
                document.getElementById('xp-global').innerText = globalXP;

                setTimeout(() => {
                    activeNodeIndex++;
                    if(activeNodeIndex < matrixBlock.items.length) {
                        renderActiveNode();
                    } else {
                        feedback.innerText = "🏆 SECTION LOCKED: Core sector successfully cleared.";
                        feedback.style.color = "var(--neon-blue)";
                        document.getElementById('submit-btn').style.display = "none";
                    }
                }, 1800);
            } else {
                playSound('error');
                feedback.innerText = "❌ EXCEPTION ERROR: Mismatch detected. Core Block Rejected.";
                feedback.style.color = "var(--neon-pink)";
            }
        }

        // 8. Custom Special Engine: Language Science Lab (Click-Pair Match Palindromes)
        function showScienceLab() {
            activeEngineIndex = 8;
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-a8').classList.add('active');
            
            document.getElementById('progress-indicator').innerText = "Quantum Palindrome Combinator";
            document.getElementById('arena-title').innerText = "Language Science Lab";
            document.getElementById('arena-desc').innerText = "Pair the Palindrome sentences/words found inside the text syllabus correctly.";
            document.getElementById('arena-feedback').innerText = "";
            document.getElementById('submit-btn').style.display = "none";

            const leftData = ["Step on no pets", "Nitin", "Radar", "Malayalam", "Race car"];
            const rightData = [
                "A complete five-word sentence reading the same backwards",
                "A proper noun boy's name palindrome string",
                "A five-letter navigation word reading backward safely",
                "The unique language name palindrome node",
                "A two-word vehicle term string reading same both ways"
            ];

            const answersMap = {
                "Step on no pets": "A complete five-word sentence reading the same backwards",
                "Nitin": "A proper noun boy's name palindrome string",
                "Radar": "A five-letter navigation word reading backward safely",
                "Malayalam": "The unique language name palindrome node",
                "Race car": "A two-word vehicle term string reading same both ways"
            };

            const body = document.getElementById('arena-body');
            body.innerHTML = `<div class="pair-container"><div class="pair-column" id="left-col"></div><div class="pair-column" id="right-col"></div></div>`;

            leftData.forEach(text => {
                let node = document.createElement('div');
                node.className = "pair-node";
                node.innerText = text;
                node.onclick = () => {
                    if(node.classList.contains('matched')) return;
                    document.querySelectorAll('#left-col .pair-node').forEach(n => n.classList.remove('selected'));
                    node.classList.add('selected');
                    selectedLeftNode = text;
                    evaluatePairBond(answersMap);
                };
                document.getElementById('left-col').appendChild(node);
            });

            let shuffledRight = [...rightData].sort(() => Math.random() - 0.5);
            shuffledRight.forEach(text => {
                let node = document.createElement('div');
                node.className = "pair-node";
                node.innerText = text;
                node.onclick = () => {
                    if(node.classList.contains('matched')) return;
                    document.querySelectorAll('#right-col .pair-node').forEach(n => n.classList.remove('selected'));
                    node.classList.add('selected');
                    selectedRightNode = text;
                    evaluatePairBond(answersMap);
                };
                document.getElementById('right-col').appendChild(node);
            });
        }

        function evaluatePairBond(answersMap) {
            if(selectedLeftNode && selectedRightNode) {
                let feedback = document.getElementById('arena-feedback');
                if(answersMap[selectedLeftNode] === selectedRightNode) {
                    playSound('success');
                    feedback.innerText = "🧪 REACTION SUCCESSFUL: Stable Bond Created! (+30 XP)";
                    feedback.style.color = "var(--neon-green)";
                    globalXP += 30;
                    document.getElementById('xp-global').innerText = globalXP;

                    document.querySelectorAll('.pair-node').forEach(node => {
                        if(node.innerText === selectedLeftNode || node.innerText === selectedRightNode) {
                            node.classList.remove('selected');
                            node.classList.add('matched');
                        }
                    });
                } else {
                    playSound('error');
                    feedback.innerText = "💥 CHEMICAL FAILURE: Elements repelled elements.";
                    feedback.style.color = "var(--neon-pink)";
                    document.querySelectorAll('.pair-node').forEach(node => node.classList.remove('selected'));
                }
                selectedLeftNode = null;
                selectedRightNode = null;
            }
        }

        window.onload = () => { loadUniverseEngine(1); };
    </script>
