<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Presentation Viewer</title>
    <style>
        :root {
            --bg-color: #0f172a; /* Modern dark slate background */
            --card-bg: #1e293b;
            --shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        /* Modern, responsive wrapper for the presentation */
        .presentation-container {
            width: 100%;
            max-width: 1100px;
            background: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: var(--shadow);
            border: 1px solid rgba(255, 255, 255, 0.05);
            /* Maintains the 16:9 aspect ratio automatically */
            position: relative;
            padding-top: 56.25%; 
        }

        .presentation-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
    </style>
</head>
<body>

    <div class="presentation-container">
        <iframe 
            src="https://docs.google.com/presentation/d/e/2PACX-1vSVpx6GAbRMPxuhQiE3lqeNyJlLVWPojY6c_XXpicEgTYcjk_9gXJrO3m9Peh2alMhNYThkFdUJ4EGn/embed?start=false&loop=false&delayms=3000" 
            allowfullscreen="true" 
            mozallowfullscreen="true" 
            webkitallowfullscreen="true">
        </iframe>
    </div>

</body>
</html>
