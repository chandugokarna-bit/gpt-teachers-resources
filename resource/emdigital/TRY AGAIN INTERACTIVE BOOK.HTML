<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Emperor Arena - Unit 1 Lesson 2 Engine</title>
    <style>
        :root {
            --bg-glow: #030816;
            --panel-bg: rgba(10, 20, 38, 0.85);
            --neon-blue: #00f0ff;
            --neon-green: #39ff14;
            --neon-pink: #ff007f;
            --neon-orange: #ffaa00;
            --text-main: #ffffff;
            --text-sub: #9ab0d0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: radial-gradient(circle at center, #0d1b3e 0%, var(--bg-glow) 100%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            text-align: center;
            padding: 20px;
            background: rgba(4, 10, 24, 0.95);
            border-bottom: 3px solid var(--neon-pink);
            box-shadow: 0 0 30px rgba(255, 0, 127, 0.4);
        }

        header h1 {
            font-size: 2.3rem;
            color: var(--neon-pink);
            text-shadow: 0 0 15px var(--neon-pink);
            letter-spacing: 2px;
        }

        .main-container {
            display: flex;
            flex: 1;
            padding: 25px;
            gap: 25px;
            max-width: 1600px;
            margin: 0 auto;
            width: 100%;
        }

        /* Sidebar Nav */
        .sidebar {
            width: 340px;
            background: var(--panel-bg);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(0, 240, 255, 0.15);
            border-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.7);
        }

        .sidebar h2 {
            font-size: 1.2rem;
            color: var(--neon-blue);
            text-transform: uppercase;
            letter-spacing: 2px;
            text-align: center;
            text-shadow: 0 0 10px var(--neon-blue);
            margin-bottom: 10px;
        }

        .nav-btn {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 15px 18px;
            border-radius: 12px;
            color: var(--text-sub);
            text-align: left;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.2, 1, 0.2, 1);
            font-size: 0.95rem;
            font-weight: 500;
        }

        .nav-btn:hover {
            border-color: var(--neon-pink);
            color: var(--neon-pink);
            background: rgba(255, 0, 127, 0.08);
            transform: translateX(8px);
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.25);
        }

        .nav-btn.active {
            background: linear-gradient(90deg, rgba(255, 0, 127, 0.25), transparent);
            border-left: 5px solid var(--neon-pink);
            color: #ffffff;
            font-weight: bold;
            box-shadow: 0 0 20px rgba(255, 0, 127, 0.15);
        }

        /* Main Display Arena */
        .arena-display {
            flex: 1;
            background: var(--panel-bg);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(0, 240, 255, 0.15);
            border-radius: 20px;
            padding: 35px;
            position: relative;
            box-shadow: 0 20px 50px rgba(0,0,0,0.7);
            display: flex;
            flex-direction: column;
        }

        .score-board {
            position: absolute;
            top: 25px;
            right: 35px;
            background: rgba(255, 255, 255, 0.05);
            padding: 10px 22px;
            border-radius: 30px;
            border: 1px solid var(--neon-blue);
            font-weight: bold;
            color: var(--neon-blue);
            text-shadow: 0 0 10px var(--neon-blue);
        }

        .progress-indicator {
            color: var(--neon-orange);
            font-size: 0.9rem;
            margin-bottom: 8px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .game-header {
            border-bottom: 1px dashed rgba(255, 255, 255, 0.1);
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        .game-title {
            font-size: 2rem;
            color: var(--neon-green);
            text-shadow: 0 0 10px var(--neon-green);
            margin-bottom: 5px;
        }

        .game-desc {
            color: var(--text-sub);
            font-style: italic;
        }

        .content-box {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 30px;
            border-radius: 16px;
            margin-bottom: 25px;
            flex: 1;
        }

        .q-text {
            font-size: 1.25rem;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        /* Puzzle Mode Layout */
        .scrambled-box {
            font-size: 1.8rem;
            color: var(--neon-pink);
            letter-spacing: 4px;
            font-weight: bold;
            margin-bottom: 20px;
            text-shadow: 0 0 8px rgba(255,0,127,0.4);
        }

        .input-field {
            background: rgba(0,0,0,0.7);
            border: 1px solid rgba(255,255,255,0.15);
            padding: 15px;
            border-radius: 10px;
            color: white;
            width: 100%;
            font-size: 1.1rem;
            outline: none;
            transition: 0.3s;
        }
        .input-field:focus { border-color: var(--neon-pink); box-shadow: 0 0 10px rgba(255,0,127,0.3); }

        /* Sentence Sniper Snippets */
        .sniper-pool { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 20px; }
        .sniper-word { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.15); padding: 10px 20px; border-radius: 8px; cursor: pointer; font-size: 1.1rem; transition: 0.2s; }
        .sniper-word:hover { border-color: var(--neon-green); color: var(--neon-green); background: rgba(57,255,20,0.1); }
        .built-sentence { min-height: 55px; background: rgba(0,0,0,0.3); border-bottom: 2px solid var(--neon-green); margin-bottom: 20px; padding: 10px; font-size: 1.3rem; display: flex; gap: 8px; align-items: center; border-radius: 6px;}

        /* Dropdown Selector */
        .quantum-select { background: #0c1424; color: white; border: 1px solid var(--neon-blue); padding: 12px; border-radius: 8px; font-size: 1.1rem; width: 100%; outline: none; cursor: pointer; }

        /* Fun Fair Grid MCQ */
        .mcq-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
        .mcq-card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); padding: 15px 20px; border-radius: 10px; cursor: pointer; transition: 0.2s; }
        .mcq-card:hover { border-color: var(--neon-blue); background: rgba(0,240,255,0.05); }
        .mcq-card.active { border-color: var(--neon-blue); background: rgba(0,240,255,0.15); box-shadow: 0 0 10px rgba(0,240,255,0.2); }

        /* MULTI-OPTION Drag & Drop Architecture */
        .drag-container { display: flex; flex-direction: column; gap: 20px; margin-top: 20px; }
        .drag-box-pool { display: flex; flex-wrap: wrap; gap: 15px; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.08); padding: 15px; border-radius: 12px; min-height: 70px; }
        .drop-target-box { background: rgba(255, 0, 127, 0.02); border: 2px dashed var(--neon-pink); padding: 20px; border-radius: 12px; min-height: 80px; text-align: center; font-size: 1.2rem; color: var(--text-sub); transition: 0.3s; }
        .drop-target-box.drag-over { background: rgba(255, 0, 127, 0.15); border-style: solid; }
        .drag-item { background: #182848; border: 1px solid var(--neon-pink); padding: 10px 22px; border-radius: 8px; cursor: move; font-weight: bold; display: inline-block; user-select: none; }

        /* True/False Survival Grid */
        .tf-grid { display: flex; gap: 20px; margin-top: 20px; }
        .tf-btn { flex: 1; padding: 20px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.03); font-size: 1.3rem; font-weight: bold; cursor: pointer; color: white; text-align: center; transition: 0.2s; }
        .tf-btn.true-btn:hover { background: rgba(57,255,20,0.15); border-color: var(--neon-green); color: var(--neon-green); }
        .tf-btn.false-btn:hover { background: rgba(255,0,127,0.15); border-color: var(--neon-pink); color: var(--neon-pink); }
        .tf-btn.selected { background: rgba(255,170,0,0.2); border-color: var(--neon-orange); }

        /* Dialogue Theatre Layout */
        .chat-container { display: flex; flex-direction: column; gap: 15px; max-height: 300px; overflow-y: auto; padding: 10px; }
        .chat-bubble { max-width: 80%; padding: 12px 18px; border-radius: 15px; line-height: 1.4; font-size: 1.05rem; }
        .chat-bubble.left { background: #0f2042; align-self: flex-start; border-bottom-left-radius: 2px; border: 1px solid rgba(255,255,255,0.05); }

        /* Pair Matcher Styles */
        .pair-container { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 15px; }
        .pair-column { display: flex; flex-direction: column; gap: 10px; }
        .pair-node { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); padding: 12px; border-radius: 8px; cursor: pointer; transition: 0.2s; min-height: 50px; display: flex; align-items: center; user-select: none; }
        .pair-node:hover { border-color: var(--neon-orange); background: rgba(255,170,0,0.05); }
        .pair-node.selected { background: rgba(255,170,0,0.2); border-color: var(--neon-orange); box-shadow: 0 0 8px rgba(255,170,0,0.3); }
        .pair-node.matched { background: rgba(57,255,20,0.1); border-color: var(--neon-green); cursor: not-allowed; opacity: 0.6; }

        /* Action Buttons */
        .action-btn {
            background: linear-gradient(135deg, #ff007f, #7f00ff);
            border: none;
            color: white;
            padding: 15px 35px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            letter-spacing: 1px;
            transition: all 0.3s;
            box-shadow: 0 5px 25px rgba(255, 0, 127, 0.4);
            align-self: flex-start;
        }
        .action-btn:hover { transform: translateY(-3px); box-shadow: 0 8px 30px rgba(255, 0, 127, 0.6); }

        .feedback-txt { margin-top: 20px; font-weight: bold; font-size: 1.15rem; min-height: 30px; }
    </style>
</head>
<body>

    <header>
        <h1>GPT TEACHERS EDUCATIONAL RESOURCES, UTTARA KANNADA</h1>
        <p>Active Architecture: Unit 1 Learning Together Lesson 2 -TRY AGAIN  (Poorvi Curriculum)</p>
    </header>

    <div class="main-container">
        <div class="sidebar">
            <h2>Active Engines</h2>
            <button class="nav-btn active" id="btn-a1" onclick="loadGameEngine(1)">🧩 1. Word Puzzle Arena</button>
            <button class="nav-btn" id="btn-a2" onclick="loadGameEngine(2)">🎯 2. Sentence Sniper</button>
            <button class="nav-btn" id="btn-a3" onclick="loadGameEngine(3)">🔍 3. Hidden Clue Explorer</button>
            <button class="nav-btn" id="btn-a4" onclick="loadGameEngine(4)">🎡 4. Language Fun Fair</button>
            <button class="nav-btn" id="btn-a5" onclick="loadGameEngine(5)">🚂 5. Grammar Express</button>
            <button class="nav-btn" id="btn-a6" onclick="loadGameEngine(6)">🏕️ 6. Jungle Adventure</button>
            <button class="nav-btn" id="btn-a7" onclick="loadGameEngine(7)">🎭 7. Dialogue Theatre</button>
            <button class="nav-btn" id="btn-a8" onclick="showScienceLab()">🧪 8. Language Science Lab</button>
        </div>

        <div class="arena-display">
            <div class="score-board">GLOBAL XP: <span id="xp-global">0</span></div>
            <div class="progress-indicator" id="progress-indicator">Node Block 1 of 5</div>
            
            <div class="game-header">
                <div class="game-title" id="arena-title">Loading Framework...</div>
                <div class="game-desc" id="arena-desc">Booting data files...</div>
            </div>

            <div class="content-box" id="arena-body">
                </div>

            <button class="action-btn" id="submit-btn" onclick="validateCurrentNode()">VERIFY SUBMISSION NODE</button>
            <div id="arena-feedback" class="feedback-txt"></div>
        </div>
    </div>

    <script>
        // Data Matrix Configuration for Unit 1 - Lesson 2 (Poorvi Grade 7 Themes)
        const universeMatrix = {
            1: {
                title: "Word Puzzle Arena",
                desc: "Reassemble scrambled text strings to unlock unit vocabulary data.",
                items: [
                    { scrambled: "T O G E T H E R", question: "The core value of unit 1, working in unity:", answer: "together" },
                    { scrambled: "F R I E N D S H I P", question: "The warm bond formed between classmates:", answer: "friendship" },
                    { scrambled: "L E A R N I N G", question: "Acquiring new knowledge inside the ecosystem:", answer: "learning" },
                    { scrambled: "C L A S S M A T E", question: "A person who studies with you in the school dome:", answer: "classmate" },
                    { scrambled: "S E A S O N S", question: "The continuous changes in nature patterns (Spring, Winter...):", answer: "seasons" }
                ],
                engine: "puzzle"
            },
            2: {
                title: "Sentence Sniper",
                desc: "Build complete contextual structures by targeting blocks in the correct order.",
                items: [
                    { question: "Assemble the unity motto statement:", segments: ["We", "learn", "and", "play", "together", "happily"], answer: "We learn and play together happily" },
                    { question: "Reconstruct the friendly observation:", segments: ["Friends", "always", "help", "each", "other", "succeed"], answer: "Friends always help each other succeed" },
                    { question: "Build the school routine expression:", segments: ["Every", "morning", "we", "greet", "our", "teacher"], answer: "Every morning we greet our teacher" },
                    { question: "Assemble the learning goal descriptor:", segments: ["We", "love", "to", "read", "new", "books"], answer: "We love to read new books" },
                    { question: "Formulate the community framework:", segments: ["Working", "together", "makes", "us", "very", "strong"], answer: "Working together makes us very strong" }
                ],
                engine: "sniper"
            },
            3: {
                title: "Hidden Clue Explorer",
                desc: "Deploy drop-down matrix selectors to match correct conceptual criteria.",
                items: [
                    { question: "What is the primary benefit of collaborative team learning?", opts: ["It makes tasks harder", "It helps sharing unique ideas", "It causes arguments"], answer: "It helps sharing unique ideas" },
                    { question: "When students share rewards and work in unison, they create a...", opts: ["Community", "Factory", "Solitary zone"], answer: "Community" },
                    { question: "Which core attribute helps resolving conflicts among friends?", opts: ["Anger", "Patience and understanding", "Ignoring them"], answer: "Patience and understanding" },
                    { question: "What system helps us record our daily tasks and lessons?", opts: ["A notebook", "A stone", "A telescope"], answer: "A notebook" },
                    { question: "In a dynamic classroom, who plays the guide role?", opts: ["The principal only", "The teacher engine", "The textbook alone"], answer: "The teacher engine" }
                ],
                engine: "dropdown"
            },
            4: {
                title: "Language Fun Fair",
                desc: "Participate in the MCQ festival to lock states on Synonyms and Abstract Nouns.",
                items: [
                    { question: "Identify the Abstract Noun denoting a state of being unified:", opts: ["Team", "Unity", "Students", "Classroom"], answer: "Unity" },
                    { question: "What is a suitable synonym for the core action 'Collaborate'?", opts: ["Compete", "Work together", "Argue", "Divide"], answer: "Work together" },
                    { question: "Which word represents the plural node for 'Child'?", opts: ["Childs", "Children", "Childrens", "Childes"], answer: "Children" },
                    { question: "Identify the quality noun representing mutual trust:", opts: ["Friend", "Friendship", "Friendly", "Befriend"], answer: "Friendship" },
                    { question: "What is the opposite polarity of the word 'Success'?", opts: ["Victory", "Failure", "Growth", "Achievement"], answer: "Failure" }
                ],
                engine: "mcq"
            },
            5: {
                title: "Grammar Express",
                desc: "Drag the correct targeted Preposition or Conjunction from multiple options into the cargo dropzone.",
                items: [
                    { question: "We walked ______ the classroom to start the new lesson.", allOptions: ["into", "under", "above", "between"], answer: "into" },
                    { question: "Rahul sat ______ Amit and Kiran during the project work.", allOptions: ["between", "through", "among", "on"], answer: "between" },
                    { question: "They completed the presentation ______ they worked as a team.", allOptions: ["because", "but", "although", "unless"], answer: "because" },
                    { question: "The books were arranged neatly ______ the shelf.", allOptions: ["on", "at", "into", "over"], answer: "on" },
                    { question: "We always listen carefully ______ our teammates speak.", allOptions: ["while", "during", "so", "before"], answer: "while" }
                ],
                engine: "dragdrop"
            },
            6: {
                title: "Jungle Adventure Challenge",
                desc: "Lock True / False data points to survive critical core checks.",
                items: [
                    { question: "True learning only happens when you study alone without talking to anyone.", state: false },
                    { question: "Sharing knowledge with peers increases your own cognitive understanding.", state: true },
                    { question: "Making errors during a group active session is a natural part of progress.", state: true },
                    { question: "A good teammate always ignores the feedback given by other members.", state: false },
                    { question: "Unity and learning together are central themes of the Poorvi Unit 1 layout.", state: true }
                ],
                engine: "boolean"
            },
            7: {
                title: "Dialogue Theatre",
                desc: "Engage conversation blocks with interactive matrix choices.",
                items: [
                    { context: "Student A: 'This group assignment looks very difficult. Can we finish it?'", prompt: "Choose the supportive team response:", opts: ["'Yes, if we divide the work and learn together!'", "'No, let's ask the teacher to cancel it.'"], answer: "'Yes, if we divide the work and learn together!'" },
                    { context: "Teacher: 'Excellent work on the project. How did you do it so fast?'", prompt: "Choose the team's reply node:", opts: ["'We all collaborated and combined our best ideas.'", "'Only one person did all the work.'"], answer: "'We all collaborated and combined our best ideas.'" },
                    { context: "Student B: 'I made a spelling mistake in our chart paper draft.'", prompt: "Choose the constructive reaction:", opts: ["'Don't worry, we can fix it together right now.'", "'You ruined the entire team score.'"], answer: "'Don't worry, we can fix it together right now.'" },
                    { context: "New Peer: 'Can I join your learning circle deck for this unit?'", prompt: "Choose the welcoming node statement:", opts: ["'Welcome! More minds make the work easier.'", "'Sorry, our matrix team capacity is full.'"], answer: "'Welcome! More minds make the work easier.'" },
                    { context: "Student C: 'Why should we share our custom notes with everyone?'", prompt: "Choose the collaborative growth answer:", opts: ["'Because learning together helps everyone grow up.'", "'So that we can get money from them.'"], answer: "'Because learning together helps everyone grow up.'" }
                ],
                engine: "dialogue"
            }
        };

        let activeEngineIndex = 1;
        let activeNodeIndex = 0;
        let globalXP = 0;
        
        // State management
        window.draggedValue = "";
        window.droppedValue = "";
        window.selectedMCQValue = "";
        window.selectedBooleanState = null;
        window.selectedDialogueAns = "";
        let selectedLeftNode = null;
        let selectedRightNode = null;

        function loadGameEngine(engineId) {
            activeEngineIndex = engineId;
            activeNodeIndex = 0;
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-a' + engineId).classList.add('active');
            renderActiveNode();
        }

        function renderActiveNode() {
            const matrixBlock = universeMatrix[activeEngineIndex];
            document.getElementById('arena-title').innerText = matrixBlock.title;
            document.getElementById('arena-desc').innerText = matrixBlock.desc;
            document.getElementById('arena-feedback').innerText = "";
            document.getElementById('submit-btn').style.display = "block";
            document.getElementById('progress-indicator').innerText = `Node Question ${activeNodeIndex + 1} of ${matrixBlock.items.length}`;

            const nodeItem = matrixBlock.items[activeNodeIndex];
            const displayFrame = document.getElementById('arena-body');
            displayFrame.innerHTML = "";

            if (matrixBlock.engine === "puzzle") {
                displayFrame.innerHTML = `
                    <p class="q-text">${nodeItem.question}</p>
                    <div class="scrambled-box">${nodeItem.scrambled}</div>
                    <input type="text" id="puzzle-node-input" class="input-field" placeholder="Decrypt the unscrambled word matrix...">
                `;
            } 
            else if (matrixBlock.engine === "sniper") {
                displayFrame.innerHTML = `
                    <p class="q-text">${nodeItem.question}</p>
                    <div class="built-sentence" id="built-sentence-zone"></div>
                    <div class="sniper-pool" id="sniper-pool-zone"></div>
                `;
                let currentBuild = [];
                let shuffled = [...nodeItem.segments].sort(() => Math.random() - 0.5);
                shuffled.forEach(word => {
                    let wordBtn = document.createElement('div');
                    wordBtn.className = "sniper-word";
                    wordBtn.innerText = word;
                    wordBtn.onclick = () => {
                        currentBuild.push(word);
                        document.getElementById('built-sentence-zone').innerText = currentBuild.join(" ");
                        wordBtn.style.display = "none";
                    };
                    document.getElementById('sniper-pool-zone').appendChild(wordBtn);
                });
            }
            else if (matrixBlock.engine === "dropdown") {
                let optionsHtml = nodeItem.opts.map(o => `<option value="${o}">${o}</option>`).join("");
                displayFrame.innerHTML = `
                    <p class="q-text">${nodeItem.question}</p>
                    <select id="dropdown-node-select" class="quantum-select">
                        <option value="">-- SELECT CLUE DATA VECTOR --</option>
                        ${optionsHtml}
                    </select>
                `;
            }
            else if (matrixBlock.engine === "mcq") {
                displayFrame.innerHTML = `<p class="q-text">${nodeItem.question}</p><div class="mcq-grid" id="mcq-zone"></div>`;
                window.selectedMCQValue = "";
                nodeItem.opts.forEach(o => {
                    let card = document.createElement('div');
                    card.className = "mcq-card";
                    card.innerText = o;
                    card.onclick = () => {
                        document.querySelectorAll('.mcq-card').forEach(c => c.classList.remove('active'));
                        card.classList.add('active');
                        window.selectedMCQValue = o;
                    };
                    document.getElementById('mcq-zone').appendChild(card);
                });
            }
            else if (matrixBlock.engine === "dragdrop") {
                window.droppedValue = "";
                displayFrame.innerHTML = `
                    <p class="q-text">${nodeItem.question}</p>
                    <div class="drag-container">
                        <div class="drag-box-pool" id="drag-pool-box"></div>
                        <div class="drop-target-box" id="drop-target-zone">Drop your chosen targeted answers here...</div>
                    </div>
                `;
                
                let targetZone = document.getElementById('drop-target-zone');
                targetZone.addEventListener('dragover', (e) => { e.preventDefault(); targetZone.classList.add('drag-over'); });
                targetZone.addEventListener('dragleave', () => { targetZone.classList.remove('drag-over'); });
                targetZone.addEventListener('drop', (e) => {
                    e.preventDefault();
                    targetZone.classList.remove('drag-over');
                    window.droppedValue = window.draggedValue;
                    targetZone.innerText = "Loaded Target: " + window.droppedValue;
                    targetZone.style.borderColor = "var(--neon-green)";
                });

                nodeItem.allOptions.forEach((opt, idx) => {
                    let dragItem = document.createElement('div');
                    dragItem.className = "drag-item";
                    dragItem.draggable = true;
                    dragItem.innerText = opt;
                    dragItem.id = "drag-opt-" + idx;
                    dragItem.addEventListener('dragstart', () => { window.draggedValue = opt; });
                    document.getElementById('drag-pool-box').appendChild(dragItem);
                });
            }
            else if (matrixBlock.engine === "boolean") {
                displayFrame.innerHTML = `
                    <p class="q-text">${nodeItem.question}</p>
                    <div class="tf-grid">
                        <button class="tf-btn true-btn" id="tf-t" onclick="setBooleanState(true)">TRUE / DATA VALID</button>
                        <button class="tf-btn false-btn" id="tf-f" onclick="setBooleanState(false)">FALSE / ANOMALY</button>
                    </div>
                `;
                window.selectedBooleanState = null;
            }
            else if (matrixBlock.engine === "dialogue") {
                displayFrame.innerHTML = `
                    <div class="chat-container">
                        <div class="chat-bubble left">${nodeItem.context}</div>
                    </div>
                    <p class="q-text" style="margin-top:15px; color:var(--neon-pink);">${nodeItem.prompt}</p>
                    <div class="mcq-grid" id="dialogue-choices"></div>
                `;
                window.selectedDialogueAns = "";
                nodeItem.opts.forEach(o => {
                    let card = document.createElement('div');
                    card.className = "mcq-card";
                    card.innerText = o;
                    card.onclick = () => {
                        document.querySelectorAll('.mcq-card').forEach(c => c.classList.remove('active'));
                        card.classList.add('active');
                        window.selectedDialogueAns = o;
                    };
                    document.getElementById('dialogue-choices').appendChild(card);
                });
            }
        }

        function setBooleanState(state) {
            window.selectedBooleanState = state;
            document.getElementById('tf-t').classList.remove('selected');
            document.getElementById('tf-f').classList.remove('selected');
            if(state) document.getElementById('tf-t').classList.add('selected');
            else document.getElementById('tf-f').classList.add('selected');
        }

        function validateCurrentNode() {
            const matrixBlock = universeMatrix[activeEngineIndex];
            const nodeItem = matrixBlock.items[activeNodeIndex];
            let isVerified = false;
            let feedback = document.getElementById('arena-feedback');

            if (matrixBlock.engine === "puzzle") {
                let userAns = document.getElementById('puzzle-node-input').value.trim().toLowerCase();
                if (userAns === nodeItem.answer.toLowerCase()) isVerified = true;
            }
            else if (matrixBlock.engine === "sniper") {
                let userAns = document.getElementById('built-sentence-zone').innerText;
                if (userAns === nodeItem.answer) isVerified = true;
            }
            else if (matrixBlock.engine === "dropdown") {
                let userAns = document.getElementById('dropdown-node-select').value;
                if (userAns === nodeItem.answer) isVerified = true;
            }
            else if (matrixBlock.engine === "mcq") {
                if (window.selectedMCQValue === nodeItem.answer) isVerified = true;
            }
            else if (matrixBlock.engine === "dragdrop") {
                if (window.droppedValue === nodeItem.answer) isVerified = true;
            }
            else if (matrixBlock.engine === "boolean") {
                if (window.selectedBooleanState === nodeItem.state) isVerified = true;
            }
            else if (matrixBlock.engine === "dialogue") {
                if (window.selectedDialogueAns === nodeItem.answer) isVerified = true;
            }

            if (isVerified) {
                feedback.innerText = "⚡ SUCCESS: Node Parameter Authenticated! (+20 XP)";
                feedback.style.color = "var(--neon-green)";
                globalXP += 20;
                document.getElementById('xp-global').innerText = globalXP;

                setTimeout(() => {
                    activeNodeIndex++;
                    if(activeNodeIndex < matrixBlock.items.length) {
                        renderActiveNode();
                    } else {
                        feedback.innerText = "🏆 SECTION LOCKED: All system matrices completed.";
                        feedback.style.color = "var(--neon-blue)";
                        document.getElementById('submit-btn').style.display = "none";
                    }
                }, 1200);
            } else {
                feedback.innerText = "❌ EXCEPTION ERROR: Mismatch detected. Core Block Rejected.";
                feedback.style.color = "var(--neon-pink)";
            }
        }

        // 8. Language Science Lab (Click-Pair Matching Engine)
        function showScienceLab() {
            activeEngineIndex = 8;
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-a8').classList.add('active');
            
            document.getElementById('progress-indicator').innerText = "Quantum Pair Combinator Engine";
            document.getElementById('arena-title').innerText = "Language Science Lab";
            document.getElementById('arena-desc').innerText = "Mix and pair terms to produce stable linguistic chemical bonds.";
            document.getElementById('arena-feedback').innerText = "";
            document.getElementById('submit-btn').style.display = "none";

            const leftData = ["Cooperate", "Goal", "Interact", "Peer", "Review"];
            const rightData = [
                "To work with another person dynamically",
                "The objective or target of learning",
                "To communicate and talk with teammates",
                "A classmate of equal standing system",
                "To inspect and evaluate work quality carefully"
            ];

            const answersMap = {
                "Cooperate": "To work with another person dynamically",
                "Goal": "The objective or target of learning",
                "Interact": "To communicate and talk with teammates",
                "Peer": "A classmate of equal standing system",
                "Review": "To inspect and evaluate work quality carefully"
            };

            const body = document.getElementById('arena-body');
            body.innerHTML = `<div class="pair-container"><div class="pair-column" id="left-col"></div><div class="pair-column" id="right-col"></div></div>`;

            leftData.forEach(text => {
                let node = document.createElement('div');
                node.className = "pair-node";
                node.innerText = text;
                node.onclick = () => {
                    if(node.classList.contains('matched')) return;
                    document.querySelectorAll('#left-col .pair-node').forEach(n => n.classList.remove('selected'));
                    node.classList.add('selected');
                    selectedLeftNode = text;
                    evaluatePairBond(answersMap);
                };
                document.getElementById('left-col').appendChild(node);
            });

            let shuffledRight = [...rightData].sort(() => Math.random() - 0.5);
            shuffledRight.forEach(text => {
                let node = document.createElement('div');
                node.className = "pair-node";
                node.innerText = text;
                node.onclick = () => {
                    if(node.classList.contains('matched')) return;
                    document.querySelectorAll('#right-col .pair-node').forEach(n => n.classList.remove('selected'));
                    node.classList.add('selected');
                    selectedRightNode = text;
                    evaluatePairBond(answersMap);
                };
                document.getElementById('right-col').appendChild(node);
            });
        }

        function evaluatePairBond(answersMap) {
            if(selectedLeftNode && selectedRightNode) {
                let feedback = document.getElementById('arena-feedback');
                if(answersMap[selectedLeftNode] === selectedRightNode) {
                    feedback.innerText = "🧪 REACTION SUCCESSFUL: Stable Bond Created! (+30 XP)";
                    feedback.style.color = "var(--neon-green)";
                    globalXP += 30;
                    document.getElementById('xp-global').innerText = globalXP;

                    document.querySelectorAll('.pair-node').forEach(node => {
                        if(node.innerText === selectedLeftNode || node.innerText === selectedRightNode) {
                            node.classList.remove('selected');
                            node.classList.add('matched');
                        }
                    });
                } else {
                    feedback.innerText = "💥 CHEMICAL FAILURE: Elements repelled elements.";
                    feedback.style.color = "var(--neon-pink)";
                    document.querySelectorAll('.pair-node').forEach(node => node.classList.remove('selected'));
                }
                selectedLeftNode = null;
                selectedRightNode = null;
            }
        }

        window.onload = () => { loadGameEngine(1); };
    </script>
</body>
