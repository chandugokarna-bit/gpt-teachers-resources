<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biodiversity Bingo</title>
    <style>
        :root {
            --bg-color: #06090e;
            --card-bg: rgba(22, 28, 45, 0.4);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --emerald-accent: #10b981;
            --emerald-glow: rgba(16, 185, 129, 0.15);
            --fail-red: #f43f5e;
            --radius-lg: 24px;
            --radius-md: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, rgba(16, 185, 129, 0.07) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(56, 189, 248, 0.04) 0px, transparent 50%);
            color: var(--text-main);
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            text-align: center;
            margin-bottom: 35px;
        }

        header h1 {
            font-size: 2.75rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            margin-bottom: 12px;
            background: linear-gradient(to right, #ffffff, #a7f3d0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header p {
            color: var(--text-muted);
            font-size: 1.15rem;
            max-width: 600px;
        }

        .container {
            width: 100%;
            max-width: 850px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* Stats Dashboard */
        .dashboard {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 18px 28px;
            border-radius: var(--radius-md);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .score-box {
            font-size: 1.2rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.01em;
        }

        /* Clue UI Panel */
        .clue-box {
            background: rgba(16, 185, 129, 0.04);
            border: 1px solid rgba(16, 185, 129, 0.2);
            padding: 35px;
            border-radius: var(--radius-lg);
            text-align: center;
            box-shadow: inset 0 0 20px rgba(16, 185, 129, 0.02);
            position: relative;
        }

        .clue-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--emerald-accent);
            font-weight: 700;
            margin-bottom: 14px;
        }

        .clue-text {
            font-size: 1.45rem;
            font-weight: 600;
            color: #ffffff;
            line-height: 1.5;
            letter-spacing: -0.01em;
        }

        /* Grid Framework */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
            gap: 20px;
            margin-top: 10px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-md);
            padding: 30px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            user-select: none;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .card:hover {
            transform: translateY(-6px);
            border-color: rgba(16, 185, 129, 0.4);
            background: rgba(22, 28, 45, 0.6);
            box-shadow: 0 20px 30px -10px rgba(0, 0, 0, 0.7);
        }

        .card .emoji {
            font-size: 3.5rem;
            margin-bottom: 14px;
            display: block;
            filter: drop-shadow(0 8px 12px rgba(0,0,0,0.3));
            transition: transform 0.2s ease;
        }

        .card:hover .emoji {
            transform: scale(1.08);
        }

        .card .name {
            font-size: 1.15rem;
            font-weight: 600;
            color: #e2e8f0;
        }

        /* Answer Validation States */
        .card.correct {
            background: rgba(16, 185, 129, 0.15) !important;
            border-color: var(--emerald-accent) !important;
            box-shadow: 0 0 25px rgba(16, 185, 129, 0.2) !important;
        }
        .card.correct .name { color: #ffffff; }

        .card.wrong {
            background: rgba(244, 63, 94, 0.12) !important;
            border-color: var(--fail-red) !important;
            box-shadow: 0 0 25px rgba(244, 63, 94, 0.15) !important;
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }
        .card.wrong .name { color: #ffffff; }

        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }

        .feedback-message {
            text-align: center;
            font-size: 1.25rem;
            font-weight: 600;
            min-height: 35px;
            letter-spacing: -0.01em;
        }

        .btn-reset {
            background: #ffffff;
            color: var(--bg-color);
            border: none;
            padding: 10px 22px;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-reset:hover {
            background: #e2e8f0;
            transform: translateY(-1px);
        }
    </style>
</head>
<body>

    <header>
        <h1>🌿 Biodiversity Bingo 🐾</h1>
        <p>Analyze the biological profile clue thoroughly, then pick the corresponding ecosystem card!</p>
    </header>

    <div class="container">
        
        <!-- Dashboard Tracking Matrix -->
        <div class="dashboard">
            <div class="score-box" id="scoreDisplay">🏆 Score: 0 / 0</div>
            <button class="btn-reset" onclick="resetGame()">Reset Board</button>
        </div>

        <!-- Diagnostic Prompt Window -->
        <div class="clue-box">
            <div class="clue-title">💡 Teacher's Diagnostic Clue</div>
            <div class="clue-text" id="clueDisplay">Fetching ecosystem telemetry...</div>
        </div>

        <!-- Telemetry Validation Messages -->
        <div class="feedback-message" id="feedbackDisplay"></div>

        <!-- Target Destination Grid Matrix -->
        <div class="cards-grid" id="cardsGrid">
            <!-- Populated via JavaScript dynamically -->
        </div>

    </div>

    <script>
        // Biodiversity Structured Database Architectural Profiles
        const biodiversityData = [
            { id: 1, name: "Holy Basil", emoji: "🌿", clue: "I am a small plant with a green, tender stem—classified anatomically as a 'Herb'." },
            { id: 2, name: "Fish", emoji: "🐟", clue: "I am an 'Aquatic Organism' residing in water bodies, relying on gills for respiration." },
            { id: 3, name: "Banyan Tree", emoji: "🌳", clue: "I am a massive perennial plant featuring a thick woody trunk supported by 'Aerial Roots'." },
            { id: 4, name: "Frog", emoji: "🐸", clue: "I am an 'Amphibian' capable of physiological survival across both terrestrial and aquatic biomes." },
            { id: 5, name: "Rose", emoji: "🌹", clue: "I am a woody 'Shrub' possessing multiple structural stems armed with defensive thorns." },
            { id: 6, name: "Lion", emoji: "🦁", clue: "I am an apex predator, strictly an obligate 'Carnivore' feeding exclusively on animal tissue." },
            { id: 7, name: "Duck", emoji: "🦆", clue: "I am an avian organism specialized for surface propulsion via specialized 'Webbed Feet'." },
            { id: 8, name: "Cactus", emoji: "🌵", clue: "I am a desert plant specialized for extreme arid biomes; my leaves are modified into 'Spines' to conserve water." }
        ];

        let currentItem = null;
        let score = 0;
        let totalAttempts = 0;
        let canClick = true;

        // Initialize Core Evaluation Environment
        function initGame() {
            canClick = true;
            document.getElementById('feedbackDisplay').innerText = "";
            
            // Acquire randomized diagnostic parameter
            const randomIndex = Math.floor(Math.random() * biodiversityData.length);
            currentItem = biodiversityData[randomIndex];
            document.getElementById('clueDisplay').innerText = currentItem.clue;

            renderCards();
        }

        // Render Dynamic Matrix Node Array
        function renderCards() {
            const grid = document.getElementById('cardsGrid');
            grid.innerHTML = '';

            biodiversityData.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <span class="emoji">${item.emoji}</span>
                    <span class="name">${item.name}</span>
                `;
                card.onclick = () => checkAnswer(item, card);
                grid.appendChild(card);
            });
        }

        // Evaluate Intercepted Answer Parameter
        function checkAnswer(selectedItem, cardElement) {
            if (!canClick) return;

            totalAttempts++;
            canClick = false; 

            const feedback = document.getElementById('feedbackDisplay');

            if (selectedItem.id === currentItem.id) {
                // Handle validated payload state
                score++;
                cardElement.classList.add('correct');
                feedback.innerText = `🎉 Correct Profile! Verified as "${selectedItem.name}".`;
                feedback.style.color = "var(--emerald-accent)";
            } else {
                // Handle error generation state
                cardElement.classList.add('wrong');
                feedback.innerText = `❌ Incorrect Selection! Correct target was "${currentItem.name}".`;
                feedback.style.color = "var(--fail-red)";
                
                highlightCorrectCard();
            }

            // Push state telemetry to UI element
            document.getElementById('scoreDisplay').innerText = `🏆 Score: ${score} / ${totalAttempts}`;

            // Enforce window timeout restriction prior to reload state execution
            setTimeout(() => {
                initGame();
            }, 2500);
        }

        // Project Target Visual Indicator Node on Evaluation Discrepancy
        function highlightCorrectCard() {
            const cards = document.querySelectorAll('.card');
            cards.forEach(card => {
                const nameSpan = card.querySelector('.name').innerText;
                if (nameSpan === currentItem.name) {
                    card.classList.add('correct');
                }
            });
        }

        // Purge Evaluation Environment Telemetry Values
        function resetGame() {
            score = 0;
            totalAttempts = 0;
            document.getElementById('scoreDisplay').innerText = `🏆 Score: 0 / 0`;
            initGame();
        }

        window.onload = initGame;
    </script>
</body>
</html>
