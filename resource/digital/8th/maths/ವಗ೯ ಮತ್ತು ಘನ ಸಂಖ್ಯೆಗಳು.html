<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <title>ವರ್ಗ ಮತ್ತು ಘನ ಪ್ರಯೋಗಾಲಯ (Math Lab)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #0f172a; color: #f8fafc; font-family: 'Segoe UI', sans-serif; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="glass p-8 rounded-3xl shadow-2xl border border-slate-700 max-w-lg w-full">
        <h1 class="text-3xl font-bold text-sky-400 mb-2">ಗಣಿತ ಪ್ರಯೋಗಾಲಯ 🔢</h1>
        <p class="text-slate-400 mb-6">ಸಂಖ್ಯೆಯನ್ನು ನಮೂದಿಸಿ (Enter a number 'n'):</p>
        
        <input type="number" id="n" placeholder="ಉದಾಹರಣೆಗೆ: 5" 
               class="w-full bg-slate-900 border border-slate-600 p-4 rounded-xl mb-4 focus:ring-2 focus:ring-sky-500 outline-none">
        
        <button onclick="compute()" class="w-full bg-sky-600 hover:bg-sky-500 py-3 rounded-xl font-bold transition">ಪರಿಶೋಧಿಸಿ (Explore)</button>

        <div id="out" class="mt-8 space-y-4"></div>
    </div>

    <script>
        function compute() {
            let n = parseInt(document.getElementById('n').value);
            if(!n) return;
            
            let sq = n * n;
            let cb = n * n * n;
            
            // Logic for odd number pattern (1+3+5... = n^2)
            let pattern = [];
            let sum = 0;
            for(let i = 0; i < n; i++) {
                let odd = 2 * i + 1;
                pattern.push(odd);
                sum += odd;
            }

            document.getElementById('out').innerHTML = `
                <div class="bg-slate-700 p-4 rounded-lg">
                    <p class="text-lg">ವರ್ಗ (Square): ${n}² = <span class="text-sky-300 font-bold">${sq}</span></p>
                    <p class="text-lg">ಘನ (Cube): ${n}³ = <span class="text-emerald-300 font-bold">${cb}</span></p>
                    <p class="mt-4 text-sm text-slate-300">ವಿನ್ಯಾಸ (Pattern): ${pattern.join(' + ')} = ${sum}</p>
                </div>
            `;
        }
    </script>
</body>
</html>
