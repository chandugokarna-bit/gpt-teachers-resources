<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <title>ನೈಸರ್ಗಿಕ ಸೂಚಕಗಳ ಪ್ರಯೋಗಾಲಯ</title>
    <style>
        body { font-family: 'Arial', sans-serif; text-align: center; background-color: #fdf6e3; padding: 20px; }
        .box { max-width: 500px; margin: auto; background: white; padding: 25px; border-radius: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        h1 { color: #d35400; }
        select, button { padding: 10px; margin: 10px; font-size: 16px; border-radius: 10px; border: 1px solid #bdc3c7; cursor: pointer; }
        button { background-color: #27ae60; color: white; border: none; }
        .glass { width: 120px; height: 160px; border: 4px solid #34495e; border-top: none; margin: 20px auto; border-radius: 0 0 20px 20px; position: relative; }
        #liquid { position: absolute; bottom: 0; width: 100%; height: 60%; background-color: #e91e63; transition: 1s; }
    </style>
</head>
<body>

<div class="box">
    <h1>🧪 ದೈನಂದಿನ ಜೀವನದ ಆಮ್ಲ-ಪ್ರತ್ಯಾಮ್ಲ</h1>
    
    <label>ಸೂಚಕವನ್ನು ಆರಿಸಿ:</label><br>
    <select id="indicator" onchange="updateDefault()">
        <option value="hibiscus">ದಾಸವಾಳ</option>
        <option value="rose">ಗುಲಾಬಿ</option>
        <option value="cabbage">ಕೆಂಪು ಎಲೆಕೋಸು</option>
        <option value="turmeric">ಅರಿಶಿನ</option>
    </select>
    
    <br>
    <label>ಪದಾರ್ಥವನ್ನು ಆರಿಸಿ:</label><br>
    <select id="substance">
        <optgroup label="ಆಮ್ಲಗಳು (Acids)">
            <option value="acid-lemon">ಲಿಂಬೆ ಹಣ್ಣಿನ ರಸ</option>
            <option value="acid-vinegar">ವಿನೆಗರ್</option>
        </optgroup>
        <optgroup label="ಪ್ರತ್ಯಾಮ್ಲಗಳು (Bases)">
            <option value="base-soap">ಸೋಪು ದ್ರಾವಣ</option>
            <option value="base-baking">ಅಡುಗೆ ಸೋಡಾ</option>
        </optgroup>
        <optgroup label="ತಟಸ್ಥ (Neutral)">
            <option value="neutral-salt">ಉಪ್ಪು ನೀರು</option>
            <option value="neutral-water">ಶುದ್ಧ ನೀರು</option>
        </optgroup>
    </select>
    
    <br>
    <button onclick="test()">ಪರೀಕ್ಷಿಸಿ</button>

    <div class="glass"><div id="liquid"></div></div>
    <h3 id="result">ಫಲಿತಾಂಶಕ್ಕಾಗಿ ಪರೀಕ್ಷಿಸಿ ಒತ್ತಿ</h3>
</div>

<script>
    const defaults = { hibiscus: '#e91e63', rose: '#ff69b4', cabbage: '#8e44ad', turmeric: '#f1c40f' };

    function updateDefault() {
        const ind = document.getElementById('indicator').value;
        document.getElementById('liquid').style.backgroundColor = defaults[ind];
        document.getElementById('result').innerText = "ಫಲಿತಾಂಶ ಇಲ್ಲಿ ಕಾಣಿಸುತ್ತದೆ";
    }

    function test() {
        const ind = document.getElementById('indicator').value;
        const sub = document.getElementById('substance').value;
        const liq = document.getElementById('liquid');
        const res = document.getElementById('result');
        let type = sub.split('-')[0];

        if (ind === 'hibiscus') {
            if (type === 'acid') { liq.style.backgroundColor = "#c2185b"; res.innerText = "ಫಲಿತಾಂಶ: ಕಡು ಗುಲಾಬಿ (ಆಮ್ಲ)."; }
            else if (type === 'base') { liq.style.backgroundColor = "#2ecc71"; res.innerText = "ಫಲಿತಾಂಶ: ಹಸಿರು (ಪ್ರತ್ಯಾಮ್ಲ)."; }
            else { liq.style.backgroundColor = "#e91e63"; res.innerText = "ಫಲಿತಾಂಶ: ಬದಲಾವಣೆ ಇಲ್ಲ (ತಟಸ್ಥ)."; }
        } else if (ind === 'rose') {
            if (type === 'acid') { liq.style.backgroundColor = "#ff69b4"; res.innerText = "ಫಲಿತಾಂಶ: ಗುಲಾಬಿ ಬಣ್ಣ (ಆಮ್ಲ)."; }
            else if (type === 'base') { liq.style.backgroundColor = "#f1c40f"; res.innerText = "ಫಲಿತಾಂಶ: ಹಳದಿ/ಹಸಿರು (ಪ್ರತ್ಯಾಮ್ಲ)."; }
            else { liq.style.backgroundColor = "#ff69b4"; res.innerText = "ಫಲಿತಾಂಶ: ಬದಲಾವಣೆ ಇಲ್ಲ (ತಟಸ್ಥ)."; }
        } else if (ind === 'cabbage') {
            if (type === 'acid') { liq.style.backgroundColor = "#e74c3c"; res.innerText = "ಫಲಿತಾಂಶ: ಕೆಂಪು/ಗುಲಾಬಿ (ಆಮ್ಲ)."; }
            else if (type === 'base') { liq.style.backgroundColor = "#2ecc71"; res.innerText = "ಫಲಿತಾಂಶ: ಹಸಿರು (ಪ್ರತ್ಯಾಮ್ಲ)."; }
            else { liq.style.backgroundColor = "#8e44ad"; res.innerText = "ಫಲಿತಾಂಶ: ನೇರಳೆ (ತಟಸ್ಥ)."; }
        } else if (ind === 'turmeric') {
            if (type === 'acid') { liq.style.backgroundColor = "#f1c40f"; res.innerText = "ಫಲಿತಾಂಶ: ಹಳದಿ (ಆಮ್ಲ)."; }
            else if (type === 'base') { liq.style.backgroundColor = "#c0392b"; res.innerText = "ಫಲಿತಾಂಶ: ಕೆಂಪು (ಪ್ರತ್ಯಾಮ್ಲ)."; }
            else { liq.style.backgroundColor = "#f1c40f"; res.innerText = "ಫಲಿತಾಂಶ: ಹಳದಿ (ತಟಸ್ಥ)."; }
        }
    }
</script>
</body>
</html>
