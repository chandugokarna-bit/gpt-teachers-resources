<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ಶಿಲಾಯುಗದ ರಹಸ್ಯ ನಕ್ಷೆ - ಇಂಟರಾಕ್ಟಿವ್ ಕ್ವಿಜ್</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fcfcfc;
            text-align: center;
            margin: 0;
            padding: 20px;
            user-select: none;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 5px;
        }
        .instruction {
            color: #555;
            font-size: 18px;
            margin-bottom: 20px;
        }
        
        /* ಮುಖ್ಯ ಕಂಟೇನರ್ */
        .game-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px;
            max-width: 1100px;
            margin: 0 auto;
            flex-wrap: wrap;
        }

        /* ಪ್ರಶ್ನೆಯ ಬಾಕ್ಸ್ */
        .question-box {
            background-color: #ffffff;
            border-left: 5px solid #3498db;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            width: 350px;
            text-align: left;
        }
        .question-box h3 {
            margin-top: 0;
            color: #34495e;
        }
        #question-text {
            font-size: 18px;
            font-weight: bold;
            color: #2c3e50;
            line-height: 1.5;
        }

        /* ನಕ್ಷೆಯ ಏರಿಯಾ */
        .map-container {
            position: relative;
            background: #eef2f3;
            border: 2px solid #bdc3c7;
            border-radius: 15px;
            padding: 10px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }
        
        /* ರಹಸ್ಯ ಬಿಂದುಗಳು (Hotspots) */
        .hotspot {
            position: absolute;
            width: 24px;
            height: 24px;
            background-color: rgba(52, 152, 219, 0.4); /* ಆರಂಭದಲ್ಲಿ ಮಸುಕಾದ ನೀಲಿ */
            border: 2px solid #3498db;
            border-radius: 50%;
            cursor: pointer;
            transform: translate(-50%, -50%);
            transition: all 0.3s ease;
        }
        .hotspot:hover {
            background-color: rgba(52, 152, 219, 0.8);
            box-shadow: 0 0 10px #3498db;
        }

        /* ಸರಿ ಮತ್ತು ತಪ್ಪು ಲೈಟ್ಸ್ */
        .hotspot.correct {
            background-color: #2ecc71 !important;
            border-color: #27ae60 !important;
            box-shadow: 0 0 15px #2ecc71;
            animation: pulse 1s infinite;
        }
        
        /* ಮಾಹಿತಿ ಪಾಪ್-ಅಪ್ (Modal) */
        .popup {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            z-index: 10;
            width: 320px;
            text-align: center;
            animation: fadeIn 0.3s ease;
        }
        .popup h2 {
            margin-top: 0;
            color: #27ae60;
        }
        .popup p {
            color: #555;
            font-size: 16px;
            line-height: 1.4;
        }
        .popup button {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 15px;
        }
        .overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4);
            z-index: 5;
        }

        #score-board {
            font-size: 20px;
            font-weight: bold;
            margin-top: 25px;
            color: #2c3e50;
        }

        @keyframes pulse {
            0% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.2); }
            100% { transform: translate(-50%, -50%) scale(1); }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translate(-50%, -45%); }
            to { opacity: 1; transform: translate(-50%, -50%); }
        }
    </style>
</head>
<body>

    <h1>೧ನೇ ಪಾಠ: ಶಿಲಾಯುಗದ "ರಹಸ್ಯ ನಕ್ಷೆ" ಕ್ವಿಜ್</h1>
    <p class="instruction">ಎಡಭಾಗದ ಪ್ರಶ್ನೆಯನ್ನು ಓದಿ, ಭಾರತದ ನಕ್ಷೆಯ ಮೇಲಿರುವ ಸರಿಯಾದ ರಹಸ್ಯ ಬಿಂದುವನ್ನು (Hotspot) ಕ್ಲಿಕ್ ಮಾಡಿ!</p>

    <div class="game-container">
        
        <div class="question-box">
            <h3>📍 ಪ್ರಸ್ತುತ ಪ್ರಶ್ನೆ:</h3>
            <p id="question-text">ಪ್ರಶ್ನೆ ಲೋಡ್ ಆಗುತ್ತಿದೆ...</p>
        </div>

        <div class="map-container">
            <svg width="400" height="480" viewBox="0 0 400 480" style="background-color: #fff; border-radius: 10px;">
                <path d="M180,40 L230,40 L260,80 L250,120 L300,160 L340,180 L310,220 L270,210 L250,240 L240,290 L220,330 L190,440 L185,440 L140,320 L130,280 L100,260 L80,220 L120,200 L150,150 L140,100 Z" fill="#e0e0e0" stroke="#95a5a6" stroke-width="2"/>
                <text x="160" y="230" fill="#7f8c8d" font-size="12" font-weight="bold">ಭಾರತದ ನಕ್ಷೆ</text>
            </svg>

            <div class="hotspot" id="bimbetka" style="top: 220px; left: 175px;" onclick="checkSpot('bimbetka')"></div>
            
            <div class="hotspot" id="hunasagi" style="top: 325px; left: 165px;" onclick="checkSpot('hunasagi')"></div>
            
            <div class="hotspot" id="brahmagiri" style="top: 350px; left: 172px;" onclick="checkSpot('brahmagiri')"></div>
        </div>

    </div>

    <div id="score-board">ಸ್ಕೋರ್: <span id="score">0</span> / 3</div>

    <div class="overlay" id="overlay"></div>
    <div class="popup" id="popup">
        <h2 id="popup-title">🎉 ಸರಿಯಾದ ಉತ್ತರ!</h2>
        <p id="popup-desc">ಸ್ಥಳದ ಮಾಹಿತಿ ಇಲ್ಲಿದೆ...</p>
        <button onclick="nextQuestion()">ಮುಂದಿನ ಪ್ರಶ್ನೆ</button>
    </div>

    <script>
        // ಪ್ರಶ್ನೆಗಳ ಡೇಟಾಬೇಸ್
        const questions = [
            {
                id: "hunasagi",
                text: "೧. ಕರ್ನಾಟಕದ ಯಾದಗಿರಿ ಜಿಲ್ಲೆಯಲ್ಲಿದ್ದು, ಹಳೆಯ ಶಿಲಾಯುಗದ 'ಬೂದಿಯ ಕುರುಹುಗಳು' ಮತ್ತು ಆಯುಧಗಳು ಸಿಕ್ಕ ಪ್ರಸಿದ್ಧ ನೆಲೆ 'ಹುಣಸಗಿ' ಎಲ್ಲಿದೆ?",
                title: "🏺 ಹುಣಸಗಿ (Hunasagi)",
                desc: "ಅದ್ಭುತ! ಇಲ್ಲಿ ಹಳೆಯ ಶಿಲಾಯುಗದ ಮಾನವರು ವಾಸಿಸುತ್ತಿದ್ದ ನೆಲೆ ಮತ್ತು ಅವರು ಸುಣ್ಣದ ಕಲ್ಲಿನಿಂದ ಮಾಡಿದ ಆಯುಧಗಳು ಹಾಗೂ ಬೆಂಕಿ ಬಳಸಿದ್ದಕ್ಕೆ ಸಾಕ್ಷಿಯಾಗಿ ಬೂದಿಯ ಕುರುಹುಗಳು ದೊರೆತಿವೆ."
            },
            {
                id: "bimbetka",
                text: "೨. ಮಧ್ಯಪ್ರದೇಶದಲ್ಲಿದ್ದು, ಶಿಲಾಯುಗದ ಮಾನವರು ವಾಸವಿದ್ದ ಮತ್ತು ಗೋಡೆಗಳ ಮೇಲೆ ಪ್ರಾಣಿಗಳ ಚಿತ್ರಗಳನ್ನು ಬಿಡಿಸಿರುವ 'ಬಿಂಬೆಟ್ಕಾ' ಗುಹೆಗಳು ಎಲ್ಲಿದೆ?",
                title: "🧗 ಬಿಂಬೆಟ್ಕಾ ಗುಹೆಗಳು (Bimbetka)",
                desc: "ಸರಿಯಾದ ಉತ್ತರ! ಬಿಂಬೆಟ್ಕಾದಲ್ಲಿ ನೂರಾರು ಸುಂದರವಾದ ಗುಹಾಂತರ ಚಿತ್ರಗಳು ಸಿಕ್ಕಿವೆ. ಇವುಗಳಲ್ಲಿ ಶಿಲಾಯುಗದ ಮಾನವರು ಹಂದಿ, ಜಿಂಕೆ ಮತ್ತು ಕಾಡುಕೋಣಗಳ ಚಿತ್ರಗಳನ್ನು ಬಿಡಿಸಿದ್ದಾರೆ."
            },
            {
                id: "brahmagiri",
                text: "೩. ಕರ್ನಾಟಕದ ಚಿತ್ರದುರ್ಗ ಜಿಲ್ಲೆಯಲ್ಲಿದ್ದು, ಇತಿಹಾಸದ ಆರಂಭಿಕ ಕಾಲದ ಹಾಗೂ ನವಶಿಲಾಯುಗದ ಪ್ರಮುಖ ನೆಲೆಯಾಗಿರುವ 'ಬ್ರಹ್ಮಗಿರಿ' ಎಲ್ಲಿದೆ?",
                title: "⛰️ ಬ್ರಹ್ಮಗಿರಿ (Brahmagiri)",
                desc: "ಅತ್ಯುತ್ತಮ! ಬ್ರಹ್ಮಗಿರಿಯು ನವಶಿಲಾಯುಗ ಮತ್ತು ಬೃಹತ್ ಶಿಲಾಯುಗದ ಸಂಸ್ಕೃತಿಗೆ ಹೆಸರುವಾಸಿಯಾಗಿದೆ. ಇಲ್ಲಿ ವಿಶಿಷ್ಟವಾದ ಸಮಾಧಿಗಳು ಮತ್ತು ಮಡಕೆಗಳು ಪತ್ತೆಯಾಗಿವೆ."
            }
        ];

        let currentQuestionIndex = 0;
        let score = 0;

        // ಮೊದಲ ಪ್ರಶ್ನೆಯನ್ನು ಲೋಡ್ ಮಾಡುವುದು
        function loadQuestion() {
            if (currentQuestionIndex < questions.length) {
                document.getElementById("question-text").innerText = questions[currentQuestionIndex].text;
            } else {
                document.getElementById("question-box").innerHTML = "<h3>🎉 ಅಭಿನಂದನೆಗಳು!</h3><p style='font-size:18px; color:#27ae60; font-weight:bold;'>ನೀವು ಎಲ್ಲಾ 3 ಶಿಲಾಯುಗದ ನೆಲೆಗಳನ್ನು ಯಶಸ್ವಿಯಾಗಿ ಗುರುತಿಸಿದ್ದೀರಿ!</p>";
            }
        }

        // ವಿದ್ಯಾರ್ಥಿ ಕ್ಲಿಕ್ ಮಾಡಿದಾಗ ಪರಿಶೀಲಿಸುವ ಫಂಕ್ಷನ್
        function checkSpot(spotId) {
            if (currentQuestionIndex >= questions.length) return;

            const currentQuestion = questions[currentQuestionIndex];

            if (spotId === currentQuestion.id) {
                // ಸರಿಯಾದ ಉತ್ತರವಾಗಿದ್ದರೆ
                score++;
                document.getElementById("score").innerText = score;
                
                // ಹಸಿರು ಲೈಟ್ ಆನ್ ಮಾಡುವುದು
                const activeSpot = document.getElementById(spotId);
                activeSpot.classList.add("correct");

                // ಆಡಿಯೋ ಎಫೆಕ್ಟ್ (Ting ಸೌಂಡ್ ತರಹದ ಬೀಪ್)
                playBeep(800, 0.2);

                // ಪಾಪ್-ಅಪ್ ಪ್ರದರ್ಶಿಸುವುದು
                setTimeout(() => {
                    document.getElementById("popup-title").innerText = "🎉 " + currentQuestion.title;
                    document.getElementById("popup-desc").innerText = currentQuestion.desc;
                    document.getElementById("overlay").style.display = "block";
                    document.getElementById("popup").style.display = "block";
                }, 400);

            } else {
                // ತಪ್ಪಾದ ಉತ್ತರವಾಗಿದ್ದರೆ (ಸಣ್ಣ ಲೋ-ಪಿಚ್ ಬೀಪ್)
                playBeep(250, 0.3);
                alert("🤔 ಇದು ತಪ್ಪಾದ ಸ್ಥಳ, ಮತ್ತೊಮ್ಮೆ ಯೋಚಿಸಿ ಕ್ಲಿಕ್ ಮಾಡಿ!");
            }
        }

        // ಮುಂದಿನ ಪ್ರಶ್ನೆಗೆ ಹೋಗುವುದು
        function nextQuestion() {
            document.getElementById("overlay").style.display = "none";
            document.getElementById("popup").style.display = "none";
            currentQuestionIndex++;
            loadQuestion();
        }

        // ಬ್ರೌಸರ್‌ನಲ್ಲೇ ಸೌಂಡ್ ಕ್ರಿಯೇಟ್ ಮಾಡುವ ಫಂಕ್ಷನ್ (ಯಾವುದೇ ಆಡಿಯೋ ಫೈಲ್ ಬೇಕಾಗಿಲ್ಲ)
        function playBeep(freq, duration) {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.frequency.value = freq;
            oscillator.start();
            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            oscillator.stop(audioCtx.currentTime + duration);
        }

        // ಆಟದ ಆರಂಭ
        loadQuestion();
    </script>
</body>
</html>
