<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>मजेदार लिंग बदलो गेम! | Interactive Hindi Gender Learning Game</title>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --masculine-color: #3498db;
            --feminine-color: #e74c3c;
            --bg-gradient: linear-gradient(135deg, #ffeaa7 0%, #ff7675 100%);
            --card-bg: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Baloo 2', cursive, sans-serif;
        }

        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            color: #2d3436;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        h1 {
            font-size: 3rem;
            color: #fff;
            text-shadow: 3px 3px 0px #2d3436;
            margin-bottom: 5px;
        }

        p.subtitle {
            font-size: 1.3rem;
            color: #2d3436;
            background: rgba(255, 255, 255, 0.85);
            padding: 6px 20px;
            border-radius: 30px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        /* Navigation Tabs */
        .nav-tabs {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }

        .tab-btn {
            padding: 12px 35px;
            font-size: 1.3rem;
            font-weight: 800;
            border: 3px solid #2d3436;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 6px 0px #2d3436;
            background-color: #fff;
        }

        .tab-btn.active {
            background-color: #fdcb6e;
            transform: translateY(3px);
            box-shadow: 0 3px 0px #2d3436;
        }

        .tab-btn:hover:not(.active) {
            transform: translateY(-2px);
            box-shadow: 0 8px 0px #2d3436;
        }

        /* Main Container */
        .container {
            width: 100%;
            max-width: 800px;
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 30px;
            border: 4px solid #2d3436;
            box-shadow: 0 12px 0px #2d3436;
            min-height: 450px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* LEARN MODE: Flashcards Grid */
        .grid-layout {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            width: 100%;
        }

        .gender-card {
            background: #fff;
            border: 3px solid #2d3436;
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 6px 0px #2d3436;
            transition: transform 0.2s;
        }

        .gender-card:hover {
            transform: scale(1.03);
        }

        .gender-pair {
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin-top: 10px;
        }

        .gender-box {
            padding: 5px 10px;
            border-radius: 10px;
            color: white;
            font-weight: bold;
            font-size: 1.1rem;
        }

        .box-m { background-color: var(--masculine-color); border: 2px solid #2d3436; }
        .box-f { background-color: var(--feminine-color); border: 2px solid #2d3436; }

        .card-emoji { font-size: 2.5rem; }
        .card-text { font-size: 1.6rem; font-weight: bold; margin-top: 5px;}
        .vs-arrow { font-size: 1.5rem; color: #7f8c8d; font-weight: bold; }

        /* GAME MODE: Sorting Game */
        .game-box {
            width: 100%;
            text-align: center;
        }

        .stats {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 400px;
            margin: 0 auto 20px auto;
            font-size: 1.3rem;
            font-weight: bold;
            background: #dfe6e9;
            padding: 10px 20px;
            border-radius: 15px;
            border: 2px solid #2d3436;
        }

        .word-to-sort {
            background: #fff;
            border: 4px dashed #6c5ce7;
            padding: 30px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 30px;
            animation: float 2s infinite ease-in-out;
        }

        .word-to-sort .current-emoji {
            font-size: 4rem;
            display: block;
            margin-bottom: 5px;
        }

        .word-to-sort .current-word {
            font-size: 3rem;
            font-weight: 800;
            color: #2d3436;
        }

        .bucket-container {
            display: flex;
            gap: 20px;
            width: 100%;
            justify-content: center;
        }

        .bucket-btn {
            flex: 1;
            max-width: 250px;
            padding: 20px;
            font-size: 1.8rem;
            font-weight: bold;
            color: white;
            border: 3px solid #2d3436;
            border-radius: 20px;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.1s;
        }

        .bucket-btn.m-btn {
            background-color: var(--masculine-color);
            box-shadow: 0 8px 0 #1b4f72;
        }
        .bucket-btn.f-btn {
            background-color: var(--feminine-color);
            box-shadow: 0 8px 0 #7b241c;
        }

        .bucket-btn:active {
            transform: translateY(4px);
            box-shadow: 0 4px 0 #2d3436;
        }

        .bucket-btn span {
            display: block;
            font-size: 1.1rem;
            opacity: 0.9;
        }

        /* Feedback Screen */
        .feedback {
            font-size: 1.5rem;
            font-weight: bold;
            margin-top: 15px;
            height: 30px;
        }
        .correct-anim { color: #2ecc71; animation: pop 0.3s ease; }
        .wrong-anim { color: #e74c3c; animation: shake 0.3s ease; }

        /* End Screen */
        .end-screen { text-align: center; }
        .end-title { font-size: 2.5rem; color: #6c5ce7; margin-bottom: 15px; }
        .restart-btn {
            background: #2ecc71;
            color: white;
            padding: 12px 40px;
            font-size: 1.4rem;
            border: 3px solid #2d3436;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 6px 0 #2d3436;
            font-weight: bold;
        }
        .restart-btn:active {
            transform: translateY(3px);
            box-shadow: 0 3px 0 #2d3436;
        }

        .hidden { display: none !important; }

        /* Animations */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        @media(max-width: 550px) {
            .bucket-container { flex-direction: column; align-items: center; }
            .bucket-btn { width: 100%; }
            h1 { font-size: 2.2rem; }
        }
    </style>
</head>
<body>

    <header>
        <h1>विलोम लिंग पाठशाला 👨‍🏫👩‍🏫</h1>
        <p class="subtitle">आओ खेल-खेल में पुल्लिंग और स्त्रीलिंग शब्द सीखें!</p>
    </header>

    <div class="nav-tabs">
        <button class="tab-btn active" id="learnTab" onclick="switchMode('learn')">📖 सीखें (Learn)</button>
        <button class="tab-btn" id="gameTab" onclick="switchMode('game')">🎮 खेलें (Play Game)</button>
    </div>

    <div class="container">
        <div id="learnMode" class="grid-layout">
            </div>

        <div id="gameMode" class="game-box hidden">
            <div class="stats">
                <div>स्कॉर (Score): <span id="score">0</span></div>
                <div>बचे शब्द: <span id="remaining">0</span></div>
            </div>
            
            <div class="word-to-sort">
                <span class="current-emoji" id="gameEmoji">👦</span>
                <span class="current-word" id="gameWord">लड़का</span>
            </div>

            <div class="bucket-container">
                <button class="bucket-btn m-btn" onclick="submitAnswer('पुल्लिंग')">
                    पुल्लिंग
                    <span>(Masculine 👦)</span>
                </button>
                <button class="bucket-btn f-btn" onclick="submitAnswer('स्त्रीलिंग')">
                    स्त्रीलिंग
                    <span>(Feminine 👧)</span>
                </button>
            </div>

            <div id="feedbackBox" class="feedback"></div>
        </div>

        <div id="endScreen" class="end-screen hidden">
            <div class="end-title">🎉 बधाई हो! आपने खेल पूरा किया!</div>
            <p style="font-size: 1.6rem;">आपका स्कोर: <strong id="finalScore" style="color:#6c5ce7">0/0</strong></p>
            <button class="restart-btn" onclick="startGame()">फिर से खेलें 🔄</button>
        </div>
    </div>

    <script>
        // Comprehensive dataset of Hindi genders
        const genderDataset = [
            { m: "लड़का", f: "लड़की", mEmoji: "👦", fEmoji: "👧" },
            { m: "राजा", f: "रानी", mEmoji: "👑", fEmoji: "👸" },
            { m: "शेर", f: "शेरनी", mEmoji: "🦁", fEmoji: "🐆" },
            { m: "मोर", f: "मोरनी", mEmoji: "🦚", fEmoji: "🦚" },
            { m: "चूहा", f: "चुहिया", mEmoji: "🐭", fEmoji: "🐭" },
            { m: "हाथी", f: "हथिनी", mEmoji: "🐘", fEmoji: "🐘" },
            { m: "बंदर", f: "बंदरिया", mEmoji: "🐒", fEmoji: "🐒" },
            { m: "शिक्षक", f: "शिक्षिका", mEmoji: "👨‍🏫", fEmoji: "👩‍🏫" },
            { m: "बकरा", f: "बकरी", mEmoji: "🐐", fEmoji: "🐐" },
            { m: "घोड़ा", f: "घोड़ी", mEmoji: "🐎", fEmoji: "🐎" }
        ];

        let gameQueue = [];
        let currentItem = null;
        let score = 0;
        let totalQuestions = 0;

        function init() {
            renderLearnMode();
        }

        // Render Learn Cards
        function renderLearnMode() {
            const container = document.getElementById('learnMode');
            container.innerHTML = '';
            genderDataset.forEach(item => {
                const card = document.createElement('div');
                card.className = 'gender-card';
                card.innerHTML = `
                    <div class="gender-pair">
                        <div>
                            <div class="card-emoji">${item.mEmoji}</div>
                            <div class="card-text">${item.m}</div>
                            <span class="gender-box box-m">पुल्लिंग</span>
                        </div>
                        <div class="vs-arrow">➡️</div>
                        <div>
                            <div class="card-emoji">${item.fEmoji}</div>
                            <div class="card-text">${item.f}</div>
                            <span class="gender-box box-f">स्त्रीलिंग</span>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // Mode Switching
        function switchMode(mode) {
            document.getElementById('learnTab').classList.toggle('active', mode === 'learn');
            document.getElementById('gameTab').classList.toggle('active', mode === 'game');

            if (mode === 'learn') {
                document.getElementById('learnMode').classList.remove('hidden');
                document.getElementById('gameMode').classList.add('hidden');
                document.getElementById('endScreen').classList.add('hidden');
            } else {
                document.getElementById('learnMode').classList.add('hidden');
                startGame();
            }
        }

        // Setup Sorting Game
        function startGame() {
            score = 0;
            gameQueue = [];
            
            // Break dataset into individual components for sorting challenge
            genderDataset.forEach(item => {
                gameQueue.push({ word: item.m, type: "पुल्लिंग", emoji: item.mEmoji });
                gameQueue.push({ word: item.f, type: "स्त्रीलिंग", emoji: item.fEmoji });
            });

            // Randomize the game items
            gameQueue.sort(() => Math.random() - 0.5);
            totalQuestions = gameQueue.length;

            document.getElementById('gameMode').classList.remove('hidden');
            document.getElementById('endScreen').classList.add('hidden');
            document.getElementById('score').innerText = score;

            nextWord();
        }

        function nextWord() {
            const feedbackBox = document.getElementById('feedbackBox');
            feedbackBox.className = "feedback";
            feedbackBox.innerText = "";

            if (gameQueue.length === 0) {
                endGame();
                return;
            }

            document.getElementById('remaining').innerText = gameQueue.length;
            currentItem = gameQueue.pop();

            document.getElementById('gameWord').innerText = currentItem.word;
            document.getElementById('gameEmoji').innerText = currentItem.emoji;
            
            // Re-enable clicks
            toggleButtons(true);
        }

        function submitAnswer(chosenType) {
            toggleButtons(false); // Stop spam clicks
            const feedbackBox = document.getElementById('feedbackBox');

            if (chosenType === currentItem.type) {
                score++;
                document.getElementById('score').innerText = score;
                feedbackBox.innerText = "🎯 सही उत्तर! बहुत बढ़िया!";
                feedbackBox.className = "feedback correct-anim";
            } else {
                feedbackBox.innerText = `❌ गलत! "${currentItem.word}" एक ${currentItem.type} शब्द है।`;
                feedbackBox.className = "feedback wrong-anim";
            }

            setTimeout(nextWord, 1800);
        }

        function toggleButtons(enable) {
            const buttons = document.querySelectorAll('.bucket-btn');
            buttons.forEach(btn => btn.style.pointerEvents = enable ? 'auto' : 'none');
        }

        function endGame() {
            document.getElementById('gameMode').classList.add('hidden');
            document.getElementById('endScreen').classList.remove('hidden');
            document.getElementById('finalScore').innerText = `${score} / ${totalQuestions}`;
        }

        // Start App
        init();
    </script>
</body>
</html>
