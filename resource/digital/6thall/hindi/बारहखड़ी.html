<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>जादुई बारहखड़ी मशीन (आवाज़ के साथ)</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #fce4ec, #e8eaf6);
            margin: 0;
            padding: 20px;
            text-align: center;
            user-select: none;
        }
        h1 {
            color: #6a1b9a;
            font-size: 38px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
            margin-bottom: 10px;
        }
        p {
            color: #555;
            font-size: 18px;
            margin-bottom: 30px;
        }
        .मशीन-कंटेनर {
            background: #ffffff;
            max-width: 800px;
            margin: 0 auto;
            border-radius: 30px;
            padding: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
            border: 5px solid #ab47bc;
        }
        /* व्यंजन चयन क्षेत्र */
        .चयन-शीर्षक {
            font-size: 22px;
            color: #ef6c00;
            font-weight: bold;
            margin-bottom: 15px;
            text-align: left;
            border-bottom: 2px dashed #ffcc80;
            padding-bottom: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .व्यंजन-ग्रिड {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-bottom: 30px;
            max-height: 150px;
            overflow-y: auto;
            padding: 10px;
            background: #fff3e0;
            border-radius: 15px;
            border: 2px solid #ffb74d;
        }
        .व्यंजन-बटन {
            font-size: 24px;
            padding: 10px 20px;
            background: white;
            border: 2px solid #ff9800;
            color: #e65100;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        .व्यंजन-बटन:hover, .व्यंजन-बटन.सक्रिय {
            background: #ff9800;
            color: white;
            transform: scale(1.1);
        }

        /* जादुई स्क्रीन */
        .स्क्रीन-कवर {
            position: relative;
            margin-bottom: 30px;
        }
        .जादुई-स्क्रीन {
            background: #263238;
            color: #00e676;
            padding: 30px;
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            box-shadow: inset 0 10px 20px rgba(0,0,0,0.5);
            border: 6px solid #b0bec5;
        }
        .स्क्रीन-बॉक्स {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px 30px;
            border-radius: 15px;
            font-size: 60px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            text-shadow: 0 0 15px currentColor;
        }
        .प्लस-बराबर {
            font-size: 50px;
            color: #eceff1;
            font-weight: bold;
        }
        .परिणाम-बॉक्स {
            color: #ffff00;
            transform: scale(1.2);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        /* आवाज़ सुनने का बटन */
        .ध्वनि-बटन {
            margin-top: 15px;
            background: #4caf50;
            color: white;
            border: none;
            padding: 10px 25px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 0 #2e7d32;
            transition: 0.1s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .ध्वनि-बटन:active {
            transform: translateY(5px);
            box-shadow: 0 0 0 #2e7d32;
        }

        /* स्वर/मात्रा चयन क्षेत्र */
        .स्वर-ग्रिड {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 15px;
        }
        .स्वर-बटन {
            font-size: 28px;
            padding: 15px;
            background: #29b6f6;
            border: none;
            color: white;
            border-radius: 15px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 6px 0 #0288d1;
            transition: 0.1s;
        }
        .स्वर-बटन:active, .स्वर-बटन.सक्रिय {
            transform: translateY(6px);
            box-shadow: 0 0 0 #0288d1;
            background: #0288d1;
        }

        @keyframes पॉप {
            0% { transform: scale(1); }
            50% { transform: scale(1.4); }
            100% { transform: scale(1.2); }
        }
        .पॉप-एनीमेशन {
            animation: पॉप 0.4s ease;
        }
    </style>
</head>
<body>

    <h1>✨ जादुई बारहखड़ी मशीन ✨</h1>
    <p>व्यंजन और स्वर चुनें, और सुनिए वे मिलकर क्या बनाते हैं!</p>

    <div class="मशीन-कंटेनर">
        
        <div class="चयन-शीर्षक">१. अपना व्यंजन चुनें:</div>
        <div class="व्यंजन-ग्रिड" id="व्यंजन-क्षेत्र">
            </div>

        <div class="स्क्रीन-कवर">
            <div class="जादुई-स्क्रीन">
                <div class="स्क्रीन-बॉक्स" id="आधा-व्यंजन" style="color: #ff4081;">क्</div>
                <div class="प्लस-बराबर">+</div>
                <div class="स्क्रीन-बॉक्स" id="स्वर-अक्षर" style="color: #40c4ff;">अ</div>
                <div class="प्लस-बराबर">=</div>
                <div class="स्क्रीन-बॉक्स परिणाम-बॉक्स" id="परिणाम">क</div>
            </div>
            <button class="ध्वनि-बटन" onclick="अक्षर_सुनाएँ()">🔊 सुनें</button>
        </div>

        <div class="चयन-शीर्षक">२. स्वर (मात्रा) चुनें:</div>
        <div class="स्वर-ग्रिड" id="स्वर-क्षेत्र">
            </div>

    </div>

    <script>
        const सभी_व्यंजन = ['क', 'ख', 'ग', 'घ', 'च', 'छ', 'ज', 'झ', 'ट', 'ठ', 'ड', 'ढ', 'ण', 'त', 'थ', 'द', 'ध', 'न', 'प', 'फ', 'ब', 'भ', 'म', 'य', 'र', 'ल', 'व', 'श', 'ष', 'स', 'ह', 'क्ष', 'त्र', 'ज्ञ'];

        const सभी_स्वर = [
            { स्वर: 'अ', मात्रा: '' },   { स्वर: 'आ', मात्रा: 'ा' },
            { स्वर: 'इ', मात्रा: 'ि' },   { स्वर: 'ई', मात्रा: 'ी' },
            { स्वर: 'उ', मात्रा: 'ु' },   { स्वर: 'ऊ', मात्रा: 'ू' },
            { स्वर: 'ए', मात्रा: 'े' },   { स्वर: 'ऐ', मात्रा: 'ै' },
            { स्वर: 'ओ', मात्रा: 'ो' },   { स्वर: 'औ', मात्रा: 'ौ' },
            { स्वर: 'अं', मात्रा: 'ं' },  { स्वर: 'अः', मात्रा: 'ः' }
        ];

        let वर्तमान_व्यंजन = 'क';
        let वर्तमान_स्वर = सभी_स्वर[0];
        let अंतिम_अक्षर = 'क'; // आवाज़ के लिए इस चर (variable) का उपयोग करेंगे

        // आवाज़ देने का फंक्शन
        function आवाज़_दें(पाठ) {
            if ('speechSynthesis' in window) {
                // पहले से चल रही कोई भी आवाज़ बंद करें
                window.speechSynthesis.cancel();
                
                const बोलना = new SpeechSynthesisUtterance(पाठ);
                बोलना.lang = 'hi-IN'; // हिंदी भाषा
                बोलना.rate = 0.85;    // बच्चों के समझने के लिए गति थोड़ी धीमी की गई है
                बोलना.pitch = 1.1;    // आवाज़ को थोड़ा सा मीठा/तीखा करने के लिए
                window.speechSynthesis.speak(बोलना);
            }
        }

        // बटन से मैन्युअल रूप से सुनने के लिए
        function अक्षर_सुनाएँ() {
            आवाज़_दें(अंतिम_अक्षर);
        }

        function मशीन_शुरू_करें() {
            व्यंजन_बटन_बनाएँ();
            स्वर_बटन_बनाएँ();
            स्क्रीन_अपडेट_करें(false); // शुरुआत में अपने आप आवाज़ न आए
        }

        function व्यंजन_बटन_बनाएँ() {
            const कंटेनर = document.getElementById('व्यंजन-क्षेत्र');
            सभी_व्यंजन.forEach(व्यंजन => {
                const बटन = document.createElement('button');
                बटन.className = 'व्यंजन-बटन';
                if (व्यंजन === वर्तमान_व्यंजन) बटन.classList.add('सक्रिय');
                बटन.innerText = व्यंजन;
                
                बटन.onclick = () => {
                    document.querySelectorAll('.व्यंजन-बटन').forEach(b => b.classList.remove('सक्रिय'));
                    बटन.classList.add('सक्रिय');
                    वर्तमान_व्यंजन = व्यंजन;
                    स्क्रीन_अपडेट_करें(true); // क्लिक करने पर आवाज़ आए
                };
                कंटेनर.appendChild(बटन);
            });
        }

        function स्वर_बटन_बनाएँ() {
            const कंटेनर = document.getElementById('स्वर-क्षेत्र');
            सभी_स्वर.forEach(स्वर_डेटा => {
                const बटन = document.createElement('button');
                बटन.className = 'स्वर-बटन';
                if (स्वर_डेटा.स्वर === वर्तमान_स्वर.स्वर) बटन.classList.add('सक्रिय');
                बटन.innerText = स्वर_डेटा.मात्रा === '' ? स्वर_डेटा.स्वर : `${स्वर_डेटा.स्वर} (${स्वर_डेटा.मात्रा})`;
                
                const रंग = ['#e91e63', '#9c27b0', '#3f51b5', '#009688', '#ff9800', '#f44336'];
                const चुना_रंग = रंग[सभी_स्वर.indexOf(स्वर_डेटा) % रंग.length];
                बटन.style.backgroundColor = चुना_रंग;
                बटन.style.boxShadow = `0 6px 0 ${गहरा_रंग(चुना_रंग)}`;

                बटन.onclick = () => {
                    document.querySelectorAll('.स्वर-बटन').forEach(b => {
                        b.classList.remove('सक्रिय');
                        b.style.transform = 'translateY(0)';
                        b.style.boxShadow = `0 6px 0 ${गहरा_रंग(b.style.backgroundColor)}`;
                    });
                    बटन.classList.add('सक्रिय');
                    बटन.style.transform = 'translateY(6px)';
                    बटन.style.boxShadow = '0 0 0 transparent';
                    
                    वर्तमान_स्वर = स्वर_डेटा;
                    स्क्रीन_अपडेट_करें(true); // क्लिक करने पर आवाज़ आए
                };
                कंटेनर.appendChild(बटन);
            });
        }

        function गहरा_रंग(रंग) {
            const रंग_मैप = {
                'rgb(233, 30, 99)': '#c2185b', 
                'rgb(156, 39, 176)': '#7b1fa2', 
                'rgb(63, 81, 181)': '#303f9f', 
                'rgb(0, 150, 136)': '#00796b', 
                'rgb(255, 152, 0)': '#f57c00', 
                'rgb(244, 67, 54)': '#d32f2f'  
            };
            return रंग_मैप[रंग] || '#333';
        }

        function स्क्रीन_अपडेट_करें(आवाज़_चलाएं) {
            document.getElementById('आधा-व्यंजन').innerText = वर्तमान_व्यंजन + '्';
            document.getElementById('स्वर-अक्षर').innerText = वर्तमान_स्वर.स्वर;
            
            अंतिम_अक्षर = वर्तमान_व्यंजन + वर्तमान_स्वर.मात्रा;
            const परिणाम_बॉक्स = document.getElementById('परिणाम');
            परिणाम_बॉक्स.innerText = अंतिम_अक्षर;

            परिणाम_बॉक्स.classList.remove('पॉप-एनीमेशन');
            void परिणाम_बॉक्स.offsetWidth; 
            परिणाम_बॉक्स.classList.add('पॉप-एनीमेशन');

            // यदि उपयोगकर्ता ने क्लिक किया है, तो नया अक्षर बोलकर सुनाएं
            if (आवाज़_चलाएं) {
                अक्षर_सुनाएँ();
            }
        }

        window.onload = मशीन_शुरू_करें;
    </script>
</body>
</html>
