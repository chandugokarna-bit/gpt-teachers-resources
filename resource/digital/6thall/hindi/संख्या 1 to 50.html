<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>जादुई २ एक्सप्रेस (ऑडियो के साथ) | Hindi Numbers 1 to 50 with Audio</title>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f0faf7;
            --primary-pop: #ff4757;
            --sunny-yellow: #ffa502;
            --magic-blue: #1e90ff;
            --grass-green: #2ed573;
            --dark-text: #2f3542;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Baloo 2', cursive, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #e0f7fa 0%, #fff9c4 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            color: var(--dark-text);
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 3rem;
            color: #2c3e50;
            text-shadow: 3px 3px 0px var(--sunny-yellow);
        }

        .subtitle {
            font-size: 1.3rem;
            background: white;
            padding: 5px 20px;
            border-radius: 50px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            display: inline-block;
            margin-top: 5px;
            border: 2px dashed var(--primary-pop);
        }

        /* Nav Tabs */
        .tabs {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }

        .tab-btn {
            padding: 10px 25px;
            font-size: 1.2rem;
            font-weight: 800;
            border: 3px solid var(--dark-text);
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 5px 0px var(--dark-text);
            background: white;
            transition: all 0.1s;
        }

        .tab-btn.active {
            background: var(--magic-blue);
            color: white;
            transform: translateY(3px);
            box-shadow: 0 2px 0px var(--dark-text);
        }

        /* Main Container */
        .main-card {
            width: 100%;
            max-width: 900px;
            background: white;
            border: 4px solid var(--dark-text);
            border-radius: 32px;
            box-shadow: 0 12px 0px var(--dark-text);
            padding: 25px;
            min-height: 450px;
        }

        /* EXPLORE MODE: 1-50 Grid */
        .number-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(75px, 1fr));
            gap: 12px;
            width: 100%;
        }

        .num-block {
            background: white;
            border: 3px solid var(--dark-text);
            border-radius: 16px;
            height: 85px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 0px var(--dark-text);
            transition: all 0.1s ease;
        }

        .num-block:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0px var(--dark-text);
        }

        .num-block .eng-digit { font-size: 1.4rem; font-weight: 800; color: #57606f; }
        .num-block .hin-digit { font-size: 1.2rem; font-weight: bold; color: var(--magic-blue); }

        /* Preview Display Modal Style inside Explore */
        .preview-box {
            background: #f1f2f6;
            border: 3px solid var(--dark-text);
            border-radius: 20px;
            padding: 15px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-around;
            text-align: center;
            position: relative;
        }

        .audio-indicator {
            position: absolute;
            top: 10px;
            right: 15px;
            background: var(--purple-magic);
            font-size: 0.9rem;
            color: #747d8c;
            font-weight: bold;
        }

        .preview-large { font-size: 3.5rem; font-weight: 800; color: var(--primary-pop); }
        .preview-details { font-size: 1.8rem; font-weight: 800; }

        /* GAME MODE: Train Challenge */
        .game-area { text-align: center; width: 100%; }
        
        .train-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            background: #dfe4ea;
            padding: 20px;
            border-radius: 20px;
            border: 3px dashed var(--dark-text);
            margin-bottom: 30px;
            overflow-x: auto;
        }

        .train-car {
            background: var(--sunny-yellow);
            border: 3px solid var(--dark-text);
            border-radius: 12px;
            width: 90px;
            height: 90px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            font-weight: 800;
            box-shadow: 0 4px 0 var(--dark-text);
            position: relative;
        }

        .train-car.engine { background: var(--primary-pop); color: white; width: 100px;}
        .train-car.missing { background: #ced6e0; border-style: dashed; color: #747d8c; }

        .options-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            max-width: 500px;
            margin: 0 auto;
        }

        .option-btn {
            background: white;
            border: 3px solid var(--dark-text);
            border-radius: 15px;
            padding: 12px;
            font-size: 1.4rem;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 5px 0 var(--dark-text);
            transition: all 0.1s;
        }

        .option-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--dark-text); }
        .option-btn.correct { background: var(--grass-green) !important; color: white; }
        .option-btn.wrong { background: var(--primary-pop) !important; color: white; }

        .score-badge {
            font-size: 1.3rem;
            background: var(--sunny-yellow);
            padding: 5px 15px;
            border-radius: 10px;
            border: 2px solid var(--dark-text);
            display: inline-block;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .hidden { display: none !important; }

        /* Dynamic colors for Grid Items */
        .c1 { background-color: #ffca28; }
        .c2 { background-color: #9ccc65; }
        .c3 { background-color: #29b6f6; }
        .c4 { background-color: #ff7043; }
        .c5 { background-color: #ba68c8; }

        @media (max-width: 600px) {
            .options-container { grid-template-columns: 1fr; }
            h1 { font-size: 2rem; }
        }
    </style>
</head>
<body>

    <header>
        <h1>जादुई संख्या एक्सप्रेस 🚂</h1>
        <div class="subtitle">सुनो और सीखो हिंदी गिनती १ से ५० तक! 🔊</div>
    </header>

    <div class="tabs">
        <button class="tab-btn active" id="exploreTab" onclick="switchView('explore')">🔍 खोजें और सीखें</button>
        <button class="tab-btn" id="gameTab" onclick="switchView('game')">🎮 ट्रेन पटरी गेम</button>
    </div>

    <div class="main-card">
        
        <div id="exploreMode">
            <div class="preview-box" onclick="repeatAudio()" style="cursor: pointer;" title="फिर से सुनने के लिए क्लिक करें">
                <div class="audio-indicator">🔊 क्लिक करें</div>
                <div class="preview-large" id="pEng">१</div>
                <div>
                    <div class="preview-details" id="pHinDigit">देवनागरी अंक: १</div>
                    <div class="preview-details" id="pHinWord" style="color:var(--magic-blue)">हिंदी शब्द: एक</div>
                    <div style="font-size: 1.1rem; color:#747d8c;" id="pPronounce">उच्चारण: Ek</div>
                </div>
                <div style="font-size: 3rem;" id="pStars">⭐</div>
            </div>

            <div class="number-grid" id="gridBox">
                </div>
        </div>

        <div id="gameMode" class="game-area hidden">
            <div class="score-badge">स्टार स्कोर: <span id="scoreVal">0</span> ⭐</div>
            
            <h3 style="font-size: 1.5rem; margin-bottom: 15px;">खाली डिब्बे ❓ में कौन सा नंबर आएगा?</h3>
            
            <div class="train-container">
                <div class="train-car engine">🚂<br><span style="font-size:1rem">एक्सप्रेस</span></div>
                <div class="train-car" id="tc1">1</div>
                <div class="train-car" id="tc2">2</div>
                <div class="train-car missing" id="tc3">?</div>
                <div class="train-car" id="tc4">4</div>
            </div>

            <div class="options-container" id="optionsBox">
                </div>
        </div>

    </div>

    <script>
        const numbersData = [
            { n: 1, hd: "१", hw: "एक", pr: "Ek" }, { n: 2, hd: "२", hw: "दो", pr: "Do" },
            { n: 3, hd: "३", hw: "तीन", pr: "Teen" }, { n: 4, hd: "४", hw: "चार", pr: "Chaar" },
            { n: 5, hd: "५", hw: "पाँच", pr: "Paanch" }, { n: 6, hd: "६", hw: "छह", pr: "Chhah" },
            { n: 7, hd: "७", hw: "सात", pr: "Saat" }, { n: 8, hd: "८", hw: "आठ", pr: "Aath" },
            { n: 9, hd: "९", hw: "नौ", pr: "Nau" }, { n: 10, hd: "१०", hw: "दस", pr: "Das" },
            { n: 11, hd: "११", hw: "ग्यारह", pr: "Gyaarah" }, { n: 12, hd: "१२", hw: "बारह", pr: "Baarah" },
            { n: 13, hd: "१३", hw: "तेरह", pr: "Teerah" }, { n: 14, hd: "१४", hw: "चौदह", pr: "Chaudah" },
            { n: 15, hd: "१५", hw: "पंद्रह", pr: "Pandrah" }, { n: 16, hd: "१६", hw: "सोलह", pr: "Solah" },
            { n: 17, hd: "१७", hw: "सत्रह", pr: "Satrah" }, { n: 18, hd: "१८", hw: "अठारह", pr: "Athaarah" },
            { n: 19, hd: "१९", hw: "उन्नीस", pr: "Unnees" }, { n: 20, hd: "२०", hw: "बीस", pr: "Bees" },
            { n: 21, hd: "२१", hw: "इक्कीस", pr: "Ikkees" }, { n: 22, hd: "२२", hw: "बाईस", pr: "Baees" },
            { n: 23, hd: "२३", hw: "तेईस", pr: "Teees" }, { n: 24, hd: "२४", hw: "चौबीस", pr: "Chaubees" },
            { n: 25, hd: "२५", hw: "पच्चीस", pr: "Pachchees" }, { n: 26, hd: "२६", hw: "छब्बीस", pr: "Chhabbees" },
            { n: 27, hd: "२७", hw: "सत्ताईस", pr: "Sattaees" }, { n: 28, hd: "२८", hw: "अट्ठाईस", pr: "Atthaees" },
            { n: 29, hd: "२९", hw: "उनतीस", pr: "Untees" }, { n: 30, hd: "३०", hw: "तीस", pr: "Tees" },
            { n: 31, hd: "३१", hw: "इकतीस", pr: "Iktees" }, { n: 32, hd: "३२", hw: "बत्तीस", pr: "Battees" },
            { n: 33, hd: "३३", hw: "तैंतीस", pr: "Taintees" }, { n: 34, hd: "३४", hw: "चौंतीस", pr: "Chauntees" },
            { n: 35, hd: "३५", hw: "पैंतीस", pr: "Paintees" }, { n: 36, hd: "३६", hw: "छत्तीस", pr: "Chhattees" },
            { n: 37, hd: "३७", hw: "सैंतीस", pr: "Sainteees" }, { n: 38, hd: "३८", hw: "अड़तीस", pr: "Adtees" },
            { n: 39, hd: "३९", hw: "उनतालीस", pr: "Untalees" }, { n: 40, hd: "४०", hw: "चालीस", pr: "Chaalees" },
            { n: 41, hd: "४१", hw: "इकतालीस", pr: "Iktalees" }, { n: 42, hd: "४२", hw: "बयालीस", pr: "Bayaalees" },
            { n: 43, hd: "४३", hw: "तैंतालीस", pr: "Taintalees" }, { n: 44, hd: "४४", hw: "चवालीस", pr: "Chawalees" },
            { n: 45, hd: "४५", hw: "पैंतालीस", pr: "Paintalees" }, { n: 46, hd: "४६", hw: "छियालीस", pr: "Chhiyalees" },
            { n: 47, hd: "४७", hw: "सैंतालीस", pr: "Saintalees" }, { n: 48, hd: "४८", hw: "अड़तालीस", pr: "Adtalees" },
            { n: 49, hd: "४९", hw: "उनचास", pr: "Unchaas" }, { n: 50, hd: "५०", hw: "पचास", pr: "Pachaas" }
        ];

        let score = 0;
        let correctGameTarget = null;
        let lastSelectedWord = "एक"; // Default word for repeat audio

        function init() {
            renderGrid();
            updatePreview(numbersData[0], false); // Load first number without auto-speaking immediately
        }

        // --- NEW AUDIO FEATURE FUNCTION ---
        function speakHindi(text) {
            // Check if Web Speech API is supported
            if ('speechSynthesis' in window) {
                // Cancel any ongoing speech first
                window.speechSynthesis.cancel();

                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'hi-IN'; // Set language to Hindi (India)
                utterance.rate = 0.85;    // Keep the speed slightly slow and clear for kids
                utterance.pitch = 1.1;    // Cheerful high tone

                window.speechSynthesis.speak(utterance);
            }
        }

        function repeatAudio() {
            speakHindi(lastSelectedWord);
        }

        function renderGrid() {
            const gridBox = document.getElementById('gridBox');
            gridBox.innerHTML = '';
            
            numbersData.forEach((item, index) => {
                const block = document.createElement('div');
                const colorIndex = (index % 5) + 1;
                block.className = `num-block c${colorIndex}`;
                
                block.innerHTML = `
                    <span class="eng-digit">${item.n}</span>
                    <span class="hin-digit">${item.hd}</span>
                `;
                block.onclick = () => updatePreview(item, true); // Speak when clicked
                gridBox.appendChild(block);
            });
        }

        function updatePreview(item, shouldSpeak) {
            document.getElementById('pEng').innerText = item.n;
            document.getElementById('pHinDigit').innerText = `देवनागरी अंक: ${item.hd}`;
            document.getElementById('pHinWord').innerText = `हिंदी शब्द: ${item.hw}`;
            document.getElementById('pPronounce').innerText = `उच्चारण: ${item.pr}`;
            
            const count = item.n > 10 ? (item.n % 10 === 0 ? 10 : item.n % 10) : item.n;
            document.getElementById('pStars').innerText = "🎈".repeat(count);

            lastSelectedWord = item.hw;
            
            if(shouldSpeak) {
                speakHindi(item.hw);
            }
        }

        function switchView(mode) {
            document.getElementById('exploreTab').classList.toggle('active', mode === 'explore');
            document.getElementById('gameTab').classList.toggle('active', mode === 'game');

            if(mode === 'explore') {
                document.getElementById('exploreMode').classList.remove('hidden');
                document.getElementById('gameMode').classList.add('hidden');
            } else {
                document.getElementById('exploreMode').classList.add('hidden');
                document.getElementById('gameMode').classList.remove('hidden');
                setupTrainQuestion();
            }
        }

        function setupTrainQuestion() {
            const startNum = Math.floor(Math.random() * 47) + 1; 
            
            const n1 = numbersData[startNum - 1];
            const n2 = numbersData[startNum];
            correctGameTarget = numbersData[startNum + 1]; 
            const n4 = numbersData[startNum + 2];

            document.getElementById('tc1').innerHTML = `${n1.n}<br><span style="font-size:1rem">${n1.hd}</span>`;
            document.getElementById('tc2').innerHTML = `${n2.n}<br><span style="font-size:1rem">${n2.hd}</span>`;
            document.getElementById('tc3').innerText = `?`;
            document.getElementById('tc4').innerHTML = `${n4.n}<br><span style="font-size:1rem">${n4.hd}</span>`;

            let options = [correctGameTarget.hw];
            let wrongPool = numbersData.filter(item => item.n !== correctGameTarget.n);
            wrongPool.sort(() => Math.random() - 0.5);
            
            for(let i=0; i<3; i++) {
                options.push(wrongPool[i].hw);
            }
            options.sort(() => Math.random() - 0.5);

            const optionsBox = document.getElementById('optionsBox');
            optionsBox.innerHTML = '';

            options.forEach(choice => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = choice;
                btn.onclick = () => checkAnswer(btn, choice);
                optionsBox.appendChild(btn);
            });
        }

        function checkAnswer(clickedBtn, selectedAnswer) {
            const allBtns = document.querySelectorAll('.option-btn');
            allBtns.forEach(btn => btn.style.pointerEvents = 'none'); 

            if (selectedAnswer === correctGameTarget.hw) {
                clickedBtn.classList.add('correct');
                score += 10;
                document.getElementById('scoreVal').innerText = score;
                document.getElementById('tc3').innerHTML = `${correctGameTarget.n}<br><span style="font-size:1rem">${correctGameTarget.hd}</span>`;
                document.getElementById('tc3').style.backgroundColor = "var(--grass-green)";
                
                // Audio Feedback for Correct answer
                speakHindi(`सही उत्तर! यह है ${correctGameTarget.hw}`);
            } else {
                clickedBtn.classList.add('wrong');
                allBtns.forEach(btn => {
                    if(btn.innerText === correctGameTarget.hw) btn.classList.add('correct');
                });

                // Audio Feedback for Wrong answer
                speakHindi(`ओहो! सही उत्तर है ${correctGameTarget.hw}`);
            }

            setTimeout(() => {
                document.getElementById('tc3').style.backgroundColor = "#ced6e0"; 
                setupTrainQuestion();
            }, 2500);
        }

        init();
    </script>
</body>
</html>
