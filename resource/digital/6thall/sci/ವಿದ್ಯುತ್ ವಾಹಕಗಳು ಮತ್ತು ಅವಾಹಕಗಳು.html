<!DOCTYPE html>
<html lang="kn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ವಿದ್ಯುತ್ ವಾಹಕಗಳು ಮತ್ತು ಅವಾಹಕಗಳು</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Anek+Kannada:wght@400;600;800&display=swap');

  body {
    font-family: 'Anek Kannada', sans-serif;
    background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
    margin: 0;
    padding: 20px;
    display: flex;
    justify-content: center;
    color: #333;
  }
  .container {
    background-color: rgba(255, 255, 255, 0.95);
    border-radius: 20px;
    padding: 30px;
    max-width: 800px;
    width: 100%;
    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    text-align: center;
  }
  h1 {
    color: #2c3e50;
    margin-bottom: 5px;
    font-size: 2.2em;
  }
  .school-name {
    color: #e67e22;
    font-weight: 600;
    font-size: 1.2em;
    margin-bottom: 20px;
  }
  .instructions {
    font-size: 1.1em;
    color: #555;
    margin-bottom: 30px;
  }
  
  /* Circuit Area */
  .circuit-board {
    background-color: #2c3e50;
    border-radius: 15px;
    padding: 40px 20px;
    position: relative;
    margin-bottom: 30px;
    border: 4px solid #34495e;
  }
  .wire {
    height: 6px;
    background-color: #e74c3c;
    width: 60%;
    margin: 0 auto;
    position: relative;
    top: 40px;
    z-index: 1;
    box-shadow: 0 0 5px rgba(231, 76, 60, 0.5);
  }
  
  /* The Gap - Now dynamic! */
  .gap {
    width: 100px;
    height: 6px;
    background-color: transparent;
    border-bottom: 3px dashed #95a5a6;
    margin: 0 auto;
    position: relative;
    z-index: 2;
    transition: all 0.3s ease;
  }
  
  .components {
    display: flex;
    justify-content: space-around;
    align-items: center;
    position: relative;
    z-index: 3;
    margin-top: -25px;
  }
  .battery {
    font-size: 4em;
  }
  .bulb {
    font-size: 4em;
    transition: all 0.3s ease;
    filter: grayscale(100%);
  }
  .bulb.glow {
    filter: grayscale(0%);
    text-shadow: 0 0 20px #f1c40f, 0 0 40px #f1c40f;
    transform: scale(1.1);
  }
  .test-area {
    margin-top: 30px;
    height: 80px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 1.5em;
    color: #fff;
    font-weight: bold;
    transition: color 0.3s;
  }

  /* Items List */
  .items {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 15px;
    margin-bottom: 30px;
  }
  .item-btn {
    background-color: #fff;
    border: 2px solid #3498db;
    padding: 10px 20px;
    border-radius: 50px;
    font-size: 1.1em;
    font-family: inherit;
    cursor: pointer;
    transition: transform 0.2s, background-color 0.2s, color 0.2s;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .item-btn:hover {
    transform: scale(1.05);
    background-color: #3498db;
    color: white;
  }

  /* Result Table */
  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 20px;
    font-size: 1.1em;
  }
  th, td {
    padding: 12px;
    border: 1px solid #ddd;
  }
  th {
    background-color: #34495e;
    color: white;
  }
  tr:nth-child(even) {
    background-color: #f2f2f2;
  }
  .conductor { color: #27ae60; font-weight: bold; }
  .insulator { color: #c0392b; font-weight: bold; }
</style>
</head>
<body>

<div class="container">
  <h1>ವಾಹಕಗಳು ಮತ್ತು ಅವಾಹಕಗಳು</h1>
  <div class="school-name"></div>
  <p class="instructions">ಕೆಳಗಿನ ವಸ್ತುಗಳನ್ನು ಆಯ್ಕೆ ಮಾಡಿ ಮಂಡಲವನ್ನು (Circuit) ಪೂರ್ಣಗೊಳಿಸಿ. ಯಾವ ವಸ್ತುಗಳು ಬಲ್ಬ್ ಬೆಳಗುವಂತೆ ಮಾಡುತ್ತವೆ ಎಂಬುದನ್ನು ವೀಕ್ಷಿಸಿ!</p>

  <div class="circuit-board">
    <div class="wire"></div>
    <div class="gap" id="circuit-gap"></div>
    <div class="components">
      <div class="battery">🔋</div>
      <div class="bulb" id="lightbulb">💡</div>
    </div>
    <div class="test-area" id="active-item">
      [ವಸ್ತುವನ್ನು ಇಲ್ಲಿ ಇರಿಸಿ]
    </div>
  </div>

  <div class="items">
    <button class="item-btn" onclick="testItem('ಅಲ್ಯೂಮಿನಿಯಂ ಹಾಳೆ', true)">🪙 ಅಲ್ಯೂಮಿನಿಯಂ ಹಾಳೆ</button>
    <button class="item-btn" onclick="testItem('ರಬ್ಬರ್ (Eraser)', false)">🧽 ರಬ್ಬರ್</button>
    <button class="item-btn" onclick="testItem('ಮರದ ಪೆನ್ಸಿಲ್', false)">✏️ ಮರದ ಪೆನ್ಸಿಲ್</button>
    <button class="item-btn" onclick="testItem('ಲೋಹದ ಕೀಲಿ ಕೈ', true)">🔑 ಲೋಹದ ಕೀಲಿ ಕೈ</button>
    <button class="item-btn" onclick="testItem('ಕಬ್ಬಿಣದ ಮೊಳೆ', true)">📌 ಕಬ್ಬಿಣದ ಮೊಳೆ</button>
    <button class="item-btn" onclick="testItem('ಪ್ಲಾಸ್ಟಿಕ್ ಸ್ಕೇಲ್', false)">📏 ಪ್ಲಾಸ್ಟಿಕ್ ಸ್ಕೇಲ್</button>
  </div>

  <h3>ವೀಕ್ಷಣಾ ಪಟ್ಟಿ (Observation Log)</h3>
  <table>
    <thead>
      <tr>
        <th>ವಸ್ತು (Object)</th>
        <th>ಫಲಿತಾಂಶ (Result)</th>
        <th>ಗುಣ (Nature)</th>
      </tr>
    </thead>
    <tbody id="log-body">
      </tbody>
  </table>
</div>

<script>
  const testedItems = new Set(); // To prevent duplicate logs

  function testItem(name, isConductor) {
    const bulb = document.getElementById('lightbulb');
    const activeItem = document.getElementById('active-item');
    const gap = document.getElementById('circuit-gap');
    const logBody = document.getElementById('log-body');

    // Reset visually while "testing"
    activeItem.innerText = `ಪರೀಕ್ಷಿಸಲಾಗುತ್ತಿದೆ: ${name}...`;
    activeItem.style.color = "#f1c40f";
    gap.style.backgroundColor = "transparent";
    gap.style.borderBottom = "3px dashed #95a5a6";
    gap.style.boxShadow = "none";
    bulb.classList.remove('glow');

    // Simulate connection delay for suspense
    setTimeout(() => {
      activeItem.innerText = name;
      
      if (isConductor) {
        // Complete the circuit visually
        bulb.classList.add('glow');
        activeItem.style.color = "#2ecc71";
        gap.style.backgroundColor = "#e74c3c"; // Red wire color
        gap.style.borderBottom = "none";
        gap.style.boxShadow = "0 0 10px rgba(231, 76, 60, 0.8)"; // Glowing effect
      } else {
        // Block the circuit visually
        bulb.classList.remove('glow');
        activeItem.style.color = "#e74c3c";
        gap.style.backgroundColor = "#7f8c8d"; // Dull, blocked color
        gap.style.borderBottom = "none";
        gap.style.boxShadow = "none";
      }

      // Log the result if it hasn't been tested yet
      if (!testedItems.has(name)) {
        testedItems.add(name);
        const row = document.createElement('tr');
        
        const resultText = isConductor ? "ಬಲ್ಬ್ ಬೆಳಗುತ್ತದೆ 💡" : "ಬಲ್ಬ್ ಬೆಳಗುವುದಿಲ್ಲ ❌";
        const natureHtml = isConductor 
          ? "<span class='conductor'>ವಾಹಕ (Conductor)</span>" 
          : "<span class='insulator'>ಅವಾಹಕ (Insulator)</span>";

        row.innerHTML = `
          <td>${name}</td>
          <td>${resultText}</td>
          <td>${natureHtml}</td>
        `;
        logBody.insertBefore(row, logBody.firstChild); // Add to top
      }
    }, 500); // 500ms suspense delay
  }
</script>

</body>
</html>
