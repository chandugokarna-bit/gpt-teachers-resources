<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <title>ಭ್ರಮಣೆ ಮತ್ತು ಪರಿಭ್ರಮಣೆ</title>
    <style>
        body { margin: 0; background: #000; color: white; font-family: sans-serif; text-align: center; overflow: hidden; }
        .controls { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(255,255,255,0.1); padding: 20px; border-radius: 15px; width: 80%; backdrop-filter: blur(5px); }
        .sun { width: 80px; height: 80px; background: radial-gradient(circle, #ffeb3b, #f39c12); border-radius: 50%; position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); box-shadow: 0 0 50px #f39c12; }
        .orbit { width: 400px; height: 400px; border: 1px dashed rgba(255,255,255,0.3); border-radius: 50%; position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); }
        .earth-container { position: absolute; top: 40%; left: 50%; width: 400px; height: 400px; margin-left: -200px; margin-top: -200px; }
        .earth { width: 40px; height: 40px; background: url('https://upload.wikimedia.org/wikipedia/commons/2/22/Earth_Western_Hemisphere_transparent_background.png') center/cover; border-radius: 50%; position: absolute; top: -20px; left: 180px; }
        input[type=range] { width: 200px; }
        label { display: inline-block; width: 250px; text-align: right; margin-right: 10px; font-weight: bold; }
    </style>
</head>
<body>
    <h2 style="margin-top:20px;">🌍 ಭ್ರಮಣೆ (Rotation) vs ಪರಿಭ್ರಮಣೆ (Revolution)</h2>
    
    <div class="orbit"></div>
    <div class="sun"></div>
    <div class="earth-container" id="revolutionBox">
        <div class="earth" id="earthObj"></div>
    </div>

    <div class="controls">
        <div style="margin-bottom: 15px;">
            <label>ಭ್ರಮಣೆ ವೇಗ (Rotation Speed - 1 Day):</label>
            <input type="range" id="rotSpeed" min="0" max="10" value="5" step="0.1">
        </div>
        <div>
            <label>ಪರಿಭ್ರಮಣೆ ವೇಗ (Revolution Speed - 1 Year):</label>
            <input type="range" id="revSpeed" min="0" max="5" value="1" step="0.1">
        </div>
    </div>

    <script>
        let revAngle = 0;
        let rotAngle = 0;

        function animate() {
            let revSpeed = parseFloat(document.getElementById('revSpeed').value);
            let rotSpeed = parseFloat(document.getElementById('rotSpeed').value);

            revAngle += revSpeed;
            rotAngle += rotSpeed;

            document.getElementById('revolutionBox').style.transform = `rotate(${revAngle}deg)`;
            // Reverse revolution rotation on earth so it stays upright, then apply its own rotation
            document.getElementById('earthObj').style.transform = `rotate(${-revAngle + rotAngle}deg)`;

            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
