<!DOCTYPE html>
<html lang="kn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ಭಿನ್ನರಾಶಿಗಳ ಸಂಕಲನ</title>
<style>
  body {
    font-family: 'Tunga', 'Kedage', sans-serif;
    background-color: #f3e5f5;
    color: #333;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
    box-sizing: border-box;
  }
  .app-container {
    background: white;
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    max-width: 800px;
    width: 100%;
    text-align: center;
  }
  h1 {
    color: #8e24aa;
    margin-top: 0;
  }
  .addition-area {
    display: flex;
    justify-content: space-between;
    align-items: stretch;
    flex-wrap: wrap;
    gap: 20px;
    margin-bottom: 30px;
  }
  .fraction-panel {
    flex: 1;
    min-width: 200px;
    background: #fafafa;
    padding: 20px;
    border-radius: 15px;
    border: 2px solid #eee;
  }
  .fraction-display {
    font-size: 32px;
    font-weight: bold;
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 15px;
  }
  .fraction-line {
    border-top: 4px solid currentColor;
    width: 60px;
    margin: 4px 0;
  }
  .math-symbol {
    font-size: 48px;
    font-weight: bold;
    color: #9e9e9e;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .slider-group {
    margin: 10px 0;
    text-align: left;
  }
  label {
    font-size: 16px;
    font-weight: bold;
    display: flex;
    justify-content: space-between;
  }
  input[type=range] {
    width: 100%;
    cursor: pointer;
  }
  .color-a { color: #ff7043; accent-color: #ff7043; }
  .color-b { color: #42a5f5; accent-color: #42a5f5; }
  .color-result { color: #ab47bc; }
  
  /* Bar Visuals */
  .bar-container {
    display: flex;
    flex-direction: column;
    gap: 5px;
    align-items: center;
    margin-top: 15px;
  }
  .whole-bar {
    display: flex;
    width: 100%;
    height: 40px;
    background: #fff;
    border: 2px solid #ccc;
    border-radius: 6px;
    overflow: hidden;
  }
  .segment {
    flex: 1;
    border-right: 1px solid #ccc;
    transition: background-color 0.3s;
  }
  .segment:last-child {
    border-right: none;
  }
  
  .explanation-box {
    background: #e1bee7;
    padding: 20px;
    border-radius: 15px;
    font-size: 18px;
    line-height: 1.6;
    border: 2px dashed #ce93d8;
  }
  .step-text {
    font-weight: bold;
    color: #4a148c;
    font-size: 20px;
  }
</style>
</head>
<body>

<div class="app-container">
  <h1>ಭಿನ್ನರಾಶಿಗಳ ಸಂಕಲನ</h1>
  
  <div class="addition-area">
    
    <div class="fraction-panel" style="border-color: #ffccbc;">
      <div class="fraction-display color-a">
        <div id="numTextA">1</div>
        <div class="fraction-line"></div>
        <div id="denTextA">2</div>
      </div>
      <div class="slider-group">
        <label class="color-a">ಅಂಶ (Numerator): <span id="lblNumA">1</span></label>
        <input type="range" id="slNumA" class="color-a" min="0" max="6" value="1">
      </div>
      <div class="slider-group">
        <label class="color-a">ಛೇದ (Denominator): <span id="lblDenA">2</span></label>
        <input type="range" id="slDenA" class="color-a" min="1" max="6" value="2">
      </div>
      <div class="bar-container" id="barA"></div>
    </div>

    <div class="math-symbol">+</div>

    <div class="fraction-panel" style="border-color: #bbdefb;">
      <div class="fraction-display color-b">
        <div id="numTextB">1</div>
        <div class="fraction-line"></div>
        <div id="denTextB">3</div>
      </div>
      <div class="slider-group">
        <label class="color-b">ಅಂಶ (Numerator): <span id="lblNumB">1</span></label>
        <input type="range" id="slNumB" class="color-b" min="0" max="6" value="1">
      </div>
      <div class="slider-group">
        <label class="color-b">ಛೇದ (Denominator): <span id="lblDenB">3</span></label>
        <input type="range" id="slDenB" class="color-b" min="1" max="6" value="3">
      </div>
      <div class="bar-container" id="barB"></div>
    </div>

    <div class="math-symbol">=</div>

    <div class="fraction-panel" style="border-color: #e1bee7; background: #f3e5f5;">
      <div class="fraction-display color-result">
        <div id="numTextR">5</div>
        <div class="fraction-line"></div>
        <div id="denTextR">6</div>
      </div>
      <div style="font-weight:bold; color:#8e24aa; margin-top:20px; font-size:18px;">ಉತ್ತರ (Result)</div>
      <div class="bar-container" id="barR"></div>
    </div>
    
  </div>

  <div class="explanation-box" id="explanationBox">
    </div>

</div>

<script>
  // Helper Math Functions
  function gcd(a, b) { return b === 0 ? a : gcd(b, a % b); }
  function lcm(a, b) { return (a * b) / gcd(a, b); }

  function drawBar(containerId, num1, den, color1, num2 = 0, color2 = null) {
    const container = document.getElementById(containerId);
    container.innerHTML = '';
    
    let totalSlices = num1 + num2;
    let totalWholes = Math.max(1, Math.ceil(totalSlices / den));
    
    for(let w = 0; w < totalWholes; w++) {
      let wholeDiv = document.createElement('div');
      wholeDiv.className = 'whole-bar';
      
      for(let i = 0; i < den; i++) {
        let segment = document.createElement('div');
        segment.className = 'segment';
        let globalIndex = w * den + i;
        
        if (globalIndex < num1) {
          segment.style.backgroundColor = color1;
        } else if (globalIndex < num1 + num2) {
          segment.style.backgroundColor = color2;
        }
        wholeDiv.appendChild(segment);
      }
      container.appendChild(wholeDiv);
    }
  }

  function update() {
    let nA = parseInt(document.getElementById('slNumA').value);
    let dA = parseInt(document.getElementById('slDenA').value);
    let nB = parseInt(document.getElementById('slNumB').value);
    let dB = parseInt(document.getElementById('slDenB').value);

    // Update UI text for inputs
    document.getElementById('numTextA').innerText = nA; document.getElementById('lblNumA').innerText = nA;
    document.getElementById('denTextA').innerText = dA; document.getElementById('lblDenA').innerText = dA;
    document.getElementById('numTextB').innerText = nB; document.getElementById('lblNumB').innerText = nB;
    document.getElementById('denTextB').innerText = dB; document.getElementById('lblDenB').innerText = dB;

    // Draw individual bars
    drawBar('barA', nA, dA, '#ff7043');
    drawBar('barB', nB, dB, '#42a5f5');

    // Calculate Addition
    let commonDen = lcm(dA, dB);
    let eqNumA = nA * (commonDen / dA);
    let eqNumB = nB * (commonDen / dB);
    let totalNum = eqNumA + eqNumB;

    // Update UI text for Result
    document.getElementById('numTextR').innerText = totalNum;
    document.getElementById('denTextR').innerText = commonDen;

    // Draw combined Result bar
    drawBar('barR', eqNumA, commonDen, '#ff7043', eqNumB, '#42a5f5');

    // Update Explanation Text
    const expBox = document.getElementById('explanationBox');
    if (dA === dB) {
      expBox.innerHTML = `
        <div class="step-text">ಅದ್ಭುತ! ಎರಡೂ ಭಿನ್ನರಾಶಿಗಳ ಛೇದಗಳು ಸಮಾನವಾಗಿವೆ (${dA}).</div>
        <p>ಭಾಗಗಳ ಗಾತ್ರ ಒಂದೇ ಆಗಿರುವುದರಿಂದ, ನಾವು ನೇರವಾಗಿ ಅಂಶಗಳನ್ನು ಕೂಡಿಸಬಹುದು.</p>
        <p style="font-size: 24px;"><b>${nA}</b> + <b>${nB}</b> = <b>${totalNum}</b> (ಒಟ್ಟು ${dA} ಭಾಗಗಳಲ್ಲಿ).</p>
      `;
    } else {
      expBox.innerHTML = `
        <div class="step-text">ಗಮನಿಸಿ! ಛೇದಗಳು ಬೇರೆ ಬೇರೆಯಾಗಿವೆ (${dA} ಮತ್ತು ${dB}).</div>
        <p>ನಾವು ಬೇರೆ ಬೇರೆ ಗಾತ್ರದ ಭಾಗಗಳನ್ನು ನೇರವಾಗಿ ಕೂಡಿಸುವಂತಿಲ್ಲ. ಮೊದಲು ನಾವು <b>ಸಮಾನ ಛೇದ</b>ವನ್ನು ಕಂಡುಹಿಡಿಯಬೇಕು! ${dA} ಮತ್ತು ${dB} ರ ಲ.ಸಾ.ಅ (LCM) <b>${commonDen}</b> ಆಗಿದೆ.</p>
        <p>ಭಿನ್ನರಾಶಿಗಳನ್ನು ಬದಲಾಯಿಸೋಣ: <br>
        <span style="color:#e64a19">${nA}/${dA}</span> ಎಂಬುದು <span style="color:#e64a19">${eqNumA}/${commonDen}</span> ಆಗುತ್ತದೆ.<br>
        <span style="color:#1976d2">${nB}/${dB}</span> ಎಂಬುದು <span style="color:#1976d2">${eqNumB}/${commonDen}</span> ಆಗುತ್ತದೆ.</p>
        <p style="font-size: 24px;">ಈಗ ಛೇದಗಳು ಸಮಾನವಾಗಿವೆ, ಅಂಶಗಳನ್ನು ಕೂಡಿಸಿ: <b>${eqNumA} + ${eqNumB} = ${totalNum} / ${commonDen}</b>.</p>
      `;
    }
  }

  // Event Listeners
  document.getElementById('slNumA').addEventListener('input', update);
  document.getElementById('slDenA').addEventListener('input', update);
  document.getElementById('slNumB').addEventListener('input', update);
  document.getElementById('slDenB').addEventListener('input', update);

  // Initialize
  update();
</script>

</body>
</html>
