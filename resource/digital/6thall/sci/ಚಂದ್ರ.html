<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ನಮ್ಮ ಚಂದ್ರ - ಇಂಟರಾಕ್ಟಿವ್ ವಿಜೆಟ್</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: radial-gradient(circle at center, #0b0c10 0%, #1f2833 100%);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: #f1c40f;
            text-shadow: 0 0 15px rgba(241, 196, 15, 0.8);
            margin-bottom: 5px;
            text-align: center;
        }

        p.subtitle {
            color: #66fcf1;
            font-size: 1.2em;
            margin-bottom: 30px;
            text-align: center;
        }

        /* Main Container for Responsive Layout */
        .main-container {
            display: flex;
            flex-direction: column;
            gap: 40px;
            width: 100%;
            max-width: 1000px;
            align-items: center;
        }

        @media (min-width: 768px) {
            .main-container {
                flex-direction: row;
                justify-content: space-between;
                align-items: flex-start;
            }
        }

        /* Earth & Moon Animation Scene */
        .scene {
            position: relative;
            width: 300px;
            height: 300px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
        }

        @media (min-width: 768px) {
            .scene { width: 400px; height: 400px; }
        }

        /* Earth */
        .earth {
            position: absolute;
            width: 100px;
            height: 100px;
            background: url('https://upload.wikimedia.org/wikipedia/commons/2/22/Earth_Western_Hemisphere_transparent_background.png') center/cover;
            border-radius: 50%;
            box-shadow: 0 0 30px rgba(52, 152, 219, 0.6);
            z-index: 2;
        }

        @media (min-width: 768px) {
            .earth { width: 130px; height: 130px; }
        }

        /* Orbit Path */
        .orbit {
            position: absolute;
            width: 250px;
            height: 250px;
            border: 2px dashed rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            animation: revolve 10s linear infinite;
        }

        @media (min-width: 768px) {
            .orbit { width: 350px; height: 350px; }
        }

        /* Moon */
        .moon {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 30px;
            height: 30px;
            background: radial-gradient(circle at 30% 30%, #ecf0f1, #bdc3c7);
            border-radius: 50%;
            box-shadow: inset -5px -5px 10px rgba(0,0,0,0.5), 0 0 15px rgba(236, 240, 241, 0.8);
        }

        @media (min-width: 768px) {
            .moon { width: 40px; height: 40px; top: -20px; }
        }

        @keyframes revolve {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Info & Buttons Section */
        .content-section {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .buttons-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
        }

        .fact-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid #45a29e;
            color: #c5c6c7;
            padding: 12px 15px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
        }

        .fact-btn:hover {
            background: rgba(69, 162, 158, 0.3);
            color: white;
            transform: translateY(-3px);
        }

        .fact-btn.active {
            background: #45a29e;
            color: white;
            box-shadow: 0 0 15px #45a29e;
            border-color: #66fcf1;
        }

        /* Display Panel */
        .info-panel {
            background: rgba(0, 0, 0, 0.6);
            border-left: 5px solid #66fcf1;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            min-height: 150px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .info-title {
            color: #f1c40f;
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.2);
            padding-bottom: 10px;
        }

        .info-text {
            font-size: 18px;
            line-height: 1.6;
            color: #dfe6e9;
        }

    </style>
</head>
<body>

    <h1>🌕 ನಮ್ಮ ಚಂದ್ರ (The Moon)</h1>
    <p class="subtitle">ಚಂದ್ರನ ಬಗ್ಗೆ ತಿಳಿಯಲು ಕೆಳಗಿನ ಗುಂಡಿಗಳನ್ನು ಕ್ಲಿಕ್ ಮಾಡಿ</p>

    <div class="main-container">
        
        <div class="scene">
            <div class="earth"></div>
            <div class="orbit">
                <div class="moon"></div>
            </div>
        </div>

        <div class="content-section">
            
            <div class="buttons-grid">
                <button class="fact-btn active" onclick="showFact('satellite', this)">ನೈಸರ್ಗಿಕ ಉಪಗ್ರಹ</button>
                <button class="fact-btn" onclick="showFact('revolution', this)">ಪರಿಭ್ರಮಣೆ</button>
                <button class="fact-btn" onclick="showFact('closest', this)">ಹತ್ತಿರದ ಕಾಯ</button>
                <button class="fact-btn" onclick="showFact('atmosphere', this)">ವಾತಾವರಣವಿಲ್ಲ</button>
                <button class="fact-btn" onclick="showFact('mass', this)">ದ್ರವ್ಯರಾಶಿ</button>
            </div>

            <div class="info-panel">
                <div class="info-title" id="infoTitle">ನೈಸರ್ಗಿಕ ಉಪಗ್ರಹ</div>
                <div class="info-text" id="infoText">ಚಂದ್ರನು ಭೂಮಿಯ ಏಕೈಕ ನೈಸರ್ಗಿಕ ಉಪಗ್ರಹವಾಗಿದೆ.</div>
            </div>

        </div>

    </div>

    <script>
        // Data derived directly from the textbook presentation slides
        const moonFacts = {
            satellite: {
                title: "🌍 ನೈಸರ್ಗಿಕ ಉಪಗ್ರಹ",
                text: "ಚಂದ್ರನು ಭೂಮಿಯ ಏಕೈಕ ನೈಸರ್ಗಿಕ ಉಪಗ್ರಹವಾಗಿದೆ."
            },
            revolution: {
                title: "🔄 ಪರಿಭ್ರಮಣೆ (Revolution)",
                text: "ಭೂಮಿಯ ಸುತ್ತ ಒಂದು ಪರಿಭ್ರಮಣೆಯನ್ನು ಪೂರ್ಣಗೊಳಿಸಲು ಚಂದ್ರನಿಗೆ <b>ಸುಮಾರು 27 ದಿನಗಳು</b> ಬೇಕು."
            },
            closest: {
                title: "🚀 ಹತ್ತಿರದ ಕಾಯ",
                text: "ಇದು ಬಾಹ್ಯಾಕಾಶದಲ್ಲಿ ಭೂಮಿಗೆ <b>ಅತ್ಯಂತ ಹತ್ತಿರವಿರುವ</b> ನೈಸರ್ಗಿಕ ಕಾಯವಾಗಿದೆ."
            },
            atmosphere: {
                title: "❌ ವಾತಾವರಣವಿಲ್ಲ (No Atmosphere)",
                text: "ಭೂಮಿಯಲ್ಲಿದ್ದಂತೆ ಚಂದ್ರನ ಮೇಲೆ <b>ಯಾವುದೇ ವಾತಾವರಣವಿಲ್ಲ</b>."
            },
            mass: {
                title: "⚖️ ದ್ರವ್ಯರಾಶಿ (Mass)",
                text: "ಚಂದ್ರನ ದ್ರವ್ಯರಾಶಿಯು ಭೂಮಿಯ ದ್ರವ್ಯರಾಶಿಯ <b>ನಾಲ್ಕನೇ ಒಂದು ಭಾಗದಷ್ಟಿದೆ (1/4th)</b>."
            }
        };

        function showFact(factKey, element) {
            // Update Active Button styling
            let buttons = document.getElementsByClassName('fact-btn');
            for(let btn of buttons) {
                btn.classList.remove('active');
            }
            element.classList.add('active');

            // Update Panel Content
            document.getElementById('infoTitle').innerHTML = moonFacts[factKey].title;
            document.getElementById('infoText').innerHTML = moonFacts[factKey].text;
        }
    </script>
</body>
</html>
