<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <title>ಚಲನೆಯ ವಿಧಗಳು</title>
    <style>
        body { font-family: 'Arial', sans-serif; background: #2c3e50; color: white; text-align: center; padding: 20px; }
        .zones { display: flex; justify-content: center; gap: 20px; margin-top: 30px; }
        .zone { width: 200px; min-height: 250px; background: rgba(255,255,255,0.1); border: 3px dashed #bdc3c7; border-radius: 15px; padding: 15px; display: flex; flex-direction: column; align-items: center; }
        .pool { display: flex; justify-content: center; gap: 15px; margin-top: 40px; flex-wrap: wrap; max-width: 700px; margin-left: auto; margin-right: auto;}
        .item { background: #f39c12; color: white; padding: 15px 25px; border-radius: 10px; font-weight: bold; font-size: 16px; cursor: grab; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .zone-title { font-size: 20px; font-weight: bold; margin-bottom: 15px; border-bottom: 2px solid white; padding-bottom: 5px; width: 100%;}
    </style>
</head>
<body>

    <h1>🔄 ಚಲನೆಯ ವಿಧಗಳು (Motion Matrix)</h1>
    <p>ದೈನಂದಿನ ಕ್ರಿಯೆಗಳನ್ನು ಸರಿಯಾದ ಚಲನೆಯ ಪೆಟ್ಟಿಗೆಗೆ ಎಳೆಯಿರಿ!</p>

    <div class="zones">
        <div class="zone" ondrop="drop(event, 'linear')" ondragover="allowDrop(event)">
            <div class="zone-title">⬇️ ಸರಳರೇಖಾ</div>
        </div>
        <div class="zone" ondrop="drop(event, 'circular')" ondragover="allowDrop(event)">
            <div class="zone-title">⭕ ವೃತ್ತೀಯ</div>
        </div>
        <div class="zone" ondrop="drop(event, 'oscillatory')" ondragover="allowDrop(event)">
            <div class="zone-title">⏱️ ಆಂದೋಲನ</div>
        </div>
    </div>

    <div class="pool" id="pool">
        <div class="item" draggable="true" ondragstart="drag(event)" data-type="linear" id="i1">ಬೀಳುತ್ತಿರುವ ರಬ್ಬರ್ 🧽</div>
        <div class="item" draggable="true" ondragstart="drag(event)" data-type="circular" id="i2">ಮರಕುದುರೆ (Merry-Go-Round) 🎠</div>
        <div class="item" draggable="true" ondragstart="drag(event)" data-type="oscillatory" id="i3">ತೂಗುವ ಲೋಲಕ 🕰️</div>
        <div class="item" draggable="true" ondragstart="drag(event)" data-type="linear" id="i4">ಪಥಸಂಚಲನ 🚶</div>
        <div class="item" draggable="true" ondragstart="drag(event)" data-type="oscillatory" id="i5">ಉಯ್ಯಾಲೆ 🝝</div>
        <div class="item" draggable="true" ondragstart="drag(event)" data-type="circular" id="i6">ತಿರುಗುವ ಕಲ್ಲು 🪨</div>
    </div>

    <script>
        function allowDrop(ev) { ev.preventDefault(); }
        function drag(ev) { ev.dataTransfer.setData("text", ev.target.id); }
        function drop(ev, category) {
            ev.preventDefault();
            let data = ev.dataTransfer.getData("text");
            let element = document.getElementById(data);
            
            if (element.getAttribute("data-type") === category) {
                let target = ev.target.closest('.zone'); 
                target.appendChild(element);
                element.style.background = "#2ecc71"; 
            } else {
                alert("ಮತ್ತೆ ಪ್ರಯತ್ನಿಸಿ! ವಸ್ತುವು ಚಲಿಸುವ ಹಾದಿಯ ಬಗ್ಗೆ ಯೋಚಿಸಿ.");
            }
        }
    </script>
</body>
</html>
