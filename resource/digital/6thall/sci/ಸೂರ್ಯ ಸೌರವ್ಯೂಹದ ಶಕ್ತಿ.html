<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <title>ಸೂರ್ಯ: ಸೌರವ್ಯೂಹದ ಶಕ್ತಿ</title>
    <style>
        body { 
            margin: 0; 
            padding: 0; 
            background: radial-gradient(circle at center, #1b2735 0%, #090a0f 100%); 
            color: white; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            height: 100vh;
            overflow: hidden;
        }

        h1 { 
            margin-top: 30px; 
            color: #f1c40f; 
            text-shadow: 0 0 20px #e67e22; 
            font-size: 2.5em; 
            text-align: center;
        }

        .container {
            display: flex;
            align-items: center;
            justify-content: space-around;
            width: 90%;
            max-width: 1000px;
            margin-top: 50px;
        }

        /* Sun Animation */
        .sun-container {
            position: relative;
            width: 250px;
            height: 250px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .sun {
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, #fff3e0, #f39c12, #d35400);
            border-radius: 50%;
            box-shadow: 0 0 50px #f39c12, 0 0 100px #e67e22, inset 0 0 30px #d35400;
            animation: pulse 4s infinite alternate;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 40px #f39c12, 0 0 80px #e67e22; }
            100% { transform: scale(1.05); box-shadow: 0 0 80px #f39c12, 0 0 150px #e67e22, 0 0 200px #d35400; }
        }

        .earth-orbit {
            position: absolute;
            width: 350px;
            height: 350px;
            border: 1px dashed rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            animation: rotateOrbit 10s linear infinite;
        }

        .tiny-earth {
            width: 20px;
            height: 20px;
            background: #3498db;
            border-radius: 50%;
            position: absolute;
            top: 10px;
            left: 165px;
            box-shadow: 0 0 10px #2980b9;
        }

        @keyframes rotateOrbit {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Interactive Buttons & Display */
        .controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .fact-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid #f39c12;
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 250px;
            text-align: left;
        }

        .fact-btn:hover, .fact-btn.active {
            background: #f39c12;
            color: #000;
            transform: scale(1.05);
            box-shadow: 0 0 15px #f39c12;
        }

        .info-panel {
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid #3498db;
            padding: 30px;
            border-radius: 15px;
            width: 350px;
            min-height: 200px;
            font-size: 20px;
            line-height: 1.6;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 20px rgba(52, 152, 219, 0.5);
        }

        .info-title {
            color: #3498db;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 15px;
            border-bottom: 1px solid #3498db;
            padding-bottom: 5px;
        }

    </style>
</head>
<body>

    <h1>☀️ ಸೂರ್ಯ: ಸೌರವ್ಯೂಹದ ಶಕ್ತಿ</h1>
    <p>ಹೆಚ್ಚಿನ ಮಾಹಿತಿ ತಿಳಿಯಲು ಎಡಭಾಗದ ಗುಂಡಿಗಳನ್ನು (Buttons) ಕ್ಲಿಕ್ ಮಾಡಿ!</p>

    <div class="container">
        
        <div class="controls">
            <button class="fact-btn active" onclick="showFact('energy', this)">🔥 ಶಕ್ತಿಯ ಆಕರ</button>
            <button class="fact-btn" onclick="showFact('size', this)">📏 ಸೂರ್ಯನ ಗಾತ್ರ</button>
            <button class="fact-btn" onclick="showFact('distance', this)">🚀 ಭೂಮಿಯಿಂದ ದೂರ</button>
            <button class="fact-btn" onclick="showFact('au', this)">🔭 ಖಗೋಳ ಮಾನ (au)</button>
        </div>

        <div class="sun-container">
            <div class="earth-orbit"><div class="tiny-earth"></div></div>
            <div class="sun"></div>
        </div>

        <div class="info-panel">
            <div class="info-title" id="infoTitle">🔥 ಶಕ್ತಿಯ ಆಕರ</div>
            <div id="infoText">ಅತ್ಯಂತ ಬಿಸಿಯಾದ ಅನಿಲಗಳ ಗೋಳಾಕಾರದ ಕಾಯ; ಭೂಮಿಗೆ ಶಾಖ ಮತ್ತು ಬೆಳಕಿನ ಮೂಲವಾಗಿದೆ.</div>
        </div>

    </div>

    <script>
        // Data from the textbook presentation
        const facts = {
            energy: {
                title: "🔥 ಶಕ್ತಿಯ ಆಕರ",
                text: "ಸೂರ್ಯನು ಅತ್ಯಂತ ಬಿಸಿಯಾದ ಅನಿಲಗಳ ಗೋಳಾಕಾರದ ಕಾಯ. ಇದು ಭೂಮಿಗೆ ಶಾಖ ಮತ್ತು ಬೆಳಕಿನ ಪ್ರಮುಖ ಮೂಲವಾಗಿದೆ."
            },
            size: {
                title: "📏 ಸೂರ್ಯನ ಗಾತ್ರ",
                text: "ಸೂರ್ಯನು ಅತಿ ದೊಡ್ಡದಾಗಿದ್ದು, ಇದು <b>ಭೂಮಿಯ ಗಾತ್ರಕ್ಕಿಂತ 100 ಪಟ್ಟು ದೊಡ್ಡದಾಗಿದೆ!</b>"
            },
            distance: {
                title: "🚀 ಭೂಮಿಯಿಂದ ದೂರ",
                text: "ಸೂರ್ಯನು ಭೂಮಿಯಿಂದ ಸುಮಾರು <b>150 ಮಿಲಿಯನ್ ಕಿಲೋ ಮೀಟರ್</b> ದೂರದಲ್ಲಿದೆ."
            },
            au: {
                title: "🔭 ಖಗೋಳ ಮಾನ (au)",
                text: "ಸೌರವ್ಯೂಹದ ಅಂತರವನ್ನು ಅಳೆಯಲು <b>au</b> ಬಳಸಲಾಗುತ್ತದೆ. ಸೂರ್ಯನ ನಂತರದ ಹತ್ತಿರದ ನಕ್ಷತ್ರ ಪ್ರಾಕ್ಸಿಮಾ ಸೆಂಟಾರಿ (Proxima Centauri) 269000 au ದೂರದಲ್ಲಿದೆ."
            }
        };

        function showFact(factKey, element) {
            // Update Text
            document.getElementById('infoTitle').innerHTML = facts[factKey].title;
            document.getElementById('infoText').innerHTML = facts[factKey].text;

            // Update Active Button styling
            let buttons = document.getElementsByClassName('fact-btn');
            for (let btn of buttons) {
                btn.classList.remove('active');
            }
            element.classList.add('active');
        }
    </script>
</body>
</html>
