<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>ಭ್ರಮಣೆ ಮತ್ತು ಪರಿಭ್ರಮಣೆ</title>
    <style>
        body { 
            margin: 0; 
            background: #000; 
            color: white; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            text-align: center; 
            overflow-x: hidden; 
            padding-bottom: 30px;
        }

        h2 { color: #f1c40f; margin-top: 20px; font-size: 1.5em; padding: 0 10px; }

        /* Information Panels */
        .info-panel {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 90%;
            max-width: 800px;
            margin: 15px auto;
        }

        @media (min-width: 600px) {
            .info-panel { flex-direction: row; }
            h2 { font-size: 2em; }
        }

        .info-card {
            background: rgba(0, 150, 255, 0.15);
            border: 1px solid #0984e3;
            border-radius: 10px;
            padding: 15px;
            flex: 1;
            text-align: left;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .info-card h3 { color: #74b9ff; margin-top: 0; border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 5px; }
        .info-card p { font-size: 16px; line-height: 1.5; margin-bottom: 0; color: #dfe6e9; }
        .highlight { color: #f1c40f; font-weight: bold; }

        /* 2D Solar System Scene */
        .scene {
            position: relative;
            width: 100%;
            height: 350px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 20px 0;
        }

        .sun { 
            width: 60px; height: 60px; 
            background: radial-gradient(circle, #ffeb3b, #f39c12); 
            border-radius: 50%; 
            position: absolute; 
            box-shadow: 0 0 40px #f39c12; 
        }

        .orbit { 
            width: 280px; height: 280px; 
            border: 1px dashed rgba(255,255,255,0.3); 
            border-radius: 50%; 
            position: absolute; 
        }

        .earth-container { 
            position: absolute; 
            width: 280px; height: 280px; 
        }

        .earth { 
            width: 30px; height: 30px; 
            background: url('https://upload.wikimedia.org/wikipedia/commons/2/22/Earth_Western_Hemisphere_transparent_background.png') center/cover; 
            border-radius: 50%; 
            position: absolute; 
            top: -15px; /* (earth height / 2) */
            left: 125px; /* (container width / 2) - (earth width / 2) */
            box-shadow: 0 0 10px rgba(52, 152, 219, 0.8);
        }

        /* Responsive scaling for larger screens (Laptops) */
        @media (min-width: 600px) {
            .scene { height: 450px; }
            .sun { width: 80px; height: 80px; }
            .orbit { width: 400px; height: 400px; }
            .earth-container { width: 400px; height: 400px; }
            .earth { width: 40px; height: 40px; top: -20px; left: 180px; }
        }

        /* Controls Section */
        .controls { 
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: rgba(255,255,255,0.1); 
            padding: 20px; 
            border-radius: 15px; 
            width: 90%; 
            max-width: 600px;
            margin: 0 auto;
            backdrop-filter: blur(5px); 
            border: 1px solid rgba(255,255,255,0.2);
        }

        .control-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .control-group label {
            margin-bottom: 8px;
            font-weight: bold;
            color: #bdc3c7;
        }

        .control-group input[type=range] {
            width: 100%;
            cursor: pointer;
        }

        @media (min-width: 600px) {
            .control-group { flex-direction: row; justify-content: space-between; }
            .control-group label { margin-bottom: 0; width: 60%; text-align: right; margin-right: 20px; }
            .control-group input[type=range] { width: 40%; }
        }

    </style>
</head>
<body>
    <h2>🌍 ಭ್ರಮಣೆ (Rotation) vs ಪರಿಭ್ರಮಣೆ (Revolution)</h2>
    
    <div class="info-panel">
        <div class="info-card">
            <h3>1. ಭ್ರಮಣೆ (Rotation)</h3>
            <p>ಭೂಮಿಯು ತನ್ನ ಅಕ್ಷದ ಸುತ್ತಲೂ ತಿರುಗುತ್ತದೆ. ಒಂದು ಪೂರ್ಣ ಭ್ರಮಣೆಗೆ <span class="highlight">24 ಗಂಟೆಗಳು ಬೇಕು (ಒಂದು ದಿನ)</span>.</p>
        </div>
        <div class="info-card">
            <h3>2. ಪರಿಭ್ರಮಣೆ (Revolution)</h3>
            <p>ಭೂಮಿಯು ಸೂರ್ಯನ ಸುತ್ತ ಪರಿಭ್ರಮಿಸುತ್ತದೆ. ಒಂದು ಪೂರ್ಣ ಪರಿಭ್ರಮಣೆಗೆ ಸುಮಾರು <span class="highlight">365 ದಿನಗಳು (ಒಂದು ವರ್ಷ)</span> ಬೇಕು.</p>
        </div>
    </div>

    <div class="scene">
        <div class="orbit"></div>
        <div class="sun"></div>
        <div class="earth-container" id="revolutionBox">
            <div class="earth" id="earthObj"></div>
        </div>
    </div>

    <div class="controls">
        <div class="control-group">
            <label>ಭ್ರಮಣೆ ವೇಗ (Earth's Spin):</label>
            <input type="range" id="rotSpeed" min="0" max="15" value="5" step="0.1">
        </div>
        <div class="control-group">
            <label>ಪರಿಭ್ರಮಣೆ ವೇಗ (Orbit Speed):</label>
            <input type="range" id="revSpeed" min="0" max="5" value="1" step="0.1">
        </div>
    </div>

    <script>
        let revAngle = 0;
        let rotAngle = 0;

        function animate() {
            // Get slider values
            let revSpeed = parseFloat(document.getElementById('revSpeed').value);
            let rotSpeed = parseFloat(document.getElementById('rotSpeed').value);

            // Update angles
            revAngle += revSpeed;
            rotAngle += rotSpeed;

            // 1. Rotate the container to make Earth revolve around the Sun
            document.getElementById('revolutionBox').style.transform = `rotate(${revAngle}deg)`;
            
            // 2. Counter-rotate the Earth so it doesn't spin purely because of the orbit, 
            // and then apply its own rotation (RotSpeed) to simulate day/night spin.
            document.getElementById('earthObj').style.transform = `rotate(${-revAngle + rotAngle}deg)`;

            // Loop the animation
            requestAnimationFrame(animate);
        }
        
        // Start animation
        animate();
    </script>
</body>
</html>
