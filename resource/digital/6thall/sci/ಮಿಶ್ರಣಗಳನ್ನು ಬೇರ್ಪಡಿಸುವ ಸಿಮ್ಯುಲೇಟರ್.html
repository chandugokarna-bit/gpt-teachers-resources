<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ಮಿಶ್ರಣಗಳನ್ನು ಬೇರ್ಪಡಿಸುವ ಸಿಮ್ಯುಲೇಟರ್</title>
    <style>
        :root {
            --primary: #2b2d42;
            --secondary: #8d99ae;
            --accent: #ef2336;
            --bg: #edf2f4;
        }
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            overflow: hidden;
            user-select: none;
        }
        header {
            background-color: var(--primary);
            color: white;
            text-align: center;
            padding: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        #stats {
            display: flex;
            justify-content: center;
            gap: 40px;
            font-size: 1.5rem;
            font-weight: bold;
            margin-top: 5px;
        }
        .score-text { color: #4caf50; }
        .lives-text { color: #ef2336; }

        /* Conveyor Belt Area */
        #factory-area {
            position: relative;
            width: 100vw;
            height: 50vh;
            background: linear-gradient(to bottom, #d9d9d9, #edf2f4);
            display: flex;
            align-items: center;
        }
        #belt {
            position: absolute;
            width: 100%;
            height: 120px;
            background: #555;
            border-top: 6px solid #333;
            border-bottom: 6px solid #333;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
        }
        .stripes {
            width: 200%;
            height: 100%;
            background: repeating-linear-gradient(
                -45deg,
                transparent,
                transparent 40px,
                rgba(255,255,255,0.1) 40px,
                rgba(255,255,255,0.1) 80px
            );
            animation: roll 2s linear infinite;
        }
        @keyframes roll {
            100% { transform: translateX(-113px); } 
        }

        /* Draggable Tools Area */
        #tools-area {
            height: 35vh;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            background-color: white;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.1);
            flex-wrap: wrap;
        }
        .tool {
            width: 130px;
            height: 110px;
            background: white;
            border: 4px solid var(--primary);
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: grab;
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .tool:active {
            cursor: grabbing;
            transform: scale(0.95);
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .tool span { font-size: 2.5rem; margin-bottom: 5px; }
        .tool div { font-weight: bold; font-size: 0.9rem; color: var(--primary); text-align: center; }

        /* Falling Mixtures */
        .mixture {
            position: absolute;
            width: 140px;
            height: 100px;
            background: white;
            border: 3px solid var(--secondary);
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            z-index: 10;
            transition: transform 0.2s;
        }
        .mixture span { font-size: 2rem; }
        .mixture div { font-size: 0.9rem; font-weight: bold; text-align: center; margin-top: 5px; color: #333; }
        
        .success-anim { animation: popOut 0.5s forwards; border-color: #4caf50; }
        .error-anim { animation: shake 0.4s; border-color: #ef2336; }

        @keyframes popOut {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(0); opacity: 0; }
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            50% { transform: translateX(10px); }
            75% { transform: translateX(-10px); }
        }

        /* Overlays */
        #overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(43, 45, 66, 0.9);
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        #overlay h1 { font-size: 3rem; margin-bottom: 10px; text-align: center; }
        #overlay p { font-size: 1.2rem; margin-bottom: 30px; text-align: center; max-width: 600px; line-height: 1.5; }
        button {
            padding: 15px 30px;
            font-size: 1.5rem;
            font-weight: bold;
            color: white;
            background-color: #ef2336;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover { background-color: #d90429; }
    </style>
</head>
<body>

    <div id="overlay">
        <h1 id="overlay-title">ಬೇರ್ಪಡಿಸುವಿಕೆ ಕೇಂದ್ರ</h1>
        <p id="overlay-desc">ಕನ್ವೇಯರ್ ಬೆಲ್ಟ್ ಮೇಲೆ ಚಲಿಸುತ್ತಿರುವ ಮಿಶ್ರಣಗಳು ಪರದೆಯಿಂದ ಕೆಳಗೆ ಬೀಳುವ ಮೊದಲು, ಅವುಗಳ ಮೇಲೆ ಸರಿಯಾದ ಬೇರ್ಪಡಿಸುವ ಸಾಧನವನ್ನು ಎಳೆದು ಬಿಡಿ!</p>
        <button id="start-btn" onclick="startGame()">ಆಟ ಪ್ರಾರಂಭಿಸಿ</button>
    </div>

    <header>
        <h2>🧪 ಮಿಶ್ರಣಗಳನ್ನು ಬೇರ್ಪಡಿಸುವಿಕೆ</h2>
        <div id="stats">
            <div class="score-text">ಸ್ಕೋರ್: <span id="score">0</span></div>
            <div class="lives-text">ಜೀವಗಳು: <span id="lives">3</span> ❤️</div>
        </div>
    </header>

    <div id="factory-area">
        <div id="belt"><div class="stripes"></div></div>
    </div>

    <div id="tools-area">
        <div class="tool" draggable="true" data-tool="magnet">
            <span>🧲</span><div>ಕಾಂತ</div>
        </div>
        <div class="tool" draggable="true" data-tool="filter">
            <span>⚗️</span><div>ಶೋಧಕ ಕಾಗದ</div>
        </div>
        <div class="tool" draggable="true" data-tool="wind">
            <span>🌬️</span><div>ಗಾಳಿ ಬೀಸುವ ಸಾಧನ</div>
        </div>
        <div class="tool" draggable="true" data-tool="sieve">
            <span>🥣</span><div>ಜರಡಿ</div>
        </div>
    </div>

    <script>
        let score = 0;
        let lives = 3;
        let activeMixtures = [];
        let gameLoopId;
        let spawnTimeoutId;
        let speed = 2;
        let isGameOver = false;

        const beltArea = document.getElementById('factory-area');
        const scoreEl = document.getElementById('score');
        const livesEl = document.getElementById('lives');
        const overlay = document.getElementById('overlay');
        const overlayTitle = document.getElementById('overlay-title');
        const startBtn = document.getElementById('start-btn');

        const mixtureData = [
            { type: 'magnet', icon: '🔩+🪵', name: 'ಕಬ್ಬಿಣ + ಮರದ ಪುಡಿ' },
            { type: 'filter', icon: '🟤💧', name: 'ಮಣ್ಣಿನ ನೀರು' },
            { type: 'wind', icon: '🌾+🍃', name: 'ಧಾನ್ಯ + ಹೊಟ್ಟು' },
            { type: 'sieve', icon: '🏖️+🪨', name: 'ಮರಳು + ಕಲ್ಲುಗಳು' }
        ];

        // HTML5 ಡ್ರ್ಯಾಗಿಂಗ್‌ಗಾಗಿ ಪರಿಕರಗಳನ್ನು ಆರಂಭಿಸಿ
        document.querySelectorAll('.tool').forEach(tool => {
            tool.addEventListener('dragstart', e => {
                e.dataTransfer.setData('text/plain', tool.dataset.tool);
            });
        });

        function startGame() {
            score = 0;
            lives = 3;
            speed = 2;
            isGameOver = false;
            scoreEl.innerText = score;
            livesEl.innerText = lives;
            
            // ಅಸ್ತಿತ್ವದಲ್ಲಿರುವ ಮಿಶ್ರಣಗಳಿದ್ದರೆ ತೆರವುಗೊಳಿಸಿ
            activeMixtures.forEach(m => m.el.remove());
            activeMixtures = [];
            
            overlay.style.display = 'none';
            
            gameLoop();
            scheduleSpawn();
        }

        function scheduleSpawn() {
            if (isGameOver) return;
            spawnMixture();
            // ಸ್ಕೋರ್ ಹೆಚ್ಚಾದಂತೆ ಸ್ಪಾನ್ ಮಧ್ಯಂತರ ಕಡಿಮೆಯಾಗುತ್ತದೆ (ಕಷ್ಟಕರವಾಗುತ್ತದೆ)
            const nextSpawn = Math.max(1200, 3000 - (score * 15));
            spawnTimeoutId = setTimeout(scheduleSpawn, nextSpawn);
        }

        function spawnMixture() {
            const data = mixtureData[Math.floor(Math.random() * mixtureData.length)];
            const el = document.createElement('div');
            el.className = 'mixture';
            el.innerHTML = `<span>${data.icon}</span><div>${data.name}</div>`;
            el.dataset.tool = data.type;
            
            // ಬೆಲ್ಟ್ ಮೇಲೆ ಲಂಬವಾಗಿ ಮಧ್ಯದಲ್ಲಿರಿಸಲು
            el.style.top = 'calc(50% - 50px)';
            el.style.left = '-150px';

            // ಚಲಿಸುವ ಮಿಶ್ರಣದ ಮೇಲೆ ಡ್ರಾಪ್ ಝೋನ್ ಹೊಂದಿಸಿ
            el.addEventListener('dragover', e => e.preventDefault());
            el.addEventListener('drop', handleDrop);

            beltArea.appendChild(el);
            activeMixtures.push({ el, x: -150, active: true });
        }

        function handleDrop(e) {
            e.preventDefault();
            if (isGameOver) return;

            const usedTool = e.dataTransfer.getData('text/plain');
            const targetTool = this.dataset.tool;
            const mixObj = activeMixtures.find(m => m.el === this);

            if (!mixObj || !mixObj.active) return;

            if (usedTool === targetTool) {
                // ಯಶಸ್ಸಿನ ಸ್ಥಿತಿ
                this.classList.add('success-anim');
                mixObj.active = false; // ಚಲನೆಯ ತರ್ಕವನ್ನು ನಿಲ್ಲಿಸಿ
                
                score += 10;
                scoreEl.innerText = score;
                speed += 0.05; // ಬೆಲ್ಟ್ ವೇಗವನ್ನು ಕ್ರಮೇಣ ಹೆಚ್ಚಿಸಿ

                setTimeout(() => {
                    this.remove();
                    activeMixtures = activeMixtures.filter(m => m.el !== this);
                }, 500);

            } else {
                // ವಿಫಲ ಸ್ಥಿತಿ
                this.classList.add('error-anim');
                setTimeout(() => this.classList.remove('error-anim'), 400);
                loseLife();
            }
        }

        function loseLife() {
            lives--;
            livesEl.innerText = lives;
            if (lives <= 0) {
                endGame();
            }
        }

        function endGame() {
            isGameOver = true;
            cancelAnimationFrame(gameLoopId);
            clearTimeout(spawnTimeoutId);
            
            overlayTitle.innerText = `ಆಟ ಮುಕ್ತಾಯ! ಸ್ಕೋರ್: ${score}`;
            startBtn.innerText = "ಮತ್ತೆ ಆಡಿ";
            overlay.style.display = 'flex';
        }

        function gameLoop() {
            if (isGameOver) return;

            const screenWidth = window.innerWidth;

            activeMixtures.forEach((mix, index) => {
                if (!mix.active) return; // ಪ್ರಸ್ತುತ ಪಾಪ್ ಔಟ್ ಆಗುತ್ತಿದ್ದರೆ ಸ್ಥಾನವನ್ನು ನವೀಕರಿಸುವುದನ್ನು ಸ್ಕಿಪ್ ಮಾಡಿ

                mix.x += speed;
                mix.el.style.left = mix.x + 'px';

                // ಪರದೆಯಿಂದ ಕೆಳಗೆ ಬಿದ್ದಿದೆಯೇ ಎಂದು ಪರಿಶೀಲಿಸಿ
                if (mix.x > screenWidth) {
                    mix.el.remove();
                    activeMixtures.splice(index, 1);
                    loseLife();
                }
            });

            gameLoopId = requestAnimationFrame(gameLoop);
        }
    </script>
</body>
</html>
