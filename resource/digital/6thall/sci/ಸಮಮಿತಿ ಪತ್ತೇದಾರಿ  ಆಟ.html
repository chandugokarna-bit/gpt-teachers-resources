<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ಸಮಮಿತಿ ಪತ್ತೇದಾರಿ - ಸೂಪರ್ ಸಾಹಸ ಆಟ</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Kannada:wght@400;700&display=swap');

        :root {
            --purple: #6c5ce7;
            --pink: #fd79a8;
            --yellow: #fdcb6e;
            --green: #00b894;
            --red: #d63031;
            --dark: #2d3436;
            --blue: #0984e3;
        }

        body {
            font-family: 'Noto Sans Kannada', sans-serif;
            background: linear-gradient(135deg, #74b9ff, #a29bfe);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            user-select: none;
        }

        .game-card {
            background: white;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 650px;
            padding: 25px;
            text-align: center;
            border: 4px solid var(--yellow);
            position: relative;
            overflow: hidden;
        }

        .header-status {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            background: #f1f2f6;
            padding: 10px 20px;
            border-radius: 15px;
            font-weight: bold;
            font-size: 16px;
        }

        .lives { color: var(--red); font-size: 20px; }
        .score { color: var(--purple); }

        h1 {
            color: var(--purple);
            font-size: 26px;
            margin: 5px 0;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        .instruction-box {
            background: #ffeaa7;
            color: #6c5ce7;
            padding: 12px;
            border-radius: 12px;
            font-size: 14px;
            margin-bottom: 20px;
            font-weight: bold;
            border: 2px dashed var(--pink);
        }

        .level-indicator {
            background: var(--pink);
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 15px;
            font-size: 14px;
            font-weight: bold;
        }

        .canvas-area {
            position: relative;
            width: 300px;
            height: 300px;
            margin: 0 auto;
            background: #f9f9f9;
            border-radius: 20px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.05);
            border: 3px solid #dfe4ea;
        }

        svg {
            width: 100%;
            height: 100%;
        }

        /* Interactive Game Hotspots */
        .symmetry-line {
            stroke: #555;
            stroke-width: 4;
            stroke-dasharray: 8 6;
            cursor: pointer;
            transition: all 0.3s;
        }

        .symmetry-line:hover {
            stroke: var(--yellow);
            stroke-width: 9;
        }

        .touch-facilitator {
            stroke: transparent;
            stroke-width: 25;
            cursor: pointer;
        }

        .touch-facilitator:hover + .symmetry-line {
            stroke: var(--yellow);
            stroke-width: 9;
        }

        .msg-pop {
            margin-top: 15px;
            font-size: 17px;
            font-weight: bold;
            min-height: 45px;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0 10px;
        }

        .btn-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 15px;
            min-height: 50px;
        }

        .next-btn {
            background: var(--green);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,184,148,0.4);
            display: none;
            transition: transform 0.2s;
        }

        .none-btn {
            background: var(--blue);
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(9,132,227,0.4);
            display: none;
            transition: transform 0.2s;
        }

        .next-btn:hover, .none-btn:hover {
            transform: scale(1.05);
        }

        .overlay-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.96);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            animation: fadeIn 0.5s ease forwards;
        }

        .overlay-screen h2 { font-size: 30px; margin-bottom: 10px; color: var(--purple); }
        .overlay-screen p { font-size: 18px; color: #555; margin-bottom: 20px; }

        .restart-btn {
            background: var(--purple);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

<div class="game-card">
    <div class="header-status">
        <div class="score">⭐ ಅಂಕಗಳು: <span id="scoreVal">0</span></div>
        <div class="lives" id="livesBox">❤️ ❤️ ❤️</div>
    </div>

    <h1>🔍 ಸಮಮಿತಿ ಪತ್ತೇದಾರಿ ಆಟ</h1>
    <div class="level-indicator" id="levelName">ಲೋಡ್ ಆಗುತ್ತಿದೆ...</div>
    
    <div class="instruction-box">
        ಸೂಚನೆ: ಚಿತ್ರದ ಮೇಲಿರುವ ಸರಿಯಾದ ಸಮಮಿತಿ ರೇಖೆಯ (Dashed Line) ಮೇಲೆ ಕ್ಲಿಕ್ ಮಾಡಿ! 🎯
    </div>

    <div class="canvas-area" id="stage"></div>

    <div class="msg-pop" id="feedbackMsg">ರೇಖೆಯ ಮೇಲೆ ಕ್ಲಿಕ್ ಮಾಡಿ ಆಟ ಆರಂಭಿಸಿ!</div>
    
    <div class="btn-container">
        <button class="none-btn" id="noneBtn" onclick="selectNoLineOption()">ಯಾವ ಸಮಮಿತಿ ರೇಖೆಯೂ ಇಲ್ಲ 🚫</button>
        <button class="next-btn" id="nextBtn" onclick="nextLevel()">ಮುಂದಿನ ಹಂತ ➡️</button>
    </div>

    <div class="overlay-screen" id="endScreen">
        <h2 id="endTitle">ಆಟ ಮುಕ್ತಾಯ! 🎮</h2>
        <p id="endDesc font-weight:bold;"></p>
        <button class="restart-btn" onclick="resetGame()">ಮತ್ತೊಮ್ಮೆ ಆಡಿ 🔄</button>
    </div>
</div>

<script>
    let currentLevelIndex = 0;
    let score = 0;
    let lives = 3;
    let levelSolved = false;

    function playBeep(type) {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        if (type === 'win') {
            osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); 
            osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1); 
            osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.2); 
            gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
            osc.start(); osc.stop(audioCtx.currentTime + 0.35);
        } else if (type === 'lose') {
            osc.frequency.setValueAtTime(220, audioCtx.currentTime); 
            osc.frequency.linearRampToValueAtTime(110, audioCtx.currentTime + 0.25);
            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
            osc.start(); osc.stop(audioCtx.currentTime + 0.3);
        } else if (type === 'victory') {
            osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
            osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.15);
            osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.3);
            osc.frequency.setValueAtTime(1046.50, audioCtx.currentTime + 0.45); 
            gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
            osc.start(); osc.stop(audioCtx.currentTime + 0.6);
        }
    }

    const gameLevels = [
        {
            title: "ಹಂತ 1: ತಾಜ್ ಮಹಲ್",
            svg: `<svg viewBox="0 0 300 300">
                    <rect x="60" y="160" width="180" height="90" fill="#e0f7fa" rx="5"/>
                    <path d="M 110 160 Q 150 90 190 160 Z" fill="#b2ebf2" />
                    <rect x="75" y="100" width="15" height="60" fill="#b2ebf2"/>
                    <rect x="210" y="100" width="15" height="60" fill="#b2ebf2"/>
                    <circle cx="150" cy="120" r="12" fill="#00bcd4"/>
                    <g onclick="selectLine(true, 'v_taj', this)"><line x1="150" y1="20" x2="150" y2="280" class="touch-facilitator"/><line x1="150" y1="20" x2="150" y2="280" class="symmetry-line" id="v_taj"/></g>
                    <g onclick="selectLine(false, 'h_taj', this)"><line x1="20" y1="175" x2="280" y2="175" class="touch-facilitator"/><line x1="20" y1="175" x2="280" y2="175" class="symmetry-line" id="h_taj"/></g>
                 </svg>`,
            desc: "ಅದ್ಭುತ! ತಾಜ್ ಮಹಲ್ ಕೇವಲ ಲಂಬವಾಗಿ (Vertical) ಮಾತ್ರ ಸಮಮಿತಿಯನ್ನು ಹೊಂದಿದೆ.",
            hasNoLine: false
        },
        {
            title: "ಹಂತ 2: ಚೌಕ (Square)",
            svg: `<svg viewBox="0 0 300 300">
                    <rect x="70" y="70" width="160" height="160" fill="#55efc4" rx="8"/>
                    <g onclick="selectLine(true, 'sq_v', this)"><line x1="150" y1="20" x2="150" y2="280" class="touch-facilitator"/><line x1="150" y1="20" x2="150" y2="280" class="symmetry-line" id="sq_v"/></g>
                    <g onclick="selectLine(true, 'sq_d1', this)"><line x1="40" y1="40" x2="260" y2="260" class="touch-facilitator"/><line x1="40" y1="40" x2="260" y2="260" class="symmetry-line" id="sq_d1"/></g>
                 </svg>`,
            desc: "ಸರಿಯಾದ ಉತ್ತರ! ಚೌಕಕ್ಕೆ ಒಟ್ಟು 4 ಸಮಮಿತಿ ರೇಖೆಗಳಿರುತ್ತವೆ.",
            hasNoLine: false
        },
        {
            title: "ಹಂತ 3: ಆಯತ (Rectangle)",
            svg: `<svg viewBox="0 0 300 300">
                    <rect x="50" y="90" width="200" height="120" fill="#a29bfe" rx="8"/>
                    <g onclick="selectLine(false, 'rec_d', this)"><line x1="40" y1="80" x2="260" y2="220" class="touch-facilitator"/><line x1="40" y1="80" x2="260" y2="220" class="symmetry-line" id="rec_d"/></g>
                    <g onclick="selectLine(true, 'rec_h', this)"><line x1="20" y1="150" x2="280" y2="150" class="touch-facilitator"/><line x1="20" y1="150" x2="280" y2="150" class="symmetry-line" id="rec_h"/></g>
                 </svg>`,
            desc: "ಉತ್ತಮ ಜ್ಞಾನ! ಆಯತದ ಕರ್ಣವು ಅದನ್ನು ಎರಡು ಸಮಭಾಗ ಮಾಡಿದರೂ ಅದು ಸಮಮಿತಿ ರೇಖೆಯಲ್ಲ!",
            hasNoLine: false
        },
        {
            title: "ಹಂತ 4: ಸಮಬಾಹು ತ್ರಿಕೋನ (Equilateral Triangle)",
            svg: `<svg viewBox="0 0 300 300">
                    <polygon points="150,60 60,215 240,215" fill="#ff7675" />
                    <g onclick="selectLine(true, 'tri_eq_v', this)"><line x1="150" y1="20" x2="150" y2="280" class="touch-facilitator"/><line x1="150" y1="20" x2="150" y2="280" class="symmetry-line" id="tri_eq_v"/></g>
                    <g onclick="selectLine(false, 'tri_eq_h', this)"><line x1="20" y1="165" x2="280" y2="165" class="touch-facilitator"/><line x1="20" y1="165" x2="280" y2="165" class="symmetry-line" id="tri_eq_h"/></g>
                 </svg>`,
            desc: "ನಿಖರ ಉತ್ತರ! ಮೂರೂ ಬಾಹುಗಳು ಸಮನಾಗಿರುವ ಸಮಬಾಹು ತ್ರಿಕೋನಕ್ಕೆ 3 ಸಮಮಿತಿ ರೇಖೆಗಳಿರುತ್ತವೆ.",
            hasNoLine: false
        },
        {
            title: "ಹಂತ 5: ಸಮದ್ವಿಬಾಹು ತ್ರಿಕೋನ (Isosceles Triangle)",
            svg: `<svg viewBox="0 0 300 300">
                    <polygon points="150,50 80,230 220,230" fill="#fdcb6e" />
                    <g onclick="selectLine(true, 'tri_iso_v', this)"><line x1="150" y1="20" x2="150" y2="280" class="touch-facilitator"/><line x1="150" y1="20" x2="150" y2="280" class="symmetry-line" id="tri_iso_v"/></g>
                    <g onclick="selectLine(false, 'tri_iso_h', this)"><line x1="20" y1="170" x2="280" y2="170" class="touch-facilitator"/><line x1="20" y1="170" x2="280" y2="170" class="symmetry-line" id="tri_iso_h"/></g>
                 </svg>`,
            desc: "ಸರಿಯಾಗಿದೆ! ಕೇವಲ ಎರಡು ಬಾಹುಗಳು ಸಮನಾಗಿರುವ ತ್ರಿಕೋನಕ್ಕೆ ಕೇವಲ 1 (ಲಂಬ) ಸಮಮಿತಿ ರೇಖೆ ಇರುತ್ತದೆ.",
            hasNoLine: false
        },
        {
            title: "ಹಂತ 6: ವಿಷಮಬಾಹು ತ್ರಿಕೋನ (Scalene Triangle)",
            svg: `<svg viewBox="0 0 300 300">
                    <polygon points="110,60 50,220 260,180" fill="#e84393" />
                    <g onclick="selectLine(false, 'tri_sc_1', this)"><line x1="150" y1="20" x2="150" y2="280" class="touch-facilitator"/><line x1="150" y1="20" x2="150" y2="280" class="symmetry-line" id="tri_sc_1"/></g>
                    <g onclick="selectLine(false, 'tri_sc_2', this)"><line x1="20" y1="150" x2="280" y2="150" class="touch-facilitator"/><line x1="20" y1="150" x2="280" y2="150" class="symmetry-line" id="tri_sc_2"/></g>
                 </svg>`,
            desc: "ಅದ್ಭುತ ಯೋಚನೆ! ವಿಷಮಬಾಹು ತ್ರಿಕೋನದ ಎಲ್ಲಾ ಬಾಹುಗಳು ಅಸಮನಾಗಿರುವುದರಿಂದ ಇದಕ್ಕೆ ಯಾವುದೇ ಸಮಮಿತಿ ರೇಖೆ ಇರುವುದಿಲ್ಲ!",
            hasNoLine: true
        },
        {
            title: "ಹಂತ 7: ವೃತ್ತ (Circle)",
            svg: `<svg viewBox="0 0 300 300">
                    <circle cx="150" cy="150" r="80" fill="#0984e3" />
                    <g onclick="selectLine(true, 'circ_v', this)"><line x1="150" y1="20" x2="150" y2="280" class="touch-facilitator"/><line x1="150" y1="20" x2="150" y2="280" class="symmetry-line" id="circ_v"/></g>
                    <g onclick="selectLine(true, 'circ_h', this)"><line x1="20" y1="150" x2="280" y2="150" class="touch-facilitator"/><line x1="20" y1="150" x2="280" y2="150" class="symmetry-line" id="circ_h"/></g>
                 </svg>`,
            desc: "ಬಾಷ್! ವೃತ್ತದ ಕೇಂದ್ರದ ಮೂಲಕ ಹಾದುಹೋಗುವ ಯಾವುದೇ ರೇಖೆಯೂ ಸಮಮಿತಿ ರೇಖೆಯೇ ಆಗಿರುತ್ತದೆ. ವೃತ್ತಕ್ಕೆ ಅನಂತ (Infinite) ಸಮಮಿತಿ ರೇಖೆಗಳಿರುತ್ತವೆ.",
            hasNoLine: false
        },
        {
            title: "ಹಂತ 8: ಪಂಚಭುಜಾಕೃತಿ (Regular Pentagon)",
            svg: `<svg viewBox="0 0 300 300">
                    <polygon points="150,65 235,125 202,220 98,220 65,125" fill="#00b894" />
                    <g onclick="selectLine(true, 'pent_v', this)"><line x1="150" y1="20" x2="150" y2="280" class="touch-facilitator"/><line x1="150" y1="20" x2="150" y2="280" class="symmetry-line" id="pent_v"/></g>
                    <g onclick="selectLine(false, 'pent_h', this)"><line x1="20" y1="160" x2="280" y2="160" class="touch-facilitator"/><line x1="20" y1="160" x2="280" y2="160" class="symmetry-line" id="pent_h"/></g>
                 </svg>`,
            desc: "ಸೂಪರ್! ನಿಯಮಿತ ಪಂಚಭುಜಾಕೃತಿಗೆ ಒಟ್ಟು 5 ಸಮಮಿತಿ ರೇಖೆಗಳಿರುತ್ತವೆ (ಪ್ರತಿ ಶೃಂಗದಿಂದ ಎದುರಿನ ಬಾಹುವಿನ ಮಧ್ಯಬಿಂದುವಿಗೆ).",
            hasNoLine: false
        },
        {
            title: "ಹಂತ 9: ಅರ್ಧಗೋಳ / ಅರ್ಧವೃತ್ತ (Hemisphere)",
            svg: `<svg viewBox="0 0 300 300">
                    <path d="M 60,180 A 90,90 0 0,1 240,180 Z" fill="#6c5ce7" />
                    <g onclick="selectLine(true, 'hemi_v', this)"><line x1="150" y1="20" x2="150" y2="280" class="touch-facilitator"/><line x1="150" y1="20" x2="150" y2="280" class="symmetry-line" id="hemi_v"/></g>
                    <g onclick="selectLine(false, 'hemi_h', this)"><line x1="20" y1="180" x2="280" y2="180" class="touch-facilitator"/><line x1="20" y1="180" x2="280" y2="180" class="symmetry-line" id="hemi_h"/></g>
                 </svg>`,
            desc: "ಗ್ರೇಟ್! ಅರ್ಧಗೋಳ ಅಥವಾ ಅರ್ಧವೃತ್ತಾಕಾರದ ಚಿತ್ರವು ಕೇವಲ 1 ಲಂಬ ಸಮಮಿತಿ ರೇಖೆಯನ್ನು ಮಾತ್ರ ಹೊಂದಿರುತ್ತದೆ.",
            hasNoLine: false
        }
    ];

    function loadLevel() {
        levelSolved = false;
        document.getElementById('nextBtn').style.display = 'none';
        
        const lvl = gameLevels[currentLevelIndex];
        document.getElementById('levelName').innerText = lvl.title;
        document.getElementById('stage').innerHTML = lvl.svg;
        document.getElementById('feedbackMsg').innerText = "ಚಿತ್ರವನ್ನು ಗಮನಿಸಿ, ಸಮಮಿತಿ ರೇಖೆಯನ್ನು ಪತ್ತೆಹಚ್ಚಿ!";
        document.getElementById('feedbackMsg').style.color = 'var(--dark)';

        // ವಿಷಮಬಾಹು ತ್ರಿಕೋನಕ್ಕೆ ವಿಶೇಷ ಬಟನ್ ಪ್ರದರ್ಶನ
        if (lvl.hasNoLine) {
            document.getElementById('noneBtn').style.display = 'block';
        } else {
            document.getElementById('noneBtn').style.display = 'none';
        }
    }

    function selectLine(isCorrect, id, element) {
        if (levelSolved) return;

        const clickedLine = document.getElementById(id);

        if (isCorrect) {
            levelSolved = true;
            clickedLine.style.stroke = "var(--green)";
            clickedLine.style.strokeWidth = "8";
            document.getElementById('feedbackMsg').innerText = "🥳 " + gameLevels[currentLevelIndex].desc;
            document.getElementById('feedbackMsg').style.color = "var(--green)";
            score += 20;
            document.getElementById('scoreVal').innerText = score;
            playBeep('win');
            document.getElementById('nextBtn').style.display = 'block';
            document.getElementById('noneBtn').style.display = 'none';
        } else {
            clickedLine.style.stroke = "var(--red)";
            clickedLine.style.strokeWidth = "8";
            document.getElementById('feedbackMsg').innerText = "❌ ಅಯ್ಯೋ! ಅದು ತಪ್ಪು ರೇಖೆ. ಮಡಚಿದಾಗ ಎರಡು ಭಾಗಗಳು ಸಮನಾಗುವುದಿಲ್ಲ!";
            document.getElementById('feedbackMsg').style.color = "var(--red)";
            lives--;
            updateLivesUI();
            playBeep('lose');

            if (lives <= 0) {
                showEndScreen(false);
            }
        }
    }

    function selectNoLineOption() {
        if (levelSolved) return;

        const lvl = gameLevels[currentLevelIndex];
        if (lvl.hasNoLine) {
            levelSolved = true;
            document.getElementById('feedbackMsg').innerText = "🥳 " + lvl.desc;
            document.getElementById('feedbackMsg').style.color = "var(--green)";
            score += 20;
            document.getElementById('scoreVal').innerText = score;
            playBeep('win');
            document.getElementById('nextBtn').style.display = 'block';
            document.getElementById('noneBtn').style.display = 'none';
        }
    }

    function updateLivesUI() {
        let heartStr = "";
        for(let i=0; i<3; i++) {
            heartStr += (i < lives) ? "❤️ " : "🖤 ";
        }
        document.getElementById('livesBox').innerText = heartStr;
    }

    function nextLevel() {
        currentLevelIndex++;
        if (currentLevelIndex < gameLevels.length) {
            loadLevel();
        } else {
            showEndScreen(true);
        }
    }

    function showEndScreen(isWin) {
        const screen = document.getElementById('endScreen');
        screen.style.display = 'flex';
        if (isWin) {
            document.getElementById('endTitle').innerText = "🎉 ವಿಜೇತರು! ನೀವು ಜ್ಯಾಮಿತಿ ಮಾಸ್ಟರ್! 🎉";
            document.getElementById('endDesc').innerText = `ಎಲ್ಲಾ ಆಕೃತಿಗಳ ಜ್ಞಾನ ನಿಮಗಿದೆ! ಒಟ್ಟು ಗಳಿಸಿದ ಅಂಕಗಳು: ${score}`;
            playBeep('victory');
        } else {
            document.getElementById('endTitle').innerText = "ಗೇಮ್ ಓವರ್! 🛑";
            document.getElementById('endDesc').innerText = "ಬೇಸರ ಬೇಡ, ಮತ್ತೊಮ್ಮೆ ಪ್ರಯತ್ನಿಸಿ ಎಲ್ಲವನ್ನೂ ಸರಿಯಾಗಿ ಕಲಿಯಿರಿ!";
        }
    }

    function resetGame() {
        currentLevelIndex = 0;
        score = 0;
        lives = 3;
        document.getElementById('scoreVal').innerText = score;
        updateLivesUI();
        document.getElementById('endScreen').style.display = 'none';
        loadLevel();
    }

    window.onload = loadLevel;
</script>

</body>
</html>
