<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Travel Train - Tense Game</title>
    <style>
        :root {
            --bg-color: #eef2f3;
            --card-color: #ffffff;
            --past-color: #f1c40f;
            --present-color: #2ecc71;
            --future-color: #3498db;
            --text-dark: #2c3e50;
        }

        body {
            font-family: 'Comic Sans MS', cursive, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-dark);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
        }

        #game-container {
            background-color: var(--card-color);
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 12px 24px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 650px;
            text-align: center;
            border: 5px solid #9b59b6;
        }

        h1 {
            color: #9b59b6;
            margin-top: 0;
            font-size: 2.4rem;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        .instruction {
            font-size: 1.2rem;
            color: #7f8c8d;
            margin-bottom: 20px;
        }

        .status-tracker {
            display: flex;
            justify-content: space-between;
            margin-bottom: 25px;
            font-size: 1.3rem;
            background: #f8f9fa;
            padding: 12px 20px;
            border-radius: 15px;
            border: 2px solid #e2e8f0;
            font-weight: bold;
        }

        #sentence-box {
            font-size: 2rem;
            margin: 30px 0;
            padding: 25px;
            background: #fffdef;
            border-radius: 20px;
            border: 3px dashed #ffb8b8;
            line-height: 1.5;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .button-zone {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            margin-top: 25px;
        }

        @media (min-width: 480px) {
            .button-zone {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        .btn {
            color: white;
            border: none;
            padding: 18px 10px;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 18px;
            cursor: pointer;
            transition: transform 0.1s ease, box-shadow 0.1s ease;
            box-shadow: 0 6px rgba(0,0,0,0.15);
        }

        .btn-past { 
            background-color: var(--past-color); 
            border-bottom: 6px solid #d4ac0d;
            color: #2c3e50;
        }
        .btn-present { 
            background-color: var(--present-color); 
            border-bottom: 6px solid #27ae60;
        }
        .btn-future { 
            background-color: var(--future-color); 
            border-bottom: 6px solid #2980b9;
        }

        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px rgba(0,0,0,0.15);
        }

        .sub-text {
            display: block;
            font-size: 0.9rem;
            font-weight: normal;
            opacity: 0.9;
            margin-top: 4px;
        }

        #feedback-box {
            margin-top: 25px;
            font-size: 1.6rem;
            font-weight: bold;
            height: 40px;
        }

        .txt-correct { color: var(--present-color); }
        .txt-wrong { color: #e74c3c; }

        #end-screen { display: none; }

        .btn-replay {
            background-color: #9b59b6;
            border-bottom: 6px solid #8e44ad;
            color: white;
            padding: 15px 40px;
            font-size: 1.5rem;
            border-radius: 15px;
            margin-top: 25px;
            box-shadow: 0 6px rgba(0,0,0,0.15);
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- Main Game Screen -->
        <div id="play-screen">
            <h1>🚂 Time Travel Train</h1>
            <p class="instruction">Read the sentence. Choose the correct time station!</p>
            
            <div class="status-tracker">
                <div>Points: ⭐ <span id="score-element">0</span></div>
                <div>Sentence: <span id="count-element">1</span> / 10</div>
            </div>

            <div id="sentence-box">Loading sentence...</div>

            <div class="button-zone">
                <button class="btn btn-past" onclick="checkAnswer('Past')">
                    PAST TENSE
                    <span class="sub-text">(Yesterday / Before)</span>
                </button>
                <button class="btn btn-present" onclick="checkAnswer('Present')">
                    PRESENT TENSE
                    <span class="sub-text">(Today / Now)</span>
                </button>
                <button class="btn btn-future" onclick="checkAnswer('Future')">
                    FUTURE TENSE
                    <span class="sub-text">(Tomorrow / Later)</span>
                </button>
            </div>

            <div id="feedback-box"></div>
        </div>

        <!-- Score Results Screen -->
        <div id="end-screen">
            <h1>🎉 Journey Complete! 🎉</h1>
            <h2 style="font-size: 2.5rem; margin: 20px 0;">Total Stars: ⭐ <span id="final-score">0</span></h2>
            <p id="badge-text" style="font-size: 1.6rem; font-weight: bold; color: #e67e22;"></p>
            <button class="btn btn-replay" onclick="restartGame()">Play Again</button>
        </div>
    </div>

    <script>
        // Simple sentences optimized for Class 3 learners
        const questionsList = [
            { sentence: "I eat a sweet mango.", answer: "Present" },
            { sentence: "Yesterday, it rained heavily.", answer: "Past" },
            { sentence: "Tomorrow, I will go to school.", answer: "Future" },
            { sentence: "The birds fly in the sky.", answer: "Present" },
            { sentence: "We played cricket yesterday.", answer: "Past" },
            { sentence: "She will buy a new doll tomorrow.", answer: "Future" },
            { sentence: "My mother cooks tasty food.", answer: "Present" },
            { sentence: "The dog barked last night.", answer: "Past" },
            { sentence: "He will read a big book.", answer: "Future" },
            { sentence: "The baby is sleeping now.", answer: "Present" }
        ];

        let indexPointer = 0;
        let scoreStars = 0;
        let inputWait = false;

        function displayQuestion() {
            if (indexPointer < questionsList.length) {
                document.getElementById("count-element").innerText = indexPointer + 1;
                document.getElementById("score-element").innerText = scoreStars;
                document.getElementById("sentence-box").innerText = questionsList[indexPointer].sentence;
                document.getElementById("feedback-box").innerText = "";
                inputWait = false;
            } else {
                showFinalResults();
            }
        }

        function checkAnswer(userChoice) {
            if (inputWait) return;
            inputWait = true;

            const correctTense = questionsList[indexPointer].answer;
            const feedbackField = document.getElementById("feedback-box");

            if (userChoice === correctTense) {
                scoreStars += 1;
                document.getElementById("score-element").innerText = scoreStars;
                feedbackField.innerHTML = "<span class='txt-correct'>🟢 Correct! Great job! 🚂</span>";
            } else {
                feedbackField.innerHTML = `<span class='txt-wrong'>🔴 Incorrect. It is ${correctTense} Tense.</span>`;
            }

            // Short delay so child can read the outcome text safely
            setTimeout(() => {
                indexPointer++;
                displayQuestion();
            }, 2500);
        }

        function showFinalResults() {
            document.getElementById("play-screen").style.display = "none";
            document.getElementById("end-screen").style.display = "block";
            document.getElementById("final-score").innerText = scoreStars;

            let badgeMessage = "";
            if (scoreStars === 10) {
                badgeMessage = "👑 Excellent! You are a Time Master!";
            } else if (scoreStars >= 7) {
                badgeMessage = "🌟 Very Good Work! Well done!";
            } else {
                badgeMessage = "📚 Good try! Let's practice again!";
            }
            document.getElementById("badge-text").innerText = badgeMessage;
        }

        function restartGame() {
            indexPointer = 0;
            scoreStars = 0;
            document.getElementById("play-screen").style.display = "block";
            document.getElementById("end-screen").style.display = "none";
            displayQuestion();
        }

        // Initialize game mechanics on load
        displayQuestion();
    </script>
</body>
</html>
