<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ಇತಿಹಾಸದ ಆಧಾರಗಳು - ಇಂಟರಾಕ್ಟಿವ್ ಆಕ್ಟಿವಿಟಿ</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f4f8;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 5px;
        }
        p.instruction {
            color: #7f8c8d;
            font-size: 18px;
            margin-bottom: 25px;
        }
        .container {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            max-width: 1000px;
            margin: 0 auto;
        }
        .drop-zone {
            background-color: #ffffff;
            border: 3px dashed #3498db;
            border-radius: 10px;
            width: 45%;
            min-height: 250px;
            padding: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
        }
        .drop-zone h2 {
            margin-top: 0;
            padding-bottom: 10px;
            border-bottom: 2px solid #ecf0f1;
        }
        #literary-zone h2 { color: #e67e22; }
        #archaeological-zone h2 { color: #27ae60; }
        
        .drop-zone.drag-over {
            background-color: #ebf5fb;
            border-color: #2980b9;
            transform: scale(1.02);
        }
        .items-box {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
            max-width: 1000px;
            margin: 30px auto;
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .draggable {
            background-color: #34495e;
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: move;
            font-size: 16px;
            font-weight: bold;
            user-select: none;
            box-shadow: 0 3px 5px rgba(0,0,0,0.2);
            transition: opacity 0.2s;
        }
        .draggable:active {
            opacity: 0.5;
        }
        .correct {
            background-color: #2ecc71 !important;
        }
        .wrong {
            background-color: #e74c3c !important;
        }
        #result-btn {
            background-color: #2980b9;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        #result-btn:hover { background-color: #1f6391; }
        #score-text {
            font-size: 22px;
            font-weight: bold;
            margin-top: 20px;
            color: #2c3e50;
        }
    </style>
</head>
<body>

    <h1>೧ನೇ ಪಾಠ: ಇತಿಹಾಸದ ಆಧಾರಗಳು</h1>
    <p class="instruction">ಕೆಳಗಿನ ಉದಾಹರಣೆಗಳನ್ನು ಡ್ರ್ಯಾಗ್ ಮಾಡಿ ಸರಿಯಾದ ಆಧಾರದ ಪೆಟ್ಟಿಗೆಗೆ ಹಾಕಿ!</p>

    <div class="items-box" id="items-container">
        <div class="draggable" draggable="true" id="item1" data-type="literary">ತಾಳೆಗರಿಗಳು</div>
        <div class="draggable" draggable="true" id="item2" data-type="archaeological">ಹಳೆಯ ನಾಣ್ಯಗಳು</div>
        <div class="draggable" draggable="true" id="item3" data-type="literary">ಪುರಾಣಗಳು ಮತ್ತು ಕಾವ್ಯಗಳು</div>
        <div class="draggable" draggable="true" id="item4" data-type="archaeological">ಶಿಲಾಶಾಸನಗಳು</div>
        <div class="draggable" draggable="true" id="item5" data-type="literary">ವಿದೇಶಿ ಪ್ರವಾಸಿಗರ ಬರವಣಿಗೆಗಳು</div>
        <div class="draggable" draggable="true" id="item6" data-type="archaeological">ಮಡಕೆ ಚೂರುಗಳು</div>
        <div class="draggable" draggable="true" id="item7" data-type="archaeological">ಹಳೆಯ ಅರಮನೆ/ಸ್ಮಾರಕಗಳು</div>
        <div class="draggable" draggable="true" id="item8" data-type="literary">ಹಸ್ತಪ್ರತಿಗಳು (Manuscripts)</div>
    </div>

    <div class="container">
        <div class="drop-zone" id="literary-zone" data-target="literary">
            <h2>📜 ಸಾಹಿತ್ಯ ಆಧಾರಗಳು</h2>
        </div>
        <div class="drop-zone" id="archaeological-zone" data-target="archaeological">
            <h2>🏺 ಪುರಾತತ್ವ ಆಧಾರಗಳು</h2>
        </div>
    </div>

    <button id="result-btn" onclick="checkAnswers()">ಉತ್ತರ ಪರಿಶೀಲಿಸಿ (Submit)</button>
    <div id="score-text"></div>

    <script>
        const draggables = document.querySelectorAll('.draggable');
        const dropZones = document.querySelectorAll('.drop-zone');

        draggables.forEach(draggable => {
            // ಮೊಬೈಲ್ ಮತ್ತು ಸ್ಮಾರ್ಟ್ ಬೋರ್ಡ್ ಟಚ್ ಈವೆಂಟ್‌ಗಳಿಗಾಗಿ ಹಾಗೂ ಮೌಸ್‌ಗಾಗಿ
            draggable.addEventListener('dragstart', () => {
                draggable.classList.add('dragging');
            });

            draggable.addEventListener('dragend', () => {
                draggable.classList.remove('dragging');
            });
        });

        dropZones.forEach(zone => {
            zone.addEventListener('dragover', (e) => {
                e.preventDefault();
                zone.classList.add('drag-over');
            });

            zone.addEventListener('dragleave', () => {
                zone.classList.remove('drag-over');
            });

            zone.addEventListener('drop', (e) => {
                e.preventDefault();
                zone.classList.remove('drag-over');
                const draggingItem = document.querySelector('.dragging');
                if (draggingItem) {
                    zone.appendChild(draggingItem);
                }
            });
        });

        // ಉತ್ತರಗಳನ್ನು ಪರಿಶೀಲಿಸುವ ಫಂಕ್ಷನ್
        function checkAnswers() {
            let score = 0;
            let totalItems = draggables.length;

            dropZones.forEach(zone => {
                const targetType = zone.getAttribute('data-target');
                const attachedItems = zone.querySelectorAll('.draggable');
                
                attachedItems.forEach(item => {
                    const itemType = item.getAttribute('data-type');
                    if (itemType === targetType) {
                        item.classList.remove('wrong');
                        item.classList.add('correct'); // ಸರಿಯಾಗಿದ್ದರೆ ಹಸಿರು ಬಣ್ಣ
                        score++;
                    } else {
                        item.classList.remove('correct');
                        item.classList.add('wrong'); // ತಪ್ಪಾಗಿದ್ದರೆ ಕೆಂಪು ಬಣ್ಣ
                    }
                });
            });

            // ಮುಖ್ಯ ಪೆಟ್ಟಿಗೆಯಲ್ಲೇ ಉಳಿದಿರುವ ವಸ್ತುಗಳನ್ನು ತಪ್ಪೆಂದು ತೋರಿಸಲು
            const remainingItems = document.getElementById('items-container').querySelectorAll('.draggable');
            remainingItems.forEach(item => {
                item.classList.remove('correct');
                item.classList.add('wrong');
            });

            const scoreDiv = document.getElementById('score-text');
            scoreDiv.innerHTML = `ನಿಮ್ಮ ಸ್ಕೋರ್: ${score} / ${totalItems} <br> ${score === totalItems ? '🎉 ಅದ್ಭುತ! ಎಲ್ಲಾ ಉತ್ತರಗಳು ಸರಿ.' : '🤔 ಕೆಲವು ತಪ್ಪುಗಳಿವೆ, ಮತ್ತೊಮ್ಮೆ ಪ್ರಯತ್ನಿಸಿ!'}`;
        }
    </script>
</body>
</html>
