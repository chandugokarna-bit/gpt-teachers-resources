<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ದಕ್ಷಿಣ ಭಾರತದ ಚಾರಿತ್ರಿಕ ತಾಣಗಳು - 360° ವರ್ಚುವಲ್ ಪ್ರವಾಸ</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <style>
        /* UI Overlay Styles */
        .tour-overlay {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: rgba(0, 0, 0, 0.85);
            padding: 15px 25px;
            border-radius: 30px;
            font-family: 'Segoe UI', Arial, sans-serif;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            text-align: center;
            border: 2px solid #ff9900;
            width: 85%;
            max-width: 650px;
        }
        .tour-title {
            color: #fff;
            margin: 0 0 12px 0;
            font-size: 18px;
            font-weight: bold;
        }
        .btn-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .tour-btn {
            background: #ff9900;
            color: #000;
            border: none;
            padding: 8px 16px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .tour-btn:hover {
            background: #fff;
            transform: scale(1.05);
        }
        .tour-btn.active {
            background: #00ffcc;
            color: #000;
        }
        /* Educational Information Panel */
        .info-panel {
            position: absolute;
            bottom: 30px;
            left: 20px;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.85);
            color: #fff;
            padding: 15px;
            border-radius: 10px;
            font-family: sans-serif;
            max-width: 340px;
            border-left: 5px solid #00ffcc;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <div class="tour-overlay">
        <h1 class="tour-title">🏛️ ದಕ್ಷಿಣ ಭಾರತದ ಪ್ರಾಚೀನ ರಾಜವಂಶಗಳು: ಟೈಮ್ ಟ್ರಾವೆಲ್ VR</h1>
        <div class="btn-container">
            <button class="tour-btn active" onclick="switchScene('tanja', this)">ಬೃಹದೀಶ್ವರ ದೇವಾಲಯ (ಚೋಳರು)</button>
            <button class="tour-btn" onclick="switchScene('pattada', this)">ವಿರೂಪಾಕ್ಷ ದೇವಾಲಯ (ಚಾಳುಕ್ಯರು)</button>
            <button class="tour-btn" onclick="switchScene('sravana', this)">ಗೊಮ್ಮಟೇಶ್ವರ ವಿಗ್ರಹ (ಗಂಗರು)</button>
        </div>
    </div>

    <div id="infoPanel" class="info-panel">
        <h3 id="infoTitle" style="margin-top:0; color:#ff9900;">ತಂಜಾವೂರಿನ ಬೃಹದೀಶ್ವರ ದೇವಾಲಯ</h3>
        <p id="infoText" style="font-size:14px; line-height:1.4; margin-bottom:0;">ರಾಜರಾಜ ಚೋಳನ ಕೊಡುಗೆ. ಇದರ ಗೋಪುರ (ವಿಮಾನ) 61 ಮೀಟರ್ (200 ಅಡಿ) ಎತ್ತರವಿದ್ದು, ಭಾರತದಲ್ಲೇ ಅತಿ ದೊಡ್ಡ ದೇವಾಲಯವಾಗಿದೆ. ಇದು ಯುನೆಸ್ಕೋ ವಿಶ್ವಪರಂಪರೆಯ ತಾಣವಾಗಿದೆ.</p>
    </div>

    <a-scene embedded vr-mode-ui="enabled: true">
        <a-assets>
            <img id="tanjaSky" crossorigin="anonymous" src="https://chandugokarna-bit.github.io/gpt-teachers-resources/resources/image/tanja.jpeg">
            <img id="pattadaSky" crossorigin="anonymous" src="https://chandugokarna-bit.github.io/gpt-teachers-resources/resources/image/pattada.jpeg">
            <img id="sravanaSky" crossorigin="anonymous" src="https://chandugokarna-bit.github.io/gpt-teachers-resources/resources/image/shravana.jpeg">
        </a-assets>

        <a-sky id="imageDisplay" src="#tanjaSky" rotation="0 -90 0"></a-sky>

        <a-entity camera look-controls></a-entity>
    </a-scene>

    <script>
        // Textbook Data Content Mapping
        const siteData = {
            tanja: {
                title: "ತಂಜಾವೂರಿನ ಬೃಹದೀಶ್ವರ ದೇವಾಲಯ",
                text: "ರಾಜರಾಜ ಚೋಳನ ಕೊಡುಗೆ[cite: 180]. ಇದರ ಗೋಪುರ (ವಿಮಾನ) 61 ಮೀಟರ್ (200 ಅಡಿ) ಎತ್ತರವಿದ್ದು [cite: 171], ಭಾರತದಲ್ಲೇ ಅತಿ ದೊಡ್ಡ ದೇವಾಲಯವಾಗಿದೆ[cite: 172]. ಇದು ಯುನೆಸ್ಕೋ ವಿಶ್ವಪರಂಪರೆಯ ತಾಣವಾಗಿದೆ[cite: 172].",
                sky: "#tanjaSky"
            },
            pattada: {
                title: "ಪಟ್ಟದಕಲ್ಲಿನ ವಿರೂಪಾಕ್ಷ ದೇವಾಲಯ",
                text: "ಬಾದಾಮಿ ಚಾಳುಕ್ಯರ ಶ್ರೇಷ್ಠ ವಾಸ್ತುಶಿಲ್ಪ[cite: 87]. ಪಟ್ಟದಕಲ್ಲು ಯುನೆಸ್ಕೋದ ವಿಶ್ವಪರಂಪರೆ ಪಟ್ಟಿಗೆ ಸೇರಿದ ಅದ್ಭುತ ಸಾಂಸ್ಕೃತಿಕ ತಾಣವಾಗಿದೆ[cite: 87].",
                sky: "#pattadaSky"
            },
            sravana: {
                title: "ಶ್ರವಣಬೆಳಗೊಳದ ಗೊಮ್ಮಟೇಶ್ವರ",
                text: "ಗಂಗರ ಪ್ರಧಾನಿ ಚಾವುಂಡರಾಯನು ವಿಂಧ್ಯಗಿರಿ ಬೆಟ್ಟದ ಮೇಲೆ ಕೆತ್ತಿಸಿದ 17.6 ಮೀಟರ್ (58 ಅಡಿ) ಎತ್ತರದ ಏಕಶಿಲಾ ಗೊಮ್ಮಟೇಶ್ವರ ಮೂರ್ತಿ[cite: 70]. ಇದು ತ್ಯಾಗದ ಪ್ರತೀಕವಾಗಿದೆ[cite: 68].",
                sky: "#sravanaSky"
            }
        };

        function switchScene(siteKey, buttonId) {
            // Update button active states
            const buttons = document.querySelectorAll('.tour-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            buttonId.classList.add('active');

            // Change 360 view source
            const sky = document.getElementById('imageDisplay');
            sky.setAttribute('src', siteData[siteKey].sky);

            // Update educational descriptions dynamically
            const title = document.getElementById('infoTitle');
            const text = document.getElementById('infoText');

            title.innerText = siteData[siteKey].title;
            text.innerText = siteData[siteKey].text;
        }
    </script>
</body>
</html>
