<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8"><title>೩೧ ಜಿಲ್ಲೆಗಳ ಮೆಮೊರಿ ಸವಾಲು</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: white; text-align: center; padding: 20px; }
        .grid { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; max-width: 900px; margin: 20px auto; }
        .chip { background: #1e293b; border: 2px solid #38bdf8; padding: 10px 15px; border-radius: 20px; font-weight: bold; opacity: 0.3; transition: all 0.3s; }
        .active { background: #0284c7; opacity: 1; transform: scale(1.1); box-shadow: 0 0 15px #38bdf8; }
        input { font-size: 20px; padding: 10px; border-radius: 8px; border: none; width: 300px; text-align: center; }
    </style>
</head>
<body>
    <h1>🎯 ಕರ್ನಾಟಕದ ೩೧ ಜಿಲ್ಲೆಗಳ ಮೆಮೊರಿ ಸವಾಲು</h1>
    <p>ಜಿಲ್ಲೆಯ ಹೆಸರನ್ನು ಟೈಪ್ ಮಾಡಿ ಬಲೂನ್ ಪಾಪ್ ಮಾಡಿ! (ಉದಾ: ಮೈಸೂರು, ಕೋಲಾರ, ಬೀದರ್)</p>
    <input type="text" id="districtInput" oninput="checkDistrict()" placeholder="ಜಿಲ್ಲೆಯ ಹೆಸರು ಬರೆಯಿರಿ...">
    <div class="grid" id="container"></div>
    <script>
        const districts = ["ಬೆಂಗಳೂರು ನಗರ", "ಬೆಂಗಳೂರು ಗ್ರಾಮಾಂತರ", "ಕೋಲಾರ", "ಚಿಕ್ಕಬಳ್ಳಾಪುರ", "ರಾಮನಗರ", "ತುಮಕೂರು", "ಚಿತ್ರದುರ್ಗ", "ದಾವಣಗೆರೆ", "ಶಿವಮೊಗ್ಗ", "ಮೈಸೂರು", "ಮಂಡ್ಯ", "ಹಾಸನ", "ಚಿಕ್ಕಮಗಳೂರು", "ಉಡುಪಿ", "ದಕ್ಷಿಣ ಕನ್ನಡ", "ಚಾಮರಾಜನಗರ", "ಕೊಡಗು", "ಬೆಳಗಾವಿ", "ಧಾರವಾಡ", "ಗದಗ", "ಹಾವೇರಿ", "ವಿಜಯಪುರ", "ಬಾಗಲಕೋಟೆ", "ಉತ್ತರ ಕನ್ನಡ", "ಕಲಬುರಗಿ", "ಬೀದರ್", "ಬಳ್ಳಾರಿ", "ರಾಯಚೂರು", "ಕೊಪ್ಪಳ", "ಯಾದಗಿರಿ", "ವಿಜಯನಗರ"];
        const container = document.getElementById("container");
        districts.forEach(d => { container.innerHTML += `<div class="chip" id="${d}">${d}</div>`; });
        function checkDistrict() {
            let input = document.getElementById("districtInput").value.trim();
            if(districts.includes(input)) {
                let target = document.getElementById(input);
                if(!target.classList.contains("active")) {
                    target.classList.add("active");
                    document.getElementById("districtInput").value = "";
                    playAudio(800, 0.1);
                }
            }
        }
        function playAudio(f,d){const c=new (window.AudioContext||window.webkitAudioContext)();const o=c.createOscillator();o.connect(c.destination);o.frequency.value=f;o.start();o.stop(c.currentTime+d);}
    </script>
</body>
</html>
