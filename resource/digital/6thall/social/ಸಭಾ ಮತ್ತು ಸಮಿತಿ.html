<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ಸಭಾ ಮತ್ತು ಸಮಿತಿ - ಇಂಟರಾಕ್ಟಿವ್ ರೋಲ್ ಪ್ಲೇ</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f0;
            margin: 0;
            padding: 20px;
            text-align: center;
            user-select: none;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 5px;
        }
        .instruction {
            color: #7f8c8d;
            font-size: 18px;
            margin-bottom: 30px;
        }
        
        /* ಮುಖ್ಯ ಕಂಟೇನರ್ */
        .story-container {
            max-width: 750px;
            background: #ffffff;
            margin: 0 auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            border-top: 8px solid #d35400;
        }

        /* ದರ್ಬಾರ್ ಥೀಮ್ ಚಿತ್ರದ ಜಾಗ */
        .stage-banner {
            font-size: 60px;
            background-color: #fdf2e9;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 2px solid #fadbd8;
            display: inline-block;
            width: 90px;
            height: 90px;
            line-height: 90px;
        }

        /* ಪ್ರಸ್ತುತ ಸನ್ನಿವೇಶದ ವಿವರಣೆ */
        .scenario-text {
            font-size: 20px;
            font-weight: bold;
            color: #2c3e50;
            line-height: 1.6;
            margin-bottom: 30px;
            text-align: left;
            background-color: #fdfefe;
            padding: 20px;
            border-left: 5px solid #d35400;
            border-radius: 4px;
        }

        /* ಆಯ್ಕೆಗಳ ಬಟನ್‌ಗಳ ಪೆಟ್ಟಿಗೆ */
        .options-box {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* ಆಯ್ಕೆ ಬಟನ್ ಶೈಲಿ */
        .choice-btn {
            background-color: #ffffff;
            border: 2px solid #bdc3c7;
            padding: 15px 20px;
            font-size: 17px;
            font-weight: bold;
            text-align: left;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            color: #34495e;
        }
        .choice-btn:hover {
            background-color: #fdf2e9;
            border-color: #e67e22;
            transform: translateX(5px);
        }

        /* ಸರಿ ಮತ್ತು ತಪ್ಪು ಫೀಡ್‌ಬ್ಯಾಕ್ ಬಣ್ಣಗಳು */
        .correct-choice {
            background-color: #2ecc71 !important;
            border-color: #27ae60 !important;
            color: white !important;
        }
        .info-choice {
            background-color: #3498db !important;
            border-color: #2980b9 !important;
            color: white !important;
        }

        /* ಮುಂದಿನ ಹಂತಕ್ಕೆ ಹೋಗುವ ಬಟನ್ */
        .next-step-btn {
            background: linear-gradient(135deg, #e67e22, #d35400);
            color: white;
            border: none;
            padding: 12px 40px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            margin-top: 25px;
            display: none;
            box-shadow: 0 4px 12px rgba(211, 84, 0, 0.3);
        }

        #explanation-text {
            font-size: 16px;
            margin-top: 20px;
            line-height: 1.5;
            text-align: left;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <h1>೪ನೇ ಪಾಠ: "ಸಭಾ ಮತ್ತು ಸಮಿತಿ" ಡಿಜಿಟಲ್ ರೋಲ್ ಪ್ಲೇ ಆಟ</h1>
    <p class="instruction">ನೀನೇ ಈ ಕಥೆಯ 'ರಾಜನ್' (ರಾಜ)! ಬರುವ ಸನ್ನಿವೇಶಗಳನ್ನು ಓದಿ ಸೂಕ್ತ ನಿರ್ಧಾರ ತೆಗೆದುಕೊಳ್ಳಿ.</p>

    <div class="story-container">
        
        <div class="stage-banner" id="stage-icon">👑</div>

        <div class="scenario-text" id="scenario-display">
            ಲೋಡ್ ಆಗುತ್ತಿದೆ...
        </div>

        <div class="options-box" id="options-display">
            </div>

        <div id="explanation-text"></div>

        <button class="next-step-btn" id="nextBtn" onclick="nextStage()">ಮುಂದಿನ ಸನ್ನಿವೇಶಕ್ಕೆ ಹೋಗಿ ➡️</button>

    </div>

    <script>
        // ರೋಲ್ ಪ್ಲೇ ಸನ್ನಿವೇಶಗಳ ಡೇಟಾಬೇಸ್
        const storyStages = [
            {
                icon: "🏹",
                scenario: "<b>ಸನ್ನಿವೇಶ ೧ (ಪೂರ್ವ ವೇದಕಾಲ):</b> ನೀನು ಒಂದು ಬಣದ ಮುಖ್ಯಸ್ಥ (ರಾಜನ್). ನೆರೆಯ ಬಣದವರು ನಿಮ್ಮ ಹಸುಗಳನ್ನು ಕರಕೊಂಡು ಹೋಗಿದ್ದಾರೆ. ಈಗ ನೀವು ಯುದ್ಧ ಸಾರಬೇಕು. ನಿನ್ನ ಮೊದಲ ಹೆಜ್ಜೆ ಏನಾಗಿರಬೇಕು?",
                choices: [
                    { text: "ಎ) ನಾನೇ ರಾಜ, ಯಾರನ್ನೂ ಕೇಳದೆ ತಕ್ಷಣ ಸೈನ್ಯದೊಂದಿಗೆ ದಾಳಿ ಮಾಡುತ್ತೇನೆ.", correct: false, desc: "❌ <b>ತಪ್ಪು ನಿರ್ಧಾರ!</b> ಪೂರ್ವ ವೇದಕಾಲದಲ್ಲಿ ರಾಜನಿಗೆ ಸರ್ವಾಧಿಕಾರವಿರಲಿಲ್ಲ. ಅವನು ಬಣದ ಜನರ ಒಪ್ಪಿಗೆಯಿಲ್ಲದೆ ಇಂತಹ ನಿರ್ಧಾರ ತೆಗೆದುಕೊಳ್ಳಲು ಸಾಧ್ಯವಿರಲಿಲ್ಲ." },
                    { text: "ಬಿ) ನನ್ನ ಬಣದ ಹಿರಿಯರ 'ಸಭಾ' ಮತ್ತು ಪ್ರಜಾಪ್ರತಿನಿಧಿಗಳ 'ಸಮಿತಿ'ಯನ್ನು ಕರೆದು ಚರ್ಚಿಸುತ್ತೇನೆ.", correct: true, desc: "🎉 <b>ಅದ್ಭುತ ನಿರ್ಧಾರ!</b> ಪೂರ್ವ ವೇದಕಾಲದಲ್ಲಿ ಆಡಳಿತದಲ್ಲಿ ನೆರವಾಗಲು <b>'ಸಭಾ'</b> ಮತ್ತು <b>'ಸಮಿತಿ'</b> ಎಂಬ ಪ್ರಜಾಸತ್ತಾತ್ಮಕ ಸಂಸ್ಥೆಗಳಿದ್ದವು. ಅವುಗಳ ಸಲಹೆಯಂತೆ ರಾಜನು ನಡೆಯಬೇಕಾಗಿತ್ತು." }
                ]
            },
            {
                icon: "🏛️",
                scenario: "<b>ಸನ್ನಿವೇಶ ೨ (ಉತ್ತರ ವೇದಕಾಲ):</b> ಕಾಲ ಬದಲಾಗಿದೆ, ಈಗ ಉತ್ತರ ವೇದಕಾಲ ಆರಂಭವಾಗಿದೆ. ಸಾಮ್ರಾಜ್ಯ ವಿಸ್ತರಣೆಯಾಗುತ್ತಿದೆ. ನಿನ್ನ ಮಗನಿಗೆ ಮುಂದಿನ ರಾಜ ಪಟ್ಟ ಕಟ್ಟಬೇಕಿದೆ. ಈಗ ನಿನ್ನ ಅಧಿಕಾರ ಹೇಗಿದೆ?",
                choices: [
                    { text: "ಎ) ಈಗಲೂ ನಾನು ಸಭಾ-ಸಮಿತಿಯ ಅನುಮತಿ ಪಡೆದೇ ನನ್ನ ಮಗನಿಗೆ ಪಟ್ಟ ಕಟ್ಟಬೇಕು.", correct: false, desc: "❌ <b>ತಪ್ಪು ಊಹೆ!</b> ಉತ್ತರ ವೇದಕಾಲದಲ್ಲಿ ಪರಿಸ್ಥಿತಿ ಸಂಪೂರ್ಣ ಬದಲಾಯಿತು. ಪೂರ್ವ ವೇದಕಾಲದ ಪ್ರಜಾಸತ್ತಾತ್ಮಕ ಸಂಸ್ಥೆಗಳಾದ 'ಸಭಾ' ಮತ್ತು 'ಸಮಿತಿ'ಗಳು ತಮ್ಮ ಪ್ರಾಮುಖ್ಯತೆಯನ್ನು ಕಳೆದುಕೊಂಡವು." },
                    { text: "ಬಿ) ರಾಜನಾದ ನನ್ನ ಅಧಿಕಾರ ಈಗ ಬಲಿಷ್ಠವಾಗಿದೆ. ರಾಜತ್ವವು ವಂಶಪಾರಂಪರ್ಯವಾಗಿದ್ದು, ನನ್ನ ಮಗನೇ ಮುಂದಿನ ರಾಜನಾಗುತ್ತಾನೆ.", correct: true, desc: "🎉 <b>ನಿಖರವಾದ ಉತ್ತರ!</b> ಉತ್ತರ ವೇದಕಾಲದಲ್ಲಿ ರಾಜನ ಸ್ಥಾನ ಮತ್ತು ಅಧಿಕಾರ ತುಂಬಾ ಹೆಚ್ಚಾಯಿತು. ರಾಜತ್ವವು <b>'ವಂಶಪಾರಂಪರ್ಯ'</b>ವಾಯಿತು ಮತ್ತು ರಾಜನು ಬಲಿಷ್ಠನಾದನು." }
                ]
            },
            {
                icon: "🏆",
                scenario: "<b>ರೋಲ್ ಪ್ಲೇ ಮುಕ್ತಾಯ:</b> ನೀವು ಯಶಸ್ವಿಯಾಗಿ ವೇದಕಾಲದ ಆಡಳಿತ ವ್ಯವಸ್ಥೆಯನ್ನು ಅರ್ಥಮಾಡಿಕೊಂಡಿದ್ದೀರಿ!",
                choices: [] // ಮುಕ್ತಾಯದ ಹಂತ
            }
        ];

        let currentStageIndex = 0;

        // ಹಂತವನ್ನು ಲೋಡ್ ಮಾಡುವ ಫಂಕ್ಷನ್
        function loadStage() {
            const stage = storyStages[currentStageIndex];
            document.getElementById("stage-icon").innerText = stage.icon;
            document.getElementById("scenario-display").innerHTML = stage.scenario;
            document.getElementById("explanation-text").innerHTML = "";
            document.getElementById("nextBtn").style.display = "none";

            const optionsContainer = document.getElementById("options-display");
            optionsContainer.innerHTML = "";

            // ಕೊನೆಯ ಹಂತವಾಗಿದ್ದರೆ
            if (stage.choices.length === 0) {
                document.getElementById("scenario-display").style.borderLeftColor = "#2ecc71";
                document.getElementById("options-display").innerHTML = "<h3 style='color:#27ae60;'>🎉 ಅಭಿನಂದನೆಗಳು ರಾಜನ್!</h3><p style='font-size: 16px; font-weight: 500; color: #34495e;'>ಪೂರ್ವ ವೇದಕಾಲದಲ್ಲಿ ರಾಜನ ಮೇಲಿದ್ದ ಸಭಾ-ಸಮಿತಿಗಳ ನಿಯಂತ್ರಣ ಹಾಗೂ ಉತ್ತರ ವೇದಕಾಲದಲ್ಲಿ ರಾಜತ್ವ ವಂಶಪಾರಂಪರ್ಯವಾಗಿ ಬದಲಾದ ಇತಿಹಾಸದ ಸತ್ಯವನ್ನು ನೀವು ಈ ಆಟದ ಮೂಲಕ ಮನದಟ್ಟು ಮಾಡಿಕೊಂಡಿದ್ದೀರಿ.</p>";
                playToneEffect(880, 0.3);
                return;
            }

            // ಆಯ್ಕೆಗಳ ಬಟನ್ ರಚನೆ
            stage.choices.forEach(choice => {
                const button = document.createElement("button");
                button.innerHTML = choice.text;
                button.classList.add("choice-btn");
                button.onclick = () => makeDecision(button, choice);
                optionsContainer.appendChild(button);
            });
        }

        // ವಿದ್ಯಾರ್ಥಿ ನಿರ್ಧಾರ ತೆಗೆದುಕೊಂಡಾಗ (ಕ್ಲಿಕ್ ಮಾಡಿದಾಗ)
        function makeDecision(selectedBtn, choice) {
            const allButtons = document.querySelectorAll(".choice-btn");
            allButtons.forEach(btn => btn.disabled = true); // ಮತ್ತೊಮ್ಮೆ ಕ್ಲಿಕ್ ತಡೆಯಲು

            const expText = document.getElementById("explanation-text");

            if (choice.correct) {
                selectedBtn.classList.add("correct-choice");
                expText.innerHTML = choice.desc;
                expText.style.color = "#27ae60";
                playToneEffect(600, 0.15);
            } else {
                selectedBtn.classList.add("wrong-choice");
                selectedBtn.style.backgroundColor = "#e74c3c";
                selectedBtn.style.color = "white";
                selectedBtn.style.borderColor = "#c0392b";
                
                expText.innerHTML = choice.desc;
                expText.style.color = "#c0392b";
                playToneEffect(250, 0.25);
            }

            // ಮುಂದಿನ ಹಂತದ ಬಟನ್ ಪ್ರದರ್ಶಿಸು
            document.getElementById("nextBtn").style.display = "inline-block";
        }

        // ಮುಂದಿನ ಹಂತಕ್ಕೆ ಹೋಗುವುದು
        function nextStage() {
            currentStageIndex++;
            loadStage();
        }

        // ಆಫ್‌ಲೈನ್ ಆಡಿಯೋ ಸೌಂಡ್ ಕ್ರಿಯೇಟರ್
        function playToneEffect(freq, duration) {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.frequency.value = freq;
            oscillator.start();
            gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            oscillator.stop(audioCtx.currentTime + duration);
        }

        // ಆಟದ ಆರಂಭ
        loadStage();
    </script>
</body>
</html>
