<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ಬುದ್ಧನ ಮಹಾ ಪರಿತ್ಯಾಗ - ಡಿಜಿಟಲ್ ಸ್ಟೋರಿ ಟೆಲ್ಲಿಂಗ್</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #1e293b, #475569);
            --card-bg: rgba(255, 255, 255, 0.96);
            --primary-color: #d35400;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #333;
            padding: 20px;
        }

        .story-container {
            max-width: 650px;
            width: 100%;
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 20px 45px rgba(0,0,0,0.4);
            padding: 35px;
            text-align: center;
            box-sizing: border-box;
            transition: all 0.5s ease;
        }

        /* 🎨 ಇಂಟರ್ನೆಟ್ ಮುಕ್ತ ಆಕರ್ಷಕ CSS ಚಿತ್ರ ಕಂಟೇನರ್ ಫಿಕ್ಸ್ */
        .image-container-fixed {
            width: 100%;
            height: 260px;
            border-radius: 14px;
            margin-bottom: 25px;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.2);
            /* ಮೊದಲ ಪುಟಕ್ಕೆ ಇಂಟರ್ನೆಟ್ ಇಲ್ಲದಿದ್ದರೂ ಮೂಡುವ ಜ್ಞಾನೋದಯದ ಬೆಳಕಿನ ಬ್ಯಾಕ್‌ಗ್ರೌಂಡ್ */
            background: radial-gradient(circle at center, #f59e0b 10%, #d35400 40%, #2c3e50 90%);
        }

        .base-img-fixed {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 2;
        }

        /* ಚಿತ್ರ ಲೋಡ್ ಆಗದಿದ್ದರೆ ಅದರ ಹಿನ್ನೆಲೆಯಲ್ಲಿ ಮೂಡುವ ಸುಂದರ ಬೋಧಿ ವೃಕ್ಷದ ನೆರಳು (Silhouette) */
        .fallback-graphic {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 160px;
            height: 180px;
            background: #1e293b;
            clip-path: polygon(50% 0%, 20% 30%, 35% 30%, 5% 60%, 40% 60%, 15% 90%, 85% 90%, 60% 60%, 95% 60%, 65% 30%, 80% 30%);
            z-index: 1;
            opacity: 0.85;
        }

        .fallback-glow {
            position: absolute;
            top: 20%;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 80px;
            background: #fff;
            border-radius: 50%;
            filter: blur(20px);
            z-index: 1;
            animation: pulse 2s infinite ease-in-out;
        }

        @keyframes pulse {
            0% { transform: translateX(-50%) scale(1); opacity: 0.5; }
            50% { transform: translateX(-50%) scale(1.3); opacity: 0.8; }
            100% { transform: translateX(-50%) scale(1); opacity: 0.5; }
        }

        h2 {
            color: #2c3e50;
            margin-top: 0;
            font-size: 1.6rem;
            border-bottom: 2px solid #f1c40f;
            padding-bottom: 8px;
            display: inline-block;
        }

        p.story-text {
            font-size: 1.15rem;
            line-height: 1.7;
            color: #334155;
            min-height: 90px;
            margin-top: 15px;
        }

        .audio-controls {
            margin: 20px 0;
            background: #f1f5f9;
            padding: 12px;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            font-size: 0.95rem;
            font-weight: bold;
            color: #475569;
        }

        .btn-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 25px;
            flex-wrap: wrap;
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 14px 32px;
            font-size: 1.05rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(211, 84, 0, 0.3);
        }

        button:hover {
            background-color: #b33939;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(179, 57, 57, 0.4);
        }

        button.branch-btn {
            background-color: #2980b9;
            box-shadow: 0 5px 15px rgba(41, 128, 185, 0.3);
        }
        button.branch-btn:hover {
            background-color: #1f618d;
            box-shadow: 0 8px 20px rgba(31, 97, 141, 0.4);
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background-color: #e2e8f0;
            border-radius: 3px;
            margin-top: 25px;
            overflow: hidden;
        }

        .progress {
            height: 100%;
            background-color: var(--primary-color);
            width: 20%;
            transition: width 0.5s ease;
        }
    </style>
</head>
<body>

    <div class="story-container">
        <!-- ಚಿತ್ರದ ಕಂಟೇನರ್ (ಹಿನ್ನೆಲೆಯಲ್ಲಿ ಕೃತಕ ಆರ್ಟ್ ಇರುತ್ತದೆ) -->
        <div class="image-container-fixed" id="imgBox">
            <div class="fallback-glow"></div>
            <div class="fallback-graphic"></div>
            <!-- ಹೈ-ಕ್ವಾಲಿಟಿ ಇಮೇಜ್ ಲೋಡ್ ಆಗದಿದ್ದರೆ ಕೆಳಗಿನ ಕಲಾಕೃತಿ ಕಾಣಿಸುತ್ತದೆ -->
            <img id="storyImage" class="base-img-fixed" src="https://images.unsplash.com/photo-1542362567-b07eac790abc?w=600" alt="ಬುದ್ಧನ ಕಥೆ" onerror="this.style.display='none'">
        </div>
        
        <!-- ಶೀರ್ಷಿಕೆ ಮತ್ತು ಕಥೆಯ ಪಠ್ಯ -->
        <h2 id="storyTitle">ಸಿದ್ಧಾರ್ಥನ ಸುಖಜೀವನ</h2>
        <p id="storyText" class="story-text">ರಾಜಕುಮಾರ ಸಿದ್ಧಾರ್ಥನು ಕಪಿಲವಸ್ತುವಿನ ಅರಮನೆಯಲ್ಲಿ ಸಕಲ ಐಷಾರಾಮಿ ಸುಖಭೋಗಗಳ ನಡುವೆ ಜೀವಿಸುತ್ತಿದ್ದನು. ಹೊರಗಿನ ಪ್ರಪಂಚದ ದುಃಖದ ಅರಿವು ಅವನಿಗಿರಲಿಲ್ಲ. ಒಂದು ದಿನ ನಗರ ಸಂಚಾರ ಮಾಡಲು ಬಯಸಿದನು...</p>

        <!-- ಆಡಿಯೋ ಕಂಟ್ರೋಲ್ -->
        <div class="audio-controls">
            🔊 <span id="audioStatus">ಧ್ವನಿ ವಿವರಣೆ ಲೋಡ್ ಆಗುತ್ತಿದೆ...</span>
            <audio id="narrationAudio" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"></audio>
        </div>

        <!-- ಬಟನ್‌ಗಳು -->
        <div id="btnContainer" class="btn-container">
            <button onclick="nextStep(1)">ನಗರ ಸಂಚಾರಕ್ಕೆ ಹೊರಡು ➔</button>
        </div>

        <!-- ಪ್ರೋಗ್ರೆಸ್ ಬಾರ್ -->
        <div class="progress-bar">
            <div id="progressBar" class="progress"></div>
        </div>
    </div>

    <script>
        // ಕಥೆಯ ಪ್ರಮುಖ ಘಟ್ಟಗಳು ಮತ್ತು ಅದಕ್ಕೆ ತಕ್ಕ ಹಿನ್ನೆಲೆ ಬಣ್ಣದ ವಿನ್ಯಾಸಗಳು
        const storySteps = {
            0: {
                title: "ಸಿದ್ಧಾರ್ಥನ ಸುಖಜೀವನ",
                text: "ರಾಜಕುಮಾರ ಸಿದ್ಧಾರ್ಥನು ಕಪಿಲವಸ್ತುವಿನ ಅರಮನೆಯಲ್ಲಿ ಸಕಲ ಐಷಾರಾಮಿ ಸುಖಭೋಗಗಳ ನಡುವೆ ಜೀವಿಸುತ್ತಿದ್ದನು. ಹೊರಗಿನ ಪ್ರಪಂಚದ ದುಃಖದ ಅರಿವು ಅವನಿಗಿರಲಿಲ್ಲ. ಒಂದು ದಿನ ನಗರ ಸಂಚಾರ ಮಾಡಲು ಬಯಸಿದನು...",
                img: "https://images.unsplash.com/photo-1542362567-b07eac790abc?w=600",
                style: "radial-gradient(circle at center, #f59e0b 10%, #d35400 40%, #2c3e50 90%)",
                progress: "20%",
                audio: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3",
                buttons: [{ text: "ನಗರ ಸಂಚಾರಕ್ಕೆ ಹೊರಡು ➔", action: "nextStep(1)" }]
            },
            1: {
                title: "ದೃಶ್ಯ 1 ಮತ್ತು 2: ವೃದ್ಧ ಮತ್ತು ರೋಗಿ",
                text: "ನಗರ ಸಂಚಾರದಲ್ಲಿ ಸಿದ್ಧಾರ್ಥನು ಮೊದಲು ಒಬ್ಬ ನಡುಗುತ್ತಿರುವ 'ವೃದ್ಧನನ್ನು' ಕಂಡನು. ನಂತರ ತೀವ್ರ ವೇದನೆಯಿಂದ ನರಳುತ್ತಿದ್ದ 'ರೋಗಿಯನ್ನು' ನೋಡಿ ಮರುಗಿದನು. ಮನುಷ್ಯನಿಗೆ ಮುಪ್ಪು ಮತ್ತು ರೋಗ ಖಂಡಿತ ಎಂದು ತಿಳಿದು ಆತನಿಗೆ ದುಃಖವಾಯಿತು.",
                img: "https://images.unsplash.com/photo-1509099836639-18ba1795216d?w=600",
                style: "radial-gradient(circle at center, #7a7a7a 10%, #3a3a3a 50%, #1a1a1a 90%)", // ಗಾಢ ಬೂದು ಬಣ್ಣ (ದುಃಖದ ಸಂಕೇತ)
                progress: "40%",
                audio: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3",
                buttons: [{ text: "ಮುಂದೆ ಸಾಗು ➔", action: "nextStep(2)" }]
            },
            2: {
                title: "ದೃಶ್ಯ 3 ಮತ್ತು 4: ಶವ ಮತ್ತು ಸನ್ಯಾಸಿ",
                text: "ಮುಂದೆ ಸಾಗಿದ ಸಿದ್ಧಾರ್ಥನು ಬಂಧುಗಳು ಅಳುತ್ತಾ ಹೊತ್ತೊಯ್ಯುತ್ತಿದ್ದ 'ಶವವನ್ನು' ಕಂಡು ಮರಣದ ಸತ್ಯವನ್ನು ಅರಿತನು. ಕೊನೆಯದಾಗಿ, ಪ್ರಶಾಂತ ಮುಖಭಾವದ ಒಬ್ಬ 'ಸನ್ಯಾಸಿಯನ್ನು' ಕಂಡು, ಸಂಸಾರದ ದುಃಖದಿಂದ ಮುಕ್ತಿ ಪಡೆಯಲು ಸನ್ಯಾಸತ್ವವೇ ದಾರಿ ಎಂದು ಯೋಚಿಸಿದನು.",
                img: "https://images.unsplash.com/photo-1590050752117-238cb0fb12b1?w=600",
                style: "radial-gradient(circle at center, #8e44ad 10%, #2c3e50 60%, #1a252f 90%)",
                progress: "60%",
                audio: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3",
                buttons: [{ text: "ಈಗ ಸಿದ್ಧಾರ್ಥನು ಏನು ಮಾಡಬೇಕು? (ಆಯ್ಕೆ ಮಾಡಿ)", action: "showChoices()" }]
            },
            'choice_wrong': {
                title: "ಅರಮನೆಗೆ ಮರಳುವುದು",
                text: "ಸಿದ್ಧಾರ್ಥನು ಮತ್ತೆ ಅರಮನೆಗೆ ಮರಳಿ ರಾಜಭೋಗದಲ್ಲಿ ಮುಳುಗಿದನು. ಆದರೆ ಆತನ ಮನಸ್ಸಿಗೆ ಶಾಂತಿ ಸಿಗಲಿಲ್ಲ. ದುಃಖದ ಪ್ರಶ್ನೆಗಳಿಗೆ ಉತ್ತರ ಸಿಗಲೇ ಇಲ್ಲ! (ಮತ್ತೆ ಪ್ರಯತ್ನಿಸಿ)",
                img: "https://images.unsplash.com/photo-1599940824399-b87987ceb72a?w=600",
                style: "radial-gradient(circle at center, #c0392b 10%, #7f8c8d 60%, #2c3e50 90%)",
                progress: "80%",
                audio: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3",
                buttons: [{ text: "↩ ಮೊದಲಿನಿಂದ ಪ್ರಯತ್ನಿಸಿ", action: "nextStep(0)" }]
            },
            'choice_right': {
                title: "ಮಹಾ ಪರಿನಿಷ್ಕ್ರಮಣ (ಜ್ಞಾನದ ಹುಡುಕಾಟ)",
                text: "ಸರಿಯಾದ ನಿರ್ಧಾರ! ಸಿದ್ಧಾರ್ಥನು ತನ್ನ ಹೆಂಡತಿ ಮತ್ತು ಮಗನನ್ನು ನಿದ್ರೆಯಲ್ಲಿ ಬಿಟ್ಟು, ಮಧ್ಯರಾತ್ರಿ ಅರಮನೆಯನ್ನು ತ್ಯಜಿಸಿ ಸತ್ಯ ಮತ್ತು ಜ್ಞಾನದ ಹುಡುಕಾಟಕ್ಕಾಗಿ ಕಾಡಿಗೆ ಹೊರಟನು. ಮುಂದೆ ಆತನೇ ಗೌತಮ ಬುದ್ಧನಾದನು.",
                img: "https://images.unsplash.com/photo-1612438214708-f428a707dd4e?w=600",
                style: "radial-gradient(circle at center, #10b981 20%, #047857 60%, #0f172a 90%)", // ಹಸಿರು ಶಾಂತತೆಯ ಸಂಕೇತ
                progress: "100%",
                audio: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-5.mp3",
                buttons: [{ text: "🎉 ಕಥೆ ಮುಕ್ತಾಯ - ಮರುಪ್ಲೇ ಮಾಡಿ", action: "nextStep(0)" }]
            }
        };

        const audioPlayer = document.getElementById('narrationAudio');

        function nextStep(stepKey) {
            const step = storySteps[stepKey];
            
            document.getElementById('storyTitle').innerText = step.title;
            document.getElementById('storyText').innerText = step.text;
            
            // ಇಮೇಜ್ ಲೋಡ್ ಲಾಜಿಕ್ ಫಿಕ್ಸ್
            const imgElement = document.getElementById('storyImage');
            imgElement.style.display = 'block'; // ಮೊದಲು ಬ್ಲಾಕ್ ಮಾಡಿ ಲೋಡ್ ಟ್ರೈ ಮಾಡಲು
            imgElement.src = step.img;
            
            // ಕಂಟೇನರ್ ಹಿನ್ನೆಲೆ ಬಣ್ಣ ಬದಲಾವಣೆ
            document.getElementById('imgBox').style.background = step.style;
            document.getElementById('progressBar').style.width = step.progress;

            const btnContainer = document.getElementById('btnContainer');
            btnContainer.innerHTML = '';
            step.buttons.forEach(btn => {
                btnContainer.innerHTML += `<button onclick="${btn.action}">${btn.text}</button>`;
            });

            audioPlayer.src = step.audio;
            audioPlayer.play().catch(() => {
                document.getElementById('audioStatus').innerText = "ಕೇಳಲು ಕ್ಲಿಕ್ ಮಾಡಿ";
            });
            document.getElementById('audioStatus').innerText = "ಧ್ವನಿ ವಿವರಣೆ ಪ್ಲೇ ಆಗುತ್ತಿದೆ...";
        }

        function showChoices() {
            const btnContainer = document.getElementById('btnContainer');
            btnContainer.innerHTML = `
                <button class="branch-btn" onclick="nextStep('choice_wrong')">ಅರಮನೆಗೆ ಮರಳಿ ರಾಜನಾಗಬೇಕು</button>
                <button class="branch-btn" onclick="nextStep('choice_right')">ರಾಜ್ಯ ತ್ಯಜಿಸಿ ಸನ್ಯಾಸಿಯಾಗಬೇಕು</button>
            `;
            document.getElementById('storyText').innerText = "ನಾಲ್ಕು ದೃಶ್ಯಗಳನ್ನು ನೋಡಿದ ನಂತರ ಸಿದ್ಧಾರ್ಥನ ಮನಸ್ಸಿನಲ್ಲಿ ವೈರಾಗ್ಯ ಮೂಡಿತು. ಈಗ ಸಿದ್ಧಾರ್ಥನು ಯಾವ ಹಾದಿಯನ್ನು ಆರಿಸಿಕೊಳ್ಳಬೇಕು? ಕೆಳಗಿನ ಆಯ್ಕೆಗಳ ಮೇಲೆ ಕ್ಲಿಕ್ ಮಾಡಿ ಕಥೆಯನ್ನು ಮುಂದುವರಿಸಿ:";
        }
    </script>
</body>
</html>
