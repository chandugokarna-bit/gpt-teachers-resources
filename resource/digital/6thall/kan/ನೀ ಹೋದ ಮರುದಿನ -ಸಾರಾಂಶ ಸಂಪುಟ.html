<html lang="kn">

    <title>ನೀ ಹೋದ ಮರುದಿನ - ಪ್ಯಾರಾವಾರು ಸಾರಾಂಶ ಸಂಪುಟ (ನಿಖರ ಆವೃತ್ತಿ)</title>
    <style>
        :root {
            --bg-space: #070913;
            --neon-blue: #00d2d3;
            --neon-purple: #a29bfe;

            --danger-red: #ff4d4d;
            --card-dark: #12162e;
            --text-light: #f1f2f6;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-space);
            color: var(--text-light);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .activity-container {

            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 20px 50px rgba(162, 155, 254, 0.15);
            max-width: 850px;
            width: 100%;
            text-align: center;
            border: 1px solid rgba(162, 155, 254, 0.2);
        }

        h2 {
            color: var(--neon-blue);
            margin-bottom: 5px;
            text-shadow: 0 0 15px rgba(0, 210, 211, 0.4);
            font-size: 26px;
        }

        .instruction {
            color: #a4b0be;
            font-size: 16px;
            margin-bottom: 30px;
        }

        /* ೫ ಪ್ಯಾರಾಗಳ ಟ್ಯಾಬ್ ಬಟನ್‌ಗಳ ಶೈಲಿ */
        .stanza-tabs {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 30px;
        }

        .tab-btn {
            background-color: #1e272e;
            border: 2px solid #57606f;
            color: #cbd5e1;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .tab-btn:hover {
            border-color: var(--neon-blue);
            color: #ffffff;
            transform: translateY(-2px);
        }

        .tab-btn.active-tab {
            background: linear-gradient(135deg, var(--neon-blue), #01a3a4);
            border-color: #fffeee;
            color: #ffffff;
            box-shadow: 0 0 20px rgba(0, 210, 211, 0.4);
            transform: scale(1.05);
        }

        /* ಪ್ರದರ್ಶನ ವಲಯ (Split Screen ಲುಕ್) */
        .display-zone {
            display: flex;
            gap: 25px;
            margin-top: 20px;
        }

        .panel {
            flex: 1;
            background: var(--card-dark);
            border-radius: 20px;
            padding: 25px;
            border: 2px solid #1e2548;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            text-align: left;
            transition: all 0.4s ease;
            min-height: 240px;
        }

        .panel-title {
            font-size: 15px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
            padding-bottom: 8px;
            border-bottom: 1px solid #1e2548;
        }

        .left-title { color: var(--neon-gold); }
        .right-title { color: var(--neon-purple); }

        /* ಕಾವ್ಯದ ಸಾಲುಗಳ ಶೈಲಿ */
        .poem-lines-box {
            font-size: 19px;
            font-weight: bold;
            line-height: 1.7;
            color: #f1f5f9;
            white-space: pre-line;
            animation: fadeIn 0.5s ease-in-out;
        }

        /* ಸಾರಾಂಶದ ಸಾಲುಗಳ ಶೈಲಿ */
        .summary-box {
            font-size: 16px;
            line-height: 1.7;
            color: #cbd5e1;
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 700px) {
            .display-zone { flex-direction: column; }
            .stanza-tabs { flex-direction: column; }
            .tab-btn { width: 100%; }
        }
    </style>
</head>

        5: {
            poem: "ಕೌಶಲ : ಬರೆಯುವುದು.\nಸಾಮರ್ಥ್ಯ: ಆಲಿಸಿದ ಮತ್ತು ಓದಿದ ವಿಷಯಗಳನ್ನು ಸೂಕ್ತ ಲೇಖನ ಚಿಹ್ನೆಗಳನ್ನು ಬಳಸಿ ಅರ್ಥಪೂರ್ಣ ವಾಕ್ಯಗಳಲ್ಲಿ ಬರೆಯುವುದು.\n\nಕವಿ ಕೃತಿ ಪರಿಚಯ:\nಡಾ. ಚೆನ್ನಣ್ಣ ವಾಲೀಕಾರರವರು ೧೯೪೩ ಏಪ್ರಿಲ್ ೬ ರಂದು ಕಲ್ಬುರ್ಗಿ ಜಿಲ್ಲೆಯ ಚಿತ್ತಾಪುರ ತಾಲ್ಲೂಕಿನ ಶಂಕರವಾಡಿಯಲ್ಲಿ ಜನಿಸಿದರು. ತಂದೆ: ಧೂಳಪ್ಪ ವಾಲೀಕಾರ, ತಾಯಿ: ಸಾಬಮ್ಮ. ಕರ್ನಾಟಕ ವಿಶ್ವವಿದ್ಯಾಲಯದಲ್ಲಿ ಎಂ.ಎ., ಪಿಹೆಚ್.ಡಿ ಪಡೆದ ಇವರು ಗುಲ್ಬರ್ಗ ವಿಶ್ವವಿದ್ಯಾಲಯದಲ್ಲಿ ಪ್ರಾಧ್ಯಾಪಕರಾಗಿ ಕಾರ್ಯನಿರ್ವಹಿಸಿ ನಿವೃತ್ತರಾಗಿದ್ದಾರೆ.",
            summary: "• <b>ಕಲಿಕಾ ಕೌಶಲ:</b> ಸೂಕ್ತ ಲೇಖನ ಚಿಹ್ನೆಗಳನ್ನು ಬಳಸಿ ಅರ್ಥಪೂರ್ಣ ವಾಕ್ಯಗಳಲ್ಲಿ ಬರೆಯುವ ಸಾಮರ್ಥ್ಯ ಬೆಳೆಸುವುದು.<br>• <b>ಕವಿ ಪರಿಚಯ:</b> ಈ ಪ್ರಖರ ವಿಚಾರಧಾರೆಯ ಬಂಡಾಯ ಕವಿತೆಯನ್ನು ಡಾ. ಚೆನ್ನಣ್ಣ ವಾಲೀಕಾರ ಅವರು ರಚಿಸಿದ್ದಾರೆ .<br>• <b>ಜನನ ಮತ್ತು ಹಿನ್ನೆಲೆ:</b> ಕವಿಯವರು ೧೯೪೩ ಏಪ್ರಿಲ್ ೬ ರಂದು ಕಲ್ಬುರ್ಗಿ ಜಿಲ್ಲೆಯ ಶಂಕರವಾಡಿಯಲ್ಲಿ ಜನಿಸಿದರು.<br>• <b>ಶೈಕ್ಷಣಿಕ ಸೇವೆ:</b> ಎಂ.ಎ. ಮತ್ತು ಪಿಹೆಚ್.ಡಿ ಪದವಿ ಪಡೆದು ಗುಲ್ಬರ್ಗ ವಿಶ್ವವಿದ್ಯಾಲಯದಲ್ಲಿ ಪ್ರಾಧ್ಯಾಪಕರಾಗಿದ್ದರು .<br>• <b>ಸಾಹಿತ್ಯದ ಕೊಡುಗೆ:</b> ದಲಿತ-ಬಂಡಾಯ ಚಳುವಳಿಯ ಹಿನ್ನೆಲೆಯಲ್ಲಿ ಅನೇಕ ಮಹತ್ವದ ಕಾವ್ಯ ಹಾಗೂ ಕೃತಿಗಳನ್ನು ನೀಡಿದ್ದಾರೆ."
        }
    };

    const poemTextTarget = document.getElementById('poemTextTarget');
    const summaryTextTarget = document.getElementById('summaryTextTarget');

    function playFlipSound() {
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(420, audioCtx.currentTime);
            oscillator.frequency.exponentialRampToValueAtTime(840, audioCtx.currentTime + 0.15);
            gainNode.gain.setValueAtTime(0.08, audioCtx.currentTime);
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.15);
        } catch (e) {}
    }

    function showStanza(stanzaNumber) {
        const allButtons = document.querySelectorAll('.tab-btn');
        allButtons.forEach(btn => btn.classList.remove('active-tab'));

        document.getElementById(`btn_${stanzaNumber}`).classList.add('active-tab');

        const currentData = stanzaDatabase[stanzaNumber];
        
        poemTextTarget.innerHTML = currentData.poem;
        summaryTextTarget.innerHTML = currentData.summary;

        playFlipSound();
    }

    // ಮೊದಲ ಪುಟ ಆಟೋಮ್ಯಾಟಿಕ್ ಆಗಿ ಲೋಡ್ ಆಗುತ್ತದೆ
    showStanza(1);
</script>
