            margin-bottom: 30px;
            padding: 10px 5px;
            border-bottom: 1px solid #1e2554;

        .stanza-tabs::-webkit-scrollbar {

            margin-top: 20px;

            border-radius: 20px;
            padding: 25px;
            border: 2px solid #1e2554;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            text-align: left;
            transition: all 0.4s ease;
            min-height: 25px;
        }

            font-size: 15px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
            padding-bottom: 8px;
            border-bottom: 1px solid #1e2554;

</head>

    <h2>೨. ಮಂಗಳ ಗ್ರಹದಲ್ಲಿ ಪುಟ್ಟಿ: ಕಾವ್ಯ ಸಾರಾಂಶ ಸಂಪುಟ 🪐📖</h2>

    const stanzaDatabase = {
        1: {

            summary: "• ಪುಟಾಣಿ ಬಾಲಕಿಯಾದ ಪುಟ್ಟಿಗೆ ಆಕಾಶದ ಎತ್ತರದಲ್ಲಿ ಹಾರಾಡುವುದೆಂದರೆ ಅಪಾರವಾದ ಇಷ್ಟ .<br>• ಆದರೆ ಹಕ್ಕಿಗಳ ತರಹ ಹಾರಲು ಮನುಷ್ಯನಿಗೆ ನೈಸರ್ಗಿಕವಾದ ರೆಕ್ಕೆಗಳಿರುವುದಿಲ್ಲ .<br>• ರೆಕ್ಕೆಗಳಿಲ್ಲದೆ ಹಾರಲು ಪ್ರಯತ್ನಿಸುವುದು ಅಪಾಯಕಾರಿ ಹಾಗೂ ಕಷ್ಟದ ಕೆಲಸವಾಗಿದೆ .<br>• ಈ ಸಾಲುಗಳು ಮಗುವಿನ ಮನಸ್ಸಿನಲ್ಲಿ ಮೂಡುವ ನೈಸರ್ಗಿಕ ಕಲ್ಪನೆ ಮತ್ತು ಹಂಬಲವನ್ನು ತೋರ್ಪಡಿಸುತ್ತವೆ .<br>• ಇದು ಪದ್ಯದ ಆರಂಭವಾಗಿದ್ದು ಮಕ್ಕಳಲ್ಲಿ ಬಾಹ್ಯಾಕಾಶದ ಬಗ್ಗೆ ಕುತೂಹಲ ಮೂಡಿಸುತ್ತದೆ."

            summary: "• ಪುಟ್ಟಿ ಕೇವಲ ಚಂದ್ರನಿಗೆ ನಿಲ್ಲದೆ ಅಲ್ಲಿಂದಲೂ ಇನ್ನು ಎತ್ತರಕ್ಕೆ ಜಿಗಿಯುತ್ತಾಳೆ .<br>• ಈ ಬಾರಿ ಅವಳು ಸೌರಮಂಡಲದ ರಹಸ್ಯ ಗ್ರಹವಾದ ಮಂಗಳ ಗ್ರಹದ ಅಂಗಳವನ್ನು ತಲುಪುತ್ತಾಳೆ .<br>• ಆದರೆ ಮಂಗಳ ಗ್ರಹದ ಪರಿಸರವು ಸಂಪೂರ್ಣವಾಗಿ ಕೆಂಪು ಬಣ್ಣದಿಂದ ಖಾಲಿಯಾಗಿ (ಬಣಬಣಗುಟ್ಟುತ್ತಾ) ಇರುತ್ತದೆ.<br>• ಅಲ್ಲಿ ಭೂಮಿಯಂತೆ ಯಾವುದೇ ಪ್ರಾಣಿ, ಪಕ್ಷಿ ಅಥವಾ ಮನುಷ್ಯರ ಜೀವ ಸಂಕುಲ ಇರುವುದಿಲ್ಲ .<br>• ಮಂಗಳ ಗ್ರಹದ ನೀರವತೆ ಮತ್ತು ಜೀವ ರಹಿತ ವಾತಾವರಣವನ್ನು ಮಗು ಇಲ್ಲಿ ಕಂಡುಕೊಳ್ಳುತ್ತದೆ."

            summary: "• ಮಂಗಳ ಗ್ರಹದ ಆ ವಿಶಾಲ ಬಯಲಿನಲ್ಲಿ ಪುಟ್ಟಿಗೆ ಒಂದು ದೊಡ್ಡ ಹೆಬ್ಬಂಡೆ ಕಾಣಿಸುತ್ತದೆ .<br>• ಆ ವಿಶಿಷ್ಟವಾದ ಕಲ್ಲಿಗೆ ವಿಜ್ಞಾನಿಗಳು 'ಯೋಗಿ' ಎಂದು ಹೆಸರಿಟ್ಟಿರುತ್ತಾರೆ .<br>• ಆ ಕೆಂಪು ಬಂಡೆಯ ಬಳಿಗೆ ಹೋಗಿ ಪುಟ್ಟಿ ಪ್ರೀತಿಯಿಂದ ಸಂಭಾಷಣೆ ನಡೆಸುತ್ತಾಳೆ.<br>• 'ನೀನು ಹೇಗೆ ಈ ಪಾಳು ಗ್ರಹಕ್ಕೆ ಬಂದು ತಲುಪಿದೆ?' ಎಂದು ಬಂಡೆಯನ್ನು ಪ್ರಶ್ನಿಸುತ್ತಾಳೆ .<br>• ನಿರ್ಜೀವ ವಸ್ತುವಿನೊಂದಿಗೂ ಮಗು ಮನಬಿಚ್ಚಿ ಮಾತನಾಡುವ ಮುಗ್ಧತೆಯನ್ನು ಕವಿ ವರ್ಣಿಸಿದ್ದಾರೆ[cite: 1075]."
        },
        7: {
            poem: "ಬಂಡೆಯು ಕಣ್ಣೀರನು ಸುರಿಸುತ್ತಾ\nಹೇಳಿತು ಪುಟ್ಟಿಗೆ ನೋವಿನಲಿ\n'ಪುಟ್ಟಿಯೇ, ನಮ್ಮಿ ಮಂಗಳ ಗ್ರಹದ\nದುರಂತ ಕಥೆಯನು ಕೇಳಿ ತಿಳಿ",
            summary: "• ಪುಟ್ಟಿಯ ಪ್ರಶ್ನೆಯನ್ನು ಕೇಳಿದ ಆ 'ಯೋಗಿ' ಬಂಡೆಯು ತೀವ್ರ ನೋವಿನಿಂದ ಕಣ್ಣೀರಿಡುತ್ತದೆ .<br>• ತನ್ನ ಎದೆಯಾಳದಲ್ಲಿ ಅಡಗಿರುವ ಮಂಗಳ ಗ್ರಹದ ಕಟು ಇತಿಹಾಸವನ್ನು ಹೇಳಲು ಆರಂಭಿಸುತ್ತದೆ .<br>• 'ಪುಟ್ಟಿಯೇ, ನಮ್ಮ ಗ್ರಹವು ಇಂತಹ ಪಾಳು ಸ್ಥಿತಿಗೆ ತಲುಪಿದ ದುರಂತ ಕಥೆಯನ್ನು ಕೇಳು' ಎನ್ನುತ್ತದೆ .<br>• ಇದು ಕಾವ್ಯದಲ್ಲಿ ಪರಿಸರ ಪ್ರಜ್ಞೆಯನ್ನು ಜಾಗೃತಗೊಳಿಸುವ ಅತ್ಯಂತ ಮುಖ್ಯವಾದ ತಿರುವು ಆಗಿರುತ್ತದೆ .<br>• ಬಂಡೆಯ ನೋವಿನ ಮೂಲಕ ಪ್ರಕೃತಿಯ ನಾಶದ ಭೀಕರತೆಯನ್ನು ಮಕ್ಕಳಿಗೆ ಮನದಟ್ಟು ಮಾಡಲಾಗುತ್ತದೆ."
        },
        8: {
            poem: "ಹಿಂದೊಂದು ಕಾಲದಿ ಈ ಗ್ರಹದಲ್ಲಿ\nಇತ್ತು ಜೀವಜಲ ಹಸಿರು ಮರ\nಆಗಿನ ಜನತೆಯು ನಾಡನು ಕಟ್ಟಲು\nಮರಗಳ ಕಡಿಯೆ ಬಂತು ಬರ\nಮಳೆ ಬೆಳೆ ಕಾಣದೆ ಜೀವಿಯು ಅಳಿದು\nಬಂದಿತು ನಮಗೆ ಇಂಥ ಸ್ಥಿತಿ\n“ನಿಮ್ಮ ಭೂಮಿಯಲಿ ಗಿಡಮರ ಅಳಿದರೆ\nಮುಂದೆ ಒಂದು ದಿನ ಇದೇ ಗತಿ'",
            summary: "• ಹಿಂದೊಂದು ಕಾಲದಲ್ಲಿ ಮಂಗಳ ಗ್ರಹದಲ್ಲೂ ಸಮೃದ್ಧವಾದ ನೀರು ಮತ್ತು ಹಸಿರು ಮರಗಳಿದ್ದವು .<br>• ಆದರೆ ಅಲ್ಲಿದ್ದ ಜನರು ನಗರಗಳನ್ನು (ನಾಡು) ಕಟ್ಟಲು ಮರಗಳನ್ನು ಮನಬಂದಂತೆ ಕತ್ತರಿಸಿದರು .<br>• ಇದರಿಂದಾಗಿ ಗ್ರಹದಲ್ಲಿ ಭೀಕರ ಬರಗಾಲ ಬಂದು, ಮಳೆ-ಬೆಳೆಯಿಲ್ಲದೆ ಎಲ್ಲಾ ಜೀವಿಗಳು ನಾಶವಾದವು .<br>• 'ಭೂಮಿಯ ಮೇಲೂ ಮರಗಳನ್ನು ನಾಶ ಮಾಡಿದರೆ ನಿಮಗೂ ಇದೇ ಗತಿ ಬರುತ್ತದೆ' ಎಂದು ಬಂಡೆ ಎಚ್ಚರಿಸುತ್ತದೆ .<br>• ಮಾನವನ ಸ್ವಾರ್ಥದಿಂದ ಪರಿಸರ ನಾಶವಾದರೆ ಇಡೀ ಜಗತ್ತೇ ಅಳಿಯುತ್ತದೆ ಎಂಬ ಸಂದೇಶ ಇಲ್ಲಿದೆ."
        },
        9: {
            poem: "ಬಣಬಣಗುಟ್ಟುವ ಬಯಲನು ಕಂಡು\nಢವಢವಗುಟ್ಟಿತು ಎಳೆ ಹೃದಯ\nಹಸಿರನು ಅಳಿಸದೆ ಗಿಡಮರ ಬೆಳೆಸಿ\nಉಳಿಸುವೆವೆಂದಳು ಈ ಧರೆಯ\nಭೂಮಿಗೆ ಬಂದು ಜನತೆಯ ಕಂಡು\nಹಸಿರನು ಉಳಿಸಲು ಬೇಡಿದಳು\nತಾನು ಕೂಡ ಎಳೆ ಸಸಿಗಳ ನೆಟ್ಟು\nಬೆಳೆಸುತ ಕುಣಿ ಕುಣಿದಾಡಿದಳು.",
            summary: "• ಮಂಗಳದ ಒಣ ಬಯಲನ್ನು ಕಂಡು ಪುಟ್ಟಿಯ ಎಳೆ ಹೃದಯವು ಭಯದಿಂದ ಢವಢವಗುಟ್ಟುತ್ತದೆ .<br>• ತನ್ನ ಭೂಮಿಯನ್ನು ಇಂತಹ ಭೀಕರ ಸ್ಥಿತಿಯಿಂದ ರಕ್ಷಿಸಲೇಬೇಕೆಂದು ಅವಳು ದೃಢ ಸಂಕಲ್ಪ ಮಾಡುತ್ತಾಳೆ .<br>• ತಕ್ಷಣವೇ ಭೂಮಿಗೆ ಮರಳಿ ಬಂದು, ಹಸಿರನ್ನು ಉಳಿಸುವಂತೆ ಎಲ್ಲಾ ಜನರಲ್ಲಿ ಕೈಮುಗಿದು ಬೇಡುತ್ತಾಳೆ .<br>• ತಾನು ಸಹ ಸ್ವಯಂಪ್ರೇರಿತಳಾಗಿ ಸಾಲು ಸಾಲು ಎಳೆ ಸಸಿಗಳನ್ನು ಮಣ್ಣಿನಲ್ಲಿ ನೆಟ್ಟು ಪೋಷಿಸುತ್ತಾಳೆ .<br>• ಪರಿಸರ ಸಂರಕ್ಷಣೆ ಮತ್ತು ಗಿಡಗಳನ್ನು ಬೆಳೆಸುವ ಪವಿತ್ರ ಕರ್ತವ್ಯದೊಂದಿಗೆ ಪದ್ಯವು ಮುಕ್ತಾಯವಾಗುತ್ತದೆ."
        }
    };

    const poemTextTarget = document.getElementById('poemTextTarget');
    const summaryTextTarget = document.getElementById('summaryTextTarget');

    // ಅತ್ಯಾಧುನಿಕ ಸ್ಪೇಸ್ ಆಡಿಯೋ ಫ್ರೀಕ್ವೆನ್ಸಿ ಎಫೆಕ್ಟ್
    function playSpaceBeep() {
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.type = 'sine';
            
            // ಬಾಹ್ಯಾಕಾಶ ಕೇಂದ್ರದ ತರಹದ ಶ್ರುತಿ
            oscillator.frequency.setValueAtTime(580, audioCtx.currentTime);
            oscillator.frequency.exponentialRampToValueAtTime(1150, audioCtx.currentTime + 0.15);
            gainNode.gain.setValueAtTime(0.06, audioCtx.currentTime);
            
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.15);
        } catch (e) {}
    }

    function showStanza(stanzaNumber) {
        // ಎಲ್ಲಾ ಬಟನ್‌ಗಳಿಂದ ಸಕ್ರಿಯ ಶೈಲಿ ತೆಗೆಯುವುದು
        const allButtons = document.querySelectorAll('.tab-btn');
        allButtons.forEach(btn => btn.classList.remove('active-tab'));

        // ಕ್ಲಿಕ್ ಮಾಡಿದ ಬಟನ್ ಗೆ ಸಕ್ರಿಯ ಶೈಲಿ ನೀಡುವುದು
        document.getElementById(`btn_${stanzaNumber}`).classList.add('active-tab');

        // ಪ್ರದರ್ಶನ ವಲಯದ ಡೇಟಾವನ್ನು ಬದಲಾಯಿಸುವುದು
        const currentData = stanzaDatabase[stanzaNumber];
        
        poemTextTarget.innerHTML = currentData.poem;
        summaryTextTarget.innerHTML = currentData.summary;

        // ಸೌಂಡ್ ಎಫೆಕ್ಟ್
        playSpaceBeep();
    }

    // ವೆಬ್‌ಸೈಟ್ ಲೋಡ್ ಆದ ತಕ್ಷಣ ಮೊದಲನೇ ಪ್ಯಾರಾ ಆಟೋಮ್ಯಾಟಿಕ್ ಆಗಿ ಕಾಣಿಸುತ್ತದೆ
    showStanza(1);
</script>
