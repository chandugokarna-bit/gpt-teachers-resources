<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ಕೃಷ್ಣ - ಸುಧಾಮ: ದ್ವಾರಕೆಯ ಮಹಾ ಮಿಷನ್</title>
    <style>
        :root {
            --bg-space: #070919;
            --neon-blue: #00d2d3;
            --neon-purple: #9b59b6;
            --neon-gold: #ffd32a;
            --neon-green: #1dd1a1;
            --danger-red: #ff4d4d;
            --card-bg: #14172e;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-space);
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            user-select: none;
        }

        .activity-container {
            background: linear-gradient(145deg, #0f1229, #191d3a);
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 15px 40px rgba(0, 210, 211, 0.15);
            max-width: 780px;
            width: 100%;
            text-align: center;
            border: 1px solid rgba(0, 210, 211, 0.2);
        }

        h2 {
            color: var(--neon-blue);
            margin-bottom: 5px;
            text-shadow: 0 0 10px rgba(0, 210, 211, 0.3);
            font-size: 26px;
        }

        .instruction {
            color: #a0a5c0;
            font-size: 15px;
            margin-bottom: 25px;
        }

        /* ರಥ ಚಲಿಸುವ ಲೈವ್ ಪ್ರೋಗ್ರೆಸ್ ಬಾರ್ */
        .chariot-progress-zone {
            background: #0b0d1f;
            border: 1px solid #23274c;
            border-radius: 15px;
            padding: 18px;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
        }

        .progress-line {
            flex: 1;
            background: #2c3159;
            height: 8px;
            border-radius: 5px;
            margin: 0 15px;
            position: relative;
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, var(--neon-purple), var(--neon-blue));
            border-radius: 5px;
            transition: width 0.6s ease;
        }

        .chariot-icon {
            font-size: 32px;
            transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: absolute;
            left: 55px;
            top: 6px;
        }

        /* ಕ್ವಿಜ್ ಕಾರ್ಡ್ */
        .quest-card {
            background: var(--card-bg);
            border: 1px solid #23274c;
            border-radius: 18px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
        }

        .quest-text {
            font-size: 20px;
            font-weight: bold;
            line-height: 1.5;
            margin-bottom: 20px;
            text-align: left;
        }

        /* ಆಪ್ಷನ್ ಬಟನ್ಸ್‌ */
        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .opt-btn {
            background: #1c203e;
            border: 2px solid #343a6b;
            color: #ffffff;
            padding: 15px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
        }

        .opt-btn:hover:not(:disabled) {
            border-color: var(--neon-blue);
            background: #252a52;
            transform: translateX(5px);
        }

        .opt-btn.correct-choice {
            background: rgba(29, 209, 161, 0.15) !important;
            border-color: var(--neon-green) !important;
            color: var(--neon-green) !important;
        }

        .opt-btn.wrong-choice {
            background: rgba(255, 77, 77, 0.15) !important;
            border-color: var(--danger-red) !important;
            color: var(--danger-red) !important;
        }

        #feedbackMsg {
            font-size: 17px;
            font-weight: bold;
            margin-top: 20px;
            min-height: 27px;
            text-align: left;
            line-height: 1.5;
        }

        .action-btn {
            margin-top: 20px;
            background: linear-gradient(135deg, var(--neon-blue), #0984e3);
            color: white;
            border: none;
            padding: 12px 35px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            display: none;
        }
    </style>
</head>
<body>

<div class="activity-container">
    <h2>೩. ದ್ವಾರಕೆಯ ಮಹಾ ಮಿಷನ್: ಸಂವಾದ ಮೌಲ್ಯಮಾಪನ 🏹</h2>
    <p class="instruction"><b>ನಾಟಕದ ಸಂಭಾಷಣೆ ಆಧಾರಿತ ಕ್ವಿಜ್:</b> ಪ್ರಶ್ನೆಗೆ ಸರಿಯಾದ ಉತ್ತರ ನೀಡಿ, ಸುಧಾಮನ ರಥವನ್ನು ದ್ವಾರಕಾ ನಗರಕ್ಕೆ ತಲುಪಿಸಿ!</p>
    
    <div class="chariot-progress-zone">
        <span>🛖 ಗುಡಿಸಲು</span>
        <div class="progress-line">
            <div class="progress-fill" id="progFill"></div>
        </div>
        <div class="chariot-icon" id="chariotIcon">🏹</div>
        <span>🏰 ದ್ವಾರಕೆ</span>
    </div>

    <div class="quest-card">
        <div class="quest-text" id="questionText">ಪ್ರಶ್ನೆ ಲೋಡ್ ಆಗುತ್ತಿದೆ...</div>
        <div class="options-list" id="optionsGroup"></div>
    </div>

    <div id="feedbackMsg"></div>
    <button class="action-btn" id="nextMissionBtn" onclick="nextMission()">ಮುಂದಿನ ಹಂತಕ್ಕೆ ಸಾಗಿ ➡️</button>
</div>

<script {
type: text/javascript
}>
    // ನಾಟಕದ ಸಂಭಾಷಣೆಗಳನ್ನು ಆಧರಿಸಿದ ನಿಖರವಾದ ೫ ಪ್ರಶ್ನೆಗಳು
    const outcomesData = [
        {
            question: "೧. ಸುಧಾಮನು ಯಾರನ್ನು ತನ್ನ ಜೀವನದ 'ಪರಮ ಮಿತ್ರ' ಹಾಗೂ ಗುರುಕುಲದ ಒಟ್ಟಿಗೆ ಕಲಿತ ಸಹಪಾಠಿ ಎಂದು ಹೆಮ್ಮೆಯಿಂದ ಹೇಳುತ್ತಾನೆ?",
            options: [
                "ಬಾಬಾ ಸಾಹೇಬರನ್ನು",
                "ಶ್ರೀಕೃಷ್ಣ ಪರಮಾತ್ಮನನ್ನು",
                "ಅರ್ಜುನನನ್ನು",
                "ಗುರುಮಾತೆಯನ್ನು"
            ],
            correct: 1,
            explanation: "ಸುಧಾಮನು ಗುರುಕುಲದಲ್ಲಿ ಶ್ರೀಕೃಷ್ಣ ತನ್ನೊಂದಿಗೆ ಒಟ್ಟಿಗೆ ವಿದ್ಯಾಭ್ಯಾಸ ಮಾಡಿದ ಪರಮ ಮಿತ್ರ ಎಂದು ಹೆಂಡತಿಗೆ ಹೇಳುತ್ತಾನೆ."
        },
        {
            question: "೨. ಕೃಷ್ಣನ ಬಳಿ ಸಹಾಯ ಕೇಳಲು ಹೋಗುವಾಗ ಬರಿಗೈಯಲ್ಲಿ ಹೋಗಬಾರದೆಂದು ಸುಧಾಮನ ಪತ್ನಿ ಬಡತನದ ನಡುವೆಯೂ ಏನನ್ನು ಗಂಟಿನಲ್ಲಿ ಕಟ್ಟಿಕೊಡುತ್ತಾಳೆ?",
            options: [
                "ಹುರಿದ ಕಡಲೆ",
                "ರೇಷ್ಮೆ ಬಟ್ಟೆ",
                "ಸ್ವಲ್ಪ ಉಳಿದಿದ್ದ ಅವಲಕ್ಕಿ",
                "ಬಂಗಾರದ ಒಡವೆ"
            ],
            correct: 2,
            explanation: "ಮನೆಯಲ್ಲಿ ಮಕ್ಕಳ ಉಪಾಹಾರಕ್ಕೆ ತಂದಿದ್ದ ಅವಲಕ್ಕಿಯಲ್ಲಿ ಸ್ವಲ್ಪವೇ ಉಳಿದಿದ್ದನ್ನು ಹೆಂಡತಿ ಗಂಟಿನಲ್ಲಿ ಕಟ್ಟಿಕೊಡುತ್ತಾಳೆ."
        },
        {
            question: "೩. ಸುಧಾಮನು ಅರಮನೆಯ ಬಾಗಿಲಿಗೆ ಬಂದಾಗ, ಶ್ರೀಕೃಷ್ಣನು ಅವನನ್ನು ಕಂಡು ಆಶ್ಚರ್ಯದಿಂದ ಹೇಗೆ ಬರಮಾಡಿಕೊಂಡನು?",
            options: [
                "ಕಾವಲುಗಾರರಿಂದ ಹೊರಗೆ ಕಳುಹಿಸಿದನು",
                "ಸ್ವತಃ ಓಡಿ ಬಂದು ಸುಧಾಮನ ಕೈಹಿಡಿದು ಅರಮನೆಯ ಒಳಗೆ ಕರೆದೊಯ್ದನು",
                "ಸಿಂಹಾಸನದ ಮೇಲೆ ಕುಳಿತು ಆಜ್ಞೆ ಮಾಡಿದನು",
                "ಯಾರೋ ಬಡವನೆಂದು ನಿರ್ಲಕ್ಷಿಸಿದನು"
            ],
            correct: 1,
            explanation: "ಕೃಷ್ಣನು ಆಕಸ್ಮಿಕವಾಗಿ ಹೊರಗೆ ಬಂದು ಸುಧಾಮನನ್ನು ನೋಡಿ, ಆಶ್ಚರ್ಯದಿಂದ ಅವನ ಕೈಹಿಡಿದು ಒಳಗೆ ಕರೆದೊಯ್ಯುತ್ತಾನೆ."
        },
        {
            question: "೪. ನಾಟಕದ ಸಂವಾದದಲ್ಲಿ ಕೃಷ್ಣನು ಗುರುಕುಲದ ದಿನಗಳನ್ನು ನೆನೆಯುತ್ತಾ, ಗುರುಮಾತೆ ಕೊಟ್ಟ ಯಾವ ವಸ್ತುವನ್ನು ಸುಧಾಮನ ಪಾಲಿನದನ್ನೂ ತಾನೇ ಕಸಿದು ತಿಂದಿದ್ದಾಗಿ ತಮಾಷೆ ಮಾಡುತ್ತಾನೆ?",
            options: [
                "ಅವಲಕ್ಕಿ",
                "ರೊಟ್ಟಿ ಊಟ",
                "ಹುರಿದ ಕಡಲೆ",
                "ಸಿಹಿ ಹಣ್ಣುಗಳು"
            ],
            correct: 2,
            explanation: "ಕಟ್ಟಿಗೆ ತರಲು ಕಾಡಿಗೆ ಹೋಗಿದ್ದಾಗ ಗುರುಮಾತೆ ಕೊಟ್ಟಿದ್ದ ಹುರಿದ ಕಡಲೆಯನ್ನು ಕೃಷ್ಣನೇ ಕಸಿದು ತಿಂದಿದ್ದನ್ನು ನೆನಪಿಸಿಕೊಳ್ಳುತ್ತಾನೆ."
        },
        {
            question: "೫. ಸುಧಾಮನು ಕೃಷ್ಣನಲ್ಲಿ ತನ್ನ ಬಡತನದ ಬಗ್ಗೆ ಯಾವುದೇ ಸಹಾಯ ಕೇಳದಿದ್ದರೂ, ಅವನ ಮನದ ಇಂಗಿತ ಅರಿತು ಕೃಷ್ಣನು ಏನು ಮಾಡಿದನು?",
            options: [
                "ರೇಷ್ಮೆ ಬಟ್ಟೆ ಮಾತ್ರ ಕೊಟ್ಟನು",
                "ಸುಧಾಮನ ಗುಡಿಸಲಿನ ಜಾಗದಲ್ಲಿ ದ್ವಾರಕೆಯಿಂದ ಸೇವಕರನ್ನು ಕಳುಹಿಸಿ ಸುಂದರ ಅರಮನೆಯಂತಹ ಮನೆ ಕಟ್ಟಿಸಿಕೊಟ್ಟನು",
                "ಅವಲಕ್ಕಿಯನ್ನು ವಾಪಸ್ ಕೊಟ್ಟನು",
                "ದೊಡ್ಡ ರಾಜಕುಮಾರನನ್ನಾಗಿ ಮಾಡಿದನು"
            ],
            correct: 1,
            explanation: "ಸುಧಾಮ ಕೇಳದಿದ್ದರೂ ಕೃಷ್ಣನು ತನ್ನ ಕರ್ತವ್ಯವೆಂಬಂತೆ ಅವನ ಗುಡಿಸಲಿದ್ದ ಜಾಗದಲ್ಲಿ ಅರಮನೆಯಂತಹ ಸುಂದರ ಮನೆ ನಿರ್ಮಿಸಿಕೊಡುತ್ತಾನೆ."
        }
    ];

    let currentStage = 0;
    let score = 0;

    const questionText = document.getElementById('questionText');
    const optionsGroup = document.getElementById('optionsGroup');
    const feedbackMsg = document.getElementById('feedbackMsg');
    const nextMissionBtn = document.getElementById('nextMissionBtn');
    const progFill = document.getElementById('progFill');
    const chariotIcon = document.getElementById('chariotIcon');

    function playBeep(isCorrect) {
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(isCorrect ? 850 : 250, audioCtx.currentTime);
            gainNode.gain.setValueAtTime(0.08, audioCtx.currentTime);
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.2);
        } catch(e) {}
    }

    function loadStage() {
        feedbackMsg.innerText = "";
        nextMissionBtn.style.display = "none";
        
        const currentData = outcomesData[currentStage];
        questionText.innerText = currentData.question;
        optionsGroup.innerHTML = "";

        currentData.options.forEach((opt, idx) => {
            const btn = document.createElement('button');
            btn.className = "opt-btn";
            btn.id = "opt_" + idx;
            btn.innerText = opt;
            btn.onclick = () => evaluateAnswer(idx, currentData.correct, currentData.explanation);
            optionsGroup.appendChild(btn);
        });
    }

    function evaluateAnswer(selected, correct, explanation) {
        const allBtns = optionsGroup.querySelectorAll('.opt-btn');
        allBtns.forEach(b => b.disabled = true);

        if (selected === correct) {
            document.getElementById("opt_" + selected).classList.add('correct-choice');
            feedbackMsg.innerHTML = `<span style='color:var(--neon-green);'>✅ ಸರಿಯಾದ ಉತ್ತರ! ರಥ ಮುಂದೆ ಸಾಗಿತು.</span><br><small style='color:#aaa;'>💡 <b>ವಿವರಣೆ:</b> ${explanation}</small>`;
            playBeep(true);
            score++;
        } else {
            document.getElementById("opt_" + selected).classList.add('wrong-choice');
            document.getElementById("opt_" + correct).classList.add('correct-choice');
            feedbackMsg.innerHTML = `<span style='color:var(--danger-red);'>❌ ತಪ್ಪು ಉತ್ತರ! ಸರಿಯಾದ ನಾಟಕದ ಸನ್ನಿವೇಶ ಗಮನಿಸಿ.</span><br><small style='color:#aaa;'>💡 <b>ವಿವರಣೆ:</b> ${explanation}</small>`;
            playBeep(false);
        }

        // ರಥದ ಲೈವ್ ಮೂವ್ಮೆಂಟ್ ಲೆಕ್ಕಾಚಾರ
        const progressPercent = ((currentStage + 1) / outcomesData.length) * 100;
        progFill.style.width = progressPercent + "%";
        
        const maxMove = progFill.parentElement.offsetWidth - 30; 
        const currentMove = (progressPercent / 100) * maxMove + 55;
        chariotIcon.style.left = currentMove + "px";

        nextMissionBtn.style.display = "inline-block";
        if (currentStage === outcomesData.length - 1) {
            nextMissionBtn.innerText = "ಮಿಷನ್ ಕಂಪ್ಲೀಟ್ ರಿಪೋರ್ಟ್ 📋";
        }
    }

    function nextMission() {
        if (currentStage < outcomesData.length - 1) {
            currentStage++;
            loadStage();
        } else {
            // ಫಲಿತಾಂಶದ ಪರದೆ
            questionText.innerText = "🏁 ದ್ವಾರಕೆಯ ಮಹಾ ಮಿಷನ್ ಪೂರ್ಣಗೊಂಡಿದೆ!";
            optionsGroup.innerHTML = "";
            
            let evaluationResult = "";
            if (score === outcomesData.length) {
                evaluationResult = "<span style='color:var(--neon-green);'>🥇 ಅದ್ಭುತ ಗೆಳೆತನದ ಜ್ಞಾನ! ವಿದ್ಯಾರ್ಥಿಯು ನಾಟಕದ ಎಲ್ಲಾ ಸಂವಾದಗಳನ್ನು ಸಂಪೂರ್ಣವಾಗಿ ಗ್ರಹಿಸಿದ್ದಾನೆ!</span>";
            } else if (score >= 3) {
                evaluationResult = "<span style='color:var(--neon-blue);'>✨ ಉತ್ತಮ ಪ್ರಗತಿ! ಮಗುವು ಕೃಷ್ಣ-ಸುಧಾಮರ ಕಥೆಯ ಮುಖ್ಯ ಸಾರವನ್ನು ಚೆನ್ನಾಗಿ ತಿಳಿದಿದೆ.</span>";
            } else {
                evaluationResult = "<span style='color:var(--danger-red);'>🔄 ನಾಟಕದ ಮುಖ್ಯ ಸಂವಾದಗಳನ್ನು ವಿದ್ಯಾರ್ಥಿಗೆ ಮತ್ತೊಮ್ಮೆ ಓದಿಸುವುದು ಸೂಕ್ತ.</span>";
            }

            feedbackMsg.innerHTML = `📊 <b>ಮಿಷನ್ ಮೌಲ್ಯಮಾಪನ ವರದಿ:</b><br>ಒಟ್ಟು ಸಾಧಿಸಿದ ಅಂಕಗಳು: <b>${score} / ${outcomesData.length}</b><br><br>${evaluationResult}`;
            
            nextMissionBtn.innerText = "ಮಿಷನ್ ರಿಸೆಟ್ 🔄";
            nextMissionBtn.onclick = () => {
                currentStage = 0;
                score = 0;
                progFill.style.width = "0%";
                chariotIcon.style.left = "55px";
                nextMissionBtn.innerText = "ಮುಂದಿನ ಹಂತಕ್ಕೆ ಸಾಗಿ ➡️";
                nextMissionBtn.onclick = nextMission;
                loadStage();
            };
        }
    }

    // ಆಟ ಪ್ರಾರಂಭ
    loadStage();
</script>

</body>
</html>
