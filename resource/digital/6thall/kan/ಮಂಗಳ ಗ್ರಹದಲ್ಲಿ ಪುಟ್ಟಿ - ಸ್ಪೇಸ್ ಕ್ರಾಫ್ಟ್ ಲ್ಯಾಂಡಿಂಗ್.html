<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ಮಂಗಳ ಗ್ರಹದಲ್ಲಿ ಪುಟ್ಟಿ - ಸ್ಪೇಸ್ ಕ್ರಾಫ್ಟ್ ಲ್ಯಾಂಡಿಂಗ್</title>
    <style>
        :root {
            --space-bg: #04050f;
            --neon-blue: #00d2d3;
            --neon-mars: #ff5252;
            --neon-green: #1dd1a1;
            --danger-red: #ff4d4d;
            --panel-bg: #0f1126;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--space-bg);
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            user-select: none;
        }

        .activity-container {
            background: linear-gradient(145deg, #0b0d21, #141736);
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 20px 50px rgba(255, 82, 82, 0.15);
            max-width: 850px;
            width: 100%;
            text-align: center;
            border: 1px solid rgba(255, 82, 82, 0.2);
        }

        h2 {
            color: var(--neon-mars);
            text-shadow: 0 0 12px rgba(255, 82, 82, 0.4);
            font-size: 26px;
        }

        .instruction {
            color: #a4b0be;
            font-size: 15px;
            margin-bottom: 30px;
        }

        /* ಬ್ಯಾಟಲ್ ಅರೇನಾ ವಿನ್ಯಾಸ */
        .landing-arena {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
        }

        .landing-zone {
            flex: 1;
            height: 180px;
            background: var(--panel-bg);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 8px 16px rgba(0,0,0,0.4);
        }

        #earthZone {
            border: 3px solid var(--neon-green);
            color: #a3f7bf;
            text-shadow: 0 0 10px rgba(29, 209, 161, 0.3);
        }
        #earthZone:hover {
            background: rgba(29, 209, 161, 0.08);
            box-shadow: 0 0 25px rgba(29, 209, 161, 0.4);
        }

        #marsZone {
            border: 3px solid var(--neon-mars);
            color: #ffb6c1;
            text-shadow: 0 0 10px rgba(255, 82, 82, 0.3);
        }
        #marsZone:hover {
            background: rgba(255, 82, 82, 0.08);
            box-shadow: 0 0 25px rgba(255, 82, 82, 0.4);
        }

        /* ಹಾರುವ ನೌಕೆ */
        .spaceship-holder {
            width: 160px;
            height: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .spaceship-card {
            background: linear-gradient(135deg, #1e254d, #111428);
            color: #ffffff;
            font-size: 20px;
            font-weight: bold;
            padding: 15px;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0, 210, 211, 0.2);
            border: 2px solid var(--neon-blue);
            transition: transform 0.3s ease-out, opacity 0.3s;
        }

        .land-left { transform: translateX(-180px) scale(0.6); opacity: 0; }
        .land-right { transform: translateX(180px) scale(0.6); opacity: 0; }

        .score-board {
            font-size: 18px;
            font-weight: bold;
            color: #94a3b8;
            margin-top: 15px;
        }

        #feedbackText {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
            min-height: 50px;
            line-height: 1.5;
        }

        .correct-color { color: var(--neon-green); }
        .wrong-color { color: var(--danger-red); }

        .reset-btn {
            margin-top: 20px;
            background: linear-gradient(135deg, var(--neon-mars), var(--neon-blue));
            color: #ffffff;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            display: none;
        }

        @media (max-width: 650px) {
            .landing-arena { flex-direction: column-reverse; gap: 25px; }
            .landing-zone { width: 100%; height: 120px; }
            .spaceship-holder { height: 60px; }
        }
    </style>
</head>
<body>

<div class="activity-container">
    <h2>೧. ಬಾಹ್ಯಾಕಾಶ ಯಾನ: ಸುರಕ್ಷಿತ ಲ್ಯಾಂಡಿಂಗ್ ಸವಾಲು 🚀</h2>
    <p class="instruction"><b>ವಿಶಿಷ್ಟ ಟಾರ್ಗೆಟ್ ಗೇಮ್:</b> ಮಧ್ಯದ ನೌಕೆಯಲ್ಲಿರುವ ಕಾವ್ಯದ ವಿವರ ಓದಿ, ಅದು ಯಾವ ಗ್ರಹದ ಸನ್ನಿವೇಶವೋ ಆ ಕಡೆಯ ಜೋನ್ ಅನ್ನು ತಕ್ಷಣ ಸ್ಪರ್ಶಿಸಿ (Slap) ನೌಕೆ ಇಳಿಸಿ!</p>

    <div class="landing-arena">
        <div class="landing-zone" id="earthZone" onclick="landShip('ಭೂಮಿ', 'left')">
            <span>🌍 ಹಸಿರು ಭೂಮಿ</span>
            <small style="font-size:12px; margin-top:5px; color:#85e3b3;">(ನೇರಳೆ ಚೆಂಡಿನ ಸುಂದರ ಧರೆ)</small>
        </div>

        <div class="spaceship-holder">
            <div class="spaceship-card" id="shipCard">ಲೋಡ್...</div>
        </div>

        <div class="landing-zone" id="marsZone" onclick="landShip('ಮಂಗಳ ಗ್ರಹ', 'right')">
            <span>🔴 ಬರಡಾದ ಮಂಗಳ</span>
            <small style="font-size:12px; margin-top:5px; color:#ff9f84;">(ಬಣಬಣಗುಟ್ಟುವ ಒಣ ಬಯಲು)</small>
        </div>
    </div>

    <div class="score-board">ಲ್ಯಾಂಡಿಂಗ್ ಪ್ರಗತಿ: <span id="currentScore">0</span> / <span id="maxScore">0</span></div>
    <div id="feedbackText"></div>
    <button class="reset-btn" id="resetBtn" onclick="restartMission()">ಮಿಷನ್ ಮರುಚಾಲನೆ 🔄</button>
</div>

<script>
    // ಪಠ್ಯಪುಸ್ತಕದ ಪುಟ ೬೯ ಮತ್ತು ೭೦ ರ ಕಥಾ ಸಾರಾಂಶ ಆಧಾರಿತ ನಿಖರ ಘಟನೆಗಳು
    const missionData = [
        { scenario: "ಚಂದ್ರನ ಮೇಲೆ ನಿಂತು ನೋಡಿದಾಗ ನೇರಳೆ ಬಣ್ಣದ ಚೆಂಡಿನ ಹಾಗೆ ಕಂಡ ಗ್ರಹ", planet: "ಭೂಮಿ", exp: "ಚಂದ್ರನಿಂದ ನೋಡಿದಾಗ ನಮ್ಮ ಸುಂದರ ಧರೆಯು ನೇರಳೆ ಚೆಂಡಿನಂತೆ ಕಾಣುತ್ತದೆ." },
        { scenario: "ಕೆಂಪಗೆ ಬಣಬಣಗುಟ್ಟುತ್ತಾ ಯಾವುದೇ ಜೀವ ಸಂಕುಲವಿಲ್ಲದೆ ನೀರಸವಾಗಿದ್ದ ಅಂಗಳ", planet: "ಮಂಗಳ ಗ್ರಹ", exp: "ಮಂಗಳ ಗ್ರಹವು ಸಂಪೂರ್ಣವಾಗಿ ಒಣಗಿ ಬರಡಾಗಿದ್ದು, ಜೀವ ರಹಿತವಾಗಿದೆ." },
        { scenario: "ಹಿಂದೊಂದು ಕಾಲದಲ್ಲಿ ಸಮೃದ್ಧ ಜೀವಜಲ ಮತ್ತು ಹಸಿರು ಮರಗಳನ್ನು ಹೊಂದಿದ್ದ ಗ್ರಹ", planet: "ಮಂಗಳ ಗ್ರಹ", exp: "ಮಂಗಳದಲ್ಲೂ ಹಿಂದೆ ಹಸಿರಿತ್ತು, ಆದರೆ ಜನರ ಸ್ವಾರ್ಥದಿಂದ ಅದು ನಾಶವಾಯಿತು ಎಂದು ಬಂಡೆ ಹೇಳುತ್ತದೆ." },
        { scenario: "ಜನರಲ್ಲಿ ಹಸಿರನ್ನು ಉಳಿಸಲು ಬೇಡುತ್ತಾ, ಎಳೆ ಸಸಿಗಳನ್ನು ನೆಟ್ಟು ಕುಣಿದಾಡಿದ ಜಾಗ", planet: "ಭೂಮಿ", exp: "ಪುಟ್ಟಿ ಮಂಗಳನ ದುರಂತ ಕಂಡು ಹೆದರಿ ಧರೆಗೆ ಬಂದು ಸಸಿಗಳನ್ನು ನೆಡುತ್ತಾಳೆ." },
        { scenario: "ನಾಡನ್ನು ಕಟ್ಟಲು ಮರಗಳನ್ನು ಕತ್ತರಿಸಿ ಭೀಕರ ಬರಗಾಲವನ್ನು ತಂದುಕೊಂಡ ಇತಿಹಾಸ", planet: "ಮಂಗಳ ಗ್ರಹ", exp: "ಮಂಗಳ ಗ್ರಹದ ಜನರು ಮರ ಕಡಿದಿದ್ದರಿಂದ ಇಡೀ ಗ್ರಹವೇ ವಿನಾಶದ ಹಾದಿ ಹಿಡಿಯಿತು." }
    ];

    let fleet = [];
    let activeIdx = 0;
    let scorePoints = 0;
    let isLandAction = false;

    const shipCard = document.getElementById('shipCard');
    const currentScore = document.getElementById('currentScore');
    const maxScore = document.getElementById('maxScore');
    const feedbackText = document.getElementById('feedbackText');
    const resetBtn = document.getElementById('resetBtn');

    function playLaserEffect(isSuccess) {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = isSuccess ? 'sine' : 'sawtooth';
            osc.frequency.setValueAtTime(isSuccess ? 900 : 200, ctx.currentTime);
            if(isSuccess) osc.frequency.exponentialRampToValueAtTime(300, ctx.currentTime + 0.15);
            gain.gain.setValueAtTime(0.08, ctx.currentTime);
            osc.connect(gain); gain.connect(ctx.destination);
            osc.start(); osc.stop(ctx.currentTime + 0.15);
        } catch(e) {}
    }

    function startMission() {
        fleet = [...missionData].sort(() => Math.random() - 0.5);
        activeIdx = 0;
        scorePoints = 0;
        maxScore.innerText = fleet.length;
        currentScore.innerText = scorePoints;
        feedbackText.innerText = "";
        resetBtn.style.display = "none";
        renderShip();
    }

    function renderShip() {
        if (activeIdx < fleet.length) {
            isLandAction = false;
            shipCard.style.display = "block";
            shipCard.className = "spaceship-card";
            shipCard.innerText = `🛸 ${fleet[activeIdx].scenario}`;
        } else {
            shipCard.style.display = "none";
            showFinalReport();
        }
    }

    function landShip(zoneChoice, side) {
        if (isLandAction || activeIdx >= fleet.length) return;
        isLandAction = true;

        const currentMission = fleet[activeIdx];
        
        if (zoneChoice === currentMission.planet) {
            scorePoints++;
            currentScore.innerText = scorePoints;
            feedbackText.className = "correct-color";
            feedbackText.innerHTML = `💥 <b>ಸುರಕ್ಷಿತ ಲ್ಯಾಂಡಿಂಗ್!</b> ಇದು <b>${currentMission.planet}</b>ಗೆ ಸಂಬಂಧಿಸಿದೆ.<br><small style="color:#cbd5e1;">💡 ${currentMission.exp}</small>`;
            playLaserEffect(true);
        } else {
            feedbackText.className = "wrong-color";
            feedbackText.innerHTML = `❌ <b>ಕ್ರಾಶ್ ಲ್ಯಾಂಡಿಂಗ್!</b> ಇದು ನಿಜವಾಗಿ <b>${currentMission.planet}</b>ಗೆ ಸೇರಿದ್ದಾಗಿದೆ.<br><small style="color:#cbd5e1;">💡 ${currentMission.exp}</small>`;
            playLaserEffect(false);
        }

        shipCard.classList.add(side === 'left' ? 'land-left' : 'land-right');
        activeIdx++;
        setTimeout(renderShip, 1600);
    }

    function showFinalReport() {
        feedbackText.className = "correct-color";
        feedbackText.innerHTML = `🏁 <b>ಬಾಹ್ಯಾಕಾಶ ಮಿಷನ್ ಪೂರ್ಣಗೊಂಡಿದೆ!</b><br>ನಿಮ್ಮ ಯಶಸ್ವಿ ಲ್ಯಾಂಡಿಂಗ್ ಸ್ಕೋರ್: <b>${scorePoints} / ${fleet.length}</b>`;
        resetBtn.style.display = "inline-block";
    }

    function restartMission() { startMission(); }
    startMission();
</script>
</body>
</html>
