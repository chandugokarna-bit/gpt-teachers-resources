<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ಅಲ್ಪಪ್ರಾಣ - ಮಹಾಪ್ರಾಣ ರಿಬ್ಬನ್ ಚಾಲೆಂಜ್ (ಆಡಿಯೋ ಸಹಿತ)</title>
    <style>
        :root {
            --primary-color: #6c5ce7;
            --alpaprana-color: #00ebc7;
            --mahaprana-color: #ff5470;
            --bg-color: #f8f9fa;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .activity-container {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            max-width: 800px;
            width: 100%;
            text-align: center;
        }

        h2 {
            color: var(--primary-color);
            margin-bottom: 10px;
        }

        .instruction {
            color: #7f8c8d;
            font-size: 16px;
            margin-bottom: 30px;
        }

        /* ರಿಬ್ಬನ್ ಅನಿಮೇಷನ್ ಜಾಗ */
        .visual-zone {
            height: 180px;
            background: linear-gradient(to bottom, #e0eae9, #e8f4f8);
            border-radius: 15px;
            margin-bottom: 35px;
            position: relative;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .wind-source {
            position: absolute;
            left: 20px;
            font-size: 50px;
        }

        .ribbon {
            width: 180px;
            height: 25px;
            background: linear-gradient(90deg, #ff7675, #ef5777);
            border-radius: 5px;
            position: absolute;
            left: 90px;
            transform-origin: left center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        @keyframes blow-soft {
            0% { transform: rotate(0deg); }
            50% { transform: rotate(-5deg) skewX(-5deg); }
            100% { transform: rotate(0deg); }
        }

        @keyframes blow-hard {
            0% { transform: rotate(0deg); }
            25% { transform: rotate(-45deg) translateY(-20px); background: #ff5470; }
            50% { transform: rotate(-35deg) translateY(-10px); }
            75% { transform: rotate(-40deg) translateY(-15px); }
            100% { transform: rotate(0deg); }
        }

        .blow-low {
            animation: blow-soft 0.8s ease-in-out;
        }

        .blow-high {
            animation: blow-hard 1.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .letters-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            margin-bottom: 25px;
            padding: 10px;
        }

        .letter-btn {
            background: white;
            border: 2px solid #dcdde1;
            padding: 12px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            color: #2c3e50;
        }

        .letter-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .alpa-active {
            background-color: #e3faf2 !important;
            border-color: var(--alpaprana-color) !important;
            color: #0f9b74 !important;
        }

        .maha-active {
            background-color: #fff5f5 !important;
            border-color: var(--mahaprana-color) !important;
            color: #b33939 !important;
        }

        .status-panel {
            background: #f1f2f6;
            padding: 15px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            color: #3d3d3d;
            min-height: 27px;
        }
    </style>
</head>
<body>

<div class="activity-container">
    <h2>೪. ಅಲ್ಪಪ್ರಾಣ - ಮಹಾಪ್ರಾಣ ರಿಬ್ಬನ್ ಚಾಲೆಂಜ್ 🗣️🎵</h2>
    <p class="instruction">ಅಕ್ಷರಗಳನ್ನು ಕ್ಲಿಕ್ ಮಾಡಿದಾಗ ಬ್ರೌಸರ್ ಆಟೋಮ್ಯಾಟಿಕ್ ಆಗಿ ಉಚ್ಚಾರಣೆ ಮಾಡುತ್ತದೆ ಹಾಗೂ ಗಾಳಿಯ ಧ್ವನಿಯೂ ಕೇಳಿಸುತ್ತದೆ!</p>

    <div class="visual-zone">
        <div class="wind-source" id="avatar">🗣️</div>
        <div class="ribbon" id="digitalRibbon"></div>
    </div>

    <div class="letters-grid">
        <button class="letter-btn" data-type="ಅಲ್ಪಪ್ರಾಣ">ಕ</button>
        <button class="letter-btn" data-type="ಮಹಾಪ್ರಾಣ">ಖ</button>
        <button class="letter-btn" data-type="ಅಲ್ಪಪ್ರಾಣ">ಗ</button>
        <button class="letter-btn" data-type="ಮಹಾಪ್ರಾಣ">ಘ</button>
        <button class="letter-btn" data-type="ಅನುನಾಸಿಕ">ಙ</button>

        <button class="letter-btn" data-type="ಅಲ್ಪಪ್ರಾಣ">ಚ</button>
        <button class="letter-btn" data-type="ಮಹಾಪ್ರಾಣ">ಛ</button>
        <button class="letter-btn" data-type="ಅಲ್ಪಪ್ರಾಣ">ಜ</button>
        <button class="letter-btn" data-type="ಮಹಾಪ್ರಾಣ">ಝ</button>
        <button class="letter-btn" data-type="ಅನುನಾಸಿಕ">ಞ</button>

        <button class="letter-btn" data-type="ಅಲ್ಪಪ್ರಾಣ">ಟ</button>
        <button class="letter-btn" data-type="ಮಹಾಪ್ರಾಣ">ಠ</button>
        <button class="letter-btn" data-type="ಅಲ್ಪಪ್ರಾಣ">ಡ</button>
        <button class="letter-btn" data-type="ಮಹಾಪ್ರಾಣ">ಢ</button>
        <button class="letter-btn" data-type="ಅನುನಾಸಿಕ">ಣ</button>

        <button class="letter-btn" data-type="ಅಲ್ಪಪ್ರಾಣ">ತ</button>
        <button class="letter-btn" data-type="ಮಹಾಪ್ರಾಣ">ಥ</button>
        <button class="letter-btn" data-type="ಅಲ್ಪಪ್ರಾಣ">ದ</button>
        <button class="letter-btn" data-type="ಮಹಾಪ್ರಾಣ">ಧ</button>
        <button class="letter-btn" data-type="ಅನುನಾಸಿಕ">ನ</button>

        <button class="letter-btn" data-type="ಅಲ್ಪಪ್ರಾಣ">ಪ</button>
        <button class="letter-btn" data-type="ಮಹಾಪ್ರಾಣ">ಫ</button>
        <button class="letter-btn" data-type="ಅಲ್ಪಪ್ರಾಣ">ಬ</button>
        <button class="letter-btn" data-type="ಮಹಾಪ್ರಾಣ">ಭ</button>
        <button class="letter-btn" data-type="ಅನುನಾಸಿಕ">ಮ</button>
    </div>

    <div class="status-panel" id="statusText">ಅಕ್ಷರವನ್ನು ಕ್ಲಿಕ್ ಮಾಡಿ ಆಡಿಯೋ ಪ್ರಯೋಗ ಆಲಿಸಿ...</div>
</div>

<script>
    const buttons = document.querySelectorAll('.letter-btn');
    const ribbon = document.getElementById('digitalRibbon');
    const avatar = document.getElementById('avatar');
    const statusText = document.getElementById('statusText');

    // ಜಾವಾಸ್ಕ್ರಿಪ್ಟ್ ಮೂಲಕ ಕೃತಕವಾಗಿ ಗಾಳಿಯ ಧ್ವನಿ (Wind Sound Effect) ಸೃಷ್ಟಿಸುವ ಫಂಕ್ಷನ್
    function playWindSound(isHard) {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const bufferSize = audioCtx.sampleRate * (isHard ? 1.2 : 0.4);
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        
        // ವೈಟ್ ನಾಯ್ಸ್ ಸೃಷ್ಟಿ
        for (let i = 0; i < bufferSize; i++) {
            data[i] = Math.random() * 2 - 1;
        }

        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;

        // ಗಾಳಿಯ ತರಂಗದ ತರಹ ಕೇಳಿಸಲು ಫಿಲ್ಟರ್ ಬಳಕೆ
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = isHard ? 400 : 200;

        const gainNode = audioCtx.createGain();
        gainNode.gain.setValueAtTime(isHard ? 0.3 : 0.1, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + (isHard ? 1.2 : 0.4));

        noise.connect(filter);
        filter.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        
        noise.start();
    }

    // ಅಕ್ಷರವನ್ನು ಆಟೋಮ್ಯಾಟಿಕ್ ಆಗಿ ಉಚ್ಚರಿಸುವ ಫಂಕ್ಷನ್ (ಕನ್ನಡ TTS)
    function speakLetter(text) {
        if ('speechSynthesis' in window) {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'kn-IN'; // ಕನ್ನಡ ಧ್ವನಿಯನ್ನು ಸೆಟ್ ಮಾಡಲಾಗಿದೆ
            utterance.rate = 0.8;    // ಮಕ್ಕಳಿಗೆ ನಿಧಾನವಾಗಿ ಕೇಳಿಸಲು ಸ್ಪೀಡ್ ಕಡಿಮೆ ಮಾಡಲಾಗಿದೆ
            window.speechSynthesis.speak(utterance);
        }
    }

    buttons.forEach(btn => {
        btn.addEventListener('click', () => {
            buttons.forEach(b => b.classList.remove('alpa-active', 'maha-active'));
            ribbon.classList.remove('blow-low', 'blow-high');
            
            void ribbon.offsetWidth; 

            const letter = btn.innerText;
            const type = btn.dataset.type;

            // 1. ಮೊದಲು ಆಯಾ ಅಕ್ಷರದ ಸ್ಪಷ್ಟ ಕನ್ನಡ ಉಚ್ಚಾರಣೆ ಕೇಳಿಸುತ್ತದೆ
            speakLetter(letter);

            // 2. ಸ್ವಲ್ಪವೇ ಕ್ಷಣದಲ್ಲಿ ಗಾಳಿಯ ಧ್ವನಿ ಮತ್ತು ಅನಿಮೇಷನ್ ಶುರುವಾಗುತ್ತದೆ
            setTimeout(() => {
                if (type === "ಮಹಾಪ್ರಾಣ") {
                    btn.classList.add('maha-active');
                    ribbon.classList.add('blow-high');
                    avatar.innerText = "😮💨";
                    playWindSound(true); // ಜೋರಾದ ಗಾಳಿಯ ಧ್ವನಿ
                    statusText.innerHTML = `🎈 <span style="color:#ff5470;">"${letter}"</span> - <b>ಮಹಾಪ್ರಾಣಾಕ್ಷರ</b>. [ಜೋರಾದ ಉಚ್ವಾಸ ಧ್ವನಿ ಕೇಳಿಸಿತು!]`;
                } else if (type === "ಅಲ್ಪಪ್ರಾಣ") {
                    btn.classList.add('alpa-active');
                    ribbon.classList.add('blow-low');
                    avatar.innerText = "😀";
                    playWindSound(false); // ಮೆದುವಾದ ಗಾಳಿಯ ಧ್ವನಿ
                    statusText.innerHTML = `✨ <span style="color:#00ebc7;">"${letter}"</span> - <b>ಅಲ್ಪಪ್ರಾಣಾಕ್ಷರ</b>. [ಮೆದುವಾದ ಧ್ವನಿ ಕೇಳಿಸಿತು]`;
                } else {
                    btn.classList.add('alpa-active');
                    ribbon.classList.add('blow-low');
                    avatar.innerText = "👃";
                    playWindSound(false);
                    statusText.innerHTML = `👃 <span style="color:#00ebc7;">"${letter}"</span> - <b>ಅನುನಾಸಿಕಾಕ್ಷರ</b>. [ಮೂಗಿನ ಸಹಾಯದ ಉಚ್ಚಾರಣೆ]`;
                }
            }, 200);

            setTimeout(() => {
                if(avatar.innerText !== "👃") avatar.innerText = "🗣️";
            }, 1200);
        });
    });
</script>

</body>
</html>
