<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ಬೇಸಿಗೆ ಪದ್ಯ - ಪ್ರಾಣವಾಯು ಪಲ್ಸ್ ರೇಟ್</title>
    <style>
        :root {
            --bg-space: #050611;
            --neon-gold: #ffd32a;
            --neon-blue: #00d2d3;
            --neon-green: #1dd1a1;
            --danger-red: #ff4d4d;
            --panel-dark: #0f1126;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg-space);
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            user-select: none;
        }

        .activity-container {
            background: linear-gradient(145deg, #0e112a, #161b40);
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 15px 40px rgba(255, 211, 42, 0.15);
            max-width: 750px;
            width: 100%;
            text-align: center;
            border: 1px solid rgba(255, 211, 42, 0.2);
        }

        h2 {
            color: var(--neon-gold);
            text-shadow: 0 0 10px rgba(255, 211, 42, 0.4);
            font-size: 26px;
            margin-bottom: 5px;
        }

        .instruction { color: #a0a5c0; font-size: 15px; margin-bottom: 25px; }

        /* ವೈಜ್ಞಾನಿಕ ಪಲ್ಸ್ ಗೇಜ್ ಮೀಟರ್ */
        .gauge-container {
            background: #04050d;
            border: 2px solid #232954;
            border-radius: 100px 100px 15px 15px;
            width: 240px;
            height: 140px;
            margin: 0 auto 35px auto;
            position: relative;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            padding-bottom: 15px;
        }

        .semi-circle {
            position: absolute;
            width: 200px;
            height: 100px;
            border-radius: 100px 100px 0 0;
            border: 8px solid #1e254d;
            border-bottom: none;
            top: 25px;
        }

        .gauge-needle {
            width: 6px;
            height: 85px;
            background: linear-gradient(to top, var(--neon-gold), var(--danger-red));
            position: absolute;
            bottom: 15px;
            left: calc(50% - 3px);
            transform-origin: bottom center;
            transform: rotate(-75deg); /* ಆರಂಭಿಕ ಹಂತ (-75 ರಿಂದ +75 ಡಿಗ್ರಿ) */
            transition: transform 0.4s cubic-bezier(0.18, 0.89, 0.32, 1.28);
            border-radius: 10px;
        }

        .gauge-center {
            width: 20px;
            height: 20px;
            background: #ffffff;
            border-radius: 50%;
            position: absolute;
            bottom: 5px;
            box-shadow: 0 0 10px var(--neon-gold);
        }

        .metric-label {
            font-size: 14px;
            font-weight: bold;
            color: #6a7393;
            margin-top: 10px;
            position: absolute;
            bottom: 20px;
            width: 100%;
        }

        .letter-matrix-card {
            background: var(--panel-dark);
            border: 2px dashed #232954;
            border-radius: 15px;
            padding: 15px 40px;
            font-size: 48px;
            font-weight: 900;
            color: var(--neon-blue);
            text-shadow: 0 0 15px rgba(0, 210, 211, 0.4);
            margin-bottom: 25px;
            display: inline-block;
        }

        .buttons-arena { display: flex; justify-content: center; gap: 20px; }
        .trigger-btn {
            padding: 15px 35px; font-size: 18px; font-weight: bold; color: white;
            border: none; border-radius: 12px; cursor: pointer; transition: all 0.2s;
        }
        .alpa-color { background: linear-gradient(135deg, #1b74e4, #2980b9); }
        .alpa-color:hover:not(:disabled) { transform: scale(1.03); }
        .maha-color { background: linear-gradient(135deg, #9b59b6, #8e44ad); }
        .maha-color:hover:not(:disabled) { transform: scale(1.03); }

        #msgDisplay { font-size: 18px; font-weight: bold; min-height: 27px; margin-top: 25px; }
        .reset-btn {
            margin-top: 20px; background: linear-gradient(135deg, var(--neon-gold), #ff9f43);
            color: black; border: none; padding: 12px 30px; font-size: 16px; font-weight: bold;
            border-radius: 8px; cursor: pointer; display: none;
        }
    </style>
</head>
<body>

<div class="activity-container">
    <h2>೨. ಧ್ವನಿ ತರಂಗ: ಪ್ರಾಣವಾಯು ಪಲ್ಸ್ ರೇಟ್ ಮೀಟರ್ ⚡</h2>
    <p class="instruction"><b>ಎಐ ಶೈಲಿಯ ಲ್ಯಾಬ್ ಆಟ:</b> ಅಕ್ಷರದ ಉಸಿರಾಟದ ಒತ್ತಡವನ್ನು ಊಹಿಸಿ ಬಟನ್ ಒತ್ತಿ, ಪ್ರಾಣವಾಯುವಿನ ಲೈವ್ ಗ್ರಾಫ್ ಪ್ರಮಾಣ ವೀಕ್ಷಿಸಿ! </p>

    <div class="gauge-container">
        <div class="semi-circle"></div>
        <div class="gauge-needle" id="needle"></div>
        <div class="gauge-center"></div>
        <div class="metric-label" id="metricLabel">ಪಲ್ಸ್ ರೇಟ್: 0% (ನಿಶ್ಚಲ)</div>
    </div>

    <div class="letter-matrix-card" id="displayLetter">ಕ</div>

    <div class="buttons-arena">
        <button class="trigger-btn alpa-color" id="alpaBtn" onclick="triggerPulse('ಅಲ್ಪಪ್ರಾಣ')">ಅಲ್ಪಪ್ರಾಣ 🍃</button>
        <button class="trigger-btn maha-color" id="mahaBtn" onclick="triggerPulse('ಮಹಾಪ್ರಾಣ')">ಮಹಾಪ್ರಾಣ 🌪️</button>
    </div>

    <div id="msgDisplay"></div>
    <button class="reset-btn" id="resetBtn" onclick="restartPulseGame()">ಮತ್ತೆ ಆರಂಭಿಸು 🔄</button>
</div>

<script>
    // ಅಲ್ಪಪ್ರಾಣ ಮತ್ತು ಮಹಾಪ್ರಾಣ ಅಕ್ಷರಗಳ ಮಾದರಿ 
    const lettersPool = [
        { letter: "ಕ", type: "ಅಲ್ಪಪ್ರಾಣ", degree: -30, label: "35% (ಕಡಿಮೆ ಒತ್ತಡ) 🍃" },
        { letter: "ಖ", type: "ಮಹಾಪ್ರಾಣ", degree: 65, label: "95% (ತೀವ್ರ ಉಸಿರಾಟದ ಪುಶ್) 🌪️" },
        { letter: "ಗ", type: "ಅಲ್ಪಪ್ರಾಣ", degree: -25, label: "38% (ಕಡಿಮೆ ಒತ್ತಡ) 🍃" },
        { letter: "ಘ", type: "ಮಹಾಪ್ರಾಣ", degree: 70, label: "98% (ತೀವ್ರ ಉಸಿರಾಟದ ಪುಶ್) 🌪️" },
        { letter: "ಚ", type: "ಅಲ್ಪಪ್ರಾಣ", degree: -35, label: "30% (ಕಡಿಮೆ ಒತ್ತಡ) 🍃" },
        { letter: "ಛ", type: "ಮಹಾಪ್ರಾಣ", degree: 60, label: "92% (ತೀವ್ರ ಉಸಿರಾಟದ ಪುಶ್) 🌪️" },
        { letter: "ಟ", type: "ಅಲ್ಪಪ್ರಾಣ", degree: -32, label: "32% (ಕಡಿಮೆ ಒತ್ತಡ) 🍃" },
        { letter: "ಠ", type: "ಮಹಾಪ್ರಾಣ", degree: 62, label: "94% (ತೀವ್ರ ಉಸಿರಾಟದ ಪುಶ್) 🌪️" }
    ];

    let currentTrack = [];
    let pointer = 0;
    let successCount = 0;

    const needle = document.getElementById('needle');
    const metricLabel = document.getElementById('metricLabel');
    const displayLetter = document.getElementById('displayLetter');
    const msgDisplay = document.getElementById('msgDisplay');
    const resetBtn = document.getElementById('resetBtn');
    const alpaBtn = document.getElementById('alpaBtn');
    const mahaBtn = document.getElementById('mahaBtn');

    function synthSound(freq) {
        try {
            const actx = new (window.AudioContext || window.webkitAudioContext)();
            const o = actx.createOscillator();
            const g = actx.createGain();
            o.frequency.setValueAtTime(freq, actx.currentTime);
            g.gain.setValueAtTime(0.08, actx.currentTime);
            o.connect(g); g.connect(actx.destination);
            o.start(); o.stop(actx.currentTime + 0.15);
        } catch(e) {}
    }

    function startPulseGame() {
        currentTrack = [...lettersPool].sort(() => Math.random() - 0.5);
        pointer = 0;
        successCount = 0;
        msgDisplay.innerText = "";
        resetBtn.style.display = "none";
        alpaBtn.disabled = false;
        mahaBtn.disabled = false;
        resetGauge();
        renderLetter();
    }

    function resetGauge() {
        needle.style.transform = "rotate(-75deg)";
        metricLabel.innerText = "ಪಲ್ಸ್ ರೇಟ್: 0% (ನಿಶ್ಚಲ)";
        metricLabel.style.color = "#6a7393";
    }

    function renderLetter() {
        if (pointer < currentTrack.length) {
            displayLetter.innerText = currentTrack[pointer].letter;
        } else {
            displayLetter.style.display = "none";
            alpaBtn.disabled = true;
            mahaBtn.disabled = true;
            msgDisplay.className = "correct-color";
            msgDisplay.innerHTML = `🏆 <b>ಧ್ವನಿ ತರಂಗ ಸಂಶೋಧನೆ ಪೂರ್ಣ!</b><br>ನಿಮ್ಮ ಫಲಿತಾಂಶ ಸ್ಕೋರ್: <b>${successCount} / ${currentTrack.length}</b>`;
            resetBtn.style.display = "inline-block";
        }
    }

    function triggerPulse(userAns) {
        if (pointer >= currentTrack.length) return;
        const currentData = currentTrack[pointer];

        if (userAns === currentData.type) {
            successCount++;
            synthSound(880);
            msgDisplay.innerHTML = `✅ <b>ನಿಖರ ಅಂದಾಜು!</b> "${currentData.letter}" ಅಕ್ಷರವು <b>${currentData.type}</b> ಹೌದು.`;
            msgDisplay.className = "correct-color";
            
            // ಸೂಜಿ ಮತ್ತು ಲೇಬಲ್ ಲೈವ್ ಅಪ್ಡೇಟ್
            needle.style.transform = `rotate(${currentData.degree}deg)`;
            metricLabel.innerText = `ಪಲ್ಸ್ ರೇಟ್: ${currentData.label}`;
            metricLabel.style.color = userAns === 'ಅಲ್ಪಪ್ರಾಣ' ? 'var(--neon-blue)' : 'var(--danger-red)';
        } else {
            synthSound(250);
            msgDisplay.innerHTML = `❌ <b>ಗ್ರಹಿಕೆ ತಪ್ಪಿದೆ!</b> "${currentData.letter}" ಅಕ್ಷರವು ನಿಜವಾಗಿ <b>${currentData.type}</b> ಆಗಿದೆ.`;
            msgDisplay.className = "wrong-color";
            resetGauge();
        }

        pointer++;
        setTimeout(() => { resetGauge(); renderLetter(); }, 1600);
    }

    function restartPulseGame() {
        displayLetter.style.display = "inline-block";
        startPulseGame();
    }

    startPulseGame();
</script>
</body>
</html>
