<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ಬೇಸಿಗೆ ಪದ್ಯ - ಭಾಷಾ ಯುದ್ಧ</title>
    <style>
        :root {
            --space-bg: #04050f;
            --neon-blue: #00d2d3;
            --neon-pink: #ff9ff3;
            --neon-green: #1dd1a1;
            --danger-red: #ff4d4d;
            --panel-bg: #0f1126;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--space-bg);
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            user-select: none;
        }

        .activity-container {
            background: linear-gradient(145deg, #0b0d21, #141736);
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 20px 50px rgba(0, 210, 211, 0.15);
            max-width: 850px;
            width: 100%;
            text-align: center;
            border: 1px solid rgba(0, 210, 211, 0.2);
        }

        h2 {
            color: var(--neon-blue);
            text-shadow: 0 0 12px rgba(0, 210, 211, 0.4);
            font-size: 26px;
        }

        .instruction {
            color: #a4b0be;
            font-size: 15px;
            margin-bottom: 30px;
        }

        /* ಹೊಸ ಬ್ಯಾಟಲ್ ಫೀಲ್ಡ್ ವಿನ್ಯಾಸ */
        .battle-arena {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
        }

        .battle-zone {
            flex: 1;
            height: 180px;
            background: var(--panel-bg);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 8px 16px rgba(0,0,0,0.4);
        }

        #nativeZone {
            border: 3px solid var(--neon-green);
            color: #a3f7bf;
            text-shadow: 0 0 10px rgba(29, 209, 161, 0.3);
        }
        #nativeZone:hover {
            background: rgba(29, 209, 161, 0.08);
            box-shadow: 0 0 25px rgba(29, 209, 161, 0.4);
        }

        #foreignZone {
            border: 3px solid var(--neon-pink);
            color: #ffb6c1;
            text-shadow: 0 0 10px rgba(255, 159, 243, 0.3);
        }
        #foreignZone:hover {
            background: rgba(255, 159, 243, 0.08);
            box-shadow: 0 0 25px rgba(255, 159, 243, 0.4);
        }

        /* ಹಾರುವ ಮ್ಯಾಜಿಕಲ್ ಕಾರ್ಡ್ */
        .slap-card-holder {
            width: 160px;
            height: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .slap-card {
            background: linear-gradient(135deg, #ffffff, #cbd5e1);
            color: #000000;
            font-size: 24px;
            font-weight: 900;
            padding: 15px 25px;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(255,255,255,0.2);
            white-space: nowrap;
            transition: transform 0.2s ease-out;
        }

        .slap-left { transform: translateX(-150px) scale(0.5); opacity: 0; }
        .slap-right { transform: translateX(150px) scale(0.5); opacity: 0; }

        .score-board {
            font-size: 18px;
            font-weight: bold;
            color: #94a3b8;
            margin-top: 15px;
        }

        #feedbackText {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
            min-height: 50px;
            line-height: 1.5;
        }

        .correct-color { color: var(--neon-green); }
        .wrong-color { color: var(--danger-red); }

        .reset-btn {
            margin-top: 20px;
            background: linear-gradient(135deg, var(--neon-blue), var(--neon-pink));
            color: #000000;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            display: none;
        }

        @media (max-width: 650px) {
            .battle-arena { flex-direction: column-reverse; gap: 25px; }
            .battle-zone { width: 100%; height: 120px; }
            .slap-card-holder { height: 60px; }
        }
    </style>
</head>
<body>

<div class="activity-container">
    <h2>೧. ಭಾಷಾ ಯುದ್ಧ: ದೇಶೀಯ ವರ್ಸಸ್ ಅನ್ಯದೇಶೀಯ ⚔️</h2>
    <p class="instruction"><b>ಕಾರ್ಡ್ ಸ್ಲ್ಯಾಪ್ ಗೇಮ್:</b> ಮಧ್ಯದ ಕಾರ್ಡ್ ಓದಿ, ಅದು ಯಾವ ಭಾಷೆಯದ್ದೋ ಆ ಕಡೆಯ ಬೋರ್ಡ್ ಅನ್ನು ತಕ್ಷಣ ಟ್ಯಾಪ್ (Slap) ಮಾಡಿ ಯುದ್ಧ ಗೆಲ್ಲಿ!</p>

    <div class="battle-arena">
        <div class="battle-zone" id="nativeZone" onclick="slapSide('ದೇಶೀಯ ಪದ', 'left')">
            <span>🛡️ ದೇಶೀಯ ಪದ</span>
            <small style="font-size:12px; margin-top:5px; color:#85e3b3;">(ಮೂಲ ಕನ್ನಡ)</small>
        </div>

        <div class="slap-card-holder">
            <div class="slap-card" id="mainCard">ಲೋಡ್...</div>
        </div>

        <div class="battle-zone" id="foreignZone" onclick="slapSide('ಅನ್ಯದೇಶೀಯ ಪದ', 'right')">
            <span>⚡ ಅನ್ಯದೇಶೀಯ</span>
            <small style="font-size:12px; margin-top:5px; color:#fbaed2;">(ಬಾಹ್ಯ ಭಾಷೆಗಳು)</small>
        </div>
    </div>

    <div class="score-board">ಸ್ಕೋರ್ ಪ್ರಗತಿ: <span id="currentScore">0</span> / <span id="maxScore">0</span></div>
    <div id="feedbackText"></div>
    <button class="reset-btn" id="resetBtn" onclick="restartBattle()">ಮತ್ತೆ ಯುದ್ಧ ಆರಂಭಿಸು 🔄</button>
</div>

<script>
    // ಪಿಡಿಎಫ್ ಪುಟ ೩ ಮತ್ತು ೪ ರ ನಿಖರ ಪದಗಳು [cite: 187, 188, 192, 193, 194, 195]
    const battleWords = [
        { word: "ಬೆಲ್ಲ", type: "ದೇಶೀಯ ಪದ", origin: "ಮೂಲ ಅಚ್ಚಗನ್ನಡ ಪದ[cite: 192]." },
        { word: "ಲೈಟು", type: "ಅನ್ಯದೇಶೀಯ ಪದ", origin: "ಇಂಗ್ಲಿಷ್ ಭಾಷೆಯಿಂದ ಬಂದ ಪದ[cite: 193]." },
        { word: "ನೀರು", type: "ದೇಶೀಯ ಪದ", origin: "ಮೂಲ ಅಚ್ಚಗನ್ನಡ ಪದ[cite: 192]." },
        { word: "ಅಲಮಾರು", type: "ಅನ್ಯದೇಶೀಯ ಪದ", origin: "ಪೋರ್ಚುಗೀಸ್ ಭಾಷೆಯಿಂದ ಬಂದ ಪದ[cite: 194]." },
        { word: "ಹೊಲ", type: "ದೇಶೀಯ ಪದ", origin: "ಮೂಲ ಅಚ್ಚಗನ್ನಡ ಪದ[cite: 192]." },
        { word: "ದಿವಾನ", type: "ಅನ್ಯದೇಶೀಯ ಪದ", origin: "ಪರ್ಷಿಯನ್ ಭಾಷೆಯಿಂದ ಬಂದ ಪದ[cite: 195]." },
        { word: "ಆಟ", type: "ದೇಶೀಯ ಪದ", origin: "ಮೂಲ ಅಚ್ಚಗನ್ನಡ ಪದ[cite: 192]." },
        { word: "ಸಾಬೂನು", type: "ಅನ್ಯದೇಶೀಯ ಪದ", origin: "ಪೋರ್ಚುಗೀಸ್ ಭಾಷೆಯಿಂದ ಬಂದ ಪದ[cite: 194]." },
        { word: "ಹುಲ್ಲು", type: "ದೇಶೀಯ ಪದ", origin: "ಮೂಲ ಅಚ್ಚಗನ್ನಡ ಪದ[cite: 192]." },
        { word: "ಸರಕಾರ", type: "ಅನ್ಯದೇಶೀಯ ಪದ", origin: "ಪರ್ಷಿಯನ್ ಭಾಷೆಯಿಂದ ಬಂದ ಪದ[cite: 195]." }
    ];

    let deck = [];
    let activeIdx = 0;
    let points = 0;
    let isSlapped = false;

    const mainCard = document.getElementById('mainCard');
    const currentScore = document.getElementById('currentScore');
    const maxScore = document.getElementById('maxScore');
    const feedbackText = document.getElementById('feedbackText');
    const resetBtn = document.getElementById('resetBtn');

    function playZap(isGood) {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = isGood ? 'triangle' : 'sawtooth';
            osc.frequency.setValueAtTime(isGood ? 950 : 180, ctx.currentTime);
            if(isGood) osc.frequency.exponentialRampToValueAtTime(400, ctx.currentTime + 0.15);
            gain.gain.setValueAtTime(0.08, ctx.currentTime);
            osc.connect(gain); gain.connect(ctx.destination);
            osc.start(); osc.stop(ctx.currentTime + 0.15);
        } catch(e) {}
    }

    function startBattle() {
        deck = [...battleWords].sort(() => Math.random() - 0.5);
        activeIdx = 0;
        points = 0;
        maxScore.innerText = deck.length;
        currentScore.innerText = points;
        feedbackText.innerText = "";
        resetBtn.style.display = "none";
        nextCard();
    }

    function nextCard() {
        if (activeIdx < deck.length) {
            isSlapped = false;
            mainCard.style.display = "block";
            mainCard.className = "slap-card";
            mainCard.innerText = deck[activeIdx].word;
        } else {
            mainCard.style.display = "none";
            feedbackMsgScreen();
        }
    }

    function slapSide(userChoice, side) {
        if (isSlapped || activeIdx >= deck.length) return;
        isSlapped = true;

        const currentObj = deck[activeIdx];
        
        if (userChoice === currentObj.type) {
            points++;
            currentScore.innerText = points;
            feedbackText.className = "correct-color";
            feedbackText.innerHTML = `💥 <b>ಪರಿಪೂರ್ಣ ಸ್ಲ್ಯಾಪ್!</b> "${currentObj.word}" ನಿಜವಾಗಿ <b>${currentObj.type}</b>.<br><small style="color:#cbd5e1;">🌐 <b>ಮೂಲ:</b> ${currentObj.origin}</small>`;
            playZap(true);
        } else {
            feedbackText.className = "wrong-color";
            feedbackText.innerHTML = `❌ <b>ಯುದ್ಧದಲ್ಲಿ ಹಿನ್ನಡೆ!</b> "${currentObj.word}" ಒಂದು <b>${currentObj.type}</b> ಆಗಿದೆ.<br><small style="color:#cbd5e1;">🌐 <b>ಮೂಲ:</b> ${currentObj.origin}</small>`;
            playZap(false);
        }

        mainCard.classList.add(side === 'left' ? 'slap-left' : 'slap-right');

        activeIdx++;
        setTimeout(nextCard, 1400);
    }

    function feedbackMsgScreen() {
        feedbackText.className = "correct-color";
        feedbackText.innerHTML = `⚔️ <b>ಭಾಷಾ ಮಹಾಯುದ್ಧ ಮುಕ್ತಾಯಗೊಂಡಿದೆ!</b><br>ನಿಮ್ಮ ವೀರತ್ವದ ಸ್ಕೋರ್: <b>${points} / ${deck.length}</b>`;
        resetBtn.style.display = "inline-block";
    }

    function restartBattle() { startBattle(); }
    startBattle();
</script>
</body>
</html>
