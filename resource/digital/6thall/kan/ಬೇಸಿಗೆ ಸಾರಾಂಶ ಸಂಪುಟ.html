<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ಬೇಸಿಗೆ ಪದ್ಯ - ಪ್ಯಾರಾವಾರು ಸಾರಾಂಶ ಸಂಪುಟ (ನಿಖರ ಆವೃತ್ತಿ)</title>
    <style>
        :root {
            --bg-space: #0c0f1d;
            --neon-orange: #ff7f50;
            --neon-gold: #ffd32a;
            --neon-teal: #00d2d3;
            --card-dark: #161b33;
            --text-light: #f8fafc;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-space);
            color: var(--text-light);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .activity-container {
            background: linear-gradient(145deg, #111639, #1f2754);
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 20px 50px rgba(255, 127, 80, 0.15);
            max-width: 850px;
            width: 100%;
            text-align: center;
            border: 1px solid rgba(255, 127, 80, 0.2);
        }

        h2 {
            color: var(--neon-gold);
            margin-bottom: 5px;
            text-shadow: 0 0 15px rgba(255, 211, 42, 0.4);
            font-size: 26px;
        }

        .instruction {
            color: #94a3b8;
            font-size: 16px;
            margin-bottom: 30px;
        }

        /* ೪ ಪ್ಯಾರಾಗಳ ಟ್ಯಾಬ್ ಬಟನ್‌ಗಳು */
        .stanza-tabs {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 30px;
        }

        .tab-btn {
            background-color: #1e293b;
            border: 2px solid #334155;
            color: #cbd5e1;
            padding: 12px 28px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        .tab-btn:hover {
            border-color: var(--neon-orange);
            color: #ffffff;
            transform: translateY(-2px);
        }

        .tab-btn.active-tab {
            background: linear-gradient(135deg, var(--neon-orange), #e15f41);
            border-color: #fffeee;
            color: #ffffff;
            box-shadow: 0 0 20px rgba(255, 127, 80, 0.4);
            transform: scale(1.05);
        }

        /* ಸ್ಪ್ಲಿಟ್ ಪ್ರದರ್ಶನ ವಲಯ */
        .display-zone {
            display: flex;
            gap: 25px;
            margin-top: 20px;
        }

        .panel {
            flex: 1;
            background: var(--card-dark);
            border-radius: 20px;
            padding: 25px;
            border: 2px solid #232d60;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            text-align: left;
            transition: all 0.4s ease;
            min-height: 240px;
        }

        .panel-title {
            font-size: 15px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
            padding-bottom: 8px;
            border-bottom: 1px solid #232d60;
        }

        .left-title { color: var(--neon-gold); }
        .right-title { color: var(--neon-teal); }

        .poem-lines-box {
            font-size: 19px;
            font-weight: bold;
            line-height: 1.7;
            color: #f1f5f9;
            white-space: pre-line;
            animation: fadeIn 0.5s ease-in-out;
        }

        .summary-box {
            font-size: 16px;
            line-height: 1.7;
            color: #cbd5e1;
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 700px) {
            .display-zone { flex-direction: column; }
            .stanza-tabs { flex-direction: column; }
            .tab-btn { width: 100%; }
        }
    </style>
</head>
<body>

<div class="activity-container">
    <h2>೧. ಬೇಸಿಗೆ ಪದ್ಯ: ನಿಖರ ಕಾವ್ಯ ಸಾರಾಂಶ ಸಂಪುಟ ☀️📖</h2>
    <p class="instruction"><b>ಡಿಜಿಟಲ್ ಇಂಟರಾಕ್ಷನ್:</b> ಪಠ್ಯಪುಸ್ತಕದ ನಿಖರವಾದ ೪ ಪ್ಯಾರಾಗಳ ಬಟನ್ ಮೇಲೆ ಕ್ಲಿಕ್ ಮಾಡಿ, ಮೂಲ ಕಾವ್ಯದ ಸಾಲುಗಳು ಮತ್ತು ೪-೫ ಸಾಲುಗಳ ಅಲ್ಟ್ರಾ-ಮಾಡರ್ನ್ ಸಾರಾಂಶವನ್ನು ಒಟ್ಟಿಗೆ ವೀಕ್ಷಿಸಿ!</p>

    <div class="stanza-tabs">
        <button class="tab-btn active-tab" id="btn_1" onclick="showStanza(1)">ಪ್ಯಾರಾ ೧ 🥳</button>
        <button class="tab-btn" id="btn_2" onclick="showStanza(2)">ಪ್ಯಾರಾ ೨ 🌧️</button>
        <button class="tab-btn" id="btn_3" onclick="showStanza(3)">ಪ್ಯಾರಾ ೩ 🌳</button>
        <button class="tab-btn" id="btn_4" onclick="showStanza(4)">ಪ್ಯಾರಾ ೪ 🤝</button>
    </div>

    <div class="display-zone">
        <div class="panel">
            <div class="panel-title left-title">📜 ಪದ್ಯದ ಮೂಲ ಸಾಲುಗಳು</div>
            <div class="poem-lines-box" id="poemTextTarget">ಲೋಡ್ ಆಗುತ್ತಿದೆ...</div>
        </div>

        <div class="panel" style="border-color: #00d2d3; background: linear-gradient(180deg, #161b33, #0a252e);">
            <div class="panel-title right-title">💡 ೪-೫ ಸಾಲುಗಳ ಸಾರಾಂಶ</div>
            <div class="summary-box" id="summaryTextTarget">ಲೋಡ್ ಆಗುತ್ತಿದೆ...</div>
        </div>
    </div>
</div>

<script>
    // ಪಠ್ಯಪುಸ್ತಕದ ಚಿತ್ರದ ಆಧಾರದ ಮೇಲೆ ಸಿದ್ಧಪಡಿಸಲಾದ ೪ ಪ್ಯಾರಾಗಳ ಡೇಟಾಬೇಸ್
    const stanzaDatabase = {
        1: {
            poem: "ಬಂದಿದೆ ಬೇಸಿಗೆ ರಜಾ\nಇದ್ದರೂ ಬಿಸಿಲಿನ ಸಜಾ\nಬನ್ನಿ ಆಡೋಣ,\nಸೂರ್ಯನ ಮಹಿಮೆಯ ಹಾಡೋಣ.",
            summary: "• ವಿದ್ಯಾರ್ಥಿಗಳಿಗೆ ಅತ್ಯಂತ ಸಂತೋಷವನ್ನು ನೀಡುವ ಬೇಸಿಗೆಯ ರಜೆಗಳು ಆರಂಭವಾಗಿವೆ .<br>• ಬೇಸಿಗೆಯ ಕಾಲದಲ್ಲಿ ಪ್ರಖರವಾದ ಬಿಸಿಲಿನ ಕಠಿಣ ಶಿಕ್ಷೆ (ಸಜಾ) ಇದ್ದೇ ಇರುತ್ತದೆ .<br>• ಆದರೂ ಬಿಸಿಲಿಗೆ ಹೆದರದೆ ಎಲ್ಲರೂ ಒಟ್ಟಾಗಿ ಮೈದಾನದಲ್ಲಿ ಆಟವಾಡಲು ಕವಿ ಆಹ್ವಾನಿಸುತ್ತಿದ್ದಾರೆ .<br>• ಜಗತ್ತಿಗೆ ಬೆಳಕನ್ನು ನೀಡುವ ಸೂರ್ಯನ ಅಪಾರ ಶಕ್ತಿ ಮತ್ತು ಮಹಿಮೆಯನ್ನು ಕೊಂಡಾಡೋಣ ಎನ್ನುತ್ತಾರೆ .<br>• ರಜೆಯ ಉತ್ಸಾಹದಲ್ಲಿ ಬಿಸಿಲಿನ ತಾಪವನ್ನು ನಗುನಗುತ್ತಾ ಎದುರಿಸುವ ಧನಾತ್ಮಕ ಚಿಂತನೆ ಇಲ್ಲಿದೆ."
        },
        2: {
            poem: "ಏಕೆ ರವಿಗಿಂತ ತಾಪ?\nಯಾರ ಮೇಲವನ ಕೋಪ?\nಎಂದು ಹಳಿಯಬೇಡಿ,\nಸೂರ್ಯನ ತಪ್ಪು ತಿಳಿಯಬೇಡಿ,\nಮೋಡ ಕೂಡಿಸಲು, ಇಳೆಗೆ ಮಳೆ ತರಲು\nದುಡಿಯುತಿಹನು, ಪಾಪ!",
            summary: "• ಸೂರ್ಯನು ಇಷ್ಟೊಂದು ತಾಪವನ್ನು ಏಕೆ ಹೊರಸೂಸುತ್ತಿದ್ದಾನೆ ಎಂದು ಜನರು ಆಶ್ಚರ್ಯ ಪಡುತ್ತಾರೆ .<br>• ಸೂರ್ಯನಿಗೆ ಜಗತ್ತಿನ ಮೇಲೆ ಏನಾದರೂ ಕೋಪವಿದೆಯೇ ಎಂದು ಜನರು ಹಳಿಯುತ್ತಾರೆ (ದೂಷಿಸುತ್ತಾರೆ) .<br>• ಆದರೆ ಸೂರ್ಯನನ್ನು ಯಾರೂ ತಪ್ಪು ತಿಳಿಯಬಾರದು, ಆತ ಸ್ವಾರ್ಥಕ್ಕಾಗಿ ಹೀಗೆ ಮಾಡುತ್ತಿಲ್ಲ .<br>• ಭೂಮಿಯ ಮೇಲಿನ ನೀರನ್ನು ಆವಿಯಾಗಿಸಿ, ಆಕಾಶದಲ್ಲಿ ಮೋಡಗಳನ್ನು ಕೂಡಿಸಲು ಆತ ಶ್ರಮಿಸುತ್ತಿದ್ದಾನೆ .<br>• ಒಣಗುತ್ತಿರುವ ಇಳೆಗೆ (ಭೂಮಿಗೆ) ತಂಪಾದ ಮಳೆಯನ್ನು ತರಲು ಆ ಸೂರ್ಯನು ಹಗಲಿರುಳು ದುಡಿಯುತ್ತಿದ್ದಾನೆ."
        },
        3: {
            poem: "ಭೂಮಿಯ ಪೋಷಕ ಸೂರ್ಯ\nಭೂಮಿಗವನು ಅನಿವಾರ್ಯ\nಹೊಗಳಿಕೆ ಬೇಕಿಲ್ಲ,\nತೆಗಳಿದರೆ ಅವ ಕುಗ್ಗುವುದಿಲ್ಲ.\nಬೆಳಕ ನೀಡುವನು, ಬಿಸಿಯನೂಡುವನು\nಮರೆಯದೆ ಕರ್ತವ್ಯ.",
            summary: "• ಸೂರ್ಯನು ಇಡೀ ಜೀವ ಸಂಕುಲವನ್ನು ಸಲಹುವ ಜಗತ್ತಿನ ನಿಜವಾದ ಪೋಷಕ (ಪಾಲಕ) ಆಗಿದ್ದಾನೆ .<br>• ಸೂರ್ಯನ ಬೆಳಕಿಲ್ಲದೆ ಭೂಮಿಯ ಮೇಲೆ ಜೀವ ಇರಲು ಸಾಧ್ಯವೇ ಇಲ್ಲ, ಆತ ನಮಗೆ ಅತ್ಯಗತ್ಯ (ಅನಿವಾರ್ಯ) .<br>• ತನಗೆ ಯಾರೂ ಹೊಗಳಿಕೆ ನೀಡಬೇಕೆಂದು ಸೂರ್ಯನು ಎಂದಿಗೂ ಆಸೆಪಡುವುದಿಲ್ಲ .<br>• ಬಿಸಿಲು ಜಾಸ್ತಿಯೆಂದು ಜನರು ತೆಗಳಿದರೂ (ನಿಂದಿಸಿದರೂ) ಆತ ಧೃತಿಗೆಟ್ಟು ಕುಗ್ಗುವುದಿಲ್ಲ .<br>• ಜಗತ್ತಿಗೆ ಬೆಳಕನ್ನು ಹಾಗೂ ಬಿಸಿಯನ್ನು ಉಣಿಸಿ ತನ್ನ ಕರ್ತವ್ಯವನ್ನು ಸದಾ ಮರೆಯದೆ ಪಾಲಿಸುತ್ತಾನೆ."
        },
        4: {
            poem: "ಇಂಥ ಬಿರು ಬیسیಲಿನಲ್ಲಿ\nಮರಾ ಗಿಡಾ ಪೊದೆ ಬಳ್ಳಿ\nಕಂಗಾಲಾಗಿಲ್ಲ,\nನೋಡಿ ರಂಗಾಗಿವೆ ಎಲ್ಲ\nಚಿಗುರು ಹೂತೊಟ್ಟು, ಹಣ್ಣು ಮಿಡಿ ಬಿಟ್ಟು,\nಇವೆ ಸಂಭ್ರಮದಲ್ಲಿ.\n\nಸೂರ್ಯನಿಂದ ಕಲಿಯೋಣ.\nಪ್ರಕೃತಿಯಂತೆ ನಲಿಯೋಣ.\nಕಷ್ಟಗಳಿಗಂಜದೆ,\nನಮ್ಮ ಕರ್ತವ್ಯ ಮರೆಯದೆ,\nನಲಿಯುತ ಬಾಳಿ, ನಲಿವನು ಹಂಚಿ,\nಧನ್ಯತೆ ಗಳಿಸೋಣ.",
            summary: "• ಕಠಿಣವಾದ ಬಿರು ಬಿಸಿಲಿದ್ದರೂ ಪ್ರಕೃತಿಯ ಮರ-ಗಿಡಗಳು ಹೆದರಿ ಕಂಗಾಲಾಗಿಲ್ಲ .<br>• ಬದಲಾಗಿ ಗಿಡಗಳು ಹೊಸ ಚಿಗುರು, ಹೂವು ಹಾಗೂ ಹಣ್ಣು-ಮಿಡಿಗಳನ್ನು ಬಿಟ್ಟು ಸಂಭ್ರಮದಲ್ಲಿ ರಂಗಾಗಿವೆ .<br>• ಸದಾ ಕಾಯಕದಲ್ಲಿ ನಿರತನಾಗಿರುವ ಸೂರ್ಯನಿಂದ ನಾವು ಕರ್ತವ್ಯ ನಿಷ್ಠೆಯನ್ನು ಕಲಿಯಬೇಕು .<br>• ಬದುಕಿನಲ್ಲಿ ಎದುರಾಗುವ ಯಾವುದೇ ಕಷ್ಟಗಳಿಗೂ ಅಂಜದೆ (ಹೆದರದೆ) ಮುನ್ನಡೆಯಬೇಕು .<br>• ನಮ್ಮ ಜವಾಬ್ದಾರಿಯನ್ನು ಮರೆಯದೆ, ಎಲ್ಲರಿಗೂ ಸಂತೋಷವನ್ನು ಹಂಚಿ ಬದುಕಿನ ಧನ್ಯತೆ (ಸಂತೃಪ್ತಿ) ಪಡೆಯೋಣ."
        }
    };

    const poemTextTarget = document.getElementById('poemTextTarget');
    const summaryTextTarget = document.getElementById('summaryTextTarget');

    function playFlipSound() {
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(450, audioCtx.currentTime);
            oscillator.frequency.exponentialRampToValueAtTime(900, audioCtx.currentTime + 0.15);
            gainNode.gain.setValueAtTime(0.08, audioCtx.currentTime);
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.15);
        } catch (e) {}
    }

    function showStanza(stanzaNumber) {
        const allButtons = document.querySelectorAll('.tab-btn');
        allButtons.forEach(btn => btn.classList.remove('active-tab'));

        document.getElementById(`btn_${stanzaNumber}`).classList.add('active-tab');

        const currentData = stanzaDatabase[stanzaNumber];
        
        poemTextTarget.innerHTML = currentData.poem;
        summaryTextTarget.innerHTML = currentData.summary;

        playFlipSound();
    }

    // ಮೊದಲ ಪುಟ ಆಟೋಮ್ಯಾಟಿಕ್ ಆಗಿ ಲೋಡ್ ಆಗುತ್ತದೆ
    showStanza(1);
</script>

</body>
</html>
