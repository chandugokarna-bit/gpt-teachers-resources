<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ಬೇಸಿಗೆ ಪದ್ಯ - ಅಲ್ಪಪ್ರಾಣ ಮಹಾಪ್ರಾಣ ಆಟ</title>
    <style>
        :root {
            --bg-space: #060814;
            --neon-gold: #ffd32a;
            --neon-blue: #00d2d3;
            --neon-green: #1dd1a1;
            --danger-red: #ff4d4d;
            --card-dark: #0f1123;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-space);
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            user-select: none;
        }

        .activity-container {
            background: linear-gradient(145deg, #0f1229, #191d3a);
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 15px 40px rgba(255, 211, 42, 0.15);
            max-width: 750px;
            width: 100%;
            text-align: center;
            border: 1px solid rgba(255, 211, 42, 0.2);
        }

        h2 {
            color: var(--neon-gold);
            text-shadow: 0 0 10px rgba(255, 211, 42, 0.4);
            font-size: 26px;
            margin-bottom: 5px;
        }

        .instruction { color: #a0a5c0; font-size: 15px; margin-bottom: 25px; }

        /* ವರ್ಚುವಲ್ ರಿಬ್ಬನ್ ವಲಯ */
        .ribbon-zone {
            background: #040610;
            border: 1px solid #23274c;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .ribbon-line {
            width: 12px;
            height: 100px;
            background: linear-gradient(180deg, #ff7f50, #ff4757);
            border-radius: 6px;
            box-shadow: 0 0 15px rgba(255, 71, 87, 0.5);
            transform-origin: top center;
        }

        /* ಉಚ್ಚಾರಣೆಯ ತರಂಗದ ಅನಿಮೇಷನ್ ಗಳು */
        .wave-low { animation: waveLowAnim 0.4s infinite alternate ease-in-out; }
        .wave-high { animation: waveHighAnim 0.2s infinite alternate ease-in-out; }

        @keyframes waveLowAnim { 
            0% { transform: rotate(-5deg) scaleX(1.1); } 
            100% { transform: rotate(5deg) scaleX(1.1); } 
        }
        @keyframes waveHighAnim { 
            0% { transform: rotate(-35deg) scaleX(1.5); filter: hue-rotate(90deg); } 
            100% { transform: rotate(35deg) scaleX(1.5); filter: hue-rotate(90deg); } 
        }

        .ribbon-status { font-size: 14px; font-weight: bold; color: #8a92a6; margin-top: 15px; }

        .letter-display-card {
            background: var(--card-dark);
            border: 2px dashed #23274c;
            border-radius: 18px;
            padding: 20px;
            font-size: 45px;
            font-weight: 900;
            color: var(--neon-blue);
            text-shadow: 0 0 15px rgba(0, 210, 211, 0.4);
            margin-bottom: 25px;
            display: inline-block;
            min-width: 120px;
        }

        .btn-group { display: flex; justify-content: center; gap: 20px; }
        .action-btn {
            padding: 15px 35px; font-size: 18px; font-weight: bold; color: white;
            border: none; border-radius: 12px; cursor: pointer; transition: all 0.2s; min-width: 150px;
        }
        .btn-alpa { background: #2980b9; box-shadow: 0 4px 15px rgba(41, 128, 185, 0.3); }
        .btn-alpa:hover:not(:disabled) { transform: translateY(-2px); background: #3498db; }
        .btn-maha { background: #8e44ad; box-shadow: 0 4px 15px rgba(142, 68, 173, 0.3); }
        .btn-maha:hover:not(:disabled) { transform: translateY(-2px); background: #9b59b6; }

        #feedbackText { font-size: 18px; font-weight: bold; min-height: 27px; margin-top: 20px; }
        .reset-btn {
            margin-top: 20px; background: linear-gradient(135deg, var(--neon-gold), #ff9f43);
            color: black; border: none; padding: 12px 30px; font-size: 16px; font-weight: bold;
            border-radius: 8px; cursor: pointer; display: none;
        }
    </style>
</head>
<body>

<div class="activity-container">
    <h2>೨. ಧ್ವನಿ ತರಂಗ: ಅಲ್ಪಪ್ರಾಣ ಮಹಾಪ್ರಾಣ ಅಕ್ಷರಗಳ ಸವಾಲು ⚡🎤</h2>
    <p class="instruction"><b>ಧ್ವನಿ ವಿಜ್ಞಾನದ ಪ್ರಯೋಗ ಆಟ:</b> ಅಕ್ಷರವನ್ನು ನೋಡಿ ಅದು ಉಚ್ಚಾರಣೆಯ ನಿಯಮದಂತೆ 'ಅಲ್ಪಪ್ರಾಣವೋ' ಅಥವಾ 'ಮಹಾಪ್ರಾಣವೋ' ಎಂದು ಆರಿಸಿ ರಿಬ್ಬನ್ ಅಲುಗಾಡಿಸಿ!</p>

    <div class="ribbon-zone">
        <div class="ribbon-line" id="ribbonNode"></div>
        <div class="ribbon-status" id="ribbonStatus">ಪ್ರಸ್ತುತ: ಗಾಳಿ ನಿಶ್ಚಲವಾಗಿದೆ 🍃</div>
    </div>

    <div class="letter-display-card" id="letterCard">ಕ</div>

    <div class="btn-group">
        <button class="action-btn btn-alpa" id="btnAlpa" onclick="processPrana('ಅಲ್ಪಪ್ರಾಣ')">ಅಲ್ಪಪ್ರಾಣ 🍃</button>
        <button class="action-btn btn-maha" id="btnMaha" onclick="processPrana('ಮಹಾಪ್ರಾಣ')">ಮಹಾಪ್ರಾಣ 🌪️</button>
    </div>

    <div id="feedbackText"></div>
    <button class="reset-btn" id="resetBtn" onclick="resetGame()">ಮತ್ತೆ ಆಡಿ 🔄</button>
</div>

<script>
    // ಕಾಗದ/ರಿಬ್ಬನ್ ಚಟುವಟಿಕೆ ಆಧಾರಿತ ಅಕ್ಷರಗಳ ಪಟ್ಟಿ
    const alphabetDatabase = [
        { letter: "ಕ", type: "ಅಲ್ಪಪ್ರಾಣ", desc: "ಕಡಿಮೆ ಉಸಿರಿನ ಪ್ರಾಣಾಕ್ಷರ." },
        { letter: "ಖ", type: "ಮಹಾಪ್ರಾಣ", desc: "ಹೆಚ್ಚಿನ ಉಸಿರು ಹೊರಬರುವುದರಿಂದ ಕಾಗದ ತೀವ್ರವಾಗಿ ಅಲುಗಾಡುತ್ತದೆ!" },
        { letter: "ಗ", type: "ಅಲ್ಪಪ್ರಾಣ", desc: "ಸಹಜವಾಗಿ ಉಚ್ಚರಿಸುವ ಅಲ್ಪಪ್ರಾಣ ವ್ಯಂಜನ." },
        { letter: "ಘ", type: "ಮಹಾಪ್ರಾಣ", desc: "ಗಂಟಲ ಆಳದಿಂದ ಹೆಚ್ಚಿನ ಒತ್ತು ಕೊಟ್ಟು ಉಚ್ಚರಿಸುವ ಮಹಾಪ್ರಾಣ." },
        { letter: "ಚ", type: "ಅಲ್ಪಪ್ರಾಣ", desc: "ಕಡಿಮೆ ಪ್ರಾಣವಾಯು ಬೇಡುವ ಅಕ್ಷರ." },
        { letter: "ಛ", type: "ಮಹಾಪ್ರಾಣ", desc: "ಹೆಚ್ಚಿನ ಗಾಳಿಯ ಒತ್ತಡದೊಂದಿಗೆ ಹೊರಬರುವ ಮಹಾಪ್ರಾಣಾಕ್ಷರ!" },
        { letter: "ಟ", type: "ಅಲ್ಪಪ್ರಾಣ", desc: "ಸರಳ ಉಚ್ಚಾರಣೆಯ ಅಲ್ಪಪ್ರಾಣ." },
        { letter: "ಠ", type: "ಮಹಾಪ್ರಾಣ", desc: "ಉಸಿರನ್ನು ಜೋರಾಗಿ ಹೊರಹಾಕಿ ಬಿಡುವ ಮಹಾಪ್ರಾಣ ಶಬ್ದ." }
    ];

    let shuffledLetters = [];
    let letterIndex = 0;
    let letterScore = 0;

    const ribbonNode = document.getElementById('ribbonNode');
    const ribbonStatus = document.getElementById('ribbonStatus');
    const letterCard = document.getElementById('letterCard');
    const feedbackText = document.getElementById('feedbackText');
    const resetBtn = document.getElementById('resetBtn');
    const btnAlpa = document.getElementById('btnAlpa');
    const btnMaha = document.getElementById('btnMaha');

    function playTone(freq) {
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.18);
        } catch(e) {}
    }

    function initGame() {
        shuffledLetters = [...alphabetDatabase].sort(() => Math.random() - 0.5);
        letterIndex = 0; letterScore = 0;
        feedbackText.innerText = "";
        resetBtn.style.display = "none";
        letterCard.style.display = "inline-block";
        btnAlpa.disabled = false; btnMaha.disabled = false;
        resetRibbon(); displayLetter();
    }

    function resetRibbon() {
        ribbonNode.className = "ribbon-line";
        ribbonStatus.innerText = "ಪ್ರಸ್ತುತ: ಗಾಳಿ ನಿಶ್ಚಲವಾಗಿದೆ 🍃";
    }

    function displayLetter() {
        if (letterIndex < shuffledLetters.length) {
            letterCard.innerText = shuffledLetters[letterIndex].letter;
        } else {
            letterCard.style.display = "none";
            btnAlpa.disabled = true; btnMaha.disabled = true;
            feedbackText.innerHTML = `<span style='color:var(--neon-green);'>🎉 <b>ಧ್ವನಿ ವಿಜ್ಞಾನದ ಮಿಷನ್ ಕಂಪ್ಲೀಟ್!</b></span><br>ನಿಮ್ಮ ಒಟ್ಟು ಸ್ಕೋರ್: <b>${letterScore} / ${shuffledLetters.length}</b>`;
            resetBtn.style.display = "inline-block";
        }
    }

    function processPrana(choice) {
        if (letterIndex >= shuffledLetters.length) return;
        const currentData = shuffledLetters[letterIndex];

        if (choice === currentData.type) {
            letterScore++;
            playTone(900);
            feedbackText.innerHTML = `<span style='color:var(--neon-green);'>✅ ಸರಿ ಉತ್ತರ!</span> "<b>${currentData.letter}</b>" ಎಂಬುದು <b>${currentObj = currentData.type}</b> ಆಗಿದೆ.`;
            
            // ಲೈವ್ ರಿಬ್ಬನ್ ಅನಿಮೇಷನ್ ಟ್ರಿಗರ್
            if (choice === "ಅಲ್ಪಪ್ರಾಣ") {
                ribbonNode.className = "ribbon-line wave-low";
                ribbonStatus.innerText = "💨 ಅಲ್ಪ ಗಾಳಿ: ಕಾಗದ/ರಿಬ್ಬನ್ ಮೆಲ್ಲನೆ ಅಲುಗಾಡಿತು!";
            } else {
                ribbonNode.className = "ribbon-line wave-high";
                ribbonStatus.innerText = "🌪️ ಮಹಾ ಗಾಳಿ: ಕಾಗದ/ರಿಬ್ಬನ್ ಭಾರಿ ರಭಸವಾಗಿ ಅಲುಗಾಡಿತು!";
            }
        } else {
            playTone(220);
            feedbackText.innerHTML = `<span style='color:var(--danger-red);'>❌ ತಪ್ಪು ಉತ್ತರ!</span> "<b>${currentData.letter}</b>" ನಿಜವಾಗಿ <b>${currentData.type}</b> ಆಗಿದೆ.`;
            resetRibbon();
        }

        letterIndex++;
        setTimeout(() => { resetRibbon(); displayLetter(); }, 1600);
    }

    function resetGame() { initGame(); }
    initGame();
</script>
</body>
</html>
