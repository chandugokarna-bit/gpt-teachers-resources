<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ಐದನೇ ಚಟುವಟಿಕೆ - ಪ್ರಕೃತಿ ರಕ್ಷಕ ಕ್ವಿಜ್</title>
    <style>
        :root {
            --primary-color: #2ecc71;
            --error-color: #e74c3c;
            --dark-color: #2c3e50;
            --bg-color: #f4f9f4;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .quiz-container {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.08);
            max-width: 750px;
            width: 100%;
            text-align: center;
        }

        h2 {
            color: #27ae60;
            margin-bottom: 5px;
        }

        .instruction {
            color: #7f8c8d;
            font-size: 15px;
            margin-bottom: 25px;
        }

        /* ಪರಿಸರ ಪ್ರೋಗ್ರೆಸ್ ಬಾರ್ (ಗಿಡದ ಬೆಳವಣಿಗೆ) */
        .eco-progress-zone {
            background: #f1f2f6;
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .plant-avatar {
            font-size: 55px;
            transition: transform 0.3s ease;
        }

        .progress-bar-container {
            width: 80%;
            background-color: #dfe4ea;
            height: 12px;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #2ecc71, #26de81);
            transition: width 0.5s ease;
        }

        /* ಪ್ರಶ್ನೆಯ ಕಾರ್ಡ್ ಶೈಲಿ */
        .question-card {
            background: #ffffff;
            border: 2px solid #f1f2f6;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
        }

        .question-text {
            font-size: 20px;
            font-weight: bold;
            color: var(--dark-color);
            margin-bottom: 20px;
        }

        /* ಆಯ್ಕೆಗಳ ಬಟನ್‌ಗಳು */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .option-btn {
            background-color: #ffffff;
            border: 2px solid #ced6e0;
            padding: 15px;
            font-size: 16px;
            font-weight: 500;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--dark-color);
            text-align: center;
        }

        .option-btn:hover:not(:disabled) {
            background-color: #f1f2f6;
            border-color: #a4b0be;
            transform: translateY(-2px);
        }

        /* ಸರಿಯಾದ ಮತ್ತು ತಪ್ಪಾದ ಆಯ್ಕೆಗಳ ಎಫೆಕ್ಟ್ */
        .option-btn.correct-ans {
            background-color: #e3faf2 !important;
            border-color: var(--primary-color) !important;
            color: #0f9b74 !important;
            font-weight: bold;
        }

        .option-btn.wrong-ans {
            background-color: #fff5f5 !important;
            border-color: var(--error-color) !important;
            color: #b33939 !important;
        }

        .result-message {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
            min-height: 27px;
        }

        .next-btn {
            margin-top: 20px;
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            display: none;
            font-weight: bold;
            transition: background 0.2s;
        }

        .next-btn:hover {
            background-color: #218c53;
        }

        @media (max-width: 600px) {
            .options-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <h2>೫. ಪ್ರಕೃತಿ ರಕ್ಷಕ ಕ್ವಿಜ್ ಆಟ 🌱</h2>
    <p class="instruction">'ಬೇಸಿಗೆ' ಪದ್ಯದ ಆಧಾರದ ಮೇಲೆ ಸರಿಯಾದ ಉತ್ತರ ನೀಡಿ, ಒಣಗುತ್ತಿರುವ ಗಿಡವನ್ನು ಹಸಿರಾಗಿ ಬೆಳೆಸಿ!</p>

    <div class="eco-progress-zone">
        <div class="plant-avatar" id="plantIcon">🥀</div>
        <div class="progress-bar-container">
            <div class="progress-fill" id="progressBar"></div>
        </div>
        <div style="font-size: 14px; font-weight: bold; color: #7f8c8d;">ಗಿಡದ ಆರೋಗ್ಯದ ಮಟ್ಟ</div>
    </div>

    <div class="question-card" id="quizZone">
        <div class="question-text" id="qText">ಪ್ರಶ್ನೆ ಲೋಡ್ ಆಗುತ್ತಿದೆ...</div>
        <div class="options-grid" id="optionsGroup">
            </div>
    </div>

    <div class="result-message" id="resMsg"></div>
    <button class="next-btn" id="nextQuestionBtn" onclick="loadNextQuestion()">ಮುಂದಿನ ಪ್ರಶ್ನೆ ➡️</button>
</div>

<script>
    // ಪಠ್ಯಪುಸ್ತಕದ 'ಬೇಸಿಗೆ' ಪಾಠದ ಆಧಾರಿತ ಪ್ರಶ್ನೆಗಳು
    const quizQuestions = [
        {
            question: "೧. ಬಿರು ಬಿಸಿಲಿನ ಬೇಸಿಗೆ ಕಾಲ ಬಂದಾಗ ಮಕ್ಕಳಿಗೆ ಏನು ಸಿಗುತ್ತದೆ?",
            options: ["ಹೊಸ ಬಟ್ಟೆ", "ಬೇಸಿಗೆ ರಜಾ", "ಚಳಿಯ ಹಿತ", "ಪ್ರವಾಸದ ಆಫರ್"],
            correct: 1
        },
        {
            question: "೨. ಸೂರ್ಯನು ಇಷ್ಟೊಂದು ತಾಪದಿಂದ ದಿನವಿಡೀ ಏಕಾಗಿ ದುಡಿಯುತ್ತಿದ್ದಾನೆ?",
            options: ["ಕೋಪ ತೀರಿಸಿಕೊಳ್ಳಲು", "ಮೋಡ ಕೂಡಿಸಿ ಇಳೆಗೆ ಮಳೆ ತರಲು", "ಬೆಳಕನ್ನು ಬಚ್ಚಿಡಲು", "ಯಾರನ್ನೂ ಆಡಲು ಬಿಡದಿರಲು"],
            correct: 1
        },
        {
            question: "೩. ಬಿರು ಬಿಸಿಲಿದ್ದರೂ ಕಂಗಾಲಾಗದೆ ಸಂಭ್ರಮದಿಂದ ರಂಗಾಗಿರುವುವು ಯಾವುವು?",
            options: ["ಹಳ್ಳಿಯ ಸಂತೆಗಳು", "ಮನುಷ್ಯರು ಮತ್ತು ಪ್ರಾಣಿಗಳು", "ಮರ ಗಿಡ ಪೊದೆ ಬಳ್ಳಿಗಳು", "ಸಮುದ್ರದ ಅಲೆಗಳು"],
            correct: 2
        },
        {
            question: "೪. 'ಭೂಮಿಯ ಪೋಷಕ' ಎಂದು ಪದ್ಯದಲ್ಲಿ ಯಾರನ್ನು ಕರೆಯಲಾಗಿದೆ?",
            options: ["ಮೋಡ", "ಮಳೆ", "ಚಂದ್ರ", "ಸೂರ್ಯ"],
            correct: 3
        },
        {
            question: "೫. ಕಷ್ಟಗಳಿಗಂಜದೆ ನಮ್ಮ ಕರ್ತವ್ಯ ಮರೆಯದೆ ಬಾಳಿದರೆ ಏನನ್ನು ಗಳಿಸಬಹುದು?",
            options: ["ಧನ್ಯತೆ", "ಹೆಚ್ಚಿನ ಹಣ", "ಹೊಗಳಿಕೆ", "ರಜಾ ದಿನಗಳು"],
            correct: 0
        }
    ];

    let currentQIndex = 0;
    let score = 0;

    // ಗಿಡದ ಬೆಳವಣಿಗೆಯ ಎಮೋಜಿ ಹಂತಗಳು
    const plantStages = ["🥀", "🌱", "🌿", "🪴", "🌳", "🌸"];

    const qText = document.getElementById('qText');
    const optionsGroup = document.getElementById('optionsGroup');
    const resMsg = document.getElementById('resMsg');
    const nextBtn = document.getElementById('nextQuestionBtn');
    const progressBar = document.getElementById('progressBar');
    const plantIcon = document.getElementById('plantIcon');

    function startQuiz() {
        currentQIndex = 0;
        score = 0;
        updateProgress();
        showQuestion();
    }

    function showQuestion() {
        resMsg.innerText = "";
        nextBtn.style.display = "none";
        
        const currentQ = quizQuestions[currentQIndex];
        qText.innerText = currentQ.question;
        optionsGroup.innerHTML = "";

        currentQ.options.forEach((opt, idx) => {
            const btn = document.createElement('button');
            cardId = "opt_" + idx;
            btn.className = "option-btn";
            btn.id = cardId;
            btn.innerText = opt;
            btn.addEventListener('click', () => checkAnswer(idx, currentQ.correct));
            optionsGroup.appendChild(btn);
        });
    }

    function checkAnswer(selectedIdx, correctIdx) {
        // ಎಲ್ಲಾ ಬಟನ್‌ಗಳನ್ನು ಡಿಸೇಬಲ್ ಮಾಡುವುದು
        const allButtons = optionsGroup.querySelectorAll('.option-btn');
        allButtons.forEach(btn => btn.disabled = true);

        if (selectedIdx === correctIdx) {
            document.getElementById("opt_" + selectedIdx).classList.add('correct-ans');
            resMsg.innerHTML = "<span style='color: #2ecc71;'>✅ ಸರಿಯಾದ ಉತ್ತರ! ನೀವು ಗಿಡಕ್ಕೆ ನೀರು ಉಣಿಸಿದ್ದೀರಿ!</span>";
            score++;
        } else {
            document.getElementById("opt_" + selectedIdx).classList.add('wrong-ans');
            document.getElementById("opt_" + correctIdx).classList.add('correct-ans');
            resMsg.innerHTML = "<span style='color: #e74c3c;'>❌ ತಪ್ಪು ಉತ್ತರ! ಸರಿಯಾದ ಉತ್ತರವನ್ನು ಗಮನಿಸಿ.</span>";
        }

        updateProgress();
        nextBtn.style.display = "inline-block";

        if (currentQIndex === quizQuestions.length - 1) {
            nextBtn.innerText = "ಫಲಿತಾಂಶ ನೋಡಿ 🏆";
        }
    }

    function loadNextQuestion() {
        if (currentQIndex < quizQuestions.length - 1) {
            currentQIndex++;
            showQuestion();
        } else {
            // ಕ್ವಿಜ್ ಮುಕ್ತಾಯದ ಸ್ಕ್ರೀನ್
            qText.innerText = "🎉 ಕ್ವಿಜ್ ಪೂರ್ಣಗೊಂಡಿದೆ!";
            optionsGroup.innerHTML = "";
            resMsg.innerHTML = `🏆 ನಿಮ್ಮ ಒಟ್ಟು ಸ್ಕೋರ್: <b>${score} / ${quizQuestions.length}</b><br><br>`;
            
            if(score === quizQuestions.length) {
                resMsg.innerHTML += "<span style='color:#2ecc71;'>🥇 ನೀವು 'ಪರಮ ಪ್ರಕೃತಿ ರಕ್ಷಕ' ಪ್ರಶಸ್ತಿ ಗೆದ್ದಿದ್ದೀರಿ! ಗಿಡವು ಮರವಾಗಿ ಅರಳಿದೆ!</span>";
            } else if(score >= 3) {
                resMsg.innerHTML += "<span style='color:#3498db;'>✨ ಉತ್ತಮ ಪ್ರಯತ್ನ! ಪ್ರಕೃತಿಯನ್ನು ರಕ್ಷಿಸಲು ಇನ್ನಷ್ಟು ತಿಳಿಯಿರಿ.</span>";
            } else {
                resMsg.innerHTML += "<span style='color:#e67e22;'>🔄 ಪದ್ಯವನ್ನು ಇನ್ನೊಮ್ಮೆ ಓದಿ ಮತ್ತೆ ಪ್ರಯತ್ನಿಸಿ!</span>";
            }
            
            nextBtn.innerText = "ಮತ್ತೆ ಆಡಿ 🔄";
            nextBtn.onclick = () => {
                nextBtn.onclick = loadNextQuestion;
                nextBtn.innerText = "ಮುಂದಿನ ಪ್ರಶ್ನೆ ➡️";
                startQuiz();
            };
        }
    }

    function updateProgress() {
        // ಪ್ರೋಗ್ರೆಸ್ ಬಾರ್ ಲೆಕ್ಕಾಚಾರ
        const percentage = (score / quizQuestions.length) * 100;
        progressBar.style.width = percentage + "%";
        
        // ಸ್ಕೋರ್‌ಗೆ ತಕ್ಕಂತೆ ಗಿಡದ ಎಮೋಜಿ ಬದಲಾವಣೆ
        plantIcon.innerText = plantStages[score];
        
        // ಗಿಡದ ಅನಿಮೇಷನ್ ಎಫೆಕ್ಟ್
        plantIcon.style.transform = "scale(1.2)";
        setTimeout(() => {
            plantIcon.style.transform = "scale(1)";
        }, 300);
    }

    // ಕ್ವಿಜ್ ಪ್ರಾರಂಭ
    startQuiz();
</script>

</body>
</html>
