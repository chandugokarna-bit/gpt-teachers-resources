<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ನೀ ಹೋದ ಮರುದಿನ - ಭಾವ ತರಂಗ ಚಕ್ರ</title>
    <style>
        :root {
            --bg-dark: #050611;
            --neon-blue: #00d2d3;
            --neon-gold: #ffd32a;
            --neon-purple: #a29bfe;
            --panel-bg: #11142a;
            --text-light: #f1f2f6;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            user-select: none;
        }

        .activity-container {
            background: linear-gradient(145deg, #0a0d24, #151941);
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 20px 50px rgba(162, 155, 254, 0.15);
            max-width: 900px;
            width: 100%;
            text-align: center;
            border: 1px solid rgba(162, 155, 254, 0.2);
        }

        h2 {
            color: var(--neon-gold);
            text-shadow: 0 0 15px rgba(255, 211, 42, 0.4);
            font-size: 26px;
            margin-bottom: 5px;
        }

        .instruction {
            color: #a4b0be;
            font-size: 15px;
            margin-bottom: 30px;
        }

        /* ಹೊಸ ಕಾವ್ಯ ಧ್ವನಿ ವರ್ಚುವಲ್ ವೀಲ್ */
        .dial-arena {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 35px;
        }

        .dial-node {
            background: #151a3a;
            border: 2px solid #2d356b;
            color: #cbd5e1;
            padding: 12px 28px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 5px 10px rgba(0,0,0,0.3);
        }

        .dial-node:hover {
            border-color: var(--neon-blue);
            color: #ffffff;
            transform: translateY(-3px);
        }

        .dial-node.active-node {
            background: linear-gradient(135deg, var(--neon-blue), #01a3a4);
            border-color: #ffffff;
            color: #ffffff;
            box-shadow: 0 0 20px rgba(0, 210, 211, 0.4);
            transform: scale(1.05);
        }

        /* ಪ್ರದರ್ಶನ ಬೋರ್ಡ್ (Split Grid) */
        .split-grid {
            display: flex;
            gap: 25px;
            margin-top: 15px;
        }

        .display-panel {
            flex: 1;
            background: var(--panel-bg);
            border-radius: 20px;
            padding: 25px;
            border: 2px solid #1e2454;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            text-align: left;
            transition: all 0.4s ease;
            min-height: 240px;
        }

        .panel-header {
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
            padding-bottom: 8px;
            border-bottom: 1px solid #1e2454;
        }

        .header-left { color: var(--neon-gold); }
        .header-right { color: var(--neon-purple); }

        .poem-content {
            font-size: 19px;
            font-weight: bold;
            line-height: 1.7;
            color: #f1f5f9;
            white-space: pre-line;
            animation: textReveal 0.5s ease-in-out;
        }

        .summary-content {
            font-size: 16px;
            line-height: 1.7;
            color: #cbd5e1;
            animation: textReveal 0.5s ease-in-out;
        }

        @keyframes textReveal {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 750px) {
            .split-grid { flex-direction: column; }
            .dial-arena { flex-direction: column; }
            .dial-node { width: 100%; }
        }
    </style>
</head>
<body>

<div class="activity-container">
    <h2>೩. ನೀ ಹೋದ ಮರುದಿನ: ಭಾವ ತರಂಗ ಚಕ್ರ 📖🌈</h2>
    <p class="instruction"><b>ವರಪ್ರದ ಇಂಟರಾಕ್ಷನ್:</b> ಕಾವ್ಯದ ಯಾವುದೇ ಭಾವಕೋಶದ ಬಟನ್ ಮೇಲೆ ಕ್ಲಿಕ್ ಮಾಡಿ, ಮೂಲ ಸಾಲುಗಳು ಮತ್ತು ಅದರ ವೈಚಾರಿಕ ದಲಿತ ಸಾಹಿತ್ಯದ ಸಾರಾಂಶ ಅನಾವರಣಗೊಳಿಸಿ!</p>

    <div class="dial-arena">
        <button class="dial-node active-node" id="node_1" onclick="spinDial(1)">ಭಾವಕೋಶ ೧ 👤</button>
        <button class="dial-node" id="node_2" onclick="spinDial(2)">ಭಾವಕೋಶ ೨ 🥾</button>
        <button class="dial-node" id="node_3" onclick="spinDial(3)">ಭಾವಕೋಶ ೩ 🌾</button>
        <button class="dial-node" id="node_4" onclick="spinDial(4)">ಭಾವಕೋಶ ೪ ⚖️</button>
    </div>

    <div class="split-grid">
        <div class="display-panel">
            <div class="panel-header header-left">📜 ಪದ್ಯದ ಮೂಲ ಕಾವ್ಯಭಾಗ</div>
            <div class="poem-content" id="poemBox">ಲೋಡ್ ಆಗುತ್ತಿದೆ...</div>
        </div>

        <div class="display-panel" style="border-color: #5f27cd; background: linear-gradient(180deg, #11142a, #160f33);">
            <div class="panel-header header-header ರಾಡಿಕಲ್ header-right">💡 ವೈಚಾರಿಕ ದಲಿತ ಸಾಹಿತ್ಯದ ಸಾರಾಂಶ</div>
            <div class="summary-content" id="summaryBox">ಲೋಡ್ ಆಗುತ್ತಿದೆ...</div>
        </div>
    </div>
</div>

<script>
    // ಪಠ್ಯಪುಸ್ತಕದ ಪುಟ ೬೭ ಮತ್ತು ೬೮ ರಲ್ಲಿದ್ದಂತೆ ನಿಖರ ಪ್ಯಾರಾಗಳು ಹಾಗೂ ತಾರ್ಕಿಕ ಸಾರಾಂಶ
    const dialDatabase = {
        1: {
            poem: "ನೀ ಹೋದ ಮರುದಿನದ ಮೊದಲಿಂಗೆ ನಮ್ಮ ಬದುಕು\nಆಗ್ಯಾದೋ ಬಾಬಾ ಸಾಹೇಬ\nನಿನ್ನಂಗ ದುಡಿದವರು ಕಳಕಳಿಯ ಪಡುವವರು\nಇನ್ನುತನ ಬರಲಿಲ್ಲ ಒಬ್ಬ\n\nಪ್ರತಿನಿತ್ಯ ಎದ್ದಾಗ ನಮ್ಮ ಸುದ್ದಿ ಸಂಭ್ರಮವು\nದೇಕುವುದು ತಪ್ಪಿಲ್ಲ ನಮಗ\nಹೋದ ಹೋದಲ್ಲೆಲ್ಲ ಮೇಲವರ ಆಟಗಳು\nಉರಿಹಚ್ಚಿ ಬಿಡುತಾರ ಒಳಗ",
            summary: "• <b>ಶೋಷಣೆಯ ಸ್ಥಿತಿ:</b> ಬಾಬಾ ಸಾಹೇಬ್ ಅಂಬೇಡ್ಕರ್ ಅವರ ನಿರ್ಗಮನದ ನಂತರ ಶೋಷಿತರ ಬದುಕು ಮತ್ತೆ ಹಳೆಯ ಅಸಹಾಯಕ ಸ್ಥಿತಿಗೆ ತಲುಪಿದೆ .<br>• <b>ನಾಯಕತ್ವದ ಕೊರತೆ:</b> ಅವರಂತೆ ಶೋಷಿತ ಸಮಾಜದ ಉದ್ಧಾರಕ್ಕಾಗಿ ಕಳಕಳಿಯಿಂದ ನಿರಂತರವಾಗಿ ಶ್ರಮಿಸುವ ಮತ್ತೊಬ್ಬ ಶ್ರೇಷ್ಠ ನಾಯಕ ಇಂದಿನವರೆಗೂ ಬರಲಿಲ್ಲ .<br>• <b>ನೆಮ್ಮದಿಯ ಕೊರತೆ:</b> ಕೆಳವರ್ಗದ ಜನರಿಗೆ ಬೆಳಿಗ್ಗೆ ಎದ್ದ ತಕ್ಷಣ ದೌರ್ಜನ್ಯದ ಸುದ್ದಿಗಳೇ ಎದುರಾಗುತ್ತಿದ್ದು, ಯಾವುದೇ ನಿಜವಾದ ಸಂತೋಷ ಉಳಿದಿಲ್ಲ .<br>• <b>ಮೇಲ್ವರ್ಗದ ದರ್ಪ:</b> ಹೋದ ಹೋದ ಕಡೆಯಲ್ಲೆಲ್ಲಾ ಮೇಲ್ವರ್ಗದ ಜನರ ಅಧಿಕಾರದ ಆಟ ಮತ್ತು ತಾರತಮ್ಯಗಳು ನಿರಂತರವಾಗಿ ಸಾಗಿವೆ .<br>• <b>ಮನದ ಉರಿ:</b> ಈ ವ್ಯವಸ್ಥೆಯು ಶೋಷಿತರ ಮನಸ್ಸಿನ ಒಳಗೆ ಸದಾ ಅಸಹಾಯಕತೆಯ ಮತ್ತು ಬಂಡಾಯದ ಉರಿಯನ್ನು ಹಚ್ಚುತ್ತಿದೆ."
        },
        2: {
            poem: "ಎಲ್ಲಿ ಕೇಳಿದರಲ್ಲಿ ಬೂಟುಗಾಲಿನ ಸದ್ದು\nತರತರದ ನೋವುಗಳು ನಮಗ\nತಮ್ಮಂಗ ಇರದಿದ್ರೆ ತಲೆ ಕಡಿದು ಹಾಕುವರು\nಹೆಸರಿಗೆ ಸ್ವಾತಂತ್ರ್ಯ ನಮಗ\n\nಕೈಕಾಲು ಕಿವಿ ಮೂಗು ಮೈ ಮನಸು ತಲೆ ಕಣ್ಣು\nಕಳಕೊಂಡ ಬರಡು ಗಿಡ ನಾವು\nಮೈ ತುಂಬ ಮನತುಂಬ ಸಿಕ್ಕವರ ಮುಖಮುದ್ರೆ\nಚೀರಾಟ ಹಾರಟ ಸಾವೋ",
            summary: "• <b>ದೌರ್ಜನ್ಯದ ವಾಸ್ತವ:</b> ಸಮಾಜದಲ್ಲಿ ಇಂದಿಗೂ ದೌರ್ಜನ್ಯದ ಬೂಟುಗಾಲಿನ ಸದ್ದು ಮತ್ತು ತರತರದ ಹಿಂಸೆಗಳು ಕೇಳಿಬರುತ್ತಲೇ ಇವೆ .<br>• <b>ಹಕ್ಕಿನ ಹರಣ:</b> ಬಲಿಷ್ಠರ ಅಣತಿಯಂತೆ ಬಗ್ಗದಿದ್ದರೆ ಜೀವಕ್ಕೇ ಅಪಾಯ ತರುವಂತಹ ಭೀಕರ ಪರಿಸ್ಥಿತಿಯಿದೆ .<br>• <b>ಬರಡು ಬದುಕು:</b> ದೇಶಕ್ಕೆ ಸ್ವಾತಂತ್ರ್ಯ ಬಂದಿದ್ದರೂ ಅದು ಕೇವಲ ಹೆಸರಿಗಷ್ಟೇ ಸೀಮಿತವಾಗಿದ್ದು, ಕೆಳವರ್ಗದವರು ಹಕ್ಕುಗಳನ್ನು ಕಳೆದುಕೊಂಡು 'ಬರಡು ಗಿಡ'ದಂತೆ ಬದುಕುತ್ತಿದ್ದಾರೆ .<br>• <b>ಭಯದ ವಾತಾವರಣ:</b> ಇವರ ಜೀವನದ ಸುತ್ತಲೂ ಸದಾ ದಬ್ಬಾಳಿಕೆಗಾರರ ಕ್ರೂರ ಮುಖಮುದ್ರೆ, ಚೀರಾಟ ಮತ್ತು ಸಾವಿನ ಭಯವೇ ತುಂಬಿಕೊಂಡಿದೆ."
        },
        3: {
            poem: "ಹೋಳ್ವಾರೋ ದಾರಿಯಲಿ ಅಡುಗಲ್ಲುಗಳು ಸೇರಿ\nಮುಳಕಲ್ಲು ಹಾಸ್ಯಾವೊ ಪೂರ\nಹೆಚ್ಚಿಗೆ ಬೆಳೆದವರ ಉಳಿದವರ ಜೀವಗಳ\nಹಗಲಾಗ ಹೊಡೆದಾರ ಟಾರಾ\n\nಎಷ್ಟಂತ ಉರಿತಾರ ಎಷ್ಟಂತ ಹರಿತಾರ\nತಾಳದಕ್ಕೂ ಮಿತಿಯುಂಟು ಇಲ್ಲಿ\nತಾಳಿ ತಾಳಿ ಒಮ್ಮೆ ಚೇಳಾಗಿ ಕುಟುಕುವನು\nಸಾಮಾನ್ಯನಲ್ಲೋ ಬಡಜೀವಿ",
            summary: "• <b>ಪ್ರಗತಿಗೆ ತಡೆ:</b> ಶೋಷಿತರು ಸಾಗುವ ಪ್ರಗತಿಯ ದಾರಿಯಲ್ಲಿ ಸಮಾಜವು ಅಡೆತಡೆಯ ಅಡುಗಲ್ಲುಗಳನ್ನು ಮತ್ತು ಮುಳ್ಳಿನ ಕಲ್ಲುಗಳನ್ನು ಹಾಸಿದೆ [cite: 259].<br>• <b>ಹಗಲು ದರೋಡೆ:</b> ಶಿಕ್ಷಣ ಅಥವಾ ಆರ್ಥಿಕವಾಗಿ ಸ್ವಲ್ಪವೇ ಮೇಲಕ್ಕೆ ಬೆಳೆದ ಬಡವರ ಜೀವಗಳನ್ನು ಹಗಲಲ್ಲೇ ಕ್ರೂರವಾಗಿ ಮಣ್ಣು ಮುಕ್ಕಿಸಲಾಗುತ್ತಿದೆ[cite: 259].<br>• <b>ತಾಳ್ಮೆಯ ಮಿತಿ:</b> ಶೋಷಣೆಯ ಬೆಂಕಿಯಲ್ಲಿ ಬಡವರು ಇನ್ನೂ ಎಷ್ಟಂತ ಬೆಂದು ಉರಿಯಬೇಕು? ಸಹಿಸಿಕೊಳ್ಳುವ ತಾಳ್ಮೆಗೂ ಸಮಾಜದಲ್ಲಿ ಒಂದು ಮಿತಿಯಿರುತ್ತದೆ [cite: 259].<br>• <b>ಸಿಡಿತದ ಮುನ್ಸೂಚನೆ:</b> ಸದಾ ಮೂಕನಾಗಿ ಎಲ್ಲವನ್ನೂ ಸಹಿಸುವ ಸಾಮಾನ್ಯ ಬಡಜೀವಿಯೂ ಸಹ ತಾಳ್ಮೆ ಮೀರಿದಾಗ ಒಮ್ಮೆಲೇ ಚೇಳಿನಂತೆ ಸಿಡಿದೆದ್ದು ಕುಟುಕಬಲ್ಲನು[cite: 259]."
        },
        4: {
            poem: "ದುಡಿದುಡಿದು ಹುಟ್ಟಿರಲು ಕತ್ತಲಿರುವಾ ತನಕ\nಕೊತ್ತಿಗಳು ಹೊತ್ಯಾವ ಜೋರಾ\nರೋಡಿಗಿದ್ದವರೆಲ್ಲಾ ಗ್ವಾಡ್ಯಾಗ ಕುಂತಾರ\nಇನ್ನಿಲ್ಲ ನಮ್ಮ ದಾರಿ ದೂರ\n\nಬಾಬಾ ಸಾಹೇಬರೇನು ಹುಚ್ಚರಲ್ಲವೇ ಅಲ್ಲ\nಗಾಂಧಿಜೊತೆ ಇರಲಿಲ್ಲ ಸುಮ್ಮ\nಅಷ್ಟು ಒದ್ದಾಡಿದಕೆ ಇಂಗೈತೆ ನಮ್ ಬದುಕು\nತಿಳಿಯಿತೆ ಈಗ್ಲಾದ್ರೂ ತಮ್ಮ",
            summary: "• <b>ಶ್ರಮದ ಸುಲಿಗೆ:</b> ಬಡವರು ಕತ್ತಲಾಗುವವರೆಗೂ ಕಠಿಣವಾಗಿ ದುಡಿದರೂ, ಅವರ ಶ್ರಮದ ನೈಜ ಫಲವನ್ನು ಲೂಟಿಕೋರರಾದ ಬೆಕ್ಕುಗಳು (ಕೊತ್ತಿಗಳು) ಹೊತ್ತೊಯ್ಯುತ್ತಿವೆ [cite: 259, 266].<br>• <b>ಜಾಗೃತಿಯ ಉದಯ:</b> ಒಂದು ಕಾಲದಲ್ಲಿ ರಸ್ತೆಯಲ್ಲಿದ್ದ ಅನಾಥರು ಇಂದು ಶಿಕ್ಷಣದ ಮೂಲಕ ಜಾಗೃತರಾಗಿ ಅಧಿಕಾರದ ಅತ್ಯುನ್ನತ ಗೋಡೆಯ ಮೇಲೆ (ಗ್ವಾಡ್ಯಾಗ) ಕುಳಿತಿದ್ದಾರೆ [cite: 259].<br>• <b>ಅಂಬೇಡ್ಕರ್ ಒದ್ದಾಟ:</b> ಬಾಬಾ ಸಾಹೇಬರು ಅಂದು ಸುಮ್ಮನೆ ಕುಳಿತುಕೊಳ್ಳದೆ ಗಾಂಧೀಜಿಯವರೊಂದಿಗೆ ಶೋಷಿತರ ಹಕ್ಕುಗಳಿಗಾಗಿ ತೀವ್ರ ಹೋರಾಟ ಮತ್ತು ಒದ್ದಾಟ ನಡೆಸಿದರು [cite: 259].<br>• <b>ಕೃತಜ್ಞತೆ:</b> ಅಂಬೇಡ್ಕರ್ ಅವರು ಅಂದು ಪಟ್ಟ ತೀವ್ರ ಒದ್ದಾಟದ ಫಲವಾಗಿಯೇ ಇಂದು ನಮ್ಮ ಬದುಕು ಈ ಮಟ್ಟಿಗಾದರೂ ಹಸನಾಗಿದೆ ಎಂಬ ಸತ್ಯವನ್ನು ಕವಿ ಮರು ನೆನಪಿಸಿದ್ದಾರೆ[cite: 259]."
        }
    };

    const poemBox = document.getElementById('poemBox');
    const summaryBox = document.getElementById('summaryBox');

    function playChime() {
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            // ಅತ್ಯಂತ ರಿಚ್ ಚೈಮ್ಸ್ ಧ್ವನಿ
            osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
            osc.frequency.exponentialRampToValueAtTime(1046.50, audioCtx.currentTime + 0.15); // C6
            gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.15);
        } catch (e) {}
    }

    function spinDial(nodeNum) {
        const allNodes = document.querySelectorAll('.dial-node');
        allNodes.forEach(n => n.classList.remove('active-tab', 'active-node'));

        document.getElementById(`node_${nodeNum}`).classList.add('active-node');

        const currentData = dialDatabase[nodeNum];
        poemBox.innerHTML = currentData.poem;
        summaryBox.innerHTML = currentData.summary;

        playChime();
    }

    // ಮೊದಲ ಭಾವಕೋಶ ಆಟೋಮ್ಯಾಟಿಕ್ ಆಗಿ ಕಾಣಿಸುತ್ತದೆ
    spinDial(1);
</script>
