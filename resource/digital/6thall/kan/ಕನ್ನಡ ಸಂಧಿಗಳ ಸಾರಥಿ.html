<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ಡಾ. ರಾಜಕುಮಾರ್ - ಕನ್ನಡ ಸಂಧಿಗಳ ಸಾರಥಿ</title>
    <style>
        :root {
            --bg-space: #060814;
            --neon-blue: #00d2d3;
            --neon-pink: #ff9ff3;
            --neon-gold: #feca57;
            --neon-green: #1dd1a1;
            --danger-red: #ff4d4d;
            --card-dark: #101428;
            --text-light: #f1f2f6;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-space);
            color: var(--text-light);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            user-select: none;
        }

        .activity-container {
            background: linear-gradient(145deg, #0e122d, #161b3d);
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 15px 40px rgba(0, 210, 211, 0.15);
            max-width: 850px;
            width: 100%;
            text-align: center;
            border: 1px solid rgba(0, 210, 211, 0.2);
        }

        h2 {
            color: var(--neon-blue);
            margin-bottom: 5px;
            text-shadow: 0 0 12px rgba(0, 210, 211, 0.4);
            font-size: 26px;
        }

        .instruction {
            color: #a4b0be;
            font-size: 16px;
            margin-bottom: 25px;
        }

        /* ಪ್ರಸ್ತುತ ಸಂಧಿ ಪದ ಪ್ರದರ್ಶಿಸುವ ಕಾರ್ಡ್ */
        .word-display-zone {
            min-height: 120px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 35px;
            background: #040610;
            border-radius: 18px;
            padding: 15px;
            border: 1px solid #1e2548;
        }

        .active-sandhi-card {
            background: linear-gradient(135deg, #ff9ff3, #00d2d3);
            color: #000000;
            font-size: 26px;
            font-weight: 900;
            padding: 18px 45px;
            border-radius: 50px;
            box-shadow: 0 8px 25px rgba(0, 210, 211, 0.3);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: inline-block;
        }

        /* ಮೂರು ಸಂಧಿಗಳ ಪೆಟ್ಟಿಗೆಗಳ ವಲಯ */
        .baskets-container {
            display: flex;
            justify-content: space-around;
            gap: 20px;
            margin-bottom: 25px;
        }

        .basket-box {
            flex: 1;
            background: var(--card-dark);
            border: 2px solid #3d4852;
            border-radius: 20px;
            padding: 25px 10px;
            min-height: 150px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 16 rgba(0,0,0,0.4);
        }

        .basket-box:hover {
            transform: translateY(-5px);
        }

        .basket-icon {
            font-size: 50px;
            margin-bottom: 12px;
            transition: transform 0.2s;
        }

        .basket-box:hover .basket-icon {
            transform: scale(1.15);
        }

        .basket-title {
            font-size: 18px;
            font-weight: bold;
        }

        /* ೧. ಲೋಪಸಂಧಿ ಬಾಕ್ಸ್ */
        #lopaS_box {
            border-color: var(--neon-pink);
            color: #ffb6c1;
            background: rgba(255, 159, 243, 0.02);
        }
        #lopaS_box:hover {
            background: rgba(255, 159, 243, 0.08);
            box-shadow: 0 10px 20px rgba(255, 159, 243, 0.2);
        }

        /* ೨. ಆಗಮಸಂಧಿ ಬಾಕ್ಸ್ */
        #agamaS_box {
            border-color: var(--neon-gold);
            color: #ffeaa7;
            background: rgba(254, 202, 87, 0.02);
        }
        #agamaS_box:hover {
            background: rgba(254, 202, 87, 0.08);
            box-shadow: 0 10px 20px rgba(254, 202, 87, 0.2);
        }

        /* ೩. ಆದೇಶಸಂಧಿ ಬಾಕ್ಸ್ */
        #adeshaS_box {
            border-color: var(--neon-green);
            color: #a3f7bf;
            background: rgba(29, 209, 161, 0.02);
        }
        #adeshaS_box:hover {
            background: rgba(29, 209, 161, 0.08);
            box-shadow: 0 10px 20px rgba(29, 209, 161, 0.2);
        }

        /* ಪ್ರಗತಿ ಹಂತ */
        .progress-board {
            font-size: 17px;
            font-weight: bold;
            color: #a4b0be;
            margin-top: 15px;
        }

        #feedbackMsg {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
            min-height: 27px;
            line-height: 1.6;
        }

        .correct-text { color: var(--neon-green); }
        .wrong-text { color: var(--danger-red); }

        .reset-btn {
            margin-top: 20px;
            background: linear-gradient(135deg, var(--neon-blue), var(--neon-pink));
            color: #000000;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            display: none;
        }

        @media (max-width: 650px) {
            .baskets-container { flex-direction: column; gap: 20px; }
            .basket-box { min-height: 120px; }
            .active-sandhi-card { font-size: 22px; padding: 15px 35px; }
        }
    </style>
</head>
<body>

<div class="activity-container">
    <h2>೨. ವ್ಯಾಕರಣ ರತ್ನ: ಕನ್ನಡ ಸಂಧಿಗಳ ಸಾರಥಿ 💎</h2>
    <p class="instruction"><b>ಟಚ್ ಹೆಲ್ಪ್:</b> ಮೇಲಿರುವ ಪದವನ್ನು ಜಾಗ್ರತೆಯಿಂದ ಓದಿ ಬಿಡಿಸಿ ನೋಡಿ, ಅದು ಯಾವ ಸಂಧಿಗೆ ಸೇರುತ್ತದೆ ಎಂಬುದನ್ನು ಕೆಳಗಿನ ಸರಿಯಾದ ಬಾಕ್ಸ್ ಕ್ಲಿಕ್ ಮಾಡಿ ವಿಂಗಡಿಸಿ!</p>

    <div class="word-display-zone">
        <div class="active-sandhi-card" id="sandhiCard">ಲೋಡ್ ಆಗುತ್ತಿದೆ...</div>
    </div>

    <div class="baskets-container">
        <div class="basket-box" id="lopaS_box" onclick="classifySandhi('ಲೋಪಸಂಧಿ')">
            <span class="basket-icon">📦</span>
            <span class="basket-title">ಲೋಪಸಂಧಿ</span>
        </div>
        <div class="basket-box" id="agamaS_box" onclick="classifySandhi('ಆಗಮಸಂಧಿ')">
            <span class="basket-icon">📥</span>
            <span class="basket-title">ಆಗಮಸಂಧಿ</span>
        </div>
        <div class="basket-box" id="adeshaS_box" onclick="classifySandhi('ಆದೇಶಸಂಧಿ')">
            <span class="basket-icon">📬</span>
            <span class="basket-title">ಆದೇಶಸಂಧಿ</span>
        </div>
    </div>

    <div class="progress-board">ಪ್ರಗತಿ ಹಂತ: <span id="scoreText">0</span> / <span id="totalText">0</span></div>
    <div id="feedbackMsg"></div>
    <button class="reset-btn" id="resetBtn" onclick="resetGame()">ಮತ್ತೆ ಆಡಿ 🔄</button>
</div>

<script {
type: text/javascript
}>
    // ಪಿಡಿಎಫ್ ಪುಟ ೭ ಮತ್ತು ೮ ರ ವ್ಯಾಕರಣ ಮಾಹಿತಿಯಲ್ಲಿರುವ ನಿಖರ ಉದಾಹರಣೆಗಳ ಡೇಟಾಬೇಸ್
    const sandhiDatabase = [
        { word: "ಮೇಲಿಟ್ಟು", type: "ಲೋಪಸಂಧಿ", formula: "ಮೇಲೆ + ಇಟ್ಟು = ಮೇಲಿಟ್ಟು", rule: "ಪೂರ್ವಪದದ ಕೊನೆಯಲ್ಲಿರುವ ಸ್ವರ 'ಎ' ಲೋಪವಾಗಿದೆ." },
        { word: "ಹೊಲವನ್ನು", type: "ಆಗಮಸಂಧಿ", formula: "ಹೊಲ + ಅನ್ನು = ಹೊಲವನ್ನು", rule: "'ವ' ಕಾರಾಕ್ಷರವು ಹೊಸದಾಗಿ ಬಂದು ಸೇರಿಕೊಂಡಿದೆ (ವ-ಕಾರಾಗಮ)." },
        { word: "ಕೋಪಗೊಂಡು", type: "ಆದೇಶಸಂಧಿ", formula: "ಕೋಪ + ಕೊಂಡು = ಕೋಪಗೊಂಡು", rule: "ಉತ್ತರ ಪದದ ಮೊದಲ 'ಕ' ಅಕ್ಷರದ ಬದಲಿಗೆ 'ಗ' ಅಕ್ಷರ ಆದೇಶವಾಗಿ ಬಂದಿದೆ." },
        { word: "ಮುಳ್ಳನ್ನು", type: "ಲೋಪಸಂಧಿ", formula: "ಮುಳ್ಳು + ಅನ್ನು = ಮುಳ್ಳನ್ನು", rule: "ಪೂರ್ವಪದದ ಕೊನೆಯಲ್ಲಿರುವ ಸ್ವರ 'ಉ' ಲೋಪವಾಗಿದೆ." },
        { word: "ಹೊಳೆಯಲ್ಲಿ", type: "ಆಗಮಸಂಧಿ", formula: "ಹೊಳೆ + ಅಲ್ಲಿ = ಹೊಳೆಯಲ್ಲಿ", rule: "'ಯ' ಕಾರಾಕ್ಷರವು ಹೊಸದಾಗಿ ಬಂದು ಸೇರಿಕೊಂಡಿದೆ (ಯ-ಕಾರಾಗಮ)." },
        { word: "ಮೈದೊಳೆ", type: "ಆದೇಶಸಂಧಿ", formula: "ಮೈ + ತೊಳೆ = ಮೈದೊಳೆ", rule: "ಉತ್ತರ ಪದದ ಮೊದಲ 'ತ' ಅಕ್ಷರದ ಬದಲಿಗೆ 'ದ' ಅಕ್ಷರ ಆದೇಶವಾಗಿ ಬಂದಿದೆ." },
        { word: "ಹುಡುಗರೆಲ್ಲರು", type: "ಲೋಪಸಂಧಿ", formula: "ಹುಡುಗರು + ಎಲ್ಲರು = ಹುಡುಗರೆಲ್ಲರು", rule: "ಪೂರ್ವಪದದ ಕೊನೆಯಲ್ಲಿರುವ ಸ್ವರ 'ಉ' ಲೋಪವಾಗಿದೆ." },
        { word: "ಆರಂಭವಾಗು", type: "ಆಗಮಸಂಧಿ", formula: "ಆರಂಭ + ಆಗು = ಆರಂಭವಾಗು", rule: "'ವ' ಕಾರಾಕ್ಷರವು ಹೊಸದಾಗಿ ಬಂದು ಸೇರಿಕೊಂಡಿದೆ (ವ-ಕಾರಾಗಮ)." },
        { word: "ಬೆಟ್ಟದಾವರೆ", type: "ಆದೇಶಸಂಧಿ", formula: "ಬೆಟ್ಟ + ತಾವರೆ = ಬೆಟ್ಟದಾವರೆ", rule: "ಉತ್ತರ ಪದದ ಮೊದಲ 'ತ' ಅಕ್ಷರದ ಬದಲಿಗೆ 'ದ' ಅಕ್ಷರ ಆದೇಶವಾಗಿ ಬಂದಿದೆ." },
        { word: "ಕಂಬನಿ", type: "ಆದೇಶಸಂಧಿ", formula: "ಕಣ್ + ಪನಿ = ಕಂಬನಿ", rule: "ಉತ್ತರ ಪದದ ಮೊದಲ 'ಪ' ಅಕ್ಷರದ ಬದಲಿಗೆ 'ಬ' ಅಕ್ಷರ ಆದೇಶವಾಗಿ ಬಂದಿದೆ." }
    ];

    let shuffledSandhiList = [];
    let currentIndex = 0;
    let score = 0;

    const sandhiCard = document.getElementById('sandhiCard');
    const scoreText = document.getElementById('scoreText');
    const totalText = document.getElementById('totalText');
    const feedbackMsg = document.getElementById('feedbackMsg');
    const resetBtn = document.getElementById('resetBtn');

    // ಮ್ಯಾಜಿಕಲ್ ಸಿನೆಮಾಟಿಕ್ ಬೀಪ್ ಆಡಿಯೋ
    function playAudio(isCorrect) {
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(isCorrect ? 850 : 240, audioCtx.currentTime);
            gainNode.gain.setValueAtTime(0.08, audioCtx.currentTime);
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.2);
        } catch (e) {}
    }

    function initGame() {
        shuffledSandhiList = [...sandhiDatabase].sort(() => Math.random() - 0.5);
        currentIndex = 0;
        score = 0;
        
        totalText.innerText = shuffledSandhiList.length;
        scoreText.innerText = score;
        feedbackMsg.innerText = "";
        resetBtn.style.display = "none";
        sandhiCard.style.display = "inline-block";
        
        displayCurrentWord();
    }

    function displayCurrentWord() {
        if (currentIndex < shuffledSandhiList.length) {
            sandhiCard.innerText = shuffledSandhiList[currentIndex].word;
            sandhiCard.style.transform = "scale(0.9)";
            setTimeout(() => { sandhiCard.style.transform = "scale(1)"; }, 100);
        } else {
            sandhiCard.style.display = "none";
            feedbackMsg.className = "correct-text";
            feedbackMsg.innerHTML = `🏆 <b>ಕನ್ನಡ ಸಂಧಿ ಚಕ್ರವರ್ತಿ ಮಿಷನ್ ಪೂರ್ಣ!</b><br>ನಿಮ್ಮ ಒಟ್ಟು ಪ್ರಗತಿ ಸ್ಕೋರ್: <b>${score} / ${shuffledSandhiList.length}</b><br>ವಿದ್ಯಾರ್ಥಿಗಳು ಡಾ. ರಾಜಕುಮಾರ್ ಪಾಠದ ಎಲ್ಲಾ ವ್ಯಾಕರಣ ಸಂಧಿ ನಿಯಮಗಳನ್ನು ಅತ್ಯಂತ ನಿಖರವಾಗಿ ವಿಂಗಡಿಸಿದ್ದಾರೆ!`;
            resetBtn.style.display = "inline-block";
        }
    }

    function classifySandhi(selectedType) {
        if (currentIndex >= shuffledSandhiList.length) return;

        const currentObj = shuffledSandhiList[currentIndex];

        if (selectedType === currentObj.type) {
            score++;
            scoreText.innerText = score;
            feedbackMsg.className = "correct-text";
            feedbackMsg.innerHTML = `✅ <b>ಸರಿ ಉತ್ತರ!</b> "<b>${currentObj.word}</b>" ಎಂಬುದು <b>${currentObj.type}</b> ಹೌದು.<br><small style='color:#cbd5e1;'>🧪 <b>ವಿಂಗಡಣೆ:</b> ${currentObj.formula} (${currentObj.rule})</small>`;
            playAudio(true);
        } else {
            feedbackMsg.className = "wrong-text";
            feedbackMsg.innerHTML = `❌ <b>ತಪ್ಪು ಉತ್ತರ!</b> "<b>${currentObj.word}</b>" ನಿಜವಾಗಿ <b>${currentObj.type}</b> ಆಗಿದೆ.<br><small style='color:#cbd5e1;'>🧪 <b>ವಿಂಗಡಣೆ:</b> ${currentObj.formula} (${currentObj.rule})</small>`;
            playAudio(false);
        }

        currentIndex++;
        setTimeout(displayCurrentWord, 1600); // ಮುಂದಿನ ಪದ ಬರುವ ಮುನ್ನ ನಿಯಮ ಓದಲು ಸ್ವಲ್ಪ ಹೆಚ್ಚಿನ ಸಮಯ
    }

    function resetGame() {
        initGame();
    }

    // ಆಟ ಆರಂಭ
    initGame();
</script>

</body>
</html>
