<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ಮಂಗಳ ಗ್ರಹದಲ್ಲಿ ಪುಟ್ಟಿ - ವ್ಯಾಕರಣ ಗ್ಯಾಲಕ್ಸಿ</title>
    <style>
        :root {
            --bg-space: #050714;
            --neon-blue: #00d2d3;
            --neon-purple: #a29bfe;
            --neon-pink: #ff9ff3;
            --neon-green: #1dd1a1;
            --danger-red: #ff4d4d;
            --card-dark: #0f1123;
            --text-light: #f1f2f6;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-space);
            color: var(--text-light);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            user-select: none;
        }

        .activity-container {
            background: linear-gradient(145deg, #0d112d, #151a3a);
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 15px 40px rgba(162, 155, 254, 0.15);
            max-width: 850px;
            width: 100%;
            text-align: center;
            border: 1px solid rgba(162, 155, 254, 0.2);
        }

        h2 {
            color: var(--neon-blue);
            margin-bottom: 5px;
            text-shadow: 0 0 12px rgba(0, 210, 211, 0.4);
            font-size: 26px;
        }

        .instruction {
            color: #a4b0be;
            font-size: 16px;
            margin-bottom: 25px;
        }

        .word-display-zone {
            min-height: 120px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 35px;
            background: #040610;
            border-radius: 18px;
            padding: 15px;
            border: 1px solid #1e2548;
        }

        .active-grammar-card {
            background: linear-gradient(135deg, #ff9ff3, #a29bfe);
            color: #000000;
            font-size: 26px;
            font-weight: 900;
            padding: 18px 45px;
            border-radius: 50px;
            box-shadow: 0 8px 25px rgba(162, 155, 254, 0.3);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: inline-block;
        }

        .baskets-container {
            display: flex;
            justify-content: space-around;
            gap: 15px;
            margin-bottom: 25px;
        }

        .basket-box {
            flex: 1;
            background: var(--card-dark);
            border: 2px solid #3d4852;
            border-radius: 20px;
            padding: 25px 10px;
            min-height: 150px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 16px rgba(0,0,0,0.4);
        }

        .basket-box:hover { transform: translateY(-5px); }
        .basket-icon { font-size: 45px; margin-bottom: 12px; transition: transform 0.2s; }
        .basket-box:hover .basket-icon { transform: scale(1.15); }
        .basket-title { font-size: 18px; font-weight: bold; }

        #dvirukti_box {
            border-color: var(--neon-blue);
            color: #9ee7f5;
            background: rgba(0, 210, 211, 0.02);
        }
        #dvirukti_box:hover { background: rgba(0, 210, 211, 0.08); box-shadow: 0 10px 20px rgba(0, 210, 211, 0.2); }

        #jodu_box {
            border-color: var(--neon-pink);
            color: #ffb6c1;
            background: rgba(255, 159, 243, 0.02);
        }
        #jodu_box:hover { background: rgba(255, 159, 243, 0.08); box-shadow: 0 10px 20px rgba(255, 159, 243, 0.2); }

        #anukarana_box {
            border-color: var(--neon-green);
            color: #a3f7bf;
            background: rgba(29, 209, 161, 0.02);
        }
        #anukarana_box:hover { background: rgba(29, 209, 161, 0.08); box-shadow: 0 10px 20px rgba(29, 209, 161, 0.2); }

        .progress-board { font-size: 17px; font-weight: bold; color: #a4b0be; margin-top: 15px; }
        #feedbackMsg { margin-top: 20px; font-size: 18px; font-weight: bold; min-height: 27px; line-height: 1.6; }
        .correct-text { color: var(--neon-green); }
        .wrong-text { color: var(--danger-red); }

        .reset-btn {
            margin-top: 20px;
            background: linear-gradient(135deg, var(--neon-blue), var(--neon-pink));
            color: #000000;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            display: none;
        }

        @media (max-width: 650px) {
            .baskets-container { flex-direction: column; gap: 20px; }
            .basket-box { min-height: 120px; }
        }
    </style>
</head>
<body>

<div class="activity-container">
    <h2>೧. ವ್ಯಾಕರಣ ಗ್ಯಾಲಕ್ಸಿ: ಇಂಗಿತ ಅರಿತು ವಿಂಗಡಿಸಿ 🌌</h2>
    <p class="instruction"><b>ಟಚ್ ಹೆಲ್ಪ್:</b> ಮೇಲಿರುವ ಪದವನ್ನು ಓದಿ, ಅದು 'ದ್ವಿರುಕ್ತಿ', 'ಜೋಡುನುಡಿ' ಅಥವಾ 'ಅನುಕರಣಾವ್ಯಯ'ವೇ ಎಂಬುದನ್ನು ಕೆಳಗಿನ ಸರಿಯಾದ ಬಾಕ್ಸ್ ಕ್ಲಿಕ್ ಮಾಡಿ ವಿಂಗಡಿಸಿ!</p>

    <div class="word-display-zone">
        <div class="active-grammar-card" id="grammarCard">ಲೋಡ್ ಆಗುತ್ತಿದೆ...</div>
    </div>

    <div class="baskets-container">
        <div class="basket-box" id="dvirukti_box" onclick="classifyGrammar('ದ್ವಿರುಕ್ತಿ')">
            <span class="basket-icon">🛸</span>
            <span class="basket-title">ದ್ವಿರುಕ್ತಿಗಳು</span>
        </div>
        <div class="basket-box" id="jodu_box" onclick="classifyGrammar('ಜೋಡುನುಡಿ')">
            <span class="basket-icon">🛰️</span>
            <span class="basket-title">ಜೋಡುನುಡಿಗಳು</span>
        </div>
        <div class="basket-box" id="anukarana_box" onclick="classifyGrammar('ಅನುಕರಣಾವ್ಯಯ')">
            <span class="basket-icon">☄️</span>
            <span class="basket-title">ಅನುಕರಣಾವ್ಯಯ</span>
        </div>
    </div>

    <div class="progress-board">ಪ್ರಗತಿ ಹಂತ: <span id="scoreText">0</span> / <span id="totalText">0</span></div>
    <div id="feedbackMsg"></div>
    <button class="reset-btn" id="resetBtn" onclick="resetGame()">ಮತ್ತೆ ಆಡಿ 🔄</button>
</div>

<script>
    // ಪಿಡಿಎಫ್ ಪುಟ ೬ ಮತ್ತು ೭ ರ ಪಠ್ಯಪುಸ್ತಕದ ನಿಖರ ಉದಾಹರಣೆಗಳು
    const grammarDatabase = [
        { word: "ಮತ್ತೆ ಮತ್ತೆ", type: "ದ್ವಿರುಕ್ತಿ", rule: "ವಿಷಯಕ್ಕೆ ಒತ್ತು ನೀಡಲು ಒಂದೇ ಪದವನ್ನು ಎರಡೆರಡು ಬಾರಿ ಬಳಸುವುದು." },
        { word: "ವೇಷಭೂಷಣ", type: "ಜೋಡುನುಡಿ", rule: "ಎರಡು ಬೇರೆಬೇರೆ ಪದಗಳು ಜೊತೆಜೊತೆಯಾಗಿ ಬಳಕೆಯಾಗಿವೆ." },
        { word: "ಬನ್ನಿ ಬನ್ನಿ", type: "ದ್ವಿರುಕ್ತಿ", rule: "ಆದರ ಅಥವಾ ಒತ್ತಿ ಹೇಳಲು ಒಂದೇ ಶಬ್ದವನ್ನು ಎರಡು ಬಾರಿ ಆಡುವುದು." },
        { word: "ಹಣ್ಣುಹಂಪಲು", type: "ಜೋಡುನುಡಿ", rule: "ವಿಷಯವನ್ನು ಮೆರುಗುಗೊಳಿಸಲು ಸಮಾನ ಅರ್ಥದ ಪದ ಜೋಡಿಯಾಗಿ ಬಂದಿದೆ." },
        { word: "ಬೇಗಬೇಗ", type: "ದ್ವಿರುಕ್ತಿ", rule: "ಕ್ರಿಯೆಯ ವೇಗವನ್ನು ಸೂಚಿಸಲು ಒಂದೇ ಪದಾವಳಿ ಎರಡು ಬಾರಿ ಆವರ್ತನಗೊಂಡಿದೆ." },
        { word: "ನೋವುನಲಿವು", type: "ಜೋಡುನುಡಿ", rule: "ಜೀವನದ ಎರಡು ಪರಸ್ಪರ ವಿರೋಧಿ ಅಥವಾ ಪೂರಕ ಸಂಗತಿಗಳ ಜೋಡಿ ಪದ." },
        { word: "ದೊಡ್ಡದೊಡ್ಡ", type: "ದ್ವಿರುಕ್ತಿ", rule: "ಬಾಹುಳ್ಯ ಅಥವಾ ವಿಸ್ತಾರವನ್ನು ತೋರಿಸಲು ಎರಡೆರಡು ಬಾರಿ ಬಳಸಿದ ವಿಶೇಷಣ." },
        { word: "ಊರುಕೇರಿ", type: "ಜೋಡುನುಡಿ", rule: "ಸುತ್ತಮುತ್ತಲಿನ ಒಟ್ಟು ಪ್ರದೇಶವನ್ನು ವ್ಯಾಪಕವಾಗಿ ವರ್ಣಿಸುವ ಜೋಡುಪದ." },
        { word: "ಪಟಪಟನೆ", type: "ಅನುಕರಣಾವ್ಯಯ", rule: "ಮಳೆಯ ಹನಿಗಳು ಬೀಳುವ ಧ್ವನಿವಿಶೇಷವನ್ನು ಅನುಕರಣೆ ಮಾಡುವ ಶಬ್ದ." },
        { word: "ಜುಳುಜುಳು", type: "ಅನುಕರಣಾವ್ಯಯ", rule: "ನೀರು ಹರಿಯುವ ನೈಸರ್ಗಿಕ ಧ್ವನಿಯನ್ನು ಕೇಳಿದಂತೆ ಪುನಃ ಅನುಕರಣೆ ಮಾಡುವ ಅವ್ಯಯ." },
        { word: "ಸರಸರ", type: "ಅನುಕರಣಾವ್ಯಯ", rule: "ಹೆಜ್ಜೆ ಹಾಕುವಾಗ ಬರುವ ನಿರ್ದಿಷ್ಟ ಅರ್ಥವಿಲ್ಲದ ಧ್ವನಿವಿಶೇಷದ ಅನುಕರಣೆ." },
        { word: "ಸುಯ್ಯನೆ", type: "ಅನುಕರಣಾವ್ಯಯ", rule: "ಗಾಳಿಯು ಬೀಸುವ ವಿಶಿಷ್ಟ ಶಬ್ದದ ನೈಸರ್ಗಿಕ ಧ್ವನಿ ಅನುಕರಣೆ." }
    ];

    let shuffledList = [];
    let currentIndex = 0;
    let score = 0;

    const grammarCard = document.getElementById('grammarCard');
    const scoreText = document.getElementById('scoreText');
    const totalText = document.getElementById('totalText');
    const feedbackMsg = document.getElementById('feedbackMsg');
    const resetBtn = document.getElementById('resetBtn');

    function playAudio(isCorrect) {
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(isCorrect ? 850 : 240, audioCtx.currentTime);
            gainNode.gain.setValueAtTime(0.08, audioCtx.currentTime);
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.2);
        } catch (e) {}
    }

    function initGame() {
        shuffledList = [...grammarDatabase].sort(() => Math.random() - 0.5);
        currentIndex = 0; score = 0;
        totalText.innerText = shuffledList.length;
        scoreText.innerText = score;
        feedbackMsg.innerText = "";
        resetBtn.style.display = "none";
        grammarCard.style.display = "inline-block";
        displayCurrentWord();
    }

    function displayCurrentWord() {
        if (currentIndex < shuffledList.length) {
            grammarCard.innerText = shuffledList[currentIndex].word;
        } else {
            grammarCard.style.display = "none";
            feedbackMsg.className = "correct-text";
            feedbackMsg.innerHTML = `🏆 <b>ಬಾಹ್ಯಾಕಾಶ ವ್ಯಾಕರಣ ಸಾಮ್ರಾಟ ಮಿಷನ್ ಯಶಸ್ವಿ!</b><br>ನಿಮ್ಮ ಒಟ್ಟು ಸಾಧನೆ ಸ್ಕೋರ್: <b>${score} / ${shuffledList.length}</b><br>ವಿದ್ಯಾರ್ಥಿಗಳು ಪದ್ಯದ ಎಲ್ಲಾ ದ್ವಿರುಕ್ತಿ, ಜೋಡುನುಡಿ ಹಾಗೂ ಅನುಕರಣಾವ್ಯಯಗಳನ್ನು ಸಂಪೂರ್ಣವಾಗಿ ಗ್ರಹಿಸಿದ್ದಾರೆ!`;
            resetBtn.style.display = "inline-block";
        }
    }

    function classifyGrammar(selectedType) {
        if (currentIndex >= shuffledList.length) return;
        const currentObj = shuffledList[currentIndex];

        if (selectedType === currentObj.type) {
            score++;
            scoreText.innerText = score;
            feedbackMsg.className = "correct-text";
            feedbackMsg.innerHTML = `✅ <b>ಸರಿ ಉತ್ತರ!</b> "<b>${currentObj.word}</b>" ಎಂಬುದು <b>${currentObj.type}</b> ಹೌದು.<br><small style='color:#a4b0be;'>💡 <b>ವ್ಯಾಕರಣ ಸೂತ್ರ:</b> ${currentObj.rule}</small>`;
            playAudio(true);
        } else {
            feedbackMsg.className = "wrong-text";
            feedbackMsg.innerHTML = `❌ <b>ತಪ್ಪು ಉತ್ತರ!</b> "<b>${currentObj.word}</b>" ನಿಜವಾಗಿ <b>${currentObj.type}</b> ಆಗಿದೆ.<br><small style='color:#a4b0be;'>💡 <b>ವ್ಯಾಕರಣ ಸೂತ್ರ:</b> ${currentObj.rule}</small>`;
            playAudio(false);
        }
        currentIndex++;
        setTimeout(displayCurrentWord, 1600);
    }

    function resetGame() { initGame(); }
    initGame();
</script>
</body>
</html>
