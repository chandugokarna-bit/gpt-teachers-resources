<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ಡಾ. ರಾಜಕುಮಾರ್ - ಸಿನಿಕನ್ನಡದ ನಾದಮಯ ಪಯಣ</title>
    <style>
        :root {
            --bg-space: #05070f;
            --neon-gold: #ffd32a;
            --neon-blue: #00d2d3;
            --neon-purple: #ef5777;
            --neon-green: #1dd1a1;
            --danger-red: #ff4d4d;
            --card-dark: #0f1123;
            --text-light: #f5f6fa;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-space);
            color: var(--text-light);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            user-select: none;
        }

        .activity-container {
            background: linear-gradient(145deg, #0f1123, #151833);
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 15px 40px rgba(255, 211, 42, 0.15);
            max-width: 780px;
            width: 100%;
            text-align: center;
            border: 1px solid rgba(255, 211, 42, 0.2);
        }

        h2 {
            color: var(--neon-gold);
            margin-bottom: 5px;
            text-shadow: 0 0 10px rgba(255, 211, 42, 0.4);
            font-size: 26px;
        }

        .instruction {
            color: #a0a5c0;
            font-size: 15px;
            margin-bottom: 25px;
        }

        /* ಚಲನಚಿತ್ರ ರೀಲ್ ಪ್ರೋಗ್ರೆಸ್ ಟ್ರ್ಯಾಕರ್ */
        .film-reel-zone {
            background: #090b16;
            border: 2px solid #23274c;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
        }

        .reel-track {
            flex: 1;
            background: repeating-linear-gradient(90deg, #1e2548, #1e2548 10px, #05070f 10px, #05070f 20px);
            height: 16px;
            border-radius: 4px;
            margin: 0 15px;
            position: relative;
            border-top: 2px dashed #3d4852;
            border-bottom: 2px dashed #3d4852;
        }

        .reel-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, var(--neon-purple), var(--neon-gold));
            border-radius: 4px;
            transition: width 0.6s ease;
            opacity: 0.4;
        }

        .projector-icon {
            font-size: 34px;
            transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: absolute;
            left: 75px;
            top: 10px;
            filter: drop-shadow(0 0 8px var(--neon-gold));
        }

        /* ಕ್ವಿಜ್ ಕಾರ್ಡ್ ಶೈಲಿ */
        .quiz-card {
            background: var(--card-dark);
            border: 1px solid #23274c;
            border-radius: 18px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.4);
        }

        .quiz-text {
            font-size: 20px;
            font-weight: bold;
            line-height: 1.6;
            margin-bottom: 20px;
            text-align: left;
            color: #ffffff;
        }

        /* ಆಪ್ಷನ್ ಬಟನ್ಸ್‌ */
        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .opt-btn {
            background: #171c3d;
            border: 2px solid #2e3775;
            color: #ffffff;
            padding: 15px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
        }

        .opt-btn:hover:not(:disabled) {
            border-color: var(--neon-gold);
            background: #232b5c;
            transform: translateX(5px);
        }

        .opt-btn.correct-choice {
            background: rgba(29, 209, 161, 0.15) !important;
            border-color: var(--neon-green) !important;
            color: var(--neon-green) !important;
            box-shadow: 0 0 15px rgba(29, 209, 161, 0.2);
        }

        .opt-btn.wrong-choice {
            background: rgba(255, 77, 77, 0.15) !important;
            border-color: var(--danger-red) !important;
            color: var(--danger-red) !important;
        }

        #feedbackMsg {
            font-size: 17px;
            font-weight: bold;
            margin-top: 20px;
            min-height: 27px;
            text-align: left;
            line-height: 1.6;
        }

        .next-btn {
            margin-top: 20px;
            background: linear-gradient(135deg, var(--neon-gold), #ff9f43);
            color: black;
            border: none;
            padding: 12px 35px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            display: none;
            transition: transform 0.2s;
        }
        .next-btn:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>

<div class="activity-container">
    <h2>೪. ಡಾ. ರಾಜಕುಮಾರ್: ಸಿನಿಕನ್ನಡದ ನಾದಮಯ ಪಯಣ 🎬</h2>
    <p class="instruction"><b>ಪಠ್ಯಪುಸ್ತಕ ಆಧಾರಿತ ಡಿಜಿಟಲ್ ಕ್ವಿಜ್:</b> ಪ್ರಶ್ನೆಗೆ ಸರಿಯಾದ ಉತ್ತರ ನೀಡಿ, ಚಲನಚಿತ್ರ ಪ್ರೊಜೆಕ್ಟರ್ ಅನ್ನು ಮುಂದಕ್ಕೆ ಚಲಿಸಿ ಸಾಧನೆ ತಲುಪಿಸಿ!</p>
    
    <div class="film-reel-zone">
        <span>👶 ಬಾಲ್ಯ</span>
        <div class="reel-track">
            <div class="reel-fill" id="reelFill"></div>
        </div>
        <div class="projector-icon" id="projectorIcon">🎥</div>
        <span>🏆 ಡಾಕ್ಟರೇಟ್</span>
    </div>

    <div class="quiz-card">
        <div class="quiz-text" id="quizQuestion">ಪ್ರಶ್ನೆ ಲೋಡ್ ಆಗುತ್ತಿದೆ...</div>
        <div class="options-list" id="optionsGroup"></div>
    </div>

    <div id="feedbackMsg"></div>
    <button class="next-btn" id="nextQuestionBtn" onclick="nextQuestion()">ಮುಂದಿನ ಪ್ರಶ್ನೆಗೆ ಸಾಗಿ ➡️</button>
</div>

<script {
type: text/javascript
}>
    // ಪಿಡಿಎಫ್ ಪಠ್ಯದಲ್ಲಿರುವ ಮಾಹಿತಿಗಳನ್ನು ಆಧರಿಸಿದ ೫ ನಿಖರ ಪ್ರಶ್ನೆಗಳು
    const rajkumarQuizData = [
        {
            question: "೧. ಡಾ. ರಾಜಕುಮಾರ್ ಅವರ ತಂದೆ-ತಾಯಿ ತಮ್ಮ ಇಷ್ಟದೈವ ಮುತ್ತತ್ತಿರಾಯನಿಗೆ ಹರಕೆ ಹೊತ್ತು, ಮಗನಿಗೆ ಇಟ್ಟಿದ್ದ ಮೊದಲ ಹೆಸರೇನು?",
            options: [
                "ರಾಜಕುಮಾರ",
                "ಮುತ್ತುರಾಜ",
                "ಪುಟ್ಟಸ್ವಾಮಯ್ಯ",
                "ನಟಸಾರ್ವಭೌಮ"
            ],
            correct: 1,
            explanation: "ತಂದೆ ಪುಟ್ಟಸ್ವಾಮಯ್ಯ ಮತ್ತು ತಾಯಿ ಲಕ್ಷ್ಮಮ್ಮನವರು ಮುತ್ತತ್ತಿರಾಯನಿಗೆ ಹರಕೆ ಹೊತ್ತು ಮಗನಿಗೆ 'ಮುತ್ತುರಾಜ' ಎಂದು ಹೆಸರಿಟ್ಟಿದ್ದರು."
        },
        {
            question: "೨. 1954ರಲ್ಲಿ ತೆರೆಕಂಡು, ಮುತ್ತುರಾಜ ಎಂಬ ಹೆಸರನ್ನು 'ರಾಜಕುಮಾರ' ಎಂದು ಬದಲಾಯಿಸಿ, ಅವರ ಬದುಕಿನಲ್ಲಿ ಹೊಸ ಅಧ್ಯಾಯ ಬರೆದ ಮೊದಲ ನಾಯಕ ನಟನ ಚಿತ್ರ ಯಾವುದು?",
            options: [
                "ಭಕ್ತ ಪ್ರಹ್ಲಾದ",
                "ಶ್ರೀನಿವಾಸ ಕಲ್ಯಾಣ",
                "ಬೇಡರ ಕಣ್ಣಪ್ಪ",
                "ಕಸ್ತೂರಿ ನಿವಾಸ"
            ],
            correct: 2,
            explanation: "ನಿರ್ದೇಶಕರಾದ ಎಚ್.ಎಲ್.ಎನ್. ಸಿಂಹ ಅವರು 'ಮುತ್ತುರಾಜ' ಎಂಬ ಹೆಸರನ್ನು 'ರಾಜಕುಮಾರ' ಎಂದು ಬದಲಾಯಿಸಿ 'ಬೇಡರ ಕಣ್ಣಪ್ಪ' ಚಿತ್ರದ ಮೂಲಕ ಪರಿಚಯಿಸಿದರು."
        },
        {
            question: "೩. 'ಸಂಪತ್ತಿಗೆ ಸವಾಲ್' ಚಿತ್ರದ ಯಾವ ಪ್ರಖ್ಯಾತ ಗೀತೆಯು ದಿನ ಬೆಳಗಾಗುವುದರೊಳಗೆ ರಾಜಕುಮಾರ್ ಅವರನ್ನು ಹಿನ್ನೆಲೆ ಗಾಯಕರನ್ನಾಗಿ ಪರಿಚಯಿಸಿತು?",
            options: [
                "ನಾದಮಯ ಈ ಲೋಕವೆಲ್ಲಾ",
                "ಯಾರೇ ಕೂಗಾಡಲಿ, ಊರೇ ಹೋರಾಡಲಿ",
                "ಸವಿಗನ್ನಡದ ಕಂಪು ತುಂಬಿ",
                "ಹುಟ್ಟಿದರೆ ಕನ್ನಡ ನಾಡಲ್ಲಿ ಹುಟ್ಟಬೇಕು"
            ],
            correct: 1,
            explanation: "ಎಮ್ಮೆಯ ಮೇಲೆ ಕುಳಿತು ಹಾಡಿದ 'ಯಾರೇ ಕೂಗಾಡಲಿ, ಊರೇ ಹೋರಾಡಲಿ' ಗೀತೆಯು ರಾಜಕುಮಾರ್ ಅವರನ್ನು ಹಿನ್ನೆಲೆ ಗಾಯಕರನ್ನಾಗಿ ಪರಿಚಯಿಸಿತು."
        },
        {
            question: "೪. ರಾಜಕುಮಾರ್ ಅವರು ಚಲನಚಿತ್ರ ರಂಗದಲ್ಲಿ ಹಾಡಿದ ಯಾವ ಅದ್ಭುತ ಶಾಸ್ತ್ರೀಯ ಗಾಯನಕ್ಕಾಗಿ ಭಾರತ ಸರ್ಕಾರದ ಅತ್ಯುನ್ನತ 'ರಾಷ್ಟ್ರಪ್ರಶಸ್ತಿ' ಮುಡಿಗೇರಿಸಿಕೊಂಡರು?",
            options: [
                "ಜೀವನ ಚೈತ್ರ ಚಿತ್ರದ 'ನಾದಮಯ ಈ ಲೋಕವೆಲ್ಲಾ'",
                "ಸನಾದಿ ಅಪ್ಪಣ್ಣ ಚಿತ್ರದ ಗೀತೆ",
                "ಬಂಗಾರದ ಮನುಷ್ಯ ಚಿತ್ರದ ಗೀತೆ",
                "ಕವಿರತ್ನ ಕಾಳಿದಾಸ ಚಿತ್ರದ ಗೀತೆ"
            ],
            correct: 0,
            explanation: "'ಜೀವನ ಚೈತ್ರ' ಚಿತ್ರದ 'ನಾದಮಯ ಈ ಲೋಕವೆಲ್ಲಾ ನಾದಮಯ' ಎಂಬ ಅದ್ಭುತ ಗಾಯನಕ್ಕಾಗಿ ಅವರಿಗೆ ರಾಷ್ಟ್ರಪ್ರಶಸ್ತಿ ಲಭಿಸಿತು."
        },
        {
            question: "೫. 1979ರಲ್ಲಿ ರಾಜಕುಮಾರ್ ಅವರ ಅಪೂರ್ವ ಕಲಾ ಸೇವೆಯನ್ನು ಗೌರವಿಸಿ ಯಾವ ವಿಶ್ವವಿದ್ಯಾಲಯವು ಅವರಿಗೆ 'ಗೌರವ ಡಾಕ್ಟರೇಟ್' ಪದವಿ ನೀಡಿ ಪುರಸ್ಕರಿಸಿತು?",
            options: [
                "ಕರ್ನಾಟಕ ವಿಶ್ವವಿದ್ಯಾಲಯ",
                "ಗುಲ್ಬರ್ಗ ವಿಶ್ವವಿದ್ಯಾಲಯ",
                "ಮೈಸೂರು ವಿಶ್ವವಿದ್ಯಾಲಯ",
                "ಬೆಂಗಳೂರು ವಿಶ್ವವಿದ್ಯಾಲಯ"
            ],
            correct: 2,
            explanation: "1979ರಲ್ಲಿ ಮೈಸೂರು ವಿಶ್ವವಿದ್ಯಾಲಯವು ಗೌರವ ಡಾಕ್ಟರೇಟ್ ಪದವಿ ನೀಡಿತು. ಅಂದಿನಿಂದ ಅವರು ಎಲ್ಲರ ಪ್ರೀತಿಯ 'ಡಾಕ್ಟರ್ ರಾಜಕುಮಾರ್' ಎನಿಸಿದರು."
        }
    ];

    let currentQuestionIndex = 0;
    let quizScore = 0;

    const quizQuestion = document.getElementById('quizQuestion');
    const optionsGroup = document.getElementById('optionsGroup');
    const feedbackMsg = document.getElementById('feedbackMsg');
    const nextQuestionBtn = document.getElementById('nextQuestionBtn');
    const reelFill = document.getElementById('reelFill');
    const projectorIcon = document.getElementById('projectorIcon');

    function playAudioTone(isCorrect) {
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(isCorrect ? 880 : 220, audioCtx.currentTime);
            gainNode.gain.setValueAtTime(0.08, audioCtx.currentTime);
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.2);
        } catch(e) {}
    }

    function loadQuestion() {
        feedbackMsg.innerText = "";
        nextQuestionBtn.style.display = "none";
        
        const currentData = rajkumarQuizData[currentQuestionIndex];
        quizQuestion.innerText = currentData.question;
        optionsGroup.innerHTML = "";

        currentData.options.forEach((opt, idx) => {
            const btn = document.createElement('button');
            btn.className = "opt-btn";
            btn.id = "opt_" + idx;
            btn.innerText = opt;
            btn.onclick = () => checkQuizAnswer(idx, currentData.correct, currentData.explanation);
            optionsGroup.appendChild(btn);
        });
    }

    function checkQuizAnswer(selected, correct, explanation) {
        const allBtns = optionsGroup.querySelectorAll('.opt-btn');
        allBtns.forEach(b => b.disabled = true);

        if (selected === correct) {
            document.getElementById("opt_" + selected).classList.add('correct-choice');
            feedbackMsg.innerHTML = `<span style='color:var(--neon-green);'>✅ ಸರಿಯಾದ ಉತ್ತರ! ಪ್ರೊಜೆಕ್ಟರ್ ಮುಂದೆ ಸಾಗಿತು.</span><br><small style='color:#cbd5e1;'>💡 <b>ವಿವರಣೆ:</b> ${explanation}</small>`;
            playAudioTone(true);
            quizScore++;
        } else {
            document.getElementById("opt_" + selected).classList.add('wrong-choice');
            document.getElementById("opt_" + correct).classList.add('correct-choice');
            feedbackMsg.innerHTML = `<span style='color:var(--danger-red);'>❌ ತಪ್ಪು ಉತ್ತರ! ಸರಿಯಾದ ವಿವರಣೆ ಗಮನಿಸಿ.</span><br><small style='color:#cbd5e1;'>💡 <b>ವಿವರಣೆ:</b> ${explanation}</small>`;
            playAudioTone(false);
        }

        // ಸಿನಿಮಾ ರೀಲ್ ಲೈವ್ ಮೂವ್ಮೆಂಟ್ ಲೆಕ್ಕಾಚಾರ
        const progressPercent = ((currentQuestionIndex + 1) / rajkumarQuizData.length) * 100;
        reelFill.style.width = progressPercent + "%";
        
        const maxMove = reelFill.parentElement.offsetWidth - 40; 
        const currentMove = (progressPercent / 100) * maxMove + 75;
        projectorIcon.style.left = currentMove + "px";

        nextQuestionBtn.style.display = "inline-block";
        if (currentQuestionIndex === rajkumarQuizData.length - 1) {
            nextQuestionBtn.innerText = "ಅಂತಿಮ ಫಲಿತಾಂಶ ನೋಡಿ 📋";
        }
    }

    function nextQuestion() {
        if (currentQuestionIndex < rajkumarQuizData.length - 1) {
            currentQuestionIndex++;
            loadQuestion();
        } else {
            // ಅಂತಿಮ ಫಲಿತಾಂಶದ ಸ್ಕ್ರೀನ್
            quizQuestion.innerText = "🏁 ಡಾ. ರಾಜಕುಮಾರ್ ಸಿನಿಕನ್ನಡ ಮಿಷನ್ ಪೂರ್ಣಗೊಂಡಿದೆ!";
            optionsGroup.innerHTML = "";
            
            let finalEvaluation = "";
            if (quizScore === rajkumarQuizData.length) {
                finalEvaluation = "<span style='color:var(--neon-green);'>🥇 ಅದ್ಭುತ ಜ್ಞಾನ ಸಾಧನೆ! ನೀವು ಡಾ. ರಾಜಕುಮಾರ್ ಅವರ ಬದುಕಿನ ಆದರ್ಶಗಳನ್ನು ಸಂಪೂರ್ಣವಾಗಿ ಗ್ರಹಿಸಿದ್ದೀರಿ!</span>";
            } else if (quizScore >= 3) {
                finalEvaluation = "<span style='color:var(--neon-blue);'>✨ ಉತ್ತಮ ಪ್ರಯತ್ನ! ರಾಜಕುಮಾರ್ ಅವರ ಮುಖ್ಯ ಮೈಲಿಗಲ್ಲುಗಳ ಜ್ಞಾನ ನಿಮಗಿದೆ.</span>";
            } else {
                finalEvaluation = "<span style='color:var(--danger-red);'>🔄 ಪಾಠದ ಮುಖ್ಯ ವಿಷಯಗಳನ್ನು ವಿದ್ಯಾರ್ಥಿಗೆ ಮತ್ತೊಮ್ಮೆ ಓದಿಸುವುದು ಸೂಕ್ತ.</span>";
            }

            feedbackMsg.innerHTML = `📊 <b>ಸಾಧನೆಯ ಮೌಲ್ಯಮಾಪನ ವರದಿ:</b><br>ಒಟ್ಟು ಗಳಿಸಿದ ಅಂಕಗಳು: <b>${quizScore} / ${rajkumarQuizData.length}</b><br><br>${finalEvaluation}`;
            
            nextQuestionBtn.innerText = "ಕ್ವಿಜ್ ರಿಸೆಟ್ 🔄";
            nextQuestionBtn.onclick = () => {
                currentQuestionIndex = 0;
                quizScore = 0;
                reelFill.style.width = "0%";
                projectorIcon.style.left = "75px";
                nextQuestionBtn.innerText = "ಮುಂದಿನ ಪ್ರಶ್ನೆಗೆ ಸಾಗಿ ➡️";
                nextQuestionBtn.onclick = nextQuestion;
                loadQuestion();
            };
        }
    }

    // ಆಟ ಆರಂಭ
    loadQuestion();
</script>

</body>
</html>
