<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ಸೂರ್ಯನ ಕರ್ತವ್ಯದ ಹಾದಿ - ಇಂಟರಾಕ್ಟಿವ್ ಆಕ್ಟಿವಿಟಿ</title>
    <style>
        :root {
            --primary-color: #ff9f43;
            --success-color: #1dd1a1;
            --bg-color: #f8f9fa;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .activity-container {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            max-width: 800px;
            width: 100%;
            text-align: center;
        }

        h2 {
            color: #d35400;
            margin-bottom: 10px;
        }

        .instruction {
            color: #7f8c8d;
            font-size: 16px;
            margin-bottom: 30px;
        }

        .game-zone {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .sun-center {
            position: relative;
            width: 180px;
            height: 180px;
            background: radial-gradient(circle, #fff200, #ff9f43);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 40px #ff9f43;
            font-weight: bold;
            font-size: 20px;
            color: #d35400;
            animation: pulse 2s infinite alternate;
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 30px #ff9f43; }
            100% { transform: scale(1.05); box-shadow: 0 0 50px #ffaa66; }
        }

        .drop-targets-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            width: 360px;
        }

        .drop-box {
            border: 2px dashed #ff9f43;
            background-color: #fffaf0;
            padding: 15px;
            border-radius: 15px;
            min-height: 90px;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.3s;
        }

        /* ದೊಡ್ಡದಾಗಿ ಕಾಣುವ ಲೋಗೋ/ಎಮೋಜಿಗಳ ಶೈಲಿ */
        .drop-box .logo-icon {
            font-size: 45px;
            transition: all 0.3s;
        }

        /* ಸರಿಯಾದ ಉತ್ತರ ಬಂದಾಗ ಕಾಣುವ ಪಠ್ಯದ ಶೈಲಿ */
        .drop-box .answer-text {
            font-size: 16px;
            color: #0f9b74;
            font-weight: bold;
            margin-left: 10px;
            display: none;
        }

        .drop-box.hovered {
            background-color: #ffeaa7;
            border-style: solid;
        }

        .drop-box.correct {
            background-color: #e3faf2;
            border-color: var(--success-color);
            border-style: solid;
            flex-direction: row;
        }

        .drop-box.correct .logo-icon {
            font-size: 30px; /* ಉತ್ತರ ಬಂದಾಗ ಲೋಗೋ ಸ್ವಲ್ಪ ಸಣ್ಣದಾಗಿ ಪಕ್ಕಕ್ಕೆ ಸರಿಯುತ್ತದೆ */
        }

        .drop-box.correct .answer-text {
            display: block;
        }

        .drag-options-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            padding: 25px;
            background: #f1f2f6;
            border-radius: 15px;
        }

        .draggable-card {
            background: white;
            border: 1px solid #c8d6e5;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: grab;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            font-weight: 500;
            transition: transform 0.2s, box-shadow 0.2s;
            user-select: none;
        }

        .draggable-card:active {
            cursor: grabbing;
            transform: scale(0.95);
        }

        .draggable-card.dragging {
            opacity: 0.5;
        }

        #message {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
            color: var(--success-color);
            min-height: 27px;
        }

        .reset-btn {
            margin-top: 15px;
            background-color: #d35400;
            color: white;
            border: none;
            padding: 10px 25px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
            display: none;
        }

        .reset-btn:hover {
            background-color: #e67e22;
        }

        @media (max-width: 600px) {
            .game-zone { flex-direction: column; }
            .drop-targets-container { width: 100%; grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="activity-container">
    <h2>೧. ಸೂರ್ಯನ ಕರ್ತವ್ಯದ ಹಾದಿ ☀️</h2>
    <p class="instruction">ಕೆಳಗಿರುವ ಆಯ್ಕೆಗಳಿಂದ ಸೂರ್ಯನ ಕರ್ತವ್ಯಗಳನ್ನು ಮಾತ್ರ ಆರಿಸಿ, ಬಲಭಾಗದಲ್ಲಿರುವ ಸೂಕ್ತವಾದ ದೊಡ್ಡ ಲೋಗೋಗಳ ಬಾಕ್ಸ್‌ಗೆ ಎಳೆದು ಹಾಕಿ!</p>

    <div class="game-zone">
        <div class="sun-center">
            <span>ಸೂರ್ಯ</span>
        </div>

        <div class="drop-targets-container">
            <div class="drop-box" data-match="ಮೋಡ ಕೂಡಿಸಲು">
                <span class="logo-icon">☁️</span>
                <span class="answer-text"></span>
            </div>
            <div class="drop-box" data-match="ಇಳೆಗೆ ಮಳೆ ತರಲು">
                <span class="logo-icon">🌧️</span>
                <span class="answer-text"></span>
            </div>
            <div class="drop-box" data-match="ಬೆಳಕ ನೀಡಲು">
                <span class="logo-icon">💡</span>
                <span class="answer-text"></span>
            </div>
            <div class="drop-box" data-match="ಬಿಸಿಯನೂಡಲು">
                <span class="logo-icon">🔥</span>
                <span class="answer-text"></span>
            </div>
            <div class="drop-box" data-match="ಭೂಮಿಯ ಪೋಷಕ">
                <span class="logo-icon">🌍</span>
                <span class="answer-text"></span>
            </div>
        </div>
    </div>

    <div class="drag-options-container" id="optionsContainer">
        <div class="draggable-card" draggable="true" id="card1">ಮೋಡ ಕೂಡಿಸಲು</div>
        <div class="draggable-card" draggable="true" id="card2">ಇಳೆಗೆ ಮಳೆ ತರಲು</div>
        <div class="draggable-card" draggable="true" id="card3">ಬೆಳಕ ನೀಡಲು</div>
        <div class="draggable-card" draggable="true" id="card4">ಬಿಸಿಯನೂಡಲು</div>
        <div class="draggable-card" draggable="true" id="card5">ಭೂಮಿಯ ಪೋಷಕ</div>
        
        <div class="draggable-card" draggable="true" id="err1">ಚಂದ್ರನ ಮಡಿಲು ಸೇರಲು</div>
        <div class="draggable-card" draggable="true" id="err2">ಕೆಂಪು ಬಂಡೆಯಾಗಲು</div>
        <div class="draggable-card" draggable="true" id="err3">ಮರ ಕಡಿಯಲು ಬರಲು</div>
        <div class="draggable-card" draggable="true" id="err4">ಬಿರು ಬಿಸಿಲಿಗೆ ಅಂಜಲು</div>
    </div>

    <div id="message"></div>
    <button class="reset-btn" id="resetBtn" onclick="resetGame()">ಮತ್ತೆ ಆಡಿ 🔄</button>
</div>

<script>
    const cards = document.querySelectorAll('.draggable-card');
    const boxes = document.querySelectorAll('.drop-box');
    const container = document.getElementById('optionsContainer');
    const message = document.getElementById('message');
    const resetBtn = document.getElementById('resetBtn');
    let score = 0;

    function shuffleOptions() {
        const cardsArray = Array.from(cards);
        cardsArray.sort(() => Math.random() - 0.5);
        cardsArray.forEach(card => container.appendChild(card));
    }

    shuffleOptions();

    // Drag Events
    cards.forEach(card => {
        card.addEventListener('dragstart', () => {
            card.classList.add('dragging');
        });

        card.addEventListener('dragend', () => {
            card.classList.remove('dragging');
        });
    });

    // Drop Events
    boxes.forEach(box => {
        box.addEventListener('dragover', (e) => {
            e.preventDefault();
            if (!box.classList.contains('correct')) {
                box.classList.add('hovered');
            }
        });

        box.addEventListener('dragleave', () => {
            box.classList.remove('hovered');
        });

        box.addEventListener('drop', () => {
            box.classList.remove('hovered');
            const draggingCard = document.querySelector('.dragging');
            if (!draggingCard) return;

            if (box.dataset.match === draggingCard.innerText) {
                box.classList.add('correct');
                
                // ಲೋಗೋದ ಪಕ್ಕದಲ್ಲಿ ಸರಿಯಾದ ಉತ್ತರವನ್ನು ತೋರಿಸಲು
                const textSpan = box.querySelector('.answer-text');
                textSpan.innerText = "✅ " + draggingCard.innerText;
                
                draggingCard.style.display = 'none';
                score++;
                checkWin();
            } else {
                // ತಪ್ಪು ಉತ್ತರಕ್ಕೆ ಕೆಂಪು ಬಣ್ಣದ ಮಿನುಗು
                box.style.borderColor = '#ff4d4d';
                box.style.backgroundColor = '#fff5f5';
                setTimeout(() => {
                    if(!box.classList.contains('correct')) {
                        box.style.borderColor = '#ff9f43';
                        box.style.backgroundColor = '#fffaf0';
                    }
                }, 500);
            }
        });
    });

    function checkWin() {
        if (score === boxes.length) {
            message.innerText = "🎉 ಅದ್ಭುತ! ಸೂರ್ಯನ ಎಲ್ಲಾ ಕರ್ತವ್ಯಗಳನ್ನು ಯಶಸ್ವಿಯಾಗಿ ಜೋಡಿಸಿದ್ದೀರಿ!";
            resetBtn.style.display = 'inline-block';
        }
    }

    function resetGame() {
        score = 0;
        message.innerText = "";
        resetBtn.style.display = 'none';
        
        boxes.forEach((box) => {
            box.className = "drop-box";
            box.querySelector('.answer-text').innerText = "";
            box.style.borderColor = '#ff9f43';
            box.style.backgroundColor = '#fffaf0';
        });

        cards.forEach(card => {
            card.style.display = 'block';
        });

        shuffleOptions();
    }
</script>

</body>
</html>
