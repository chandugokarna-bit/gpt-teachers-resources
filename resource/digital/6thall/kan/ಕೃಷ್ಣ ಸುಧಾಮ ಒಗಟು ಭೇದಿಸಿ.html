<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ಕೃಷ್ಣ - ಸುಧಾಮ: ಒಗಟು ಮಹಾ ಸಾಮ್ರಾಜ್ಯ</title>
    <style>
        :root {
            --space-bg: #040613;
            --neon-blue: #00d2d3;
            --neon-gold: #ffa502;
            --neon-green: #1dd1a1;
            --danger-red: #ff4d4d;
            --card-dark: #0f122c;
            --text-light: #f1f2f6;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--space-bg);
            color: var(--text-light);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            user-select: none;
        }

        .activity-container {
            background: linear-gradient(145deg, #0d112d, #14193f);
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 15px 40px rgba(0, 210, 211, 0.15);
            max-width: 850px;
            width: 100%;
            text-align: center;
            border: 1px solid rgba(0, 210, 211, 0.2);
        }

        h2 {
            color: var(--neon-blue);
            margin-bottom: 5px;
            text-shadow: 0 0 10px rgba(0, 210, 211, 0.4);
            font-size: 26px;
        }

        .instruction {
            color: #a4b0be;
            font-size: 16px;
            margin-bottom: 30px;
        }

        /* ೮ ರಹಸ್ಯ ಬಾಗಿಲುಗಳ ಸ್ಕ್ರಾಲ್ ಮಾಡಬಹುದಾದ ಕಂಟೈನರ್ */
        .doors-container {
            display: flex;
            justify-content: flex-start;
            overflow-x: auto;
            gap: 15px;
            margin-bottom: 35px;
            padding: 15px 5px;
            border-bottom: 1px solid #1e2554;
        }

        /* ಸ್ಕ್ರಾಲ್ ಬಾರ್ ವಿನ್ಯಾಸ */
        .doors-container::-webkit-scrollbar {
            height: 6px;
        }
        .doors-container::-webkit-scrollbar-thumb {
            background: var(--neon-blue);
            border-radius: 10px;
        }

        .secret-door {
            background: var(--card-dark);
            border: 3px solid #2e3775;
            border-radius: 15px;
            min-width: 110px;
            height: 150px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 8px;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 6px 12px rgba(0,0,0,0.4);
        }

        .secret-door:hover:not(.opened) {
            transform: translateY(-5px);
            border-color: var(--neon-gold);
            box-shadow: 0 0 15px rgba(255, 165, 2, 0.3);
        }

        .door-icon {
            font-size: 38px;
            transition: transform 0.3s;
        }

        .door-label {
            font-size: 13px;
            font-weight: bold;
            color: #8a92a6;
        }

        .secret-door.active-door {
            border-color: var(--neon-blue);
            background: #171c3d;
            box-shadow: 0 0 20px rgba(0, 210, 211, 0.5);
        }

        .secret-door.opened {
            border-color: var(--neon-green);
            background: rgba(29, 209, 161, 0.1);
            cursor: default;
            box-shadow: 0 0 10px rgba(29, 209, 161, 0.2);
        }

        /* ಒಗಟು ಪ್ರದರ್ಶನ ಬೋರ್ಡ್ */
        .riddle-monitor {
            background: #040610;
            border: 2px dashed #2e3775;
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 30px;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .riddle-text {
            font-size: 21px;
            font-weight: bold;
            line-height: 1.6;
            color: var(--neon-gold);
            text-shadow: 0 0 8px rgba(255, 165, 2, 0.2);
            animation: fadeIn 0.4s ease-in-out;
        }

        /* ಆಯ್ಕೆಗಳ ವಲಯ */
        .options-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 25px;
        }

        .opt-card {
            background-color: var(--card-dark);
            border: 2px solid #3d4852;
            padding: 15px;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            box-shadow: 0 5px 10px rgba(0,0,0,0.3);
        }

        .opt-card:hover:not(.disabled) {
            border-color: var(--neon-blue);
            transform: scale(1.05);
            background-color: #141935;
        }

        .opt-emoji { font-size: 45px; }
        .opt-name { font-size: 16px; font-weight: bold; color: #cbd5e1; }

        .opt-card.correct-answer {
            background-color: rgba(29, 209, 161, 0.15) !important;
            border-color: var(--neon-green) !important;
            box-shadow: 0 0 15px rgba(29, 209, 161, 0.3);
        }
        .opt-card.correct-answer .opt-name { color: var(--neon-green); }

        .opt-card.wrong-answer {
            background-color: rgba(255, 77, 77, 0.15) !important;
            border-color: var(--danger-red) !important;
        }
        .opt-card.wrong-answer .opt-name { color: var(--danger-red); }

        .opt-card.disabled { opacity: 0.5; cursor: default; }

        #statusMsg {
            font-size: 18px;
            font-weight: bold;
            min-height: 27px;
            margin-top: 15px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 650px) {
            .options-grid { grid-template-columns: 1fr; gap: 15px; }
            .opt-card { flex-direction: row; justify-content: center; gap: 20px; }
        }
    </style>
</head>
<body>

<div class="activity-container">
    <h2>೧. ಒಗಟುಗಳ ಮಹಾ ಸಾಮ್ರಾಜ್ಯ 🔑🚪</h2>
    <p class="instruction"><b>೮ ರಹಸ್ಯ ಬಾಗಿಲುಗಳ ಸವಾಲು:</b> ಯಾವುದೇ ಒಂದು ಬಾಗಿಲನ್ನು ಕ್ಲಿಕ್ ಮಾಡಿ, ಒಗಟನ್ನು ಓದಿ ಸರಿಯಾದ ಚಿತ್ರದ ಆಪ್ಷನ್ ಆರಿಸಿ ಬಾಗಿಲು ತೆರೆಯಿರಿ!</p>

    <div class="doors-container" id="doorsScroll">
        </div>

    <div class="riddle-monitor">
        <div class="riddle-text" id="riddleText">🔍 ಆಟ ಆರಂಭಿಸಲು ಮೇಲಿನ ಯಾವುದಾದರೂ ಒಂದು ರಹಸ್ಯ ಬಾಗಿಲನ್ನು ಕ್ಲಿಕ್ ಮಾಡಿ...</div>
    </div>

    <div class="options-grid" id="optionsContainer" style="display: none;">
        <div class="opt-card" id="opt_0" onclick="verifyAnswer(0)">
            <span class="opt-emoji" id="emoji_0"></span>
            <span class="opt-name" id="name_0"></span>
        </div>
        <div class="opt-card" id="opt_1" onclick="verifyAnswer(1)">
            <span class="opt-emoji" id="emoji_1"></span>
            <span class="opt-name" id="name_1"></span>
        </div>
        <div class="opt-card" id="opt_2" onclick="verifyAnswer(2)">
            <span class="opt-emoji" id="emoji_2"></span>
            <span class="opt-name" id="name_2"></span>
        </div>
    </div>

    <div id="statusMsg"></div>
</div>

<script>
    // ೩ ಪಠ್ಯಪುಸ್ತಕದ ಒಗಟುಗಳು + ೫ ಹೊಸ ರೋಮಾಂಚಕಾರಿ ಒಗಟುಗಳು
    const riddlesData = {
        1: {
            riddle: "“ಕೂಗಿದರೆ ರಾವಣ, ಹಾರಿದರೆ ಹನುಮಂತ, கூತರೆ ಮುನಿ. ಹಾಗಾದರೆ ನಾನು ಯಾರು?”",
            options: [
                { emoji: "🐵", name: "ಕೋತಿ" },
                { emoji: "🐸", name: "ಕಪ್ಪೆ" },
                { emoji: "🐦", name: "ಹಕ್ಕಿ" }
            ],
            correct: 1, // ಕಪ್ಪೆ
            solved: false
        },
        2: {
            riddle: "“ಚಿಪ್ಪುಂಟು ಆಮೆಯಲ್ಲ, ಜುಟ್ಟುಂಟು ಪೂಜಾರಿಯಲ್ಲ. ಮೂರು ಕಣ್ಣುಂಟು ಹರನಲ್ಲ, ಹಾಗಾದರೆ ನಾನು ಯಾರು?”",
            options: [
                { emoji: "🥥", name: "ತೆಂಗಿನ ಕಾಯಿ" },
                { emoji: "🍍", name: "ಅನಾನಸ್" },
                { emoji: "🧅", name: "ಈರುಳ್ಳಿ" }
            ],
            correct: 0, // ತೆಂಗಿನ ಕಾಯಿ
            solved: false
        },
        3: {
            riddle: "“ಮುಳ್ಳುಗಳಿವೆ ಅಪಾಯವಿಲ್ಲ. ಸಂಖ್ಯೆಗಳಿವೆ ಲೆಕ್ಕದ ಪುಸ್ತಕವಲ್ಲ, ಗಂಟೆ ಹೊಡೆಯುತ್ತದೆ ದೇವಾಲಯವಲ್ಲ. ಹಾಗಾದರೆ ನಾನು ಯಾರು?”",
            options: [
                { emoji: "📖", name: "ಪುಸ್ತಕ" },
                { emoji: "🔔", name: "ದೇವಸ್ಥಾನದ ಗಂಟೆ" },
                { emoji: "⏰", name: "ಗಡಿಯಾರ" }
            ],
            correct: 2, // ಗಡಿಯಾರ
            solved: false
        },
        4: {
            riddle: "“ಅಣ್ಣ ತಮ್ಮಂದಿರು ಒಟ್ಟಿಗೆ ಇರುತ್ತಾರೆ, ಆದರೆ ಒಬ್ಬರನ್ನೊಬ್ಬರು ಎಂದಿಗೂ ನೋಡುವುದಿಲ್ಲ! ನಾವು ಯಾರು?”",
            options: [
                { emoji: "👀", name: "ಕಣ್ಣುಗಳು" },
                { emoji: "👂", name: "ಕಿವಿಗಳು" },
                { emoji: "👐", name: "ಕೈಗಳು" }
            ],
            correct: 0, // ಕಣ್ಣುಗಳು
            solved: false
        },
        5: {
            riddle: "“ನೀರನ್ನು ಕುಡಿದರೆ ಸತ್ತು ಹೋಗುತ್ತೇನೆ, ಗಾಳಿಯನ್ನು ಉಸಿರಾಡಿದರೆ ಬದುಕಿ ಬಾಳುತ್ತೇನೆ! ನಾನು ಯಾರು?”",
            options: [
                { emoji: "💨", name: "ಗಾಳಿ" },
                { emoji: "🔥", name: "ಬೆಂಕಿ" },
                { emoji: "🪵", name: "ಕಟ್ಟಿಗೆ" }
            ],
            correct: 1, // ಬೆಂಕಿ
            solved: false
        },
        6: {
            riddle: "“ರೆಕ್ಕೆಗಳಿಲ್ಲದೆ ಆಕಾಶದಲ್ಲಿ ಹಾರುತ್ತೇನೆ, ದಾರವಿಲ್ಲದೆ ಮೇಲೆ ತೇಲುತ್ತೇನೆ, ಕಣ್ಣೀರು ಸುರಿಸುತ್ತಾ ಕರಗಿ ಹೋಗುತ್ತೇನೆ! ನಾನು ಯಾರು?”",
            options: [
                { emoji: "🪁", name: "ಗಾಳಿಪಟ" },
                { emoji: "☁️", name: "ಮೋಡ" },
                { emoji: "🚀", name: "ರಾಕೆಟ್" }
            ],
            correct: 1, // ಮೋಡ
            solved: false
        },
        7: {
            riddle: "“ಬರೆಯಲು ಪೆನ್ನಲ್ಲ, ಅಳಿಸಲು ರಬ್ಬರಲ್ಲ, ಆದರೂ ಕಪ್ಪು ಬೋರ್ಡ್ ತುಂಬ ಮುಖ ತೋರಿಸುವ ಕನ್ನಡಿ ನಾನು! ನಾನು ಯಾರು?”",
            options: [
                { emoji: "📱", name: "ಮೊಬೈಲ್ ಸ್ಕ್ರೀನ್" },
                { emoji: "🪞", name: "ಸಾಧಾರಣ ಕನ್ನಡಿ" },
                { emoji: "💻", name: "ಲ್ಯಾಪ್ಟಾಪ್" }
            ],
            correct: 0, // ಮೊಬೈಲ್ ಸ್ಕ್ರೀನ್
            solved: false
        },
        8: {
            riddle: "“ಹಗಲಿನಲ್ಲಿ ಕಣ್ಮರೆಯಾಗುತ್ತೇನೆ, ರಾತ್ರಿಯಲ್ಲಿ ಕೋಟಿ ಕೋಟಿ ಸಂಖ್ಯೆಯಲ್ಲಿ ಬಂದು ಮಿನುಗುತ್ತೇನೆ! ನಾವು ಯಾರು?”",
            options: [
                { emoji: "🦉", name: "ಗೂಬೆಗಳು" },
                { emoji: "🌟", name: "ನಕ್ಷತ್ರಗಳು" },
                { emoji: "🦇", name: "ಬಾವಲಿಗಳು" }
            ],
            correct: 1, // ನಕ್ಷತ್ರಗಳು
            solved: false
        }
    };

    let activeDoorNum = null;
    let totalSolvedCount = 0;
    const totalDoors = Object.keys(riddlesData).length;

    // ಬ್ರೌಸರ್ ಆಡಿಯೋ ಫ್ರೀಕ್ವೆನ್ಸಿ ಎಫೆಕ್ಟ್
    function playLaserSound(isCorrect) {
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            if (isCorrect) {
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(650, audioCtx.currentTime);
                oscillator.frequency.exponentialRampToValueAtTime(1500, audioCtx.currentTime + 0.2);
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
            } else {
                oscillator.type = 'sawtooth';
                oscillator.frequency.setValueAtTime(260, audioCtx.currentTime);
                oscillator.frequency.setValueAtTime(110, audioCtx.currentTime + 0.25);
                gainNode.gain.setValueAtTime(0.08, audioCtx.currentTime);
            }

            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.25);
        } catch (e) {}
    }

    // ೮ ಬಾಗಿಲುಗಳನ್ನು ಆಟೋಮ್ಯಾಟಿಕ್ ಆಗಿ ಸೃಷ್ಟಿಸುವ ಫಂಕ್ಷನ್
    function generateDoors() {
        const doorsScroll = document.getElementById('doorsScroll');
        doorsScroll.innerHTML = "";
        for (let i = 1; i <= totalDoors; i++) {
            const door = document.createElement('div');
            door.className = "secret-door";
            door.id = `door_${i}`;
            door.onclick = () => selectDoor(i);
            door.innerHTML = `
                <span class="door-icon" id="icon_${i}">🚪</span>
                <span class="door-label" id="label_${i}">ಬಾಗಿಲು ${i}</span>
            `;
            doorsScroll.appendChild(door);
        }
    }

    function selectDoor(doorNum) {
        if (riddlesData[doorNum].solved) return;

        for (let i = 1; i <= totalDoors; i++) {
            const d = document.getElementById(`door_${i}`);
            if (!riddlesData[i].solved) d.className = "secret-door";
        }

        activeDoorNum = doorNum;
        document.getElementById(`door_${doorNum}`).className = "secret-door active-door";
        document.getElementById('statusMsg').innerText = "";

        const currentData = riddlesData[doorNum];
        document.getElementById('riddleText').innerText = currentData.riddle;

        document.getElementById('optionsContainer').style.display = "grid";
        for (let idx = 0; idx < 3; idx++) {
            const card = document.getElementById(`opt_${idx}`);
            card.className = "opt-card";
            document.getElementById(`emoji_${idx}`).innerText = currentData.options[idx].emoji;
            document.getElementById(`name_${idx}`).innerText = currentData.options[idx].name;
        }
    }

    function verifyAnswer(selectedIdx) {
        if (!activeDoorNum || riddlesData[activeDoorNum].solved) return;

        const currentData = riddlesData[activeDoorNum];
        const statusMsg = document.getElementById('statusMsg');

        for (let i = 0; i < 3; i++) {
            document.getElementById(`opt_${i}`).classList.add('disabled');
        }

        if (selectedIdx === currentData.correct) {
            document.getElementById(`opt_${selectedIdx}`).className = "opt-card correct-answer";
            statusMsg.innerHTML = "<span style='color:var(--neon-green);'>🎉 ಅತ್ಯದ್ಭುತ! ಸರಿಯಾದ ಉತ್ತರ ನೀಡಿ ರಹಸ್ಯ ಬಾಗಿಲನ್ನು ತೆರೆದಿದ್ದೀರಿ!</span>";
            playLaserSound(true);

            riddlesData[activeDoorNum].solved = true;
            const doorElement = document.getElementById(`door_${activeDoorNum}`);
            doorElement.className = "secret-door opened";
            document.getElementById(`icon_${activeDoorNum}`).innerText = "🔓✨";
            document.getElementById(`label_${activeDoorNum}`).innerText = "ತೆರೆದಿದೆ ✅";

            totalSolvedCount++;
            activeDoorNum = null;

            if (totalSolvedCount === totalDoors) {
                setTimeout(() => {
                    document.getElementById('optionsContainer').style.display = "none";
                    document.getElementById('riddleText').innerHTML = "👑 <b>ಮಹಾ ಚತುರ ಒಗಟುಗಾರ ಚಕ್ರವರ್ತಿ!</b><br>ನೀವು ಸಾಮ್ರಾಜ್ಯದ ಎಲ್ಲಾ ೮ ಕಠಿಣ ಒಗಟುಗಳನ್ನು ಯಶಸ್ವಿಯಾಗಿ ಭೇದಿಸಿದ್ದೀರಿ!";
                    statusMsg.innerHTML = "<span style='color:var(--neon-gold);'>🥇 ವಿದ್ಯಾರ್ಥಿಗಳ ತಾರ್ಕಿಕ ಚಿಂತನೆಗೆ ನೂರಕ್ಕೆ ನೂರು ಅಂಕಗಳು ಸಿಕ್ಕಿವೆ!</span>";
                }, 1500);
            }
        } else {
            document.getElementById(`opt_${selectedIdx}`).className = "opt-card wrong-answer";
            document.getElementById(`opt_${currentData.correct}`).className = "opt-card correct-answer";
            statusMsg.innerHTML = "<span style='color:var(--danger-red);'>❌ ತಪ್ಪು ಉತ್ತರ! ಒಗಟಿನ ರಹಸ್ಯವನ್ನು ಮತ್ತೊಮ್ಮೆ ಯೋಚಿಸಿ ಪ್ರಯತ್ನಿಸಿ.</span>";
            playLaserSound(false);

            setTimeout(() => {
                if (activeDoorNum) {
                    for (let i = 0; i < 3; i++) {
                        const card = document.getElementById(`opt_${i}`);
                        card.classList.remove('disabled');
                        if (card.classList.contains('wrong-answer')) card.className = "opt-card";
                        if (card.classList.contains('correct-answer')) card.className = "opt-card";
                    }
                    statusMsg.innerText = "";
                }
            }, 1500);
        }
    }

    // ಆಟ ಪ್ರಾರಂಭ
    generateDoors();
</script>

</body>
</html>
