<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ಏಲಿಯನ್ ಭಾಷೆಯ ಕೋಡ್ ಬ್ರೇಕ್ - ಇಂಟರಾಕ್ಟಿವ್ ಆಕ್ಟಿವಿಟಿ</title>
    <style>
        :root {
            --space-bg: #060913;
            --alien-green: #00ff88;
            --laser-blue: #00a8ff;
            --danger-red: #ff4d4d;
            --panel-bg: #141a29;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--space-bg);
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .activity-container {
            background: linear-gradient(145deg, #0f1424, #182038);
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 15px 40px rgba(0, 255, 136, 0.12);
            max-width: 750px;
            width: 100%;
            text-align: center;
            border: 1px solid rgba(0, 255, 136, 0.2);
        }

        h2 {
            color: var(--alien-green);
            margin-bottom: 5px;
            text-shadow: 0 0 12px rgba(0, 255, 136, 0.4);
        }

        .instruction {
            color: #a0a5c0;
            font-size: 16px;
            margin-bottom: 30px;
        }

        /* ಏಲಿಯನ್ ಮಾನಿಟರ್ ಸ್ಕ್ರೀನ್ */
        .alien-monitor {
            background: var(--panel-bg);
            border: 2px solid var(--laser-blue);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 30px;
            position: relative;
            box-shadow: inset 0 0 20px rgba(0, 168, 255, 0.2);
        }

        .alien-avatar {
            font-size: 60px;
            margin-bottom: 10px;
            transition: transform 0.3s;
        }

        /* ರಹಸ್ಯ ಸಂಕೇತ ಪ್ರದರ್ಶನ */
        .secret-cipher {
            background: #090d16;
            color: var(--alien-green);
            font-size: 32px;
            letter-spacing: 5px;
            padding: 15px;
            border-radius: 10px;
            display: inline-block;
            margin-top: 10px;
            border: 1px dashed var(--alien-green);
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.6);
        }

        /* ಆಪ್ಷನ್ ಗ್ರಿಡ್ */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }

        .decode-btn {
            background-color: #1e272e;
            border: 2px solid #3d4852;
            color: #ffffff;
            padding: 16px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .decode-btn:hover:not(:disabled) {
            background-color: #2b3640;
            border-color: var(--laser-blue);
            transform: translateX(5px);
        }

        /* ಫಲಿತಾಂಶದ ಬಣ್ಣಗಳು */
        .decode-btn.correct-code {
            background-color: rgba(0, 255, 136, 0.15) !important;
            border-color: var(--alien-green) !important;
            color: var(--alien-green) !important;
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.3);
        }

        .decode-btn.wrong-code {
            background-color: rgba(255, 77, 77, 0.15) !important;
            border-color: var(--danger-red) !important;
            color: var(--danger-red) !important;
        }

        .status-message {
            font-size: 18px;
            font-weight: bold;
            margin-top: 15px;
            min-height: 27px;
        }

        .next-mission-btn {
            margin-top: 20px;
            background: linear-gradient(135deg, #00ff88, #00a8ff);
            color: #000000;
            border: none;
            padding: 12px 35px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            display: none;
            transition: transform 0.2s;
        }

        .next-mission-btn:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>

<div class="activity-container">
    <h2>೩. ಏಲಿಯನ್ ಭಾಷೆಯ ಕೋಡ್ ಬ್ರೇಕ್ 🛸</h2>
    <p class="instruction">ಮಂಗಳ ಗ್ರಹದ ಜೀವಿಗಳು ಕಳುಹಿಸುತ್ತಿರುವ ರಹಸ್ಯ ಸಂಕೇತವನ್ನು ಓದಿ, ಕೆಳಗಿನ ಸರಿಯಾದ ಕನ್ನಡ ಅರ್ಥವನ್ನು ಕ್ಲಿಕ್ ಮಾಡಿ ಕೋಡ್ ಬ್ರೇಕ್ ಮಾಡಿ!</p>

    <div class="alien-monitor">
        <div class="alien-avatar" id="alienEmoji">👽</div>
        <div style="font-size: 14px; color: #8a92a6;">ಮಂಗಳ ಗ್ರಹದಿಂದ ಬರುತ್ತಿರುವ ಸಂದೇಶ:</div>
        <div class="secret-cipher" id="cipherDisplay">⚡🛸🌀</div>
    </div>

    <div class="options-grid" id="optionsContainer">
        </div>

    <div class="status-message" id="statusMessage"></div>
    <button class="next-mission-btn" id="nextBtn" onclick="nextCipher()">ಮುಂದಿನ ಕೋಡ್ ➡️</button>
</div>

<script>
    // ಮಂಗಳ ಗ್ರಹದ ಪಾಠದ ಕಲ್ಪನೆಗೆ ತಕ್ಕ ಸಂಭಾಷಣೆ ಮತ್ತು ಕೋಡ್‌ಗಳು
    const alienCiphers = [
        {
            cipher: "🪐✨👽",
            options: ["ನನ್ನ ಹೆಸರು ಪುಟ್ಟಿ", "ನಮ್ಮ ಮಂಗಳ ಗ್ರಹಕ್ಕೆ ಸ್ವಾಗತ!", "ನಿಮ್ಮ ರಾಕೆಟ್ ಎಲ್ಲಿದೆ?", "ನಮಗೆ ಹಸಿವಾಗುತ್ತಿದೆ"],
            correct: 1
        },
        {
            cipher: "🛸❓🧑‍🚀",
            options: ["ನೀನು ಯಾರು? ಎಲ್ಲಿಂದ ಬಂದಿರುವೆ?", "ನಾನು ನಿಮ್ಮ ಸ್ನೇಹಿತ", "ನನ್ನನ್ನು ಮನೆಗೆ ಬಿಡಿ", "ಇದು ಕೆಂಪು ಗ್ರಹ"],
            correct: 0
        },
        {
            cipher: "🔴🧪💎",
            options: ["ಇಲ್ಲಿ ಮಳೆ ಬರುವುದಿಲ್ಲ", "ಮಂಗಳ ಗ್ರಹದಲ್ಲಿ ನೀರು ಸಿಗದು", "ನಮ್ಮ ಗ್ರಹದಲ್ಲಿ ಕೆಂಪು ಮಣ್ಣು ತುಂಬಿದೆ", "ಇಲ್ಲಿ ತೂಕ ತುಂಬಾ ಕಡಿಮೆ"],
            correct: 2
        },
        {
            cipher: "🤝🚀🌌",
            options: ["ನಾವು ಯುದ್ಧ ಮಾಡಲು ಬಂದಿಲ್ಲ", "ನಾವೆಲ್ಲರೂ ಬಾಹ್ಯಾಕಾಶ ಸ್ನೇಹಿತರು", "ಭೂಮಿಗೆ ವಾಪಸ್ ಹೋಗೋಣ", "ನಮ್ಮ ನೌಕೆ ರಿಪೇರಿ ಮಾಡಿ"],
            correct: 1
        }
    ];

    let currentCipherIndex = 0;
    let score = 0;

    const cipherDisplay = document.getElementById('cipherDisplay');
    const optionsContainer = document.getElementById('optionsContainer');
    const statusMessage = document.getElementById('statusMessage');
    const nextBtn = document.getElementById('nextBtn');
    const alienEmoji = document.getElementById('alienEmoji');

    // ಸೈ-ಫೈ ಲೇಸರ್ ಸೌಂಡ್ ಎಫೆಕ್ಟ್
    function playLaserSound(isCorrect) {
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            if (isCorrect) {
                oscillator.type = 'sawtooth';
                oscillator.frequency.setValueAtTime(800, audioCtx.currentTime);
                oscillator.frequency.exponentialRampToValueAtTime(1500, audioCtx.currentTime + 0.2);
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
            } else {
                oscillator.type = 'triangle';
                oscillator.frequency.setValueAtTime(300, audioCtx.currentTime);
                oscillator.frequency.setValueAtTime(100, audioCtx.currentTime + 0.3);
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
            }

            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.3);
        } catch (e) {
            console.log("Audio blocked.");
        }
    }

    function startGame() {
        currentCipherIndex = 0;
        score = 0;
        nextBtn.innerText = "ಮುಂದಿನ ಕೋಡ್ ➡️";
        showCipher();
    }

    function showCipher() {
        statusMessage.innerText = "";
        nextBtn.style.display = "none";
        alienEmoji.innerText = "👽";
        alienEmoji.style.transform = "scale(1)";

        const currentData = alienCiphers[currentCipherIndex];
        cipherDisplay.innerText = currentData.cipher;
        optionsContainer.innerHTML = "";

        currentData.options.forEach((opt, idx) => {
            const btn = document.createElement('button');
            btn.className = "decode-btn";
            btn.id = "opt_" + idx;
            btn.innerHTML = `<span>🤖</span> <span>${opt}</span>`;
            btn.onclick = () => verifyCode(idx, currentData.correct);
            optionsContainer.appendChild(btn);
        });
    }

    function verifyCode(selectedIdx, correctIdx) {
        const allButtons = optionsContainer.querySelectorAll('.decode-btn');
        allButtons.forEach(btn => btn.disabled = true);

        if (selectedIdx === correctIdx) {
            document.getElementById("opt_" + selectedIdx).classList.add('correct-code');
            statusMessage.innerHTML = "<span style='color:var(--alien-green);'>🎉 ಕೋಡ್ ಬ್ರೇಕ್ ಯಶಸ್ವಿ! ಏಲಿಯನ್ ಭಾಷೆಯನ್ನು ಸರಿಯಾಗಿ ಭೇದಿಸಿದ್ದೀರಿ!</span>";
            alienEmoji.innerText = "👾🕺"; // ಏಲಿಯನ್ ಡಾನ್ಸ್ ಮೂಡ್
            alienEmoji.style.transform = "scale(1.2)";
            playLaserSound(true);
            score++;
        } else {
            document.getElementById("opt_" + selectedIdx).classList.add('wrong-code');
            document.getElementById("opt_" + correctIdx).classList.add('correct-code');
            statusMessage.innerHTML = "<span style='color:var(--danger-red);'>❌ ಕೋಡ್ ಬ್ರೇಕ್ ವಿಫಲ! ಏಲಿಯನ್ ಸಿಗ್ನಲ್ ತಪ್ಪಾಗಿದೆ.</span>";
            alienEmoji.innerText = "🛸🤦‍♂️";
            playLaserSound(false);
        }

        nextBtn.style.display = "inline-block";
        if (currentCipherIndex === alienCiphers.length - 1) {
            nextBtn.innerText = "ಮಿಷನ್ ರಿಪೋರ್ಟ್ ನೋಡಿ 📊";
        }
    }

    function nextCipher() {
        if (currentCipherIndex < alienCiphers.length - 1) {
            currentCipherIndex++;
            showCipher();
        } else {
            // ಆಟ ಮುಕ್ತಾಯ
            cipherDisplay.innerText = "🛸 ಡೆಕೋಡಿಂಗ್ ಕಂಪ್ಲೀಟ್!";
            optionsContainer.innerHTML = "";
            alienEmoji.innerText = "👑👽";
            statusMessage.innerHTML = `📊 <b>ಬಾಹ್ಯಾಕಾಶ ಮಿಷನ್ ವರದಿ:</b><br> ನೀವು 4 ರಹಸ್ಯ ಕೋಡ್‌ಗಳಲ್ಲಿ <b>${score}</b> ಕೋಡ್‌ಗಳನ್ನು ಯಶಸ್ವಿಯಾಗಿ ಭೇದಿಸಿದ್ದೀರಿ!`;
            
            nextBtn.innerText = "ಮತ್ತೆ ಪ್ರಯತ್ನಿಸಿ 🔄";
            nextBtn.onclick = () => {
                nextBtn.onclick = nextCipher;
                startGame();
            };
        }
    }

    // ಆಟ ಆರಂಭ
    startGame();
</script>

</body>
</html>
