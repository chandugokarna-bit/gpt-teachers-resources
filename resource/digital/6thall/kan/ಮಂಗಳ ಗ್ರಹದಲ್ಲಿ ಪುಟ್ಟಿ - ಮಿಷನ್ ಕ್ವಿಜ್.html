<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ಮಂಗಳ ಗ್ರಹದಲ್ಲಿ ಪುಟ್ಟಿ - ಮಿಷನ್ ಕ್ವಿಜ್</title>
    <style>
        :root {
            --bg-space: #050612;
            --neon-mars: #ff5252;
            --neon-blue: #00d2d3;
            --neon-gold: #ffd32a;
            --neon-green: #1dd1a1;
            --danger-red: #ff4d4d;
            --card-dark: #0f1126;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-space);
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            user-select: none;
        }

        .activity-container {
            background: linear-gradient(145deg, #0d102b, #171c42);
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 15px 40px rgba(255, 82, 82, 0.15);
            max-width: 780px;
            width: 100%;
            text-align: center;
            border: 1px solid rgba(255, 82, 82, 0.2);
        }

        h2 {
            color: var(--neon-mars);
            text-shadow: 0 0 10px rgba(255, 82, 82, 0.4);
            font-size: 26px;
            margin-bottom: 5px;
        }

        .instruction { color: #a4b0be; font-size: 15px; margin-bottom: 25px; }

        /* ಸ್ಪೇಸ್ ಕ್ರಾಫ್ಟ್ ಪ್ರೋಗ್ರೆಸ್ ಬಾರ್ */
        .space-track-zone {
            background: #040510;
            border: 1px solid #1e2454;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
        }

        .space-line {
            flex: 1;
            background: #1e2554;
            height: 8px;
            border-radius: 4px;
            margin: 0 15px;
            position: relative;
        }

        .space-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, var(--neon-blue), var(--neon-mars));
            border-radius: 4px;
            transition: width 0.6s ease;
        }

        .rocket-icon {
            font-size: 32px;
            transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: absolute;
            left: 70px;
            top: 10px;
            filter: drop-shadow(0 0 8px var(--neon-mars));
        }

        .quiz-card {
            background: var(--card-dark);
            border: 1px solid #1e2454;
            border-radius: 18px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.4);
        }

        .quiz-text { font-size: 20px; font-weight: bold; line-height: 1.6; margin-bottom: 20px; text-align: left; }

        .options-list { display: flex; flex-direction: column; gap: 12px; }
        .opt-btn {
            background: #14193a; border: 2px solid #293475; color: #ffffff;
            padding: 15px 20px; font-size: 16px; font-weight: bold; border-radius: 12px;
            cursor: pointer; transition: all 0.2s; text-align: left;
        }
        .opt-btn:hover:not(:disabled) { border-color: var(--neon-mars); background: #1d2557; transform: translateX(5px); }
        .opt-btn.correct-choice { background: rgba(29, 209, 161, 0.15) !important; border-color: var(--neon-green) !important; color: var(--neon-green) !important; }
        .opt-btn.wrong-choice { background: rgba(255, 77, 77, 0.15) !important; border-color: var(--danger-red) !important; color: var(--danger-red) !important; }

        #feedbackMsg { font-size: 17px; font-weight: bold; margin-top: 20px; min-height: 27px; text-align: left; line-height: 1.6; }
        .next-btn {
            margin-top: 20px; background: linear-gradient(135deg, var(--neon-mars), #ff7675);
            color: white; border: none; padding: 12px 35px; font-size: 16px; font-weight: bold;
            border-radius: 8px; cursor: pointer; display: none;
        }
    </style>
</head>
<body>

<div class="activity-container">
    <h2>೨. ಮಂಗಳ ಯಾನ: ವಿಸ್ಮಯ ಗ್ರಹದ ರಹಸ್ಯ ಶೋಧನೆ 🪐</h2>
    <p class="instruction"><b>ಪದ್ಯದ ಕಥಾ ಸಾರಾಂಶ ಕ್ವಿಜ್:</b> ಪ್ರಶ್ನೆಗಳಿಗೆ ನಿಖರ ಉತ್ತರ ನೀಡಿ, ಪುಟ್ಟಿಯ ಬಾಹ್ಯಾಕಾಶ ನೌಕೆಯನ್ನು ಮಂಗಳ ತಲುಪಿಸಿ ಹಸಿರು ಉಳಿಸಿ!</p>
    
    <div class="space-track-zone">
        <span>🌍 ಭೂಮಿ</span>
        <div class="space-line">
            <div class="space-fill" id="spaceFill"></div>
        </div>
        <div class="rocket-icon" id="rocketIcon">🚀</div>
        <span>🔴 ಮಂಗಳ</span>
    </div>

    <div class="quiz-card">
        <div class="quiz-text" id="quizQuestion">ಪ್ರಶ್ನೆ ಲೋಡ್ ಆಗುತ್ತಿದೆ...</div>
        <div class="options-list" id="optionsGroup"></div>
    </div>

    <div id="feedbackMsg"></div>
    <button class="next-btn" id="nextBtn" onclick="nextQuestion()">ಮುಂದಿನ ಹಂತಕ್ಕೆ ಸಾಗಿ ➡️</button>
</div>

<script>
    const quizData = [
        {
            question: "೧. ಚಂದ್ರನ ಮೇಲೆ ನೆಟ್ಟಗೆ ನಿಂತು ಪುಟ್ಟಿ ನಮ್ಮ ಪ್ರೀತಿಯ ಭೂಮಿಯ (ಧರೆಯ) ಕಡೆಗೆ ಕಣ್ಣು ಹಾಯಿಸಿದಾಗ, ಭೂಮಿ ಅವಳಿಗೆ ಯಾವ ಬಣ್ಣದ ಚೆಂಡಿನಂತೆ ಕಂಡಿತು?",
            options: ["ಹಸಿರು ಬಣ್ಣದ ಚೆಂಡಿನಂತೆ", "ನೀಲಿ ಬಣ್ಣದ ಚೆಂಡಿನಂತೆ", "ನೇರಳೆ ಬಣ್ಣದ ಚೆಂಡಿನಂತೆ", "ಕೆಂಪು ಬಣ್ಣದ ಚೆಂಡಿನಂತೆ"],
            correct: 2,
            exp: "ಚಂದ್ರನ ಮೇಲೆ ನಿಂತು ನೋಡಿದಾಗ ನಮ್ಮ ಧರೆಯು ಪುಟ್ಟಿಗೆ ನೇರಳೆ ಬಣ್ಣದ ಚೆಂಡಿನ ಹಾಗೆ ಕಂಡಿತು ಎಂದು ಕವಿ ವರ್ಣಿಸಿದ್ದಾರೆ."
        },
        {
            question: "೨. ಚಂದ್ರನನ್ನು ಬಿಟ್ಟು ಮೇಲೆ ಹಾರಿದ ಪುಟ್ಟಿ ಮಂಗಳ ಗ್ರಹದ ಅಂಗಳ ತಲುಪಿದಾಗ ಅಲ್ಲಿನ ಪರಿಸರ ಅವಳಿಗೆ ಹೇಗೆ ಕಾಣಿಸಿತು?",
            options: ["ದಟ್ಟವಾದ ಹಸಿರು ಕಾಡಿನಂತೆ", "ಕೆಂಪಗೆ ಬಣಬಣಗುಟ್ಟುತ್ತಾ ಯಾವುದೇ ಜೀವವಿಲ್ಲದಂತೆ", "ತುಂಬಾ ಹರಿಯುವ ನದಿಗಳಿಂದ", "ದೊಡ್ಡ ದೊಡ್ಡ ಕಟ್ಟಡಗಳಿಂದ"],
            correct: 1,
            exp: "ಮಂಗಳನಂಗಳವು ಕೆಂಪಗೆ ಬಣಬಣಗುಟ್ಟುತ್ತಿತ್ತು ಮತ್ತು ಅಲ್ಲಿ ಯಾವುದೇ ಜೀವ ಸಂಕುಲ ಕಾಣಿಸಲಿಲ್ಲ."
        },
        {
            question: "೩. ಮಂಗಳ ಗ್ರಹದ ವಿಶಾಲ ಬಯಲಿನಲ್ಲಿ ಪುಟ್ಟಿಗೆ ಕಂಡ 'ಯೋಗಿ' ಹೆಸರಿನ ಹೆಬ್ಬಂಡೆಯು ಕಣ್ಣೀರು ಸುರಿಸುತ್ತಾ ತನ್ನ ಯಾವ ಕಥೆಯನ್ನು ಹೇಳಿತು?",
            options: ["ಮಂಗಳ ಗ್ರಹದ ವಿಜಯದ ಕಥೆ", "ಮಂಗಳ ಗ್ರಹದ ಸೌಂದರ್ಯದ ಕಥೆ", "ಮಂಗಳ ಗ್ರಹದ ಭೀಕರ ದುರಂತದ ಕಥೆ", "ನಕ್ಷತ್ರ ಲೋಕದ ಕಥೆ"],
            correct: 2,
            exp: "ಬಂಡೆಯು ಕಣ್ಣೀರನ್ನು ಸುರಿಸುತ್ತಾ ಮಂಗಳ ಗ್ರಹವು ಬರಡಾಗಿ ಹೋದ ನೋವಿನ ದುರಂತ ಕಥೆಯನ್ನು ಪುಟ್ಟಿಗೆ ತಿಳಿಸಿತು."
        },
        {
            question: "೪. 'ಯೋಗಿ' ಬಂಡೆಯ ವಿವರಣೆಯ ಪ್ರಕಾರ, ಹಿಂದೆ ಸಮೃದ್ಧವಾಗಿದ್ದ ಮಂಗಳ ಗ್ರಹದಲ್ಲಿ ಬರಗಾಲ ಬಂದು ಜೀವಿಗಳು ನಾಶವಾಗಲು ಅಲ್ಲಿನ ಜನರ ಯಾವ ತಪ್ಪು ಕಾರಣವಾಗಿತ್ತು?",
            options: ["ನಗರ ಹಾಗೂ ನಾಡನ್ನು ಕಟ್ಟಲು ಕಾಡಿನ ಮರಗಳನ್ನು ಕತ್ತರಿಸಿದ್ದು", "ಅತಿಯಾಗಿ ಮಳೆ ತರಿಸಿದ್ದು", "ಯುದ್ಧಗಳನ್ನು ಮಾಡಿದ್ದು", "ಯಂತ್ರಗಳನ್ನು ಬಳಸದೇ ಇದ್ದದ್ದು"],
            correct: 0,
            exp: "ಅಲ್ಲಿನ ಜನತೆಯು ನಾಡನ್ನು ಕಟ್ಟಲು ಕಾಡಿನ ಮರಗಳನ್ನು ಮನಬಂದಂತೆ ಕತ್ತರಿಸಿದ್ದರಿಂದ ಮಳೆ-ಬೆಳೆಯಿಲ್ಲದೆ ಬರಗಾಲ ಬಂದು ಜೀವಿಗಳು ಅಳಿದವು."
        },
        {
            question: "೫. ಮಂಗಳದ ಭೀಕರ ಸ್ಥಿತಿಯನ್ನು ಕಂಡು ಭಯಗೊಂಡ ಪುಟ್ಟಿ, ಭೂಮಿಗೆ ಮರಳಿದ ತಕ್ಷಣ ಪರಿಸರವನ್ನು ಉಳಿಸಲು ಸ್ವಯಂಪ್ರೇರಿತಳಾಗಿ ಏನು ಮಾಡಿದಳು?",
            options: ["ಲಾರಿಯಲ್ಲಿ ಪ್ರಯಾಣ ಬೆಳೆಸಿದಳು", "ಜನರ ಹತ್ತಿರ ಕೈಮುಗಿದು ಹಸಿರನ್ನು ಉಳಿಸಲು ಬೇಡುತ್ತಾ ತಾನೂ ಎಳೆ ಸಸಿಗಳನ್ನು ನೆಟ್ಟು ಪೋಷಿಸಿದಳು", "ಮತ್ತೆ ಚಂದ್ರನಿಗೆ ಓಡಿ ಹೋದಳು", "ಮರಗಳನ್ನು ಕಡಿಯಲು ಶುರು ಮಾಡಿದಳು"],
            correct: 1,
            exp: "ಪುಟ್ಟಿ ಧರೆಗೆ ಮರಳಿ ಬಂದು ಜನರಲ್ಲಿ ಹಸಿರನ್ನು ಉಳಿಸಲು ಬೇಡುತ್ತಾ, ತಾನೂ ಸ್ವತಃ ಎಳೆ ಸಸಿಗಳನ್ನು ನೆಟ್ಟು ಬೆಳೆಸಿ ಸಡಗರದಿಂದ ನಲಿದಳು."
        }
    ];

    let currentIdx = 0; let score = 0;
    const quizQuestion = document.getElementById('quizQuestion');
    const optionsGroup = document.getElementById('optionsGroup');
    const feedbackMsg = document.getElementById('feedbackMsg');
    const nextBtn = document.getElementById('nextBtn');
    const spaceFill = document.getElementById('spaceFill');
    const rocketIcon = document.getElementById('rocketIcon');

    function playAudioTone(isCorrect) {
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine'; osc.frequency.setValueAtTime(isCorrect ? 880 : 220, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.2);
        } catch(e) {}
    }

    function loadQuestion() {
        feedbackMsg.innerText = ""; nextBtn.style.display = "none";
        const currentData = quizData[currentIdx];
        quizQuestion.innerText = currentData.question;
        optionsGroup.innerHTML = "";

        currentData.options.forEach((opt, idx) => {
            const btn = document.createElement('button');
            btn.className = "opt-btn"; btn.id = "opt_" + idx; btn.innerText = opt;
            btn.onclick = () => checkAnswer(idx, currentData.correct, currentData.exp);
            optionsGroup.appendChild(btn);
        });
    }

    function checkAnswer(selected, correct, exp) {
        const allBtns = optionsGroup.querySelectorAll('.opt-btn');
        allBtns.forEach(b => b.disabled = true);

        if (selected === correct) {
            document.getElementById("opt_" + selected).classList.add('correct-choice');
            feedbackMsg.innerHTML = `<span style='color:var(--neon-green);'>✅ ಸರಿ ಉತ್ತರ! ನೌಕೆ ಮುಂದೆ ಸಾಗಿತು.</span><br><small style='color:#cbd5e1;'>💡 <b>ಪದ್ಯದ ಆಶಯ:</b> ${exp}</small>`;
            playAudioTone(true); score++;
        } else {
            document.getElementById("opt_" + selected).classList.add('wrong-choice');
            document.getElementById("opt_" + correct).classList.add('correct-choice');
            feedbackMsg.innerHTML = `<span style='color:var(--danger-red);'>❌ ತಪ್ಪು ಉತ್ತರ! ಸರಿಯಾದ ಕಾವ್ಯಭಾಗ ಗಮನಿಸಿ.</span><br><small style='color:#cbd5e1;'>💡 <b>ಪದ್ಯದ ಆಶಯ:</b> ${exp}</small>`;
            playAudioTone(false);
        }

        const progressPercent = ((currentIdx + 1) / quizData.length) * 100;
        spaceFill.style.width = progressPercent + "%";
        const maxMove = spaceFill.parentElement.offsetWidth - 40;
        rocketIcon.style.left = ((progressPercent / 100) * maxMove + 70) + "px";

        nextBtn.style.display = "inline-block";
        if (currentIdx === quizData.length - 1) nextBtn.innerText = "ಮಿಷನ್ ರಿಪೋರ್ಟ್ ನೋಡಿ 📋";
    }

    function nextQuestion() {
        if (currentIdx < quizData.length - 1) {
            currentIdx++; loadQuestion();
        } else {
            quizQuestion.innerText = "🏁 ಮಂಗಳ ಯಾನ ಪರಿಸರ ಮಿಷನ್ ಪೂರ್ಣಗೊಂಡಿದೆ!";
            optionsGroup.innerHTML = "";
            let res = score === quizData.length ? "<span style='color:var(--neon-green);'>🥇 ಅದ್ಭುತ ಪರಿಸರ ಪ್ರಜ್ಞೆ! ಮಗುವು ಕಾವ್ಯದ ನೈಜ ಸಂದೇಶವನ್ನು ಸಂಪೂರ್ಣವಾಗಿ ಗ್ರಹಿಸಿದೆ!</span>" : "<span style='color:var(--neon-blue);'>✨ ಉತ್ತಮ ಪ್ರಗತಿ! ಭೂಮಿಯ ಹಸಿರನ್ನು ಉಳಿಸುವ ಸಂಕಲ್ಪ ಮಾಡೋಣ.</span>";
            feedbackMsg.innerHTML = `📊 <b>ಅಂಕಗಳ ವಿವರ: ${score} / ${quizData.length}</b><br><br>${res}`;
            nextBtn.innerText = "ಮಿಷನ್ ರಿಸೆಟ್ 🔄";
            nextBtn.onclick = () => {
                currentIdx = 0; score = 0; spaceFill.style.width = "0%"; rocketIcon.style.left = "70px";
                nextBtn.innerText = "ಮುಂದಿನ ಹಂತಕ್ಕೆ ಸಾಗಿ ➡️"; nextBtn.onclick = nextQuestion; loadQuestion();
            };
        }
    }
    loadQuestion();
</script>
</body>
</html>
