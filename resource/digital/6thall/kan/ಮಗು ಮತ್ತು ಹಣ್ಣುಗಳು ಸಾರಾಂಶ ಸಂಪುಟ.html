    const poemTextTarget = document.getElementById('poemTextTarget');
    const summaryTextTarget = document.getElementById('summaryTextTarget');

    function playFruitSound() {
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(620, audioCtx.currentTime);
            oscillator.frequency.exponentialRampToValueAtTime(1250, audioCtx.currentTime + 0.12);
            gainNode.gain.setValueAtTime(0.06, audioCtx.currentTime);
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.12);
        } catch (e) {}
    }

    function showStanza(stanzaNumber) {
        const allButtons = document.querySelectorAll('.tab-btn');
        allButtons.forEach(btn => btn.classList.remove('active-tab'));

        document.getElementById(`btn_${stanzaNumber}`).classList.add('active-tab');

        const currentData = stanzaDatabase[stanzaNumber];
        
        poemTextTarget.innerHTML = currentData.poem;
        summaryTextTarget.innerHTML = currentData.summary;

        playFruitSound();
    }

    // ಮೊದಲ ಪುಟ ಆಟೋಮ್ಯಾಟಿಕ್ ಆಗಿ ಲೋಡ್ ಆಗುತ್ತದೆ
    showStanza(1);
</script>
