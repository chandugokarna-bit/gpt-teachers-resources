<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ಕನ್ನಡ ಕಾಗುಣಿತ ಕಲಿಕೆ - ಕ್ಲಿಕ್ ಆಡಿಯೋ ಆವೃತ್ತಿ</title>
    <style>
        :root {
            --primary: #ff7675;
            --secondary: #74b9ff;
            --accent: #00b894;
            --bg: #dfe6e9;
            --dark: #2d3436;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--dark);
        }

        header {
            text-align: center;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            color: white;
            padding: 20px 40px;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        header h1 {
            margin: 0;
            font-size: 2.5rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        header p {
            margin: 5px 0 0 0;
            font-size: 1.2rem;
            opacity: 0.9;
        }

        .game-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 1000px;
            width: 100%;
        }

        .section-title {
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 10px;
            color: #4a4a4a;
            border-left: 5px solid #6c5ce7;
            padding-left: 10px;
        }

        .grid-box {
            background: white;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.05);
        }

        .consonants-grid, .swaras-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
            gap: 12px;
        }

        .btn {
            font-size: 1.8rem;
            font-weight: bold;
            padding: 12px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
            user-select: none;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .consonant-btn {
            background-color: #ffeaa7;
            color: #d35400;
        }

        .consonant-btn.selected {
            background-color: #fdcb6e;
            transform: translateY(-5px);
            box-shadow: 0 8px 12px rgba(0,0,0,0.15);
            border: 2px solid #d35400;
        }

        .swara-btn {
            background-color: #fab1a0;
            color: #c0392b;
        }

        .swara-btn.selected {
            background-color: #ff7675;
            transform: translateY(-5px);
            box-shadow: 0 8px 12px rgba(0,0,0,0.15);
            border: 2px solid #c0392b;
        }

        /* Arena Style */
        .arena {
            background: linear-gradient(135deg, #11998e, #38ef7d);
            border-radius: 25px;
            padding: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            color: white;
            box-shadow: 0 15px 30px rgba(0,0,0,0.15);
            min-height: 180px;
        }

        .math-element {
            font-size: 3.5rem;
            font-weight: bold;
            background: rgba(255, 255, 255, 0.2);
            padding: 15px 30px;
            border-radius: 15px;
            min-width: 80px;
            text-align: center;
            backdrop-filter: blur(5px);
        }

        .math-sign {
            font-size: 3rem;
            font-weight: bold;
        }

        /* Result container with sound icon */
        .result-wrapper {
            display: flex;
            align-items: center;
            gap: 15px;
            background: white;
            padding: 10px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            cursor: pointer;
            transition: transform 0.2s;
        }

        .result-wrapper:hover {
            transform: scale(1.03);
        }

        .result-element {
            font-size: 5rem;
            color: #2c3e50;
            font-weight: bold;
        }

        .speaker-icon {
            font-size: 2.5rem;
            background: #6c5ce7;
            color: white;
            padding: 10px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 50px;
            height: 50px;
            box-shadow: 0 4px 10px rgba(108, 92, 231, 0.4);
        }

        .result-wrapper.animate {
            animation: celebrate 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes celebrate {
            0% { transform: scale(0.5) rotate(-5deg); opacity: 0; }
            70% { transform: scale(1.05) rotate(3deg); }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        .instructions {
            text-align: center;
            font-size: 1.2rem;
            color: #666;
            font-style: italic;
        }
    </style>
</head>
<body>

    <header>
        <h1>ಕನ್ನಡ ಕಾಗುಣಿತ ಮಾಂತ್ರಿಕ ಲೋಕ ✨ 🔊</h1>
        <p>ಅಕ್ಷರಗಳನ್ನು ಜೋಡಿಸಿ, ಸ್ಪೀಕರ್ ಕ್ಲಿಕ್ ಮಾಡಿ ಉಚ್ಚಾರಣೆ ಕೇಳಿ!</p>
    </header>

    <div class="game-container">
        
        <div class="arena">
            <div class="math-element" id="display-vyanjana">?</div>
            <div class="math-sign">+</div>
            <div class="math-element" id="display-swara">?</div>
            <div class="math-sign">=</div>
            
            <div class="result-wrapper" id="result-box" onclick="speakCurrentResult()">
                <div class="result-element" id="display-result">?</div>
                <div class="speaker-icon" id="speaker-btn">🔊</div>
            </div>
        </div>

        <div class="instructions" id="instruction-text">
            ಮೊದಲು ಕೆಳಗಿನ ಕೋಷ್ಟಕದಿಂದ ಒಂದು ವ್ಯಂಜನ ಅಕ್ಷರವನ್ನು ಆಯ್ಕೆ ಮಾಡಿ.
        </div>

        <div class="grid-box">
            <div class="section-title">೨. ಸ್ವರಾಕ್ಷರಗಳು (Swaras)</div>
            <div class="swaras-grid" id="swaras-container"></div>
        </div>

        <div class="grid-box">
            <div class="section-title">೧. ವ್ಯಂಜನಾಕ್ಷರಗಳು (Consonants)</div>
            <div class="consonants-grid" id="consonants-container"></div>
        </div>

    </div>

    <script>
        const consonants = ['ಕ', 'ಖ', 'ಗ', 'ಘ', 'ಙ', 'ಚ', 'ಛ', 'ಜ', 'ಝ', 'ಞ', 'ಟ', 'ಠ', 'ಡ', 'ಢ', 'ಣ', 'ತ', 'ಥ', 'ದ', 'ಧ', 'ನ', 'ಪ', 'ಫ', 'ಬ', 'ಭ', 'ಮ', 'ಯ', 'ರ', 'ಲ', 'ವ', 'ಶ', 'ಷ', 'ಸ', 'ಹ', 'ಳ'];
        
        const swaras = [
            { name: 'ಅ', gunitha: '' },      { name: 'ಆ', gunitha: 'ಾ' },
            { name: 'ಇ', gunitha: 'ಿ' },      { name: 'ಈ', gunitha: 'ೀ' },
            { name: 'ಉ', gunitha: 'ು' },      { name: 'ಊ', gunitha: 'ೂ' },
            { name: 'ಋ', gunitha: 'ೃ' },     { name: 'ಎ', gunitha: 'ೆ' },
            { name: 'ಏ', gunitha: 'ೇ' },      { name: 'ಐ', gunitha: 'ೈ' },
            { name: 'ಒ', gunitha: 'ೊ' },      { name: 'ಓ', gunitha: 'ೋ' },
            { name: 'ಔ', gunitha: 'ೌ' },      { name: 'ಅಂ', gunitha: 'ಂ' },
            { name: 'ಅಃ', gunitha: 'ಃ' }
        ];

        let selectedConsonant = '';
        let selectedSwara = null;
        let currentOutputText = '';

        const consonantsContainer = document.getElementById('consonants-container');
        const swarasContainer = document.getElementById('swaras-container');
        const displayVyanjana = document.getElementById('display-vyanjana');
        const displaySwara = document.getElementById('display-swara');
        const displayResult = document.getElementById('display-result');
        const resultBox = document.getElementById('result-box');
        const instructionText = document.getElementById('instruction-text');

        // Initialize Grid
        consonants.forEach(con => {
            const btn = document.createElement('button');
            btn.classList.add('btn', 'consonant-btn');
            btn.innerText = con;
            btn.onclick = () => selectConsonant(con, btn);
            consonantsContainer.appendChild(btn);
        });

        swaras.forEach(swara => {
            const btn = document.createElement('button');
            btn.classList.add('btn', 'swara-btn');
            btn.innerText = swara.name;
            btn.onclick = () => selectSwara(swara, btn);
            swarasContainer.appendChild(btn);
        });

        // TTS Speech function
        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // Stop any previous sound
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'kn-IN'; // Kannada voice font
                utterance.rate = 0.75;    // Pleasant and clear speed for young learners
                window.speechSynthesis.speak(utterance);
            }
        }

        function selectConsonant(con, element) {
            document.querySelectorAll('.consonant-btn').forEach(b => b.classList.remove('selected'));
            element.classList.add('selected');
            
            selectedConsonant = con;
            displayVyanjana.innerText = con;
            
            instructionText.innerText = "ಈಗ ಒಂದು ಸ್ವರಾಕ್ಷರವನ್ನು ಆಯ್ಕೆ ಮಾಡಿ ಗುಣಿತಾಕ್ಷರವನ್ನು ನೋಡಿ!";
            calculateResult();
        }

        function selectSwara(swara, element) {
            if(!selectedConsonant) {
                alert("ದಯವಿಟ್ಟು ಮೊದಲು ಒಂದು ವ್ಯಂಜನಾಕ್ಷರವನ್ನು ಆಯ್ಕೆ ಮಾಡಿ!");
                return;
            }
            
            document.querySelectorAll('.swara-btn').forEach(b => b.classList.remove('selected'));
            element.classList.add('selected');
            
            selectedSwara = swara;
            displaySwara.innerText = swara.name;
            
            calculateResult();
        }

        function calculateResult() {
            if (selectedConsonant && selectedSwara) {
                let result = '';
                
                if(selectedSwara.name === 'ಅ') {
                    result = selectedConsonant;
                } else {
                    result = selectedConsonant + selectedSwara.gunitha;
                }

                currentOutputText = result;
                displayResult.innerText = result;
                
                // Animation trigger for result box
                resultBox.classList.remove('animate');
                void resultBox.offsetWidth; 
                resultBox.classList.add('animate');
                
                // Text update for clarity
                instructionText.innerText = `${selectedConsonant} + ${selectedSwara.name} = ${result}. ಉಚ್ಚಾರಣೆ ಕೇಳಲು ಆಕ್ಷರದ ಮೇಲಿರುವ ಸ್ಪೀಕರ್ 🔊 ಕ್ಲಿಕ್ ಮಾಡಿ!`;
                
                // NOTE: We are NOT calling speakText() here anymore. 
                // Audio will only play when clicked.
            }
        }

        // Triggered only on manual click
        function speakCurrentResult() {
            if(currentOutputText) {
                speakText(currentOutputText);
            }
        }
    </script>
</body>
</html>
