<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>೬ನೇ ತರಗತಿ - ಸಮಾಜ ವಿಜ್ಞಾನ ಇಂಟರಾಕ್ಟಿವ್ ಕ್ವಿಜ್</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f4f8;
            margin: 0;
            padding: 20px;
            text-align: center;
            user-select: none;
        }
        .quiz-container {
            max-width: 700px;
            background: white;
            margin: 30px auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
            border-top: 8px solid #3498db;
        }
        h1 { color: #2c3e50; font-size: 24px; margin-bottom: 5px; }
        .progress-bar {
            font-size: 16px;
            color: #7f8c8d;
            margin-bottom: 20px;
            font-weight: bold;
        }
        
        /* ಚಿತ್ರದ ವಿನ್ಯಾಸ */
        .quiz-image {
            width: 100%;
            max-width: 350px;
            height: 180px;
            background-color: #eef2f3;
            margin: 0 auto 20px auto;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            border: 2px solid #dcdde1;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.05);
        }

        .question-text {
            font-size: 20px;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 25px;
            line-height: 1.5;
            text-align: left;
        }
        .options-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }
        .option-btn {
            background-color: #ffffff;
            border: 2px solid #dcdde1;
            padding: 15px 20px;
            font-size: 17px;
            font-weight: 600;
            text-align: left;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            color: #34495e;
        }
        .option-btn:hover {
            background-color: #f1f2f6;
            border-color: #3498db;
            transform: translateX(5px);
        }
        
        /* ಸರಿ ತಪ್ಪು ಬಣ್ಣಗಳು */
        .correct {
            background-color: #2ecc71 !important;
            border-color: #27ae60 !important;
            color: white !important;
        }
        .wrong {
            background-color: #e74c3c !important;
            border-color: #c0392b !important;
            color: white !important;
        }
        
        /* ಮುಂದಿನ ಪ್ರಶ್ನೆ ಬಟನ್ */
        #next-btn {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px 35px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            margin-top: 25px;
            display: none;
            box-shadow: 0 4px 10px rgba(52, 152, 219, 0.3);
        }
        #next-btn:hover { background-color: #2980b9; }

        /* ರಿಸಲ್ಟ್ ಬೋರ್ಡ್ */
        .result-screen {
            display: none;
        }
        .score-text {
            font-size: 24px;
            font-weight: bold;
            color: #2c3e50;
            margin: 20px 0;
        }
        .restart-btn {
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="quiz-container">
        <div id="quiz-screen">
            <h1>೧ನೇ ಪಾಠ: ಇತಿಹಾಸದ ಪರಿಚಯ ಕ್ವಿಜ್</h1>
            <div class="progress-bar" id="progress">ಪ್ರಶ್ನೆ: 1 / 20</div>
            
            <div class="quiz-image" id="quiz-img">📜</div>

            <div class="question-text" id="question">ಪ್ರಶ್ನೆ ಲೋಡ್ ಆಗುತ್ತಿದೆ...</div>
            <div class="options-container" id="options">
                </div>
            <button id="next-btn" onclick="nextQuestion()">ಮುಂದಿನ ಪ್ರಶ್ನೆ ➡️</button>
        </div>

        <div id="result-screen" class="result-screen">
            <h2>🎉 ಕ್ವಿಜ್ ಮುಕ್ತಾಯವಾಯಿತು!</h2>
            <div class="quiz-image">🏆</div>
            <div class="score-text" id="final-score">ನಿಮ್ಮ ಸ್ಕೋರ್: 0 / 20</div>
            <p id="feedback-text" style="font-size: 18px; font-weight: bold; color: #34495e;"></p>
            <button class="restart-btn" onclick="restartQuiz()">🔄 ಮತ್ತೊಮ್ಮೆ ಆಡಿ</button>
        </div>
    </div>

    <script>
        // ೨೦ ಪ್ರಶ್ನೆಗಳ ಡೇಟಾಬೇಸ್ (ಪ್ರಶ್ನೆ, ಚಿತ್ರದ ಎಮೋಜಿ, ಆಯ್ಕೆಗಳು ಮತ್ತು ಸರಿಯಾದ ಉತ್ತರ)
        const quizData = [
            { q: "೧. ಇತಿಹಾಸದ ಪิตಾಮಹ ಎಂದು ಯಾರನ್ನು ಕರೆಯುತ್ತಾರೆ?", img: "🏛️", options: ["ಅಶೋಕ", "ಹೆರೊಡೋಟಸ್", "ಅರಿಸ್ಟಾಟಲ್", "ಪ್ಲೇಟೋ"], answer: 1 },
            { q: "೨. ಹೆರೊಡೋಟಸ್ ಯಾವ ದೇಶದ ಇತಿಹಾಸಕಾರರಾಗಿದ್ದರು?", img: "🇬🇷", options: ["ರೋಮ್", "ಭಾರತ", "ಗ್ರೀಸ್", "ಈಜಿಪ್ಟ್"], answer: 2 },
            { q: "೩. ಇತಿಹಾಸ ಎಂದರೇನು?", img: "⏳", options: ["ಕಾಲ್ಪನಿಕ ಕಥೆ", "ಗತಿಸಿಹೋದ ಘಟನೆಗಳ ನಿಖರ ವಿವರಣೆ", "ಭವಿಷ್ಯದ ಊಹೆ", "ರಾಜರ ಕವನಗಳು"], answer: 1 },
            { q: "೪. ಇತಿಹಾಸ ರಚನೆಗೆ ಅತ್ಯಂತ ಮುಖ್ಯವಾಗಿ ಬೇಕಾಗಿರುವುದು ಯಾವುದು?", img: "🔍", options: ["ಕಥೆಗಳು", "ಊಹೆಗಳು", "ಆಧಾರಗಳು", "ನಾಟಕಗಳು"], answer: 2 },
            { q: "೫. ಇತಿಹಾಸದ ಆಧಾರಗಳಲ್ಲಿ ಪ್ರಮುಖವಾಗಿ ಎಷ್ಟು ವಿಧಗಳಿವೆ?", img: "📚", options: ["ಎರಡು ವಿಧ", "ನಾಲ್ಕು ವಿಧ", "ಮೂರು ವಿಧ", "ಐದು ವಿಧ"], answer: 0 },
            { q: "೬. ನಾಣ್ಯಗಳು, ಶಾಸನಗಳು ಮತ್ತು ಸ್ಮಾರಕಗಳು ಯಾವ ಆಧಾರಕ್ಕೆ ಸೇರುತ್ತವೆ?", img: "🏺", options: ["ಸಾಹಿತ್ಯ ಆಧಾರ", "ಮೌಖಿಕ ಆಧಾರ", "ಪುರಾತತ್ವ ಆಧಾರ", "ವಿದೇಶಿ ಸಾಹಿತ್ಯ"], answer: 2 },
            { q: "೭. ಹಳೆಯ ಕಾಲದ ತಾಳೆಗರಿಗಳು ಮತ್ತು ಹಸ್ತಪ್ರತಿಗಳು ಯಾವ ಆಧಾರಗಳಾಗಿವೆ?", img: "📜", options: ["ಲಿಖಿತ ಸಾಹಿತ್ಯ ಆಧಾರ", "ಮೌಖಿಕ ಸಾಹಿತ್ಯ", "ಪುರಾತತ್ವ ಆಧಾರ", "ಭೌತಿಕ ಆಧಾರ"], answer: 0 },
            { q: "೮. ಜನಪದ ಕಥೆಗಳು, ಲಾವಣಿಗಳು ಮತ್ತು ಗಾದೆಗಳು ಯಾವ ಆಧಾರಕ್ಕೆ ಉದಾಹರಣೆ?", img: "🗣️", options: ["ಲಿಖಿತ ಸಾಹಿತ್ಯ", "ಮೌಖಿಕ ಸಾಹಿತ್ಯ", "ಪುರಾತತ್ವ ಆಧಾರ", "ಶಾಸನಗಳು"], answer: 1 },
            { q: "೯. ವಿದೇಶಿ ಪ್ರವಾಸಿಗರು ಬರೆದ ಬರವಣಿಗೆಗಳನ್ನು ಏನೆಂದು ಕರೆಯುತ್ತಾರೆ?", img: "🚢", options: ["ದೇಶಿ ಸಾಹಿತ್ಯ", "ಮೌಖಿಕ ಸಾಹಿತ್ಯ", "ವಿದೇಶಿ ಸಾಹಿತ್ಯ", "ಪುರಾತತ್ವ ಸಾಹಿತ್ಯ"], answer: 2 },
            { q: "೧೦. ಇತಿಹಾಸದಲ್ಲಿ 'ಸಾ.ಶ.ಪೂ.' ಎಂದರೆ ಏನು?", img: "📅", options: ["ಸಾಮಾನ್ಯ ಶಕದ ನಂತರ", "ಸಾಮಾನ್ಯ ಶಕ ಪೂರ್ವ", "ಸಾಮಾನ್ಯ ವರ್ಷ", "ಸತ್ಯ ಶಕ ಪೂರ್ವ"], answer: 1 },
            { q: "೧೧. ಕಾಲಗಣನೆಯಲ್ಲಿ ಕೇಂದ್ರ ಬಿಂದುವಾಗಿ ಯಾರ ಜನನವನ್ನು ಪರಿಗಣಿಸಲಾಗುತ್ತದೆ?", img: "✝️", options: ["ಬುದ್ಧ", "ಮಹಾವೀರ", "ಯೇಸು ಕ್ರಿಸ್ತ", "ಅಶೋಕ"], answer: 2 },
            { q: "೧೨. ಮಾನವನ ವಿಕಾಸದ ಇತಿಹಾಸದಲ್ಲಿ ಆಯುಧಗಳ ಆಧಾರದ ಮೇಲೆ ಮೊದಲ ಯುಗವನ್ನು ಏನೆಂದು ಕರೆಯುತ್ತಾರೆ?", img: "🪨", options: ["ಲೋಹಯುಗ", "ಶಿಲಾಯುಗ", "ಕಬ್ಬಿಣದ ಯುಗ", "ಚಿನ್ನದ ಯುಗ"], answer: 1 },
            { q: "೧೩. ಶಿಲಾಯುಗದಲ್ಲಿ ಮಾನವರು ಆಯುಧಗಳನ್ನು ಯಾವುದರಿಂದ ಮಾಡುತ್ತಿದ್ದರು?", img: "⛏️", options: ["ಕಬ್ಬಿಣ", "ತಾಮ್ರ", "ಕಲ್ಲು", "ಬೆಳ್ಳಿ"], answer: 2 },
            { q: "೧೪. ಮಾನವರು ಒರಟಾದ ದೊಡ್ಡ ಕಲ್ಲಿನ ಆಯುಧಗಳನ್ನು ಬಳಸುತ್ತಿದ್ದ ಕಾಲ ಯಾವುದು?", img: "🦖", options: ["ಹಳೆಯ ಶಿಲಾಯುಗ", "ಮಧ್ಯ ಶಿಲಾಯುಗ", "ನವಶಿಲಾಯುಗ", "ತಾಮ್ರಯುಗ"], answer: 0 },
            { q: "೧೫. ಮಧ್ಯಪ್ರದೇಶದ ಯಾವ ಗುಹೆಗಳಲ್ಲಿ ಶಿಲಾಯುಗದ ಮಾನವರ ವರ್ಣಚಿತ್ರಗಳು ಸಿಕ್ಕಿವೆ?", img: "🧗", options: ["ಅಜಂತಾ", "ಬಾದಾಮಿ", "ಬಿಂಬೆಟ್ಕಾ", "ಎಲ್ಲೋರಾ"], answer: 2 },
            { q: "೧೬. ಕರ್ನಾಟಕದ ಯಾವ ಸ್ಥಳದಲ್ಲಿ ಹಳೆಯ ಶಿಲಾಯುಗದ ಬೂದಿಯ ಕುರುಹುಗಳು ದೊರೆತಿವೆ?", img: "🔥", options: ["ಬ್ರಹ್ಮಗಿರಿ", "ಹುಣಸಗಿ", "ಹರಪ್ಪ", "ಹಂಪಿ"], answer: 1 },
            { q: "೧೭. ಮಾನವರು ಆಯುಧಗಳನ್ನು ಸಣ್ಣದಾಗಿ ಮತ್ತು ಚೂಪಾಗಿ (ಸೂಕ್ಷ್ಮ ಆಯುಧ) ಮಾಡಿದ ಕಾಲ ಯಾವುದು?", img: "🏹", options: ["ಹಳೆಯ ಶಿಲಾಯುಗ", "ಮಧ್ಯ ಶಿಲಾಯುಗ", "ನವಶಿಲಾಯುಗ", "ಲೋಹಯುಗ"], answer: 1 },
            { q: "೧೮. ಮಾನವನು ಕೃಷಿ ಮತ್ತು ಪಶುಪಾಲನೆಯನ್ನು ಆರಂಭಿಸಿದ ಪ್ರಮುಖ ಶಿಲಾಯುಗ ಯಾವುದು?", img: "🌾", options: ["ಹಳೆಯ ಶಿಲಾಯುಗ", "ಮಧ್ಯ ಶಿಲಾಯುಗ", "ನವಶಿಲಾಯುಗ", "ಕಬ್ಬಿಣದ ಯುಗ"], answer: 2 },
            { q: "೧೯. ಕರ್ನಾಟಕದ ಚಿತ್ರದುರ್ಗ ಜಿಲ್ಲೆಯ ನವಶಿಲಾಯುಗದ ಪ್ರಸಿದ್ಧ ನೆಲೆ ಯಾವುದು?", img: "⛰️", options: ["ಹುಣಸಗಿ", "ಬ್ರಹ್ಮಗಿರಿ", "ಬಿಂಬೆಟ್ಕಾ", "ಪಟ್ಟದಕಲ್ಲು"], answer: 1 },
            { q: "೨೦. ಇತಿಹಾಸದಲ್ಲಿ ಸಾ.ಶ. (CE) ಎಂದರೆ ಏನು?", img: "📆", options: ["ಸಾಮಾನ್ಯ ಶಕ", "ಸಾಮಾನ್ಯ ಪೂರ್ವ", "ಸತ್ಯ ಶಕ", "ಸಾವಿರ ವರ್ಷ"], answer: 0 }
        ];

        let currentQuestionIndex = 0;
        let score = 0;
        let answered = false;

        function loadQuestion() {
            answered = false;
            document.getElementById("next-btn").style.display = "none";
            
            const currentQuestion = quizData[currentQuestionIndex];
            
            // ಪ್ರೋಗ್ರೆಸ್ ಮತ್ತು ಪ್ರಶ್ನೆ ಅಪ್ಡೇಟ್
            document.getElementById("progress").innerText = `ಪ್ರಶ್ನೆ: ${currentQuestionIndex + 1} / 20`;
            document.getElementById("question").innerText = currentQuestion.q;
            document.getElementById("quiz-img").innerText = currentQuestion.img; // ಇಲ್ಲಿ ಎಮೋಜಿ ಬದಲಿಗೆ ಇಮೇಜ್ ಟ್ಯಾಗ್ ಬೇಕಾದರೂ ಹಾಕಬಹುದು

            // ಆಯ್ಕೆಗಳ ಬಟನ್ ರಚನೆ
            const optionsContainer = document.getElementById("options");
            optionsContainer.innerHTML = "";

            currentQuestion.options.forEach((option, index) => {
                const button = document.createElement("button");
                button.innerText = option;
                button.classList.add("option-btn");
                button.onclick = () => selectOption(index, button);
                optionsContainer.appendChild(button);
            });
        }

        function selectOption(selectedIndex, btn) {
            if (answered) return; // ಒಂದು ಬಾರಿ ಕ್ಲಿಕ್ ಮಾಡಿದರೆ ಮತ್ತೊಮ್ಮೆ ಕ್ಲಿಕ್ ತಡೆಯಲು
            answered = true;

            const currentQuestion = quizData[currentQuestionIndex];
            const allButtons = document.querySelectorAll(".option-btn");

            if (selectedIndex === currentQuestion.answer) {
                btn.classList.add("correct");
                score++;
                playBeep(800, 0.15); // ಸರಿ ಉತ್ತರಕ್ಕೆ ಸೌಂಡ್
            } else {
                btn.classList.add("wrong");
                allButtons[currentQuestion.answer].classList.add("correct"); // ಸರಿಯಾದ ಉತ್ತರವನ್ನು ಹಸಿರು ಬಣ್ಣದಲ್ಲಿ ತೋರಿಸು
                playBeep(300, 0.3); // ತಪ್ಪು ಉತ್ತರಕ್ಕೆ ಸೌಂಡ್
            }

            document.getElementById("next-btn").style.display = "inline-block";
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < quizData.length) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            document.getElementById("quiz-screen").style.display = "none";
            const resultScreen = document.getElementById("result-screen");
            resultScreen.style.display = "block";

            document.getElementById("final-score").innerText = `ನಿಮ್ಮ ಒಟ್ಟು ಸ್ಕೋರ್: ${score} / 20`;
            
            const feedback = document.getElementById("feedback-text");
            if (score === 20) {
                feedback.innerText = "🏆 ಅದ್ಭುತ ಸಾಧನೆ! ನೀವು ಇತಿಹಾಸದ ಪರಿಣಿತರು.";
            } else if (score >= 12) {
                feedback.innerText = "👍 ಉತ್ತಮ ಪ್ರಯತ್ನ! ಇನ್ನಷ್ಟು ಗಮನವಿಟ್ಟು ಓದಿ.";
            } else {
                feedback.innerText = "🤔 ಮತ್ತೊಮ್ಮೆ ಪಾಠವನ್ನು ಓದಿ ಪ್ರಯತ್ನಿಸಿ!";
            }
        }

        function restartQuiz() {
            currentQuestionIndex = 0;
            score = 0;
            document.getElementById("quiz-screen").style.display = "block";
            document.getElementById("result-screen").style.display = "none";
            loadQuestion();
        }

        // ಆಡಿಯೋ ಎಫೆಕ್ಟ್ ಜನರೇಟರ್
        function playBeep(freq, duration) {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.frequency.value = freq;
            oscillator.start();
            gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            oscillator.stop(audioCtx.currentTime + duration);
        }

        // ಕ್ವಿಜ್ ಆರಂಭಿಸುವುದು
        loadQuestion();
    </script>
</body>
</html>
