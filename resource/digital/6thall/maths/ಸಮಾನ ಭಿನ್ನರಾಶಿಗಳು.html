<!DOCTYPE html>
<html lang="kn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ಸಮಾನ ಭಿನ್ನರಾಶಿಗಳ ಚಟುವಟಿಕೆ</title>
<style>
  body {
    font-family: 'Tunga', 'Kedage', sans-serif;
    background-color: #e0f7fa;
    color: #333;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
  }
  .app-container {
    background: white;
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.15);
    text-align: center;
    max-width: 600px;
    width: 95%;
  }
  h1 {
    color: #00796b;
    margin-bottom: 5px;
  }
  p.subtitle {
    color: #555;
    margin-top: 0;
    margin-bottom: 25px;
    font-size: 18px;
  }
  .fraction-section {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #f1f8e9;
    padding: 15px;
    border-radius: 15px;
    margin-bottom: 15px;
    border: 2px solid #c5e1a5;
  }
  .fraction-display {
    font-size: 32px;
    font-weight: bold;
    color: #2e7d32;
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 60px;
  }
  .fraction-line {
    border-top: 4px solid #2e7d32;
    width: 100%;
    margin: 2px 0;
  }
  .bar-container {
    flex-grow: 1;
    height: 60px;
    background: #fff;
    border: 2px solid #7cb342;
    border-radius: 8px;
    margin: 0 20px;
    display: flex;
    overflow: hidden;
  }
  .bar-segment {
    flex-grow: 1;
    border-right: 2px solid #7cb342;
    transition: background-color 0.3s;
  }
  .bar-segment:last-child {
    border-right: none;
  }
  .controls {
    display: flex;
    flex-direction: column;
    gap: 10px;
    width: 150px;
  }
  label {
    font-size: 14px;
    font-weight: bold;
    color: #558b2f;
    display: flex;
    justify-content: space-between;
  }
  input[type=range] {
    width: 100%;
    cursor: pointer;
  }
  .result-box {
    margin-top: 25px;
    padding: 15px;
    border-radius: 12px;
    font-size: 24px;
    font-weight: bold;
    transition: all 0.3s;
  }
  .equivalent {
    background-color: #c8e6c9;
    color: #2e7d32;
    border: 2px solid #a5d6a7;
  }
  .not-equivalent {
    background-color: #ffcdd2;
    color: #c62828;
    border: 2px solid #ef9a9a;
  }
</style>
</head>
<body>

<div class="app-container">
  <h1>ಸಮಾನ ಭಿನ್ನರಾಶಿಗಳು</h1>
  <p class="subtitle">ಎರಡು ಭಿನ್ನರಾಶಿಗಳನ್ನು ಹೋಲಿಸಿ ಮತ್ತು ಅವು ಸಮಾನವೇ ಎಂದು ಪರಿಶೀಲಿಸಿ!</p>

  <div class="fraction-section">
    <div class="fraction-display">
      <div id="numText1">1</div>
      <div class="fraction-line"></div>
      <div id="denText1">2</div>
    </div>
    
    <div class="bar-container" id="bar1"></div>
    
    <div class="controls">
      <label>ಅಂಶ: <span id="numLabel1">1</span></label>
      <input type="range" id="numSlider1" min="0" max="2" value="1">
      <label>ಛೇದ: <span id="denLabel1">2</span></label>
      <input type="range" id="denSlider1" min="1" max="10" value="2">
    </div>
  </div>

  <div class="fraction-section">
    <div class="fraction-display">
      <div id="numText2">2</div>
      <div class="fraction-line"></div>
      <div id="denText2">4</div>
    </div>
    
    <div class="bar-container" id="bar2"></div>
    
    <div class="controls">
      <label>ಅಂಶ: <span id="numLabel2">2</span></label>
      <input type="range" id="numSlider2" min="0" max="4" value="2">
      <label>ಛೇದ: <span id="denLabel2">4</span></label>
      <input type="range" id="denSlider2" min="1" max="10" value="4">
    </div>
  </div>

  <div id="resultBox" class="result-box">
    ಪರಿಶೀಲಿಸಲಾಗುತ್ತಿದೆ...
  </div>
</div>

<script>
  function setupFraction(numId, denId, barId) {
    const numSlider = document.getElementById(`numSlider${numId}`);
    const denSlider = document.getElementById(`denSlider${denId}`);
    const numText = document.getElementById(`numText${numId}`);
    const denText = document.getElementById(`denText${denId}`);
    const numLabel = document.getElementById(`numLabel${numId}`);
    const denLabel = document.getElementById(`denLabel${denId}`);
    const bar = document.getElementById(`bar${barId}`);

    function update() {
      let den = parseInt(denSlider.value);
      let num = parseInt(numSlider.value);

      if (num > den) {
        num = den;
        numSlider.value = num;
      }
      numSlider.max = den;

      numText.innerText = num;
      denText.innerText = den;
      numLabel.innerText = num;
      denLabel.innerText = den;

      bar.innerHTML = '';
      for (let i = 0; i < den; i++) {
        let segment = document.createElement('div');
        segment.className = 'bar-segment';
        // ಬಣ್ಣವನ್ನು ಬದಲಾಯಿಸಿ (color)
        if (i < num) {
          segment.style.backgroundColor = numId === 1 ? '#ffb74d' : '#4dd0e1'; 
        }
        bar.appendChild(segment);
      }
      checkEquivalence();
    }

    numSlider.addEventListener('input', update);
    denSlider.addEventListener('input', update);
    update();
  }

  function checkEquivalence() {
    let n1 = parseInt(document.getElementById('numSlider1').value);
    let d1 = parseInt(document.getElementById('denSlider1').value);
    let n2 = parseInt(document.getElementById('numSlider2').value);
    let d2 = parseInt(document.getElementById('denSlider2').value);
    
    const resultBox = document.getElementById('resultBox');
    
    // Cross multiplication to check equivalence
    if (n1 * d2 === n2 * d1) {
      resultBox.innerText = "ಹೌದು, ಇವು ಸಮಾನ ಭಿನ್ನರಾಶಿಗಳು! 🎉";
      resultBox.className = "result-box equivalent";
    } else {
      resultBox.innerText = "ಇಲ್ಲ, ಇವು ಸಮಾನವಾಗಿಲ್ಲ.";
      resultBox.className = "result-box not-equivalent";
    }
  }

  setupFraction(1, 1, 1);
  setupFraction(2, 2, 2);
</script>

</body>
</html>
