<!DOCTYPE html>
<html lang="kn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ಭಿನ್ನರಾಶಿಗಳ ವ್ಯವಕಲನ (ಕಳೆಯುವುದು)</title>
<style>
  body {
    font-family: 'Tunga', 'Kedage', sans-serif;
    background-color: #fff3e0;
    color: #333;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
    box-sizing: border-box;
  }
  .app-container {
    background: white;
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    max-width: 800px;
    width: 100%;
    text-align: center;
  }
  h1 {
    color: #e65100;
    margin-top: 0;
  }
  .subtraction-area {
    display: flex;
    justify-content: space-between;
    align-items: stretch;
    flex-wrap: wrap;
    gap: 20px;
    margin-bottom: 30px;
  }
  .fraction-panel {
    flex: 1;
    min-width: 200px;
    background: #fafafa;
    padding: 20px;
    border-radius: 15px;
    border: 2px solid #eee;
  }
  .fraction-display {
    font-size: 32px;
    font-weight: bold;
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 15px;
  }
  .fraction-line {
    border-top: 4px solid currentColor;
    width: 60px;
    margin: 4px 0;
  }
  .math-symbol {
    font-size: 48px;
    font-weight: bold;
    color: #9e9e9e;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .slider-group {
    margin: 10px 0;
    text-align: left;
  }
  label {
    font-size: 16px;
    font-weight: bold;
    display: flex;
    justify-content: space-between;
  }
  input[type=range] {
    width: 100%;
    cursor: pointer;
  }
  .color-a { color: #2e7d32; accent-color: #2e7d32; } /* ಹಸಿರು */
  .color-b { color: #d84315; accent-color: #d84315; } /* ಕೆಂಪು */
  .color-result { color: #1565c0; } /* ನೀಲಿ */
  
  /* Bar Visuals */
  .bar-container {
    display: flex;
    flex-direction: column;
    gap: 5px;
    align-items: center;
    margin-top: 15px;
  }
  .whole-bar {
    display: flex;
    width: 100%;
    height: 40px;
    background: #fff;
    border: 2px solid #ccc;
    border-radius: 6px;
    overflow: hidden;
  }
  .segment {
    flex: 1;
    border-right: 1px solid #ccc;
    position: relative;
    transition: all 0.3s;
  }
  .segment:last-child {
    border-right: none;
  }
  
  /* ಕ್ರಾಸ್ ಮಾರ್ಕ್ ಎಫೆಕ್ಟ್ */
  .segment.removed::after {
    content: '✕';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: #b71c1c;
    font-weight: bold;
    font-size: 20px;
  }
  
  .explanation-box {
    background: #ffe0b2;
    padding: 20px;
    border-radius: 15px;
    font-size: 18px;
    line-height: 1.6;
    border: 2px dashed #ffb74d;
  }
  .step-text {
    font-weight: bold;
    color: #e65100;
    font-size: 20px;
  }
</style>
</head>
<body>

<div class="app-container">
  <h1>ಭಿನ್ನರಾಶಿಗಳ ವ್ಯವಕಲನ (ಕಳೆಯುವುದು)</h1>
  
  <div class="subtraction-area">
    
    <div class="fraction-panel" style="border-color: #a5d6a7;">
      <div class="fraction-display color-a">
        <div id="numTextA">1</div>
        <div class="fraction-line"></div>
        <div id="denTextA">2</div>
      </div>
      <div class="slider-group">
        <label class="color-a">ಅಂಶ (Numerator): <span id="lblNumA">1</span></label>
        <input type="range" id="slNumA" class="color-a" min="0" max="6" value="1">
      </div>
      <div class="slider-group">
        <label class="color-a">ಛೇದ (Denominator): <span id="lblDenA">2</span></label>
        <input type="range" id="slDenA" class="color-a" min="1" max="6" value="2">
      </div>
      <div class="bar-container" id="barA"></div>
    </div>

    <div class="math-symbol">−</div>

    <div class="fraction-panel" style="border-color: #ffab91;">
      <div class="fraction-display color-b">
        <div id="numTextB">1</div>
        <div class="fraction-line"></div>
        <div id="denTextB">4</div>
      </div>
      <div class="slider-group">
        <label class="color-b">ಅಂಶ (Numerator): <span id="lblNumB">1</span></label>
        <input type="range" id="slNumB" class="color-b" min="0" max="6" value="1">
      </div>
      <div class="slider-group">
        <label class="color-b">ಛೇದ (Denominator): <span id="lblDenB">4</span></label>
        <input type="range" id="slDenB" class="color-b" min="1" max="6" value="4">
      </div>
      <div class="bar-container" id="barB"></div>
    </div>

    <div class="math-symbol">=</div>

    <div class="fraction-panel" style="border-color: #90caf9; background: #e3f2fd;">
      <div class="fraction-display color-result">
        <div id="numTextR">1</div>
        <div class="fraction-line"></div>
        <div id="denTextR">4</div>
      </div>
      <div style="font-weight:bold; color:#1565c0; margin-top:20px; font-size:18px;">ಉಳಿದ ಭಾಗ (Result)</div>
      <div class="bar-container" id="barR"></div>
    </div>
    
  </div>

  <div class="explanation-box" id="explanationBox">
    </div>

</div>

<script>
  function gcd(a, b) { return b === 0 ? a : gcd(b, a % b); }
  function lcm(a, b) { return (a * b) / gcd(a, b); }

  function drawBar(containerId, activeCount, den, mainColor, isResultMode = false, removeCount = 0) {
    const container = document.getElementById(containerId);
    container.innerHTML = '';
    
    let totalWholes = Math.max(1, Math.ceil(activeCount / den));
    
    for(let w = 0; w < totalWholes; w++) {
      let wholeDiv = document.createElement('div');
      wholeDiv.className = 'whole-bar';
      
      for(let i = 0; i < den; i++) {
        let segment = document.createElement('div');
        segment.className = 'segment';
        let globalIndex = w * den + i;
        
        if (globalIndex < activeCount) {
          if (isResultMode) {
            // ರಿಸಲ್ಟ್ ಬಾರ್‌ನಲ್ಲಿ ಕಳೆದು ಉಳಿದ ಭಾಗವನ್ನು ತೋರಿಸಿ
            if (globalIndex < activeCount - removeCount) {
              segment.style.backgroundColor = mainColor; // ಉಳಿದ ಭಾಗ (ನೀಲಿ)
            } else {
              segment.style.backgroundColor = '#ffcdd2'; // ತೆಗೆದ ಭಾಗ (ತಿಳಿ ಕೆಂಪು)
              segment.className += ' removed';
            }
          } else {
            segment.style.backgroundColor = mainColor;
          }
        }
        wholeDiv.appendChild(segment);
      }
      container.appendChild(wholeDiv);
    }
  }

  function update() {
    let nA = parseInt(document.getElementById('slNumA').value);
    let dA = parseInt(document.getElementById('slDenA').value);
    let nB = parseInt(document.getElementById('slNumB').value);
    let dB = parseInt(document.getElementById('slDenB').value);

    // ನೆಗೆಟಿವ್ ಉತ್ತರ ಬರದಂತೆ ತಡೆಯಲು ಹೊಂದಾಣಿಕೆ
    let commonDen = lcm(dA, dB);
    let eqNumA = nA * (commonDen / dA);
    let eqNumB = nB * (commonDen / dB);
    
    if (eqNumA < eqNumB) {
      // ಒಂದೊಮ್ಮೆ ಎರಡನೇ ಭಿನ್ನರಾಶಿ ದೊಡ್ಡದಿದ್ದರೆ, ಮೊದಲದ್ದನ್ನು ಅದಕ್ಕೆ ಸಮ ಮಾಡಿ
      nA = Math.ceil((eqNumB * dA) / commonDen);
      document.getElementById('slNumA').value = nA;
      eqNumA = nA * (commonDen / dA);
    }

    // UI ಟೆಕ್ಸ್ಟ್ ಅಪ್ಡೇಟ್
    document.getElementById('numTextA').innerText = nA; document.getElementById('lblNumA').innerText = nA;
    document.getElementById('denTextA').innerText = dA; document.getElementById('lblDenA').innerText = dA;
    document.getElementById('numTextB').innerText = nB; document.getElementById('lblNumB').innerText = nB;
    document.getElementById('denTextB').innerText = dB; document.getElementById('lblDenB').innerText = dB;

    // ವೈಯಕ್ತಿಕ ಬಾರ್‌ಗಳ ಚಿತ್ರಣ
    drawBar('barA', nA, dA, '#4caf50');
    drawBar('barB', nB, dB, '#ff5722');

    // ವ್ಯವಕಲನ ಲೆಕ್ಕಾಚಾರ
    let totalNum = eqNumA - eqNumB;

    // ರಿಸಲ್ಟ್ ಟೆಕ್ಸ್ಟ್ ಅಪ್ಡೇಟ್
    document.getElementById('numTextR').innerText = totalNum;
    document.getElementById('denTextR').innerText = commonDen;

    // ರಿಸಲ್ಟ್ ಬಾರ್ ಚಿತ್ರಣ (ಮೊದಲ ಭಿನ್ನರಾಶಿಯ ಭಾಗಗಳಿಂದ ಎರಡನೆಯದನ್ನು ಕ್ರಾಸ್ ಮಾಡಿ ತೋರಿಸುವುದು)
    drawBar('barR', eqNumA, commonDen, '#2196f3', true, eqNumB);

    // ವಿವರಣೆಯ ಟೆಕ್ಸ್ಟ್
    const expBox = document.getElementById('explanationBox');
    if (dA === dB) {
      expBox.innerHTML = `
        <div class="step-text">ಸುಲಭವಾಗಿದೆ! ಎರಡೂ ಭಿನ್ನರಾಶಿಗಳ ಛೇದಗಳು ಒಂದೇ ಆಗಿವೆ (${dA}).</div>
        <p>ಭಾಗಗಳ ಗಾತ್ರ ಸಮಾನವಾಗಿರುವುದರಿಂದ, ನಾವು ನೇರವಾಗಿ ಅಂಶಗಳನ್ನು ಕಳೆಯಬಹುದು.</p>
        <p style="font-size: 24px;"><b>${nA}</b> − <b>${nB}</b> = <b>${totalNum}</b> (ಒಟ್ಟು ${dA} ಭಾಗಗಳಲ್ಲಿ).</p>
      `;
    } else {
      expBox.innerHTML = `
        <div class="step-text">ಗಮನಿಸಿ! ಛೇದಗಳು ಬೇರೆ ಬೇರೆಯಾಗಿವೆ (${dA} ಮತ್ತು ${dB}).</div>
        <p>ಭಾಗಗಳ ಗಾತ್ರ ಬೇರೆ ಇರುವುದರಿಂದ ನೇರವಾಗಿ ಕಳೆಯಲು ಬರುವುದಿಲ್ಲ. ಮೊದಲು ನಾವು <b>ಸಮಾನ ಛೇದ</b> ಕಂಡುಹಿಡಿಯಬೇಕು! ${dA} ಮತ್ತು ${dB} ರ ಲ.ಸಾ.ಅ (LCM) <b>${commonDen}</b> ಆಗಿದೆ.</p>
        <p>ಭಿನ್ನರಾಶಿಗಳ ರೂಪಾಂತರ: <br>
        <span style="color:#2e7d32">${nA}/${dA}</span> ಎಂಬುದು <span style="color:#2e7d32">${eqNumA}/${commonDen}</span> ಆಗುತ್ತದೆ.<br>
        <span style="color:#d84315">${nB}/${dB}</span> ಎಂಬುದು <span style="color:#d84315">${eqNumB}/${commonDen}</span> ಆಗುತ್ತದೆ.</p>
        <p style="font-size: 24px;">ಈಗ ಕಳೆಯಿರಿ: <b>${eqNumA} − ${eqNumB} = ${totalNum} / ${commonDen}</b>.</p>
      `;
    }
  }

  // ಈವೆಂಟ್ ಲಿಸನರ್ಸ್
  document.getElementById('slNumA').addEventListener('input', update);
  document.getElementById('slDenA').addEventListener('input', update);
  document.getElementById('slNumB').addEventListener('input', update);
  document.getElementById('slDenB').addEventListener('input', update);

  // ಆರಂಭಿಕ ರನ್
  update();
</script>

</body>
</html>
