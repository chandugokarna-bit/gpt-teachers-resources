<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ಮ್ಯಾಜಿಕ್ ಆಕಾರಗಳು - ಆಯತ ಮತ್ತು ಚೌಕ</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #e0f7fa 0%, #e8f5e9 100%);
            color: #2c3e50;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            user-select: none;
        }
        .app-container {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.15);
            max-width: 900px;
            width: 100%;
        }
        h1 {
            color: #2e4053;
            margin-top: 0;
            font-size: 26px;
            border-bottom: 3px solid #2ecc71;
            padding-bottom: 10px;
            text-align: center;
        }
        
        /* ಶೇಪ್ ಸೆಲೆಕ್ಟರ್ ಬಟನ್‌ಗಳು */
        .shape-selector {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 25px;
        }
        .shape-btn {
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            border: 2px solid #bdc3c7;
            background-color: white;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .shape-btn.active {
            background-color: #2ecc71;
            color: white;
            border-color: #2ecc71;
            box-shadow: 0 4px 10px rgba(46, 204, 113, 0.3);
        }

        .workspace {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
        }
        .controls-panel {
            flex: 1;
            min-width: 290px;
            background: #fdfefe;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #e5e8e8;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.02);
        }
        .visual-panel {
            flex: 1.5;
            min-width: 320px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #ffffff;
            border: 2px dashed #3498db;
            border-radius: 12px;
            padding: 20px;
            min-height: 380px;
            position: relative;
        }
        .slider-group {
            margin-bottom: 25px;
            transition: all 0.3s ease;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            font-size: 16px;
        }
        input[type="range"] {
            width: 100%;
            height: 8px;
            border-radius: 5px;
            background: #d5dbdb;
            outline: none;
        }
        
        /* ಡೈನಾಮಿಕ್ ಆಕಾರದ ವಿನ್ಯಾಸ */
        #dynamic-shape {
            background-color: rgba(234, 84, 85, 0.15); 
            border: 4px solid #3b82f6; 
            display: grid;
            transition: all 0.2s ease;
            box-sizing: border-box;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }
        .grid-dot {
            border: 1px dashed rgba(234, 84, 85, 0.3);
            box-sizing: border-box;
        }
        
        /* ರಿಸಲ್ಟ್ ಬಾಕ್ಸ್ಗಳು */
        .result-box {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            color: white;
            font-size: 15px;
        }
        .perimeter-box { background-color: #3b82f6; }
        .area-box { background-color: #ea5455; }
        
        .formula {
            font-family: Arial, sans-serif;
            font-size: 13px;
            background: rgba(0,0,0,0.15);
            padding: 3px 8px;
            border-radius: 4px;
            display: inline-block;
            margin-top: 4px;
            font-weight: bold;
        }
        .badge {
            font-size: 20px;
            font-weight: bold;
            float: right;
        }
    </style>
</head>
<body>

<div class="app-container">
    <h1>ಆಕಾರ ಬದಲಾಯಿಸುವ ಮ್ಯಾಜಿಕ್ ಉಪಕರಣ 📐</h1>
    
    <div class="shape-selector">
        <button class="shape-btn active" id="btn-rect" onclick="selectShape('rectangle')">ಆಯತ (Rectangle)</button>
        <button class="shape-btn" id="btn-square" onclick="selectShape('square')">ಚೌಕ (Square)</button>
    </div>

    <div class="workspace">
        <div class="controls-panel">
            
            <div class="slider-group" id="length-container">
                <label id="length-label" style="color: #27ae60;">📏 ಉದ್ದ (Length): <span id="length-txt">5</span> ಮಾನಗಳು</label>
                <input type="range" id="length-slider" min="1" max="10" value="5" oninput="updateShape()">
            </div>
            
            <div class="slider-group" id="width-container">
                <label style="color: #e67e22;">📐 ಅಗಲ (Width): <span id="width-txt">4</span> ಮಾನಗಳು</label>
                <input type="range" id="width-slider" min="1" max="10" value="4" oninput="updateShape()">
            </div>

            <div class="result-box perimeter-box">
                <strong>🔵 ಒಟ್ಟು ಸುತ್ತಳತೆ (Perimeter):</strong> 
                <span class="badge" id="perimeter-ans">18</span>
                <br><span class="formula" id="perimeter-formula">ಸೂತ್ರ: 2 × (ಉದ್ದ + ಅಗಲ)</span>
                <br><span id="perimeter-step">ಲೆಕ್ಕಾಚಾರ: 2 × (5 + 4) = 18</span>
            </div>

            <div class="result-box area-box">
                <strong>🔴 ಒಟ್ಟು ವಿಸ್ತೀರ್ಣ (Area):</strong> 
                <span class="badge" id="area-ans">20</span>
                <br><span class="formula" id="area-formula">ಸೂತ್ರ: ಉದ್ದ × ಅಗಲ</span>
                <br><span id="area-step">ಲೆಕ್ಕಾಚಾರ: 5 × 4 = 20</span>
            </div>
        </div>

        <div class="visual-panel">
            <div id="dynamic-shape"></div>
            <p style="margin-top: 20px; font-size: 13px; color: #7f8c8d; text-align: center; line-height: 1.5;">
                * ನೀಲಿ ಬಣ್ಣದ <b>ಹೊರಗಿನ ಬಾರ್ಡರ್ ಉದ್ದವೇ</b> ಸುತ್ತಳತೆ.<br>
                * ಒಳಗಿರುವ ಒಟ್ಟು <b>ಚದರ ಖಾನೆಗಳ ಪ್ರಮಾಣವೇ</b> ವಿಸ್ತೀರ್ಣ.
            </p>
        </div>
    </div>
</div>

<script>
    let currentShape = 'rectangle'; // ಆರಂಭಿಕ ಆಕಾರ

    function selectShape(shape) {
        currentShape = shape;
        
        // ಬಟನ್ ಶೈಲಿಗಳನ್ನು ಬದಲಾಯಿಸುವುದು
        document.getElementById('btn-rect').classList.remove('active');
        document.getElementById('btn-square').classList.remove('active');
        
        if (shape === 'rectangle') {
            document.getElementById('btn-rect').classList.add('active');
            document.getElementById('width-container').style.display = 'block'; // ಅಗಲ ಸ್ಲೈಡರ್ ತೋರಿಸು
            document.getElementById('length-label').innerHTML = `📏 ಉದ್ದ (Length): <span id="length-txt">5</span> ಮಾನಗಳು`;
        } else {
            document.getElementById('btn-square').classList.add('active');
            document.getElementById('width-container').style.display = 'none'; // ಅಗಲ ಸ್lಲೈಡರ್ ಮರೆಮಾಡು
            document.getElementById('length-label').innerHTML = `🟩 ಬಾಹುವಿನ ಉದ್ದ (Side): <span id="length-txt">5</span> ಮಾನಗಳು`;
        }
        
        updateShape();
    }

    function updateShape() {
        const length = parseInt(document.getElementById('length-slider').value);
        const width = parseInt(document.getElementById('width-slider').value);
        
        document.getElementById('length-txt').innerText = length;
        document.getElementById('width-txt').innerText = width;

        let perimeter = 0;
        let area = 0;
        let finalWidth = length; // ಚೌಕಕ್ಕೆ ಉದ್ದವೇ ಅಗಲವಾಗಿರುತ್ತದೆ

        if (currentShape === 'rectangle') {
            finalWidth = width;
            perimeter = 2 * (length + finalWidth);
            area = length * finalWidth;

            // ಆಯತದ ಸೂತ್ರ ಮತ್ತು ಹಂತಗಳ ಅಪ್ಡೇಟ್
            document.getElementById('perimeter-formula').innerText = "ಸೂತ್ರ: 2 × (ಉದ್ದ + ಅಗಲ)";
            document.getElementById('perimeter-step').innerText = `ಲೆಕ್ಕಾಚಾರ: 2 × (${length} + ${finalWidth}) = ${perimeter}`;
            
            document.getElementById('area-formula').innerText = "ಸೂತ್ರ: ಉದ್ದ × ಅಗಲ";
            document.getElementById('area-step').innerText = `ಲೆಕ್ಕಾಚಾರ: ${length} × ${finalWidth} = ${area}`;
        } else {
            // ಚೌಕದ ಲೆಕ್ಕಾಚಾರ
            perimeter = 4 * length;
            area = length * length;

            // ಚೌಕದ ಸೂತ್ರ ಮತ್ತು ಹಂತಗಳ ಅಪ್ಡೇಟ್
            document.getElementById('perimeter-formula').innerText = "ಸೂತ್ರ: 4 × (ಬಾಹುವಿನ ಉದ್ದ)";
            document.getElementById('perimeter-step').innerText = `ಲೆಕ್ಕಾಚಾರ: 4 × ${length} = ${perimeter}`;
            
            document.getElementById('area-formula').innerText = "ಸೂತ್ರ: ಬಾಹು × ಬಾಹು (ಬಾಹು²)";
            document.getElementById('area-step').innerText = `ಲೆಕ್ಕಾಚಾರ: ${length} × ${length} = ${area}`;
        }

        // ಅಂಕಿಸಂಖ್ಯೆಗಳ ಪ್ರದರ್ಶನ
        document.getElementById('perimeter-ans').innerText = perimeter + " units";
        document.getElementById('area-ans').innerText = area + " sq units";

        // ಗ್ರಾಫಿಕಲ್ ಬಾಕ್ಸ್ ಸೈಜ್ ಬದಲಾವಣೆ (1 ಯುನಿಟ್ = 32 ಪಿಕ್ಸೆಲ್)
        const shapeBox = document.getElementById('dynamic-shape');
        shapeBox.style.width = (length * 32) + 'px';
        shapeBox.style.height = (finalWidth * 32) + 'px';

        // ಒಳಗಿನ ಚದರ ಗ್ರಿಡ್ ಕೋಣೆಗಳ ಮರುಸೃಷ್ಟಿ
        shapeBox.style.gridTemplateColumns = `repeat(${length}, 1fr)`;
        shapeBox.style.gridTemplateRows = `repeat(${finalWidth}, 1fr)`;
        
        shapeBox.innerHTML = '';
        for (let i = 0; i < area; i++) {
            const gridCell = document.createElement('div');
            gridCell.classList.add('grid-dot');
            shapeBox.appendChild(gridCell);
        }
    }

    // ಪ್ರೋಗ್ರಾಂ ಆರಂಭಿಸಲು ಮೊದಲ ಕರೆ
    updateShape();
</script>

</body>
</html>
