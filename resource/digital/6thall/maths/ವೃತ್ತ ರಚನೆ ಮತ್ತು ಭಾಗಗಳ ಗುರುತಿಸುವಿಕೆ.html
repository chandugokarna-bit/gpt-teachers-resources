<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ವೃತ್ತದ ಭಾಗಗಳನ್ನು ಗುರುತಿಸಿ</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #e0f7fa;
            margin: 0;
            padding: 20px;
            color: #333;
            text-align: center;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: #ffffff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            border-top: 8px solid #00acc1;
        }
        h1 {
            color: #00838f;
            font-size: 30px;
            margin-bottom: 10px;
        }
        p.desc {
            font-size: 18px;
            color: #555;
            margin-bottom: 20px;
        }
        
        /* Canvas Area */
        .canvas-wrapper {
            position: relative;
            display: inline-block;
            margin-bottom: 20px;
        }
        canvas {
            background-color: #fafafa;
            border: 3px dashed #b2ebf2;
            border-radius: 10px;
            cursor: crosshair;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.05);
            touch-action: none; /* Prevent scrolling while drawing on mobile */
        }

        /* Instructions & Buttons */
        .instruction {
            font-size: 20px;
            font-weight: bold;
            color: #d84315;
            background-color: #ffccbc;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .btn {
            font-size: 18px;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            color: white;
            font-weight: bold;
            transition: 0.3s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            margin: 5px;
        }
        .btn-start { background-color: #4CAF50; display: none; margin: 0 auto; }
        .btn-start:hover { background-color: #388E3C; }
        .btn-reset { background-color: #9e9e9e; }
        .btn-reset:hover { background-color: #757575; }

        /* Quiz Section */
        #quizSection {
            display: none;
            margin-top: 20px;
        }
        .options-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 20px;
        }
        .option-btn {
            background-color: #00bcd4;
            color: white;
            font-size: 20px;
            font-weight: bold;
            padding: 15px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }
        .option-btn:hover { background-color: #0097a7; transform: translateY(-2px); }
        
        #feedback {
            font-size: 22px;
            font-weight: bold;
            margin-top: 20px;
            min-height: 35px;
        }
        #scoreDisplay {
            font-size: 20px;
            font-weight: bold;
            color: #00838f;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>⭕ ವೃತ್ತ ರಚನೆ ಮತ್ತು ಭಾಗಗಳ ಗುರುತಿಸುವಿಕೆ 🔴</h1>
        <p class="desc">ಮೊದಲು ನಿಮ್ಮ ವೃತ್ತವನ್ನು ರಚಿಸಿ, ನಂತರ ಅದರ ಭಾಗಗಳನ್ನು ಗುರುತಿಸುವ ಆಟ ಆಡಿ!</p>

        <div id="constructionPhase">
            <div class="instruction" id="drawInstruction">
                ಮೌಸ್ (ಅಥವಾ ಬೆರಳನ್ನು) ಒತ್ತಿ ಹಿಡಿದು ಎಳೆಯುವ ಮೂಲಕ ವೃತ್ತವನ್ನು ರಚಿಸಿ (Click and Drag)
            </div>
            
            <div class="canvas-wrapper">
                <canvas id="circleCanvas" width="500" height="400"></canvas>
            </div>
            
            <div>
                <button class="btn btn-reset" id="resetDrawBtn" onclick="resetCanvas()">ಅಳಿಸಿ ಮತ್ತೆ ರಚಿಸಿ (Clear)</button>
                <button class="btn btn-start" id="startQuizBtn" onclick="startQuiz()">ಭಾಗಗಳನ್ನು ಗುರುತಿಸಲು ಪ್ರಾರಂಭಿಸಿ ➡️</button>
            </div>
        </div>

        <div id="quizSection">
            <div class="instruction" id="quizInstruction">
                ಕೆಂಪು ಬಣ್ಣದಲ್ಲಿ ಹೈಲೈಟ್ ಆಗಿರುವ ಭಾಗವನ್ನು ಏನೆಂದು ಕರೆಯುತ್ತಾರೆ?
            </div>

            <div class="options-grid" id="optionsContainer">
                </div>

            <div id="feedback"></div>
            <div id="scoreDisplay"></div>
            <button class="btn btn-start" id="nextBtn" style="margin-top: 20px;" onclick="loadNextQuestion()">ಮುಂದಿನ ಪ್ರಶ್ನೆ (Next)</button>
            <button class="btn btn-start" id="playAgainBtn" style="margin-top: 20px; background-color: #ff9800;" onclick="location.reload()">ಮತ್ತೆ ಆಡಿ (Play Again)</button>
        </div>

    </div>

    <script>
        const canvas = document.getElementById("circleCanvas");
        const ctx = canvas.getContext("2d");

        // Drawing State
        let isDrawing = false;
        let isDrawn = false;
        let centerX, centerY;
        let radius = 0;

        // Quiz State
        const parts = [
            { id: "center", name: "ಕೇಂದ್ರ ಬಿಂದು (Center)", desc: "ವೃತ್ತದ ಮಧ್ಯಭಾಗದ ಬಿಂದು." },
            { id: "radius", name: "ತ್ರಿಜ್ಯ (Radius)", desc: "ಕೇಂದ್ರದಿಂದ ವೃತ್ತದ ಮೇಲಿನ ಯಾವುದೇ ಬಿಂದುವಿಗೆ ಎಳೆದ ರೇಖೆ." },
            { id: "diameter", name: "ವ್ಯಾಸ (Diameter)", desc: "ಕೇಂದ್ರದ ಮೂಲಕ ಹಾದುಹೋಗುವ, ವೃತ್ತದ ಎರಡು ಬಿಂದುಗಳನ್ನು ಸೇರಿಸುವ ರೇಖೆ." },
            { id: "chord", name: "ಜ್ಯಾ (Chord)", desc: "ವೃತ್ತದ ಮೇಲಿನ ಯಾವುದೇ ಎರಡು ಬಿಂದುಗಳನ್ನು ಸೇರಿಸುವ ರೇಖೆ." },
            { id: "circumference", name: "ಪರಿಧಿ (Circumference)", desc: "ವೃತ್ತದ ಹೊರಗಿನ ಸುತ್ತಳತೆ ಅಥವಾ ಗಡಿ." }
        ];
        
        let currentQuestionIndex = 0;
        let score = 0;
        let shuffledQuestions = [];

        // --- PHASE 1: DRAWING THE CIRCLE ---

        // Get exact mouse/touch coordinates
        function getCoords(e) {
            let rect = canvas.getBoundingClientRect();
            let x = (e.clientX || e.touches[0].clientX) - rect.left;
            let y = (e.clientY || e.touches[0].clientY) - rect.top;
            return { x, y };
        }

        canvas.addEventListener("mousedown", startDrawing);
        canvas.addEventListener("touchstart", startDrawing);

        canvas.addEventListener("mousemove", drawCircle);
        canvas.addEventListener("touchmove", drawCircle);

        canvas.addEventListener("mouseup", stopDrawing);
        canvas.addEventListener("touchend", stopDrawing);

        function startDrawing(e) {
            if (isDrawn) return; // Prevent redrawing once fixed
            e.preventDefault();
            let coords = getCoords(e);
            centerX = coords.x;
            centerY = coords.y;
            isDrawing = true;
        }

        function drawCircle(e) {
            if (!isDrawing) return;
            e.preventDefault();
            let coords = getCoords(e);
            
            // Calculate radius using distance formula
            radius = Math.sqrt(Math.pow(coords.x - centerX, 2) + Math.pow(coords.y - centerY, 2));
            
            // Limit radius so it stays inside canvas
            let maxRadius = Math.min(centerX, canvas.width - centerX, centerY, canvas.height - centerY) - 10;
            if (radius > maxRadius) radius = maxRadius;

            renderBaseCircle();
        }

        function stopDrawing(e) {
            if (!isDrawing) return;
            e.preventDefault();
            isDrawing = false;
            
            // If radius is too small, ask to draw again
            if (radius < 40) {
                alert("ವೃತ್ತ ತುಂಬಾ ಚಿಕ್ಕದಾಗಿದೆ! ದಯವಿಟ್ಟು ಸ್ವಲ್ಪ ದೊಡ್ಡ ವೃತ್ತವನ್ನು ರಚಿಸಿ.");
                resetCanvas();
            } else {
                isDrawn = true;
                document.getElementById("drawInstruction").innerText = "✅ ವೃತ್ತ ರಚನೆ ಯಶಸ್ವಿಯಾಗಿದೆ!";
                document.getElementById("drawInstruction").style.backgroundColor = "#c8e6c9";
                document.getElementById("startQuizBtn").style.display = "inline-block";
                document.getElementById("resetDrawBtn").style.display = "none";
                canvas.style.cursor = "default";
            }
        }

        function renderBaseCircle() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw center dot
            ctx.beginPath();
            ctx.arc(centerX, centerY, 4, 0, Math.PI * 2);
            ctx.fillStyle = "#333";
            ctx.fill();

            // Draw circle outline
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
            ctx.strokeStyle = "#1976d2";
            ctx.lineWidth = 3;
            ctx.stroke();
        }

        function resetCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            isDrawn = false;
            radius = 0;
            document.getElementById("startQuizBtn").style.display = "none";
            document.getElementById("resetDrawBtn").style.display = "inline-block";
            document.getElementById("drawInstruction").innerText = "ಮೌಸ್ (ಅಥವಾ ಬೆರಳನ್ನು) ಒತ್ತಿ ಹಿಡಿದು ಎಳೆಯುವ ಮೂಲಕ ವೃತ್ತವನ್ನು ರಚಿಸಿ (Click and Drag)";
            document.getElementById("drawInstruction").style.backgroundColor = "#ffccbc";
            canvas.style.cursor = "crosshair";
        }

        // --- PHASE 2: QUIZ & IDENTIFICATION ---

        function startQuiz() {
            document.getElementById("resetDrawBtn").style.display = "none";
            document.getElementById("startQuizBtn").style.display = "none";
            document.getElementById("drawInstruction").style.display = "none";
            
            document.getElementById("quizSection").style.display = "block";

            // Shuffle questions
            shuffledQuestions = parts.sort(() => Math.random() - 0.5);
            
            loadQuestion();
        }

        function loadQuestion() {
            document.getElementById("feedback").innerText = "";
            document.getElementById("nextBtn").style.display = "none";
            
            let currentPart = shuffledQuestions[currentQuestionIndex];
            
            // Redraw base circle, then draw highlighted part
            renderBaseCircle();
            highlightPart(currentPart.id);

            // Generate Options
            let optionsContainer = document.getElementById("optionsContainer");
            optionsContainer.innerHTML = "";
            optionsContainer.style.pointerEvents = "auto";

            parts.forEach(part => {
                let btn = document.createElement("button");
                btn.className = "option-btn";
                btn.innerText = part.name;
                btn.onclick = () => checkAnswer(part.id, currentPart.id, btn);
                optionsContainer.appendChild(btn);
            });
        }

        function highlightPart(partId) {
            ctx.strokeStyle = "#e53935"; // Red for highlight
            ctx.fillStyle = "#e53935";
            ctx.lineWidth = 6;
            ctx.lineCap = "round";

            ctx.beginPath();

            switch(partId) {
                case "center":
                    ctx.arc(centerX, centerY, 8, 0, Math.PI * 2);
                    ctx.fill();
                    break;
                case "radius":
                    ctx.moveTo(centerX, centerY);
                    ctx.lineTo(centerX + radius, centerY);
                    ctx.stroke();
                    break;
                case "diameter":
                    ctx.moveTo(centerX - radius, centerY);
                    ctx.lineTo(centerX + radius, centerY);
                    ctx.stroke();
                    // Redraw center dot over diameter
                    ctx.beginPath();
                    ctx.arc(centerX, centerY, 5, 0, Math.PI * 2);
                    ctx.fillStyle = "#333";
                    ctx.fill();
                    break;
                case "chord":
                    // Calculate two points on circle not passing through center
                    let angle1 = Math.PI / 4; // 45 deg
                    let angle2 = (Math.PI * 3) / 4; // 135 deg
                    ctx.moveTo(centerX + radius * Math.cos(angle1), centerY - radius * Math.sin(angle1));
                    ctx.lineTo(centerX + radius * Math.cos(angle2), centerY - radius * Math.sin(angle2));
                    ctx.stroke();
                    break;
                case "circumference":
                    ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
                    ctx.stroke();
                    break;
            }
        }

        function checkAnswer(selectedId, correctId, btnElement) {
            let optionsContainer = document.getElementById("optionsContainer");
            optionsContainer.style.pointerEvents = "none"; // Disable further clicks

            let feedback = document.getElementById("feedback");

            if (selectedId === correctId) {
                btnElement.style.backgroundColor = "#4CAF50"; // Green
                let currentPart = parts.find(p => p.id === correctId);
                feedback.innerHTML = `✅ ಸರಿಯಾದ ಉತ್ತರ!<br><span style="font-size:18px; color:#555;">${currentPart.desc}</span>`;
                feedback.style.color = "#2E7D32";
                score += 10;
            } else {
                btnElement.style.backgroundColor = "#d32f2f"; // Red
                feedback.innerText = "❌ ತಪ್ಪಾಗಿದೆ! ಸರಿಯಾದ ಉತ್ತರವನ್ನು ಗಮನಿಸಿ.";
                feedback.style.color = "#c62828";
                
                // Highlight correct button
                let btns = optionsContainer.getElementsByClassName("option-btn");
                for(let b of btns) {
                    if (b.innerText === parts.find(p => p.id === correctId).name) {
                        b.style.backgroundColor = "#4CAF50";
                        b.style.border = "2px solid #000";
                    }
                }
            }

            document.getElementById("scoreDisplay").innerText = `ಅಂಕಗಳು: ${score}`;
            document.getElementById("nextBtn").style.display = "inline-block";
        }

        function loadNextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < shuffledQuestions.length) {
                loadQuestion();
            } else {
                // End of Quiz
                document.getElementById("quizInstruction").innerText = "🎉 ಆಟ ಮುಕ್ತಾಯ!";
                document.getElementById("quizInstruction").style.backgroundColor = "#c8e6c9";
                document.getElementById("optionsContainer").innerHTML = "";
                document.getElementById("feedback").innerText = `ನಿಮ್ಮ ಒಟ್ಟು ಅಂಕಗಳು: ${score} / 50`;
                document.getElementById("feedback").style.color = "#00838f";
                document.getElementById("nextBtn").style.display = "none";
                document.getElementById("scoreDisplay").style.display = "none";
                document.getElementById("playAgainBtn").style.display = "inline-block";
                
                // Show full circle with all parts
                renderBaseCircle();
            }
        }
    </script>
</body>
</html>
