<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐘 Antonym Bridge Builder Game!</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(255, 255, 255, 0.07);
            --text-main: #f8fafc;
            --accent-blue: #38bdf8;
            --correct-green: #22c55e;
            --wrong-red: #ef4444;
        }

        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(135deg, #1e3a8a 0%, #0f172a 100%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }

        .container {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 30px;
            width: 100%;
            max-width: 650px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        h1 {
            color: #fcd34d;
            font-size: 2rem;
            margin-bottom: 5px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        .subtitle {
            color: #cbd5e1;
            font-size: 1rem;
            margin-bottom: 20px;
        }

        /* Interactive visual bridge area */
        .bridge-arena {
            background: linear-gradient(to bottom, #7dd3fc 0%, #bae6fd 60%, #38bdf8 61%, #0284c7 100%);
            height: 120px;
            border-radius: 16px;
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
            border: 3px solid #0369a1;
        }

        .character {
            font-size: 3rem;
            position: absolute;
            bottom: 45px;
            left: 20px;
            transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 10;
        }

        .bridge-plank {
            background: #b45309;
            height: 15px;
            position: absolute;
            bottom: 40px;
            border-radius: 4px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        #left-bridge { left: 0; width: 25%; }
        #right-bridge { right: 0; width: 25%; }
        #middle-bridge { 
            left: 25%; 
            width: 50%; 
            background: #ef4444; 
            transform: rotate(45deg);
            transform-origin: left bottom;
            transition: all 0.5s ease;
        }

        .stats-row {
            display: flex;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.2);
            padding: 10px 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-weight: bold;
            font-size: 1.1rem;
        }

        .word-display {
            background: #ffffff;
            color: #1e293b;
            font-size: 1.8rem;
            font-weight: 800;
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 20px;
            box-shadow: inset 0 4px 6px rgba(0,0,0,0.1);
            letter-spacing: 0.5px;
        }

        .word-label {
            font-size: 0.9rem;
            text-transform: uppercase;
            color: #64748b;
            display: block;
            margin-bottom: 5px;
        }

        .options-layout {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .opt-btn {
            background: rgba(255, 255, 255, 0.15);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.25);
            padding: 16px;
            font-size: 1.2rem;
            font-weight: 600;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .opt-btn:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.3);
            border-color: var(--accent-blue);
            transform: translateY(-2px);
        }

        .opt-btn.correct {
            background: var(--correct-green) !important;
            border-color: #4ade80 !important;
            animation: pop 0.3s ease;
        }

        .opt-btn.wrong {
            background: var(--wrong-red) !important;
            border-color: #f87171 !important;
        }

        .alert-box {
            min-height: 45px;
            margin-top: 15px;
            font-size: 1.1rem;
            font-weight: 500;
            color: #fef08a;
        }

        .action-btn {
            background: #fcd34d;
            color: #1e293b;
            border: none;
            padding: 12px 35px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            display: none;
            margin: 15px auto 0 auto;
            box-shadow: 0 4px 15px rgba(252, 211, 77, 0.4);
        }

        .action-btn:hover { background: #fde047; }

        .end-panel { display: none; }

        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        @media (max-width: 480px) {
            .options-layout { grid-template-columns: 1fr; }
            h1 { font-size: 1.6rem; }
            .word-display { font-size: 1.5rem; }
        }
    </style>
</head>
<body>

    <div class="container" id="game-view">
        <h1>🐘 Antonym Bridge Builder</h1>
        <p class="subtitle">Find the opposite word to repair the bridge!</p>

        <div class="bridge-arena">
            <div class="character" id="player-token">🐘</div>
            <div class="bridge-plank" id="left-bridge"></div>
            <div class="bridge-plank" id="middle-bridge"></div>
            <div class="bridge-plank" id="right-bridge"></div>
        </div>

        <div class="stats-row">
            <div>Word: <span id="current-idx">1</span> / 8</div>
            <div>Score: <span id="score-counter">0</span> ⭐</div>
        </div>

        <div class="word-display">
            <span class="word-label">Find the Opposite of:</span>
            <span id="target-word">START</span>
        </div>

        <div class="options-layout" id="choices-grid">
            </div>

        <div class="alert-box" id="alert-msg"></div>
        <button class="action-btn" id="next-step-btn" onclick="advanceGame()">Next Word ➡️</button>
    </div>

    <div class="container end-panel" id="end-view">
        <h1 style="font-size: 2.8rem; color: #4ade80;">🎉 Safe Crossing!</h1>
        <p class="subtitle" style="font-size: 1.3rem; margin-top: 10px;">The elephant crossed the river safely because of your skills!</p>
        
        <div style="font-size: 3rem; color: #fcd34d; font-weight: 800; margin: 25px 0;">
            <span id="final-marks">0</span> / 8 ⭐
        </div>
        
        <p id="evaluation-text" style="font-size: 1.2rem; margin-bottom: 25px; color: #e2e8f0;"></p>
        <button class="action-btn" style="display: block;" onclick="resetGame()">Play Again 🔄</button>
    </div>

    <script>
        // High-frequency Class 7 level vocabulary words
        const dataset = [
            { word: "ANCIENT", options: ["Old", "Modern", "Heavy", "Slow"], correct: "Modern", hint: "💡 Hint: Think about things built today vs thousands of years ago." },
            { word: "GENEROUS", options: ["Kind", "Selfish", "Happy", "Strong"], correct: "Selfish", hint: "💡 Hint: A generous person shares; an opposite person keeps everything." },
            { word: "BRAVE", options: ["Smart", "Cowardly", "Strong", "Active"], correct: "Cowardly", hint: "💡 Hint: Someone who feels easily scared or runs away from danger." },
            { word: "ARRIVE", options: ["Leave", "Reach", "Come", "Enter"], correct: "Leave", hint: "💡 Hint: The opposite of coming to a station or classroom." },
            { word: "SMOOTH", options: ["Soft", "Flat", "Rough", "Shiny"], correct: "Rough", hint: "💡 Hint: Think of a bumpy country road compared to a polished table top." },
            { word: "FRESH", options: ["Sweet", "Stale", "New", "Clean"], correct: "Stale", hint: "💡 Hint: Used for bread or food that has been kept out for too many days." },
            { word: "VICTORY", options: ["Success", "Win", "Defeat", "Joy"], correct: "Defeat", hint: "💡 Hint: The outcome when a team loses a match instead of winning." },
            { word: "BRIGHT", options: ["Dull", "Shiny", "Clever", "Light"], correct: "Dull", hint: "💡 Hint: Think about a cloudy, dark day without sunlight." }
        ];

        let index = 0;
        let points = 0;
        let blockSelection = false;

        function setupQuestion() {
            blockSelection = false;
            const item = dataset[index];

            // Update DOM counters
            document.getElementById("current-idx").innerText = index + 1;
            document.getElementById("score-counter").innerText = points;
            document.getElementById("target-word").innerText = item.word;
            document.getElementById("alert-msg").innerText = "";
            document.getElementById("next-step-btn").style.display = "none";

            // Reset bridge graphics state
            const midBridge = document.getElementById("middle-bridge");
            midBridge.style.background = "#ef4444";
            midBridge.style.transform = "rotate(45deg)";

            // Align elephant position incrementally across stages
            const token = document.getElementById("player-token");
            token.style.left = `${20 + (index * 8)}%`;

            // Build Option Buttons
            const wrapper = document.getElementById("choices-grid");
            wrapper.innerHTML = "";
            
            item.options.forEach(choice => {
                const btn = document.createElement("button");
                btn.className = "opt-btn";
                btn.innerText = choice;
                btn.onclick = () => verifyChoice(btn, choice);
                wrapper.appendChild(btn);
            });
        }

        function verifyChoice(buttonElement, chosenWord) {
            if (blockSelection) return;
            blockSelection = true;

            const item = dataset[index];
            const allOptionButtons = document.querySelectorAll(".choices-grid .opt-btn, .opt-btn");

            if (chosenWord === item.correct) {
                buttonElement.classList.add("correct");
                points++;
                document.getElementById("score-counter").innerText = points;
                document.getElementById("alert-msg").innerText = "✨ Correct! The bridge plank locks into place! 🛠️";
                
                // Visual success: Bridge flattens out and turns woody brown
                const midBridge = document.getElementById("middle-bridge");
                midBridge.style.background = "#b45309";
                midBridge.style.transform = "rotate(0deg)";
            } else {
                buttonElement.classList.add("wrong");
                document.getElementById("alert-msg").innerText = item.hint;

                // Help student visually connect the correct pair
                allOptionButtons.forEach(btn => {
                    if (btn.innerText === item.correct) {
                        btn.classList.add("correct");
                    }
                });
            }

            // Lock out further input actions
            allOptionButtons.forEach(btn => btn.disabled = true);
            document.getElementById("next-step-btn").style.display = "block";
        }

        function advanceGame() {
            index++;
            if (index < dataset.length) {
                setupQuestion();
            } else {
                wrapUpGame();
            }
        }

        function wrapUpGame() {
            document.getElementById("game-view").style.display = "none";
            document.getElementById("end-view").style.display = "block";
            document.getElementById("final-marks").innerText = points;

            let finalComment = "";
            if (points === 8) finalComment = "Brilliant work! You are an Antonym Master Engineer! 🏆🎓";
            else if (points >= 5) finalComment = "Fantastic job! The elephant made it safely across the river. 👍🍃";
            else finalComment = "Good effort! Try once more to strengthen your vocabulary skills! 💪🎒";

            document.getElementById("evaluation-text").innerText = finalComment;
        }

        function resetGame() {
            index = 0;
            points = 0;
            document.getElementById("game-view").style.display = "block";
            document.getElementById("end-view").style.display = "none";
            setupQuestion();
        }

        // Run immediately when system environment is ready
        window.onload = setupQuestion;
    </script>
</body>
</html>
