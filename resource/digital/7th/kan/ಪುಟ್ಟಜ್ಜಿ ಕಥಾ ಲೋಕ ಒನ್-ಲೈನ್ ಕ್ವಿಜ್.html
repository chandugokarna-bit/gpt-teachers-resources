<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ಪುಟ್ಟಜ್ಜಿ ಪುಟ್ಟಜ್ಜಿ ಕಥೆ ಹೇಳು - ಅಲ್ಟ್ರಾ ಕ್ವಿಜ್</title>
    <style>
        :root {
            --neon-orange: #ff6a00;
            --neon-purple: #b200ff;
            --matrix-green: #00ff66;
            --cyber-dark: #0a0b10;
            --card-glow: rgba(255, 106, 0, 0.2);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle at center, #141526 0%, var(--cyber-dark) 100%);
            margin: 0;
            padding: 20px;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .terminal-box {
            width: 100%;
            max-width: 780px;
            background: rgba(18, 20, 32, 0.95);
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 0 40px var(--card-glow);
            border: 2px solid rgba(255, 106, 0, 0.3);
            position: relative;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        .indicator-dots { display: flex; gap: 8px; }
        .dot { width: 12px; height: 12px; border-radius: 50%; }
        .d1 { background: #ff4757; }
        .d2 { background: #ffa502; }
        .d3 { background: var(--matrix-green); }

        .system-text {
            font-family: monospace;
            color: var(--neon-orange);
            font-size: 0.85rem;
            letter-spacing: 2px;
        }

        h1 {
            font-size: 2rem;
            text-align: center;
            background: linear-gradient(90deg, var(--neon-orange), #ff00a0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 5px 0 25px 0;
        }

        .question-container {
            background: rgba(0,0,0,0.4);
            border-left: 5px solid var(--neon-orange);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 25px;
        }

        .q-meta {
            color: #aaa;
            font-size: 0.85rem;
            font-weight: bold;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .q-display {
            font-size: 1.45rem;
            line-height: 1.6;
            color: #ffffff;
        }

        .input-area { position: relative; margin-top: 20px; }

        .input-cyber {
            width: 100%;
            background: rgba(5, 6, 10, 0.8);
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 14px;
            padding: 18px;
            box-sizing: border-box;
            color: #fff;
            font-size: 1.25rem;
            transition: all 0.3s ease;
        }

        .input-cyber:focus {
            outline: none;
            border-color: var(--neon-orange);
            box-shadow: 0 0 20px rgba(255, 106, 0, 0.4);
        }

        .hint-text {
            font-size: 0.85rem;
            color: #666;
            margin-top: 10px;
            display: block;
        }

        .footer-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 30px;
        }

        .score-hud {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--matrix-green);
            background: rgba(0, 255, 102, 0.1);
            padding: 8px 16px;
            border-radius: 8px;
        }

        .btn-submit {
            background: linear-gradient(135deg, var(--neon-orange) 0%, #ff00a0 100%);
            color: white;
            font-weight: bold;
            border: none;
            padding: 14px 35px;
            font-size: 1.1rem;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 15px rgba(255, 106, 0, 0.3);
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px var(--neon-orange);
        }

        .feedback-ui {
            display: none;
            padding: 20px;
            border-radius: 12px;
            margin-top: 20px;
            font-size: 1.2rem;
            font-weight: bold;
            line-height: 1.5;
        }

        .correct-style { background: rgba(0, 255, 102, 0.15); border: 2px solid var(--matrix-green); color: var(--matrix-green); }
        .wrong-style { background: rgba(255, 71, 87, 0.15); border: 2px solid #ff4757; color: #ff4757; }
    </style>
</head>
<body>

<div class="terminal-box">
    <div class="top-bar">
        <div class="indicator-dots">
            <div class="dot d1"></div>
            <div class="dot d2"></div>
            <div class="dot d3"></div>
        </div>
        <div class="system-text">CORE-ENGINE: RUNNING</div>
    </div>

    <h1>📖 ಪುಟ್ಟಜ್ಜಿ ಕಥಾ ಲೋಕ: ಒನ್-ಲೈನ್ ಕ್ವಿಜ್ 📖</h1>

    <div class="question-container">
        <div class="q-meta" id="q-count">QUESTION 01 // 05</div>
        <div class="q-display" id="question-text">ಪ್ರಶ್ನೆ ಲೋಡ್ ಆಗುತ್ತಿದೆ...</div>
    </div>

    <div class="input-area">
        <input type="text" class="input-cyber" id="answer-field" placeholder="ನಿಮ್ಮ ಉತ್ತರವನ್ನು ಇಲ್ಲಿ ಬರೆಯಿರಿ..." autocomplete="off">
        <span class="hint-text">💡 ಮಾಹಿತಿ: ಉತ್ತರದಲ್ಲಿ ಸರಿಯಾದ ಮುಖ್ಯ ಪದಗಳು ಇದ್ದರೆ ಸಿಸ್ಟಮ್ ಗ್ರಹಿಸುತ್ತದೆ.</span>
    </div>

    <div class="feedback-ui" id="feedback-box">ಸ್ಥಿತಿ</div>

    <div class="footer-controls">
        <div class="score-hud" id="score-display">SCORE: 00</div>
        <button class="btn-submit" id="action-btn" onclick="processEvaluation()">ಉತ್ತರ ಲಾಕ್ ಮಾಡಿ 🔒</button>
    </div>
</div>

<script>
    // 5 One-sentence questions from "Puttajji Puttajji Kathe Helu"
    const quizQuestions = [
        {
            q: "೧. ಪುಟ್ಟಜ್ಜಿಯ ಸ್ಪೆಷಾಲಿಟಿ (ವಿಶೇಷತೆ) ಯಾವುದು?",
            keywords: ["ಹಾಡ್ಗತೆ", "ಹಾಡಿನ ಕಥೆ", "ಹಾಡ್ಗತೆಗಳು"],
            perfect: "ಸರಿಯಾದ ಉತ್ತರ: ಪುಟ್ಟಜ್ಜಿಯ ಸ್ಪೆಷಾಲಿಟಿ ಎಂದರೆ ಹಾಡ್ಗತೆ."
        },
        {
            q: "೨. ಜಿಂಕೆಯ ಕುತ್ತಿಗೆಯಲ್ಲಿ ಏನಿತ್ತು?",
            keywords: ["ಗೆಜ್ಜೆ", "ಗೆಜ್ಜೆ ಬೇರೆ ಇತ್ತು"],
            perfect: "ಸರಿಯಾದ ಉತ್ತರ: ಜಿಂಕೆಯ ಕುತ್ತಿಗೆಯಲ್ಲಿ ಒಂದು ಗೆಜ್ಜೆ ಇತ್ತು."
        },
        {
            q: "೩. ಹುಲಿ ಸೋತು ಎಲ್ಲಿಗೆ ಪಲಾಯನ ಮಾಡಿತು?",
            keywords: ["ಕಾಡಿಗೆ", "ಕಾಡು"],
            perfect: "ಸರಿಯಾದ ಉತ್ತರ: ಹುಲಿ ಸೋತು ಕೊನೆಗೆ ಕಾಡಿಗೆ ಪಲಾಯನ ಮಾಡಿತು."
        },
        {
            q: "೪. ಗಾಯಗೊಂಡ ಯುವಕನಿಗೆ ಯಾರು ಮದ್ದು ಮಾಡಿದರು?",
            keywords: ["ಜಿಂಕೆ", "ಚುಕ್ಕಿ"],
            perfect: "ಸರಿಯಾದ ಉತ್ತರ: ಗಾಯಗೊಂಡ ಯುವಕನಿಗೆ ಜಿಂಕೆಯು (ಚುಕ್ಕಿ) ಗಿಡಮೂಲಿಕೆ ತಂದು ಮದ್ದು ಮಾಡಿತು."
        },
        {
            q: "೫. 'ಪುಟ್ಟಜ್ಜಿ ಪುಟ್ಟಜ್ಜಿ ಕಥೆ ಹೇಳು' ಪಾಠದ ಲೇಖಕರು ಯಾರು?",
            keywords: ["ನಾ ಡಿಕ್ಲೋಸ್", "ನಾ. ಡಿ'ಸೋಜ", "ನಾ ಡಿ ಸೋಜ", "ಡಿಸೋಜ"],
            perfect: "ಸರಿಯಾದ ಉತ್ತರ: ಈ ಪಾಠದ ಲೇಖಕರು ನಾ. ಡಿ'ಸೋಜ ಅವರು."
        }
    ];

    let currentIdx = 0;
    let score = 0;
    let gameState = 0; // 0: Evaluate, 1: Next

    function displayQuestion() {
        if (currentIdx >= quizQuestions.length) {
            document.getElementById('q-count').innerText = "COMPLETED";
            document.getElementById('question-text').innerText = `🎉 ಕ್ವಿಜ್ ಮುಕ್ತಾಯಗೊಂಡಿದೆ! ನಿಮ್ಮ ಒಟ್ಟು ಅಂಕಗಳು: ${score * 20} / 100`;
            document.getElementById('answer-field').style.display = 'none';
            document.querySelector('.hint-text').style.display = 'none';
            document.getElementById('feedback-box').style.display = 'none';
            document.getElementById('action-btn').style.display = 'none';
            return;
        }

        document.getElementById('q-count').innerText = `QUESTION 0${currentIdx + 1} // 05`;
        document.getElementById('question-text').innerText = quizQuestions[currentIdx].q;
        document.getElementById('answer-field').value = '';
        document.getElementById('answer-field').disabled = false;
        document.getElementById('feedback-box').style.display = 'none';
        document.getElementById('action-btn').innerText = "ಉತ್ತರ ಲಾಕ್ ಮಾಡಿ 🔒";
        gameState = 0;
    }

    function processEvaluation() {
        const uAnswer = document.getElementById('answer-field').value.trim();
        const fBox = document.getElementById('feedback-box');

        if (gameState === 1) {
            currentIdx++;
            displayQuestion();
            return;
        }

        if (uAnswer === "") {
            alert("ದಯವಿಟ್ಟು ನಿಮ್ಮ ಉತ್ತರವನ್ನು ಟೈಪ್ ಮಾಡಿ!");
            return;
        }

        const qItem = quizQuestions[currentIdx];
        let hasKeywords = qItem.keywords.some(key => uAnswer.includes(key));

        fBox.style.display = 'block';
        document.getElementById('answer-field').disabled = true;

        if (hasKeywords) {
            score++;
            document.getElementById('score-display').innerText = `SCORE: ${score * 20}`;
            fBox.className = "feedback-ui correct-style";
            fBox.innerHTML = `💥 ಅದ್ಭುತ! ಕರಾರುವಾಕ್ ಉತ್ತರ.<br><span style="font-size:0.95rem; font-weight:normal; color:#fff;">${qItem.perfect}</span>`;
        } else {
            fBox.className = "feedback-ui wrong-style";
            fBox.innerHTML = `❌ ಉತ್ತರ ಹೊಂದಾಣಿಕೆಯಾಗಲಿಲ್ಲ!<br><span style="font-size:0.95rem; font-weight:normal; color:#fff;">ಗಮನಿಸಿ: ${qItem.perfect}</span>`;
        }

        document.getElementById('action-btn').innerText = "ಮುಂದಿನ ಪ್ರಶ್ನೆ ➡️";
        gameState = 1;
    }

    window.onload = displayQuestion;
</script>

</body>
</html>
