    <style>

            border: 1px solid #30305a;

            padding: 16px;
            font-size: 1.1em;

            font-weight: 500;
        }

        .option-btn:hover {
            border-color: var(--neon-blue);
            background: #202045;
            box-shadow: 0 0 12px rgba(0, 242, 254, 0.25);
        }

        .feedback {
            text-align: center;
            margin-top: 20px;
            font-size: 1.25em;
            font-weight: bold;
            min-height: 35px;
        }

        .action-container {
            display: flex;

        .next-btn {

<body>

    <header>
        <h1>ಅಧ್ಯಾಯ 2: ಅಂಕಗಣಿತದ ಉಕ್ತಿಗಳು ⚡ MEGA QUIZ</h1>
        <p>Cyber Math Arcade - ತಲಾ 10 ಪ್ರಶ್ನೆಗಳ ಸವಾಲು!</p>
    </header>

    <div class="container">
        <div class="tabs">
            <button class="tab-btn active" id="tab0" onclick="switchConcept(0)">ಕಲ್ಪನೆ 1: BODMAS ನಿಯಮ (10 Qs)</button>
            <button class="tab-btn" id="tab1" onclick="switchConcept(1)">ಕಲ್ಪನೆ 2: ಹೇಳಿಕೆಯಿಂದ ಉಕ್ತಿ (10 Qs)</button>
            <button class="tab-btn" id="tab2" onclick="switchConcept(2)">ಕಲ್ಪನೆ 3: ತಪ್ಪು ಪತ್ತೆ ಹಚ್ಚಿ (10 Qs)</button>

            <div class="display-area" id="main-question-text">

            <div class="btn-grid" id="options-box">
                </div>

            <div id="quiz-feedback" class="feedback"></div>

            <div class="action-container">

            </div>
        </div>
    </div>

    <script>
        // --- WEB AUDIO API ENGINE ---
        function playSuccessAudio() {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            
            // Chime Note 1
            let osc1 = audioCtx.createOscillator();
            let gain1 = audioCtx.createGain();
            osc1.type = 'sine';
            osc1.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
            gain1.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain1.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc1.connect(gain1);
            gain1.connect(audioCtx.destination);
            osc1.start();
            osc1.stop(audioCtx.currentTime + 0.3);

            // Chime Note 2 (Delayed slightly for high quality arcade sound)
            setTimeout(() => {
                let osc2 = audioCtx.createOscillator();
                let gain2 = audioCtx.createGain();
                osc2.type = 'sine';
                osc2.frequency.setValueAtTime(659.25, audioCtx.currentTime); // E5
                gain2.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain2.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                osc2.connect(gain2);
                gain2.connect(audioCtx.destination);
                osc2.start();
                osc2.stop(audioCtx.currentTime + 0.4);
            }, 80);
        }

        // --- QUESTION DATABASES (10 EACH) ---
        const conceptData = [
            // CONCEPT 1: BODMAS (10 Questions)
            [
                { q: "20 - (5 × 3) + 2", ops: ["7", "47", "3", "12"], a: "7" },
                { q: "12 + 8 ÷ 2 - 3", ops: ["7", "13", "10", "14"], a: "13" },
                { q: "5 × (4 + 6) - 15", ops: ["35", "10", "25", "40"], a: "35" },
                { q: "(15 - 3) ÷ 4 + 7", ops: ["10", "11", "9", "8"], a: "10" },
                { q: "30 ÷ 5 × 2 + 4", ops: ["7", "16", "24", "12"], a: "16" },
                { q: "18 - 3 + 6 × 2", ops: ["42", "27", "21", "30"], a: "27" },
                { q: "(8 + 2) × (10 - 6)", ops: ["40", "16", "24", "100"], a: "40" },
                { q: "25 - 5 ÷ 5 + 4", ops: ["8", "28", "20", "24"], a: "28" },
                { q: "40 ÷ (4 + 4) × 5", ops: ["25", "1", "45", "10"], a: "25" },
                { q: "9 + 3 × 5 - 2", ops: ["58", "22", "18", "20"], a: "22" }
            ],
            // CONCEPT 2: STATEMENT TO EXPRESSION (10 Questions)
            [
                { q: "\"12 ಮತ್ತು 4 ರ ಮೊತ್ತಕ್ಕೆ 5 ರಿಂದ ಗುಣಿಸಿ\"", ops: ["12 + 4 × 5", "(12 + 4) × 5", "12 × 4 + 5", "12 × (4 + 5)"], a: "(12 + 4) × 5" },
                { q: "\"20 ರಲ್ಲಿ 8 ನ್ನು ಕಳೆದು ಬಂದ ಉತ್ತರವನ್ನು 2 ರಿಂದ ಭಾಗಿಸಿ\"", ops: ["20 - 8 ÷ 2", "(20 - 8) ÷ 2", "20 ÷ 2 - 8", "20 - (8 ÷ 2)"], a: "(20 - 8) ÷ 2" },
                { q: "\"6 ಮತ್ತು 3 ರ ಗುಣಲಬ್ಧಕ್ಕೆ 10 ನ್ನು ಕೂಡಿ\"", ops: ["6 × 3 + 10", "6 × (3 + 10)", "(6 + 10) × 3", "10 × 6 + 3"], a: "6 × 3 + 10" },
                { q: "\"50 ನ್ನು 5 ಮತ್ತು 2 ರ ಗುಣಲಬ್ಧದಿಂದ ಭಾಗಿಸಿ\"", ops: ["50 ÷ 5 × 2", "50 ÷ (5 × 2)", "50 × 5 ÷ 2", "(50 ÷ 5) × 2"], a: "50 ÷ (5 × 2)" },
                { q: "\"15 ಕ್ಕೆ 6 ಮತ್ತು 2 ರ ವ್ಯತ್ಯಾಸವನ್ನು ಗುಣಿಸಿ\"", ops: ["15 × 6 - 2", "15 × (6 - 2)", "(15 × 6) - 2", "15 - 6 × 2"], a: "15 × (6 - 2)" },
                { q: "\"8 ರ 4 ರಷ್ಟು ಪಟ್ಟಿಗೆ 7 ನ್ನು ಸೇರಿಸಿ\"", ops: ["8 + 4 + 7", "8 × 4 + 7", "(8 + 7) × 4", "8 × (4 + 7)"], a: "8 × 4 + 7" },
                { q: "\"100 ರಿಂದ 20 ಮತ್ತು 5 ರ ಮೊತ್ತವನ್ನು ಕಳೆಯಿರಿ\"", ops: ["100 - 20 + 5", "100 - (20 + 5)", "(100 - 20) + 5", "100 ÷ (20 + 5)"], a: "100 - (20 + 5)" },
                { q: "\"4 ಮತ್ತು 2 ರ ಮೊತ್ತದಿಂದ 24 ನ್ನು ಭಾಗಿಸಿ\"", ops: ["24 ÷ 4 + 2", "24 ÷ (4 + 2)", "(24 ÷ 4) + 2", "24 × (4 + 2)"], a: "24 ÷ (4 + 2)" },
                { q: "\"9 ರ 3 ರಷ್ಟು ಭಾಗದಿಂದ 2 ನ್ನು ಕಳೆಯಿರಿ\"", ops: ["9 ÷ 3 - 2", "9 × 3 - 2", "9 - 3 - 2", "(9 - 2) ÷ 3"], a: "9 × 3 - 2" },
                { q: "\"18 ಮತ್ತು 6 ರ ವ್ಯತ್ಯಾಸಕ್ಕೆ 4 ರಿಂದ ಭಾಗಿಸಿ\"", ops: ["18 - 6 ÷ 4", "(18 - 6) ÷ 4", "18 ÷ 4 - 6", "18 - (6 ÷ 4)"], a: "(18 - 6) ÷ 4" }
            ],
            // CONCEPT 3: SPOT THE MISTAKE (10 Questions)
            [
                { q: "ಲೆಕ್ಕ: 10 + 5 × 2 -> ಹಂತ 1: 15 × 2 = 30. ಇಲ್ಲಿ ಆದ ತಪ್ಪು ಏನು?", ops: ["ಯಾವುದೇ ತಪ್ಪಿಲ್ಲ", "ಮೊದಲು ಸಂಕಲನ ಮಾಡಿದ್ದು ತಪ್ಪು (ಗುಣಾಕಾರ ಮಾಡಬೇಕಿತ್ತು)", "ಗುಣಾಕಾರದ ಉತ್ತರ ತಪ್ಪು"], a: "ಮೊದಲು ಸಂಕಲನ ಮಾಡಿದ್ದು ತಪ್ಪು (ಗುಣಾಕಾರ ಮಾಡಬೇಕಿತ್ತು)" },
                { q: "ಲೆಕ್ಕ: 24 ÷ (4 + 2) -> ಹಂತ 1: 6 + 2 = 8. ಇಲ್ಲಿ ಆದ ತಪ್ಪು ಯಾವುದು?", ops: ["ಆವರಣ ಬಿಡಿಸುವ ಮುನ್ನ ಭಾಗಾಕಾರ ಮಾಡಿದ್ದು ತಪ್ಪು", "ಭಾಗಾಕಾರದ ಕ್ರಿಯೆ ತಪ್ಪು", "ಸಂಕಲನ ಮಾಡಬಾರದಿತ್ತು"], a: "ಆವರಣ ಬಿಡಿಸುವ ಮುನ್ನ ಭಾಗಾಕಾರ ಮಾಡಿದ್ದು ತಪ್ಪು" },
                { q: "ಲೆಕ್ಕ: 15 - 3 + 2 -> ಹಂತ 1: 15 - 5 = 10. ಇಲ್ಲಿ ಆದ ತಪ್ಪು ಪತ್ತೆ ಹಚ್ಚಿ:", ops: ["ಎಡದಿಂದ ಬಲಕ್ಕೆ ನಿಯಮ ಪಾಲಿಸದೆ 3+2 ಮೊದಲು ಮಾಡಿದ್ದು ತಪ್ಪು", "ವ್ಯವಕಲನ ತಪ್ಪು", "ಯಾವುದೇ ತಪ್ಪಿಲ್ಲ"], a: "ಎಡದಿಂದ ಬಲಕ್ಕೆ ನಿಯಮ ಪಾಲಿಸದೆ 3+2 ಮೊದಲು ಮಾಡಿದ್ದು ತಪ್ಪು" },
                { q: "ಲೆಕ್ಕ: 6 × 4 ÷ 2 -> ಹಂತ 1: 24 ÷ 2 = 12. ಈ ಹಂತ ಸರಿಯೇ?", ops: ["ಸರಿಯಾಗಿದೆ (ಎಡದಿಂದ ಬಲಕ್ಕೆ ಗುಣಾಕಾರ ಮೊದಲು ಬಂದಿದೆ)", "ತಪ್ಪಾಗಿದೆ, ಯಾವಾಗಲೂ ಭಾಗಾಕಾರವೇ ಮೊದಲು ಮಾಡಬೇಕು", "ಉತ್ತರ ತಪ್ಪು"], a: "ಸರಿಯಾಗಿದೆ (ಎಡದಿಂದ ಬಲಕ್ಕೆ ಗುಣಾಕಾರ ಮೊದಲು ಬಂದಿದೆ)" },
                { q: "ಲೆಕ್ಕ: (20 - 5) × 2 -> ಹಂತ 1: 20 - 10 = 10. ಇಲ್ಲಿ ಮಾಡಿದ ತಪ್ಪು ಏನು?", ops: ["ಬ್ರಾಕೆಟ್ ಮುಂಚೆ ಗುಣಾಕಾರ ಮಾಡಿದ್ದು ತಪ್ಪು", "ಬ್ರಾಕೆಟ್ ಮುಂಚೆ ವ್ಯವಕಲನ ಮಾಡಬೇಕಿತ್ತು", "ಗುಣಾಕಾರ ಕ್ರಿಯೆ ತಪ್ಪು"], a: "ಬ್ರಾಕೆಟ್ ಮುಂಚೆ ಗುಣಾಕಾರ ಮಾಡಿದ್ದು ತಪ್ಪು" },
                { q: "ಲೆಕ್ಕ: 8 + 12 ÷ 4 -> ಹಂತ 1: 20 ÷ 4 = 5. ಇಲ್ಲಿ ಆದ ತಪ್ಪೇನು?", ops: ["ಭಾಗಾಕಾರದ ಮುನ್ನ ಸಂಕಲನ ಮಾಡಿದ್ದು ತಪ್ಪು", "ಭಾಗಾಕಾರ ತಪ್ಪು ಬರೆಯಲಾಗಿದೆ", "ಸರಿಯಾಗಿದೆ"], a: "ಭಾಗಾಕಾರದ ಮುನ್ನ ಸಂಕಲನ ಮಾಡಿದ್ದು ತಪ್ಪು" },
                { q: "ಲೆಕ್ಕ: 4 × (5 + 1) -> ಹಂತ 1: 20 + 1 = 21. ಇಲ್ಲಿನ ತಪ್ಪು ಯಾವುದು?", ops: ["ಬ್ರಾಕೆಟ್ ಒಳಗಿನದನ್ನು ಮೊದಲು ಕೂಡಬೇಕಿತ್ತು", "ಗುಣಾಕಾರ ತಪ್ಪು", "ಸರಿಯಾಗಿದೆ"], a: "ಬ್ರಾಕೆಟ್ ಒಳಗಿನದನ್ನು ಮೊದಲು ಕೂಡಬೇಕಿತ್ತು" },
                { q: "ಲೆಕ್ಕ: 35 - 5 × 6 -> ಹಂತ 1: 30 × 6 = 180. ತಪ್ಪು ಎಲ್ಲಿದೆ?", ops: ["ಗುಣಾಕಾರ ಮಾಡುವ ಮುನ್ನ ಕಳೆದದ್ದು ತಪ್ಪು", "ಗುಣಾಕಾರ ತಪ್ಪು", "ಯಾವುದೇ ತಪ್ಪಿಲ್ಲ"], a: "ಗುಣಾಕಾರ ಮಾಡುವ ಮುನ್ನ ಕಳೆದದ್ದು ತಪ್ಪು" },
                { q: "ಲೆಕ್ಕ: 12 ÷ 2 × 3 -> ಹಂತ 1: 12 ÷ 6 = 2. ಇಲ್ಲಿ ಆದ ತಪ್ಪು ಏನು?", ops: ["ಎಡದಿಂದ ಮೊದಲು ಬಂದ ಭಾಗಾಕಾರ ಬಿಟ್ಟು ಗುಣಾಕಾರ ಮಾಡಿದ್ದು ತಪ್ಪು", "ಭಾಗಾಕಾರ ಮೊದಲು ಮಾಡಿದ್ದು ತಪ್ಪು", "ಸರಿಯಾಗಿದೆ"], a: "ಎಡದಿಂದ ಮೊದಲು ಬಂದ ಭಾಗಾಕಾರ ಬಿಟ್ಟು ಗುಣಾಕಾರ ಮಾಡಿದ್ದು ತಪ್ಪು" },
                { q: "ಲೆಕ್ಕ: 16 - (4 - 1) -> ಹಂತ 1: 12 - 1 = 11. ಇಲ್ಲಿ ಆದ ತಪ್ಪು ಪತ್ತೆ ಮಾಡಿ:", ops: ["ಬ್ರಾಕೆಟ್ ಬಿಡಿಸುವ ಮುನ್ನ 16-4 ಮಾಡಿದ್ದು ತಪ್ಪು", "ಬ್ರಾಕೆಟ್ ಮೊದಲು ಮಾಡಿದ್ದು ತಪ್ಪು", "ವ್ಯವಕಲನ ತಪ್ಪು"], a: "ಬ್ರಾಕೆಟ್ ಬಿಡಿಸುವ ಮುನ್ನ 16-4 ಮಾಡಿದ್ದು ತಪ್ಪು" }
            ]
        ];

        let currentConcept = 0;
        let currentQuestionIdx = 0;
        let score = 0;

        function switchConcept(conceptIdx) {
            currentConcept = conceptIdx;
            currentQuestionIdx = 0;
            score = 0;
            
            for(let i=0; i<3; i++) {
                document.getElementById('tab' + i).classList.remove('active');
            }
            document.getElementById('tab' + conceptIdx).classList.add('active');
            
            loadQuestion();
        }

        function loadQuestion() {
            let qData = conceptData[currentConcept][currentQuestionIdx];
            document.getElementById('question-number').innerText = `ಪ್ರಶ್ನೆ: ${currentQuestionIdx + 1} / 10`;
            document.getElementById('score-counter').innerText = `ಅಂಕಗಳು: ${score}`;
            document.getElementById('main-question-text').innerText = qData.q;
            document.getElementById('quiz-feedback').innerText = "";
            document.getElementById('next-button').style.display = "none";

            let optionsBox = document.getElementById('options-box');
            optionsBox.innerHTML = "";

            qData.ops.forEach(opt => {
                let btn = document.createElement('button');
                btn.className = "option-btn";
                btn.innerText = opt;
                btn.onclick = function() { checkAnswer(opt, btn); };
                optionsBox.appendChild(btn);
            });
        }

        function checkAnswer(selected, btnElement) {
            let correctAnswer = conceptData[currentConcept][currentQuestionIdx].a;
            let feedback = document.getElementById('quiz-feedback');
            
            // Disable all options after click
            let allButtons = document.querySelectorAll('.option-btn');
            allButtons.forEach(b => b.disabled = true);

            if(selected === correctAnswer) {
                feedback.innerHTML = "<span style='color: var(--neon-green); text-shadow: 0 0 10px var(--neon-green);'>🎉 ಅದ್ಭುತ! ಸರಿಯಾದ ಉತ್ತರ.</span>";
                btnElement.style.borderColor = "var(--neon-green)";
                btnElement.style.background = "#053015";
                score++;
                document.getElementById('score-counter').innerText = `ಅಂಕಗಳು: ${score}`;
                playSuccessAudio();  // Triggering Arcade Audio Chime
            } else {
                feedback.innerHTML = `<span style='color: var(--neon-pink); text-shadow: 0 0 10px var(--neon-pink);'>❌ ತಪ್ಪು ಉತ್ತರ! ಸರಿಯಾದ ಉತ್ತರ: ${correctAnswer}</span>`;
                btnElement.style.borderColor = "var(--neon-pink)";
                btnElement.style.background = "#300515";
            }

            document.getElementById('next-button').style.display = "block";
        }

        function loadNextQuestion() {
            currentQuestionIdx++;
            if(currentQuestionIdx < 10) {
                loadQuestion();
            } else {
                document.getElementById('main-question-text').innerText = `🏆 ಈ ಹಂತ ಮುಕ್ತಾಯವಾಯಿತು! ನಿಮ್ಮ ಒಟ್ಟು ಅಂಕಗಳು: ${score} / 10`;
                document.getElementById('options-box').innerHTML = "";
                document.getElementById('next-button').style.display = "none";
                document.getElementById('quiz-feedback').innerText = "ಮುಂದಿನ ಪರಿಕಲ್ಪನೆಯನ್ನು ಮೇಲಿನ ಟ್ಯಾಬ್‌ನಲ್ಲಿ ಆಯ್ಕೆ ಮಾಡಿ ಕಲಿಯಿರಿ!";
            }
        }

        // Initialize first load
        window.onload = function() {
            loadQuestion();
        };
    </script>
</body>
</html>
