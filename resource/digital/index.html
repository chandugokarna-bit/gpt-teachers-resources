<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <title>6-7ನೇ ತರಗತಿ - ನೈಜ ಇಂಟರಾಕ್ಟಿವ್ ಸೌರಮಂಡಲ</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        canvas { width: 100%; height: 100%; display: block; }

        /* ಮಾಹಿತಿ ಬಾಕ್ಸ್ - ಕೆಳಭಾಗದಲ್ಲಿ */
        #info-box {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 20px 30px;
            border-radius: 12px;
            border: 2px solid #ffd700;
            width: 85%;
            max-width: 600px;
            text-align: center;
            z-index: 10;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
            pointer-events: none; /* ಮೌಸ್ ತಿರುಗಿಸಲು ಅಡ್ಡಿ ಮಾಡದಿರಲು */
            transition: 0.3s;
        }
        h2 { margin-top: 0; color: #ffd700; font-size: 22px; margin-bottom: 8px; }
        p { font-size: 16px; line-height: 1.5; margin: 0; color: #ddd; }
        .hint { font-size: 12px; color: #888; margin-top: 5px; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

<div id="info-box">
    <h2 id="info-title">🚀 ಸೌರಮಂಡಲ ಪರಿಶೋಧನೆ</h2>
    <p id="info-text">ಯಾವುದೇ ಗ್ರಹದ ಮೇಲೆ ನೇರವಾಗಿ ಕ್ಲಿಕ್ ಮಾಡಿ ಅದರ ವಿಶೇಷತೆಗಳನ್ನು ತಿಳಿಯಿರಿ!</p>
    <div class="hint">(ಮೌಸ್ ಲೆಫ್ಟ್ ಕ್ಲಿಕ್ ಬಳಸಿ ತಿರುಗಿಸಿ, ಸ್ಕ್ರಾಲ್ ಮಾಡಿ ಜೂಮ್ ಇನ್ ಮಾಡಿ)</div>
</div>

<script>
    // 1. ರಂಗಸ್ಥಳ ಮತ್ತು ನಕ್ಷತ್ರಗಳ ಹಿನ್ನೆಲೆ
    const scene = new THREE.Scene();
    const textureLoader = new THREE.TextureLoader();
    scene.background = textureLoader.load('https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/cube/MilkyWay/dark-s_nx.jpg');

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 30, 50);

    // 2. ರೆಂಡರರ್ ಮತ್ತು ಮೌಸ್ ಕಂಟ್ರೋಲ್ಸ್
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);
    const controls = new THREE.OrbitControls(camera, renderer.domElement);

    // 3. ಪರಿಪೂರ್ಣ ಬೆಳಕಿನ ವ್ಯವಸ್ಥೆ (ನಿಮ್ಮ 2ನೇ ಸಮಸ್ಯೆಗೆ ಪರಿಹಾರ)
    const ambientLight = new THREE.AmbientLight(0x333333); // ಆಕಾಶದ ಸೂಕ್ಷ್ಮ ಕತ್ತಲು
    scene.add(ambientLight);

    // ಸೂರ್ಯನ ಕೇಂದ್ರದಿಂದ ಎಲ್ಲಾ 360 ಡಿಗ್ರಿ ದಿಕ್ಕಿಗೂ ನೈಜ ಬೆಳಕು ಹೊರಹೊಮ್ಮುತ್ತದೆ
    const sunLight = new THREE.PointLight(0xffffff, 4, 600); 
    scene.add(sunLight);

    // ಕ್ಲಿಕ್ ಗುರುತಿಸಲು ಲಿಸ್ಟ್ (Array)
    const planetsList = [];

    // 4. ಪರಿಪೂರ್ಣ ಸ್ವಯಂ ಪ್ರಕಾಶಮಾನ ಸೂರ್ಯ (ಲಿಂಕ್ ಇಲ್ಲದೆಯೇ ಸದಾ ಬೆಳಗುತ್ತಾನೆ)
const sunGeometry = new THREE.SphereGeometry(4, 32, 32);

// ಇಲ್ಲಿ ಯಾವುದೇ ಚಿತ್ರದ ಲಿಂಕ್ ಬಳಸುತ್ತಿಲ್ಲ, ಬದಲಿಗೆ 3D ಬಣ್ಣದ ಕೋಡ್ ಬಳಸಲಾಗಿದೆ
const sunMaterial = new THREE.MeshBasicMaterial({ 
    color: 0xffd700, // ಅಪ್ಪಟ ಚಿನ್ನದಂತಹ ಹಳದಿ ಬಣ್ಣ (Gold Color)
    wireframe: false // ಗ್ರಹ ನೈಜವಾಗಿ ಗೋಳಾಕಾರದಲ್ಲಿ ಕಾಣಲು
});

const sun = new THREE.Mesh(sunGeometry, sunMaterial);
sun.userData = { id: 'sun' };
scene.add(sun);
planetsList.push(sun);

    // ಗ್ರಹ ಸೃಷ್ಟಿಸುವ ಫಂಕ್ಷನ್
    function createPlanet(size, textureUrl, positionX, id) {
        const geometry = new THREE.SphereGeometry(size, 32, 32);
        const material = new THREE.MeshStandardMaterial({ 
            map: textureLoader.load(textureUrl),
            roughness: 0.6
        });
        const planet = new THREE.Mesh(geometry, material);
        planet.position.x = positionX;
        planet.userData = { id: id }; // ಪ್ರತಿ ಗ್ರಹಕ್ಕೂ ಪ್ರತ್ಯೇಕ ID
        scene.add(planet);
        planetsList.push(planet); // ಕ್ಲಿಕ್ ಲಿಸ್ಟ್‌ಗೆ ಸೇರ್ಪಡೆ
        return planet;
    }

    // 5. 8 ಗ್ರಹಗಳ ಸೃಷ್ಟಿ
    const baseUrl = 'https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/';
    
    const mercury = createPlanet(0.5, baseUrl + 'canvas_bars.jpg', 7, 'mercury');
    const venus   = createPlanet(0.9, baseUrl + 'mars_1k_color.jpg', 11, 'venus');
    const earth   = createPlanet(1.1, baseUrl + 'earth_atmos_2048.jpg', 15, 'earth');
    const mars    = createPlanet(0.7, baseUrl + 'mars_1k_color.jpg', 20, 'mars');
    const jupiter = createPlanet(2.3, baseUrl + 'mars_1k_color.jpg', 26, 'jupiter');

    // ಶನಿ ಮತ್ತು ಬಳೆಗಳು
    const saturn  = createPlanet(1.8, baseUrl + 'canvas_bars.jpg', 33, 'saturn');
    const ringGeometry = new THREE.RingGeometry(2.3, 4.2, 64);
    const ringMaterial = new THREE.MeshStandardMaterial({ color: 0xdeb887, side: THREE.DoubleSide, transparent: true, opacity: 0.6 });
    const saturnRing = new THREE.Mesh(ringGeometry, ringMaterial);
    saturnRing.rotation.x = Math.PI / 2;
    saturn.add(saturnRing);

    const uranus  = createPlanet(1.3, baseUrl + 'earth_atmos_2048.jpg', 41, 'uranus');
    const neptune = createPlanet(1.2, baseUrl + 'earth_atmos_2048.jpg', 48, 'neptune');

    // ಚಲನೆಯ ಕೋನಗಳು
    let angles = { mercury: 0, venus: 0, earth: 0, mars: 0, jupiter: 0, saturn: 0, uranus: 0, neptune: 0 };

    // 6. ಅನಿಮೇಷನ್ ಲೂಪ್
    function animate() {
        requestAnimationFrame(animate);

        sun.rotation.y += 0.002;
        mercury.rotation.y += 0.01; venus.rotation.y += 0.008; earth.rotation.y += 0.01; mars.rotation.y += 0.01;
        jupiter.rotation.y += 0.015; saturn.rotation.y += 0.01; uranus.rotation.x += 0.01; neptune.rotation.y += 0.01;

        angles.mercury += 0.015;  mercury.position.x = Math.cos(angles.mercury) * 7;   mercury.position.z = Math.sin(angles.mercury) * 7;
        angles.venus   += 0.01;   venus.position.x   = Math.cos(angles.venus) * 11;    venus.position.z   = Math.sin(angles.venus) * 11;
        angles.earth   += 0.007;  earth.position.x   = Math.cos(angles.earth) * 15;    earth.position.z   = Math.sin(angles.earth) * 15;
        angles.mars    += 0.005;  mars.position.x    = Math.cos(angles.mars) * 20;     mars.position.z    = Math.sin(angles.mars) * 20;
        angles.jupiter += 0.0025; jupiter.position.x = Math.cos(angles.jupiter) * 26;  jupiter.position.z = Math.sin(angles.jupiter) * 26;
        angles.saturn  += 0.0015; saturn.position.x  = Math.cos(angles.saturn) * 33;   saturn.position.z  = Math.sin(angles.saturn) * 33;
        angles.uranus  += 0.0009; uranus.position.x  = Math.cos(angles.uranus) * 41;   uranus.position.z  = Math.sin(angles.uranus) * 41;
        angles.neptune += 0.0006; neptune.position.x = Math.cos(angles.neptune) * 48;  neptune.position.z = Math.sin(angles.neptune) * 48;

        controls.update();
        renderer.render(scene, camera);
    }
    animate();

    // 7. ಕನ್ನಡ ಮಾಹಿತಿ ಬ್ಯಾಂಕ್
    const planetData = {
        sun: { title: "☀️ ಸೂರ್ಯ (The Sun)", text: "ಸೌರಮಂಡಲದ ಕೇಂದ್ರ ಬಿಂದು. ಇದೊಂದು ಪ್ರಖರ ನಕ್ಷತ್ರವಾಗಿದ್ದು, ಇಡೀ ಸೌರಮಂಡಲಕ್ಕೆ ಬೆಳಕು ಮತ್ತು ಶಾಖ ನೀಡುತ್ತದೆ." },
        mercury: { title: "🟤 ಬುಧ ಗ್ರಹ (Mercury)", text: "ಸೂರ್ಯನಿಗೆ ಅತ್ಯಂತ ಹತ್ತಿರವಿರುವ ಮತ್ತು ಅತಿ ಸಣ್ಣ ಗ್ರಹ. ಇಲ್ಲಿ ವಾತಾವರಣವಿಲ್ಲ. ಇದಕ್ಕೆ ಯಾವುದೇ ಉಪಗ್ರಹಗಳಿಲ್ಲ." },
        venus: { title: "🟡 ಶುಕ್ರ ಗ್ರಹ (Venus)", text: "ಸೌರಮಂಡಲದ ಅತ್ಯಂತ ಪ್ರಕಾಶಮಾನವಾದ ಮತ್ತು ಕಾವಾದ (Hot) ಗ್ರಹ. ಇದನ್ನು ಬೆಳಗಿನ ನಕ್ಷತ್ರ ಎಂದೂ ಕರೆಯುತ್ತಾರೆ." },
        earth: { title: "🌍 ಭೂಮಿ (The Earth)", text: "ಜೀವಿಗಳು ಬದುಕಲು ಗಾಳಿ, ನೀರು ಇರುವ ಏಕೈಕ ಅದ್ಭುತ ಗ್ರಹ. ಬಾಹ್ಯಾಕಾಶದಿಂದ ಇದು ನೀಲಿಯಾಗಿ ಕಾಣುವುದರಿಂದ ಇದನ್ನು 'ನೀಲಿ ಗ್ರಹ' ಎನ್ನುತ್ತಾರೆ." },
        mars: { title: "🔴 ಮಂಗಳ ಗ್ರಹ (Mars)", text: "ಇದರ ಮೇಲ್ಮೈಯಲ್ಲಿ ಕಬ್ಬಿಣದ ಅಂಶ ಹೆಚ್ಚಿರುವುದರಿಂದ ಇದು ಕೆಂಪಾಗಿ ಕಾಣುತ್ತದೆ, ಆದ್ದರಿಂದ ಇದನ್ನು 'ಕೆಂಪು ಗ್ರಹ' ಎನ್ನುತ್ತಾರೆ." },
        jupiter: { title: "🟠 guru ಗ್ರಹ (Jupiter)", text: "ಸೌರಮಂಡಲದ ಅತಿ ದೊಡ್ಡ ದೈತ್ಯ ಗ್ರಹ. ಇದು ಎಷ್ಟು ದೊಡ್ಡದಾಗಿದೆಯೆಂದರೆ ಇದರಲ್ಲಿ ಸುಮಾರು 1300 ಭೂಮಿಗಳನ್ನು ಇಡಬಹುದು!" },
        saturn: { title: "🪐 ಶನಿ ಗ್ರಹ (Saturn)", text: "2ನೇ ಅತಿ ದೊಡ್ಡ ಗ್ರಹ. ಇದರ ಸುತ್ತಲಿರುವ ಧೂಳು ಮತ್ತು ಮಂಜುಗಡ್ಡೆಯಿಂದಾದ ಸುಂದರ ಬಳೆಗಳು (Rings) ಇದನ್ನು ಆಕರ್ಷಕವಾಗಿಸಿವೆ." },
        uranus: { title: "🔵 ಯುರೇನಸ್ ಗ್ರಹ (Uranus)", text: "ಅತ್ಯಂತ ತಂಪಾದ ಅನಿಲ ದೈತ್ಯ ಗ್ರಹವಾಗಿದ್ದು, ಹಸಿರು-ನೀಲಿ ಬಣ್ಣದಲ್ಲಿ ಕಾಣುತ್ತದೆ. ಇದನ್ನು ದೂರದರ್ಶಕದಿಂದ ಕಂಡುಹಿಡಿಯಲಾಯಿತು." },
        neptune: { title: "🔷 ನೆಪ್ಚೂನ್ ಗ್ರಹ (Neptune)", text: "ಸೂರ್ಯನಿಂದ ಅತ್ಯಂತ ದೂರದಲ್ಲಿರುವ 8ನೇ ಗ್ರಹ. ಸೂರ್ಯನನ್ನು ಒಂದು ಬಾರಿ ಸುತ್ತಿ ಬರಲು ಇದು ಬರೋಬ್ಬರಿ 165 ವರ್ಷಗಳನ್ನು ತೆಗೆದುಕೊಳ್ಳುತ್ತದೆ!" }
    };

    // 8. ಮ್ಯಾಜಿಕ್: ಗ್ರಹದ ಮೇಲಿನ ಕ್ಲಿಕ್ ಗುರುತಿಸುವ ತಂತ್ರ (Raycaster)
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    window.addEventListener('click', (event) => {
        // ಮೌಸ್ ಕ್ಲಿಕ್ ಮಾಡಿದ ಜಾಗದ ಲೆಕ್ಕಾಚಾರ
        mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

        raycaster.setFromCamera(mouse, camera);
        // ನಾವು ಕ್ಲಿಕ್ ಮಾಡಿದ ರೇಖೆ ಯಾವ ಗ್ರಹಕ್ಕೆ ತಗುಲುತ್ತದೆ ಎಂದು ನೋಡುವುದು
        const intersects = raycaster.intersectObjects(planetsList);

        if (intersects.length > 0) {
            const clickedPlanetId = intersects[0].object.userData.id;
            if (planetData[clickedPlanetId]) {
                document.getElementById("info-title").innerText = planetData[clickedPlanetId].title;
                document.getElementById("info-text").innerText = planetData[clickedPlanetId].text;
            }
        }
    });

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>

</body>
</html>
