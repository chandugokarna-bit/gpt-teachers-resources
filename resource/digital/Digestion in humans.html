<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class 7 Science Quiz - 35 Questions Master Edition</title>
    <style>
        :root {
            --bg-space: #090d16;
            --card-bg: #111c30;
            --panel-bg: rgba(21, 32, 54, 0.95);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-green: #4ade80;
            --accent-red: #f87171;
            --accent-yellow: #facc15;
            --border-glow: #38bdf8;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-space);
            color: var(--text-main);
            font-family: 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 50px;
        }

        header {
            text-align: center;
            padding: 25px 20px;
            width: 100%;
            background: linear-gradient(135deg, #131c31 0%, #090d16 100%);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            box-sizing: border-box;
        }

        h1 {
            margin: 0;
            font-size: 2rem;
            background: linear-gradient(90deg, #ff7a00, var(--accent-yellow), var(--accent-green));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 1rem;
            margin-top: 5px;
        }

        .quiz-container {
            width: 90%;
            max-width: 750px;
            margin-top: 30px;
        }

        .score-board {
            display: flex;
            justify-content: space-between;
            background: var(--card-bg);
            padding: 15px 25px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px solid #1e293b;
            font-weight: bold;
            font-size: 1.1rem;
        }

        .question-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            border: 2px solid #1e293b;
            transition: all 0.3s ease;
        }

        .question-text {
            font-size: 1.25rem;
            line-height: 1.6;
            margin-bottom: 25px;
            border-bottom: 1px solid #1e293b;
            padding-bottom: 15px;
        }

        .question-kan {
            color: var(--accent-yellow);
            display: block;
            margin-top: 8px;
            font-weight: 500;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            background: #0f172a;
            border: 2px solid #334155;
            color: var(--text-main);
            padding: 15px;
            border-radius: 12px;
            text-align: left;
            font-size: 1.05rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
        }

        .option-btn:hover:not([disabled]) {
            border-color: var(--border-glow);
            background: #1e293b;
            transform: translateX(5px);
        }

        .opt-kan {
            font-size: 1.05rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .option-btn.correct {
            background: rgba(74, 222, 128, 0.1);
            border-color: var(--accent-green);
        }
        .option-btn.correct .opt-kan { color: var(--accent-green); }

        .option-btn.wrong {
            background: rgba(248, 113, 113, 0.1);
            border-color: var(--accent-red);
        }
        .option-btn.wrong .opt-kan { color: var(--accent-red); }

        .explanation-box {
            margin-top: 25px;
            background: rgba(56, 189, 248, 0.05);
            border: 1px dashed var(--border-glow);
            border-radius: 12px;
            padding: 20px;
            display: none;
            line-height: 1.6;
        }

        .exp-title {
            font-weight: bold;
            color: var(--border-glow);
            margin-bottom: 6px;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
        }

        .exp-kan {
            color: #a78bfa;
            margin-top: 6px;
        }

        .next-btn {
            margin-top: 25px;
            background: var(--border-glow);
            color: #000;
            border: none;
            padding: 14px 30px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            display: none;
            text-align: center;
        }

        .next-btn:hover {
            opacity: 0.9;
        }
    </style>
</head>

<script>

            expKan: "ಆಹಾರವನ್ನು ದೇಹದ ಬಾಯಿಯೊಳಗೆ ತೆಗೆದುಕೊಳ್ಳುವ ಆರಂಭಿಕ ಹಂತಕ್ಕೆ 'ಆಹಾರ ಸೇವನೆ' (Ingestion) ಎಂದು ಹೆಸರು."

    let currentQuestionIdx = 0;
    let score = 0;

    function loadQuestion() {
        const qData = quizData[currentQuestionIdx];
        
        document.getElementById('current-q').innerText = currentQuestionIdx + 1;
        document.getElementById('current-score').innerText = score;

        document.getElementById('qText').childNodes[0].textContent = qData.engQ;
        document.getElementById('qTextKan').innerText = qData.kanQ;

        const optionsBlock = document.getElementById('optionsBlock');
        optionsBlock.innerHTML = '';
        
        document.getElementById('explanationBlock').style.display = 'none';
        document.getElementById('nextBtn').style.display = 'none';

        qData.options.forEach((opt, idx) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerHTML = `${opt.eng} <span class="opt-kan">${opt.kan}</span>`;
            btn.onclick = () => checkAnswer(idx, btn);
            optionsBlock.appendChild(btn);
        });

        document.getElementById('quizCard').style.borderColor = "#1e293b";
        document.getElementById('quizCard').style.boxShadow = "0 10px 30px rgba(0,0,0,0.4)";
    }

    function checkAnswer(selectedIdx, clickedBtn) {
        const qData = quizData[currentQuestionIdx];
        const allButtons = document.querySelectorAll('.option-btn');

        allButtons.forEach(btn => btn.disabled = true);

        if (selectedIdx === qData.correct) {
            clickedBtn.classList.add('correct');
            score++;
            document.getElementById('current-score').innerText = score;
            document.getElementById('quizCard').style.borderColor = "var(--accent-green)";
        } else {
            clickedBtn.classList.add('wrong');
            allButtons[qData.correct].classList.add('correct');
            document.getElementById('quizCard').style.borderColor = "var(--accent-red)";
        }

        document.getElementById('expEng').innerText = qData.expEng;
        document.getElementById('expKan').innerText = qData.expKan;
        document.getElementById('explanationBlock').style.display = 'block';
        
        document.getElementById('nextBtn').style.display = 'block';
    }

    function nextQuestion() {
        currentQuestionIdx++;
        if (currentQuestionIdx < quizData.length) {
            loadQuestion();
        } else {
            const container = document.getElementById('quizCard');
            let rating = score > 30 ? "👑 ಜೀರ್ಣಾಂಗ ತಜ್ಞ! (Master Specialist)" : "👍 ಉತ್ತಮ ಪ್ರಯತ್ನ! (Great Effort)";
            container.innerHTML = `
                <div style="text-align: center; padding: 20px;">
                    <h2 style="color: var(--accent-yellow); font-size: 2rem; margin-bottom: 10px;">🎉 ರಸಪ್ರಶ್ನೆ ಮುಕ್ತಾಯವಾಯಿತು!</h2>
                    <p style="font-size: 1.4rem; margin: 15px 0;">ನಿಮ್ಮ ಒಟ್ಟು ಅಂಕಗಳು: <span style="color:var(--accent-green); font-weight:bold;">${score}</span> / ${quizData.length}</p>
                    <div style="font-size:1.2rem; background:#1e293b; padding:12px; border-radius:8px; display:inline-block; margin-bottom:20px; color:var(--border-glow); font-weight:bold;">${rating}</div>
                    <button class="next-btn" style="display:block; margin-top:10px;" onclick="location.reload()">ಮತ್ತೆ ಆಟವಾಡಿ (Restart Master Quiz)</button>
                </div>
            `;
        }
    }

    loadQuestion();
</script>

</body>
</html>
