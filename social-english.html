<!DOCTYPE html>
<html lang="kn">
<head>
<meta charset="UTF-8">
<title>PDF ಸಂಪನ್ಮೂಲಗಳು</title>

<style>
body{
  font-family: Arial, sans-serif;
  background:#f5f5f5;
  padding:15px;
}
h2{
  background:#ff7043;
  color:#fff;
  padding:10px;
  border-radius:6px;
}
.lesson{
  background:#ffffff;
  margin:8px 0;
  padding:12px;
  border-left:6px solid #ff9800;
  cursor:pointer;
  font-weight:bold;
  border-radius:6px;
}
.section{
  display:none;
  margin-left:20px;
}
.subject{
  background:#fff3e0;
  margin:6px 0;
  padding:10px;
  border-radius:6px;
  cursor:pointer;
}
.pdf{
  display:block;
  margin:5px 0 5px 20px;
  background:#e8f5e9;
  padding:8px 12px;
  border-radius:6px;
  text-decoration:none;
  color:#2e7d32;
}
.pdf:hover{
  background:#c8e6c9;
}
</style>

<script>
function toggle(id){
  const el = document.getElementById(id);
  el.style.display = (el.style.display==="block") ? "none" : "block";
}
</script>
</head>

<body>

<h2>📄 PDF ಸಂಪನ್ಮೂಲಗಳು</h2>

<!-- ===== 6ನೇ ತರಗತಿ ===== -->
<div class="lesson" onclick="toggle('pdf6')">6ನೇ ತರಗತಿ</div>
<div class="section" id="pdf6">
