<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Resources</title>

<style>

body{
  font-family: Arial;
  margin:0;
  padding:0;
}

.container{
  display:flex;
}

.lesson-list{
  width:40%;
  height:90vh;
  overflow-y:scroll;
  border-right:2px solid #ccc;
  padding:10px;
  list-style:none;
}

.lesson-list li{
  cursor:pointer;
  padding:8px;
  margin-bottom:4px;
}

.lesson-list li:hover{
  background:#f0f0f0;
}

#lessonContent{
  width:60%;
  padding:20px;
}

a{
  text-decoration:none;
  color:blue;
}

</style>

</head>

<body>

<h2 style="padding-left:10px;">📚 Lessons</h2>

<div class="container">

<ul class="lesson-list">

<h3>6th Std</h3>

<li onclick="openLesson('6-1')">1 Introduction to History</li>
<li onclick="openLesson('6-2')">2 India - Our Pride</li>
<li onclick="openLesson('6-3')">3 Karnataka</li>

<h3>7th Std</h3>

<li onclick="openLesson('7-1')">1 World Developments</li>

<h3>8th Std</h3>

<li onclick="openLesson('8-1')">1 Sources</li>

</ul>

<div id="lessonContent">
👉 Click lesson to view resources
</div>

</div>

<script>

const resources = {

"6-1": {
title: "Introduction to History",

ppt: [

"https://docs.google.com/presentation/d/19cuE8eQgIqUK3X7wrhon3cJGOpucMJW6/preview",

"https://docs.google.com/presentation/d/1j1aYeW9Tpx3AGK_Djdzp9wX7YzZGe1dP/preview"

]

},

"6-2": {
title: "India Our Pride",

ppt: [

"https://docs.google.com/presentation/d/1tkBn2TfgD58hwIn53k64E53DQuQkZ_3ffY0vheVR4F8/preview"

]

},

"6-3": {
title: "Karnataka",

ppt: [

"https://docs.google.com/presentation/d/1jE-tbl2pet35lbuekrHmLfgDtbO-KIlkLwsLOkhN1n8/preview",

"https://docs.google.com/presentation/d/1isxTGLH3XmjXUj8n2_PfSM22fqws-C5KP2LoTDtc32Y/preview",

"https://docs.google.com/presentation/d/1wActzsHpw3v2MIxO7bOnic16QwL6q4x4PUFhvUyCTQE/preview",

"https://docs.google.com/presentation/d/1BLbei7EMVSxEMD283fgwHaqrTXplXNSsRVMSF0YftjE/preview"

]

},

"7-1": {
title: "World Developments",

ppt: []

},

"8-1": {
title: "Sources",

ppt: []

}

};

function openLesson(id){

let lesson = resources[id];

let html = `<h2>${lesson.title}</h2>`;

if(lesson.ppt && lesson.ppt.length > 0){

lesson.ppt.forEach((link,index)=>{

html += `
<p>
📘 <a href="${link}" target="_blank">
Open PPT ${index + 1}
</a>
</p>
`;

});

}else{

html += `
<p>📄 Coming Soon</p>
`;

}

document.getElementById("lessonContent").innerHTML = html;

}

</script>

</body>
</html>
