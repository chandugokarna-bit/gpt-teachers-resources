  <style>
    /* ಮೂಲ ವಿನ್ಯಾಸ */
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;

    /* ಮುಖ್ಯ ಬ್ರಾಂಡ್ ಹೆಡರ್ */
    .top-brand-header {

    .top-brand-header img {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .top-brand-header h1 {
      margin: 0;
      font-size: 22px;
      color: #0056b3;
    }

    /* ಪ್ರಮುಖ ಮೇನ್ ಬಾರ್ (Top Navbar) */
    .navbar {
      background-color: #f3e5ab;
      display: flex;
      justify-content: space-around;
      flex-wrap: wrap;
      padding: 12px;
      border-bottom: 4px solid #0056b3;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .navbar a {
      text-decoration: none;
      color: #111;
      font-weight: bold;
      font-size: 15px;
      padding: 6px 12px;
      transition: 0.3s;
    }

    .navbar a:hover {
      color: #ff4500;
      background-color: rgba(255,255,255,0.6);
      border-radius: 4px;
    }

    /* ಡಿಜಿಟಲ್ ಕ್ಲಾಸ್‌ರೂಮ್ ಪ್ರಮುಖ ಕಂಟೇನರ್ */
    .classroom-container {
      max-width: 1000px;
      margin: 25px auto;
      background-color: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      border: 2px solid #007bff;
      overflow: hidden;
      padding: 20px;
    }

    .classroom-header {
      text-align: center;
      background: linear-gradient(135deg, #007bff, #00c6ff);
      color: white;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    .classroom-header h2 {
      margin: 0 0 10px 0;
      font-size: 26px;
    }

    .classroom-header p {
      margin: 0;
      font-size: 16px;
      opacity: 0.9;
    }

    /* 🎮 ಇಂಟರಾಕ್ಟಿವ್ ಆಕ್ಟಿವಿಟಿ ಪ್ಲೇ ಆಗುವ ಜಾಗ (Iframe Area) */
    .activity-frame-wrapper {
      position: relative;
      width: 100%;
      height: 600px; /* ಆಕ್ಟಿವಿಟಿ ಗಾತ್ರಕ್ಕೆ ತಕ್ಕಂತೆ ಇದನ್ನು ಹೆಚ್ಚು-ಕಡಿಮೆ ಮಾಡಬಹುದು */
      border: 3px dashed #ff4500;
      border-radius: 8px;
      background-color: #fff9f5;
    }

    .activity-frame-wrapper iframe {
      width: 100%;
      height: 100%;
      border: none;
      border-radius: 5px;
    }

    /* ಫುಟರ್ */
    .footer {
      background-color: #222;
      color: white;
      text-align: center;
      padding: 15px;
      margin-top: 40px;
      font-size: 14px;
    }

    /* ಮೊಬೈಲ್‌ಗಾಗಿ ಹೊಂದಾಣಿಕೆ */
    @media (max-width: 768px) {
      .classroom-container { margin: 10px; padding: 10px; }

      .classroom-header h2 { font-size: 20px; }
