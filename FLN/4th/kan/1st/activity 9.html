<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ಆಕ್ಟಿವಿಟಿ 9 - ಶೀರ್ಷಿಕೆ ನೀಡಿ</title>
    <link href="https://fonts.googleapis.com/css2?family=Tiro+Kannada&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #d97706, #b45309); color: #fff; font-family: 'Poppins', 'Tiro Kannada', serif; padding: 20px; display: flex; justify-content: center; }
        .card { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.2); border-radius: 20px; padding: 25px; max-width: 650px; width: 100%; text-align: center; }
        h2 { color: #fef08a; margin-bottom: 15px; }
        .passage { background: rgba(0,0,0,0.3); padding: 15px; border-left: 4px solid #fef08a; border-radius: 10px; font-size: 1.1rem; text-align: left; margin-bottom: 20px; line-height: 1.6; }
        .options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        button { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 12px; border-radius: 12px; font-size: 1rem; cursor: pointer; }
        button:hover { background: #fef08a; color: #000; font-weight: bold; }
    </style>
</head>
<body>
<div class="card">
    <h2>🏷️ ಆಕ್ಟಿವಿಟಿ 9: ಸೂಕ್ತ ಶೀರ್ಷಿಕೆ ನೀಡಿ</h2>
    <div style="margin-bottom:15px">ಪ್ರಶ್ನೆ: <span id="q-no">1</span>/7</div>
    <div class="passage" id="passage"></div>
    <div class="options" id="options"></div>
</div>
<script>
const data = [
    { p: "ಇರುವೆಗಳು ಸದಾ ಕೆಲಸ ಮಾಡುತ್ತಿರುತ್ತವೆ. ಅವು ತಮ್ಮ ತೂಕಕ್ಕಿಂತ ಹೆಚ್ಚಿನ ಭಾರವನ್ನು ಹೊರಬಲ್ಲವು. ಅವು ಆಹಾರವನ್ನು ಶೇಖರಿಸಿ ಇಡುತ್ತವೆ.", q: "ಈ ಪ್ಯಾರಾಗ್ರಾಫ್‌ಗೆ ಸೂಕ್ತ ಶೀರ್ಷಿಕೆ ಯಾವುದು?", opts: ["ಇರುವೆಗಳ ಶ್ರಮಜೀವನ", "ಆಕಾಶದ ಪಕ್ಷಿಗಳು", "ಆನೆಯ ಬಲ", "ಕಾಡಿನ ಪ್ರಾಣಿಗಳು"], ans: "ಇರುವೆಗಳ ಶ್ರಮಜೀವನ" },
    { p: "ಬೆಳಿಗ್ಗೆ ಯೋಗ ಮಾಡುವುದರಿಂದ ದೇಹ ಸುದೃಢವಾಗುತ್ತದೆ. ಮನಸ್ಸಿಗೆ ಶಾಂತಿ ಸಿಗುತ್ತದೆ. ದಿನವಿಡೀ ಉತ್ಸಾಹ ಇರುತ್ತದೆ.", q: "ಉತ್ತಮ ಶೀರ್ಷಿಕೆಯನ್ನು ಆಯ್ಕೆ ಮಾಡಿ:", opts: ["ಯೋಗದ ಉಪಯೋಗಗಳು", "ರಾತ್ರಿಯ ಉಟ", "ಆಟದ ಮೈದಾನ", "ಟಿವಿ ವೀಕ್ಷಣೆ"], ans: "ಯೋಗದ ಉಪಯೋಗಗಳು" },
    { p: "ನಮ್ಮ ಸುತ್ತಮುತ್ತಲಿನ ಜಾಗವನ್ನು ಸ್ವಚ್ಛವಾಗಿಡಬೇಕು. ಕಸವನ್ನು ಕಸದ ಬುಟ್ಟಿಗೆ ಹಾಕಬೇಕು. ಇದರಿಂದ ರೋಗಗಳು ಬರುವುದಿಲ್ಲ.", q: "ಸೂಕ್ತ ಶೀರ್ಷಿಕೆ ಯಾವುದು?", opts: ["ಪರಿಸರ ನೈರ್ಮಲ್ಯ", "ಮಳೆಯ ಆಗಮನ", "ಹಬ್ಬಗಳ ಸಂಭ್ರಮ", "ಶಾಲಾ ಆಟಗಳು"], ans: "ಪರಿಸರ ನೈರ್ಮಲ್ಯ" },
    { p: "ಒಬ್ಬ ಬಡ ರೈತ ತನ್ನ ಎತ್ತುಗಳೊಂದಿಗೆ ಬೆಳಿಗ್ಗೆಯೇ ಹೊಲಕ್ಕೆ ತೆರಳಿದನು. ಇಡೀ ದಿನ ಬೆವರು ಹರಿಸಿ ಕೆಲಸ ಮಾಡಿದನು.", q: "ಯಾವ ಶೀರ್ಷಿಕೆ ಸೂಕ್ತ?", opts: ["ರೈತನ ಕಾಯಕ", "ನಗರದ ಜೀವನ", "ಸಂತೆಯ ಸಂಭ್ರಮ", "ಬಸ್ಸಿನ ಪ್ರಯಾಣ"], ans: "ರೈತನ ಕಾಯಕ" },
    { p: "ಸಣ್ಣ ಹಕ್ಕಿಯೊಂದು ಗೂಡು ಕಟ್ಟಲು ಹುಲ್ಲು ಕಡ್ಡಿಗಳನ್ನು ತರುತ್ತಿತ್ತು. ಕಷ್ಟಪಟ್ಟು ಸುಂದರವಾದ ಮನೆ ನಿರ್ಮಿಸಿತು.", q: "ಇದಕ್ಕೆ ಹೊಂದುವ ಶೀರ್ಷಿಕೆ:", opts: ["ಹಕ್ಕಿಯ ಗೂಡು ನಿರ್ಮಾಣ", "ಕಾಡಿನ ಬೆಂಕಿ", "ಮಳೆಯ ಅಬ್ಬರ", "ಮೀನಿನ ಈಜು"], ans: "ಹಕ್ಕಿಯ ಗೂಡು ನಿರ್ಮಾಣ" },
    { p: "ನಾವು ಹಿರಿಯರಿಗೆ ಹಾಗೂ ಶಿಕ್ಷಕರಿಗೆ ಗೌರವ ನೀಡಬೇಕು. ಅವರ ಮಾತನ್ನು ಆಲಿಸಬೇಕು.", q: "ಸೂಕ್ತ ಶೀರ್ಷಿಕೆ ಆಯ್ಕೆಮಾಡಿ:", opts: ["ಸನ್ಮಾರ್ಗ ಮತ್ತು ಶಿಸ್ತು", "ಸಂತೆ ಯಲ್ಲಿ ಖರೀದಿ", "ಆಟಿಕೆಗಳ ಪ್ರದರ್ಶನ", "ಚಿತ್ರರಚನೆ"], ans: "ಸನ್ಮಾರ್ಗ ಮತ್ತು ಶಿಸ್ತು" },
    { p: "ಆಗಸದಲ್ಲಿ ರಂಗುರಂಗಿನ ಕಾಮನಬಿಲ್ಲು ಮೂಡಿತು. ಏಳು ಬಣ್ಣಗಳು ನೋಡುಗರ ಕಣ್ಣು ತಣಿಸಿದವು.", q: "ಇದರ ಶೀರ್ಷಿಕೆ ಏನು?", opts: ["ಸುಂದರ ಕಾಮನಬಿಲ್ಲು", "ರಾತ್ರಿಯ ಚಂದ್ರ", "ಕಪ್ಪು ಮೋಡಗಳು", "ಬಿಸಿಲ ಬೇಗೆ"], ans: "ಸುಂದರ ಕಾಮನಬಿಲ್ಲು" }
];
let idx = 0;
function loadQuestion() {
    document.getElementById('q-no').innerText = idx + 1;
    document.getElementById('passage').innerText = data[idx].p + "\n\n" + data[idx].q;
    const optsDiv = document.getElementById('options');
    optsDiv.innerHTML = '';
    data[idx].opts.forEach(o => {
        const btn = document.createElement('button');
        btn.innerText = o;
        btn.onclick = () => {
            if(o === data[idx].ans) alert("ಅತ್ಯುತ್ತಮ ಶೀರ್ಷಿಕೆ! ⭐");
            else alert("ತಪ್ಪು! ಬೇರೆ ಶೀರ್ಷಿಕೆ ಪ್ರಯತ್ನಿಸಿ.");
            idx++; if(idx < data.length) loadQuestion(); else alert("ಆಕ್ಟಿವಿಟಿ ಮುಗಿಯಿತು!");
        };
        optsDiv.appendChild(btn);
    });
}
loadQuestion();
</script>
</body>
</html>
