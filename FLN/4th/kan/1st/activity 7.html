<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ಆಕ್ಟಿವಿಟಿ 7 - ಖಾಲಿ ಜಾಗ ತುಂಬಿ</title>
    <link href="https://fonts.googleapis.com/css2?family=Tiro+Kannada&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #0284c7, #0369a1); color: #fff; font-family: 'Poppins', 'Tiro Kannada', serif; padding: 20px; display: flex; justify-content: center; }
        .card { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.2); border-radius: 20px; padding: 25px; max-width: 650px; width: 100%; text-align: center; }
        h2 { color: #38bdf8; margin-bottom: 15px; }
        .passage { background: rgba(0,0,0,0.3); padding: 15px; border-left: 4px solid #38bdf8; border-radius: 10px; font-size: 1.15rem; text-align: left; margin-bottom: 20px; line-height: 1.6; }
        .options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        button { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 12px; border-radius: 12px; font-size: 1rem; cursor: pointer; }
        button:hover { background: #38bdf8; color: #000; font-weight: bold; }
    </style>
</head>
<body>
<div class="card">
    <h2>✏️ ಆಕ್ಟಿವಿಟಿ 7: ಖಾಲಿ ಜಾಗ ತುಂಬಿ</h2>
    <div style="margin-bottom:15px">ಪ್ರಶ್ನೆ: <span id="q-no">1</span>/7</div>
    <div class="passage" id="passage"></div>
    <div class="options" id="options"></div>
</div>
<script>
const data = [
    { p: "ಬೇಸಿಗೆಯ ದಿನಗಳಲ್ಲಿ ಬಿಸಿಲು ಹೆಚ್ಚಾಗಿರುತ್ತದೆ, ಆದ್ದರಿಂದ ನಾವು _____ ನೀರನ್ನು ಕುಡಿಯಬೇಕು.", opts: ["ಹೆಚ್ಚು", "ಕಡಿಮೆ", "ಬಿಸಿ", "ಉಪ್ಪು"], ans: "ಹೆಚ್ಚು" },
    { p: "ಆಕಾಶದಲ್ಲಿ ಕಪ್ಪು ಮೋಡಗಳು ಕವಿದಾಗ _____ ಬರುವ ಸೂಚನೆ ಸಿಗುತ್ತದೆ.", opts: ["ಬಿಸಿಲು", "ಮಳೆ", "ಚಳಿ", "ಗಾಳಿ"], ans: "ಮಳೆ" },
    { p: "ಮಕ್ಕಳು ಪ್ರತಿದಿನ ಶಾಲೆಗೆ ಹೋಗಿ ಹೊಸ ಜ್ಞಾನವನ್ನು _____ ಬೇಕು.", opts: ["ಗಳಿಸ", "ಮರೆಯ", "ನಾಶಪಡಿಸ", "ಚೆಲ್ಲ"], ans: "ಗಳಿಸ" },
    { p: "ರೈತನು ಹೊಲದಲ್ಲಿ ಶ್ರಮಪಟ್ಟು _____ ಬೆಳೆಯುತ್ತಾನೆ.", opts: ["ಆಹಾರ/ಬೆಳೆ", "ಕಲ್ಲು", "ಪ್ಲಾಸ್ಟಿಕ್", "ಕಾಡು"], ans: "ಆಹಾರ/ಬೆಳೆ" },
    { p: "ಆಟವಾಡುವುದರಿಂದ ನಮ್ಮ ശരീര ಮತ್ತು ಮನಸ್ಸು _____ ಇರುತ್ತದೆ.", opts: ["ಆರೋಗ್ಯವಾಗಿ", "ಆಲಸ್ಯವಾಗಿ", "ಖಾಯಿಲೆಯಿಂದ", "ನೋವಿನಿಂದ"], ans: "ಆರೋಗ್ಯವಾಗಿ" },
    { p: "ಸತ್ಯವನ್ನು ಮಾತ್ರ பேசுುವುದು ಒಳ್ಳೆಯ _____ ಆಗಿದೆ.", opts: ["ಗುಣ", "ದೋಷ", "ಖಾಯಿಲೆ", "ಕೆಟ್ಟತನ"], ans: "ಗುಣ" },
    { p: "ಗಿಡಮರಗಳನ್ನು ಬೆಳೆಸುವುದರಿಂದ ಪರಿಸರ _____ ಆಗುತ್ತದೆ.", opts: ["ಸೌಂದರ್ಯ/ಹಸಿರು", "ನಾಶ", "ಕತ್ತಲು", "ಬಿಸಿಲು"], ans: "ಸೌಂದರ್ಯ/ಹಸಿರು" }
];
let idx = 0;
function loadQuestion() {
    document.getElementById('q-no').innerText = idx + 1;
    document.getElementById('passage').innerText = data[idx].p;
    const optsDiv = document.getElementById('options');
    optsDiv.innerHTML = '';
    data[idx].opts.forEach(o => {
        const btn = document.createElement('button');
        btn.innerText = o;
        btn.onclick = () => {
            if(o === data[idx].ans) alert("ಸರಿಯಾದ ಪದ! ✨");
            else alert("ತಪ್ಪು! ಸೂಕ್ತವಾದ ಪದ ಆಯ್ಕೆ ಮಾಡಿ.");
            idx++; if(idx < data.length) loadQuestion(); else alert("ಆಕ್ಟಿವಿಟಿ ಮುಗಿಯಿತು!");
        };
        optsDiv.appendChild(btn);
    });
}
loadQuestion();
</script>
</body>
</html>
