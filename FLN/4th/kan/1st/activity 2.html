<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ಆಕ್ಟಿವಿಟಿ 2 - ಮುಖ್ಯ ಭಾವನೆ ಪತ್ತೆ</title>
    <link href="https://fonts.googleapis.com/css2?family=Tiro+Kannada&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #311042, #701a75); color: #fff; font-family: 'Poppins', 'Tiro Kannada', serif; padding: 20px; display: flex; justify-content: center; }
        .card { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.2); border-radius: 20px; padding: 25px; max-width: 650px; width: 100%; text-align: center; }
        h2 { color: #fde047; margin-bottom: 15px; }
        .passage { background: rgba(0,0,0,0.3); padding: 15px; border-left: 4px solid #f43f5e; border-radius: 10px; font-size: 1.1rem; text-align: left; margin-bottom: 20px; line-height: 1.6; }
        .options { display: flex; flex-direction: column; gap: 10px; }
        button { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 12px; border-radius: 12px; font-size: 1rem; cursor: pointer; text-align: left; }
        button:hover { background: #f43f5e; color: #fff; }
    </style>
</head>
<body>
<div class="card">
    <h2>🎯 ಆಕ್ಟಿವಿಟಿ 2: ಮುಖ್ಯ ಭಾವನೆ ಪತ್ತೆ</h2>
    <div style="margin-bottom:15px">ಪ್ರಶ್ನೆ: <span id="q-no">1</span>/7</div>
    <div class="passage" id="passage"></div>
    <div class="options" id="options"></div>
</div>
<script>
const data = [
    { p: "ಸೋಮು ಪ್ರತಿದಿನ ಬೆಳಿಗ್ಗೆ ಬೇಗ ಏಳುತ್ತಾನೆ. ಹಲ್ಲುಜ್ಜಿ, ಸ್ನಾನ ಮಾಡಿ ಶಾಲೆಗೆ ಸಿದ್ಧನಾಗುತ್ತಾನೆ. ಸಮಯಕ್ಕೆ ಸರಿಯಾಗಿ ಶಾಲೆಗೆ ತಲುಪುತ್ತಾನೆ.", q: "ಈ ಪ್ಯಾರಾಗ್ರಾಫ್‌ನ ಮುಖ್ಯ ವಿಷಯವೇನು?", opts: ["ಸೋಮು ಶಾಲೆಗೆ ತಡವಾಗಿ ಹೋಗುವುದು", "ಸೋಮು ಒಬ್ಬ ಶಿಸ್ತಿನ ಹುಡುಗ", "ಸೋಮು ಆಟವಾಡುವುದು", "ಸೋಮು ನಿದ್ರೆ ಮಾಡುವುದು"], ans: "ಸೋಮು ಒಬ್ಬ ಶಿಸ್ತಿನ ಹುಡುಗ" },
    { p: "ಗಿಡಗಳಿಗೆ ಪ್ರತಿದಿನ ನೀರು ಹಾಕಬೇಕು. ಅವುಗಳಿಗೆ ಸೂರ್ಯನ ಬೆಳಕು ಬೇಕು. ಸರಿಯಾದ ಪೋಷಣೆ ಸಿಕ್ಕರೆ ಗಿಡಗಳು ಚೆನ್ನಾಗಿ ಬೆಳೆದು ಹೂವು ನೀಡುತ್ತವೆ.", q: "ಈ ಸಾಲುಗಳ ಮುಖ್ಯ ಉದ್ದೇಶವೇನು?", opts: ["ಗಿಡಗಳ ಪಾಲನೆ ಮತ್ತು ಆರೈಕೆ", "ಹೂವುಗಳನ್ನು ಕೀಳುವುದು", "ಮಳೆ ಬರುವುದು", "ಸೂರ್ಯನ ಶಾಖ"], ans: "ಗಿಡಗಳ ಪಾಲನೆ ಮತ್ತು ಆರೈಕೆ" },
    { p: "ಆಹಾರ ಸೇವಿಸುವ ಮುನ್ನ ಕೈಗಳನ್ನು ಸೋಪಿನಿಂದ ತೊಳೆಯಬೇಕು. ಸ್ವಚ್ಛತೆ ಇಲ್ಲದಿದ್ದರೆ ಕಾಯಿಲೆಗಳು ಬರುತ್ತವೆ. ಆರೋಗ್ಯವೇ ಭಾಗ್ಯ.", q: "ಈ ಪ್ಯಾರಾಗ್ರಾಫ್ ನೀಡುವ ಮುಖ್ಯ ಸಂದೇಶವೇನು?", opts: ["ಆಹಾರ ಪೋಲು ಮಾಡುವುದು", "ಶುಚಿತ್ವ ಮತ್ತು ಆರೋಗ್ಯದ ಮಹತ್ವ", "ಸೋಪು ತಯಾರಿಕೆ", "ರೋಗಗಳ ವಿಧಗಳು"], ans: "ಶುಚಿತ್ವ ಮತ್ತು ಆರೋಗ್ಯದ ಮಹತ್ವ" },
    { p: "ನಮ್ಮ ಶಾಲೆಯ ಗ್ರಂಥಾಲಯದಲ್ಲಿ ಸಾವಿರಾರು ಪುಸ್ತಕಗಳಿವೆ. ಅಲ್ಲಿ ಶಾಂತಿಯಿಂದ ಕುಳಿತು ಓದಬೇಕು. ಪುಸ್ತಕಗಳು ನಮ್ಮ ಅತ್ಯುತ್ತಮ ಸ್ನೇಹಿತರು.", q: "ಈ ಸಾಲುಗಳು ಯಾವುದರ ಬಗ್ಗೆ ಹೇಳುತ್ತವೆ?", opts: ["ಗ್ರಂಥಾಲಯದ ಉಪಯೋಗ", "ಕ್ರೀಡಾಂಗಣದ ನಿಯಮಗಳು", "ತರಗತಿಯ ಗಲಾಟೆ", "ಪರೀಕ್ಷೆಯ ದಿನಗಳು"], ans: "ಗ್ರಂಥಾಲಯದ ಉಪಯೋಗ" },
    { p: "ನೀರು ಜೀವಕೋಟಿಗೆ ತೀರಾ ಅಗತ್ಯ. ನೀರನ್ನು ಅನಗತ್ಯವಾಗಿ ಪೋಲು ಮಾಡಬಾರದು. ಹನಿ ನೀರೂ ಅತ್ಯಮೂಲ್ಯ.", q: "ಇದರ ಮೂಲ ಉದ್ದೇಶವೇನು?", opts: ["ನೀರಿನ ಸಂರಕ್ಷಣೆ", "ನದಿಗಳ ಹರಿವು", "ಮಳೆಯ ಪ್ರಮಾಣ", "ಈಜುವುದನ್ನು ಕಲಿಯುವುದು"], ans: "ನೀರಿನ ಸಂರಕ್ಷಣೆ" },
    { p: "ಸಾರಿಗೆ ನಿಯಮಗಳನ್ನು ಪ್ರತಿಯೊಬ್ಬರೂ ಪಾಲಿಸಬೇಕು. ರಸ್ತೆ ದಾಟುವಾಗ ಝೀಬ್ರಾ ಕ್ರಾಸಿಂಗ್ ಬಳಸಬೇಕು. ಇದು ನಮ್ಮ ಸುರಕ್ಷತೆಗೆ ಒಳ್ಳೆಯದು.", q: "ಈ ಪ್ಯಾರಾಗ್ರಾಫ್‌ನ ಪ್ರಮುಖ ವಿಷಯವೇನು?", opts: ["ರಸ್ತೆ ಸುರಕ್ಷತೆ ಮತ್ತು ನಿಯಮಗಳು", "ವಾಹನ ಖರೀದಿ", "ವೇಗವಾಗಿ ಚಾಲನೆ ಮಾಡುವುದು", "ರಸ್ತೆ ನಿರ್ಮಾಣ"], ans: "ರಸ್ತೆ ಸುರಕ್ಷತೆ ಮತ್ತು ನಿಯಮಗಳು" },
    { p: "ಪಕ್ಷಿಗಳು ಆಕಾಶದಲ್ಲಿ ಮುಕ್ತವಾಗಿ ಹಾರುತ್ತವೆ. ಅವು ಕಾಡಿನಲ್ಲಿ ಮರಗಳ ಮೇಲೆ ಗೂಡು ಕಟ್ಟಿ ಜೀವಿಸುತ್ತವೆ. ಅವುಗಳನ್ನು ಪಂಜರದಲ್ಲಿ ಬಂಧಿಸಬಾರದು.", q: "ಈ ಸಾಲುಗಳ ಅರ್ಥವೇನು?", opts: ["ಪಕ್ಷಿಗಳ ಸ್ವತಂತ್ರ ಜೀವನದ ಹಕ್ಕು", "ಪಂಜರಗಳ ತಯಾರಿ", "ಪಕ್ಷಿಗಳ ಬೇಟೆ", "ಆಕಾಶದ ಬಣ್ಣ"], ans: "ಪಕ್ಷಿಗಳ ಸ್ವತಂತ್ರ ಜೀವನದ ಹಕ್ಕು" }
];
let idx = 0;
function loadQuestion() {
    document.getElementById('q-no').innerText = idx + 1;
    document.getElementById('passage').innerText = data[idx].p + "\n\nಪ್ರಶ್ನೆ: " + data[idx].q;
    const optsDiv = document.getElementById('options');
    optsDiv.innerHTML = '';
    data[idx].opts.forEach(o => {
        const btn = document.createElement('button');
        btn.innerText = o;
        btn.onclick = () => {
            if(o === data[idx].ans) alert("ಸಾಧನೆ! ಸರಿಯಾದ ಉತ್ತರ 👍");
            else alert("ತಪ್ಪು ಉತ್ತರ! ಮತ್ತೆ ಪ್ರಯತ್ನಿಸಿ.");
            idx++; if(idx < data.length) loadQuestion(); else alert("ಅಭಿನಂದನೆಗಳು! ಆಕ್ಟಿವಿಟಿ ಪೂರ್ಣಗೊಂಡಿದೆ.");
        };
        optsDiv.appendChild(btn);
    });
}
loadQuestion();
</script>
</body>
</html>
