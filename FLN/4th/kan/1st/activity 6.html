<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ಆಕ್ಟಿವಿಟಿ 6 - ಅನುಕ್ರಮ ಜೋಡಣೆ</title>
    <link href="https://fonts.googleapis.com/css2?family=Tiro+Kannada&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #4c1d95, #581c87); color: #fff; font-family: 'Poppins', 'Tiro Kannada', serif; padding: 20px; display: flex; justify-content: center; }
        .card { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.2); border-radius: 20px; padding: 25px; max-width: 650px; width: 100%; text-align: center; }
        h2 { color: #c084fc; margin-bottom: 15px; }
        .passage { background: rgba(0,0,0,0.3); padding: 15px; border-left: 4px solid #c084fc; border-radius: 10px; font-size: 1.1rem; text-align: left; margin-bottom: 20px; line-height: 1.6; }
        .options { display: flex; flex-direction: column; gap: 10px; }
        button { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 12px; border-radius: 12px; font-size: 1rem; cursor: pointer; text-align: left; }
        button:hover { background: #c084fc; color: #000; font-weight: bold; }
    </style>
</head>
<body>
<div class="card">
    <h2>🧩 ಆಕ್ಟಿವಿಟಿ 6: ಕಥೆಯ ಅನುಕ್ರಮ ಜೋಡಣೆ</h2>
    <div style="margin-bottom:15px">ಪ್ರಶ್ನೆ: <span id="q-no">1</span>/7</div>
    <div class="passage" id="passage"></div>
    <div class="options" id="options"></div>
</div>
<script>
const data = [
    { p: "A. ಸೀಜನ್ ಪ್ರಕಾರ ಮರದಲ್ಲಿ ಹಣ್ಣುಗಳು ಬೆಳೆದವು.\nB. ಬೀಜವನ್ನು ಮಣ್ಣಿನಲ್ಲಿ ನೆಡಲಾಯಿತು.\nC. ಗಿಡ ದೊಡ್ಡದಾಗಿ ಮರ ಆಯಿತು.\nD. ನೀರು ಮತ್ತು ಗೊಬ್ಬರ ಹಾಕಲಾಯಿತು.", q: "ಸರಿಯಾದ ಅನುಕ್ರಮ ಯಾವುದು?", opts: ["B -> D -> C -> A", "A -> B -> C -> D", "D -> C -> A -> B", "C -> A -> B -> D"], ans: "B -> D -> C -> A" },
    { p: "A. ತಿಂಡಿ ತಿಂದನು.\nB. ಶಾಲಾ ಉಡುಪು ಧರಿಸಿದನು.\nC. ಬೆಳಿಗ್ಗೆ ಬೇಗ ಎದ್ದನು.\nD. ಶಾಲೆಗೆ ಹೊರಟನು.", q: "ಸರಿಯಾದ ಸಮಯದ ಸಾಲು ಯಾವುದು?", opts: ["C -> B -> A -> D", "A -> B -> C -> D", "D -> C -> B -> A", "B -> A -> D -> C"], ans: "C -> B -> A -> D" },
    { p: "A. ಬಟ್ಟೆಯನ್ನು ಒಣಗಿಸಲಾಯಿತು.\nB. ಬಟ್ಟೆಯನ್ನು ಸೋಪಿನಿಂದ ಒಗೆಯಲಾಯಿತು.\nC. ಕೊಳಕಾದ ಬಟ್ಟೆಯನ್ನು ತೆಗೆದುಕೊಂಡರು.\nD. ಒಣಗಿದ ಬಟ್ಟೆಯನ್ನು ಮಡಚಲಾಯಿತು.", q: "ಸರಿಯಾದ ಕ್ರಮ ಬರೆಯಿರಿ:", opts: ["C -> B -> A -> D", "A -> B -> C -> D", "B -> A -> D -> C", "D -> C -> B -> A"], ans: "C -> B -> A -> D" },
    { p: "A. ಪಾತ್ರೆಗೆ ನೀರು ಹಾಕಲಾಯಿತು.\nB. ನೀರು ಕುದಿಯಲು ಆರಂಭಿಸಿತು.\nC. ಸ್ಟವ್ ಹೊತ್ತಿಸಲಾಯಿತು.\nD. ಚಹಾ ಸಿದ್ಧವಾಯಿತು.", q: "ಚಹಾ ಮಾಡುವ ಸರಿಯಾದ ಕ್ರಮ?", opts: ["A -> C -> B -> D", "B -> A -> C -> D", "D -> B -> C -> A", "C -> D -> A -> B"], ans: "A -> C -> B -> D" },
    { p: "A. ಕಾಗೆಗೆ ಬಾಯಾರಿಕೆಯಾಯಿತು.\nB. ಕಾಗೆ ನೀರು ಕುಡಿಯಿತು.\nC. ಗಡಿಗೆಯಲ್ಲಿ ಕಲ್ಲುಗಳನ್ನು ಹಾಕಿತು.\nD. ನೀರು ಮೇಲೆ ಬಂದಿತು.", q: "ಕಾಗೆಯ ಕಥೆಯ ಸರಿಯಾದ ಅನುಕ್ರಮ ಯಾವುದು?", opts: ["A -> C -> D -> B", "B -> C -> A -> D", "D -> A -> B -> C", "C -> D -> B -> A"], ans: "A -> C -> D -> B" },
    { p: "A. ಆಟವಾಡಿ ಮನೆಗೆ ಬಂದರು.\nB. ಕೈ ಕಾಲು ತೊಳೆದುಕೊಂಡರು.\nC. ಸಾಯಂಕಾಲ ಮೈದಾನಕ್ಕೆ ಹೋದರು.\nD. ರೊಟ್ಟಿ ತಿಂದರು.", q: "ಸರಿಯಾದ ಸಾಲು ಯಾವುದು?", opts: ["C -> A -> B -> D", "A -> B -> C -> D", "D -> C -> B -> A", "B -> A -> D -> C"], ans: "C -> A -> B -> D" },
    { p: "A. ಪರೀಕ್ಷೆ ಬರೆದಳು.\nB. ಚೆನ್ನಾಗಿ ಓದಿದಳು.\nC. ಪ್ರಥಮ ಬಹುಮಾನ ಬಂದಿತು.\nD. ಪರೀಕ್ಷೆಯ ಫಲಿತಾಂಶ ಬಂದಿತು.", q: "ಯಶಸ್ಸಿನ ಅನುಕ್ರಮ ಯಾವುದು?", opts: ["B -> A -> D -> C", "A -> B -> C -> D", "C -> D -> A -> B", "D -> A -> B -> C"], ans: "B -> A -> D -> C" }
];
let idx = 0;
function loadQuestion() {
    document.getElementById('q-no').innerText = idx + 1;
    document.getElementById('passage').innerText = data[idx].p + "\n\n" + data[idx].q;
    const optsDiv = document.getElementById('options');
    optsDiv.innerHTML = '';
    data[idx].opts.forEach(o => {
        const btn = document.createElement('button');
        btn.innerText = o;
        btn.onclick = () => {
            if(o === data[idx].ans) alert("ಅತ್ಯುತ್ತಮ ಆಲೋಚನೆ! ಸರಿಯಾಗಿದೆ 👏");
            else alert("ತಪ್ಪು ಕ್ರಮ! ಮತ್ತೆ ನೋಡಿ.");
            idx++; if(idx < data.length) loadQuestion(); else alert("ಆಕ್ಟಿವಿಟಿ ಮುಗಿಯಿತು!");
        };
        optsDiv.appendChild(btn);
    });
}
loadQuestion();
</script>
</body>
</html>
