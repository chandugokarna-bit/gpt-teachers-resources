<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ಆಕ್ಟಿವಿಟಿ 3 - ಪ್ರಶ್ನೆ ಉತ್ತರ ಸಾಹಸ</title>
    <link href="https://fonts.googleapis.com/css2?family=Tiro+Kannada&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #064e3b, #022c22); color: #fff; font-family: 'Poppins', 'Tiro Kannada', serif; padding: 20px; display: flex; justify-content: center; }
        .card { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.2); border-radius: 20px; padding: 25px; max-width: 650px; width: 100%; text-align: center; }
        h2 { color: #4ade80; margin-bottom: 15px; }
        .passage { background: rgba(0,0,0,0.3); padding: 15px; border-left: 4px solid #4ade80; border-radius: 10px; font-size: 1.1rem; text-align: left; margin-bottom: 20px; line-height: 1.6; }
        .options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        button { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 12px; border-radius: 12px; font-size: 1rem; cursor: pointer; }
        button:hover { background: #4ade80; color: #000; font-weight: bold; }
    </style>
</head>
<body>
<div class="card">
    <h2>🕵️‍♂️ ಆಕ್ಟಿವಿಟಿ 3: ಪ್ರಶ್ನೆ-ಉತ್ತರ ಸಾಹಸ</h2>
    <div style="margin-bottom:15px">ಪ್ರಶ್ನೆ: <span id="q-no">1</span>/7</div>
    <div class="passage" id="passage"></div>
    <div class="options" id="options"></div>
</div>
<script>
const data = [
    { p: "ಮೈಸೂರು ಒಂದು ಐತಿಹಾಸಿಕ ನಗರ. ಅಲ್ಲಿ ಸುಂದರವಾದ ಅರಮನೆ ಇದೆ. ದಸರಾ ಹಬ್ಬಕ್ಕೆ ಅಲ್ಲಿ ಆನೆಗಳ ಮೆರವಣಿಗೆ ನಡೆಯುತ್ತದೆ.", q: "ದಸರಾ ಹಬ್ಬದಲ್ಲಿ ಯಾವುದರ ಮೆರವಣಿಗೆ ನಡೆಯುತ್ತದೆ?", opts: ["ಕುದುರೆಗಳ", "ಆನೆಗಳ", "ಒಂಟೆಗಳ", "ರಥಗಳ"], ans: "ಆನೆಗಳ" },
    { p: "ರವಿ ಸಂತೆಗೆ ಹೋಗಿ ಕೆಂಪು ಬಣ್ಣದ ಸೇಬು, ಹಳದಿ ಬಣ್ಣದ ಬಾಳೆಹಣ್ಣು ಮತ್ತು ಹಸಿರು ತರಕಾರಿಗಳನ್ನು ತಂದನು.", q: "ರವಿ ತಂದ ಸೇಬಿನ ಬಣ್ಣ ಯಾವುದು?", opts: ["ಹಳದಿ", "ಕೆಂಪು", "ಹಸಿರು", "ಬಿಳಿ"], ans: "ಕೆಂಪು" },
    { p: "ಕಾಗೆಗೆ ತುಂಬಾ ಬಾಯಾರಿಕೆಯಾಗಿತ್ತು. ಅದು ಗಡಿಗೆಯಲ್ಲಿದ್ದ ನೀರಿಗೆ ಸಣ್ಣ ಕಲ್ಲುಗಳನ್ನು ಹಾಕಿ ನೀರನ್ನು ಮೇಲೆ ತಂದಿತು.", q: "ಕಾಗೆ ಗಡಿಗೆಗೆ ಏನನ್ನು ಹಾಕಿತು?", opts: ["ಎಲೆಗಳನ್ನು", "ಮಣ್ಣನ್ನು", "ಕಲ್ಲುಗಳನ್ನು", "ಮರವನ್ನು"], ans: "ಕಲ್ಲುಗಳನ್ನು" },
    { p: "ಮೀನಾ ತನ್ನ ಹುಟ್ಟುಹಬ್ಬಕ್ಕೆ ಗೆಳೆಯರಿಗೆ ಹೊಸ ಪುಸ್ತಕಗಳನ್ನು ಉಡುಗೊರೆಯಾಗಿ ನೀಡಿದಳು.", q: "ಮೀನಾ ಹುಟ್ಟುಹಬ್ಬಕ್ಕೆ ಏನು ನೀಡಿದಳು?", opts: ["ಸಿಹಿತಿಂಡಿ", "ಆಟಿಕೆಗಳು", "ಪುಸ್ತಕಗಳು", "ಪೆನ್ನುಗಳು"], ans: "ಪುಸ್ತಕಗಳು" },
    { p: "ನಮ್ಮ ದೇಶದ ರಾಷ್ಟ್ರಧ್ವಜದಲ್ಲಿ ಮೂರು ಬಣ್ಣಗಳಿವೆ. ಮೇಲ್ಭಾಗದಲ್ಲಿ ಕೇಸರಿ ಬಣ್ಣವಿದೆ.", q: "ರಾಷ್ಟ್ರಧ್ವಜದ ಮೇಲ್ಭಾಗದಲ್ಲಿ ಯಾವ ಬಣ್ಣವಿದೆ?", opts: ["ಹಸಿರು", "ಬಿಳಿ", "ಕೇಸರಿ", "ನೀಲಿ"], ans: "ಕೇಸರಿ" },
    { p: "ಭಾನುವಾರ ಶಾಲೆಗೆ ರಜೆ ಇರುತ್ತದೆ. ಅಂದು ಮಕ್ಕಳು ಮೈದಾನದಲ್ಲಿ ಕ್ರಿಕೆಟ್ ಆಡುತ್ತಾರೆ.", q: "ಮಕ್ಕಳು ಭಾನುವಾರ ಎಲ್ಲಿ ಆಡುತ್ತಾರೆ?", opts: ["ಶಾಲೆಯಲ್ಲಿ", "ಮನೆಯಲ್ಲಿ", "ಮೈದಾನದಲ್ಲಿ", "ರಸ್ತೆಯಲ್ಲಿ"], ans: "ಮೈದಾನದಲ್ಲಿ" },
    { p: "ಅಜ್ಜಿಯು ಸಾಯಂಕಾಲ ತೋಟದಲ್ಲಿದ್ದ ಹೂವುಗಳಿಗೆ ನೀರು ಹಾಕಿ, ದೇವರಿಗೆ ದೀಪ ಹಚ್ಚಿದರು.", q: "ಅಜ್ಜಿಯು ದೀಪ ಹಚ್ಚಿದ್ದು ಯಾರಿಗೆ?", opts: ["ದೇವರಿಗೆ", "ಮಕ್ಕಳಿಗೆ", "ಹೂವುಗಳಿಗೆ", "ಮನೆಗೆ"], ans: "ದೇವರಿಗೆ" }
];
let idx = 0;
function loadQuestion() {
    document.getElementById('q-no').innerText = idx + 1;
    document.getElementById('passage').innerText = data[idx].p + "\n\n" + data[idx].q;
    const optsDiv = document.getElementById('options');
    optsDiv.innerHTML = '';
    data[idx].opts.forEach(o => {
        const btn = document.createElement('button');
        btn.innerText = o;
        btn.onclick = () => {
            if(o === data[idx].ans) alert("ಸರಿಯಾದ ಉತ್ತರ! 🎉");
            else alert("ತಪ್ಪು ಉತ್ತರ! ❌");
            idx++; if(idx < data.length) loadQuestion(); else alert("ಆಕ್ಟಿವಿಟಿ ಮುಗಿಯಿತು!");
        };
        optsDiv.appendChild(btn);
    });
}
loadQuestion();
</script>
</body>
</html>
