<!DOCTYPE html>

<meta charset="UTF-8">
<title>PPT ಸಂಪನ್ಮೂಲಗಳು</title>

<style>
body{
  font-family: Arial, sans-serif;
  background:#f5f5f5;
  padding:15px;
}
h2{
  background:#2196f3;
  color:#fff;
  padding:10px;
  border-radius:6px;
}
.lesson{
  background:#ffffff;
  margin:8px 0;
  padding:12px;
  border-left:6px solid #4caf50;
  cursor:pointer;
  font-weight:bold;
  border-radius:6px;
}
.section{
  display:none;
  margin-left:20px;
}
.subject{
  background:#e3f2fd;
  margin:6px 0;
  padding:10px;
  border-radius:6px;
  cursor:pointer;
}
.ppt{
  display:block;
  margin:5px 0 5px 20px;
  background:#ede7f6;
  padding:8px 12px;
  border-radius:6px;
  text-decoration:none;
  color:#333;
}
.ppt:hover{
  background:#d1c4e9;
}
</style>

<script>
function toggle(id){
  const el = document.getElementById(id);
  el.style.display = (el.style.display==="block") ? "none" : "block";
}
</script>
</head>
